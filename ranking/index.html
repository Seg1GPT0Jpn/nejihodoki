<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひまつぶし工房ランキング</title>
<meta name="theme-color" content="#1d2a35">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: header, horizontally scrolling tab strip of games, one ranked list. Single dark look matching the hub. */
:root {
  --steel: #1d2a35; --steel-2: #263744; --rail: #3a4f5f; --chalk: #eef2f4; --chalk-dim: #9fb1bd;
  --brass: #f2b33d; --brass-ink: #2b1d05; --gold: #f2b33d; --silver: #c9d3da; --bronze: #d08a52;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--steel); }
body { margin: 0; min-height: 100vh; background: var(--steel); color: var(--chalk); font-family: var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; }
header { display: flex; align-items: center; gap: 10px; }
header a { color: var(--chalk-dim); text-decoration: none; font-weight: 800; font-size: 13px; white-space: nowrap; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .04em; }
h1 span { color: var(--brass); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 1px solid var(--rail); background: var(--steel-2); color: var(--chalk); border-radius: 999px; padding: 7px 12px; font: 800 13px var(--font-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.tabs button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.head h2 { margin: 0; font-size: 17px; }
.head p { margin: 0; font-size: 11.5px; color: var(--chalk-dim); text-align: right; }
.me { background: var(--steel-2); border: 1px solid var(--brass); border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.6; }
.me b { color: var(--brass); }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--steel-2); border: 1px solid var(--rail); border-radius: 12px; padding: 9px 12px; }
li.mine { border-color: var(--brass); }
.rk { font-family: var(--font-display); font-size: 17px; text-align: center; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
li:nth-child(1) .rk { color: var(--gold); } li:nth-child(2) .rk { color: var(--silver); } li:nth-child(3) .rk { color: var(--bronze); }
.nm { font-weight: 800; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm small { display: block; font-weight: 500; font-size: 11px; color: var(--chalk-dim); }
.sc { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
.empty { text-align: center; color: var(--chalk-dim); font-size: 13px; line-height: 1.8; padding: 24px 8px; border: 1px dashed var(--rail); border-radius: 14px; }
.note { font-size: 11.5px; color: var(--chalk-dim); line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header><a href="../">← ゲーム一覧</a><h1>ランキング<span>表</span></h1></header>
  <div class="tabs" role="tablist" id="tabs" aria-label="ゲームを選ぶ"></div>
  <div class="me" id="me" hidden></div>
  <div class="head"><h2 id="title">総合</h2><p id="sub"></p></div>
  <ol id="list"></ol>
  <div class="empty" id="empty">読み込み中…</div>
  <p class="note">総合は、ゲームごとの順位を点数にして合計したものです（各ゲームで1位＝100点、参加人数に応じて下がる）。ランキングに載るには、トップページでGoogleログインしてニックネームを登録してください。</p>
</div>
<script src="../firebase-config.js"></script>
<script src="../common/cloud.js"></script>
<script>
(() => {
  const GAMES = [
    { id: 'total', name: '総合', unit: '点' },
    { id: 'neji', name: 'ネジほどき', fmt: v => 'LEVEL ' + v + ' クリア' },
    { id: 'blocks', name: 'ブロックはめ', unit: '点' },
    { id: 'drop', name: 'おちものタワー', unit: '点' },
    { id: 'raft', name: 'いかだ暮らし', unit: '日生存' },
    { id: 'gates', name: 'ゲートランナー', fmt: v => 'STAGE ' + v },
    { id: 'n59049', name: '59049', unit: '点' },
    { id: 'water', name: 'いろみず分け', fmt: v => v + ' ステージ' },
    { id: 'parking', name: 'くるま出し', fmt: v => v + ' ステージ' },
    { id: 'hole', name: 'あなぼこシティ', unit: '点' },
  ];
  const $ = id => document.getElementById(id);
  let rows = [], cur = 'total';
  try { const h = location.hash.slice(1); if (GAMES.some(g => g.id === h)) cur = h; } catch (e) {}
  const fmt = (g, v) => g.fmt ? g.fmt(v) : Number(v).toLocaleString() + (g.unit || '');

  function ranked(id) {
    if (id !== 'total') return rows.filter(r => r.scores && r.scores[id] > 0).map(r => ({ ...r, v: r.scores[id] })).sort((a, b) => b.v - a.v || (a.updatedAt || 0) - (b.updatedAt || 0));
    const pts = new Map(), games = new Map();
    for (const g of GAMES.slice(1)) {
      const list = ranked(g.id), n = list.length;
      list.forEach((r, i) => {
        // 1st = 100, last of n ≈ 100/n; ties share the better rank
        let rank = i; while (rank > 0 && list[rank - 1].v === r.v) rank--;
        const p = Math.round(100 * (n - rank) / n);
        pts.set(r.uid, (pts.get(r.uid) || 0) + p); games.set(r.uid, (games.get(r.uid) || 0) + 1);
      });
    }
    return rows.filter(r => pts.has(r.uid)).map(r => ({ ...r, v: pts.get(r.uid), games: games.get(r.uid) })).sort((a, b) => b.v - a.v);
  }
  function draw() {
    const g = GAMES.find(x => x.id === cur);
    [...$('tabs').children].forEach(b => b.setAttribute('aria-selected', b.dataset.id === cur ? 'true' : 'false'));
    $('title').textContent = g.name;
    const list = ranked(cur), me = KoboCloud.me();
    $('sub').textContent = list.length ? list.length + ' 人が参加' : '';
    $('list').innerHTML = '';
    list.slice(0, 100).forEach((r, i) => {
      const li = document.createElement('li'); if (r.uid === me) li.className = 'mine';
      const rk = document.createElement('div'); rk.className = 'rk'; rk.textContent = i + 1;
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.name || '名無し';
      if (cur === 'total') { const sm = document.createElement('small'); sm.textContent = r.games + ' 本のゲームに記録'; nm.appendChild(sm); }
      const sc = document.createElement('div'); sc.className = 'sc'; sc.textContent = fmt(g, r.v);
      li.append(rk, nm, sc); $('list').appendChild(li);
    });
    $('empty').hidden = list.length > 0;
    if (!list.length) $('empty').textContent = 'まだ記録がありません。最初の1人になろう。';
    const mine = list.findIndex(r => r.uid === me);
    if (me) {
      $('me').hidden = false;
      const nick = KoboCloud.nickname();
      $('me').innerHTML = '';
      if (!nick) $('me').textContent = 'ニックネームが未登録です。トップページのログイン欄で登録すると、ランキングに載ります。';
      else if (mine < 0) $('me').textContent = nick + ' さんの記録は、このゲームではまだありません。';
      else { $('me').append(nick + ' さんは '); const b = document.createElement('b'); b.textContent = (mine + 1) + ' 位'; $('me').append(b, '（' + fmt(g, list[mine].v) + '）'); }
    } else $('me').hidden = true;
  }
  for (const g of GAMES) {
    const b = document.createElement('button'); b.type = 'button'; b.role = 'tab'; b.dataset.id = g.id; b.textContent = g.name;
    b.onclick = () => { cur = g.id; try { history.replaceState(null, '', '#' + g.id); } catch (e) {} draw(); };
    $('tabs').appendChild(b);
  }
  async function load() {
    try { rows = await KoboCloud.loadRanks(); draw(); }
    catch (e) {
      $('empty').hidden = false;
      $('empty').textContent = e.code === 'permission-denied' ? 'ランキングは準備中です（管理者の設定待ち）。' : 'ランキングを読み込めませんでした。通信状態を確認してください。';
    }
  }
  KoboCloud.onChange(() => { if (rows.length) draw(); });
  KoboCloud.sync({});
  load();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
})();
</script>
</body>
</html>
