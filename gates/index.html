<style>
:root {
  --ink: #16202e;
  --ink-2: #223047;
  --line: #3a4d68;
  --chalk: #f3f6fa;
  --dim: #a9b8cc;
  --sun: #ffcf33;
  --sun-ink: #2d2100;
  --good: #2fcf6f;
  --bad: #ff4d4d;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--ink); color: var(--chalk); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overflow: hidden; touch-action: none; overscroll-behavior: none;
}
#app {
  height: 100%; display: flex; flex-direction: column; box-sizing: border-box; max-width: 560px; margin: 0 auto;
  padding: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  gap: 6px;
}
header { display: flex; align-items: center; gap: 8px; flex: none; height: 36px; }
.back { color: var(--dim); text-decoration: none; font-weight: 800; font-size: 13px; white-space: nowrap; padding: 6px 2px; }

  color: var(--chalk); font: 800 15px var(--font-body); cursor: pointer; display: grid; place-items: center; padding: 0; flex: none;
}
.icon-btn.off { color: var(--dim); text-decoration: line-through; }

  font-family: var(--font-display); font-size: 14px; background: rgba(22,32,46,.75); border-radius: 999px;
  padding: 7px 12px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.coin-ico { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3a8, #ffc21a 55%, #c98a00); box-shadow: inset 0 0 0 1.5px #a86f00; display: inline-block; flex: none; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(14,20,32,.62); padding: 18px; box-sizing: border-box; text-align: center; gap: 12px;
}
.screen h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 30px; line-height: 1.15; text-shadow: 0 3px 0 #0008; }
.screen h2 em { font-style: normal; color: var(--sun); }
.big-logo { font-family: var(--font-display); font-size: 44px; line-height: 1.05; text-shadow: 0 4px 0 #0009; }
.big-logo span { color: var(--sun); display: block; }

  border: 0; border-radius: 14px; padding: 13px 18px; font: 800 17px var(--font-body); cursor: pointer;
  background: var(--sun); color: var(--sun-ink); width: 100%; max-width: 330px; box-shadow: 0 4px 0 #a07a00;
}

<body>
<div id="app">
  <header>
    <a class="back" href="../">← ゲーム一覧</a>
    <div class="logo">ゲート<span>ランナー</span></div>
    <button id="sndBtn" class="icon-btn" aria-label="サウンド切り替え">♪</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud" hidden>
      <div class="chip" id="hudStage">STAGE 1</div>
      <div class="chip"><i class="coin-ico"></i><span id="hudCoins">0</span></div>
      <button class="icon-btn" id="pauseBtn" aria-label="一時停止">Ⅱ</button>
    </div>

    <section class="screen" id="scrTitle">
      <div class="big-logo">ゲート<span>ランナー</span></div>
      <p class="tagline">ゲートを選んで仲間を増やし、<br>群れとボスを撃ち倒せ！</p>
      <div class="card stats">
        <div>ステージ<b id="tStage">1</b></div>
        <div>最高<b id="tBest">1</b></div>
        <div>コイン<b id="tCoins">0</b></div>
      </div>
      <button class="btn" id="btnStart">スタート</button>
      <button class="btn sub" id="btnUpg">強化する</button>
      <p class="howto">左右にドラッグで移動（PCは ← → / A D）<br>部隊は自動で撃つ。弱いゲートも撃てば数字が上がる！</p>
    </section>

    <section class="screen" id="scrUpg" hidden>
      <h2>強化</h2>
      <div class="coins-line"><i class="coin-ico"></i><span id="uCoins">0</span></div>
      <div class="card" id="upRows"></div>
      <div class="row2">
        <button class="btn sub" id="btnUpgBack">もどる</button>
        <button class="btn" id="btnUpgStart">スタート</button>
      </div>
    </section>

    <section class="screen" id="scrPause" hidden>
      <h2>一時停止</h2>
      <button class="btn" id="btnResume">つづける</button>
      <button class="btn sub" id="btnQuit">タイトルへ</button>
    </section>

    <section class="screen" id="scrClear" hidden>
      <h2><em id="cStage">STAGE 1</em><br>クリア！</h2>
      <div class="card" id="cList"></div>
      <button class="btn" id="btnNext">次のステージへ</button>
      <button class="btn sub" id="btnClearUpg">強化する</button>
    </section>

    <section class="screen" id="scrFail" hidden>
      <h2>全滅…</h2>
      <div class="card" id="fInfo"></div>
      <button class="btn" id="btnRetry">リトライ</button>
      <button class="btn sub" id="btnFailUpg">強化する</button>
    </section>
  </main>
</div>
<script>
(() => {
'use strict';
const SAVE_KEY = 'kusoge.gates.save', SND_KEY = 'kusoge.sound';
const DEBUG = /[?&]debug(?:[=&]|$)/.test(location.search);
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.random;

/* ---------------- save ---------------- */
const UPG = [
  { id: 'men', name: '初期人数', desc: 'スタート時の仲間 +2', base: 20, mul: 1.42, max: 40 },
  { id: 'rate', name: '連射', desc: '発射速度 +15%', base: 25, mul: 1.5, max: 25 },
  { id: 'atk', name: '攻撃力', desc: '弾のダメージ +25%', base: 30, mul: 1.5, max: 30 },
  { id: 'spread', name: '弾の広がり', desc: '拡散弾が出やすく・広く', base: 35, mul: 1.7, max: 6 },
];
const save = { stage: 1, coins: 0, best: 1, up: { men: 0, rate: 0, atk: 0, spread: 0 } };
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') {
      save.stage = Math.max(1, s.stage | 0 || 1);
      save.coins = Math.max(0, s.coins | 0);
      save.best = Math.max(save.stage, s.best | 0);
      if (s.up) for (const u of UPG) save.up[u.id] = clamp(s.up[u.id] | 0, 0, u.max);
    }
  } catch (e) {}
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const upCost = u => Math.round(u.base * Math.pow(u.mul, save.up[u.id]));
loadSave();

/* ---------------- sound ---------------- */
let soundOn = true;
try { soundOn = localStorage.getItem(SND_KEY) !== '0'; } catch (e) {}
let actx = null, noiseBuf = null, master = null;
function ensureAudio() {
  if (!soundOn) return;
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(f, dur, type, vol, f2, delay) {
  if (!soundOn || !actx || actx.state !== 'running') return;
  try {
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, freq) {
  if (!soundOn || !actx || actx.state !== 'running') return;
  try {
    const t = actx.currentTime;
    const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 900;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
  } catch (e) {}
}
let lastShotSnd = 0, lastHitSnd = 0, lastVib = 0;
const sfx = {
  shot() { const n = performance.now(); if (n - lastShotSnd < 80) return; lastShotSnd = n; tone(900 + rnd() * 200, 0.04, 'square', 0.025, 500); },
  hit() { const n = performance.now(); if (n - lastHitSnd < 60) return; lastHitSnd = n; tone(220, 0.06, 'triangle', 0.06, 110); },
  good() { tone(660, 0.09, 'square', 0.07); tone(880, 0.09, 'square', 0.07, 0, 0.08); tone(1320, 0.14, 'square', 0.06, 0, 0.16); },
  bad() { tone(300, 0.18, 'sawtooth', 0.07, 120); },
  boom() { noise(0.45, 0.35, 700); tone(120, 0.3, 'sine', 0.2, 40); },
  power() { tone(520, 0.08, 'square', 0.07); tone(780, 0.08, 'square', 0.07, 0, 0.07); tone(1040, 0.2, 'triangle', 0.08, 0, 0.14); },
  lose() { tone(180, 0.1, 'square', 0.05, 90); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.07, 0, i * 0.12)); },
  fail() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, 0, i * 0.16)); },
  boss() { tone(90, 0.6, 'sawtooth', 0.12, 60); noise(0.5, 0.15, 300); },
  click() { tone(700, 0.05, 'square', 0.05); },
};
function vibrate(ms) {
  const n = performance.now(); if (n - lastVib < 180) return; lastVib = n;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}
function syncSndBtn() { const b = $('sndBtn'); b.classList.toggle('off', !soundOn); b.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); }
$('sndBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  syncSndBtn(); if (soundOn) { ensureAudio(); sfx.click(); }
});
syncSndBtn();
addEventListener('pointerdown', ensureAudio, { passive: true });
addEventListener('keydown', ensureAudio);

/* ---------------- projection ---------------- */
const CAMD = 13, CAMH = 8, ROADW = 5, FAR = 92, NEAR = -4.6;
let W = 0, H = 0, DPR = 1, CX = 0, HY = 0, FX = 0, FY = 0;
let _x = 0, _y = 0, _s = 0;
function proj(x, dz) {
  const d = dz + CAMD;
  if (d < 0.6) return false;
  _s = FX / d; _x = CX + x * _s; _y = HY + CAMH * FY / d;
  return true;
}
const bg = document.createElement('canvas');
let hazeGrad = null;
function resize() {
  const r = $('stage').getBoundingClientRect();
  W = Math.max(200, r.width); H = Math.max(300, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  CX = W / 2; HY = H * 0.19;
  FY = (H * 0.79 - HY) * CAMD / CAMH;
  FX = Math.min(W, H * 0.62) * 0.94 * CAMD / (ROADW * 2);
  buildBg();
}
function buildBg() {
  const bw = Math.ceil(W * DPR), bh = Math.ceil((HY + 2) * DPR);
  bg.width = bw; bg.height = bh;
  const b = bg.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = b.createLinearGradient(0, 0, 0, HY);
  g.addColorStop(0, '#5ec2ff'); g.addColorStop(1, '#c9efff');
  b.fillStyle = g; b.fillRect(0, 0, W, HY + 2);
  b.fillStyle = '#fff6c2'; b.beginPath(); b.arc(W * 0.8, HY * 0.38, HY * 0.16, 0, 7); b.fill();
  // distant city (fixed pseudo-random)
  let seed = 7; const pr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  b.fillStyle = '#9fc6e6';
  for (let x = -10; x < W + 10;) { const w = 14 + pr() * 26, h = HY * (0.25 + pr() * 0.45); b.fillRect(x, HY + 1 - h, w, h); x += w + 2; }
  b.fillStyle = '#7fa9cf';
  for (let x = -6; x < W + 10;) { const w = 10 + pr() * 20, h = HY * (0.12 + pr() * 0.28); b.fillRect(x, HY + 1 - h, w, h); x += w + 6 + pr() * 10; }
  hazeGrad = ctx.createLinearGradient(0, HY, 0, HY + H * 0.12);
  hazeGrad.addColorStop(0, 'rgba(220,245,255,0.85)'); hazeGrad.addColorStop(1, 'rgba(220,245,255,0)');
}

/* ---------------- squad formation ---------------- */
const MAXDRAW = 120, SP = 0.235, COMP = 0.55;
const OX = new Float32Array(MAXDRAW), OZ = new Float32Array(MAXDRAW), ORDER = new Int16Array(MAXDRAW);
const SX = new Float32Array(MAXDRAW), SY = new Float32Array(MAXDRAW), SS = new Float32Array(MAXDRAW);
for (let i = 0; i < MAXDRAW; i++) {
  const r = SP * Math.sqrt(i + 0.3), a = i * 2.39996;
  OX[i] = r * Math.cos(a); OZ[i] = r * Math.sin(a) * COMP; ORDER[i] = i;
}
Array.prototype.sort.call(ORDER, (a, b) => OZ[b] - OZ[a]);
const squadRad = n => SP * Math.sqrt(Math.min(Math.max(n, 1), MAXDRAW)) + 0.25;

/* ---------------- pools ---------------- */
const T_Z = 1, T_BAR = 2, T_WALL = 3, T_CRATE = 4, T_GATE = 5, T_BOSS = 6;
const ENT_N = 240, ents = [], drawList = new Array(ENT_N), hitList = new Array(ENT_N);
let drawN = 0, hitN = 0;
for (let i = 0; i < ENT_N; i++) ents.push({ on: false, t: 0, x: 0, z: 0, w: 0, hp: 0, max: 0, vz: 0, fl: 0, op: '+', val: 0, prog: 0, k: 1, shoot: false, mate: null, label: '', sz: 1, dmg: 1, coin: 0, ph: 0, kind: 0 });
function newEnt(t) {
  for (let i = 0; i < ENT_N; i++) {
    const e = ents[i];
    if (!e.on) { e.on = true; e.t = t; e.fl = 0; e.vz = 0; e.mate = null; e.shoot = false; e.sz = 1; e.dmg = 1; e.coin = 0; e.ph = rnd() * 6.28; e.prog = 0; e.kind = 0; e.hp = e.max = 1; return e; }
  }
  return null;
}
const BN = 480, BS = 40;
const BX = new Float32Array(BN), BZ = new Float32Array(BN), BPZ = new Float32Array(BN), BVX = new Float32Array(BN), BL = new Float32Array(BN), BD = new Float32Array(BN), BON = new Uint8Array(BN);
let bCur = 0;
function spawnBullet(x, z, vx, dmg) {
  for (let k = 0; k < BN; k++) {
    const i = (bCur + k) % BN;
    if (!BON[i]) { BON[i] = 1; BX[i] = x; BZ[i] = BPZ[i] = z; BVX[i] = vx; BL[i] = 1.25; BD[i] = dmg; bCur = i + 1; return; }
  }
}
const PN = 500, PCOL = ['#ff4d4d', '#7cd65c', '#ffcf33', '#ff8a1f', '#8a5a2b', '#ffffff', '#3f86ff', '#9aa3ad', '#b45cff'];
const PX = new Float32Array(PN), PZ = new Float32Array(PN), PY = new Float32Array(PN), PVX = new Float32Array(PN), PVZ = new Float32Array(PN), PVY = new Float32Array(PN), PL = new Float32Array(PN), PS = new Float32Array(PN), PC = new Uint8Array(PN), PON = new Uint8Array(PN);
let pCur = 0;
function burst(x, z, y, cnt, col, spd, size) {
  for (let c = 0; c < cnt; c++) {
    let i = -1;
    for (let k = 0; k < PN; k++) { const j = (pCur + k) % PN; if (!PON[j]) { i = j; break; } }
    if (i < 0) return;
    pCur = i + 1; PON[i] = 1;
    const a = rnd() * 6.283, s = spd * (0.3 + rnd() * 0.7);
    PX[i] = x; PZ[i] = z; PY[i] = y; PVX[i] = Math.cos(a) * s; PVZ[i] = Math.sin(a) * s; PVY[i] = 2 + rnd() * spd * 0.9;
    PL[i] = 0.5 + rnd() * 0.5; PS[i] = (size || 0.14) * (0.6 + rnd() * 0.8); PC[i] = col;
  }
}
const FL_N = 24, floaters = [];
for (let i = 0; i < FL_N; i++) floaters.push({ on: false, x: 0, y: 0, life: 0, text: '', col: '#fff', size: 30 });
function floatText(text, x, y, col, size) {
  let f = floaters[0];
  for (let i = 0; i < FL_N; i++) { if (!floaters[i].on) { f = floaters[i]; break; } if (floaters[i].life < f.life) f = floaters[i]; }
  f.on = true; f.text = text; f.x = x; f.y = y; f.col = col; f.size = size || 30; f.life = 1;
}

/* ---------------- run state ---------------- */
const R = {
  stage: 1, n: 0, px: 0, tpx: 0, dist: 0, speed: 0, L: 500, phase: 'road', t: 0, fireAcc: 0, coins: 0, kills: 0,
  rapid: 0, spread: 0, boss: null, ev: [], evI: 0, endT: 0, shot: 0, stompT: 0, minionT: 0, shake: 0,
  flash: 0, flashC: '#fff', bump: 0, god: false, noSpawn: false, noBoss: false, peak: 0,
};
let mode = 'title', timeScale = 1;
let keyL = false, keyR = false;

});
function pause() { if (mode !== 'run') return; mode = 'paused'; keyL = keyR = false; dragging = false; show('scrPause'); }
function resume() { if (mode !== 'paused') return; mode = 'run'; show(null); }
$('btnStart').addEventListener('click', () => { sfx.click(); startRun(); });
$('btnUpg').addEventListener('click', () => { sfx.click(); toUpg(); });
$('btnUpgBack').addEventListener('click', () => { sfx.click(); toTitle(); });
$('btnUpgStart').addEventListener('click', () => { sfx.click(); startRun(); });
$('pauseBtn').addEventListener('click', () => { sfx.click(); pause(); });
$('btnResume').addEventListener('click', () => { sfx.click(); resume(); });
$('btnQuit').addEventListener('click', () => { sfx.click(); save.coins += R.coins; R.coins = 0; writeSave(); toTitle(); });
$('btnNext').addEventListener('click', () => { sfx.click(); startRun(); });
$('btnClearUpg').addEventListener('click', () => { sfx.click(); toUpg(); });
$('btnRetry').addEventListener('click', () => { sfx.click(); startRun(); });
$('btnFailUpg').addEventListener('click', () => { sfx.click(); toUpg(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', () => { keyL = keyR = false; });

/* ---------------- input ---------------- */
let dragging = false, dragId = -1, dragX0 = 0, dragP0 = 0;
cv.addEventListener('pointerdown', e => {
  if (mode !== 'run') return;
  dragging = true; dragId = e.pointerId; dragX0 = e.clientX; dragP0 = R.tpx;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== dragId || mode !== 'run') return;
  const ppu = FX / CAMD;
  R.tpx = dragP0 + (e.clientX - dragX0) / ppu * 1.15;
  const lim = Math.max(0.6, 4.9 - squadRad(R.n));
  if (R.tpx > lim) { dragP0 -= R.tpx - lim; R.tpx = lim; }
  else if (R.tpx < -lim) { dragP0 += -lim - R.tpx; R.tpx = -lim; }
  e.preventDefault();
});
const endDrag = e => { if (e.pointerId === dragId) dragging = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keyL = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keyR = true; e.preventDefault(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { if (mode === 'run') pause(); else if (mode === 'paused') resume(); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keyL = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keyR = false;
});

/* ---------------- loop ---------------- */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  if (mode === 'paused') return;
  if (mode === 'run') {
    let rem = dt * timeScale;
    while (rem > 1e-6 && mode === 'run') { const st = Math.min(rem, 0.02); update(st); rem -= st; }
  } else if (mode === 'title' || mode === 'upg') demoUpdate(dt);
  else updParticles(dt);
  render();
  syncHud();
}
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
resize();
toTitle();
requestAnimationFrame(frame);

/* ---------------- debug hooks (?debug) ---------------- */
if (DEBUG) {
  window.__gates = {
    state() {
      const gates = [];
      for (const e of ents) if (e.on && e.t === T_GATE) gates.push({ x: e.x, dz: e.z - R.dist, op: e.op, val: e.val, shoot: e.shoot, label: e.label });
      let zombies = 0; for (const e of ents) if (e.on && e.t === T_Z) zombies++;
      return { mode, phase: R.phase, n: R.n, px: R.px, tpx: R.tpx, dist: R.dist, L: R.L, stage: R.stage, coins: R.coins, save: JSON.parse(JSON.stringify(save)),
        bossHp: R.boss && R.boss.on ? R.boss.hp : null, gates, zombies };
    },
    setN(n) { R.n = n; R.peak = Math.max(R.peak, n); },
    setTimeScale(s) { timeScale = s; },
    god(b) { R.god = !!b; },
    freeze() { for (const e of ents) if (e.t !== T_BOSS) e.on = false; R.noSpawn = true; R.noBoss = true; },
    unfreeze() { R.noSpawn = false; R.noBoss = false; },
    spawnGate(l, r, dz) { const a = mkGate(-2.55, R.dist + dz, G(l[0], l[1], l[2]), R.stage), b = mkGate(2.55, R.dist + dz, G(r[0], r[1], r[2]), R.stage); if (a && b) { a.mate = b; b.mate = a; } },
    spawnZombies(cnt, dz, hp) { for (let i = 0; i < cnt; i++) mkZombie(-4 + (i % 9), R.dist + dz + (i / 9 | 0), hp || 1, 0); },
    toBoss() { for (const e of ents) e.on = false; R.noSpawn = true; R.noBoss = false; R.dist = Math.max(R.dist, R.L); },
    addCoins(c) { save.coins += c; writeSave(); },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
