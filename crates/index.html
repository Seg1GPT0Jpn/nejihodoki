<style>
/* はこはこ運送: a warm warehouse chrome. --kb-* are the shared tokens re-tinted; --cr-* are this game's own. */
:root, :root[data-kb-theme="dark"] {

    --cr-good: #2c8a52; --cr-bad: #c2412a; --cr-star: #d08a00; --cr-star-off: #cdbf9f; --cr-key: #efe3cb; --cr-key-shadow: #cdbf9f; --cr-title: linear-gradient(90deg, #9a6200, #c27a00 50%, #c2501a);

:root[data-kb-theme="light"] {
  --kb-bg: #f1e9da; --kb-surface: #fffaf0; --kb-surface-2: #eadfca; --kb-sunken: #e0d3b8; --kb-line: #cdbf9f;
  --kb-ink: #2b2418; --kb-dim: #6a5f48;
  --kb-accent: #c27a00; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5600; --kb-accent-soft: rgba(194, 122, 0, .12);

  --cr-good: #2c8a52; --cr-bad: #c2412a; --cr-star: #d08a00; --cr-star-off: #cdbf9f; --cr-key: #efe3cb; --cr-key-shadow: #cdbf9f; --cr-title: linear-gradient(90deg, #9a6200, #c27a00 50%, #c2501a);

html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

.act svg { width: 18px; height: 18px; flex: none; }
.act:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--cr-key-shadow); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }

#dpad .u { grid-area: 1 / 2; } #dpad .l { grid-area: 2 / 1; } #dpad .r { grid-area: 2 / 3; } #dpad .d { grid-area: 3 / 2; }

#rp { flex: none; padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
#rp .rpb { display: flex; gap: 6px; justify-content: center; }
#rp .act { flex: 1 1 0; max-width: 90px; } #rpRange { width: 100%; accent-color: var(--kb-accent); height: 28px; }
#rpInfo { text-align: center; font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
@media (orientation: landscape) and (max-height: 520px) {
  #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(224px, 250px); grid-template-rows: auto auto auto 1fr; grid-template-areas: "hd hd" "st hu" "st sa" "st ct"; column-gap: 8px; }
  header { grid-area: hd; padding-top: 0; }
  #hud { grid-area: hu; flex-wrap: wrap; padding: 2px 8px 2px 0; } .chip { min-height: 32px; padding: 1px 8px; } .chip b { font-size: 14px; } .chip.lv { flex: 1 1 100%; }
  #stage { grid-area: st; padding: 2px 4px; } #status { grid-area: sa; margin: 0 8px 0 0; min-height: 28px; padding: 2px 8px; font-size: 12px; }
  #ctl { grid-area: ct; padding: 4px 8px 4px 0; align-items: flex-start; } #rp { grid-area: ct; padding: 4px 8px 4px 0; }
  #acts { flex: none; grid-template-columns: repeat(2, 44px); gap: 4px; align-content: start; } .act { min-height: 44px; font-size: 13px; padding: 2px; } .act span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .act svg { width: 20px; height: 20px; } #bHint::after { content: attr(data-n); font-weight: 800; }
  #rp .act span { position: static; width: auto; height: auto; clip: auto; } #dpad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; }
  #rp .act { min-height: 40px; }
}
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s ease-out; }
.panel { width: 100%; max-width: 460px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cr-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s ease-out; }

.panel h2 { margin: 0 0 2px; font: 400 22px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--cr-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 26px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--cr-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--cr-go-shadow); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--cr-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--cr-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }
.qm:first-child { margin-top: 0; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.qm.plain { border-color: var(--kb-line); background: var(--cr-panel); }
.og { margin: 8px 0 0; text-align: left; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--cr-panel); border: 1px solid var(--kb-line); flex-wrap: wrap; }
.opt { flex: 1 1 0; min-width: 40px; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.fld { display: flex; gap: 6px; } .fld input { flex: 1 1 auto; min-width: 0; min-height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 15px var(--kb-font-body); padding: 4px 10px; user-select: text; -webkit-user-select: text; }
.fld .btn { width: auto; margin-top: 0; flex: none; min-width: 52px; }
.err { color: var(--cr-bad); font-size: 12px; font-weight: 800; min-height: 16px; margin: 4px 0 0; }
.stars { display: flex; gap: 6px; justify-content: center; margin: 4px 0; }

.big { font: 400 30px var(--kb-font-display); line-height: 1.15; color: var(--kb-ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 6px 6px; text-align: left; font-size: 13px; font-weight: 800; }
.kv span:nth-child(odd) { color: var(--kb-dim); font-weight: 500; } .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.pk { margin: 8px 0 12px; text-align: left; }
.pk .ph { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 4px; flex-wrap: wrap; }
.pk .ph b { font: 400 16px var(--kb-font-display); color: var(--kb-accent-text); } .pk .ph small { color: var(--kb-dim); font-size: 11.5px; }

.pk .pd { margin: 0 2px 6px; font-size: 11.5px; color: var(--kb-dim); line-height: 1.4; }
.pk.lock { opacity: .62; }
.nodes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border-radius: 16px; background: var(--cr-panel); border: 1px solid var(--kb-line); position: relative; }
.nd { position: relative; min-width: 0; min-height: 54px; padding: 4px 0 2px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--cr-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--cr-key-shadow); font: 800 16px var(--kb-font-body); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.nd:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--cr-key-shadow); }
.nd.done { border-color: var(--cr-good); } .nd.cur { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent), 0 3px 0 var(--cr-key-shadow); }

.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.code { font: 800 16px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; padding: 6px 10px; border-radius: 10px; background: var(--cr-panel); border: 1px dashed var(--kb-line); user-select: all; -webkit-user-select: all; word-break: break-all; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#editor { position: fixed; inset: 0; z-index: 70; background: var(--kb-bg); display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
@keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }

<div id="app">
  <header>
    <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 data-i18n>はこはこ運送</h1>
    <button class="icon" id="sndBtn" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="hud">
    <span class="chip lv"><span id="lLevel" data-i18n>ステージ</span><b id="vLevel">-</b></span>
    <span class="chip"><span id="lMoves" data-i18n>歩数</span><b id="vMoves">0</b></span>
    <span class="chip"><span id="lPushes" data-i18n>押した数</span><b id="vPushes">0</b></span>
    <span class="chip"><span id="lBest" data-i18n>ベスト</span><b id="vBest">-</b></span>
  </div>
  <div id="stage"><canvas id="board" tabindex="0" role="application" aria-label="倉庫の盤" data-i18n-attr="aria-label"></canvas></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="ctl">
