<style>

:root, :root[data-kb-theme="dark"] {

    --fs-good: #1f7a46; --fs-bad: #b83a26; --fs-star: #d08a00; --fs-star-off: #b8cdda; --fs-key: #e1f0f8; --fs-key-shadow: #9cc3d8; --fs-title: linear-gradient(90deg, #0f6b82, #1b93b0 55%, #b36a00);

  --kb-ink: #12293a; --kb-dim: #476478;

  --fs-good: #1f7a46; --fs-bad: #b83a26; --fs-star: #d08a00; --fs-star-off: #b8cdda; --fs-key: #e1f0f8; --fs-key-shadow: #9cc3d8; --fs-title: linear-gradient(90deg, #0f6b82, #1b93b0 55%, #b36a00);

}

@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }

#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); max-width: 760px; margin: 0 auto; }

#power { position: absolute; right: 8px; bottom: 8px; width: 12px; height: 46%; max-height: 120px; border-radius: 7px; background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 255, 255, .4); display: none; pointer-events: none; }
body.aiming #power { display: block; } #power i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #5ee08a, #ffe066, #ff6a4a); border-radius: 6px; }
#status { flex: none; min-height: 34px; box-sizing: border-box; padding: 4px 12px; margin: 2px 8px 0; border-radius: 12px; font-size: 12px; font-weight: 800; line-height: 1.3; text-align: center; color: var(--kb-ink); background: var(--fs-panel); border: 1px solid var(--kb-line); display: flex; align-items: center; justify-content: center; }
#status.warn { border-color: var(--fs-bad); color: var(--fs-bad); } #status.good { border-color: var(--fs-good); }
#ctl { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
#act { min-height: 52px; border-radius: 16px; border: 0; cursor: pointer; background: var(--fs-go); color: var(--kb-accent-ink); font: 800 17px var(--kb-font-body); box-shadow: 0 4px 0 var(--fs-go-shadow); touch-action: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
#act:active, #act.held { transform: translateY(2px); box-shadow: 0 2px 0 var(--fs-go-shadow); }
#nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.nb { min-width: 0; min-height: 46px; box-sizing: border-box; border-radius: 13px; border: 1px solid var(--kb-line); background: var(--fs-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--fs-key-shadow); font: 800 10.5px var(--kb-font-body); cursor: pointer; padding: 2px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; white-space: nowrap; position: relative; }
.nb svg { width: 20px; height: 20px; } .nb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fs-key-shadow); }
.nb .dot { position: absolute; top: 3px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #ff6a4a; border: 1.5px solid var(--kb-surface); }
@media (orientation: landscape) and (max-height: 520px) {
  #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) 296px; grid-template-rows: auto auto auto 1fr; grid-template-areas: "hd hd" "st hu" "st sa" "st ct"; column-gap: 8px; }
  header { grid-area: hd; padding-top: 0; } #hud { grid-area: hu; flex-wrap: wrap; padding: 2px 8px 2px 0; } .chip { min-height: 32px; padding: 1px 7px; } .chip.lv { flex: 1 1 100%; }
  #stage { grid-area: st; margin: 2px 4px 6px 8px; } #status { grid-area: sa; margin: 0 8px 0 0; min-height: 30px; font-size: 11.5px; line-height: 1.25; }
  #ctl { grid-area: ct; padding: 4px 8px 4px 0; } #act { min-height: 48px; }
  .nb { min-height: 44px; } .nb svg { width: 18px; height: 18px; }
}
@media (max-width: 379px) { h1 { font-size: 15px; } .chip { padding: 2px 5px; } .chip b { font-size: 13px; } #nav { gap: 4px; } .nb { font-size: 9.5px; } }
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s ease-out; }
.panel { width: 100%; max-width: 480px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fs-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s ease-out; }
.panel > * { flex: none; } .panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font: 400 21px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--fs-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--fs-go-shadow); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--fs-go-shadow); } .btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--fs-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }
.btn.sm { width: auto; min-width: 64px; min-height: 44px; margin: 0; font-size: 13px; padding: 4px 10px; border-radius: 12px; flex: none; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }

.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.og { margin: 8px 0 0; text-align: left; } .og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 2px 2px; }
.rows { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--fs-key); min-height: 52px; box-sizing: border-box; }
.row .tx { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 800; line-height: 1.3; } .row .tx small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.row.cur { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent); } .row.lock { opacity: .6; }
.prog { height: 8px; border-radius: 5px; background: var(--fs-panel); border: 1px solid var(--kb-line); margin-top: 3px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--kb-accent); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 4px 2px 8px; }
.card { position: relative; min-width: 0; padding: 5px 3px 5px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--fs-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--fs-key-shadow); font: 800 10.5px/1.25 var(--kb-font-body); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }

.card .no { position: absolute; top: 2px; left: 6px; font-size: 9px; color: var(--kb-dim); font-weight: 500; }

<script>
(() => {

const nm = f => (EN ? f.en : f.ja), noteOf = f => (EN ? f.noteEn : f.noteJa), locNm = l => (EN ? E.LOCATIONS[l].en : E.LOCATIONS[l].ja);
const gearNm = it => (EN ? it.en : it.ja);
const fmtCm = cm10 => (cm10 / 10).toFixed(1) + ' cm';
const ICON = {
  book: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/>',
  shop: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  map: '<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
  list: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4M8.5 11h7M8.5 15h5"/>',
  tank: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 13c2-3 5-3 7 0-2 3-5 3-7 0zM14 13l3-2v4z"/>',
};
const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>';

// ---------- save ----------
function readSave() { let o = null; try { o = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) {} return E.sanitize(o); }
let save = readSave();
function writeSave() { E.derive(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const dateKeyNow = () => (PF && PF.jstDateKey ? PF.jstDateKey() : (() => { const d = new Date(Date.now() + 9 * 3600e3); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); })());
const dbg = { env: null, seed: null, force: null, speed: 1 };
const curEnv = () => dbg.env || E.envAt(Date.now(), { clk: save.set.clk, sn: save.set.sn });
const TNAME = ['朝', '昼', '夕', '夜'], TNAME_EN = ['Morning', 'Daytime', 'Evening', 'Night'], WNAME = ['晴れ', 'くもり', '雨'], WNAME_EN = ['Sunny', 'Cloudy', 'Rainy'], SNAME = ['春', '夏', '秋', '冬'], SNAME_EN = ['Spring', 'Summer', 'Autumn', 'Winter'];
const envText = e => L(TNAME[e.t] + '・' + (e.snow ? '雪' : WNAME[e.wx]) + '・' + SNAME[e.season], TNAME_EN[e.t] + ' / ' + (e.snow ? 'Snowy' : WNAME_EN[e.wx]) + ' / ' + SNAME_EN[e.season]);

// ---------- session ----------
const cv = $('scene'), ctx = cv.getContext('2d');
const S = { st: 'idle', loc: save.lc, power: 0.6, aim: 0, hold: 0, castT: 0, castDist: 15, plan: null, tw: 0, f: null, tour: null, last: null, T: 0, bobSink: 0, ripple: 0, rodBend: 0, ov: '', menu: false };
let VW = { w: 300, h: 300, dpr: 1 }, particles = [], held = new Set(), raf = 0, lastT = 0, persistT = 0, ambT = 3, reelT = 0, cueT = 0;
const paused = () => !!S.ov || S.menu || !!$('howto').hidden === false;
const setStatus = (txt, cls) => { const el = $('status'); el.textContent = txt || ''; el.className = cls || ''; $('live').textContent = txt || ''; };
function toast(msg, ms) { const d = document.createElement('div'); d.className = 'toastbar'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 1700); }
function cue(txt) { const c = $('cue'); c.textContent = txt; c.classList.remove('on'); void c.offsetWidth; if (!reduceMotion.matches) c.classList.add('on'); else { c.style.opacity = 1; clearTimeout(cueT); cueT = setTimeout(() => { c.style.opacity = 0; }, 600); } }
const gear = () => E.gearOf(save);
const castMax = () => 40;
function nextSeed() { return dbg.seed != null ? E.hash32('dbg:' + dbg.seed + ':' + save.stats.casts) : (Math.random() * 4294967296) >>> 0; }
function setSt(st) { S.st = st; S.t0 = S.T; document.body.classList.toggle('fighting', st === 'fight' || st === 'net'); document.body.classList.toggle('netting', st === 'net'); document.body.classList.toggle('aiming', !!(st === 'idle' && (held.size > 0 || S.drag))); renderAct(); }
function burst(x, y, n, kind, c) { for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 60; particles.push({ x, y, vx: Math.cos(a) * sp, vy: -Math.abs(Math.sin(a)) * sp * 1.3, life: 0.7, max: 0.7, r: 1.5 + Math.random() * 2, kind: kind || 'drop', c: c || '#dff' }); } }
function ring(x, y, r, life, c) { particles.push({ x, y, vx: 0, vy: 0, life: life || 1, max: life || 1, r: r || 8, kind: 'ring', c: c || 'rgba(255,255,255,.8)' }); }

// ---------- cast / wait / bite / hook ----------
function doCast(power, aim) {

}
function tickBite(dt) {
  S.tw += dt; S.bobSink = 1; const p = S.plan;
  if (S.tw > p.winEnd) { sfx('fail'); setStatus(L('逃げられた… また待とう（えさは減りません）', 'It got away… waiting again (no loss)'), ''); newWait(); }
}
function newWait() { const env = curEnv(); S.plan = E.planBite(nextSeed(), env, S.loc, gear(), { wide: save.set.wide }); S.plan.env = env; S.tw = 0; S.tapIdx = 0; S.bobSink = 0; setSt('wait'); }
function reelBack(msg) { S.plan = null; S.f = null; S.chargeSrc = null; S.hold = 0; setSt('idle'); setStatus(msg || L('投げてみよう。画面を上へはじく／Space ／ボタン', 'Ready to cast: flick the screen up, press Space, or use the button.'), ''); }
function pressAction() {
  if (S.st === 'wait') { const r = E.hookResult(S.plan, S.tw); if (r === 'early') { sfx('error'); reelBack(L('早すぎ！ 巻きもどしました（罰はありません）', 'Too early! Reeled back in (no penalty).')); } return; }

}
function startFight() {
  const p = S.plan, a = save.g.a; /* the fish's identity stays secret until it is landed */
  if (save.g.sl < 0 && save.g.sb > 0 && a[save.g.sb] > 0) { a[save.g.sb]--; if (a[save.g.sb] <= 0) { save.g.sb = 0; toast(L('えさがなくなりました。ねりえに戻します', 'Out of that bait. Back to dough.'), 1800); } }

    else if (e === 'surge') { sfx('hit'); burst(bobPos().x, bobPos().y, 6, 'drop'); }
    else if (e === 'leap') { cue(L('ジャンプ！', 'Jump!')); sfx('pop'); burst(bobPos().x, bobPos().y - 6, 14, 'drop'); }

}
function doNet() { const r = E.netPress(S.f); if (r === 'landed') { onLanded(); } else if (r === 'miss') { setSt('fight'); sfx('fail'); cue(L('おしい！', 'Close!')); setStatus(L('にげられかけた！ もう少し巻こう（なにも失いません）', 'It slipped the net! Reel a little more (nothing is lost).'), 'warn'); } }
function fishEscaped() {
  sfx('fail'); setStatus(L('逃げられました。ざんねん！ また会えるよ（なにも失いません）', 'It got away. Maybe next time! (Nothing is lost.)'), 'warn'); emit('play_end', { reason: 'quit', score: save.zc }); roundDone(); reelBack(null); S.f = null;
}
const rarityStars = r => '<span class="stars">' + '★'.repeat(r) + '<i>' + '★'.repeat(5 - r) + '</i></span>';
function onLanded() {
  const f = S.f, fi = f.fi, cm10 = f.cm10, env = S.plan.env || curEnv(), fish = FISH[fi];
  const r = E.recordCatch(save, fi, cm10, env, S.loc); const hit = E.orderProgress(save, { i: fi, cm10, loc: S.loc, isNew: r.isNew, t: env.t });
  S.last = { fi, cm10, r, env }; if (S.tour) { S.tour.s += cm10; S.tour.n++; }
  sfx(r.isNew ? 'win' : 'clear'); buzz([60, 40, 90]); const L0 = bobPos(); burst(L0.x, L0.y, 24, 'drop'); for (let k = 0; k < 8; k++) particles.push({ x: L0.x + (Math.random() - 0.5) * 60, y: L0.y - Math.random() * 40, vx: 0, vy: -20, life: 1, max: 1, r: 5 + Math.random() * 4, kind: 'spark', c: '#ffe680' });

}
function roundDone() { if (!S.tour) return; S.tour.r++; save.tn.r = S.tour.r; save.tn.s = S.tour.s; if (S.tour.r >= E.TOUR_ROUNDS) setTimeout(finishTour, 400); else toast(L('大会 ' + S.tour.r + '/' + E.TOUR_ROUNDS + '投 終了', 'Tournament: round ' + S.tour.r + ' of ' + E.TOUR_ROUNDS + ' done'), 1200); writeSave(); }

// ---------- positions ----------
function bobPos() {
  const W = VW.w, H = VW.h, st = S.st, base = { hy: S.hy || Math.round(H * 0.38), loc: E.LOCATIONS[S.loc].id }; let far = 0.06, aim = S.aim;
  if (st === 'idle' || st === 'catch') { aim = S.aim * 0.4; far = 0.06; }
  else if (st === 'cast' || st === 'wait' || st === 'bite') far = clamp((S.castDist - 4) / (castMax() - 4), 0, 1);
  else if (st === 'fight') far = clamp(S.f.dist / castMax(), 0, 1); else if (st === 'net') far = 0.04;

  return { x: lay.bx, y: lay.by, s: lay.bs };
}

// ---------- frame ----------
function sim(dt) {
  S.T += dt; if (S.st === 'cast') { S.castT += dt; if (S.castT >= 0.8) landed(); }
  else if (S.st === 'wait') tickWait(dt); else if (S.st === 'bite') tickBite(dt);
  else if (S.st === 'fight') { tickFight(dt); } else if (S.st === 'net') E.netTick(S.f, dt);
  if (S.st === 'idle' && held.size && S.chargeSrc) S.hold += dt;
  S.ripple = Math.max(0, S.ripple - dt); S.rodBend += ((S.st === 'fight' ? 0.5 + (S.f ? S.f.T : 0) * 1.2 : 0) - S.rodBend) * Math.min(1, dt * 8);
  for (const p of particles) { p.life -= dt; if (p.kind === 'drop') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; } else if (p.kind === 'spark') { p.y += p.vy * dt; } else if (p.kind === 'bubble') { p.y -= 20 * dt; } }
  particles = particles.filter(p => p.life > 0);
  ambT -= dt; if (ambT <= 0) { ambient(); ambT = 4 + Math.random() * 6; }
  persistT += dt; if (persistT > 20) { persistNow(); persistT = 0; }
}
function ambient() {
  if (!A || S.ov) return; const id = E.LOCATIONS[S.loc].id, env = curEnv();
  if (id === 'pond') { tone(150, 0.1, { type: 'sine', vol: 0.03 }); tone(170, 0.1, { type: 'sine', vol: 0.03, delay: 0.14 }); } else if (id === 'night') { for (let k = 0; k < 3; k++) tone(3200, 0.04, { type: 'sine', vol: 0.012, delay: k * 0.09 }); }
  else if (id === 'harbour' || id === 'estuary') { tone(660, 0.5, { type: 'sine', vol: 0.02 }); } else if (id === 'deep') { tone(90, 0.9, { type: 'sine', vol: 0.03, slide: 60 }); } else if (id === 'ice') { tone(1800, 0.05, { type: 'triangle', vol: 0.012 }); }

}
function render() {
  const W = VW.w, H = VW.h; if (!W) return; ctx.setTransform(VW.dpr, 0, 0, VW.dpr, 0, 0); const env = curEnv(), T = S.T;
  const sc = { loc: E.LOCATIONS[S.loc].id, env, T, land: W > H * 1.2 }; ART.drawScene(ctx, W, H, sc); S.hy = sc.hy;
  const lay = ART.drawAngler(ctx, W, H, Object.assign({}, sc, { hy: sc.hy, rodBend: S.rodBend }), T); const bp = bobPos();
  const st = S.st, fighting = st === 'fight' || st === 'net'; let bob = bp;
  const line = { loc: sc.loc, env, hy: sc.hy, state: st, tension: fighting ? S.f.T : 0, slack: fighting ? 0.4 : 1, tipPos: lay.tip, bobPos: { x: bp.x, y: bp.y } };
  if (st === 'idle' && (held.size || S.drag)) { const aimv = S.drag ? S.drag.aim : S.aim, pw = S.drag ? S.drag.power : clamp(0.2 + S.hold / 1.1 * 0.8, 0.2, 1); const far = clamp((E.castDistance(pw, save.g.r) - 4) / (castMax() - 4), 0, 1), tl = ART.layout(W, H, { hy: sc.hy, far, aim: aimv, loc: sc.loc }); ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(tl.bx, tl.by, 16 * tl.bs, 5 * tl.bs, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); $('powFill').style.height = Math.round(pw * 100) + '%'; }
  if (st !== 'catch') { const pos = ART.drawLine(ctx, W, H, line, T); void pos; }
  if (fighting) { const f = S.f, fish = FISH[f.fi], big = clamp(0.22 + f.cm10 / 10 / Math.max(10, fish.max) * 0.3, 0.2, 0.5), nearK = 1 - clamp(f.dist / castMax(), 0, 1), w = (34 + 90 * big * (0.3 + nearK * 0.9)) * (st === 'net' ? 1.3 : 1), thr = f.phase === 'surge' ? 1 : 0.25, sx = bp.x + Math.sin(T * (6 + 8 * thr)) * (10 + 18 * thr), sy = bp.y + 12 + Math.sin(T * 9) * 3 * thr;
    ART.drawFish(ctx, fish.art, sx, sy, w, { t: T * (1 + thr * 2), flip: Math.sin(T * 0.9) > 0, alpha: 0.62, sil: undefined, key: fish.key, wag: 0.5 + thr });
    ctx.fillStyle = 'rgba(10,40,70,.25)'; ctx.beginPath(); ctx.ellipse(sx, sy + 6, w * 0.5, w * 0.14, 0, 0, Math.PI * 2); ctx.fill(); }
  if (st !== 'catch' && !fighting) ART.drawBobber(ctx, bp.x, bp.y, bp.s, T, { sink: S.bobSink, ripple: st === 'wait' || st === 'bite' ? 0.5 + Math.sin(T * 2) * 0.2 : 0.3, glow: env.hour < 5.5 || env.hour >= 19.5 });
  else if (fighting) ART.drawBobber(ctx, bp.x, bp.y - 4, bp.s * 0.8, T, { sink: 1, ripple: 1 });
  ART.drawParticles(ctx, particles);
  if (env.wx === 2 && !reduceMotion.matches) { /* ripple dots on the water */ if (Math.random() < 0.3) ring(Math.random() * W, sc.hy + 10 + Math.random() * (H - sc.hy) * 0.7, 3, 0.6, 'rgba(255,255,255,.5)'); }
  // メーター
  if (fighting) { const f = S.f; $('fillT').style.width = Math.min(100, f.T * 100) + '%'; $('fillT').className = f.T > 0.8 ? 'hot' : ''; $('fillS').style.width = Math.round(f.stam * 100) + '%'; $('vDist').textContent = Math.max(0, f.dist - E.NET_AT).toFixed(1) + ' m'; $('vSta').textContent = Math.round(f.stam * 100) + '%';
    if (st === 'net') { const n = f.net; $('netZone').style.left = (n.c - n.zw / 2) * 100 + '%'; $('netZone').style.width = n.zw * 100 + '%'; $('netPos').style.left = n.pos * 100 + '%'; } }
}
function frame(now) {
  raf = requestAnimationFrame(frame); const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  if (!paused()) { const k = dbg.speed; const steps = Math.max(1, Math.ceil(k)); for (let i = 0; i < steps; i++) sim(dt * k / steps); } else if (S.st === 'cast' || S.st === 'wait') { /* frozen while a panel is open */ }

}
function fit() {
  const st = $('stage'), r = st.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); VW = { w: Math.max(40, Math.floor(r.width)), h: Math.max(40, Math.floor(r.height)), dpr };
  cv.width = Math.round(VW.w * dpr); cv.height = Math.round(VW.h * dpr);
}

// ---------- HUD ----------
function renderHud() {
  const env = curEnv(); $('vLoc').textContent = locNm(S.loc); $('vEnv').textContent = envText(env); $('vCoin').textContent = save.coins; $('vZk').textContent = save.zc + '/' + E.N;
  $('lLoc').textContent = L('場所', 'Place'); $('lEnv').textContent = L('いま', 'Now'); $('lCoin').textContent = L('コイン', 'Coins'); $('lZk').textContent = L('ずかん', 'Book');
