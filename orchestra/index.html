<style>
/* 指揮者ゲーム: a velvet-and-gold concert hall around a full-bleed canvas. --kb-* are the shared tokens re-tinted; --or-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1b1015; --kb-surface: #2a1820; --kb-surface-2: #38222b; --kb-sunken: #140a0e; --kb-line: #5a3a44;
  --kb-ink: #f6ecdf; --kb-dim: #cdb8b0;
  --kb-accent: #ffcf6a; --kb-accent-ink: #2a1500; --kb-accent-text: #ffd98a; --kb-accent-soft: rgba(255, 207, 106, .16);
  --kb-scrim: rgba(14, 6, 9, .74); --kb-focus: #9fe3ff;
  --or-panel: rgba(255, 255, 255, .07); --or-line: rgba(255, 255, 255, .2); --or-card: linear-gradient(#37202a, #26151c);
  --or-go: linear-gradient(#ffd86e, #eba02a); --or-go-shadow: #8a5a05; --or-good: #7be0a0; --or-bad: #ff8f80; --or-star: #ffcf6a;
  --or-title: linear-gradient(90deg, #ffe6a5, #ffcf6a 50%, #ff9d7a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f6ecdf; --kb-surface: #ffffff; --kb-surface-2: #efe0cc; --kb-sunken: #e2cfb6; --kb-line: #cdb090;
    --kb-ink: #2c1a14; --kb-dim: #6b5046;
    --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5800; --kb-accent-soft: rgba(184, 120, 10, .12);
    --kb-scrim: rgba(44, 26, 20, .45); --kb-focus: #1f6fbf;
    --or-panel: rgba(44, 26, 20, .06); --or-line: #d4bb9c; --or-card: linear-gradient(#ffffff, #f3e6d3);
    --or-go: linear-gradient(#d9962a, #b8780a); --or-go-shadow: #6e4500; --or-good: #2c8a52; --or-bad: #c2412a; --or-star: #b8780a;
    --or-title: linear-gradient(90deg, #8a5800, #b8780a 50%, #a8494e);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f6ecdf; --kb-surface: #ffffff; --kb-surface-2: #efe0cc; --kb-sunken: #e2cfb6; --kb-line: #cdb090;
  --kb-ink: #2c1a14; --kb-dim: #6b5046;
  --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5800; --kb-accent-soft: rgba(184, 120, 10, .12);
  --kb-scrim: rgba(44, 26, 20, .45); --kb-focus: #1f6fbf;
  --or-panel: rgba(44, 26, 20, .06); --or-line: #d4bb9c; --or-card: linear-gradient(#ffffff, #f3e6d3);
  --or-go: linear-gradient(#d9962a, #b8780a); --or-go-shadow: #6e4500; --or-good: #2c8a52; --or-bad: #c2412a; --or-star: #b8780a;
  --or-title: linear-gradient(90deg, #8a5800, #b8780a 50%, #a8494e);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
#stageWrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: var(--kb-sunken); }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: crosshair; }
header { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 2px 4px; pointer-events: none; }
header > * { pointer-events: auto; }
.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--kb-ink); text-decoration: none; background: var(--or-panel); border: 1px solid var(--or-line); padding: 0; cursor: pointer; }
.back svg, .icon svg { width: 22px; height: 22px; }
.icon:active, .back:active { transform: scale(.94); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: var(--or-panel); border: 1px solid var(--or-line); color: var(--kb-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
#pieceChip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp { flex: 1 1 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
#hint { position: absolute; z-index: 7; left: 50%; top: 56px; transform: translateX(-50%); max-width: 92%; padding: 6px 12px; border-radius: 999px; background: var(--or-panel); backdrop-filter: blur(6px); border: 1px solid var(--or-line); color: var(--kb-ink); font: 800 12.5px var(--kb-font-body); text-align: center; pointer-events: none; }
#toast { position: absolute; z-index: 7; left: 50%; top: 36%; transform: translate(-50%, -50%); max-width: 90%; padding: 8px 16px; border-radius: 16px; background: var(--kb-surface); border: 2px solid var(--kb-accent); color: var(--kb-ink); font: 800 clamp(15px, 4.4vmin, 22px) var(--kb-font-body); text-align: center; pointer-events: none; animation: pop .25s; }
#toast.good { border-color: var(--or-good); } #toast.bad { border-color: var(--or-bad); }
#chips { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px 6px 5px; background: var(--kb-surface); border-top: 1px solid var(--or-line); min-height: 0; }
.cuebtn { flex: 0 0 auto; position: relative; min-width: 42px; height: 42px; padding: 0 6px; border-radius: 12px; border: 2px solid var(--or-line); background: var(--or-panel); color: var(--kb-ink); font: 800 12px var(--kb-font-body); cursor: pointer; touch-action: manipulation; line-height: 1.05; }
.cuebtn small { display: block; font-size: 9.5px; font-weight: 800; color: var(--kb-dim); }
.cuebtn.cue { border-color: var(--kb-accent); background: var(--kb-accent-soft); animation: glow .6s infinite alternate; }
.cuebtn.ok { border-color: var(--or-good); } .cuebtn.ng { border-color: var(--or-bad); }
.cuebtn:active { transform: scale(.95); }
@keyframes glow { to { box-shadow: 0 0 0 4px var(--kb-accent-soft); } }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.85); opacity: 0; } }
/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; padding: calc(var(--kb-sat) + 6px) calc(var(--kb-sar) + 8px) calc(var(--kb-sab) + 6px) calc(var(--kb-sal) + 8px); overscroll-behavior: contain; animation: fade .2s; }
.card { width: 100%; max-width: 480px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--or-card); border: 1px solid var(--or-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); animation: rise .25s; color: var(--kb-ink); }
.card.wide { max-width: 640px; }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 2px; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--or-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 30px; line-height: 1.25; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--or-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--or-go-shadow); text-decoration: none; touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--or-go-shadow); }
.btn.sub { background: var(--or-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--or-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
@media (max-width: 380px) { .row2 { gap: 5px; } .row2 > .btn.sub { font-size: 12px; padding: 4px 3px; } }
.diffs { display: flex; gap: 6px; margin: 6px 0 2px; }
.dfb { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--or-line); background: var(--or-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); padding: 3px 4px; cursor: pointer; touch-action: manipulation; }
.dfb.sel { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rlist { display: grid; gap: 6px; margin: 6px 0; text-align: left; }
.rc { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 58px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; border: 2px solid var(--or-line); background: var(--or-panel); color: var(--kb-ink); font-family: var(--kb-font-body); cursor: pointer; text-align: left; touch-action: manipulation; }
.rc:active { transform: scale(.985); }
.rc .no { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--lc, #a8494e); color: #fff; font-weight: 800; font-size: 13px; }
.rc .tx { flex: 1; min-width: 0; } .rc .tx b { display: block; font-size: 13.5px; line-height: 1.3; } .rc .tx small { display: block; font-size: 11px; color: var(--kb-dim); line-height: 1.35; }
.rc .sc { flex: none; text-align: right; font-size: 11px; color: var(--kb-dim); } .rc .sc .st { display: block; font-size: 15px; letter-spacing: 1px; color: var(--or-star); }
.info { margin-top: 6px; padding: 8px; border-radius: 12px; background: var(--or-panel); border: 1px solid var(--or-line); text-align: left; font-size: 12px; line-height: 1.5; color: var(--kb-ink); }
.stars { font-size: 34px; letter-spacing: 6px; color: var(--or-star); margin: 0; line-height: 1.2; }
.stars i { font-style: normal; opacity: .28; } .stars i.on { opacity: 1; }
.res { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.res div { padding: 6px 2px; border-radius: 12px; background: var(--or-panel); border: 1px solid var(--or-line); font-size: 10.5px; color: var(--kb-dim); font-weight: 800; }
.res b { display: block; font-size: 18px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.notes { margin: 6px 0; text-align: left; display: grid; gap: 4px; }
.notes > div { padding: 6px 8px; border-radius: 10px; background: var(--or-panel); border: 1px solid var(--or-line); font-size: 12px; line-height: 1.4; }
.big { font-size: 40px; font-weight: 800; color: var(--kb-ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.howto { max-width: 520px; text-align: left; } .howto h2 { text-align: center; }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.5; color: var(--kb-ink); } .howto li { margin: 4px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--or-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--or-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.bar { height: 10px; border-radius: 6px; background: var(--or-panel); border: 1px solid var(--or-line); overflow: hidden; margin: 10px 0 4px; } .bar > i { display: block; height: 100%; width: 0; background: var(--or-go); transition: width .15s; }
table.cr { width: 100%; border-collapse: collapse; font-size: 11.5px; text-align: left; margin: 6px 0; } table.cr th { color: var(--kb-dim); font-weight: 800; padding: 3px 4px; border-bottom: 1px solid var(--or-line); }
table.cr td { padding: 4px; border-bottom: 1px solid var(--or-line); vertical-align: top; } table.cr a { color: var(--kb-accent-text); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--or-line); font-size: 13px; font-weight: 800; text-align: left; }
.setrow small { display: block; color: var(--kb-dim); font-weight: 500; font-size: 11px; }
.setrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--or-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
@keyframes rise { from { transform: translateY(12px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .card, .overlay, #toast, .cuebtn.cue { animation: none; } }
@media (max-height: 560px) { #ovTitle .card > p:first-of-type { display: none; } .rlist { grid-template-columns: 1fr 1fr; } .card { padding: 10px 12px 8px; } .btn { min-height: 44px; margin-top: 6px; } .card h2.logo { font-size: 24px; } .rc { min-height: 52px; } }
body.thumb header, body.thumb #chips, body.thumb #hint, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #toast { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="board" width="360" height="520" role="img" aria-label="指揮者ゲーム" data-i18n-attr="aria-label"></canvas>
    <header>
      <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <span class="chip" id="pieceChip" data-i18n>指揮者ゲーム</span>
      <span class="sp"></span>
      <span class="chip" id="tempoChip" hidden>♩ 0</span>
      <button class="icon" id="sndBtn" type="button" aria-label="サウンド オン" aria-pressed="true"></button>
      <button class="icon" id="pauseBtn" type="button" aria-label="一時停止" data-i18n-attr="aria-label" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button>
    </header>
    <div id="toast" hidden role="status"></div>
    <div id="hint" hidden role="status"></div>
  </div>
  <div id="chips" role="group" aria-label="入りのキュー" data-i18n-attr="aria-label" hidden></div>
</div>
<div id="live" class="kb-sr" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-live="polite"></div>

<div class="overlay" id="ovTitle" hidden role="dialog" aria-modal="true" aria-labelledby="tLogo">
  <div class="card wide">
    <h2 class="logo" id="tLogo" data-i18n>指揮者ゲーム</h2>
    <p data-i18n>バトンを振って、本物のオーケストラを指揮しよう。拍でテンポを決め、振りの大きさで強弱を、入りのキューで楽器を呼び込む。</p>
    <div class="diffs" id="diffs" role="radiogroup" aria-label="むずかしさ" data-i18n-attr="aria-label"></div>
    <p id="diffInfo" style="min-height:2.6em"></p>
    <div class="scroll"><div class="rlist" id="pList"></div></div>
    <p id="tBest"></p>
    <div class="row2"><button class="btn sub" id="tHow" type="button" data-i18n>遊び方</button><button class="btn sub" id="tCred" type="button" data-i18n>クレジット</button><button class="btn sub" id="tSet" type="button" data-i18n>設定</button></div>
  </div>
</div>

<div class="overlay" id="ovLoad" hidden role="dialog" aria-modal="true" aria-labelledby="lTitle">
  <div class="card">
    <h2 id="lTitle" data-i18n>読み込み中…</h2>
    <p id="lPiece"></p>
    <div class="bar"><i id="lBar"></i></div>
    <p id="lInfo" data-i18n>楽器の音を読み込み中</p>
    <button class="btn link" id="lCancel" type="button" data-i18n>もどる</button>
  </div>
</div>

<div class="overlay" id="ovResult" hidden role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="card wide">
    <h2 id="rTitle" data-i18n>フィナーレ！</h2>
    <div class="scroll">
      <p id="rPiece"></p>
      <div class="big" id="rTotal">0</div>
      <p class="stars" id="rStars" aria-hidden="true"></p>
      <div id="rNew" class="newrec" hidden data-i18n>ベスト更新！</div>
      <div class="res" id="rRows"></div>
      <div class="notes" id="rNotes"></div>
    </div>
    <button class="btn" id="rNext" type="button" data-i18n>次の曲へ</button>
    <div class="row2"><button class="btn sub" id="rAgain" type="button" data-i18n>もう一度</button><button class="btn sub" id="rMenu" type="button" data-i18n>曲えらびへ</button></div>
  </div>
</div>

<div class="overlay" id="ovCred" hidden role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="card wide">
    <h2 id="cTitle" data-i18n>クレジット</h2>
    <div class="scroll" id="cBody"></div>
    <button class="btn" id="cClose" type="button" data-i18n>とじる</button>
  </div>
</div>

<div class="overlay" id="ovSet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="card">
    <h2 id="sTitle" data-i18n>設定</h2>
    <div class="scroll">
      <div class="setrow"><label for="sensSel"><span data-i18n>振りの感度</span><small data-i18n>高：小さな振りでも大きな音になりやすい</small></label><select id="sensSel"><option value="low" data-i18n>低</option><option value="mid" data-i18n>標準</option><option value="high" data-i18n>高</option></select></div>
      <div class="setrow"><label for="qualSel"><span data-i18n>音質</span><small data-i18n>軽量：メモリを半分ほどにします（スマホ向け）</small></label><select id="qualSel"><option value="auto" data-i18n>自動</option><option value="hi" data-i18n>高音質</option><option value="lo" data-i18n>軽量</option></select></div>
      <div class="setrow"><label for="motionChk" data-i18n>スマホを傾けて指揮（動きセンサー）</label><input type="checkbox" id="motionChk" style="width:28px;height:28px"></div>
      <p data-i18n>音質を変えるときは、曲をえらび直してください</p>
    </div>
    <button class="btn" id="sClose" type="button" data-i18n>とじる</button>
  </div>
</div>

<div class="overlay" id="howto" hidden role="dialog" aria-modal="true" aria-labelledby="howtoTitle" data-kb-howto>
  <div class="card howto">
    <h2 id="howtoTitle" data-i18n>遊び方</h2>
    <div class="scroll" id="howBody"></div>
    <div class="langrow"><label for="langSel" data-i18n>言語 / Language</label><span id="langPick"></span></div>
    <button class="btn" id="howtoGo" type="button" data-i18n>やってみる</button>
    <button class="btn sub" id="howtoAlt" type="button" data-i18n>説明だけでOK</button>
  </div>
</div>

<script src="../common/games.js"></script>
<script src="../common/platform.js"></script>
<script src="../common/audio.js"></script>
<script src="../common/ui.js"></script>
<script src="midi.js"></script>
<script src="engine.js"></script>
<script src="sampler.js"></script>
<script src="art.js"></script>
<script src="../common/game.js"></script>
<script>
(() => {
'use strict';
// 指揮者ゲーム — you conduct a sampled orchestra (VSCO 2 CE, CC0) playing public-domain scores (Mutopia). orchestra/engine.js is the headless rules and clock
// (tested in tools/tests/unit/orchestra-*.test.js), sampler.js is the Web Audio sound, art.js draws the stage; this file is the chrome: input, menus, saving.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const E = window.OrchEngine, S = window.OrchSampler, ART = window.OrchArt;
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'orchestra';
const SAVE_KEY = 'kusoge.orchestra.save', HOWTO_KEY = 'kusoge.orchestra.howto', PREF_KEY = 'kusoge.orchestra.prefs';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Math.round(Number(n) || 0).toLocaleString(EN ? 'en-US' : 'ja-JP');
const L = o => (o ? (EN ? o.en : o.ja) : '');
const clamp = E.clamp;
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
const perfNow = () => performance.now() / 1000;
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
const dark = () => { try { return (UI && UI.theme ? UI.theme.resolved() : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; } catch (e) { return true; } };
const DIFF_IDS = ['enjoy', 'normal', 'maestro'];
const starsStr = n => '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n);

// ---------- save ----------
// { v:1, total (sum of the best score of every piece, best difficulty), stars, p:{ <piece>:{ b0,s0 (enjoy), b1,s1 (normal), b2,s2 (maestro), n (plays) } }, stats:{...}, set:{ diff, piece }, tut }
function defSave() { return { v: 1, total: 0, stars: 0, p: {}, stats: { plays: 0, finishes: 0, cues: 0, perfect: 0, beats: 0, three: 0 }, set: { diff: 'normal', piece: '' }, tut: 0 }; }
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  const out = Object.assign(d, s);
  out.stats = Object.assign(defSave().stats, obj(s.stats)); out.set = Object.assign(defSave().set, obj(s.set));
  if (!DIFF_IDS.includes(out.set.diff)) out.set.diff = 'normal';
  out.p = {};
  Object.keys(obj(s.p)).forEach(id => {
    const q = obj(s.p[id]), r = { n: Math.max(0, Number(q.n) || 0) };
    [0, 1, 2].forEach(i => { r['b' + i] = Math.max(0, Math.min(100, Number(q['b' + i]) || 0)); r['s' + i] = clamp(Math.round(Number(q['s' + i]) || 0), 0, 3); });
    out.p[id] = r;
  });
  recount(out);
  return out;
}
function bestOf(p) { return p ? Math.max(p.b1 || 0, p.b2 || 0, p.b0 || 0) : 0; }
function recount(s) {
  let t = 0, st = 0; for (const id in s.p) { const p = s.p[id]; t += bestOf(p); st += Math.max(p.s0, p.s1, p.s2); }
  s.total = Math.max(t, Number(s.total) || 0); s.stars = Math.max(st, Number(s.stars) || 0);
}
let save = readSave();
function writeSave() { recount(save); store.set(SAVE_KEY, JSON.stringify(save)); }
let prefs = (() => { try { const p = JSON.parse(store.get(PREF_KEY) || '{}'); return { quality: ['auto', 'hi', 'lo'].includes(p.quality) ? p.quality : 'auto', motion: !!p.motion, sens: ['low', 'mid', 'high'].includes(p.sens) ? p.sens : 'mid' }; } catch (e) { return { quality: 'auto', motion: false, sens: 'mid' }; } })();
function writePrefs() { store.set(PREF_KEY, JSON.stringify(prefs)); }

// ---------- state ----------
let INDEX = null, curDiff = save.set.diff, selPiece = save.set.piece || '';
let G = null;            // the running piece: { id, score, session, player, bank, ctx, diff, ... }
let loading = null;      // abort flag while loading
let paused = false, menuOpen = false;
const base = new URL('./', location.href).href;
const tierOf = () => {
  if (prefs.quality === 'hi') return 'hi'; if (prefs.quality === 'lo') return 'lo';
  const ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const mem = navigator.deviceMemory || 8;
  return ios || mem <= 2 || /Android/.test(ua) && mem <= 4 ? 'lo' : 'hi';
};

// ---------- canvas ----------
const canvas = $('board'), wrap = $('stageWrap');
const art = ART.create(canvas, { dark: dark(), en: EN, reduced: reduceMotion.matches, T });
function fit() {
  const r = wrap.getBoundingClientRect(); art.resize(r.width, r.height); if (G) art.layout(G.score.sections); if (detector) detector.setScale(art.scale); if (flick) flick.setScale(art.scale); needDraw = true;
}
let needDraw = true;
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(wrap); addEventListener('resize', fit);

// ---------- overlays ----------
function showOv(id) { for (const o of document.querySelectorAll('.overlay')) o.hidden = o.id !== id; const f = $(id).querySelector('.btn:not(.sub):not(.link)'); try { if (f) f.focus({ preventScroll: true }); } catch (e) {} }
function hideOv(id) { $(id).hidden = true; }
function hideAll() { for (const o of document.querySelectorAll('.overlay')) o.hidden = true; }
const anyOverlay = () => !!document.querySelector('.overlay:not([hidden])');
function toast(msg, cls, ms) { const t = $('toast'); t.textContent = msg; t.className = cls || ''; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, ms || 1100); $('live').textContent = msg; }
function hint(msg) { const h = $('hint'); if (msg) { h.textContent = msg; h.hidden = false; } else h.hidden = true; }

// ---------- title ----------
function pieceTitle(p) { return L(p.title); }
function renderDiffs() {
  const box = $('diffs'); box.innerHTML = '';
  const names = { enjoy: T('たのしむ'), normal: T('ふつう'), maestro: T('マエストロ') };
  DIFF_IDS.forEach(id => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dfb' + (id === curDiff ? ' sel' : ''); b.textContent = names[id]; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', id === curDiff ? 'true' : 'false'); b.dataset.diff = id;
    b.onclick = () => { curDiff = id; save.set.diff = id; writeSave(); renderDiffs(); renderPieces(); };
    box.appendChild(b);
  });
  $('diffInfo').textContent = T({ enjoy: 'たのしむ：入りは自動、失敗なし。ゆったり指揮を楽しむ', normal: 'ふつう：入りのキューと強弱を見られる', maestro: 'マエストロ：きびしい採点。振らないとオーケストラは待つ' }[curDiff]);
}
const patName = n => T({ 1: '1つ振り', 2: '2つ振り', 3: '3つ振り', 4: '4つ振り' }[n] || '2つ振り');
function renderPieces() {
  const box = $('pList'); box.innerHTML = '';
  if (!INDEX) { box.innerHTML = '<p>' + esc(T('読み込み中…')) + '</p>'; return; }
  const di = DIFF_IDS.indexOf(curDiff);
  INDEX.pieces.forEach((p, i) => {
    const sv = save.p[p.id] || {}, st = sv['s' + di] || 0, b = sv['b' + di] || 0;
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rc'; btn.dataset.piece = p.id; btn.style.setProperty('--lc', 'hsl(' + (350 + i * 38) % 360 + ',55%,42%)');
    btn.innerHTML = '<span class="no">' + (i + 1) + '</span><span class="tx"><b>' + esc(L(p.title)) + '</b><small>' + esc(L(p.composer)) + ' · ' + esc(L(p.mvt)) + '</small><small>' + esc(T('{n} 分', { n: Math.round(p.minutes * 10) / 10 })) + ' · ' + esc(patName(p.pattern)) + ' · ' + '●'.repeat(p.level) + '○'.repeat(3 - p.level) + '</small></span>' +
      '<span class="sc"><span class="st">' + starsStr(st) + '</span>' + (b ? esc(T('ベスト {n} 点', { n: b })) : esc(T('まだ記録なし'))) + '</span>';
    btn.onclick = () => startPiece(p.id);
    btn.setAttribute('aria-label', L(p.title) + ', ' + L(p.composer));
    box.appendChild(btn);
  });
  $('tBest').textContent = save.stats.plays > 0 ? T('合計 ★ {n}', { n: save.stars }) : T('まだ記録はありません');
}
function showTitle() {
  stopPlay(); layoutDemo(); hideAll(); $('pauseBtn').hidden = true; $('chips').hidden = true; $('tempoChip').hidden = true; hint(''); $('toast').hidden = true;
  $('pieceChip').textContent = T('指揮者ゲーム'); renderDiffs(); renderPieces(); showOv('ovTitle'); fit();
}
async function loadIndex() {
  try { const r = await fetch('scores/index.json'); INDEX = await r.json(); } catch (e) { INDEX = null; }
  if (INDEX) INDEX.pieces.forEach(p => { p.pattern = p.pattern || 0; });
  renderPieces();
}

// ---------- starting a piece ----------
async function startPiece(id) {
  if (loading) return;
  if (AU) AU.ctx(); // inside the tap: creates and resumes the shared AudioContext
  const meta = INDEX.pieces.find(p => p.id === id); if (!meta) return;
  const tok = loading = { cancelled: false };
  save.set.piece = id; selPiece = id; writeSave();
  $('lPiece').textContent = L(meta.title) + ' — ' + L(meta.composer); $('lBar').style.width = '0%'; $('lInfo').textContent = T('楽器の音を読み込み中'); showOv('ovLoad');
  $('lCancel').onclick = () => { tok.cancelled = true; };
  try {
    const r = await fetch('scores/' + id + '.json' + (INDEX.build ? '?b=' + INDEX.build : '')); if (!r.ok) throw new Error('score ' + r.status);
    const json = await r.json(), score = new E.Score(json);
    const ctx = AU ? AU.ctx() : null; if (!ctx) throw new Error('no audio');
    const tier = tierOf(), bank = new S.Bank({ ctx, base: base + 'samples/', tier });
    bank.onError = e => { if (DEBUG) console.warn('sample', e && e.message); };
    await bank.load(json.needs, E.artFor, (a, b) => { if (tok.cancelled) return; $('lBar').style.width = Math.round(100 * a / b) + '%'; $('lInfo').textContent = T('{a} / {b} 個（{m} MB）', { a, b, m: (bank.bytes / 1048576).toFixed(0) }); });
    if (tok.cancelled) { loading = null; showTitle(); return; }
    loading = null;
    beginPlay(id, score, ctx, bank, tier);
  } catch (e) {
    loading = null; if (DEBUG) console.warn(e);
    $('lInfo').textContent = T('読み込めませんでした。通信を確かめて、もう一度。'); $('lCancel').textContent = T('もどる'); $('lCancel').onclick = () => { showTitle(); };
  }
}

// ---------- the play loop ----------
const secKeys = {};
let detector = null, flick = null; let trail = [], hist = [], kbStep = 5, kbLevel = 0.53, lastDev = 'mouse', lastIctusT = null, actQ = [], lastAct = {}, flash = {}, cueSeen = new Set(), tickTimer = 0, raf = 0, lastTapAt = 0, pointer = null, motion = null, lvSmooth = 0.45;
const nowT = () => (G && G.ctx ? G.ctx.currentTime : perfNow());
const toCtx = ms => (G && G.ctx ? G.ctx.currentTime - (performance.now() - ms) / 1000 : ms / 1000);

function beginPlay(id, score, ctx, bank, tier) {
  stopPlay();
  const out = AU && AU.se ? AU.se : ctx.destination;
  const secs = score.sections.map(s => ({ id: s.id, inst: s.inst, pan: s.def.pan, back: s.def.back, mix: s.def.mix }));
  const player = new S.Player({ ctx, out, bank, sections: secs, artFor: E.artFor, maxVoices: tier === 'lo' ? 48 : 72 });
  const act = {}; // what to draw: note-on events as they come due
  const sink = {
    noteOn(t, si, p, sh, g, nid, vel, ev) { actQ.push([t, score.sections[si].id, sh]); return player.noteOn(t, si, p, sh, g, nid, vel); },
    noteOff(t, nid) { return player.noteOff(t, nid); },
    maintain(u) { return player.maintain(u); }, setLevel(l, t) { return player.setLevel(l, t); }, releaseAll(t, r) { return player.releaseAll(t, r); },
  };
  const diff = E.DIFFS[curDiff];
  const session = new E.Session({ score, diff, sink, now: nowT });
  G = { id, score, ctx, bank, player, session, diff, tier, meta: INDEX.pieces.find(p => p.id === id), reported: false, startedAt: perfNow(), ended: false, shown: false, beats: 0, hist: [] };
  kbStep = 5; kbLevel = E.Dynamics.keyLevel(5); lvSmooth = 0.45; lastIctusT = null; session.level = 0.45; trail = []; hist = new Array(score.nBeats).fill(null); actQ = []; lastAct = {}; flash = {}; cueSeen = new Set(); paused = false; menuOpen = false;
  detector = new E.BeatDetector({ scale: art.scale }); flick = new E.FlickDetector({ scale: art.scale });
  art.layout(score.sections); buildChips(score); hideAll();
  $('pieceChip').textContent = L(G.meta.title); $('pauseBtn').hidden = false; $('chips').hidden = false; $('tempoChip').hidden = false;
  fit();
  if (prefs.motion) enableMotion();
  hint(T('音が出ないときは画面をタップ')); setTimeout(() => { if (G && G.session.state !== 'idle') hint(''); }, 4500);
  emit('play_start', { mode: 'normal', stage: INDEX.pieces.findIndex(p => p.id === id) + 1, resumed: false });
  save.stats.plays++; const sv = save.p[id] = save.p[id] || { n: 0, b0: 0, s0: 0, b1: 0, s1: 0, b2: 0, s2: 0 }; sv.n++; writeSave();
  clearInterval(tickTimer); tickTimer = setInterval(tick, 25);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  needDraw = true;
}
function stopPlay() {
  clearInterval(tickTimer); cancelAnimationFrame(raf); tickTimer = 0;
  if (G) {
    if (!G.reported && G.session.state !== 'idle' && !G.ended) { G.reported = true; emit('play_end', { mode: 'normal', score: 0, durationMs: Math.round((perfNow() - G.startedAt) * 1000), reason: 'quit', stats: {} }); }
    try { G.player.dispose(); } catch (e) {} disableMotion(); G = null;
  }
}
function buildChips(score) {
  const box = $('chips'); box.innerHTML = ''; Object.keys(secKeys).forEach(k => delete secKeys[k]);
  score.sections.forEach((s, i) => {
    secKeys[s.id] = E.KEYS[i];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cuebtn'; b.dataset.sec = s.id;
    b.innerHTML = esc(E.KEYS[i].toUpperCase()) + '<small>' + esc(EN ? s.def.ab.en : s.def.ab.ja) + '</small>';
    b.setAttribute('aria-label', (EN ? s.def.en : s.def.ja) + ' (' + E.KEYS[i].toUpperCase() + ')');
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); giveCue(s.id, toCtx(ev.timeStamp)); });
    box.appendChild(b);
  });
  fitSoon();
}
