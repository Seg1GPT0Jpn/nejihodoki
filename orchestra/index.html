<style>
/* 指揮者ゲーム: a velvet-and-gold concert hall around a full-bleed canvas. --kb-* are the shared tokens re-tinted; --or-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1b1015; --kb-surface: #2a1820; --kb-surface-2: #38222b; --kb-sunken: #140a0e; --kb-line: #5a3a44;
  --kb-ink: #f6ecdf; --kb-dim: #cdb8b0;
  --kb-accent: #ffcf6a; --kb-accent-ink: #2a1500; --kb-accent-text: #ffd98a; --kb-accent-soft: rgba(255, 207, 106, .16);
  --kb-scrim: rgba(14, 6, 9, .74); --kb-focus: #9fe3ff;
  --or-panel: rgba(255, 255, 255, .07); --or-line: rgba(255, 255, 255, .2); --or-card: linear-gradient(#37202a, #26151c);
  --or-go: linear-gradient(#ffd86e, #eba02a); --or-go-shadow: #8a5a05; --or-good: #7be0a0; --or-bad: #ff8f80; --or-star: #ffcf6a;
  --or-title: linear-gradient(90deg, #ffe6a5, #ffcf6a 50%, #ff9d7a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f6ecdf; --kb-surface: #ffffff; --kb-surface-2: #efe0cc; --kb-sunken: #e2cfb6; --kb-line: #cdb090;
    --kb-ink: #2c1a14; --kb-dim: #6b5046;
    --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5800; --kb-accent-soft: rgba(184, 120, 10, .12);
    --kb-scrim: rgba(44, 26, 20, .45); --kb-focus: #1f6fbf;
    --or-panel: rgba(44, 26, 20, .06); --or-line: #d4bb9c; --or-card: linear-gradient(#ffffff, #f3e6d3);
    --or-go: linear-gradient(#d9962a, #b8780a); --or-go-shadow: #6e4500; --or-good: #2c8a52; --or-bad: #c2412a; --or-star: #b8780a;
    --or-title: linear-gradient(90deg, #8a5800, #b8780a 50%, #a8494e);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f6ecdf; --kb-surface: #ffffff; --kb-surface-2: #efe0cc; --kb-sunken: #e2cfb6; --kb-line: #cdb090;
  --kb-ink: #2c1a14; --kb-dim: #6b5046;
  --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5800; --kb-accent-soft: rgba(184, 120, 10, .12);
  --kb-scrim: rgba(44, 26, 20, .45); --kb-focus: #1f6fbf;
  --or-panel: rgba(44, 26, 20, .06); --or-line: #d4bb9c; --or-card: linear-gradient(#ffffff, #f3e6d3);
  --or-go: linear-gradient(#d9962a, #b8780a); --or-go-shadow: #6e4500; --or-good: #2c8a52; --or-bad: #c2412a; --or-star: #b8780a;
  --or-title: linear-gradient(90deg, #8a5800, #b8780a 50%, #a8494e);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
#stageWrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: var(--kb-sunken); }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: crosshair; }
header { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 2px 4px; pointer-events: none; }
header > * { pointer-events: auto; }
.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--kb-ink); text-decoration: none; background: var(--or-panel); border: 1px solid var(--or-line); padding: 0; cursor: pointer; }
.back svg, .icon svg { width: 22px; height: 22px; }
.icon:active, .back:active { transform: scale(.94); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: var(--or-panel); border: 1px solid var(--or-line); color: var(--kb-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
#pieceChip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp { flex: 1 1 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
#motionChip { min-height: 44px; padding: 0 12px; cursor: pointer; } #motionChip[data-state="on"] { border-color: var(--or-good); } #motionChip[data-state="denied"], #motionChip[data-state="unavailable"], #motionChip[data-state="nodata"] { border-color: var(--or-bad); }
#hint { position: absolute; z-index: 7; left: 50%; top: 56px; transform: translateX(-50%); max-width: 92%; padding: 6px 12px; border-radius: 999px; background: var(--or-panel); backdrop-filter: blur(6px); border: 1px solid var(--or-line); color: var(--kb-ink); font: 800 12.5px var(--kb-font-body); text-align: center; pointer-events: none; }
#practiceBar { position: absolute; z-index: 7; left: 50%; bottom: 64px; transform: translateX(-50%); width: min(92%, 420px); display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 8px 6px 12px; border-radius: 16px; background: var(--or-panel); border: 1px solid var(--or-line); font: 800 12.5px var(--kb-font-body); }
#practiceBar .btn { min-height: 38px; padding: 4px 12px; font-size: 13px; }
#howDemo { display: block; flex: 0 0 auto; width: 100%; max-width: 320px; height: clamp(64px, 24vh, 150px); object-fit: contain; margin: 2px auto 4px; border-radius: 12px; background: var(--or-panel); }
.howtabs { flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; margin-bottom: 4px; } .howtabs button { min-width: 64px; min-height: 44px; border-radius: 999px; border: 2px solid var(--or-line); background: transparent; color: inherit; font: 800 13px var(--kb-font-body); } .howtabs button.sel { border-color: var(--kb-accent); }
#toast { position: absolute; z-index: 7; left: 50%; top: 36%; transform: translate(-50%, -50%); max-width: 90%; padding: 8px 16px; border-radius: 16px; background: var(--kb-surface); border: 2px solid var(--kb-accent); color: var(--kb-ink); font: 800 clamp(15px, 4.4vmin, 22px) var(--kb-font-body); text-align: center; pointer-events: none; animation: pop .25s; }
#toast.good { border-color: var(--or-good); } #toast.bad { border-color: var(--or-bad); }
#chips { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px 6px 5px; background: var(--kb-surface); border-top: 1px solid var(--or-line); min-height: 0; }
.cuebtn { flex: 0 0 auto; position: relative; min-width: 42px; height: 42px; padding: 0 6px; border-radius: 12px; border: 2px solid var(--or-line); background: var(--or-panel); color: var(--kb-ink); font: 800 12px var(--kb-font-body); cursor: pointer; touch-action: manipulation; line-height: 1.05; }
.cuebtn small { display: block; font-size: 9.5px; font-weight: 800; color: var(--kb-dim); }
.cuebtn.cue { border-color: var(--kb-accent); background: var(--kb-accent-soft); animation: glow .6s infinite alternate; }
.cuebtn.ok { border-color: var(--or-good); } .cuebtn.ng { border-color: var(--or-bad); }
.cuebtn:active { transform: scale(.95); }

<script>

// ---------- save ----------
