<style>
/* からくり工房からの脱出: warm workshop chrome around a canvas scene. --kb-* are the shared tokens re-tinted to wood and amber; --es-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1d1612; --kb-surface: #2a201a; --kb-surface-2: #352820; --kb-sunken: #150f0c; --kb-line: #4a3a2e;
  --kb-ink: #f6ead8; --kb-dim: #c9b49c;
  --kb-accent: #f0a84a; --kb-accent-ink: #2a1606; --kb-accent-text: #f6bb6a; --kb-accent-soft: rgba(240, 168, 74, .15);
  --kb-scrim: rgba(12, 8, 5, .78); --kb-toast-bg: rgba(24, 16, 10, .95); --kb-focus: #ffe08a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --es-panel: rgba(255, 230, 200, .06); --es-line: rgba(255, 220, 180, .16); --es-slot: #2f241d; --es-slot-sel: #4a3420;
  --es-go: linear-gradient(#f7bd63, #e0902f); --es-go-shadow: #8a5113; --es-card: linear-gradient(#30251d, #221a14);
  --es-title: linear-gradient(90deg, #ffd38a, #f0a84a 55%, #e0795a); --es-stage: #120d0a; --es-bad: #ff8a6a; --es-good: #8fd68a;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f4ece0; --kb-surface: #fffaf2; --kb-surface-2: #f8efe2; --kb-sunken: #e8dccb; --kb-line: #d8c6ae;
    --kb-ink: #3a2a1e; --kb-dim: #6e5643;
    --kb-accent: #c06a1a; --kb-accent-ink: #ffffff; --kb-accent-text: #9a520f; --kb-accent-soft: rgba(192, 106, 26, .12);
    --kb-scrim: rgba(58, 42, 30, .45); --kb-toast-bg: rgba(58, 42, 30, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(58, 42, 30, .2);
    --es-panel: rgba(58, 42, 30, .05); --es-line: #dccbb4; --es-slot: #fffaf2; --es-slot-sel: #f6deb8;
    --es-go: linear-gradient(#e0892e, #c06a1a); --es-go-shadow: #7f430c; --es-card: linear-gradient(#fffaf2, #f6ecdd);
    --es-title: linear-gradient(90deg, #a5520f, #c06a1a 55%, #a8402a); --es-stage: #2a1d14; --es-bad: #c2412a; --es-good: #2f8a3a;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f4ece0; --kb-surface: #fffaf2; --kb-surface-2: #f8efe2; --kb-sunken: #e8dccb; --kb-line: #d8c6ae;
  --kb-ink: #3a2a1e; --kb-dim: #6e5643;
  --kb-accent: #c06a1a; --kb-accent-ink: #ffffff; --kb-accent-text: #9a520f; --kb-accent-soft: rgba(192, 106, 26, .12);
  --kb-scrim: rgba(58, 42, 30, .45); --kb-toast-bg: rgba(58, 42, 30, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(58, 42, 30, .2);
  --es-panel: rgba(58, 42, 30, .05); --es-line: #dccbb4; --es-slot: #fffaf2; --es-slot-sel: #f6deb8;
  --es-go: linear-gradient(#e0892e, #c06a1a); --es-go-shadow: #7f430c; --es-card: linear-gradient(#fffaf2, #f6ecdd);
  --es-title: linear-gradient(90deg, #a5520f, #c06a1a 55%, #a8402a); --es-stage: #2a1d14; --es-bad: #c2412a; --es-good: #2f8a3a;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 65%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 6px 0; width: 100%; max-width: 980px; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
.chip { flex: none; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--es-panel); border: 1px solid var(--es-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
#roomChip { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--kb-ink); background: transparent; border: 0; padding-left: 2px; font-size: 13.5px; }
.icon { position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--es-line); background: var(--es-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.icon:disabled { opacity: .4; cursor: default; }
#hintBtn { color: var(--kb-accent-text); border-color: var(--kb-accent); }
#hintBtn .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; padding: 0 3px; box-sizing: border-box; }
.back:focus-visible, .icon:focus-visible, .nav:focus-visible, .slot:focus-visible, .btn:focus-visible, .room:focus-visible, #scene:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 980px; margin: 0 auto; box-sizing: border-box; padding: 4px 6px 6px; gap: 6px; }
#stageWrap { flex: 1 1 auto; min-height: 120px; position: relative; display: grid; place-items: end center; }
#scene { display: block; border-radius: 14px; background: var(--es-stage); box-shadow: 0 6px 24px rgba(0, 0, 0, .35), 0 0 0 1px var(--es-line); touch-action: manipulation; cursor: default; }
#scene.hot { cursor: pointer; }
#side { flex: none; display: flex; flex-direction: column; gap: 6px; }
#msg { margin: 0; min-height: 38px; box-sizing: border-box; padding: 4px 10px; border-radius: 12px; background: var(--es-panel); border: 1px solid var(--es-line); font-size: 12.5px; font-weight: 800; line-height: 1.4; display: flex; align-items: center; gap: 8px; overflow: hidden; }
#msg span { flex: 1; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#msg.coach { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
#msg .tag { flex: none; font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); display: -webkit-box; }
#msg.flash { animation: flash .5s ease-out; }
#navRow { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6px; }
.nav { min-height: 46px; border-radius: 14px; border: 1px solid var(--es-line); background: var(--kb-surface); color: var(--kb-ink); box-shadow: 0 3px 0 var(--kb-sunken); display: grid; place-items: center; cursor: pointer; padding: 0; touch-action: manipulation; }
.nav svg { width: 26px; height: 26px; }
.nav:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--kb-sunken); }
.nav:disabled { opacity: .3; cursor: default; box-shadow: none; transform: none; }
#inv { display: flex; gap: 5px; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; touch-action: pan-x; padding: 2px; min-height: 52px; border-radius: 14px; background: var(--es-panel); border: 1px solid var(--es-line); scrollbar-width: none; }
#inv::-webkit-scrollbar { display: none; }
#inv .empty { align-self: center; padding: 0 10px; font-size: 12px; color: var(--kb-dim); }
.slot { flex: none; width: 48px; height: 48px; box-sizing: border-box; border-radius: 11px; border: 1.5px solid var(--es-line); background: var(--es-slot); padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; touch-action: manipulation; }
.slot canvas { width: 40px; height: 40px; pointer-events: none; }
.slot[aria-pressed="true"] { border-color: var(--kb-accent); background: var(--es-slot-sel); box-shadow: 0 0 0 2px var(--kb-accent); }
.slot.new { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.card { width: 100%; max-width: 420px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--es-card); border: 1px solid var(--es-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); overflow: hidden; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--es-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 24px; line-height: 1.25; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.card p.story { color: var(--kb-ink); font-size: 13px; text-align: left; white-space: pre-line; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--es-go); color: #2a1606; font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--es-go-shadow); text-decoration: none; touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--es-go-shadow); }
.btn.sub { background: var(--es-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--es-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; }
.btn:disabled { opacity: .45; cursor: default; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.total { margin: 6px 0 2px; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); }
.rooms { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; text-align: left; }
.room { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; border: 1px solid var(--es-line); background: var(--es-panel); color: var(--kb-ink); cursor: pointer; font: 800 14px var(--kb-font-body); text-align: left; touch-action: manipulation; }
.room canvas { flex: none; width: 56px; height: 42px; border-radius: 8px; }
.room span { flex: 1; min-width: 0; }
.room small { display: block; font-size: 11px; font-weight: 500; color: var(--kb-dim); margin-top: 1px; }
.room b.rk { flex: none; min-width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--kb-font-display); font-weight: 400; font-size: 16px; background: var(--kb-accent-soft); color: var(--kb-accent-text); }
.room:disabled { opacity: .5; cursor: default; }
.room:disabled canvas { filter: grayscale(1) brightness(.6); }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.res div { padding: 6px 4px; border-radius: 12px; background: var(--es-panel); border: 1px solid var(--es-line); font-size: 11px; color: var(--kb-dim); font-weight: 800; }
.res b { display: block; font-size: 17px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.bigrank { font-family: var(--kb-font-display); font-size: 54px; line-height: 1.05; background: var(--es-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.hint { text-align: left; margin-top: 8px; padding: 8px 10px; border-radius: 14px; border: 1px solid var(--es-line); background: var(--es-panel); }
.hint h3 { margin: 0 0 4px; font-size: 13.5px; }
.hint ol { margin: 0 0 4px; padding-left: 20px; font-size: 12.5px; line-height: 1.5; }
.hint li { margin: 2px 0; }
.hint .btn { margin-top: 4px; min-height: 44px; font-size: 13px; }
.howto { max-width: 440px; text-align: left; }
.howto h2 { text-align: center; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.5; color: var(--kb-ink); }
.howto li { margin: 4px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--es-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--es-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
body.thumb header, body.thumb #side, body.thumb .kb-layer, body.thumb .kb-toasts { display: none !important; }
body.thumb #stageWrap { place-items: center; }
body.thumb #scene { border-radius: 0; box-shadow: none; }
body.thumb { background: #1d1612; }

@keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes flash { from { background: var(--kb-accent-soft); } }
@media (prefers-reduced-motion: reduce) { .card, .overlay, .slot.new, #msg.flash { animation: none; } }
@media (max-height: 600px) {
  .card { padding: 12px 12px 8px; } .btn { min-height: 46px; margin-top: 6px; }
  .room { min-height: 50px; } .room canvas { width: 48px; height: 36px; }
  #msg { min-height: 36px; padding-top: 2px; padding-bottom: 2px; }
}
@media (max-width: 359px) { .chip { padding: 4px 6px; } }
/* landscape phones: the scene on the left, the message, arrows and bag on the right */
@media (orientation: landscape) and (max-height: 560px) {
  header { padding-top: 0; }
  #main { flex-direction: row; gap: 8px; padding-top: 2px; }
  #stageWrap { place-items: center; }
  #side { width: clamp(170px, 32%, 260px); justify-content: flex-end; }
  #msg { flex: 1 1 auto; min-height: 44px; align-items: flex-start; }
  #msg span { -webkit-line-clamp: 5; }
  #inv { flex-wrap: wrap; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; max-height: 108px; align-content: flex-start; }
  .card { max-width: 640px; }
  .howto { max-width: 680px; }
  .rooms { display: grid; grid-template-columns: 1fr 1fr; }
  .card h2.logo { font-size: 20px; }
  .res { grid-template-columns: repeat(4, 1fr); }
  .bigrank { font-size: 40px; }
}

<script src="room5.js"></script>

<script>
(() => {
'use strict';
// からくり工房からの脱出 — an original point-and-click escape game in five rooms of a gadget workshop.
// The engine (this file) handles the views, the bag, hints, saving, timing and scoring; the rooms, their art
// and their puzzles live in rooms.js (EscapeRooms.build(kit)). Every clue is a number, shape, colour or picture,
// so the puzzles play the same in Japanese and English.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'escape';
const SAVE_KEY = 'kusoge.escape.save'; // records per room (registry: per-field merge)
const RUN_KEY = 'kusoge.escape.run';   // the room in progress on this device (autosave; not synced)
const HOWTO_KEY = 'kusoge.escape.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const LW = 400, LH = 300; // the scene's logical size
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Math.round(Number(n) || 0).toLocaleString(EN ? 'en-US' : 'ja-JP');
const fmtTime = ms => { const s = Math.floor((ms || 0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
const now = () => performance.now();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
function sfx(name, a) { if (AU) AU.sfx(name, a); }
function tone(f, d, o) { if (AU) AU.tone(f, d, o); }
function noise(d, o) { if (AU) AU.noise(d, o); }

// ---------- scoring ----------
const RANKS = ['C', 'B', 'A', 'S'];
function scoreOf(par, ms, hints) {
  const hp = Math.max(0, 400 - 40 * hints);
  const tp = Math.round(400 * clamp((3 * par - ms) / (2 * par), 0, 1));
  return 200 + hp + tp;
}
const rankOf = s => (s >= 900 ? 4 : s >= 750 ? 3 : s >= 550 ? 2 : 1); // 4 = S

// ---------- the kit the rooms use ----------
let run = null;        // { ri, room, S, inv, sel, view, back:[], ms, hints:{}, tut, over, at }
let tr = {};           // transient per-room state (animations); never saved
let animUntil = 0;
const K = {
  T, get S() { return run ? run.S : {}; }, get tr() { return tr; }, get lang() { return EN ? 'en' : 'ja'; },
  time: now,
  say(s, v) { say(T(s, v)); },
  sayRaw(s) { say(s); },
  go(v) { goView(v); },
  give(id) { give(id); },
  take(id) { take(id); },
  has: id => !!run && run.inv.includes(id),
  sel: () => (run ? run.sel : null),
  ok() { sfx('ok'); vibrate(15); },
  bad() { sfx('error'); },
  sfx, tone, noise,
  anim(ms) { animUntil = Math.max(animUntil, now() + (reduceMotion.matches ? Math.min(ms, 250) : ms)); redraw(); },
  redraw() { redraw(); },
  exit() { roomClear(); },
  coach(ev) { coachEvent(ev); },
  persist() { persistSoon(); },
  reduced: () => reduceMotion.matches,
};
const ROOMS = window.EscapeRooms.build(K);
const itemName = id => T(run.room.items[id].name);

// ---------- save ----------
function defSave() { return { v: 1, rooms: {}, total: 0, stats: { clears: 0, nh: 0, sRank: 0, fast: 0, hints: 0, done: 0 }, tut: 0 }; }
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const out = Object.assign(d, s);
  out.rooms = s.rooms && typeof s.rooms === 'object' && !Array.isArray(s.rooms) ? s.rooms : {};
  out.stats = Object.assign(defSave().stats, s.stats && typeof s.stats === 'object' ? s.stats : {});
  out.total = recount(out);
  return out;
}
function recount(s) { let t = 0; for (const r of ROOMS) { const b = s.rooms[r.id]; if (b && b.s > 0) t += Math.min(1000, Math.floor(b.s)); } return t; }
let save = readSave();
function writeSave() { save.total = recount(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const unlocked = i => i === 0 || !!(save.rooms[ROOMS[i - 1].id] && save.rooms[ROOMS[i - 1].id].c > 0);

function readRun() {
  let r = null; try { r = JSON.parse(store.get(RUN_KEY) || 'null'); } catch (e) { r = null; }
  if (!r || r.v !== 1 || !(r.ri >= 0 && r.ri < ROOMS.length) || !r.S || typeof r.S !== 'object' || !Array.isArray(r.inv)) return null;
  return r;
}
function persist() {
  clearTimeout(persistT); persistT = 0;
  if (!run || run.over || DEBUG_NOSAVE) return;
  store.set(RUN_KEY, JSON.stringify({ v: 1, ri: run.ri, S: run.S, inv: run.inv, sel: run.sel, view: run.view, back: run.back, ms: Math.round(run.ms), hints: run.hints, tut: run.tut, at: Date.now() }));
}
let persistT = 0, DEBUG_NOSAVE = false;
function persistSoon() { if (!persistT) persistT = setTimeout(persist, 250); }
function clearRun() { store.del(RUN_KEY); }

// ---------- canvas ----------
const cv = $('scene'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1, raf = 0;
function layout() {
  const w = $('stageWrap'), aw = w.clientWidth, ah = w.clientHeight;
  if (!aw || !ah) return;
  const k = Math.min(aw / LW, ah / LH);
  const cw = Math.max(100, Math.floor(LW * k)), ch = Math.max(75, Math.floor(LH * k));
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  scale = cw / LW;
  redraw();
}
function redraw() { if (!raf) raf = requestAnimationFrame(render); }
let ripples = [], idleS = null;
function render() {
  raf = 0;
  const t = now();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  const def = viewDef();
  ctx.save();
  try { if (def) def.draw(ctx, run ? run.S : (idleS || (idleS = ROOMS[0].init())), t); } catch (e) { if (DEBUG) console.error(e); }
  ctx.restore();
  ripples = ripples.filter(r => t - r.t < 380);
  for (const r of ripples) {
    const k = (t - r.t) / 380;
    ctx.beginPath(); ctx.arc(r.x, r.y, 6 + 18 * k, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,240,200,' + (0.7 * (1 - k)) + ')'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  if (t < animUntil || ripples.length) raf = requestAnimationFrame(render);
}
new ResizeObserver(layout).observe($('stageWrap'));
window.addEventListener('resize', layout);

// ---------- views ----------
const WALLS = ['w0', 'w1', 'w2', 'w3'];
const isWall = v => WALLS.includes(v);
function viewDef() {
  if (!run) return ROOMS[0].views.w0;
  if (run.view.startsWith('i:')) return inspectDef(run.view.slice(2));
  return run.room.views[run.view] || run.room.views.w0;
}
function inspectDef(id) {
  const it = run.room.items[id];
  return {
    draw(c, S, t) { window.EscapeRooms.art.inspectBg(c); if (it.big) it.big(c, S, t); else { c.save(); c.translate(130, 80); it.icon(c, 140, S); c.restore(); } window.EscapeRooms.art.caption(c, T(it.name)); },
    spots: it.spots || (() => []),
  };
}
function curSpots() {
  const d = viewDef(); if (!d || !d.spots || !run) return [];
  try { return d.spots(run.S) || []; } catch (e) { if (DEBUG) console.error(e); return []; }
}
function hit(sp, x, y) {
  if (sp.r != null) return (x - sp.cx) ** 2 + (y - sp.cy) ** 2 <= sp.r * sp.r;
  return x >= sp.x && x <= sp.x + sp.w && y >= sp.y && y <= sp.y + sp.h;
}
function spotAt(x, y) { const l = curSpots(); for (let i = l.length - 1; i >= 0; i--) if (hit(l[i], x, y)) return l[i]; return null; }
function goView(v) {
  if (!run) return;
  if (v === run.view) { redraw(); return; }
  if (!isWall(v) && !v.startsWith('i:')) run.back.push(run.view);
  else if (v.startsWith('i:')) run.back.push(run.view);
  else run.back = [];
  run.view = v;
  if (isWall(v)) run.wall = WALLS.indexOf(v);
  sfx('move');
  renderNav(); redraw(); persistSoon();
}
function goBack() {
  if (!run || isWall(run.view)) return;
  const def = viewDef();
  let to = run.back.pop();
  if (!to) to = (def && def.back) || WALLS[run.wall || 0];
  run.view = to; if (isWall(to)) { run.wall = WALLS.indexOf(to); run.back = []; }
  sfx('move'); renderNav(); redraw(); persistSoon();
}
function turn(d) {
  if (!run || run.over) return;
  if (!isWall(run.view)) return;
  const i = (WALLS.indexOf(run.view) + d + 4) % 4;
  run.view = WALLS[i]; run.wall = i; run.back = [];
  sfx('move'); renderNav(); redraw(); persistSoon(); coachEvent('rotate');
}

// ---------- input ----------
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * LW, y: (e.clientY - r.top) / r.height * LH }; }
cv.addEventListener('click', e => { const p = toLogical(e); tapAt(p.x, p.y); });
cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const p = toLogical(e); cv.classList.toggle('hot', !!spotAt(p.x, p.y)); });
function tapAt(x, y) {
  if (!run || run.over || paused) return;
  if (AU) AU.ctx();
  ripples.push({ x, y, t: now() }); redraw();
  const sp = spotAt(x, y);
  if (!sp) { if (run.sel) { /* keep the selection */ } return; }
  const sel = run.sel;
  if (sel && sp.use) {
    let r = false;
    try { r = sp.use(sel); } catch (e) { if (DEBUG) console.error(e); }
    if (r) { run.sel = null; coachEvent('use'); afterAction(); return; }
    if (!sp.tap || sp.useOnly) { say(T('ここでは使えないようだ')); sfx('fail'); afterAction(); return; }
  }
  if (sp.go && !sp.tap) { goView(sp.go); afterAction(); return; }
  if (sp.tap) { try { sp.tap(); } catch (e) { if (DEBUG) console.error(e); } if (sp.go) goView(sp.go); else sfx('tap'); afterAction(); return; }
  if (sp.say) { say(T(sp.say)); sfx('tap'); afterAction(); }
}
function afterAction() { renderInv(); renderNav(); renderHintBadge(); redraw(); persistSoon(); }
$('navL').addEventListener('click', () => turn(-1));
$('navR').addEventListener('click', () => turn(1));
$('navBack').addEventListener('click', goBack);
document.addEventListener('keydown', e => {
  if (!run || run.over || paused || anyOverlay()) return;
  if (e.key === 'ArrowLeft') { turn(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { turn(1); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'Escape' || e.key === 'Backspace') { goBack(); e.preventDefault(); }
  else if (e.key === 'h' || e.key === 'H') openHints();
});

// ---------- bag ----------
const iconCache = new Map();
function give(id) {
  if (!run || run.inv.includes(id)) return;
  run.inv.push(id); run.S.got = run.S.got || {}; run.S.got[id] = 1;
  newSlot = id; sfx('pop'); vibrate(20);
  say(T('「{name}」を手に入れた', { name: itemName(id) }));
  coachEvent('pickup');
}
function take(id) { if (!run) return; run.inv = run.inv.filter(x => x !== id); if (run.sel === id) run.sel = null; if (run.view === 'i:' + id) goBack(); }
let newSlot = null;
function renderInv() {
  const box = $('inv');
  if (!run || !run.inv.length) { box.innerHTML = '<span class="empty">' + esc(T('まだ何も持っていない')) + '</span>'; return; }
  box.innerHTML = '';
  for (const id of run.inv) {
    const it = run.room.items[id];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'slot' + (id === newSlot ? ' new' : ''); b.dataset.item = id;
    b.setAttribute('aria-pressed', run.sel === id ? 'true' : 'false');
    b.setAttribute('aria-label', T(it.name));
    const c = document.createElement('canvas'); c.width = 80; c.height = 80;
    const g = c.getContext('2d'); g.scale(2, 2);
    try { it.icon(g, 40, run.S); } catch (e) { if (DEBUG) console.error(e); }
    b.appendChild(c);
    b.addEventListener('click', () => slotTap(id));
    box.appendChild(b);
  }
  newSlot = null;
}
function slotTap(id) {
  if (!run || run.over || paused) return;
  if (AU) AU.ctx();
  const sel = run.sel;
  if (sel === id) { // the second tap: look closer
    goView('i:' + id); say(T(run.room.items[id].desc || run.room.items[id].name)); coachEvent('inspect'); afterAction(); return;
  }
  if (sel && sel !== id) {
    const rc = (run.room.combos || []).find(c => (c.a === sel && c.b === id) || (c.a === id && c.b === sel));
    if (rc) {
      run.inv = run.inv.filter(x => x !== rc.a && x !== rc.b); run.sel = null; if (rc.run) rc.run();
      run.inv.push(rc.out); run.S.got = run.S.got || {}; run.S.got[rc.out] = 1; newSlot = rc.out; run.sel = rc.out;
      if (run.view.startsWith('i:')) { run.view = 'i:' + rc.out; }
      sfx('clear'); vibrate(30);
      say(T('「{name}」ができた！', { name: itemName(rc.out) }));
      coachEvent('combine'); afterAction(); return;
    }

  if (a.startsWith('i:')) { if (!run.inv.includes(a.slice(2))) return false; slotTap(a.slice(2)); return true; }
  if (a.startsWith('s:')) { const p = where(a.slice(2), true); if (!p) return false; tapAt(p.x, p.y); return true; }
  if (a === 'slide') { const ms = run.room.slideMoves ? run.room.slideMoves(run.S) : []; for (const k of ms) { const p = where('tile' + k, true); if (!p) return false; tapAt(p.x, p.y); } return true; }

}
// a point inside the spot that no later spot covers (logical, or page coordinates for real clicks)
function where(id, logical) {
  const l = curSpots(), i = l.findIndex(s => s.id === id); if (i < 0) return null;
  const sp = l[i];
  const cands = [];
  if (sp.r != null) { cands.push([sp.cx, sp.cy]); for (let a = 0; a < 8; a++) cands.push([sp.cx + Math.cos(a) * sp.r * 0.6, sp.cy + Math.sin(a) * sp.r * 0.6]); }
  else for (const fy of [0.5, 0.3, 0.7, 0.15, 0.85]) for (const fx of [0.5, 0.3, 0.7, 0.15, 0.85]) cands.push([sp.x + sp.w * fx, sp.y + sp.h * fy]);
  const pt = cands.find(([x, y]) => { const s = spotAt(x, y); return s && s.id === id; });
  if (!pt) return null;
  if (logical) return { x: pt[0], y: pt[1] };
  const r = cv.getBoundingClientRect();
  return { x: r.left + pt[0] / LW * r.width, y: r.top + pt[1] / LH * r.height };
}

      title: !$('ovTitle').hidden, story: !$('ovStory').hidden, result: !$('ovResult').hidden, hint: !$('ovHint').hidden, howto: !$('howto').hidden,
      msg: $('msgText').textContent, save: JSON.parse(JSON.stringify(save)), last: lastResult,

    lose() { return false; },

    tutorial: () => ({ step: run ? run.tut : null, done: !!save.tut }),

    start: i => { hideOverlays(); startRoom(i); return api.state(); },
