<style>
/* ころがし工房ゴルフ: green felt and warm wood. --kb-* are the shared tokens re-tinted; --mg-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #18201a; --kb-surface: #222c23; --kb-surface-2: #2b372b; --kb-sunken: #0f150f; --kb-line: #3d4c3c;
  --kb-ink: #eef4e8; --kb-dim: #b6c4ae;
  --kb-accent: #f0c04a; --kb-accent-ink: #2a2005; --kb-accent-text: #f6d06a; --kb-accent-soft: rgba(240, 192, 74, .15);
  --kb-scrim: rgba(8, 12, 8, .76); --kb-focus: #ffe08a;
  --mg-panel: rgba(230, 255, 220, .07); --mg-line: rgba(220, 245, 210, .17); --mg-card: linear-gradient(#263226, #1b231b);
  --mg-btn: linear-gradient(#ffd666, #e8a62c); --mg-btn-shadow: #8a5a13; --mg-good: #8fe08a; --mg-bad: #ff9a7a; --mg-under: #7ad0ff;
  --mg-title: linear-gradient(90deg, #a8f08a, #f0c04a 55%, #ff9a6a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #eef2e4; --kb-surface: #fbfdf6; --kb-surface-2: #f2f6ea; --kb-sunken: #d8dfca; --kb-line: #cbd5b8;
    --kb-ink: #23301f; --kb-dim: #56664c;
    --kb-accent: #c9840e; --kb-accent-ink: #ffffff; --kb-accent-text: #8f5c06; --kb-accent-soft: rgba(201, 132, 14, .12);
    --kb-scrim: rgba(35, 48, 31, .45); --kb-focus: #1f6fbf;
    --mg-panel: rgba(35, 48, 31, .05); --mg-line: #cfd8be; --mg-card: linear-gradient(#fbfdf6, #eff4e4);
    --mg-btn: linear-gradient(#f2b23a, #d8891a); --mg-btn-shadow: #7f4f0c; --mg-good: #2a8a34; --mg-bad: #c2412a; --mg-under: #1a6fb0;
    --mg-title: linear-gradient(90deg, #2f8a3a, #c9840e 55%, #c2412a);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #eef2e4; --kb-surface: #fbfdf6; --kb-surface-2: #f2f6ea; --kb-sunken: #d8dfca; --kb-line: #cbd5b8;
  --kb-ink: #23301f; --kb-dim: #56664c;
  --kb-accent: #c9840e; --kb-accent-ink: #ffffff; --kb-accent-text: #8f5c06; --kb-accent-soft: rgba(201, 132, 14, .12);
  --kb-scrim: rgba(35, 48, 31, .45); --kb-focus: #1f6fbf;
  --mg-panel: rgba(35, 48, 31, .05); --mg-line: #cfd8be; --mg-card: linear-gradient(#fbfdf6, #eff4e4);
  --mg-btn: linear-gradient(#f2b23a, #d8891a); --mg-btn-shadow: #7f4f0c; --mg-good: #2a8a34; --mg-bad: #c2412a; --mg-under: #1a6fb0;
  --mg-title: linear-gradient(90deg, #2f8a3a, #c9840e 55%, #c2412a);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 65%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 6px 0; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--mg-panel); border: 1px solid var(--mg-line); color: var(--kb-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
#holeChip { flex: 1 1 auto; min-width: 0; overflow: hidden; display: flex; gap: 4px; color: var(--kb-dim); background: transparent; border: 0; padding-left: 2px; font-size: 12.5px; }
#holeChip b { flex: none; color: var(--kb-ink); }
#holeChip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#strokeChip.bump { animation: gain .4s ease-out; }
#strokeChip.pen { color: var(--mg-bad); }
.icon { position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--mg-line); background: var(--mg-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; font: 800 15px var(--kb-font-body); }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 4px 6px 6px; gap: 6px; }
#stageWrap { flex: 1 1 auto; min-height: 120px; position: relative; overflow: hidden; }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: crosshair; }
#bar { flex: none; display: flex; gap: 6px; align-items: stretch; }
#cardBtn { flex: none; min-width: 88px; min-height: 48px; border-radius: 14px; border: 1px solid var(--mg-line); background: var(--kb-surface); color: var(--kb-ink); box-shadow: 0 3px 0 var(--kb-sunken); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 2px 8px; font: 800 12px var(--kb-font-body); touch-action: manipulation; font-variant-numeric: tabular-nums; line-height: 1.2; }
#cardBtn b { font-size: 15px; }
#cardBtn b.under { color: var(--mg-under); } #cardBtn b.over { color: var(--mg-bad); }
#cardBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--kb-sunken); }
#meter { flex: 1 1 auto; min-width: 0; min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--mg-line); background: var(--mg-panel); position: relative; overflow: hidden; display: flex; align-items: center; padding: 0 12px; }
#meterFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #7ad06a, #ffd666 60%, #ff8a5a); opacity: .85; transition: width .05s linear; }
#meterText { position: relative; font-size: 12.5px; font-weight: 800; color: var(--kb-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 var(--kb-surface); }
#meter.live #meterText { color: #1a2010; text-shadow: none; }
#tip { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; padding: 6px 10px; border-radius: 12px; background: rgba(18, 26, 18, .92); color: #f2f8ea; border: 1px solid rgba(220, 245, 210, .25); font-size: 12.5px; font-weight: 800; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; }
#tip.coach { border-color: #f0c04a; background: rgba(50, 42, 12, .95); }
#tip.bad { border-color: #ff9a7a; }
#tip .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; margin-right: 6px; border-radius: 999px; background: #f0c04a; color: #2a2005; }
#tip small { display: block; font-weight: 500; opacity: .85; }
#tip.bottom { top: auto; bottom: 8px; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.card { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--mg-card); border: 1px solid var(--mg-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); overflow: hidden; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--mg-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 27px; line-height: 1.2; }
.card h2.big { font-size: 30px; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--mg-btn); color: #2a1606; font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--mg-btn-shadow); text-decoration: none; touch-action: manipulation; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mg-btn-shadow); }
.btn.sub { background: var(--mg-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--mg-line); font-size: 13.5px; min-height: 44px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; }
.btn .stk { display: flex; flex-direction: column; align-items: center; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.courses { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 8px; }
.ct { position: relative; min-width: 0; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 60px; border-radius: 16px; border: 1px solid var(--mg-line); background: var(--kb-surface); color: var(--kb-ink); cursor: pointer; font: 800 14px var(--kb-font-body); padding: 6px 10px; text-align: left; box-shadow: 0 2px 0 var(--kb-sunken); touch-action: manipulation; }
.ct canvas { flex: none; width: 34px; height: 48px; border-radius: 6px; }
.ct .ctx { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; }
.ct small { font-size: 11px; font-weight: 500; color: var(--kb-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ct b.rec { flex: none; font-size: 12px; color: var(--kb-accent-text); font-variant-numeric: tabular-nums; }
.ct:disabled { opacity: .5; cursor: default; box-shadow: none; }
.ct .lock { width: 18px; height: 18px; color: var(--kb-dim); flex: none; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.tab { min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--mg-line); background: var(--mg-panel); color: var(--kb-ink); cursor: pointer; font: 800 12px var(--kb-font-body); padding: 4px; line-height: 1.2; touch-action: manipulation; }
.tab.sel { border-color: var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-accent-text); }
.tab:disabled { opacity: .45; cursor: default; }
.holes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.hb { position: relative; min-width: 0; min-height: 56px; border-radius: 14px; border: 1px solid var(--mg-line); background: var(--kb-surface); color: var(--kb-ink); cursor: pointer; font: 800 14px var(--kb-font-body); padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 2px 0 var(--kb-sunken); touch-action: manipulation; }
.hb small { font-size: 10px; font-weight: 500; color: var(--kb-dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; box-sizing: border-box; }
.hb .pb { font-size: 11px; color: var(--kb-accent-text); }
.res { display: grid; grid-template-columns: 1fr; gap: 4px; margin: 6px 0 2px; text-align: left; }
.res div { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: var(--mg-panel); border: 1px solid var(--mg-line); font-size: 12.5px; font-weight: 800; }
.res div b { margin-left: auto; font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px auto; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.big { font-size: 15px; font-weight: 800; color: var(--kb-ink); margin: 2px 0; }
table.sc { width: 100%; border-collapse: collapse; margin: 6px 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
table.sc th, table.sc td { border: 1px solid var(--mg-line); padding: 4px 0; font-size: 12px; text-align: center; }
table.sc th { font-weight: 800; color: var(--kb-dim); background: var(--mg-panel); }
table.sc th:first-child, table.sc td:first-child { width: 3.6em; font-size: 10.5px; }
table.sc td { font-weight: 800; color: var(--kb-ink); }
table.sc td.under { color: var(--mg-under); } table.sc td.over { color: var(--mg-bad); } table.sc td.ace { color: #fff; background: #2f8a3a; }
table.sc td.cur { box-shadow: inset 0 0 0 2px var(--kb-accent); }
table.sc td.tot, table.sc th.tot { width: 2.6em; }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.5; color: var(--kb-ink); }
.howto li { margin: 4px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--mg-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--mg-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
body.thumb header, body.thumb #bar, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #tip { display: none !important; }
body.thumb #main { padding: 0; max-width: none; }

@keyframes rise { from { transform: translateY(12px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes gain { 0% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .card, .overlay, #strokeChip.bump { animation: none; } }
@media (max-width: 359px) { .chip { padding: 4px 6px; font-size: 12px; } #cardBtn { min-width: 76px; } }
@media (max-height: 600px) { .card { padding: 12px 12px 8px; } .btn { min-height: 46px; margin-top: 6px; } .card h2.logo { font-size: 23px; } .ct { min-height: 52px; } }
/* landscape phones: the hole lies on its side; the scorecard and meter go in a column on the right */
@media (orientation: landscape) and (max-height: 560px) {
  header { padding-top: 0; max-width: none; }
  #main { flex-direction: row; max-width: none; padding-top: 2px; }
  #bar { flex-direction: column; width: min(170px, 30vw); }
  #cardBtn { flex: 1 1 auto; }
  #meter { flex: 1 1 auto; }
  .card { max-width: 660px; }
  .howto { max-width: 680px; }
  .courses { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ct canvas { display: none; }
  .holes { grid-template-columns: repeat(9, minmax(0, 1fr)); }
  .card h2.logo { font-size: 22px; }
}
</style>
</head>

<script src="engine.js"></script>
<script src="holes.js"></script>
<script src="art.js"></script>
<script src="../common/game.js"></script>
<script>
(() => {
'use strict';
// ころがし工房ゴルフ — an original mini golf on a workbench. minigolf/engine.js is the deterministic ball physics
// (also run headless by tools/tests/minigolf-levels.js), minigolf/holes.js the 27 holes, minigolf/art.js the drawing,
// and this file the chrome: pull-back aiming, the scorecard, rounds / practice / today's hole, saving and the platform events.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const MG = window.MinigolfEngine, ART = window.MinigolfArt, HOLES = window.MinigolfHoles, COURSES = window.MinigolfCourses;
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'minigolf';
const SAVE_KEY = 'kusoge.minigolf.save';  // records per course (registry: per-field merge)
const RUN_KEY = 'kusoge.minigolf.run';    // the round / hole in progress (this device only)
const HOWTO_KEY = 'kusoge.minigolf.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L2 = a => (a ? (EN ? a[1] : a[0]) : '');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
const now = () => performance.now();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
const lastSfx = {};
function sfx(name, gap, a) { if (!AU) return; const t = now(); if (gap && lastSfx[name] && t - lastSfx[name] < gap) return; lastSfx[name] = t; AU.sfx(name, a); }
function tone(f, d, o, key, gap) { if (!AU) return; const t = now(); if (key && lastSfx[key] && t - lastSfx[key] < gap) return; if (key) lastSfx[key] = t; AU.tone(f, d, o); }
function vibrate(p) { if (AU && AU.vibrate) AU.vibrate(p); }
const coursePar = ci => HOLES.filter(h => h.course === ci).reduce((s, h) => s + h.par, 0);
const courseHoles = ci => HOLES.filter(h => h.course === ci);
const signed = d => (d === 0 ? T('イーブン') : (d > 0 ? '+' : '−') + Math.abs(d));

// ---------- save ----------
function defSave() { return { v: 1, c: {}, under: 0, done: 0, stats: { rounds: 0, holes: 0, strokes: 0, aces: 0, birdies: 0, ink: 0, daily: 0 }, tut: 0 }; }
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const out = Object.assign(d, s);
  out.c = s.c && typeof s.c === 'object' && !Array.isArray(s.c) ? s.c : {};
  out.stats = Object.assign(defSave().stats, s.stats && typeof s.stats === 'object' ? s.stats : {});
  recount(out);
  return out;
}
// under = for each course, how many strokes under par the best round was (never below 0); done = courses with a finished round
function recount(s) {
  let u = 0, dn = 0;
  COURSES.forEach((C, k) => { const r = s.c[C.id]; if (!r) return; if (r.r > 0) dn++; if (r.b > 0) u += Math.max(0, coursePar(k) - r.b); });
  s.under = Math.max(s.under | 0, u); s.done = Math.max(s.done | 0, dn);
}
let save = readSave();
function writeSave() { recount(save); if (!DEBUG_NOSAVE) store.set(SAVE_KEY, JSON.stringify(save)); }
const courseRec = ci => save.c[COURSES[ci].id] || null;
const courseOpen = ci => ci === 0 || !!(courseRec(ci - 1) && courseRec(ci - 1).r > 0) || !!(courseRec(ci) && courseRec(ci).r > 0);
let DEBUG_NOSAVE = false;

// ---------- state ----------
let G = null;            // the engine game of the hole being played
let run = null;          // { mode: 'course' | 'practice' | 'daily', ci, hi (hole index in HOLES), card: [strokes], dk, seed, started, wall }
let paused = false, menuOpen = false, frozen = false;
let acc = 0, lastT = now(), raf = 0, evRead = 0;
let aim = null;          // { id, x0, y0, a, p, kb } while aiming
let tut = null;          // tutorial step (course 1, hole 1, first time)
let fx = [], trail = [], sinkT = 0, needDraw = true, holeEnd = null, lastRound = null;
let pend = null;         // the shot being rolled (saved so a reload replays it instead of taking it back)
const hole = () => (run ? HOLES[run.hi] : HOLES[0]);

// ---------- canvas & view ----------
const cv = $('board'), ctx = cv.getContext('2d');
const wrap = $('stageWrap');
let V = null;
function layout() {
  const r = wrap.getBoundingClientRect();
  const W = Math.max(100, Math.floor(r.width)), Hh = Math.max(100, Math.floor(r.height));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const h = hole();
  // a tall hole lies on its side when the stage is wide
  const bb = MG.prep(h).bb, tall = (bb.y1 - bb.y0) > (bb.x1 - bb.x0);
  const rot = tall && W > Hh * 1.12;
  if (!V || V.W !== W || V.H !== Hh || V.dpr !== dpr || V.hole !== h || V.rot !== rot) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
    V = ART.view(h, W, Hh, dpr, rot);
  }
  needDraw = true;
}
function draw(t) {
  if (!V) return;
  const ghost = tut === 0 && G && G.st === 'rest' && !aim ? { a: -90, p: 0.75 } : null;
  ART.frame(ctx, V, { G, t, aim: aim && aim.p > 0 ? aim : null, fx, trail, ghost, sinkK: G && G.st === 'sunk' ? Math.min(1, (now() - sinkT) / 400) : null });
}

// ---------- the loop ----------
function loop(t) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;
  let stepped = false;
  if (G && playing() && !paused && !frozen && !menuOpen && !anyOverlay() && !G.done()) {
    acc += dt;
    let n = 0;
    while (acc >= MG.DT && n < 8) {
      const was = G.st;
      G.step(); acc -= MG.DT; n++;
      if (G.st === 'roll' && (G.tick % 3 === 0)) { trail.push([G.x, G.y]); if (trail.length > 14) trail.shift(); }
      if (was !== 'rest' && G.st === 'rest') { onRest(); }
      if (was === 'rest' && G.st === 'roll' && !pend) { cancelAim(); } // pushed by a gear or ruler while aiming
      if (G.done()) break;
    }
    if (n >= 8) acc = 0;
    stepped = n > 0;
    if (stepped) pumpEvents();
    if (G.done() && !holeEnd) onHoleEnd();
  }
  const moving = G && (MG.prep(hole()).gears.length || MG.prep(hole()).rulers.length);
  const anim = fx.length || tut === 0 || (G && G.st !== 'rest') || moving || aim;
  if (stepped || needDraw || anim) { draw(t / 1000); needDraw = false; }
  if (fx.length) fx = fx.filter(f => t / 1000 - f.t0 < f.d);
  if (G && G.st === 'rest' && trail.length && !aim) { trail.shift(); needDraw = true; }
}
const playing = () => !!(run && run.started);

// ---------- engine events → effects and sounds ----------
function pumpEvents() {
  const evs = G.events, first = G.evN - evs.length;
  if (evRead < first) evRead = first;
  const t = now() / 1000;
  for (; evRead < G.evN; evRead++) {
    const e = evs[evRead - first];
    if (e.k === 'wall') { const v = Math.min(1, e.a / 8); tone(180 + v * 140, 0.05, { type: 'triangle', vol: 0.04 + v * 0.08 }, 'wall', 60); }
    else if (e.k === 'hit') { sfx('hit', 80); vibrate(10); }
    else if (e.k === 'bump') { tone(300, 0.14, { type: 'triangle', vol: 0.1, slide: 760 }, 'bump', 90); vibrate(12); const b = hole().bumpers[e.a]; if (b) fx.push({ k: 'ring', x: b[0], y: b[1], r: 0.6, c: '255,230,150', t0: t, d: 0.35 }); }
    else if (e.k === 'pipe') { if (e.a === 0) tone(520, 0.2, { type: 'sine', vol: 0.09, slide: 140 }); else tone(180, 0.16, { type: 'sine', vol: 0.09, slide: 620 }); }
    else if (e.k === 'ink') { if (AU) AU.noise(0.25, { vol: 0.14, freq: 700 }); sfx('fail'); vibrate([20, 30, 20]); fx.push({ k: 'ink', x: e.x || G.x, y: e.y || G.y, t0: t, d: 0.7 }); showTip({ text: T('インク！ 罰打1'), sub: T('打つ前の場所にもどった'), bad: true }, 2400); hud(true); }
    else if (e.k === 'out') { sfx('error'); showTip({ text: T('場外：打つ前の場所にもどった'), bad: true }, 2000); }
    else if (e.k === 'lip') tone(700, 0.05, { type: 'square', vol: 0.03 });
    else if (e.k === 'cup') { sinkT = now(); tone(440, 0.06, { type: 'square', vol: 0.05 }); setTimeout(() => sfx('coin'), 120); vibrate([20, 40, 30]); fx.push({ k: 'cup', x: hole().cup[0], y: hole().cup[1], t0: t, d: 1.2 }); }
  }
}

// ---------- HUD ----------
const HS = {};
function setText(id, s) { if (HS[id] !== s) { HS[id] = s; $(id).textContent = s; } }
function hud(bump) {
  const h = hole();
  if (!run) { setText('parChip', T('パー {n}', { n: h.par })); setText('strokeChip', T('{n} 打', { n: 0 })); $('cardBtn').hidden = true; meter(0); return; }
  setText('parChip', T('パー {n}', { n: h.par }));
  const n = G ? G.strokes : 0;
  setText('strokeChip', T('{n} 打', { n }));
  $('strokeChip').classList.toggle('pen', !!(G && G.pen));
  $('strokeChip').setAttribute('aria-label', T('打数') + ' ' + n + ' / ' + T('打てるのは {n} 打まで', { n: h.par + 4 }));
  if (bump) flash('strokeChip', 'bump');
  // the scorecard button: the round total against par so far
  const tb = $('cardTot');
  if (run.mode === 'course') {
    const d = cardDiff(run.card, run.ci);
    tb.textContent = run.card.length ? signed(d) : '–';
    tb.className = d < 0 ? 'under' : d > 0 ? 'over' : '';
    $('cardBtn').hidden = false;
  } else { $('cardBtn').hidden = true; }
  meter(aim ? aim.p : 0);
}
function cardDiff(card, ci) { const hs = courseHoles(ci); let d = 0; card.forEach((s, i) => { d += s - hs[i].par; }); return d; }
function flash(id, cls) { const el = $(id); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
let meterKey = '';
function meter(p) {
  const live = !!(aim && p > 0);
  const k = live ? Math.round(p * 100) : -1;
  const key = k + '|' + (G && G.st) + '|' + EN;
  if (key === meterKey) return; meterKey = key;
  $('meterFill').style.width = live ? Math.round(p * 100) + '%' : '0%';
  $('meter').classList.toggle('live', live);
  $('meter').setAttribute('aria-valuenow', live ? String(k) : '0');
  $('meterText').textContent = live ? T('強さ {n}%', { n: k }) : aim ? T('はなすと打つ。もどすとやめる') : T('ひっぱって打つ');
}

// ---------- aiming (pull back like a slingshot, from anywhere on the board) ----------
const pullMax = () => Math.max(110, Math.min(260, Math.min(V ? V.W : 300, V ? V.H : 300) * 0.42));
const canAim = () => G && playing() && G.st === 'rest' && !paused && !menuOpen && !anyOverlay();
function aimFrom(dx, dy) { // pull vector in CSS px (start − now) → { a, p }
  const len = Math.sqrt(dx * dx + dy * dy);
  const p = len < 14 ? 0 : Math.min(1, (len - 14) / (pullMax() - 14));
  const w = V.dirWorld(dx, dy);
  return { a: MG.qa(Math.atan2(w.y, w.x) * 180 / Math.PI), p: MG.qp(p) };
}
cv.addEventListener('pointerdown', e => {
  if (aim && aim.id !== e.pointerId) { cancelAim(); return; } // a second finger cancels
  if (!canAim()) return;
  if (AU) AU.ctx();
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  aim = { id: e.pointerId, x0: e.clientX, y0: e.clientY, a: 0, p: 0 };
  sfx('tap'); needDraw = true; meter(0);
});
cv.addEventListener('pointermove', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const q = aimFrom(aim.x0 - e.clientX, aim.y0 - e.clientY);
  const tick = Math.round(q.p * 10);
  if (tick !== Math.round(aim.p * 10) && q.p > 0) tone(300 + tick * 50, 0.025, { type: 'sine', vol: 0.03 }, 'pull', 30);
  aim.a = q.a; aim.p = q.p; needDraw = true; meter(aim.p);
});
cv.addEventListener('pointerup', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const a = aim; aim = null; meter(0);
  if (a.p > 0 && canAim()) shoot(a.a, a.p); else { needDraw = true; }
});
cv.addEventListener('pointercancel', e => { if (aim && e.pointerId === aim.id) cancelAim(); });
function cancelAim() { if (!aim) return; aim = null; needDraw = true; meter(0); }
// keyboard: ← → aim, ↑ ↓ power, Space / Enter shoots
window.addEventListener('keydown', e => {
  const tg = e.target && e.target.tagName;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tg)) return;
  if (/^(BUTTON|A)$/.test(tg) && (e.key === ' ' || e.key === 'Enter')) return;
  if (anyOverlay()) return;
  if (e.key === 'Escape') { if (aim) cancelAim(); else openMenu(); return; }
  if (!canAim()) return;
  const step = e.shiftKey ? 0.5 : 3;
  if (/^Arrow/.test(e.key)) {
    e.preventDefault();
    if (!aim) aim = { id: 'kb', kb: true, a: -90, p: 0.5 };
    const left = V && V.rot ? 'ArrowDown' : 'ArrowLeft', right = V && V.rot ? 'ArrowUp' : 'ArrowRight';
    if (e.key === left) aim.a = MG.qa(aim.a - step); else if (e.key === right) aim.a = MG.qa(aim.a + step);
    else if (e.key === (V && V.rot ? 'ArrowRight' : 'ArrowUp')) aim.p = MG.qp(Math.min(1, aim.p + 0.05)); else aim.p = MG.qp(Math.max(0.05, aim.p - 0.05));
    needDraw = true; meter(aim.p);
  } else if ((e.key === ' ' || e.key === 'Enter') && aim && aim.kb) { e.preventDefault(); const a = aim; aim = null; shoot(a.a, a.p); }
});

// ---------- shooting and the end of a stroke ----------
function shoot(a, p) {
  if (!G.shoot(a, p)) return false;
  pend = [a, p];
  persist(); // the stroke is saved before the ball rolls (a reload replays it)
  trail = [];
  tone(260 + p * 260, 0.07, { type: 'triangle', vol: 0.08 + p * 0.08 }); if (AU) AU.noise(0.04, { vol: 0.08, freq: 2400 });
  vibrate(12);
  hud(true);
  if (tut === 0) setTut(1);
  if (tut == null) $('tip').hidden = true;
  return true;
}
function onRest() {
  pend = null;
  if (G.st === 'over') return;
  persist();
  hud();
}
// the hole is over: in the cup, or the stroke limit
function onHoleEnd() {
  pend = null;
  const h = hole(), sunk = G.st === 'sunk', strokes = G.strokes;
  holeEnd = { sunk, strokes, hi: run.hi, mode: run.mode };
  aim = null; meter(0);
  const st = save.stats;
  if (sunk && run.mode !== 'practice') { st.holes = (st.holes | 0) + 1; st.strokes = (st.strokes | 0) + strokes; if (strokes === 1) st.aces = (st.aces | 0) + 1; if (strokes < h.par) st.birdies = (st.birdies | 0) + 1; st.ink = (st.ink | 0) + G.pen; }
  if (tut != null) endTut();
  if (run.mode === 'course') {
    run.card.push(strokes);
    // best per hole (fewest strokes)
    const C = COURSES[run.ci], rec = save.c[C.id] || { b: 0, r: 0, h: {} };
    if (!rec.h || typeof rec.h !== 'object') rec.h = {};
    const k = String(h.no); if (sunk && (!(rec.h[k] > 0) || strokes < rec.h[k])) rec.h[k] = strokes;
    save.c[C.id] = rec;
    if (sunk) emit('stage_clear', { stage: h.index + 1, stars: Math.max(0, Math.min(3, h.par + 1 - strokes)), mode: 'normal' });
    if (run.card.length >= 9) finishRound(); else writeSave();

    holeEnd.pts = pts; holeEnd.newBest = pts > 0 && (!prev || pts > (prev.best | 0));
    writeSave();
    emit('play_end', { mode: 'daily', dateKey: run.dk, score: pts, durationMs: Date.now() - run.wall, reason: sunk ? 'clear' : 'over', stats: { strokes, hole: h.index + 1 } });
    const now2 = PF && PF.daily ? PF.daily.get(run.dk, GAME) : null;
    holeEnd.best = Math.max(pts, now2 ? now2.best | 0 : 0, prev ? prev.best | 0 : 0);
    run.started = false;
  } else {
    writeSave();
    emit('play_end', { mode: 'practice', score: 0, durationMs: Date.now() - run.wall, reason: sunk ? 'clear' : 'over', stage: h.index + 1 });
    run.started = false;
  }
  if (run.mode !== 'course' || run.card.length >= 9) clearRun();
  else if (!DEBUG_NOSAVE) store.set(RUN_KEY, JSON.stringify({ v: 1, mode: 'course', ci: run.ci, hi: run.hi + 1, card: run.card, dk: null, seed: null, snap: null, pend: null, at: Date.now() }));
  if (sunk) { const nm = MG.scoreName(strokes, h.par); if (nm === 'ace' || nm === 'eagle' || nm === 'albatross') sfx('win'); else if (nm === 'birdie' || nm === 'par') sfx('clear'); else sfx('ok'); }
  else { sfx('over'); showTip({ text: T('打数の上限。次へ進もう'), bad: true }, 2200); }
  setTimeout(showHoleResult, reduceMotion.matches ? 300 : sunk ? 1100 : 1400);
}
function finishRound() {
  const ci = run.ci, C = COURSES[ci], rec = save.c[C.id], total = run.card.reduce((a, b) => a + b, 0), par = coursePar(ci);
  const beforeUnder = save.under, beforeBest = rec.b | 0;
  rec.r = (rec.r | 0) + 1;
  const newBest = !(rec.b > 0) || total < rec.b;
  if (newBest) rec.b = total;
  save.stats.rounds = (save.stats.rounds | 0) + 1;
  writeSave();
  lastRound = { ci, card: run.card.slice(), total, par, newBest: newBest && beforeBest > 0, firstRound: !(beforeBest > 0), best: rec.b, under: save.under };
  if (save.under > beforeUnder) emit('best', { score: save.under });
  emit('progress', { key: 'under', value: save.under });
  emit('play_end', { mode: 'normal', score: Math.max(0, par - total), durationMs: Date.now() - run.wall, reason: 'clear', stage: ci + 1, stats: { strokes: total, par } });
  run.started = false;
}

function startPlay(mode, extra) {

  const h = hole();
  if (mode === 'course') emit('play_start', { mode: 'normal', stage: run.ci + 1, resumed: !!run.resumed });

}
function endPlay(reason) {

  if (run.mode === 'course') emit('play_end', { mode: 'normal', score: 0, durationMs: Date.now() - run.wall, reason: reason || 'quit', stage: run.ci + 1 });
  else if (run.mode === 'daily') emit('play_end', { mode: 'daily', dateKey: run.dk, score: 0, durationMs: Date.now() - run.wall, reason: 'quit' });

function startCourse(ci) {

}

function dailyInfo(dk) {

  dk = dk && PF.isDateKey(dk) ? Number(dk) : PF.jstDateKey();
  const seed = PF.dailySeed(GAME, dk);

}
function startDaily(dk) {

// put the ball on the tee (or back where it was, from a saved snapshot)
function openHole(snap, pendShot) {
  hideOverlays();

  G = snap ? MG.restore(h, snap) : MG.create(h);
  evRead = G.evN; fx = []; trail = []; aim = null; holeEnd = null; acc = 0; lastT = now(); pend = null;
  if (pendShot && G.st === 'rest') { // a reload during a roll: play the saved stroke out at once
    G.shoot(pendShot[0], pendShot[1]); MG.settle(G); evRead = G.evN;
  }
  tut = run.mode === 'course' && h.index === 0 && !save.tut && G.strokes === 0 ? 0 : run.mode === 'course' && h.index === 0 && !save.tut && G.strokes > 0 ? 1 : null;
  Object.keys(HS).forEach(k => delete HS[k]); meterKey = '';
  const tag = run.mode === 'daily' ? T('今日のホール') : run.mode === 'practice' ? T('練習・{id}', { id: h.id }) : h.id;
  $('holeChip').innerHTML = '<b>' + esc(tag) + '</b><span>' + esc(L2(h.n)) + '</span>';
  cv.setAttribute('aria-label', T('ホール {id}', { id: h.id }) + ' ' + L2(h.n) + ' ' + T('パー {n}', { n: h.par }));
  layout(); hud();
  if (tut != null) coachTip(); else showTip({ text: L2(h.tip), sub: T('打てるのは {n} 打まで', { n: h.par + 4 }) }, 3800);

}

// ---------- autosave ----------
function persist() {
  if (DEBUG_NOSAVE || !run || !run.started || !G) return;
  if (run.mode === 'practice') return;
  if (G.st !== 'rest' && !pend) return;
  const snap = pend ? Object.assign(G.snap(), { tick: G.shots.length ? G.shots[G.shots.length - 1][0] : G.tick, x: G.lx, y: G.ly, strokes: G.strokes - 1 }) : G.snap();
  store.set(RUN_KEY, JSON.stringify({ v: 1, mode: run.mode, ci: run.ci, hi: run.hi, card: run.card, dk: run.dk, seed: run.seed, snap, pend: pend || null, at: Date.now() }));
}
function readRun() {
  let r = null; try { r = JSON.parse(store.get(RUN_KEY) || 'null'); } catch (e) { r = null; }
  if (!r || r.v !== 1 || !HOLES[r.hi] || !Array.isArray(r.card)) return null;
  if (r.mode === 'daily') { if (!PF || r.dk !== PF.jstDateKey()) return null; }
  else if (r.mode !== 'course' || r.card.length >= 9) return null;
  return r;
}
function clearRun() { store.del(RUN_KEY); }
function resumeRun() {
  const r = readRun(); if (!r) return;
  startPlay(r.mode, { ci: r.ci, hi: r.hi, card: r.card.filter(n => n > 0).slice(0, 8), dk: r.dk, seed: r.seed, resumed: true });
  openHole(r.snap, Array.isArray(r.pend) ? r.pend : null);
}

$('howtoGo').addEventListener('click', () => {
  store.set(HOWTO_KEY, '1'); $('howto').hidden = true;
  if (howtoFirst) { if (AU) AU.ctx(); startCourse(0); return; }
  if (!run || !run.started) showTitle(); else { lastT = now(); needDraw = true; }
});
$('howtoAlt').addEventListener('click', () => { store.set(HOWTO_KEY, '1'); if (howtoFirst) { save.tut = 1; writeSave(); } showTitle(); });
{ const s2 = KoboI18n.picker($('langPick')); if (s2) s2.id = 'langSel'; }

// ---------- sound, theme, menu ----------
function renderSound() {
  const b = $('sndBtn'), on = !(AU && AU.muted);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', T(on ? 'サウンド オン' : 'サウンド オフ'));
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  if (!AU) b.hidden = true;
}
$('sndBtn').addEventListener('click', () => { if (!AU) return; AU.toggleMute(); if (!AU.muted) sfx('ok'); });
if (AU) AU.onChange(renderSound);
function isLight() { return UI && UI.theme ? UI.theme.resolved() === 'light' : !(matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeColor() {
  const m = document.querySelector('meta[name="theme-color"]');
  const light = isLight();
  if (m) m.setAttribute('content', light ? '#eef2e4' : '#18201a');
  ART.setTheme(!light); needDraw = true;
}
let pm = null;
$('menuBtn').addEventListener('click', () => openMenu());
function openMenu() {
  if (!UI) { showTitle(); return; }
  if (pm && pm.isOpen) return;
  cancelAim();
  const on = run && run.started;
  const extra = [{ label: T('遊び方'), icon: 'help', onClick: () => { pm.close(); showHowto(false); } }];
  if (on && run.mode === 'course') extra.push({ label: T('スコアカード'), icon: 'star', onClick: () => { pm.close(); showCard(); } });
  extra.push({ label: T('コースの選びへ'), icon: 'menu', onClick: () => { pm.close(); showTitle(); } });
  pm = UI.pauseMenu({
    title: T(on && G && G.st !== 'rest' ? '一時停止' : 'メニュー'), home: '../', extra,
    onResume: () => { menuOpen = false; lastT = now(); acc = 0; const g = KG(); if (g) g.menuClosed(); },
    onOpen: () => { menuOpen = true; const g = KG(); if (g) g.menuOpened(); persist(); },
  });
  pm.open();
}

// ---------- KoboGame: the ball rolls in real time (stops while hidden; waits for "Resume") ----------
if (window.KoboGame) KoboGame.register({
  id: GAME,
  pause() { paused = true; cancelAim(); persist(); },
  resume() { if (!paused) return; if (playing() && G && G.st !== 'rest' && !anyOverlay()) openMenu(); paused = false; lastT = now(); acc = 0; },
  save() { persist(); },
  isIdle: () => !(playing() && G && G.st !== 'rest'),
  dispose() { cancelAnimationFrame(raf); },
  daily: { start({ dateKey }) { startDaily(dateKey); } },
});
window.addEventListener('pagehide', () => persist());
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); lastT = now(); });
window.addEventListener('storage', e => { if (e.key === SAVE_KEY) { save = readSave(); if (!$('ovTitle').hidden) showTitle(); } });
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(themeColor, 0));
else { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeColor); } catch (e) {} }
window.addEventListener('resize', () => layout());
try { new ResizeObserver(() => layout()).observe(wrap); } catch (e) {}

// ---------- boot ----------
let booted = false;
ART.init({ MG });
renderSound(); themeColor();
// the first hole behind the title (nothing in play)
run = null; G = MG.create(HOLES[0]);
layout(); hud();
$('holeChip').innerHTML = '<b>1-1</b><span>' + esc(L2(HOLES[0].n)) + '</span>';
const launch = PF ? PF.launch() : { daily: null };
const firstVisit = store.get(HOWTO_KEY) == null && !save.tut && !save.stats.holes && !readRun();
if (launch.daily && PF) {
  const def = window.KoboGame && KoboGame.info && KoboGame.info().def;
  if (!(def && def.flags && def.flags.daily)) setTimeout(() => startDaily(launch.daily), 0);
} else if (firstVisit) showHowto(true);
else showTitle();
raf = requestAnimationFrame(loop);
booted = true;

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const api = {
    ready: () => booted,
    state: () => ({
      mode: run && run.started ? run.mode : 'title', hole: run ? hole().id : null, hi: run ? run.hi : -1, stage: run ? run.hi + 1 : 0, ci: run ? run.ci : -1,
      st: G ? G.st : null, strokes: G ? G.strokes : 0, pen: G ? G.pen : 0, x: G ? G.x : 0, y: G ? G.y : 0, tick: G ? G.tick : 0, shots: G ? G.shots.slice() : [],
      card: run ? run.card.slice() : [], par: hole().par, over: !!(G && G.done()), won: !!(G && G.st === 'sunk'), score: save.under, under: save.under,
      aim: aim ? { a: aim.a, p: aim.p } : null, tut, paused, menuOpen, rot: V ? V.rot : false, dk: run ? run.dk : null,
      title: !$('ovTitle').hidden, result: !$('ovHole').hidden, card2: !$('ovCard').hidden, practice: !$('ovPractice').hidden, howto: !$('howto').hidden,
      tip: $('tip').hidden ? '' : $('tip').textContent, save: JSON.parse(JSON.stringify(save)), last: holeEnd, round: lastRound,
    }),
    win() { if (!G || !playing()) return false; G.x = hole().cup[0]; G.y = hole().cup[1]; G.st = 'sunk'; if (!G.strokes) G.strokes = 1; G.ev('cup', G.strokes); pumpEvents(); onHoleEnd(); return true; },
    lose() { if (!G || !playing()) return false; G.strokes = G.limit; G.st = 'over'; onHoleEnd(); return true; },
    step(n) { if (!G) return 0; for (let i = 0; i < (n || 1) && !G.done(); i++) { const was = G.st; G.step(); if (was !== 'rest' && G.st === 'rest') onRest(); } pumpEvents(); if (G.done() && !holeEnd) onHoleEnd(); needDraw = true; return G.tick; },
    tutorial: () => ({ step: tut, done: !!save.tut }),
  };
  window.__kb = Object.assign(window.__kb || {}, api);
  window.__minigolf = {
    api, MG, HOLES, COURSES, get G() { return G; }, get save() { return save; }, get view() { return V; },
    course: ci => { startCourse(ci || 0); return api.state(); },
    practice: id => { startPractice(typeof id === 'number' ? id : HOLES.findIndex(h => h.id === id)); return api.state(); },
    daily: dk => { startDaily(dk); return api.state(); },
    dailyInfo,
    shoot: (a, p) => shoot(a, p),
    freeze: on => { frozen = !!on; acc = 0; lastT = now(); return frozen; }, // tests: stop the clock so waits and shots are exact
    replay: shots => { // the stored answer, the same way MinigolfEngine.play runs it
      for (const s of shots) { if (G.done()) break; MG.settle(G); for (let k = 0; k < s[0]; k++) G.step(); MG.settle(G); if (G.done()) break; shoot(s[1], s[2]); MG.settle(G); if (G.st === 'rest') onRest(); }
      pumpEvents(); if (G.done() && !holeEnd) onHoleEnd(); needDraw = true; return api.state();
    },
    settle: () => { const n = MG.settle(G); if (G.st === 'rest' && n) onRest(); pumpEvents(); if (G.done() && !holeEnd) onHoleEnd(); needDraw = true; return api.state(); },
    wait: n => { for (let i = 0; i < n; i++) G.step(); needDraw = true; return G.tick; },
    // where to press and release (CSS px on the page) for a shot of angle a (deg) and power p
    dragFor(a, p) {
      const r = cv.getBoundingClientRect(), b = V.toScreen(G.x, G.y);
      const rad = a * Math.PI / 180, wx = Math.cos(rad), wy = Math.sin(rad);
      // world direction → screen direction (the pull goes the other way)
      const sx = V.rot ? -wy : wx, sy = V.rot ? wx : wy;
      const len = 14 + p * (pullMax() - 14);
      const x0 = r.left + Math.max(20, Math.min(r.width - 20, b.x)), y0 = r.top + Math.max(20, Math.min(r.height - 20, b.y));
      return { x0, y0, x1: x0 - sx * len, y1: y0 - sy * len };
    },
    unlockAll: () => { COURSES.forEach(C => { save.c[C.id] = save.c[C.id] || { b: 0, r: 1, h: {} }; if (!(save.c[C.id].r > 0)) save.c[C.id].r = 1; }); writeSave(); },
    fps(ms) { return new Promise(res => { let f = 0; const t0 = performance.now(); const tick = () => { f++; if (performance.now() - t0 < ms) requestAnimationFrame(tick); else res(Math.round(f * 1000 / (performance.now() - t0))); }; requestAnimationFrame(tick); }); },
    persist, readRun, title: showTitle, howto: () => showHowto(false), menu: openMenu, card: showCard, practiceMenu: showPractice,
    thumbScene(id) { // a hole with the gear turning and the aim guide out, for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); DEBUG_NOSAVE = true;
      startPractice(HOLES.findIndex(h => h.id === (id || '2-1')));
      run.started = false;
      for (let i = 0; i < 40; i++) G.step();
      G.x = 4.1; G.y = 10.6;
      aim = { id: 'thumb', a: -78, p: 0.62 };
      layout(); $('tip').hidden = true; needDraw = true; draw(now() / 1000);
      return true;
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
