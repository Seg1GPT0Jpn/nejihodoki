<style>
/* ヒットアンドブロー: a detective's notebook at night (dark) or on paper (light).
   Hit = a filled mint badge with "H", Blow = an amber ring with "B" (shape + letter, not color alone).
   --kb-* are the shared tokens re-tinted to ink blue; --hb-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #14182b; --kb-surface: #1d2340; --kb-surface-2: #262d52; --kb-sunken: #0f1222; --kb-line: #353e6b;
  --kb-ink: #eef0ff; --kb-dim: #a9afd8;
  --kb-accent: #46d6b4; --kb-accent-ink: #06241d; --kb-accent-text: #62e2c4; --kb-accent-soft: rgba(70, 214, 180, .15);
  --kb-scrim: rgba(6, 8, 18, .78); --kb-toast-bg: rgba(10, 12, 26, .95); --kb-focus: #ffd36b;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --hb-hit: #46d6b4; --hb-hit-ink: #06241d; --hb-blow: #ffb547; --hb-blow-soft: rgba(255, 181, 71, .14);
  --hb-panel: rgba(220, 225, 255, .06); --hb-line: rgba(200, 210, 255, .16); --hb-tile: #262d52; --hb-tile-ink: #f4f5ff;
  --hb-key: linear-gradient(#2c3460, #232a4d); --hb-key-shadow: #0b0e1d; --hb-go: linear-gradient(#6ae8cb, #2fbf9c); --hb-go-shadow: #137a62;
  --hb-card: linear-gradient(#232a4d, #191e38); --hb-rule: rgba(160, 175, 255, .10);
  --hb-title: linear-gradient(90deg, #7af0d4, #b7c4ff 55%, #ffc56b);
  --hb-bad: #ff7a66; --hb-sym-stroke: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #eef0f6; --kb-surface: #ffffff; --kb-surface-2: #f4f6fb; --kb-sunken: #e2e6f1; --kb-line: #c9cfe3;
    --kb-ink: #1b2142; --kb-dim: #4f5880;
    --kb-accent: #0e9c7f; --kb-accent-ink: #ffffff; --kb-accent-text: #087560; --kb-accent-soft: rgba(14, 156, 127, .12);
    --kb-scrim: rgba(27, 33, 66, .45); --kb-toast-bg: rgba(27, 33, 66, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(27, 33, 66, .18);
    --hb-hit: #0e9c7f; --hb-hit-ink: #ffffff; --hb-blow: #b56a00; --hb-blow-soft: rgba(181, 106, 0, .10);
    --hb-panel: rgba(27, 33, 66, .04); --hb-line: #d3d8ea; --hb-tile: #ffffff; --hb-tile-ink: #1b2142;
    --hb-key: linear-gradient(#ffffff, #eef1f8); --hb-key-shadow: #c3c9de; --hb-go: linear-gradient(#22b896, #0e9c7f); --hb-go-shadow: #0a6b57;
    --hb-card: linear-gradient(#ffffff, #f4f6fb); --hb-rule: rgba(60, 80, 160, .08);
    --hb-title: linear-gradient(90deg, #0e8f75, #3b4fb8 55%, #b56a00);
    --hb-bad: #d1452f; --hb-sym-stroke: rgba(0, 0, 0, .55);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #eef0f6; --kb-surface: #ffffff; --kb-surface-2: #f4f6fb; --kb-sunken: #e2e6f1; --kb-line: #c9cfe3;
  --kb-ink: #1b2142; --kb-dim: #4f5880;
  --kb-accent: #0e9c7f; --kb-accent-ink: #ffffff; --kb-accent-text: #087560; --kb-accent-soft: rgba(14, 156, 127, .12);
  --kb-scrim: rgba(27, 33, 66, .45); --kb-toast-bg: rgba(27, 33, 66, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(27, 33, 66, .18);
  --hb-hit: #0e9c7f; --hb-hit-ink: #ffffff; --hb-blow: #b56a00; --hb-blow-soft: rgba(181, 106, 0, .10);
  --hb-panel: rgba(27, 33, 66, .04); --hb-line: #d3d8ea; --hb-tile: #ffffff; --hb-tile-ink: #1b2142;
  --hb-key: linear-gradient(#ffffff, #eef1f8); --hb-key-shadow: #c3c9de; --hb-go: linear-gradient(#22b896, #0e9c7f); --hb-go-shadow: #0a6b57;
  --hb-card: linear-gradient(#ffffff, #f4f6fb); --hb-rule: rgba(60, 80, 160, .08);
  --hb-title: linear-gradient(90deg, #0e8f75, #3b4fb8 55%, #b56a00);
  --hb-bad: #d1452f; --hb-sym-stroke: rgba(0, 0, 0, .55);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: repeating-linear-gradient(0deg, transparent 0 27px, var(--hb-rule) 27px 28px), radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 60%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 900px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--hb-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--hb-line); background: var(--hb-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.vs-slot { display: contents; }
#vsSlot .kvs-entry { height: 44px; min-width: 44px; }
.back:focus-visible, .icon:focus-visible, .key:focus-visible, .btn:focus-visible, .tab:focus-visible, .opt:focus-visible, .ms:focus-visible, .mp:focus-visible, .slot:focus-visible, summary:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 2px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--hb-panel); border: 1px solid var(--hb-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }
.chip.low { color: var(--hb-bad); }

#body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 6px; }
#left { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#right { flex: none; display: flex; flex-direction: column; gap: 6px; }

/* tutorial coach and the CPU strip */
.coach { flex: none; display: flex; align-items: center; gap: 8px; box-sizing: border-box; padding: 5px 5px 5px 10px; min-height: 48px; border-radius: 14px; background: var(--kb-surface); border: 1.5px solid var(--kb-accent); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); animation: rise .3s cubic-bezier(.2, 1.3, .4, 1); }
.coach .step { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font: 400 13px var(--kb-font-display); }
.coach p { flex: 1; min-width: 0; margin: 0; font-size: 12.5px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.coach p small { display: block; font-size: 11px; font-weight: 500; color: var(--kb-dim); margin-top: 1px; }
.coach .cbtn { flex: none; min-height: 44px; min-width: 64px; border-radius: 12px; border: 0; background: var(--kb-accent); color: var(--kb-accent-ink); font: 800 13px var(--kb-font-body); padding: 0 10px; cursor: pointer; }
.cpubar { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; box-sizing: border-box; padding: 4px 8px; min-height: 36px; border-radius: 12px; background: var(--hb-panel); border: 1px solid var(--hb-line); font-size: 12px; font-weight: 800; }
.cpubar .lbl { color: var(--kb-dim); }
.cpubar .code { display: inline-flex; gap: 2px; }
.cpubar .code .sym { width: 22px; height: 22px; font-size: 13px; border-radius: 6px; }
.cpubar .think { color: var(--kb-accent-text); }
.cpubar .sep { flex: 1; }

/* tabs and the notebook */
.tabs { flex: none; display: flex; gap: 4px; padding: 2px; border-radius: 14px; background: var(--hb-panel); border: 1px solid var(--hb-line); }
.tab { flex: 1; min-height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; position: relative; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-selected="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
.tab .dot { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--hb-blow); }
#main { flex: 1 1 auto; min-height: 60px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; border-radius: 14px; background: var(--hb-panel); border: 1px solid var(--hb-line); }
.hist { list-style: none; margin: 0; padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; }
.hist .empty { color: var(--kb-dim); font-size: 12.5px; text-align: center; padding: 14px 8px; line-height: 1.5; }
.row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 2px 6px; border-radius: 10px; border-bottom: 1px dashed var(--hb-line); }
.row.new { animation: rowIn .28s ease-out; }
.row:last-child { border-bottom: 0; }

<script src="../common/game.js"></script>
<script>
(() => {
'use strict';
// ヒットアンドブロー — the classic public-domain code-breaking game (also known as Bulls and Cows).
// Guess a hidden row of different symbols; each guess is answered with H (right symbol, right place) and B (right symbol, wrong place).
// Modes: solo (3 difficulties × digits / colors × repeats allowed or not), today's challenge (the same answer for everyone per JST day),
// CPU battle (guess each other's secret in turns; 3 CPU strengths) and the online battle (common/versus.js: the same answers in the same order).
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const PF = window.KoboPlatform || null, A = window.KoboAudio || null, UI = window.KoboUI || null, VS = window.KoboVersus || null;
const KG = () => window.KoboGame || null;
const GAME = 'hitblow';
const SAVE_KEY = 'kusoge.hitblow.save';   // records, settings, daily streak (registry: per-field merge)
const STATE_KEY = 'kusoge.hitblow.state'; // the unfinished solo / daily game on this device (not synced)
const HOWTO_KEY = 'kusoge.hitblow.howto'; // '1' = the how-to was shown
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Math.round(Number(n) || 0).toLocaleString(EN ? 'en-US' : 'ja-JP');
const fmtTime = ms => { const s = Math.floor((ms || 0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
function sfx(name, a) { if (A) A.sfx(name, a); }
function mkRng(seed) {
  if (PF && PF.rng) return PF.rng(seed >>> 0);
  if (VS && VS.rng) return VS.rng(seed >>> 0);
  let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const launch = PF ? PF.launch() : { daily: null };
const launchDaily = launch.daily || null;
const todayKey = () => (PF ? PF.jstDateKey() : Number(new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10).replace(/-/g, '')));
const prevDay = dk => (PF ? PF.addDays(dk, -1) : 0);

// ---------- the rules ----------
const DIFFS = {
  e: { len: 3, max: 8, mult: 1, ja: 'かんたん' },
  n: { len: 4, max: 10, mult: 2, ja: 'ふつう' },
  h: { len: 5, max: 12, mult: 3, ja: 'むずかしい' },
};
const CPU_NAMES = { 1: 'よわい', 2: 'ふつう', 3: 'つよい' };
// colorblind-safe palette (Okabe–Ito + white); every color also has its own shape and letter
const SHAPES = {
  circle: '<circle cx="12" cy="12" r="8.6"/>',
  tri: '<path d="M12 3.2L21.4 19.6H2.6z"/>',
  star: '<path d="M12 2.6l2.8 6.1 6.6.7-5 4.5 1.4 6.5L12 17.1l-5.8 3.3 1.4-6.5-5-4.5 6.6-.7z"/>',
  square: '<rect x="4" y="4" width="16" height="16" rx="2.5"/>',
  diamond: '<path d="M12 2.2L21.8 12 12 21.8 2.2 12z"/>',
  hex: '<path d="M7.2 3.4h9.6l4.8 8.6-4.8 8.6H7.2L2.4 12z"/>',
  heart: '<path d="M12 20.6S3.4 15.2 3.4 9.3A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.6 2.3c0 5.9-8.6 11.3-8.6 11.3z"/>',
  plus: '<path d="M9 3.2h6v5.8h5.8v6H15v5.8H9V15H3.2V9H9z"/>',
};
const COLORS = [
  { c: '#d55e00', l: 'R', ja: 'あか', shape: 'circle' },
  { c: '#e69f00', l: 'O', ja: 'だいだい', shape: 'tri' },
  { c: '#f0e442', l: 'Y', ja: 'きいろ', shape: 'star' },
  { c: '#009e73', l: 'G', ja: 'みどり', shape: 'square' },
  { c: '#56b4e9', l: 'S', ja: 'みずいろ', shape: 'diamond' },
  { c: '#0072b2', l: 'B', ja: 'あお', shape: 'hex' },
  { c: '#cc79a7', l: 'P', ja: 'むらさき', shape: 'heart' },
  { c: '#f4f4f4', l: 'W', ja: 'しろ', shape: 'plus' },
];
function mkCfg(sym, d, dup) {
  const dd = DIFFS[d] ? d : 'n', D = DIFFS[dd], col = sym === 'col';
  return { sym: col ? 'col' : 'num', d: dd, dup: !!dup, len: D.len, max: D.max, mult: D.mult, n: col ? 8 : 10 };
}
const DAILY_CFG = () => mkCfg('num', 'n', false);
const cfgKey = c => (c.sym === 'col' ? 'c' : 'n') + c.len + (c.dup ? 'x' : '');
const SEP = EN ? ' · ' : '・';
const cfgName = c => T(c.sym === 'col' ? 'いろ' : '数字') + SEP + T('{n}桁', { n: c.len }) + (c.dup ? SEP + T('重複あり') : '');
const chOf = i => String.fromCharCode(48 + i);

// H*10+B with reusable counters (fast enough for the CPU's search)
const CA = new Int8Array(10), CB = new Int8Array(10);
function hb(a, b) {
  let h = 0; CA.fill(0); CB.fill(0);
  for (let i = 0; i < a.length; i++) { const x = a.charCodeAt(i) - 48, y = b.charCodeAt(i) - 48; if (x === y) h++; else { CA[x]++; CB[y]++; } }

  return h * 10 + bl;
}
function judge(secret, guess) { const v = hb(secret, guess); return { h: Math.floor(v / 10), b: v % 10 }; }
const codeCache = {};
function allCodes(cfg) {
  const k = cfg.n + ':' + cfg.len + ':' + (cfg.dup ? 1 : 0);
  if (codeCache[k]) return codeCache[k];
  const out = [], buf = [];
  (function rec(depth, used) {
    if (depth === cfg.len) { out.push(buf.join('')); return; }
    for (let i = 0; i < cfg.n; i++) {
      if (!cfg.dup && (used & (1 << i))) continue;
      buf[depth] = chOf(i); rec(depth + 1, used | (1 << i));
    }
  })(0, 0);
  return (codeCache[k] = out);
}
function makeSecret(cfg, rnd) {
  let s = '';
  const pool = Array.from({ length: cfg.n }, (_, i) => i);
  for (let i = 0; i < cfg.len; i++) {
    if (cfg.dup) s += chOf(Math.floor(rnd() * cfg.n));
    else { const j = Math.floor(rnd() * pool.length); s += chOf(pool[j]); pool.splice(j, 1); }
  }
  return s;
}
function validCode(cfg, s) {
  if (typeof s !== 'string' || s.length !== cfg.len) return false;
  for (let i = 0; i < s.length; i++) { const x = idxOf(s[i]); if (!(x >= 0 && x < cfg.n)) return false; if (!cfg.dup && s.indexOf(s[i]) !== i) return false; }
  return true;
}
const filterBy = (list, rows) => list.filter(c => rows.every(r => hb(c, r.g) === r.h * 10 + r.b));
// score: fewer guesses and less time are better; the difficulty multiplies it
function scoreOf(cfg, n, ms) {
  const base = 100 * (cfg.max - n + 1), tb = Math.max(0, 240 - Math.floor((ms || 0) / 1000));
  return Math.round((base + tb) * cfg.mult * (cfg.dup ? 1.5 : 1));
}

// ---------- symbols on screen ----------
function symHTML(cfg, ch) {
  const i = idxOf(ch);
  if (cfg.sym === 'num') return '<span class="sym num">' + i + '</span>';
  const c = COLORS[i];
  return '<span class="sym col" style="--c:' + c.c + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + SHAPES[c.shape] + '</svg><b>' + c.l + '</b></span>';
}
const symName = (cfg, ch) => (cfg.sym === 'num' ? String(idxOf(ch)) : T(COLORS[idxOf(ch)].ja));
const codeHTML = (cfg, code) => Array.from(code, ch => symHTML(cfg, ch)).join('');
const codeText = (cfg, code) => Array.from(code, ch => symName(cfg, ch)).join(cfg.sym === 'num' ? '' : SEP);
const hbHTML = (h, b, big) => '<span class="hb h' + (h ? '' : ' zero') + (big ? ' big' : '') + '">' + h + '<small>H</small></span><span class="hb b' + (b ? '' : ' zero') + (big ? ' big' : '') + '">' + b + '<small>B</small></span>';
const hbText = (h, b) => T('ヒット{h}・ブロー{b}', { h, b });

// ---------- save ----------
const STAT_KEYS = ['plays', 'wins', 'losses', 'lucky', 'fast4', 'win5', 'winDup', 'cpuPlays', 'cpu1', 'cpu2', 'cpu3', 'vsSolved'];
function defSave() {
  const stats = {}; for (const k of STAT_KEYS) stats[k] = 0;
  return { v: 1, best: 0, bests: {}, stats, daily: { last: 0, win: 0, streak: 0, max: 0, res: null }, set: { sym: 'num', d: 'n', dup: false, cpu: 2 }, tut: 0 };
}
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const n = (v, def, lo, hi) => { v = Number(v); return isFinite(v) ? clamp(Math.floor(v), lo, hi) : def; };
  const o = { v: 1, best: n(s.best, 0, 0, 1e7), bests: {}, stats: {}, tut: n(s.tut, 0, 0, 1) };
  if (s.bests && typeof s.bests === 'object') for (const k of Object.keys(s.bests)) {
    const b = s.bests[k];
    if (/^[nc][345]x?$/.test(k) && b && typeof b === 'object') o.bests[k] = { s: n(b.s, 0, 0, 1e7), g: n(b.g, 0, 0, 99), t: n(b.t, 0, 0, 1e9) };
  }
  for (const k of STAT_KEYS) o.stats[k] = n(s.stats && s.stats[k], 0, 0, 1e9);
  const dl = s.daily && typeof s.daily === 'object' ? s.daily : {};
  o.daily = { last: n(dl.last, 0, 0, 99999999), win: n(dl.win, 0, 0, 99999999), streak: n(dl.streak, 0, 0, 1e6), max: n(dl.max, 0, 0, 1e6), res: null };
  if (dl.res && typeof dl.res === 'object' && Array.isArray(dl.res.rows)) {
    o.daily.res = { dk: n(dl.res.dk, 0, 0, 99999999), won: !!dl.res.won, g: n(dl.res.g, 0, 0, 99), s: n(dl.res.s, 0, 0, 1e7), ms: n(dl.res.ms, 0, 0, 1e9),
      a: typeof dl.res.a === 'string' ? dl.res.a.slice(0, 5) : '', rows: dl.res.rows.slice(0, 12).map(r => [n(r && r[0], 0, 0, 5), n(r && r[1], 0, 0, 5)]) };
  }
  o.daily.max = Math.max(o.daily.max, o.daily.streak);
  const st = s.set && typeof s.set === 'object' ? s.set : {};
  o.set = { sym: st.sym === 'col' ? 'col' : 'num', d: DIFFS[st.d] ? st.d : 'n', dup: !!st.dup, cpu: n(st.cpu, 2, 1, 3) };
  for (const k of Object.keys(o.bests)) o.best = Math.max(o.best, o.bests[k].s); // the rank value never trails a per-setting best
  return o;
}
let save = readSave();
function writeSave() {
  // never go below what another tab (or a sync) already stored
  const cur = readSave();
  save.best = Math.max(save.best, cur.best);
  for (const k of STAT_KEYS) save.stats[k] = Math.max(save.stats[k], cur.stats[k]);
  for (const k of Object.keys(cur.bests)) {
    const a = save.bests[k], b = cur.bests[k];
    if (!a) save.bests[k] = b;
    else { a.s = Math.max(a.s, b.s); if (b.g && (!a.g || b.g < a.g)) a.g = b.g; if (b.t && (!a.t || b.t < a.t)) a.t = b.t; }
  }
  save.daily.max = Math.max(save.daily.max, cur.daily.max, save.daily.streak);
  save.tut = Math.max(save.tut, cur.tut);
  store.set(SAVE_KEY, JSON.stringify(save));
}

// ---------- the game state ----------
// G.kind: 'solo' | 'daily' | 'practice'（today's answer again, no records） | 'cpu' | 'vs'
let G = null, menuOpen = false, pm = null, tab = 'hist', seedNext = null, cpuDelay = 750, cpuTimer = 0, vsSnap = null, booted = false;
const modeOf = g => (g.kind === 'daily' ? 'daily' : g.kind === 'practice' ? 'practice' : g.kind === 'cpu' || g.kind === 'vs' ? (g.kind === 'vs' && g.vs.practice ? 'practice' : 'versus') : 'normal');
function freshMemo(cfg) { return { s: new Array(cfg.n).fill(0), p: new Array(cfg.n * cfg.len).fill(0) }; }
function newG(kind, cfg, secret, o) {
  return Object.assign({ kind, cfg, secret, rows: [], cur: '', ms: 0, sessMs: 0, started: false, over: false, won: false, score: 0, dk: null, tut: false, memo: freshMemo(cfg), at: Date.now() }, o || {});
}
function rnd() { if (seedNext != null) { const r = mkRng(seedNext); seedNext = null; return r; } return Math.random; }
const playing = () => !!(G && G.started && !G.over);

// the unfinished solo / daily game survives a reload (turn-based: nothing is lost by closing the tab)
function persist() {
  if (!G || G.over || !G.started || !['solo', 'daily', 'practice'].includes(G.kind)) return;
  store.set(STATE_KEY, JSON.stringify({ v: 1, kind: G.kind, cfg: { sym: G.cfg.sym, d: G.cfg.d, dup: G.cfg.dup }, secret: G.secret, rows: G.rows.map(r => [r.g, r.h, r.b]),
    cur: G.cur, ms: Math.round(G.ms), dk: G.dk, memo: G.memo, tut: G.tut ? 1 : 0 }));
}
function clearState() { store.del(STATE_KEY); }
function readState() {
  let s = null; try { s = JSON.parse(store.get(STATE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object' || !['solo', 'daily', 'practice'].includes(s.kind) || !s.cfg) return null;
  const cfg = s.kind === 'solo' ? mkCfg(s.cfg.sym, s.cfg.d, s.cfg.dup) : DAILY_CFG();
  if (!validCode(cfg, s.secret) || !Array.isArray(s.rows)) return null;
  if (s.kind !== 'solo' && Number(s.dk) !== todayKey() && !(launchDaily && Number(s.dk) === launchDaily)) return null; // yesterday's daily is gone
  const g = newG(s.kind, cfg, s.secret, { dk: s.kind === 'solo' ? null : Number(s.dk), ms: clamp(Number(s.ms) || 0, 0, 1e9), tut: !!s.tut });
  for (const r of s.rows) { if (!Array.isArray(r) || !validCode(cfg, r[0])) return null; const j = judge(g.secret, r[0]); g.rows.push({ g: r[0], h: j.h, b: j.b }); }
  if (g.rows.length >= cfg.max || g.rows.some(r => r.h === cfg.len)) return null;
  if (typeof s.cur === 'string' && s.cur.length < cfg.len && /^[0-9]*$/.test(s.cur)) g.cur = Array.from(s.cur).filter((ch, i, a) => idxOf(ch) < cfg.n && (cfg.dup || a.indexOf(ch) === i)).join('');
  if (s.memo && Array.isArray(s.memo.s) && s.memo.s.length === cfg.n && Array.isArray(s.memo.p) && s.memo.p.length === cfg.n * cfg.len)
    g.memo = { s: s.memo.s.map(v => clamp(v | 0, 0, 2)), p: s.memo.p.map(v => clamp(v | 0, 0, 2)) };
  return g;
}

// ---------- sound and theme ----------
function renderSound() {
  const b = $('sndBtn'), on = !(A && A.muted);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', T(on ? 'サウンド オン' : 'サウンド オフ'));
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  if (!A) b.hidden = true;
}
$('sndBtn').addEventListener('click', () => { if (!A) return; A.toggleMute(); if (!A.muted) sfx('ok'); });
if (A) A.onChange(renderSound);
function themeColor() {
  const m = document.querySelector('meta[name="theme-color"]'); if (!m) return;

  m.setAttribute('content', light ? '#eef0f6' : '#14182b');
}
function toast(msg, type) { if (UI) UI.toast(msg, { type: type || null, ms: 1800 }); $('live').textContent = msg; }
function say(msg) { $('live').textContent = msg; }

// ---------- rendering ----------
const OVERLAYS = ['ovTitle', 'ovResult', 'howto'];
const anyOverlay = () => OVERLAYS.some(id => !$(id).hidden) || !!document.querySelector('.kb-layer:not([hidden])');
function hideOverlays() { OVERLAYS.forEach(id => { $(id).hidden = true; }); }
let padKey = '';
function curCfg() { return G ? G.cfg : mkCfg(save.set.sym, save.set.d, save.set.dup); }
function buildPad() {
  const cfg = curCfg(), key = cfg.sym + cfg.n;
  if (padKey === key) return;
  padKey = key;
  const order = cfg.sym === 'num' ? [1, 2, 3, 4, 5, 6, 7, 8, 9, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  const pad = $('pad');
  pad.className = 'pad ' + (cfg.sym === 'num' ? 'p5' : 'p4');
  pad.innerHTML = order.map(i => '<button type="button" class="key sk" data-i="' + i + '" aria-label="' + esc(symName(cfg, chOf(i))) + '">' + symHTML(cfg, chOf(i)) + '<i class="mk" aria-hidden="true"></i></button>').join('');
}
function cpuPhase() { return G && G.kind === 'cpu' ? G.cpu.phase : null; }
function renderInfo() {
  const cfg = curCfg();
  const iMode = $('iMode'), iTurn = $('iTurn'), iTime = $('iTime'), iBest = $('iBest');
  iTurn.classList.remove('low');
  if (!G) { iMode.textContent = cfgName(cfg); iTurn.textContent = T('{n}/{m}回', { n: 0, m: cfg.max }); iTime.textContent = fmtTime(0); iBest.textContent = bestText(cfg); return; }
  const used = G.kind === 'cpu' && G.cpu.phase === 'secret' ? 0 : G.rows.length;
  iTurn.textContent = T('{n}/{m}回', { n: used, m: G.cfg.max });
  if (!G.over && G.cfg.max - used <= 2 && used > 0) iTurn.classList.add('low');
  iTime.textContent = fmtTime(G.ms);
  if (G.kind === 'vs') { iMode.textContent = T('問題 {n}', { n: G.vs.idx }) + SEP + cfgName(G.cfg); iBest.textContent = T('{n}点', { n: fmtN(G.vs.score) }); return; }
  iMode.textContent = (G.kind === 'daily' ? T('今日のチャレンジ') + SEP : G.kind === 'practice' ? T('練習') + SEP : '') + cfgName(G.cfg);
  if (G.kind === 'cpu') iBest.textContent = T('CPU：{l}', { l: T(CPU_NAMES[G.cpu.level]) });
  else if (G.kind === 'daily' || G.kind === 'practice') iBest.textContent = dkText(G.dk);
  else iBest.textContent = bestText(G.cfg);
}
function dkText(dk) { const s = String(dk || ''); return s.length === 8 ? s.slice(4, 6).replace(/^0/, '') + '/' + s.slice(6).replace(/^0/, '') : ''; }
function bestText(cfg) { const b = save.bests[cfgKey(cfg)]; return b && b.s ? T('ベスト {n}', { n: fmtN(b.s) }) : T('ベスト —'); }
function rowHTML(cfg, r, i, win) {
  return '<li class="row' + (win ? ' win' : '') + (r.t && Date.now() - r.t < 400 ? ' new' : '') + '" aria-label="' + esc(T('{i}回目', { i: i + 1 }) + ' ' + codeText(cfg, r.g) + ' ' + hbText(r.h, r.b)) + '"><span class="no">' + (i + 1) + '</span><span class="code">' + codeHTML(cfg, r.g) + '</span><span class="hbs">' + hbHTML(r.h, r.b) + '</span></li>';
}
function renderHist() {
  const el = $('hist');
  if (!G || !G.rows.length) {
    const msg = !G ? '' : G.kind === 'cpu' && G.cpu.phase === 'secret' ? T('まず、CPUに当てさせる「あなたの答え」を決めます') : T('まだ推理がありません。下のキーで並びを作って「決定」');
    el.innerHTML = msg ? '<li class="empty">' + esc(msg) + '</li>' : '';
  } else el.innerHTML = G.rows.map((r, i) => rowHTML(G.cfg, r, i, r.h === G.cfg.len)).join('');
  if (tab === 'hist') { const m = $('main'); m.scrollTop = m.scrollHeight; }
  const c = $('cpuHist');
  if (G && G.kind === 'cpu') {
    c.innerHTML = G.cpu.rows.length ? G.cpu.rows.map((r, i) => rowHTML(G.cfg, r, i, r.h === G.cfg.len)).join('') : '<li class="empty">' + esc(T('CPUはまだ推理していません')) + '</li>';
    if (tab === 'cpu') { const m = $('main'); m.scrollTop = m.scrollHeight; }
  }
}
function renderEntry() {
  buildPad();
  const cfg = curCfg(), cur = G ? G.cur : '';
  let h = '';
  for (let i = 0; i < cfg.len; i++) {
    const ch = cur[i];
    h += '<button type="button" class="slot' + (ch ? ' fill' : i === cur.length ? ' next' : '') + '" data-k="' + i + '" aria-label="' + esc(ch ? T('{i}つ目：{s}（タップで消す）', { i: i + 1, s: symName(cfg, ch) }) : T('{i}つ目：空き', { i: i + 1 })) + '">' + (ch ? symHTML(cfg, ch) : '') + '</button>';

function submit() {
  if (!canInput()) return null;
  const cfg = G.cfg, g = G.cur;
  if (g.length !== cfg.len) { shake(); sfx('error'); toast(T('{n}つ えらんでください', { n: cfg.len })); return null; }
  if (!validCode(cfg, g)) { shake(); sfx('error'); toast(T('同じ記号は1回しか使えません')); return null; }
  if (G.kind === 'cpu' && G.cpu.phase === 'secret') { cpuSetSecret(g); return { secret: g }; }
  if (G.rows.some(r => r.g === g)) { shake(); sfx('error'); toast(T('その並びは もう試しました')); return null; }
  const r = judge(G.secret, g), row = { g, h: r.h, b: r.b, t: Date.now() };
  G.rows.push(row); G.cur = '';
  const solved = r.h === cfg.len;
  say(T('{i}回目', { i: G.rows.length }) + ' ' + codeText(cfg, g) + ' ' + hbText(r.h, r.b));

// You and the CPU each hide an answer and take turns guessing. You go first; the CPU always gets the same number of turns.
function startCpu(o) {
  o = o || {};
  const cfg = o.cfg || mkCfg(save.set.sym, save.set.d, save.set.dup);
  const level = clamp(o.level || save.set.cpu || 2, 1, 3);

}

  emit('play_start', { mode: 'versus', cpu: c.level });
  renderAll();
}
function cpuSchedule() {
  const c = G.cpu; c.thinking = true; renderAll();
  const g = G;
  const go = () => { if (G === g && !G.over) cpuTurn(); };
  if (cpuDelay <= 0) go(); else cpuTimer = setTimeout(go, cpuDelay + Math.random() * 300);
}
function pick(arr, r) { return arr[Math.floor(r() * arr.length)]; }
function sample(arr, n, r) { if (arr.length <= n) return arr.slice(); const out = new Set(); while (out.size < n) out.add(arr[Math.floor(r() * arr.length)]); return [...out]; }
function cpuChoose(c, cfg) {
  const r = c.rnd, all = allCodes(cfg), tried = new Set(c.rows.map(x => x.g));
  if (!c.rows.length) return pick(all, r);
  if (c.level === 1 && c.rows.length >= 2 && r() < 0.5) {
    // the weak CPU forgets one of its clues now and then
    const skip = Math.floor(r() * c.rows.length);
    const pool = filterBy(all, c.rows.filter((_, i) => i !== skip)).filter(x => !tried.has(x));
    if (pool.length) return pick(pool, r);
  }
  const cand = c.cands.filter(x => !tried.has(x));
  if (!cand.length) return pick(all.filter(x => !tried.has(x)), r);
  if (c.level <= 2 || cand.length <= 2) return pick(cand, r);
  // the strong CPU: the guess whose worst answer leaves the fewest possibilities (minimax over a sample)
  const pool = cand.length > 1500 ? sample(cand, 1500, r) : cand;
  const guesses = sample(cand, 140, r).concat(cand.length > 3 ? sample(all, 40, r).filter(x => !tried.has(x)) : []);
  let best = null, bestW = Infinity, bestIn = false;
  const cnt = new Int32Array(60), candSet = cand.length < 5000 ? new Set(cand) : null;
  for (const g of guesses) {
    cnt.fill(0); let w = 0;
    for (const s of pool) { const v = hb(s, g); if (++cnt[v] > w) w = cnt[v]; }
    const inC = candSet ? candSet.has(g) : true;
    if (w < bestW || (w === bestW && inC && !bestIn)) { best = g; bestW = w; bestIn = inC; }
  }
  return best || pick(cand, r);
}
function cpuTurn() {
  const c = G.cpu, cfg = G.cfg;
  const g = cpuChoose(c, cfg), j = judge(c.mine, g), row = { g, h: j.h, b: j.b, t: Date.now() };
  c.rows.push(row); c.cands = filterBy(c.cands, [row]); c.thinking = false;
  sfx(j.h === cfg.len ? 'fail' : 'select');
  say(T('CPU') + ' ' + codeText(cfg, g) + ' ' + hbText(j.h, j.b));
  if (tab !== 'cpu') { const t = $('tabCpu'); if (!t.querySelector('.dot')) t.insertAdjacentHTML('beforeend', '<span class="dot" aria-hidden="true"></span>'); }
  const you = G.rows.length && G.rows[G.rows.length - 1].h === cfg.len, cpu = j.h === cfg.len;

}

}

const fx = $('fx'), fctx = fx.getContext('2d');

function burst() {

  fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cols = [cs.getPropertyValue('--hb-hit').trim(), cs.getPropertyValue('--hb-blow').trim(), '#56b4e9', '#cc79a7', '#f0e442'];
  for (let i = 0; i < 90; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 8, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length], s: 5 + Math.random() * 5, t: 0 });

}
function fxLoop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);

  for (const p of parts) {
    p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fctx.save(); fctx.globalAlpha = Math.min(1, (110 - p.t) / 30); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore();

  if (!fxRaf) fctx.clearRect(0, 0, innerWidth, innerHeight);
}

      cpu: G && G.cpu ? { level: G.cpu.level, phase: G.cpu.phase, mine: G.cpu.mine, rows: G.cpu.rows.map(r => [r.g, r.h, r.b]), thinking: G.cpu.thinking, result: G.cpu.result } : null,
      vs: G && G.vs ? { idx: G.vs.idx, score: G.vs.score, solved: G.vs.solved } : null,
      tut: G && G.tut ? G.tutStep : null, tab, memo: G ? JSON.parse(JSON.stringify(G.memo)) : null,
      title: !$('ovTitle').hidden, result: !$('ovResult').hidden, howto: !$('howto').hidden, save: JSON.parse(JSON.stringify(save)),
    }),
    win() { if (!canInput() || G.kind === 'cpu') return false; G.cur = G.secret; submit(); return true; },
    lose() { if (!canInput() || G.kind === 'cpu') return false; giveUp(); return true; },
    step(n) { const out = []; for (let i = 0; i < (n || 1); i++) { const r = botStep(); if (!r) break; out.push(r); } return out; },
  };
  window.__kb = Object.assign(window.__kb || {}, api);
  window.__hitblow = {
    api, get G() { return G; }, get save() { return save; }, judge, allCodes, scoreOf, readSave, readState, mkCfg, dailySecret, shareText,
    answer: () => (G ? G.secret : null),
    setSeed(n) { seedNext = n >>> 0; return seedNext; },
    setCpuDelay(ms) { cpuDelay = ms; },
    start(kind, o) {
      o = o || {};
      const cfg = o.sym || o.d || o.dup != null ? mkCfg(o.sym || 'num', o.d || 'n', !!o.dup) : undefined;
      if (o.seed != null) seedNext = o.seed >>> 0;
      if (kind === 'daily') startDaily(o.dateKey || todayKey(), !!o.practice);
      else if (kind === 'cpu') startCpu({ cfg, level: o.level });
      else startSolo({ cfg, tut: !!o.tut });
      return api.state();
    },
    type(s) { for (const ch of String(s)) press(idxOf(ch)); return G ? G.cur : ''; },
    guess(s) { if (!G) return null; G.cur = ''; for (const ch of String(s)) press(idxOf(ch)); return submit(); },
    submit, press, delOne, clearCur, botStep, solve() { let g = 0; while (canInput() && g++ < 40) botStep(); return api.state(); },
    cpuNow() { if (G && G.cpu && G.cpu.thinking && !G.over) { clearTimeout(cpuTimer); cpuTurn(); } return api.state(); },
    addMs(ms) { if (G) { G.ms += ms; G.sessMs += ms; renderInfo(); } },
    title: showTitle, howto: () => showHowto(false), setTab, showResult,
    thumbScene() { // a game halfway through, colors mode, for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb');
      quitCurrent(); hideOverlays();
      const cfg = mkCfg('col', 'n', false);
      G = newG('solo', cfg, '2516', { started: true, ms: 83000 });
      for (const g of ['0123', '4567', '2541', '2153']) { const j = judge(G.secret, g); G.rows.push({ g, h: j.h, b: j.b }); }
      G.cur = '25'; G.memo.s[0] = 1; G.memo.s[3] = 1; G.memo.s[2] = 2; G.memo.s[5] = 2;
      padKey = ''; menuOpen = false; setTab('hist'); renderAll();
      return true;
    },
  };
}
})();
