<style>
/* 将棋: a wooden board on a dark tatami room (dark) or a bright washitsu (light). UI uses the shared --kb-* tokens. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1f1a14; --kb-surface: #2b241b; --kb-surface-2: #352c21; --kb-sunken: #17130e; --kb-line: #4b3e2c;
  --kb-ink: #f6eedf; --kb-dim: #c9b89a; --kb-accent: #e7a93f; --kb-accent-ink: #2a1a04; --kb-accent-text: #f0b552; --kb-accent-soft: rgba(231, 169, 63, .16);
  --s-board: #d9ae63; --s-board2: #c99a4f; --s-line: #4a3112; --s-piece: #f3dca6; --s-piece2: #dfbd78; --s-pedge: #7a5524; --s-ink: #1b1209; --s-red: #b3151a;
  --s-sel: rgba(255, 214, 90, .55); --s-dot: rgba(40, 90, 200, .55); --s-last: rgba(255, 160, 40, .32); --s-check: rgba(230, 40, 40, .55); --s-stand: #3a2f22; --s-stand-ink: #f6eedf;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f3ece0; --kb-surface: #fffaf2; --kb-surface-2: #f5ecdc; --kb-sunken: #e9dfcd; --kb-line: #d6c6aa;
    --kb-ink: #2b2014; --kb-dim: #6b5a43; --kb-accent: #d8902a; --kb-accent-ink: #2a1a04; --kb-accent-text: #8a5508; --kb-accent-soft: rgba(216, 144, 42, .14);
    --s-board: #e8c27c; --s-board2: #ddb06a; --s-stand: #e3d4b8; --s-stand-ink: #2b2014;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f3ece0; --kb-surface: #fffaf2; --kb-surface-2: #f5ecdc; --kb-sunken: #e9dfcd; --kb-line: #d6c6aa;
  --kb-ink: #2b2014; --kb-dim: #6b5a43; --kb-accent: #d8902a; --kb-accent-ink: #2a1a04; --kb-accent-text: #8a5508; --kb-accent-soft: rgba(216, 144, 42, .14);
  --s-board: #e8c27c; --s-board2: #ddb06a; --s-stand: #e3d4b8; --s-stand-ink: #2b2014;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body); -webkit-tap-highlight-color: transparent; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; height: var(--kobo-h, 100%); }
header.bar { flex: none; display: flex; align-items: center; gap: 6px; padding: var(--kb-sat) max(6px, var(--kb-sar)) 0 max(6px, var(--kb-sal)); min-height: calc(48px + var(--kb-sat)); border-bottom: 1px solid var(--kb-line); }
header.bar h1 { flex: 1; margin: 0; font: 800 17px var(--kb-font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.bar h1 small { font-size: 12px; color: var(--kb-dim); margin-left: 6px; }
.home { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 8px; color: var(--kb-dim); text-decoration: none; font-weight: 800; font-size: 14px; border-radius: 10px; }
.ibtn { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--kb-ink); border-radius: 10px; font-size: 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ibtn svg { width: 24px; height: 24px; }
#stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px max(4px, var(--kb-sar)) max(4px, var(--kb-sab)) max(4px, var(--kb-sal)); gap: 4px; }
#cv { display: block; touch-action: none; flex: none; }
#panel { display: contents; }
.pbar { order: 0; width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 6px; font-size: 13px; font-weight: 800; }
.pbar .pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar .pclock { font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 8px; background: var(--kb-sunken); min-width: 56px; text-align: center; }
.pbar .pclock:empty { display: none; }
.pbar.turn .pname::before { content: '● '; color: var(--kb-accent-text); }
.pclock.low { background: #b3151a; color: #fff; }
#pTop { order: 0; } #cv { order: 1; } #pBot { order: 2; } #status { order: 3; } #ctrl { order: 4; }
#status { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 4px; font-size: 13px; }
#stText { flex: none; font-weight: 800; color: var(--kb-accent-text); white-space: nowrap; }
#mlist { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; white-space: nowrap; scrollbar-width: none; color: var(--kb-dim); font-variant-numeric: tabular-nums; cursor: pointer; padding: 6px 0; }
#mlist::-webkit-scrollbar { display: none; }
#mlist span { margin-right: 10px; } #mlist span:last-child { color: var(--kb-ink); font-weight: 800; }
#ctrl { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#ctrl button { min-height: 44px; padding: 0 4px; font-size: 14px; }
/* landscape: board on the left, panel on the right */
#stage.land { flex-direction: row; align-items: center; justify-content: center; }
#stage.land #panel { order: 2; display: flex; flex-direction: column; gap: 6px; width: 200px; flex: none; align-self: stretch; justify-content: center; }
#stage.land #status { flex-direction: column; align-items: stretch; }
#stage.land #mlist { white-space: normal; max-height: 30vh; overflow-y: auto; }
#stage.land #ctrl { grid-template-columns: 1fr 1fr; }
/* overlays */
.ovl { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: var(--kb-scrim, rgba(0,0,0,.6));
  padding: calc(8px + var(--kb-sat)) max(8px, var(--kb-sar)) calc(8px + var(--kb-sab)) max(8px, var(--kb-sal)); }
.ovl[hidden] { display: none; }
.card { width: min(440px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 18px; box-shadow: var(--kb-shadow); overflow: hidden; }
.card .body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
.card .foot { flex: none; display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--kb-line); }
.card .foot .kb-btn { flex: 1; }
.card h2 { margin: 0 0 8px; font: 800 20px var(--kb-font-body); }
.card p { margin: 6px 0; font-size: 14px; line-height: 1.5; }
.dim { color: var(--kb-dim); font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack .kb-btn { width: 100%; }
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.logo .k { width: 54px; height: 60px; flex: none; }
.logo h2 { margin: 0; font-size: 26px; }
.seg { display: grid; gap: 4px; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 4px 0 10px; }
.seg button { min-height: 44px; padding: 0 2px; border: 1px solid var(--kb-line); background: var(--kb-surface-2); color: var(--kb-ink); border-radius: 10px; font: 800 13px var(--kb-font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--kb-accent); color: var(--kb-accent-ink); border-color: var(--kb-accent); }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
label.lbl { display: block; font-weight: 800; font-size: 13px; margin-top: 4px; }
input.txt { width: 100%; min-height: 44px; font: 800 18px var(--kb-font-body); padding: 0 12px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-sunken); color: var(--kb-ink); }
.code { font: 800 40px var(--kb-font-body); letter-spacing: .15em; text-align: center; margin: 8px 0; color: var(--kb-accent-text); }
.big { font: 800 30px var(--kb-font-body); text-align: center; margin: 4px 0; }
.err { color: #e5533d; font-weight: 800; }
.plist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.plist .kb-btn { width: 100%; }
#ovPromo .card { width: min(320px, 100%); }
.promo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.promo button { min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.promo canvas { width: 52px; height: 56px; }
#kifText { width: 100%; height: 140px; font: 12px/1.4 monospace; background: var(--kb-sunken); color: var(--kb-ink); border: 1px solid var(--kb-line); border-radius: 8px; padding: 8px; resize: none; }
#kifList { margin: 0 0 8px; padding-left: 0; list-style: none; columns: 2; font-size: 13px; font-variant-numeric: tabular-nums; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 8px 0; }
.pc { display: flex; gap: 8px; align-items: center; background: var(--kb-surface-2); border-radius: 12px; padding: 6px; }
.pc .grid { display: grid; grid-template-columns: repeat(5, 11px); grid-template-rows: repeat(5, 11px); gap: 1px; flex: none; }
.pc .grid i { background: var(--kb-sunken); display: block; border-radius: 2px; }
.pc .grid i.me { background: var(--kb-accent); }
.pc .grid i.go { background: #3d8be0; } .pc .grid i.sl { background: #3d8be0; opacity: .55; }
.pc .grid i.jp { background: #2fae63; }
.pc b { font: 700 22px 'Noto Serif JP', serif; }
.pc .nm { font-size: 12px; line-height: 1.35; }
.howto h3 { margin: 12px 0 4px; font-size: 15px; }
.howto ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.55; }
.recs { font-size: 12.5px; color: var(--kb-dim); margin-top: 8px; line-height: 1.6; }
body.thumb header.bar, body.thumb #panel { display: none !important; }
@media (max-height: 480px) { .card .body { padding: 10px 14px; } .card .foot { padding: 8px 14px; } header.bar { min-height: calc(42px + var(--kb-sat)); } }
</style>

<body>
<div id="app">
  <header class="bar">
    <a class="home" href="../" aria-label="ゲーム一覧へ" data-i18n-attr="aria-label">← <span data-i18n>ホーム</span></a>
    <h1 id="title"><span data-i18n>将棋</span><small id="modeTag"></small></h1>
    <button class="ibtn" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label">☰</button>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="将棋盤" data-i18n-attr="aria-label"></canvas>

// ---------------------------------------------------------------- save
function readSave() {

// ---------------------------------------------------------------- state
let game = null;          // ShogiEngine.Game

let flipped = false;      // true: gote at the bottom
let sel = null;           // { kind: 'b', sq } | { kind: 'h', t }
let targets = [];         // legal moves (ints) of the selection
let thinking = false, cpuToken = 0, worker = null;
let anim = null, dirty = true, guide = store.get(GUIDE_KEY) === '1';
let ended = false, startedAt = 0;
let tsume = null;         // { pr, idx, wrong }
const cv = $('cv'), ctx = cv.getContext('2d');
let LY = null;

// ---------------------------------------------------------------- audio
function sClick() { if (!AU) return; try { AU.noise(0.035, { vol: 0.22, freq: 2400 }); AU.tone(180, 0.05, { type: 'sine', vol: 0.12 }); } catch (e) {} }

// ---------------------------------------------------------------- layout

    const avail = H - fixed;

}
let layoutT = 0;

// view helpers: screen col/row of a square
const bottomSide = () => (flipped ? 1 : 0);

}

  let col = Math.floor((x - LY.bx) / LY.c), row = Math.floor((y - LY.by) / LY.c);

// ---------------------------------------------------------------- drawing
const CHAR = ['', '歩', '香', '桂', '銀', '金', '角', '飛', '玉', 'と', '杏', '圭', '全', '', '馬', '龍'];
let PAL = {};
function readPal() {
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();

function drawPiece(g, cx, cy, size, t, upside, o) {

  const types = [7, 6, 5, 4, 3, 2, 1].filter(t => game && game.pos.handOf(side, t) > 0);

    const sw = Math.min(c * 1.2, rect.w / 7), n = types.length;

    const c = Object.assign({}, out[sd]);

    out[sd] = c;

  function use(c, u) {

    const over = u - c.main; c.main = 0; c.byo = NET.by * 1000 - over;
    if (c.byo < 0) c.flag = true;
  }
}

// after the solver's move: is it check, and does a mate remain within the budget? then the defender answers with its longest line
function tsumeAfter() {
  const pr = cfg.pr, used = game.moves.length;
  if (ended) { // mated
    if (game.result && game.result.winner === 0) tsumeSolved();
    return;
  }
  const pos = game.pos;
  const fail = msg => {
    tsume.busy = true; tsume.msg = msg; renderStatus(); sfx('fail');
    setTimeout(() => { if (cfg.mode === 'tsume' && cfg.pr === pr) { game.undo(1); mlCache = []; tsume.busy = false; tsume.msg = ''; renderAll(); } }, 900);
  };
  if (!pos.inCheck()) return fail(T('王手をかけてください'));
  const left = pr.n - used;
  // the defender's best reply: the one that keeps the attacker's mate longest (escape → wrong move)
  let best = null, bestLen = -1;
  for (const m of pos.legalMoves()) {
    pos.make(m);
    const r = left - 1 >= 1 ? E.solveMate(pos, left - 1) : null;
    pos.unmake();
    if (!r) { best = null; bestLen = Infinity; break; }
    const v = r.mate - (E.info(m).drop ? 0.5 : 0);
    if (v > bestLen) { bestLen = v; best = m; }
  }
  if (!best) return fail(T('ちがいます。もう一度'));
  tsume.busy = true;
  setTimeout(() => { if (cfg.mode !== 'tsume' || cfg.pr !== pr) return; tsume.busy = false; applyMove(best); }, 450);
}
function tsumeSolved() {
  tsume.solved = true;
  save = readSave();
  if (!save.mate.s.includes(cfg.pr.id)) save.mate.s.push(cfg.pr.id);
  writeSave();
  try { window.KoboGame && KoboGame.emit('stage_clear', { stage: cfg.idx + 1 }); window.KoboGame && KoboGame.emit('play_end', { score: 1, reason: 'clear', stage: cfg.idx + 1 }); } catch (e) {}
  $('resBig').textContent = T('正解！'); $('resWhy').textContent = T('{n}手詰', { n: cfg.pr.n }); $('resSub').textContent = '';
  $('resAgain').textContent = T(cfg.idx < PROBLEMS.length - 1 ? '次の問題' : 'はじめから');
  setTimeout(() => { $('ovResult').hidden = false; }, 600);
}

const finishBase = finish;
finish = function (res) {

// ---------------------------------------------------------------- online (Firebase Realtime Database)
// shogi/queue/{uid}          = { n: nick, t: server ms, c: time control 0..2, e: rating }   (+ r: room id, m: [uids] once that player made a room)
// shogi/codes/{code}         = { h: host uid, t, c }   (+ g: guest uid, written once by the friend; r: room id, written by the host)
// shogi/rooms/{room}         = { at, h: creator, inv: { uid: 1 } (2 players), b / w: uids of black / white, c, tm, by: time control (s),
//                                m: { uid: { n, j, e } }   members (each removes itself on disconnect)
//                                st: server time of the start (written once, by the creator, when both are in)
//                                n: number of moves; mv: { "0": { m: usi, t: server time, i: 0 }, … } (append-only, by the side to move)
//                                end: { r: reason, w: 'b' | 'w' | 'd', by: uid, t, n }  (written once)
//                                rm: { uid: 1 } rematch wishes; nx: the next room (written once by the creator) }
// The clocks come from the server times of the moves, so both pages see the same time. database.rules.json checks all of it.
const FB_SDK = 'https://cdn.jsdelivr.net/npm/firebase@10.12.2/';

const NET = { db: null, uid: null, TS: null, off: 0, gen: 0, phase: 'off', nick: '', qref: null, q: null, rid: null, rref: null, meta: null, members: {}, timers: [], offs: [],
  connected: false, bad: new Set(), side: 0, tc: 1, code: null, cref: null, mt: [], st: 0, tm: 0, by: 30, end: null, rm: {}, oppGoneAt: 0, oppNick: '', oppR: 0, discMsg: '', localT: 0 };

const authReady = au => new Promise(res => { const un = au.onAuthStateChanged(() => { un(); res(); }); });
// RTDB の接続（無料プランは同時に100まで）は、待ち行列にも部屋にもいない状態が20秒続いたら閉じる（goOffline）。
// 次にオンラインを開くときに netInit が開き直す（goOnline）。閉じると、サーバーに残した onDisconnect の片付けも走る。
const NET_IDLE_OFF = 20000;

    if (NET.qref || NET.rref || NET.cref || !(NET.phase === 'off' || NET.phase === 'done')) { NET.idleAt = 0; return; }
    if (!NET.idleAt) { NET.idleAt = Date.now(); return; }
    if (Date.now() - NET.idleAt < NET_IDLE_OFF) return;
    NET.idleAt = 0; NET.dbOff = true; NET.connected = false;
    try { NET.db.goOffline(); } catch (e) {}
  }, 5000);
}
async function netInit() {
  if (NET.db) {

    NET.idleAt = 0;
    return;
  }
  const cfgF = window.NEJI_FIREBASE;
  if (!cfgF || !cfgF.databaseURL) throw netErr('no-config');
  if (window.KoboCloud && KoboCloud.ready) { try { await KoboCloud.ready(); } catch (e) {} }
  if (!window.firebase || !firebase.apps) await loadJs(FB_SDK + 'firebase-app-compat.js');
  if (!firebase.auth) await loadJs(FB_SDK + 'firebase-auth-compat.js');
  if (!firebase.database) await loadJs(FB_SDK + 'firebase-database-compat.js');
  if (!firebase.apps.length) firebase.initializeApp(cfgF);
  const app = firebase.app();
  await authReady(app.auth());
  // one account for everything: Google if signed in, otherwise the shared guest account (KoboCloud.ensureGuest)

  if (!u && window.KoboCloud && KoboCloud.ensureGuest) { try { await KoboCloud.ensureGuest(); } catch (e) {} u = app.auth().currentUser; }
  if (!u) u = (await app.auth().signInAnonymously()).user;

}
function netConnect() {
