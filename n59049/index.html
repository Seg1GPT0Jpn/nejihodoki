<style>
/* Look: a night observatory (dark) or a daylight planetarium (light). A glass lattice floats in the room; tiles are

:root, :root[data-kb-theme="dark"] {
  --kb-bg: #0b1020; --kb-surface: #151c38; --kb-surface-2: #1c2550; --kb-sunken: #0e1430; --kb-line: #2b3666;

  --kb-shadow: 0 24px 60px rgba(0, 0, 0, .5);

  --nb-toast: rgba(8, 12, 28, .92); --nb-toast-ink: #eef2ff; --nb-pop: #fff1c4; --nb-pop-stroke: #14182e;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #eef0fa; --kb-surface: #ffffff; --kb-surface-2: #e3e7f7; --kb-sunken: #dde2f4; --kb-line: #c3cae6;
    --kb-ink: #1a2040; --kb-dim: #535d86;
    --kb-accent: #f2b733; --kb-accent-ink: #2b1d00; --kb-accent-text: #8a5a00; --kb-accent-soft: rgba(201, 138, 16, .14);
    --kb-scrim: rgba(26, 32, 64, .42); --kb-toast-bg: rgba(26, 32, 64, .94); --kb-focus: #2f5fd0;

    --nb-ctl: linear-gradient(#ffffff, #eef1fb); --nb-ctl-shadow: #c3cae6;

}

  --kb-accent: #f2b733; --kb-accent-ink: #2b1d00; --kb-accent-text: #8a5a00; --kb-accent-soft: rgba(201, 138, 16, .14);

/* tutorial coach: takes the place of the score row */
.coach {
  flex: none; display: flex; align-items: center; gap: 10px; margin: 4px max(12px, var(--kb-sar)) 2px max(12px, var(--kb-sal));

  color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; touch-action: manipulation;
}
.skip.go { background: var(--kb-accent); border-color: var(--kb-accent); color: var(--kb-accent-ink); padding: 0 16px; font-size: 15px; box-shadow: 0 3px 0 var(--nb-btn-shadow); }
.coach.nudge { animation: nudge .35s; }
#play { position: relative; flex: 1; min-height: 0; touch-action: none; margin: 0 var(--kb-sar) 0 var(--kb-sal); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 11px; color: var(--kb-dim);

}

.toast {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: var(--nb-toast); border: 1px solid var(--kb-line); color: var(--nb-toast-ink);
  font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap; transition: opacity .2s;
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; z-index: 3;

.toast.gold { background: var(--kb-accent); color: var(--kb-accent-ink); border-color: var(--kb-accent); }
.toast.off { opacity: 0; }
/* merge feedback: floating "+N" over the merged tile, and a soft flash for big merges */
.pops { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.pop {
  position: absolute; transform: translate(-50%, -50%); font-family: var(--kb-font-display); font-size: 18px; color: var(--nb-pop);
  -webkit-text-stroke: 3px var(--nb-pop-stroke); paint-order: stroke fill; white-space: nowrap; animation: popup .9s ease-out forwards;
}

#nogl, #glLost { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; z-index: 4; }
#glLost { background: var(--kb-scrim); }
#nogl > div, #glLost > div { max-width: 300px; display: flex; flex-direction: column; gap: 10px; background: var(--nb-card); border: 1px solid var(--kb-line); border-radius: 18px; padding: 18px 16px; }
#nogl b, #glLost b { font-family: var(--kb-font-display); font-weight: 400; font-size: 18px; }
#nogl p, #glLost p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--kb-dim); }

}
.chip.got { opacity: 1; }
.chip.top { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--kb-ink); }
.controls { flex: none; display: grid; grid-template-columns: 1.25fr 1fr 1fr 1.25fr; gap: 6px; padding: 0 max(10px, var(--kb-sar)) 10px max(10px, var(--kb-sal)); }
.ctl {
  height: 50px; min-height: 44px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--nb-ctl);
  color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;

.ctl.depth { background: var(--nb-depth); border-color: var(--nb-depth-line); font-size: 15px; }
.ctl svg { width: 16px; height: 16px; flex: none; }
.ctl.v { font-size: 13px; gap: 2px; }
.ctl.small { height: 44px; font-size: 13px; }
.ctl:disabled { opacity: .4; }
.ctl .n, .ctl > span { overflow: hidden; text-overflow: ellipsis; }
.ctl .n { font-size: 11px; color: var(--kb-dim); }
.ctl.pulse { animation: glow 1.2s ease-in-out infinite; border-color: var(--kb-accent); }
.row2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; height: var(--kb-vh);
  padding: max(12px, var(--kb-sat)) max(12px, var(--kb-sar)) max(12px, var(--kb-sab)) max(12px, var(--kb-sal));
  background: var(--kb-scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .3s ease-out;

.card {

  color: var(--kb-ink); padding: 22px 20px 18px; text-align: center; box-shadow: var(--kb-shadow); animation: rise .35s cubic-bezier(.2,.9,.3,1.2);
}
.card h2 { margin: 0 0 10px; font-family: var(--kb-font-display); font-weight: 400; font-size: 24px; letter-spacing: .04em; line-height: 1.2; overflow-wrap: anywhere; }
.card .big { font-family: var(--kb-font-display); font-size: clamp(28px, 10vw, 44px); line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .best { color: var(--kb-dim); font-size: 13px; font-weight: 800; margin: 6px 0 4px; }
.card .best b { color: var(--kb-accent-text); font-variant-numeric: tabular-nums; }

.btn {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; border: 0; border-radius: 14px; padding: 10px 14px; margin-top: 12px; font: 800 16px var(--kb-font-body);
  background: var(--kb-accent); color: var(--kb-accent-ink); box-shadow: 0 4px 0 var(--nb-btn-shadow); cursor: pointer; text-decoration: none; touch-action: manipulation;

.btn.sub { min-height: 46px; margin-top: 10px; font-size: 15px; background: transparent; color: var(--kb-ink); border: 1px solid var(--kb-line); box-shadow: none; }

    hideOverlays(); $('howto').hidden = true;
    rebuildMeshes(); renderMode(); renderHud(); invalidate();
    vs.playing = practice ? 'practice' : 'versus';
    const g = G(); if (g) g.emit('play_start', { mode: vs.playing, seed });
  },
  getScore: () => score,
  onEnd() {
    swipeStart = null;
    if (vs && vs.playing) { const g = G(); if (g) g.emit('play_end', { mode: vs.playing, score, reason: 'over' }); vs.playing = null; }
  },
  onExit() {
    if (!vs) return;
    if (vs.playing) { const g = G(); if (g) g.emit('play_end', { mode: vs.playing, score, reason: 'quit' }); }
    const s = vs.snap; vs = null;
    finishAnims(); cancelInput();
    cells = fromExps(s.cells); score = s.score; undoLeft = s.undoLeft; prev = s.prev; won = s.won; over = s.over; movesMade = s.movesMade;
    bestAtStart = s.bestAtStart; bestToasted = s.bestToasted; goalToasted = s.goalToasted; runTop = s.runTop; overInfo = s.overInfo;
    mode = s.mode; daily = s.daily;
    rnd = mode === 'daily' && daily ? dailyRng(daily.seed, s.draws) : Math.random;
    if (mode === 'daily') refreshDaily();
    $('winOv').hidden = !s.win; $('overOv').hidden = !s.ov;
    rebuildMeshes(); renderMode(); renderHud(); invalidate();
  },
});
KoboVersus.button($('vsSlot'), { compact: true });
KoboVersus.button($('vsSlotOver'));

// ---------- KoboGame: platform hooks (turn-based: flags.pause is false, so hiding the page just saves) ----------
// Migration: players who already have a best score or a board in progress have played before → don't show the
// first-visit how-to and tutorial to them. Runs once (kobo.migrated), and running it again changes nothing.
if (PF && PF.migrations) PF.migrations.add({ id: 'n59049-howto-1', v: 1, run(c) {
  const has = c.store.raw(KEY_BEST) != null || c.store.raw(KEY_STATE) != null;
  if (has && c.store.raw(KEY_HOWTO) == null) c.store.setRaw(KEY_HOWTO, '1');
  if (has && c.store.raw(KEY_TUT) == null) c.store.setRaw(KEY_TUT, 'old');
} });
const listeners = [];
const on = (t, ev, f, o) => { t.addEventListener(ev, f, o); listeners.push(() => t.removeEventListener(ev, f, o)); };
let booted = false;
if (G()) {
  G().register({
    id: GAME,
    pause() { cancelInput(); save(); },
    resume() { invalidate(); },
    save() { cancelInput(); save(); },
    isIdle: () => !sess && !vs && mode !== 'tutorial' && !ptrs.size,
    restore: glRestored,
    dispose() {
      disposed = true; if (raf) cancelAnimationFrame(raf); raf = 0;
      listeners.splice(0).forEach(f => f()); if (ro) ro.disconnect();
      try { meshes.forEach(m => world.remove(m)); Object.values(mats).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); tileGeo.dispose(); renderer.dispose(); } catch (e) {}
    },
    daily: { start({ dateKey }) { if (!vs) { $('howto').hidden = true; startDaily(dateKey); } } },
  });
  G().watchGL(cv, {
    onLost() { glLost = true; if (raf) cancelAnimationFrame(raf); raf = 0; cancelInput(); save(); showGlLost(true); },
    onRestored() { glRestored(); },
  });
}

// ---------- boot ----------
renderSoundBtn();
on(window, 'resize', resize);
if (window.visualViewport) on(visualViewport, 'resize', resize);
on(document, 'visibilitychange', () => { if (document.visibilityState === 'hidden') { cancelInput(); save(); } else invalidate(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => invalidate());
const launch = PF ? PF.launch() : { daily: null };
if (!load()) { resetRun(); spawn(); spawn(); runTop = maxE(); }
resize(); rebuildMeshes();
updateRecords(); renderHud(); renderMode();
applyTheme();
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(applyTheme, 0));
// ?daily=YYYYMMDD (the hub's "today's challenge"): KoboGame starts it when the registry has flags.daily; until then, here
if (launch.daily) {
  const def = G() && G().info().def;
  if (!(def && def.flags && def.flags.daily)) setTimeout(() => { if (!vs && mode !== 'tutorial') startDaily(launch.daily); }, 0);
}
const firstVisit = store.get(KEY_HOWTO) == null;
over = !canMove(cells);
if (firstVisit) showHowto(true);
else if (!launch.daily && over) { overInfo = { isNew: false }; showOver(); }
else save();
invalidate();
booted = true;

// ---------- test hooks (?debug only) ----------
// greedy bot move: most points now, then the best follow-up, then the most room
function botMove() {
  if (mode === 'tutorial' && tut) {
    if (tut.step === 0) return dirName(tut.axis, 1);
    if (tut.step === 1) return viewInfo().far;
    return null;
  }
  let bestD = null, bv = -1e9;
  for (const d of Object.keys(DIRS)) {
    const r = slide(cells, d); if (!r.changed) continue;
    let la = 0; for (const d2 of Object.keys(DIRS)) { const r2 = slide(r.cells, d2); if (r2.changed) la = Math.max(la, r2.gained); }
    const v = r.gained * 2 + la + r.cells.filter(c => !c).length * 30;
    if (v > bv) { bv = v; bestD = d; }
  }
  return bestD;
}
if (DEBUG) {
  window.__n59049 = { // kept for older scripts
    slide: (arr, dir) => { const r = slide(fromExps(arr), dir); return { cells: r.cells.map(c => (c ? c.e : 0)), changed: r.changed, gained: r.gained }; },
    setBoard(arr, sc) { finishAnims(); cells = fromExps(arr); if (sc != null) score = sc; prev = null; won = maxE() >= GOAL_E; hideOverlays(); rebuildMeshes(); afterChange(false); },
    board: () => exps(),
    move: doMove, mapSwipe, viewInfo: () => { const v = viewInfo(); return { depth: v.depth, far: v.far, near: v.near }; },
    rotate, tilt, undo, newGame,
    state: () => ({ score, best, bestTile, undoLeft, won, over, yaw: cam.tyaw, pitch: cam.tpitch, hasPrev: !!prev }),
  };
}
if (window.__kb) Object.assign(window.__kb, {
  ready: () => booted && lastW > 0 && renderer.info.render.frame > 0,
  state: () => ({ mode: vs ? (vs.playing || 'versus') : mode, score, time: sess ? Math.round(performance.now() - sess.t0) : 0, over, stage: null,
    paused: !!(G() && G().paused()), best, bestTile, undoLeft, moves: movesMade, maxTile: pow3(maxE()), won, board: exps(),
    daily: daily ? { dateKey: daily.dateKey, goal: daily.goal, best: daily.best, tries: daily.tries, draws } : null,
    howto: !$('howto').hidden, overShown: !$('overOv').hidden, winShown: !$('winOv').hidden, glLost }),
  frames: () => renderer.info.render.frame,
  // endless game: "win" makes a 59049 tile (daily: reaches the day's goal and ends the try); "lose" fills the board so nothing moves
  win() {
    if (over || vs || mode === 'tutorial') return false;
    startPlay();
    if (mode === 'daily') { score = Math.max(score, daily.goal); renderHud(); finishRun(true); return true; }
    const i = cells.findIndex(c => !c); cells[i >= 0 ? i : 0] = { e: GOAL_E, id: nextId++ };
    score += pow3(GOAL_E); updateRecords(); rebuildMeshes(); afterChange(false); return true;
  },
  lose() {
    if (over || vs || mode === 'tutorial') return false;
    startPlay(); finishAnims();
    cells = cells.map((c, i) => { const [x, y, z] = coords(i); return { e: 1 + ((x + y + z) & 1), id: nextId++ }; });
    rebuildMeshes(); prev = null; afterChange(false); return true;
  },
  step(n) {
    let k = 0;
    for (; k < (n || 1); k++) {
      if (over || anyOverlay() || (vs && !KoboVersus.canPlay())) break;
      if (mode === 'tutorial' && tut && tut.step === 2) { rotate(1); continue; }
      const d = botMove(); if (!d) break;
      if (!doMove(d)) break;
    }
    finishAnims();
    return k;
  },
  tutorial: () => ({ step: tut ? tut.step : (store.get(KEY_TUT) ? TUT_STEPS.length : 0), done: !tut && !!store.get(KEY_TUT), active: !!tut }),
  tutorialStart: startTutorial, tutorialFinish: finishTutorial,
  daily: dk => startDaily(dk), normal: () => setMode('normal'), menu: openMenu, howto: () => showHowto(false),
  goalFor, move: doMove, rotate, tilt, undo, newGame, viewInfo: () => { const v = viewInfo(); return { depth: v.depth, far: v.far, near: v.near }; },
});
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
