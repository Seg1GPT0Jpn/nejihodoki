<script>
(() => {
'use strict';
const T = KoboI18n.t;
const KEY_BEST = 'kusoge.n59049.best', KEY_TILE = 'kusoge.n59049.bestTile', KEY_STATE = 'kusoge.n59049.state', KEY_SOUND = 'kusoge.sound';
const GOAL_E = 10, UNDO_MAX = 3, SLIDE = 110, POP = 180, APPEAR = 160;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const fmt = n => Number(n).toLocaleString('ja-JP');
const pow3 = e => Math.pow(3, e);

// ---------- pure rules ----------
const idx = (x, y, z) => x + 3 * y + 9 * z;
const coords = i => [i % 3, ((i / 3) | 0) % 3, (i / 9) | 0];
const DIRS = { '+X': [0, 1], '-X': [0, -1], '+Y': [1, 1], '-Y': [1, -1], '+Z': [2, 1], '-Z': [2, -1] };
const dirName = (a, s) => (s > 0 ? '+' : '-') + 'XYZ'[a];
// cells: array(27) of {e,id}|null. Tiles slide toward the far side; three equal tiles in a line merge into one (exponent+1).
function slide(cells, dir) {
  const [a, s] = DIRS[dir];
  const o = [0, 1, 2].filter(k => k !== a);
  const out = new Array(27).fill(null), moves = [], merges = [];
  let gained = 0, changed = false;
  for (let u = 0; u < 3; u++) for (let w = 0; w < 3; w++) {
    const line = (s > 0 ? [2, 1, 0] : [0, 1, 2]).map(p => { const c = [0, 0, 0]; c[a] = p; c[o[0]] = u; c[o[1]] = w; return idx(c[0], c[1], c[2]); });
    const tiles = line.filter(i => cells[i]).map(i => ({ t: cells[i], from: i }));
    if (tiles.length === 3 && tiles[0].t.e === tiles[1].t.e && tiles[1].t.e === tiles[2].t.e) {
      const e = tiles[0].t.e + 1, keep = tiles[0].t.id;
      out[line[0]] = { e, id: keep }; gained += pow3(e); changed = true;
      merges.push({ to: line[0], e, ids: tiles.map(t => t.t.id), keep });
      tiles.forEach(t => moves.push({ id: t.t.id, from: t.from, to: line[0] }));
    } else {
      tiles.forEach((t, k) => { out[line[k]] = t.t; moves.push({ id: t.t.id, from: t.from, to: line[k] }); if (t.from !== line[k]) changed = true; });
    }
  }
  return { cells: out, moves, merges, gained, changed };
}
const canMove = cells => Object.keys(DIRS).some(d => slide(cells, d).changed);

// ---------- state ----------
let cells = new Array(27).fill(null), score = 0, undoLeft = UNDO_MAX, prev = null, won = false, over = false, nextId = 1, movesMade = 0;
let best = Number(store.get(KEY_BEST)) || 0, bestTile = Number(store.get(KEY_TILE)) || 0;
const exps = () => cells.map(c => (c ? c.e : 0));
const fromExps = arr => arr.map(e => (e > 0 ? { e, id: nextId++ } : null));
const maxE = () => cells.reduce((m, c) => Math.max(m, c ? c.e : 0), 0);
function save() {
  store.set(KEY_STATE, JSON.stringify({ v: 1, cells: exps(), score, undoLeft, prev, won, yaw: cam.tyaw, pitch: cam.tpitch, t: Date.now() }));
}
function load() {
  try {
    const s = JSON.parse(store.get(KEY_STATE) || 'null');
    if (!s || s.v !== 1 || !Array.isArray(s.cells) || s.cells.length !== 27) return false;
    if (!s.cells.every(e => Number.isInteger(e) && e >= 0 && e < 30) || !s.cells.some(e => e > 0)) return false;
    cells = fromExps(s.cells); score = Number(s.score) || 0;
    undoLeft = Math.max(0, Math.min(UNDO_MAX, Number(s.undoLeft) | 0)); won = !!s.won;
    prev = s.prev && Array.isArray(s.prev.cells) && s.prev.cells.length === 27 ? { cells: s.prev.cells.slice(), score: Number(s.prev.score) || 0 } : null;
    if (typeof s.yaw === 'number' && typeof s.pitch === 'number') { cam.tyaw = cam.yaw = s.yaw; cam.tpitch = cam.pitch = s.pitch; }
    return true;
  } catch (e) { return false; }
}
function spawn() {
  const empty = []; cells.forEach((c, i) => { if (!c) empty.push(i); });
  if (!empty.length) return null;
  const i = empty[(Math.random() * empty.length) | 0];
  cells[i] = { e: Math.random() < 0.9 ? 1 : 2, id: nextId++ };
  return i;
}

// ---------- three.js scene ----------
const play = $('play'), cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(-2, 3, 4); camera.add(key);
const rim = new THREE.DirectionalLight(0x9fdcff, 0.25); rim.position.set(4, -2, -3); scene.add(rim);
const world = new THREE.Group(); scene.add(world);
const SP = 1.0, TILE = 0.62;
const cellPos = i => { const [x, y, z] = coords(i); return new THREE.Vector3((x - 1) * SP, (y - 1) * SP, (z - 1) * SP); };

// lattice
(function lattice() {
  const inner = [], outer = [], h = 1.5 * SP, L = [-1.5, -0.5, 0.5, 1.5].map(v => v * SP);
  for (const p of L) for (const q of L) {
    const edge = Math.abs(p) === h && Math.abs(q) === h, arr = edge ? outer : inner;
    arr.push(-h, p, q, h, p, q, p, -h, q, p, h, q, p, q, -h, p, q, h);
  }
  const mk = (arr, op) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x8fe3ff, transparent: true, opacity: op, depthWrite: false })); };
  world.add(mk(inner, 0.13)); world.add(mk(outer, 0.5));
  const dots = []; for (let i = 0; i < 27; i++) { const p = cellPos(i); dots.push(p.x, p.y, p.z); }
  const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.Float32BufferAttribute(dots, 3));
  world.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: 0x8fe3ff, size: 0.07, transparent: true, opacity: 0.45, depthWrite: false })));
})();

// rounded cube geometry (each face keeps its own 0..1 UVs so the number texture sits on every face)
function roundedBox(size, r, seg) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
