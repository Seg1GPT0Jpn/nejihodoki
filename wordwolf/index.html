<style>
/* ワードウルフ：月夜のむらさきと、ことばカードのきいろ。--kb-* は共通のトークンを塗りなおしたもの、--ww-* はこのゲームだけ */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1c1733; --kb-surface: #2a2348; --kb-surface-2: #352d5a; --kb-sunken: #130f26; --kb-line: #4d4380;
  --kb-ink: #f4f0ff; --kb-dim: #b9b0dc; --kb-accent: #ffd24d; --kb-accent-ink: #2b2200; --kb-accent-text: #ffe083; --kb-accent-soft: rgba(255, 210, 77, .16);
  --kb-scrim: rgba(8, 5, 20, .8); --kb-focus: #8fe3ff;
  --ww-panel: rgba(255, 255, 255, .07); --ww-card: linear-gradient(#30285a, #272046); --ww-go: linear-gradient(#ffe27a, #f2b92b); --ww-go-shadow: #9a6d00;
  --ww-good: #7fe3a6; --ww-bad: #ff9a8a; --ww-wolf: #ff8fb0; --ww-back: repeating-linear-gradient(45deg, #4a3f86 0 10px, #3e3475 10px 20px);
  --ww-title: linear-gradient(90deg, #ffe083, #ffd24d 50%, #ff9ec2); color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #fbf3dd; --kb-surface: #fffdf5; --kb-surface-2: #f1e5c3; --kb-sunken: #e7d9ae; --kb-line: #cdbb86;
    --kb-ink: #2a2140; --kb-dim: #62557f; --kb-accent: #7a46d6; --kb-accent-ink: #ffffff; --kb-accent-text: #5a2fb0; --kb-accent-soft: rgba(122, 70, 214, .12);
    --kb-scrim: rgba(42, 33, 64, .5); --kb-focus: #b34700;
    --ww-panel: rgba(42, 33, 64, .06); --ww-card: linear-gradient(#fffdf5, #f5e9c8); --ww-go: linear-gradient(#9462e8, #6d3cc4); --ww-go-shadow: #43238a;
    --ww-good: #1c7a47; --ww-bad: #b83a26; --ww-wolf: #b3295f; --ww-back: repeating-linear-gradient(45deg, #b9a4ec 0 10px, #a68ce0 10px 20px);
    --ww-title: linear-gradient(90deg, #5a2fb0, #7a46d6 55%, #c0306c); color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #fbf3dd; --kb-surface: #fffdf5; --kb-surface-2: #f1e5c3; --kb-sunken: #e7d9ae; --kb-line: #cdbb86;
  --kb-ink: #2a2140; --kb-dim: #62557f; --kb-accent: #7a46d6; --kb-accent-ink: #ffffff; --kb-accent-text: #5a2fb0; --kb-accent-soft: rgba(122, 70, 214, .12);
  --kb-scrim: rgba(42, 33, 64, .5); --kb-focus: #b34700;
  --ww-panel: rgba(42, 33, 64, .06); --ww-card: linear-gradient(#fffdf5, #f5e9c8); --ww-go: linear-gradient(#9462e8, #6d3cc4); --ww-go-shadow: #43238a;
  --ww-good: #1c7a47; --ww-bad: #b83a26; --ww-wolf: #b3295f; --ww-back: repeating-linear-gradient(45deg, #b9a4ec 0 10px, #a68ce0 10px 20px);
  --ww-title: linear-gradient(90deg, #5a2fb0, #7a46d6 55%, #c0306c); color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); max-width: 640px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--kb-ink); text-decoration: none; background: var(--ww-panel); border: 1px solid var(--kb-line); padding: 0; cursor: pointer; }

.sp { flex: 1 1 auto !important; min-height: 4px; }
.card { background: var(--ww-card); border: 1px solid var(--kb-line); border-radius: 20px; padding: 12px 14px; text-align: center; box-shadow: 0 6px 22px rgba(0, 0, 0, .25); }
.card h2 { margin: 0 0 4px; font: 400 21px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }

.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--ww-go-shadow); } .btn:disabled { opacity: .42; cursor: default; box-shadow: none; }

.opt small { font-weight: 500; font-size: 10px; opacity: .85; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.names input, .fld input { min-width: 0; min-height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 10px; user-select: text; -webkit-user-select: text; }
.cover { text-align: center; padding: 26px 14px; } .cover .who { font: 400 30px var(--kb-font-display); color: var(--kb-accent-text); margin: 8px 0 6px; overflow-wrap: anywhere; }
.cover .ico { width: 64px; height: 64px; margin: 0 auto; color: var(--kb-accent-text); } .cover .ico svg { width: 100%; height: 100%; }
#wcard { position: relative; margin: 6px auto; width: min(100%, 300px); min-height: 170px; border-radius: 22px; border: 2px solid var(--kb-line); display: grid; place-items: center; text-align: center; padding: 14px; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; background: var(--ww-back); color: var(--kb-ink); font: 800 15px var(--kb-font-body); box-shadow: 0 6px 0 rgba(0, 0, 0, .25); }
#wcard.open { background: var(--kb-surface); border-color: var(--kb-accent); }
#wcard .wd { font: 400 34px/1.2 var(--kb-font-display); color: var(--kb-ink); overflow-wrap: anywhere; } #wcard .wd small { display: block; font: 500 12px var(--kb-font-body); color: var(--kb-dim); margin-top: 6px; }
#wcard .sealed { display: flex; flex-direction: column; align-items: center; gap: 6px; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); color: #fff; } #wcard .sealed svg { width: 40px; height: 40px; }
:root[data-kb-theme="light"] #wcard .sealed { color: #2a2140; text-shadow: none; }
@media (prefers-color-scheme: light) { :root:not([data-kb-theme="dark"]) #wcard .sealed { color: #2a2140; text-shadow: none; } }
.timer { font: 400 54px var(--kb-font-display); color: var(--kb-accent-text); font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0; } .timer.low { color: var(--ww-bad); } .timer.zero { animation: blink .7s steps(2) infinite; }
.prompt { margin: 6px 0; padding: 8px 12px; border-radius: 14px; background: var(--kb-accent-soft); border: 1px dashed var(--kb-accent); font-weight: 800; font-size: 14px; line-height: 1.5; }
.log { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.line { padding: 7px 10px; border-radius: 14px; background: var(--ww-panel); border: 1px solid var(--kb-line); font-size: 14px; line-height: 1.45; } .line b { color: var(--kb-accent-text); } .line.me { border-color: var(--kb-accent); background: var(--kb-accent-soft); } .line i { font-style: normal; font-size: 11px; color: var(--kb-dim); margin-left: 6px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .pick.one { grid-template-columns: 1fr; }
.pk { min-height: 52px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--ww-panel); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 6px 8px; cursor: pointer; text-align: center; line-height: 1.35; } .pk small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.pk:active { transform: translateY(1px); } .pk[aria-pressed="true"] { border-color: var(--kb-accent); box-shadow: inset 0 0 0 2px var(--kb-accent); background: var(--kb-accent-soft); }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 12px; margin: 6px 4px; text-align: left; font-size: 13px; font-weight: 800; align-items: center; } .kv .h { color: var(--kb-dim); font-weight: 500; font-size: 11px; } .kv span:nth-child(3n+2), .kv span:nth-child(3n) { text-align: right; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--kb-accent); color: var(--kb-accent-ink); }
.badge.wolf { background: var(--ww-wolf); color: #fff; } .badge.good { background: var(--ww-good); color: #072; }
.w2 { display: flex; gap: 8px; justify-content: center; margin: 6px 0; } .w2 > div { flex: 1; padding: 8px 6px; border-radius: 14px; background: var(--ww-panel); border: 1px solid var(--kb-line); font: 400 22px var(--kb-font-display); overflow-wrap: anywhere; } .w2 small { display: block; font: 500 11px var(--kb-font-body); color: var(--kb-dim); margin-bottom: 2px; } .w2 .wf { border-color: var(--ww-wolf); }
.howto { text-align: left; } .howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); } .howto ul { margin: 4px 0; padding-left: 20px; font-size: 13px; line-height: 1.55; color: var(--kb-ink); } .howto li { margin: 3px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); } .langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.toastbar { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 85; max-width: 90%; padding: 8px 16px; border-radius: 14px; background: rgba(20, 20, 28, .92); color: #fff; font-weight: 800; font-size: 14px; pointer-events: none; animation: fade .2s ease-out; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes fade { from { opacity: 0; } } @keyframes blink { 50% { opacity: .35; } } @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
#view > * { animation: rise .2s ease-out; }
@media (prefers-reduced-motion: reduce) { #view > *, .timer.zero, .toastbar { animation: none !important; } }
@media (max-width: 379px) { h1 { font-size: 15px; } #view { padding: 6px 8px 12px; } .card { padding: 10px 10px; } #wcard .wd { font-size: 28px; } .timer { font-size: 46px; } .w2 > div { font-size: 18px; } }
body.thumb header { display: none !important; }
.ptag { font-style: normal; font-size: 10.5px; padding: 0 7px; margin-left: 4px; border-radius: 999px; background: var(--kb-accent-soft); color: var(--kb-accent-text); font-weight: 800; }
.line .lead { color: var(--kb-dim); }
.topic { min-height: 4px; margin: 4px 0; } .tcard { display: inline-block; padding: 8px 14px; border-radius: 14px; background: var(--kb-surface-2); border: 1.5px solid var(--kb-accent); font-weight: 800; font-size: 14px; line-height: 1.5; }
.wfnote { margin-top: 8px; padding: 4px 10px; border-radius: 10px; background: var(--ww-wolf); color: #fff; font: 800 12.5px var(--kb-font-body); }
.owc { display: block; width: 100%; box-sizing: border-box; margin: 6px 0 2px; min-height: 64px; padding: 10px; border-radius: 16px; border: 2px solid var(--kb-line); background: var(--ww-back); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; text-align: center; }
.owc.open { background: var(--kb-surface); border-color: var(--kb-accent); } .owc .wd { font: 400 28px/1.2 var(--kb-font-display); overflow-wrap: anywhere; } .owc small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); } .owc .sealed { display: inline-flex; align-items: center; gap: 6px; } .owc .sealed svg { width: 22px; height: 22px; }
.timer.sm { display: inline-block; font-size: 22px; margin: 0; vertical-align: middle; min-width: 3ch; }
.btn.sub[disabled] { opacity: .5; }

</style>

<div id="app">

    <a class="back" href="../" id="backLink" aria-label="ゲーム一覧へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>

<script>
(() => {
'use strict';
// ワードウルフ：engine.js が配る・CPUのヒント・投票・点数（pure）、words.js が ことば、online.js がオンラインのホスト側。このファイルは机の上：画面・タイマー・保存・オンラインの画面。
const EN = KoboI18n.lang === 'en';
const L = (ja, en) => (EN ? en : ja);
const E = window.WordWolfEngine, W = window.WordWolfWords, ON = window.WordWolfOnline;
const PF = window.KoboPlatform || null, A = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'wordwolf', SAVE_KEY = 'kusoge.wordwolf.save', HOWTO_KEY = 'kusoge.wordwolf.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id), view = $('view');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sfx = (n, a) => { if (A) A.sfx(n, a); };
const emit = (t, p) => { const g = KG(); if (g) g.emit(t, p); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const wn = w => (EN ? w.en : w.ja);
const hint = t => E.hintText(t, EN ? 'en' : 'ja', W);
const CPUN = EN ? ['Mika', 'Pochi', 'Haru', 'Sora', 'Momo', 'Ren', 'Yuki'] : ['ミケ', 'ポチ', 'ハル', 'ソラ', 'モモ', 'レン', 'ユキ'];
const ICON = {
  wolf: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10l12 8h20l12-8 2 22c0 12-10 22-24 22S8 44 8 32z"/><circle cx="24" cy="32" r="2.5" fill="currentColor"/><circle cx="40" cy="32" r="2.5" fill="currentColor"/><path d="M28 42h8l-4 5z" fill="currentColor"/></svg>',
  phone: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="18" y="6" width="28" height="52" rx="6"/><path d="M28 50h8"/><path d="M50 22l8 8-8 8M14 22l-8 8 8 8" /></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  go: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M9 5l9 7-9 7z"/></svg>',
};

// ---------- save ----------
const SET0 = { n: 4, lv: 0, minutes: 4, reveal: 'hold', rounds: 2, cpus: 4, skill: 2, cats: [], wolves: 1, knows: false };
function readSave() {
  let o = null; try { o = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) {}
  const s = { v: 1, stats: E.newStats(), set: Object.assign({}, SET0), recent: [] };
  if (!o || typeof o !== 'object') { s.rank = 0; return s; }
  const n = (v, d) => (Number.isFinite(Number(v)) ? Math.max(0, Math.floor(Number(v))) : d);
  if (o.stats && typeof o.stats === 'object') for (const k of Object.keys(s.stats)) s.stats[k] = n(o.stats[k], 0);
  if (o.set && typeof o.set === 'object') {
    s.set.n = clamp(n(o.set.n, 4), 3, 8); s.set.lv = clamp(n(o.set.lv, 0), 0, 3); s.set.minutes = [1, 2, 3, 4, 5].includes(n(o.set.minutes, 4)) ? n(o.set.minutes, 4) : 4;
    s.set.reveal = o.set.reveal === 'tap' ? 'tap' : 'hold'; s.set.rounds = clamp(n(o.set.rounds, 2), 1, 3); s.set.cpus = clamp(n(o.set.cpus, 4), 2, 5); s.set.skill = clamp(n(o.set.skill, 2), 1, 3);
    s.set.wolves = clamp(n(o.set.wolves, 1), 1, 2); s.set.knows = o.set.knows === true;
