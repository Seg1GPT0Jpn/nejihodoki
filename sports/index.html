<style>

:root, :root[data-kb-theme="dark"] {

  --sp-panel: rgba(255, 255, 255, .08); --sp-card: linear-gradient(#17506f, #123f5a); --sp-go: linear-gradient(#ffb08a, #ff7a5c); --sp-go-shadow: #b0432c;
  --sp-good: #7be0a0; --sp-bad: #ff9a8a; --sp-star: #ffd24d; --sp-star-off: #3c637a; --sp-key: #1d5a7c; --sp-key-shadow: #0e3347; --sp-title: linear-gradient(90deg, #bff5ff, #ffd24d 55%, #ff8a6b);

    --kb-scrim: rgba(15, 48, 71, .45); --kb-focus: #b36a00;
    --sp-panel: rgba(15, 48, 71, .06); --sp-card: linear-gradient(#ffffff, #dff2fa); --sp-go: linear-gradient(#ff9a78, #e8573a); --sp-go-shadow: #9e3420;
    --sp-good: #1f7a46; --sp-bad: #b83a26; --sp-star: #d08a00; --sp-star-off: #b6d0dc; --sp-key: #dff2fa; --sp-key-shadow: #8fc6de; --sp-title: linear-gradient(90deg, #0b6f94, #d08a00 55%, #e8573a);

.panel > * { flex: none; } .panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font: 400 21px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }

.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--sp-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--sp-go-shadow); }

.opt { flex: 1 1 0; min-width: 44px; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 12.5px var(--kb-font-body); cursor: pointer; padding: 2px 4px; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }

.row .ic { width: 40px; height: 40px; flex: none; } .row .tx { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 800; line-height: 1.3; } .row .tx small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.row.cur { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent); }
.stars { color: var(--sp-star); letter-spacing: 1px; font-size: 15px; } .stars i { color: var(--sp-star-off); font-style: normal; }
.big { font: 400 34px var(--kb-font-display); line-height: 1.15; color: var(--kb-ink); } .newrec { display: inline-block; margin: 2px 2px; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 6px 6px; text-align: left; font-size: 13px; font-weight: 800; } .kv span:nth-child(odd) { color: var(--kb-dim); font-weight: 500; } .kv span:nth-child(even) { text-align: right; }
.howto { text-align: left; } .howto h2 { text-align: center; } .howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); } .howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); } .howto li { margin: 3px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }

.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .pcell { padding: 2px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--sp-key); color: var(--kb-ink); min-height: 74px; cursor: pointer; font: inherit; display: flex; flex-direction: column; align-items: center; } .pcell img { width: 100%; border-radius: 8px; display: block; } .pcell .pq { font: 400 26px var(--kb-font-display); padding: 10px 0; color: var(--kb-dim); } .pcell small { font-size: 9px; color: var(--kb-dim); line-height: 1.2; }

.rec { width: 100%; border-collapse: collapse; font-size: 12px; } .rec td, .rec th { padding: 4px 3px; border-bottom: 1px solid var(--kb-line); text-align: center; } .rec td:first-child, .rec th:first-child { text-align: left; font-weight: 800; }

<script>
(() => {
'use strict';
// ぽかぽか島スポーツ：core.js（乱数・種目の表・★・保存・デイリー・得点の決まり）、sim1/sim2.js（11種目の物理と得点）、art.js（島とキャラクターの絵）、
// venues*.js（種目ごとの入力・時間・絵）。このファイルは島（ハブ）・パネル・ふたりプレイ・保存・プラットフォームとの連携。
const EN = KoboI18n.lang === 'en';
const L = (ja, en) => (EN ? en : ja);
const C = window.SportsCore, ART = window.SportsArt, VEN = window.SportsVenues, SP = C.SPORTS;
const PF = window.KoboPlatform || null, A = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'sports', SAVE_KEY = 'kusoge.sports.save', HOWTO_KEY = 'kusoge.sports.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sfx = (n, a) => { if (A) A.sfx(n, a); }, tone = (f, d, o) => { if (A) A.tone(f, d, o); }, noise = (d, o) => { if (A) A.noise(d, o); };
const buzz = p => { if (save.set.vib && A) A.vibrate(p); };
const emit = (type, p) => { const g = KG(); if (g) g.emit(type, p); };
const nm = s => L(s.ja, s.en), dname = d => C.DIFF_NAMES[EN ? 'en' : 'ja'][d];
const dateKeyNow = () => (PF && PF.jstDateKey ? PF.jstDateKey() : (() => { const d = new Date(Date.now() + 9 * 3600e3); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); })());

// ---------- 保存 ----------
function readSave() { let o = null; try { o = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) {} return C.sanitize(o); }
let save = readSave();
function writeSave() { C.derive(save); countStars3(); store.set(SAVE_KEY, JSON.stringify(save)); renderHudStars(); }
function countStars3() { let n = 0; for (const s of SP) for (let d = 0; d < 3; d++) if (C.starsOf(save, s.id, d) >= 3) n++; if (n > (save.stats.stars3 | 0)) save.stats.stars3 = n; }
const MAXKEYS = { jumpM: 1, streak: 1 };
function bumpStat(k, n) { if (S && S.practice) return; if (MAXKEYS[k]) C.setMax(save, k, n == null ? 1 : n); else C.bump(save, k, n == null ? 1 : n); }

// ---------- 文章 ----------
const TXT = {
  archery: { d: ['風を読んで、的のまんなかをねらう弓の競技。', 'Read the wind and hit the bullseye.'], demo: { strokes: [[[0.35, 0.7], [0.5, 0.5], [0.55, 0.42]]], tail: 'release' },
