<style>
/* ぴったりパズル工房: warm wood chrome around one canvas (board + tray). --kb-* are the shared tokens re-tinted; --fit-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1d140c; --kb-surface: #2b1e12; --kb-surface-2: #36271a; --kb-sunken: #130d07; --kb-line: #503a24;
  --kb-ink: #f8ecd8; --kb-dim: #cdb99b;
  --kb-accent: #e3b04b; --kb-accent-ink: #2b1d05; --kb-accent-text: #f0c466; --kb-accent-soft: rgba(227, 176, 75, .16);
  --kb-scrim: rgba(12, 8, 4, .78); --kb-focus: #ffe08a;
  --fit-panel: rgba(255, 232, 196, .07); --fit-line: rgba(255, 226, 186, .18); --fit-card: linear-gradient(#34261a, #251a10);
  --fit-board: #5b3b20; --fit-board2: #432a15; --fit-cell: #1b1008; --fit-cell2: #2a1a0d; --fit-brass: #e0b955; --fit-brass-d: #8a6a1f; --fit-tray: #2a1d11; --fit-tray2: #20150b;
  --fit-go: linear-gradient(#f2c660, #d89a2a); --fit-go-shadow: #7d5212; --fit-good: #9bdc8a; --fit-bad: #ff8a72; --fit-title: linear-gradient(90deg, #ffe0a0, #e3b04b 55%, #d9824a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f2e7d3; --kb-surface: #fffaf0; --kb-surface-2: #f6ead6; --kb-sunken: #e5d5ba; --kb-line: #d5bf9c;
    --kb-ink: #3a2a1a; --kb-dim: #6d5640;
    --kb-accent: #b8731a; --kb-accent-ink: #ffffff; --kb-accent-text: #8f5510; --kb-accent-soft: rgba(184, 115, 26, .12);
    --kb-scrim: rgba(58, 42, 26, .45); --kb-focus: #1f6fbf;
    --fit-panel: rgba(58, 42, 26, .05); --fit-line: #dcc7a4; --fit-card: linear-gradient(#fffaf0, #f6ead6);
    --fit-board: #8a6034; --fit-board2: #6f4a24; --fit-cell: #4a2f18; --fit-cell2: #5c3b20; --fit-brass: #c99a2e; --fit-brass-d: #7a5a12; --fit-tray: #e8d6b6; --fit-tray2: #ddc8a2;
    --fit-go: linear-gradient(#e69a36, #bf7216); --fit-go-shadow: #7a470c; --fit-good: #2f8a3a; --fit-bad: #c2412a; --fit-title: linear-gradient(90deg, #9a5a14, #b8731a 55%, #a04a2a);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f2e7d3; --kb-surface: #fffaf0; --kb-surface-2: #f6ead6; --kb-sunken: #e5d5ba; --kb-line: #d5bf9c;
  --kb-ink: #3a2a1a; --kb-dim: #6d5640;
  --kb-accent: #b8731a; --kb-accent-ink: #ffffff; --kb-accent-text: #8f5510; --kb-accent-soft: rgba(184, 115, 26, .12);
  --kb-scrim: rgba(58, 42, 26, .45); --kb-focus: #1f6fbf;
  --fit-panel: rgba(58, 42, 26, .05); --fit-line: #dcc7a4; --fit-card: linear-gradient(#fffaf0, #f6ead6);
  --fit-board: #8a6034; --fit-board2: #6f4a24; --fit-cell: #4a2f18; --fit-cell2: #5c3b20; --fit-brass: #c99a2e; --fit-brass-d: #7a5a12; --fit-tray: #e8d6b6; --fit-tray2: #ddc8a2;
  --fit-go: linear-gradient(#e69a36, #bf7216); --fit-go-shadow: #7a470c; --fit-good: #2f8a3a; --fit-bad: #c2412a; --fit-title: linear-gradient(90deg, #9a5a14, #b8731a 55%, #a04a2a);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 65%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 6px 0; width: 100%; max-width: 820px; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--fit-panel); border: 1px solid var(--fit-line); color: var(--kb-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 15px; height: 15px; flex: none; }
#modeChip { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; color: var(--kb-dim); background: transparent; border: 0; padding-left: 2px; font-size: 12.5px; }
#timeChip.low { color: var(--fit-bad); border-color: var(--fit-bad); animation: blink .8s steps(2) infinite; }
#timeChip.pen { animation: gain .5s ease-out; }
.icon { position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--fit-line); background: var(--fit-panel); color: var(--kb-ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 820px; margin: 0 auto; box-sizing: border-box; padding: 4px 6px 6px; gap: 6px; }
#stageWrap { flex: 1 1 auto; min-height: 140px; position: relative; overflow: hidden; border-radius: 16px; background: linear-gradient(var(--fit-tray), var(--fit-tray2)); box-shadow: 0 6px 22px rgba(0, 0, 0, .28), 0 0 0 1px var(--fit-line); }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: grab; }
#board.drag { cursor: grabbing; }
#tip { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; padding: 6px 10px; border-radius: 12px; background: rgba(34, 24, 14, .94); color: #fff3dc; border: 1px solid rgba(255, 226, 186, .3); font-size: 12.5px; font-weight: 800; line-height: 1.4; pointer-events: none; text-align: center; animation: rise .25s ease-out; }
#tip.coach { border-color: #e3b04b; background: rgba(66, 44, 12, .96); }
#tip .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; margin-right: 6px; border-radius: 999px; background: #e3b04b; color: #2b1d05; }
#tip small { display: block; font-weight: 500; opacity: .85; }
#tip.bottom { top: auto; bottom: 8px; }
#flash { position: absolute; left: 0; right: 0; top: 42%; z-index: 7; text-align: center; font-family: var(--kb-font-display); font-size: 34px; color: #ffd777; text-shadow: 0 3px 0 #7a4a10, 0 0 18px rgba(255, 200, 80, .7); pointer-events: none; opacity: 0; }
#flash.on { animation: flash 1s ease-out; }
#bar { flex: none; display: flex; gap: 6px; align-items: stretch; }
.tb { flex: 1 1 0; min-width: 44px; min-height: 52px; border-radius: 14px; border: 1px solid var(--fit-line); background: var(--kb-surface); color: var(--kb-ink); box-shadow: 0 3px 0 var(--kb-sunken); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 800 10.5px var(--kb-font-body); cursor: pointer; padding: 2px 2px; }
.tb svg { width: 22px; height: 22px; }
.tb span { display: block; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--kb-sunken); }
.tb:disabled { opacity: .4; cursor: default; }
.tb.hint { background: var(--fit-go); color: #2a1606; border: 0; box-shadow: 0 3px 0 var(--fit-go-shadow); }
.tb.hint:disabled { filter: saturate(.3); box-shadow: none; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s ease-out; }
.card { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fit-card); border: 1px solid var(--fit-line); border-radius: 22px; padding: 16px 16px 10px; text-align: center; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); animation: rise .28s cubic-bezier(.2, 1.2, .4, 1); }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--fit-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 27px; line-height: 1.2; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; background: var(--fit-go); color: #2a1606; font: 800 15px var(--kb-font-body); box-shadow: 0 3px 0 var(--fit-go-shadow); cursor: pointer; text-decoration: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fit-go-shadow); }
.btn.sub { background: var(--fit-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--fit-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .stk { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.stars { font-size: 40px; letter-spacing: 4px; line-height: 1.1; margin: 4px 0; }
.stars i { font-style: normal; color: rgba(128, 104, 80, .4); display: inline-block; }
.stars i.on { color: #ffcf4a; text-shadow: 0 2px 0 #9a5e0c; animation: star .5s cubic-bezier(.2, 1.8, .4, 1) backwards; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.res div { padding: 6px 4px; border-radius: 12px; background: var(--fit-panel); border: 1px solid var(--fit-line); font-size: 11px; color: var(--kb-dim); font-weight: 800; }
.res b { display: block; font-size: 17px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.world { margin: 8px 0 4px; text-align: left; }
.world h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 13.5px; color: var(--kb-ink); }
.world h3 i { flex: none; width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.world h3 small { margin-left: auto; font-weight: 500; color: var(--kb-dim); font-size: 11px; }
.sgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sb { position: relative; min-height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--fit-line); background: var(--fit-panel); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; padding: 2px; }
.sb small { font-size: 10.5px; color: var(--kb-accent-text); letter-spacing: -1px; min-height: 12px; }
.sb:disabled { opacity: .42; cursor: default; }
.sb.cur { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent-soft); }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.5; color: var(--kb-ink); }
.howto li { margin: 4px 0; }

<script>
(() => {
'use strict';
// ぴったりパズル工房 — an original tile-fitting puzzle. fit/engine.js is the pure logic (seeded generator, tiling solver, play session,
// also run headless by tools/tests/unit/fit-engine.test.js); this file is the chrome: canvas drawing, drag / tap input, the clock,
// saving, scoring and the platform events.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const F = window.FitEngine;
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null, VS = window.KoboVersus || null;
const KG = () => window.KoboGame || null;
const GAME = 'fit';
const SAVE_KEY = 'kusoge.fit.save';
const RUN_KEY = 'kusoge.fit.run';
const HOWTO_KEY = 'kusoge.fit.howto';

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

const now = () => performance.now();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
function sfx(name, a) { if (AU) AU.sfx(name, a); }
function tone(f, d, o) { if (AU) AU.tone(f, d, o); }
function vibrate(p) { if (AU && AU.vibrate) AU.vibrate(p); }
// the wood sounds, built only from common/audio.js (no BGM)
const snd = {
  pick() { tone(440, 0.04, { type: 'triangle', vol: 0.06, slide: 560 }); },
  turn() { tone(560, 0.045, { type: 'triangle', vol: 0.07 }); tone(420, 0.05, { type: 'sine', vol: 0.05, delay: 0.03 }); },
  snap() { if (AU) AU.noise(0.05, { vol: 0.1, freq: 900 }); tone(190, 0.09, { type: 'triangle', vol: 0.16, slide: 120 }); tone(760, 0.05, { type: 'sine', vol: 0.05, delay: 0.02 }); vibrate(12); },
  bad() { tone(160, 0.12, { type: 'sawtooth', vol: 0.04, slide: 110 }); },
  hint() { sfx('select'); },
  undo() { tone(330, 0.06, { type: 'triangle', vol: 0.07, slide: 250 }); },
  solve() { sfx('win'); vibrate([30, 40, 60]); },
  star(i) { sfx('combo', i + 2); },
  tick() { tone(880, 0.04, { type: 'square', vol: 0.03 }); },
  skip() { tone(300, 0.1, { type: 'sine', vol: 0.08, slide: 180 }); },

const SEP = EN ? ' · ' : '・';
const WORLDS = F.WORLDS, STAGES = F.STAGES;
const stageName = id => T('ステージ {id}', { id });
const worldName = w => T(L(WORLDS[w - 1].name));
const pieceName = t => T(L(F.PIECES[t].name));
const PAL = ['#3f9d8c', '#e48a3a', '#d4527d', '#6f82d6', '#92b44a', '#cfa636', '#a06dc9'];

// ---------- save ----------
function defSave() { return { v: 1, st: {}, best: 0, stars: 0, stats: { solved: 0, perfect: 0, noHint: 0, fast: 0, decoy: 0, daily: 0, atRuns: 0, worlds: 0, flips: 0 }, daily: { last: 0, ms: 0 }, tut: 0 }; }
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }

  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const out = Object.assign(d, s);
  out.st = s.st && typeof s.st === 'object' && !Array.isArray(s.st) ? s.st : {};
  out.stats = Object.assign(defSave().stats, s.stats && typeof s.stats === 'object' ? s.stats : {});
  out.daily = Object.assign(defSave().daily, s.daily && typeof s.daily === 'object' ? s.daily : {});

  return out;
}
function recount(s) {
  let stars = 0, worlds = 0;
  for (const W of WORLDS) {
    let all = true;
    for (let i = 1; i <= F.PER_WORLD; i++) { const r = s.st[W.id + '-' + i]; const v = r ? Math.max(0, Math.min(3, r.s | 0)) : 0; stars += v; if (v < 1) all = false; }
    if (all) worlds++;

  s.stars = Math.max(s.stars | 0, stars); s.stats.worlds = Math.max(s.stats.worlds | 0, worlds);
}
let save = readSave();
function writeSave() { recount(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const stageStars = id => (save.st[id] ? save.st[id].s | 0 : 0);
const cleared = id => stageStars(id) > 0;
// a stage opens when one of the two before it is cleared (so one stuck stage never blocks the road)
const unlocked = i => i <= 1 || cleared(STAGES[i].id) || cleared(STAGES[i - 1].id) || cleared(STAGES[i - 2].id);
function readRun() {
  let r = null; try { r = JSON.parse(store.get(RUN_KEY) || 'null'); } catch (e) { r = null; }
  if (!r || r.v !== 1 || !['stage', 'daily', 'attack'].includes(r.mode) || !r.s) return null;
  if (r.mode === 'stage' && !F.STAGE_BY_ID[r.id]) return null;
  return r;
}
function clearRun() { store.del(RUN_KEY); }
const fmtT = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtSec = s => s >= 60 ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : Math.round(s) + T('秒');

// ---------- state ----------
let run = null;          // the puzzle on screen (or null at the title)
let paused = false, menuOpen = false;
let lastT = now(), raf = 0, needDraw = true;
let drag = null;         // { id, from: 'tray'|'board', px, py, ptype, moved, tapOnly }
let selId = -1;
let hintG = null;        // { id, x, y, rot, flip, until }
const fx = { pops: {}, fly: {}, sparks: [], win: null, shake: 0 };
let colors = {};
const playing = () => !!(run && run.started && !run.over && (run.mode !== 'vs' || (VS && VS.canPlay())));

// ---------- canvas & view ----------
const cv = $('board'), ctx = cv.getContext('2d');
const wrap = $('stageWrap');
const view = { W: 360, H: 520, dpr: 1, cs: 30, ox: 0, oy: 0, land: false, board: null, tray: null, slots: [] };
function readColors() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  colors = { board: g('--fit-board') || '#5b3b20', board2: g('--fit-board2') || '#432a15', cell: g('--fit-cell') || '#1b1008', cell2: g('--fit-cell2') || '#2a1a0d', brass: g('--fit-brass') || '#e0b955', brassD: g('--fit-brass-d') || '#8a6a1f', tray: g('--fit-tray') || '#2a1d11', tray2: g('--fit-tray2') || '#20150b', ink: g('--kb-ink') || '#fff' };
}
function layout() {
  const r = wrap.getBoundingClientRect();
  const W = Math.max(100, Math.floor(r.width)), H = Math.max(100, Math.floor(r.height));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const land = W > H * 1.1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  Object.assign(view, { W, H, dpr, land });
  const pz = run && run.puz;
  const n = pz ? pz.pieces.length : 4;
  let board, tray;
  if (land) { const bw = Math.round(W * 0.57); board = { x: 0, y: 0, w: bw, h: H }; tray = { x: bw, y: 0, w: W - bw, h: H }; }
  else {
    const th = Math.round(H * (n > 5 ? 0.4 : n > 3 ? 0.36 : 0.32));
    board = { x: 0, y: 0, w: W, h: H - th }; tray = { x: 0, y: H - th, w: W, h: th };
  }
  view.board = board; view.tray = tray;
  const bw = pz ? pz.w : 4, bh = pz ? pz.h : 4, pad = 16;
  const cs = Math.max(10, Math.floor(Math.min((board.w - pad * 2) / bw, (board.h - pad * 2) / bh, 62)));
  view.cs = cs;
  view.ox = Math.round(board.x + (board.w - bw * cs) / 2); view.oy = Math.round(board.y + (board.h - bh * cs) / 2);
  // tray slots (fixed per piece; a piece leaving the tray leaves its slot empty)
  const cols = land ? 2 : n <= 3 ? n : n <= 6 ? 3 : 4;
  const rows = Math.max(1, Math.ceil(n / cols));
  const sw = tray.w / cols, sh = tray.h / rows;
  view.slots = [];
  for (let i = 0; i < n; i++) { const c = i % cols, rr = Math.floor(i / cols); view.slots.push({ x: tray.x + c * sw, y: tray.y + rr * sh, w: sw, h: sh }); }
  needDraw = true;
}
const cellPx = (x, y) => ({ x: view.ox + x * view.cs, y: view.oy + y * view.cs });
// size of a tray piece: as big as its slot allows, never bigger than a board cell
function trayScale(i) {
  const S = run.S, sh = S.shapeOf(i), b = F.bbox(sh), sl = view.slots[i];
  return Math.max(6, Math.min((sl.w - 14) / b.w, (sl.h - 14) / b.h, view.cs * 0.92));
}
function trayOrigin(i) {
  const S = run.S, b = F.bbox(S.shapeOf(i)), sl = view.slots[i], s = trayScale(i);
  return { x: sl.x + (sl.w - b.w * s) / 2, y: sl.y + (sl.h - b.h * s) / 2, s };
}

// ---------- drawing ----------
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c, t, a) { const h = hex(c); return 'rgb(' + h.map(v => Math.round(v + (t - v) * a)).join(',') + ')'; }
function drawShape(g, cells, ox, oy, s, col, o) {
  o = o || {};
  const set = new Set(cells.map(c => c[0] + ',' + c[1]));
  g.save();
  g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.shadow) { g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = o.shadow; g.shadowOffsetY = o.shadow * 0.45; }
  if (o.scale && o.scale !== 1) { let cx = 0, cy = 0; for (const c of cells) { cx += c[0] + 0.5; cy += c[1] + 0.5; } cx = ox + cx / cells.length * s; cy = oy + cy / cells.length * s; g.translate(cx, cy); g.scale(o.scale, o.scale); g.translate(-cx, -cy); }
  const lw = Math.max(1.5, s * 0.07);
  for (const [cx, cy] of cells) {
    const x = ox + cx * s, y = oy + cy * s;
    const gr = g.createLinearGradient(x, y, x + s * 0.3, y + s);
    gr.addColorStop(0, mix(col, 255, 0.28)); gr.addColorStop(0.55, col); gr.addColorStop(1, mix(col, 0, 0.26));
    g.fillStyle = gr; g.fillRect(x - 0.4, y - 0.4, s + 0.8, s + 0.8);
  }
  g.shadowColor = 'transparent';
  // wood grain
  g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 1;
  for (const [cx, cy] of cells) { const x = ox + cx * s, y = oy + cy * s; g.beginPath(); g.moveTo(x + s * 0.12, y + s * 0.34); g.lineTo(x + s * 0.88, y + s * 0.34); g.moveTo(x + s * 0.12, y + s * 0.68); g.lineTo(x + s * 0.88, y + s * 0.68); g.stroke(); }
  // inner seams
  g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 1;
  for (const [cx, cy] of cells) { const x = ox + cx * s, y = oy + cy * s; if (set.has((cx + 1) + ',' + cy)) { g.beginPath(); g.moveTo(x + s, y); g.lineTo(x + s, y + s); g.stroke(); } if (set.has(cx + ',' + (cy + 1))) { g.beginPath(); g.moveTo(x, y + s); g.lineTo(x + s, y + s); g.stroke(); } }
  // outline with a light top-left and a dark bottom-right bevel
  g.lineCap = 'round';
  for (const [cx, cy] of cells) {
    const x = ox + cx * s, y = oy + cy * s;
    for (const [dx, dy, x0, y0, x1, y1] of [[0, -1, x, y, x + s, y], [-1, 0, x, y, x, y + s], [0, 1, x, y + s, x + s, y + s], [1, 0, x + s, y, x + s, y + s]]) {

function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hitPiece(x, y) {
  const S = run.S, cs = view.cs;
  const bx = Math.floor((x - view.ox) / cs), by = Math.floor((y - view.oy) / cs);
  if (x >= view.board.x && x < view.board.x + view.board.w && y >= view.board.y && y < view.board.y + view.board.h) {
    for (const p of S.pieces) if (p.at) for (const c of S.absCells(p.id, p.at.x, p.at.y)) if (c[0] === bx && c[1] === by) return { id: p.id, from: 'board' };
    return null;
  }
  let best = null, bd = 1e9;
  for (const p of S.pieces) {
    if (p.at) continue;
    const sl = view.slots[p.id];
    if (x >= sl.x && x < sl.x + sl.w && y >= sl.y && y < sl.y + sl.h) { const d = Math.hypot(x - (sl.x + sl.w / 2), y - (sl.y + sl.h / 2)); if (d < bd) { bd = d; best = { id: p.id, from: 'tray' }; } }

function loop() {

    if (vsm) run.pms = (run.pms || 0) + dt;
    const sec = att ? Math.ceil(remaining() / 1000) : vsm ? Math.floor(run.pms / 1000) : Math.floor(elapsed() / 1000);

    if (att && remaining() <= 0) { finishAttack(); }
    if (!vsm && ((run.ms / 1000) | 0) % 5 === 0 && run.lastSave !== ((run.ms / 1000) | 0)) { run.lastSave = (run.ms / 1000) | 0; persist(true); }
  }

    'オンライン対戦：2〜4人で3分間、同じパズルをいくつ解けるか競う（1問1000点＋はやさボーナス最大500点。ヒント −100点・スキップ −200点）', 'とちゅうで閉じても自動保存。つづきから遊べる']);
}
let howtoFirst = false;
function showHowto(first) {
  howtoFirst = !!first; renderHowto();
  $('howtoGo').textContent = first ? T('やってみる') : T('とじる');
  $('howtoAlt').hidden = !first;
  hideOverlays(); $('howto').hidden = false;
  try { $('howtoGo').focus({ preventScroll: true }); } catch (e) {}
}
$('howtoGo').addEventListener('click', () => {
  store.set(HOWTO_KEY, '1'); $('howto').hidden = true;
  if (howtoFirst) { if (AU) AU.ctx(); startStage('1-1'); return; }
  if (!playing()) showTitle(); else lastT = now();
});
$('howtoAlt').addEventListener('click', () => { store.set(HOWTO_KEY, '1'); if (howtoFirst) { save.tut = 1; writeSave(); } showTitle(); });
{ const s2 = KoboI18n.picker($('langPick')); if (s2) s2.id = 'langSel'; }

// ---------- sound, theme, menu ----------
function renderSound() {
  const b = $('sndBtn'), on = !(AU && AU.muted);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', T(on ? 'サウンド オン' : 'サウンド オフ'));
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  if (!AU) b.hidden = true;
}
$('sndBtn').addEventListener('click', () => { if (!AU) return; AU.toggleMute(); if (!AU.muted) sfx('ok'); });
if (AU) AU.onChange(renderSound);
function themeColor() {
  const m = document.querySelector('meta[name="theme-color"]'); if (!m) return;
  const light = UI && UI.theme ? UI.theme.resolved() === 'light' : false;
  m.setAttribute('content', light ? '#f2e7d3' : '#1d140c');
}
let pm = null;
function openMenu() {
  if (VS && VS.active()) return;
  if (!UI) { showTitle(); return; }
  if (pm && pm.isOpen) return;
  const on = playing();
  const extra = [{ label: T('遊び方'), icon: 'help', onClick: () => { pm.close(); showHowto(false); } }];
  extra.push({ label: on ? T('ゲームをやめてタイトルへ') : T('タイトルへ戻る'), icon: 'menu', onClick: () => { pm.close(); if (on) endPlay('quit'); idleRun(); showTitle(); } });
  pm = UI.pauseMenu({
    title: T(on ? '一時停止' : 'メニュー'), home: '../', extra,
    onResume: () => { menuOpen = false; lastT = now(); const g = KG(); if (g) g.menuClosed(); },
    onRestart: on ? () => { menuOpen = false; const r = run; endPlay('quit'); clearRun(); if (r.mode === 'daily') startDaily(r.dk); else if (r.mode === 'attack') startAttack(); else startStage(r.id); } : undefined,
    onOpen: () => { menuOpen = true; const g = KG(); if (g) g.menuOpened(); persist(true); },
  });
  pm.open();
}
$('pauseBtn').addEventListener('click', () => openMenu());

// ---------- online battle (common/versus.js) ----------
// Everyone gets the same seeded run of puzzles: the time-attack generator F.attack(seed, k) (k = 0, 1, 2 … gently harder), which never touches
// Math.random, so the same match seed gives every player the same puzzles in the same order. Score per puzzle = 1000 + a speed bonus (up to 500,
// full at the 3-star time, zero at twice the 2-star time); a hint costs 100 and a skip 200 (never below 0). Nothing is saved and no best is
// updated during a battle (versus.js rule); the solo run is set aside untouched and comes back on exit.
const VS_BASE = 1000, VS_BONUS = 500, VS_HINT = 100, VS_SKIP = 200;
let vs = null;   // { snap: { run, ov }, playing: 'versus' | 'practice' | null, practice } while a battle owns the board
function vsBonus(puz, ms) {
  const t = ms / 1000, a = puz.par.three, b = puz.par.two * 2;
  if (t <= a) return VS_BONUS;
  return Math.max(0, Math.round(VS_BONUS * (b - t) / Math.max(1, b - a)));
}
function vsPoints(d) { run.vsScore = Math.max(0, (run.vsScore | 0) + d); if (VS) VS.reportScore(run.vsScore); hud(); }
function vsSolved() {
  if (!VS || !VS.canPlay() || run.solving) return;
  run.solving = true; hintG = null; drag = null;
  const gain = VS_BASE + vsBonus(run.puz, run.pms);
  run.solved++; vsPoints(gain);
  celebrate(); snd.solve(); flashText(T('ぴったり！ +{n}点', { n: gain }));
  const r = run;
  setTimeout(() => { if (run !== r || r.over || !VS.canPlay()) return; r.k++; nextAttackPuzzle(); }, reduceMotion.matches ? 250 : 900);
}
function vsSkip() {
  if (!VS || !VS.canPlay()) return;
  snd.skip(); vsPoints(-VS_SKIP); flashText(T('−{n}点', { n: VS_SKIP }));
  run.k++; nextAttackPuzzle();
}
function vsEnd(reason) {
  if (!vs || !vs.playing) return;
  emit('play_end', { mode: vs.playing, score: run && run.mode === 'vs' ? run.vsScore | 0 : 0, durationMs: run ? Math.round(run.ms) : 0, reason, stats: { solved: run ? run.solved | 0 : 0 } });
  vs.playing = null;
}
if (VS) {
  KoboVersus.init({ sameText: '2〜4人で {t} のスコア勝負。全員に同じ問題が同じ順番で出ます。',
    game: GAME, title: T('ぴったりパズル工房'), duration: Math.round(F.ATTACK_MS / 1000), unit: T('点'),
    theme: { accent: 'var(--kb-accent-text)', accentBg: 'var(--fit-go)', accentInk: '#2a1606', accentShadow: 'var(--fit-go-shadow)', card: 'var(--fit-card)',
      line: 'var(--fit-line)', ink: 'var(--kb-ink)', dim: 'var(--kb-dim)', hud: 'var(--kb-bg)', display: 'var(--kb-font-display)' },
    hudCover: () => document.querySelector('header'),
    onOpen() {
      drag = null; selId = -1; hintG = null; cv.classList.remove('drag'); needDraw = true;
      const g = KG(); if (g) g.pause('versus');
    },
    onStart({ seed, practice }) {
      if (!vs) {
        // the solo run (or the title / stage list / result card on top of it) is set aside exactly as it is
        const solo = run && run.started && !run.over && !run.solving;
        if (solo) { persist(true); emit('play_end', { mode: run.mode === 'daily' ? 'daily' : 'normal', dateKey: run.mode === 'daily' ? run.dk : undefined, score: 0, durationMs: Math.round(run.ms), reason: 'quit' }); }
        vs = { snap: { run, ov: OVERLAYS.filter(id => !$(id).hidden), solo }, playing: null, practice: !!practice };
      } else vsEnd('quit');
      vs.practice = !!practice;
      seed = seed >>> 0;
      setupRun('vs', F.attack(seed, 0), { seed, k: 0, solved: 0, id: 'vs', vsScore: 0, pms: 0 });
      vs.playing = practice ? 'practice' : 'versus';
      paused = false; updateButtons(); hud();
      emit('play_start', { mode: vs.playing, seed });
    },
    onGo() { lastT = now(); updateButtons(); needDraw = true; },
    getScore: () => (run && run.mode === 'vs' ? run.vsScore | 0 : 0),
    onEnd() {
      if (!run || run.mode !== 'vs') return;
      drag = null; hintG = null; cv.classList.remove('drag'); selId = -1;
      vsEnd('over');
      run.over = true; updateButtons(); needDraw = true;
    },
    onExit() {
      if (vs) {
        vsEnd('quit');
        const s = vs.snap; vs = null;
        drag = null; hintG = null; selId = -1; fx.win = null; fx.sparks = []; fx.pops = {}; fx.fly = {};
        hideOverlays();
        run = s.run;
        s.ov.forEach(id => { $(id).hidden = false; });
        renderMode(); layout(); hud(); updateButtons(); tip(null);
        if (run.tut != null && run.started && !run.over) coach();
        if (s.solo) emit('play_start', { mode: run.mode === 'daily' ? 'daily' : 'normal', dateKey: run.mode === 'daily' ? run.dk : undefined, resumed: true });
        if (!$('ovTitle').hidden) showTitle();
        needDraw = true;
      }
      // onOpen paused the game: a solo run comes back through the pause menu (KoboGame.resume → our resume hook), never running on its own
      paused = true;
      const g = KG(); if (g) g.resume('api');
      paused = false; lastT = now();
    },
  });
  VS.button($('vsSlot'), { compact: true });
  VS.button($('tVs'));
}

// ---------- KoboGame: real time (stops while hidden; waits for "Resume") ----------
if (window.KoboGame) KoboGame.register({
  id: GAME,
  pause() { paused = true; persist(true); },
  resume(reason) { if (reason === 'menu') { paused = false; lastT = now(); return; } if (!paused) return; if (!vs && playing() && !anyOverlay()) openMenu(); paused = false; lastT = now(); },
  save() { persist(true); },
  isIdle: () => !playing() && !vs,
  dispose() { cancelAnimationFrame(raf); },
  daily: { start({ dateKey }) { startDaily(dateKey); } },
});
window.addEventListener('pagehide', () => persist(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); lastT = now(); });
window.addEventListener('storage', e => { if (e.key === SAVE_KEY) { save = readSave(); if (!$('ovTitle').hidden) showTitle(); } });
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(() => { themeColor(); readColors(); needDraw = true; }, 0));
window.addEventListener('resize', () => layout());
try { new ResizeObserver(() => layout()).observe(wrap); } catch (e) {}

// ---------- boot ----------
let booted = false;
renderSound(); themeColor(); readColors();
// an empty first board behind the title (stage 1-1, nothing placed)
idleRun();
layout();
const launch = PF ? PF.launch() : { daily: null };
const firstVisit = store.get(HOWTO_KEY) == null && !save.tut && !readRun();
if (launch.daily && PF) {
  const def = window.KoboGame && KoboGame.info && KoboGame.info().def;
  if (!(def && def.flags && def.flags.daily)) setTimeout(() => startDaily(launch.daily), 0);
} else if (firstVisit) showHowto(true);
else showTitle();
hud(); updateButtons();
raf = requestAnimationFrame(loop);
booted = true;

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const page = (x, y) => { const r = cv.getBoundingClientRect(); return { x: r.left + x, y: r.top + y }; };
  const api = {
    ready: () => booted,
    state: () => ({
      mode: run && run.started ? run.mode : 'title', id: run ? run.id : null, world: run ? run.puz.world : 0, ms: run ? Math.round(run.ms) : 0, pen: run ? run.pen : 0, time: run ? Math.round(elapsed()) : 0,
      remaining: run && run.mode === 'attack' ? Math.round(remaining()) : null, solved: run ? run.solved : 0, k: run ? run.k : 0, seed: run ? run.seed : 0,
      over: !!(run && run.over), solving: !!(run && run.solving), won: !!(run && run.S && run.S.solved()), hints: run ? run.S.hints : 0, moves: run ? run.S.moves : 0,
      pieces: run ? run.S.pieces.map(p => ({ id: p.id, type: p.type, rot: p.rot, flip: p.flip, at: p.at })) : [], placed: run ? run.S.pieces.filter(p => p.at).length : 0, total: run ? run.S.pieces.length : 0,
      board: run ? run.puz.board.length : 0, decoys: run ? run.puz.decoys : 0, solutions: run ? run.puz.solutions : 0, par: run ? run.puz.par : null, puzzle: run ? F.describe(run.puz) : null,
      tut: run ? run.tut : null, sel: selId, ghost: !!hintG, dragging: !!(drag && drag.moved), paused, menuOpen, dk: run ? run.dk : null, vsScore: run && run.mode === 'vs' ? run.vsScore | 0 : null, pms: run ? Math.round(run.pms || 0) : 0, vs: vs ? { playing: vs.playing, practice: vs.practice, solo: !!vs.snap.solo } : null,
      title: !$('ovTitle').hidden, worlds: !$('ovWorlds').hidden, result: !$('ovResult').hidden, howto: !$('howto').hidden, save: JSON.parse(JSON.stringify(save)), last: lastResult,
      cs: view.cs, land: view.land, hist: run ? run.S.hist.length : 0,
    }),
    // where to press for the next piece: taps / flips to reach the stored solution's orientation, the tray point, and the drop point
    plan(ptype) {
      if (!playing()) return [];
      const S = run.S, pz = run.puz, cs = view.cs, steps = [];
      for (const s of pz.solution) {
        const p = S.pieces[s.id]; if (p.at) continue;
        const want = F.key(F.shape(s.type, s.rot, s.flip));
        let best = null;
        for (let f = 0; f < 2; f++) for (let r = 0; r < 4; r++) if (F.key(F.shape(s.type, (p.rot + r) & 3, p.flip ^ f)) === want && (!best || r + f < best.r + best.f)) best = { r, f };
        const sh = F.shape(s.type, s.rot, s.flip), b = F.bbox(sh);
        const sl = view.slots[s.id];
        const cx = view.ox + (s.x + b.w / 2) * cs, cy = view.oy + (s.y + b.h / 2) * cs;
        const off = ptype === 'touch' ? -(b.h * cs / 2 + cs * 0.9) : 0;
        steps.push({ id: s.id, type: s.type, rotTaps: best.r + (best.r === 0 && best.f ? 4 : 0), flipTaps: best.f, tray: page(sl.x + sl.w / 2, sl.y + sl.h / 2), to: page(cx, cy - off), anchor: { x: s.x, y: s.y } });
      }
      return steps;
    },
    // the point on a placed piece (page coords) and a point just outside the board
    piecePoint(id) { const S = run.S, p = S.pieces[id]; if (!p.at) { const sl = view.slots[id]; return page(sl.x + sl.w / 2, sl.y + sl.h / 2); } const c = S.absCells(id, p.at.x, p.at.y)[0]; return page(view.ox + (c[0] + 0.5) * view.cs, view.oy + (c[1] + 0.5) * view.cs); },
    trayPoint() { return page(view.tray.x + view.tray.w / 2, view.tray.y + view.tray.h - 6); },
    cellPoint(x, y) { return page(view.ox + (x + 0.5) * view.cs, view.oy + (y + 0.5) * view.cs); },
    advance(ms) { if (run) { run.ms += ms; if (run.mode === 'vs') run.pms = (run.pms || 0) + ms; hud(); } },
    solveNow() { if (!playing()) return false; const S = run.S; S.reset(); for (const s of run.puz.solution) { const p = S.pieces[s.id]; p.rot = s.rot; p.flip = s.flip; S.place(s.id, s.x, s.y); } afterAction('place'); return true; },
  };
  window.__kb = Object.assign(window.__kb || {}, { ready: api.ready, state: api.state });
  window.__fit = {
    api, F, get run() { return run; }, get save() { return save; }, view,
    start: id => { clearRun(); startStage(id || '1-1'); return api.state(); },
    daily: dk => { clearRun(); startDaily(dk); return api.state(); },
    attack: seed => { clearRun(); startAttack(seed); return api.state(); },
    plan: api.plan, piecePoint: api.piecePoint, cellPoint: api.cellPoint, trayPoint: api.trayPoint, advance: api.advance, solveNow: api.solveNow,
    setSave(o) { save = Object.assign(defSave(), o); writeSave(); return save; },
    unlockAll() { for (const s of STAGES) save.st[s.id] = save.st[s.id] || { s: 1, t: 60000, c: 1 }; writeSave(); return true; },
    persist: () => persist(true), readRun,
    title: showTitle, howto: () => showHowto(false), menu: openMenu, worlds: showWorlds,
    thumbScene() { // a mid-solve board (a world-5 stage, three pieces placed, two in the tray) for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); DEBUG_NOSAVE = true;
      startStage('5-6', null, { tut: null, tutRun: false });
      const S = run.S, sol = run.puz.solution;
      sol.slice(0, 3).forEach(s => { const p = S.pieces[s.id]; p.rot = s.rot; p.flip = s.flip; S.place(s.id, s.x, s.y); });
      selId = -1; hideOverlays(); layout(); needDraw = true; draw(now());
      return true;
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
