<html lang="ja">

<style>
/* Look: dark walnut room, a warm hinoki-wood board, lacquered enamel tiles. Canvas draws board + tray + drag; DOM draws header, score and dialogs. */
:root {
  --walnut: #2a1b12;
  --walnut-2: #3a271b;
  --line: #5a3f2c;
  --paper: #fbf1e3;
  --paper-dim: #c9b29a;
  --gold: #f4b740;
  --gold-ink: #2d1b04;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--paper); font-family: var(--font-body);
  background: radial-gradient(120% 80% at 50% 30%, #3b281b 0%, var(--walnut) 60%, #1c120c 100%) fixed, var(--walnut);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
}
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: 0;
}
header {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px));
}
.back {
  color: var(--paper-dim); text-decoration: none; font-size: 13px; font-weight: 800; white-space: nowrap;
  padding: 6px 8px; margin-left: -8px; border-radius: 10px;
}
.back:active { background: var(--walnut-2); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1 { margin: 0 auto; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
h1 span { color: var(--gold); }
.icon {
  width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--walnut-2);
  color: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; flex: none;
}
.icon svg { width: 20px; height: 20px; }
.icon:active { transform: scale(.94); }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); flex: none; }
.score-main { text-align: center; }
.score-main b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.label { font-size: 11px; color: var(--paper-dim); letter-spacing: .12em; font-weight: 800; }
.score-best { text-align: right; justify-self: end; padding-bottom: 4px; }
.score-best b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--gold); font-variant-numeric: tabular-nums; }
.combo-chip {
  justify-self: start; margin-bottom: 6px; font-size: 12px; font-weight: 800; color: var(--gold-ink); background: var(--gold);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap; transition: opacity .2s, transform .2s;
}
.combo-chip.off { opacity: 0; transform: scale(.8); }
#play { position: relative; flex: 1; min-height: 0; touch-action: none; margin: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.toast {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(20,12,8,.92); border: 1px solid var(--line);
  color: var(--paper); font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s;
}
.toast.off { opacity: 0; }
.vs-slot { display: contents; }
#vsSlotOver .kvs-entry { margin-top: 12px; }
@media (max-width: 400px) { #vsSlot .kvs-entry { width: 36px; padding: 0; } #vsSlot .kvs-entry span { display: none; } }
@media (max-width: 370px) { header { gap: 5px !important; } .back { font-size: 12px; padding: 6px 4px; margin-left: -4px; } h1 { font-size: 15px !important; letter-spacing: .02em !important; } }
@media (max-width: 340px) { h1 { font-size: 14px !important; letter-spacing: 0 !important; } }
.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(18,10,6,.66); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .3s ease-out;
}
.card {
  width: min(320px, 100%); background: linear-gradient(#3d2a1d, #2e1f15); border: 1px solid var(--line); border-radius: 22px;
  padding: 24px 22px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  animation: rise .35s cubic-bezier(.2,1.4,.4,1);
}
.card h2 { overflow-wrap: anywhere; margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .05em; }
.card .big { font-family: var(--font-display); font-size: clamp(24px, 8vw, 38px); overflow-wrap: anywhere; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .best { margin-top: 6px; color: var(--paper-dim); font-size: 14px; font-weight: 800; }
.card .best b { color: var(--gold); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin-top: 10px; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
.btn {
  display: block; width: 100%; margin-top: 20px; border: 0; border-radius: 14px; padding: 14px; cursor: pointer;
  font: 800 17px var(--font-body); background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 #a8731a;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8731a; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.94); } }
@media (prefers-reduced-motion: reduce) {
  .overlay, .card { animation: none; }
  .combo-chip, .toast { transition: none; }
}
@media (max-width: 340px) { h1 { font-size: 16px; letter-spacing: .02em; } header { gap: 6px; } }
@media (max-height: 640px) {
  .score-main b { font-size: 32px; }
  header { padding-top: 4px; }
}
/* fit the visible viewport on phones (browser bars included) */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" data-i18n>← ゲーム一覧</a>
    <h1 data-i18n-html>ブロック<span>はめ</span></h1>
    <span id="vsSlot" class="vs-slot"></span>
    <button class="icon" id="restart" type="button" aria-label="最初から" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button class="icon" id="sound" type="button" aria-label="サウンド" aria-pressed="true"></button>
  </header>
  <div class="scores">
    <div class="combo-chip off" id="comboChip" data-i18n>コンボ ×2</div>
    <div class="score-main"><span class="label" data-i18n>スコア</span><b id="score">0</b></div>
    <div class="score-best"><span class="label" data-i18n>ベスト</span><b id="best">0</b></div>
  </div>
  <div id="play">
    <canvas id="cv" data-i18n-attr="aria-label" aria-label="ゲーム盤。下のブロックを盤へドラッグして置く"></canvas>
    <div class="toast off" id="toast"></div>
  </div>
</div>
<div class="overlay" id="over" hidden role="dialog" aria-modal="true" aria-labelledby="overTitle">
  <div class="card">
    <h2 id="overTitle" data-i18n>置き場がない！</h2>
    <div class="label" data-i18n>スコア</div>
    <div class="big" id="overScore">0</div>
    <div class="best"><span data-i18n>ベスト</span> <b id="overBest">0</b></div>
    <div id="overNew" class="newrec" hidden data-i18n>ベスト更新！</div>
    <button class="btn" id="again" type="button" data-i18n>もう一度</button>
    <div id="vsSlotOver"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const T = KoboI18n.t;
KoboI18n.add({ en: {
  'ブロックはめ': 'Block Fit', '← ゲーム一覧': '← Games', 'ブロック<span>はめ</span>': 'Block <span>Fit</span>',
  '最初から': 'Restart', 'コンボ ×2': 'Combo ×2', 'コンボ ×{n}': 'Combo ×{n}', 'スコア': 'SCORE', 'ベスト': 'BEST',
  'ゲーム盤。下のブロックを盤へドラッグして置く': 'Game board. Drag the blocks below onto the board.',
  '置き場がない！': 'No room left!', 'ベスト更新！': 'New best!', 'もう一度': 'Play again',
  '全消し！': 'All clear!', '{n}ライン！': '{n} lines!', 'ダブル！': 'Double!',
  'サウンド オン': 'Sound on', 'サウンド オフ': 'Sound off',
  '新しいゲーム': 'New game', 'もう一度押すと最初から': 'Tap again to restart',
  '点': 'pts', '置き場がない！ 盤をリセット': 'No room! Board reset',
} });
const N = 8;
const KEY_BEST = 'kusoge.blocks.best', KEY_STATE = 'kusoge.blocks.state', KEY_SOUND = 'kusoge.sound';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const reduced = () => reduceMQ.matches;

// ---------- Palette (lacquer / enamel) ----------
const COLORS = ['#e2553c', '#3e64b8', '#5fa548', '#efb22d', '#9a6ccc', '#26a3a6', '#e8729a', '#d9822b'];

// ---------- Pieces ----------
function rot(cells) { // rotate 90° clockwise, normalise
  const r = cells.map(([y, x]) => [x, -y]);
  const my = Math.min(...r.map(c => c[0])), mx = Math.min(...r.map(c => c[1]));
  return r.map(([y, x]) => [y - my, x - mx]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
const key = cs => cs.map(c => c.join(',')).join(';');
function rotations(cells, n) {
  const out = []; const seen = new Set(); let cur = rot(rot(rot(rot(cells))));
  for (let i = 0; i < n; i++) { const k = key(cur); if (!seen.has(k)) { seen.add(k); out.push(cur); } cur = rot(cur); }
  return out;
}
const FAMILIES = [ // [name, base cells, rotations, total weight, color]
  ['dot',   [[0,0]], 1, 5, 3],
  ['I2',    [[0,0],[0,1]], 2, 8, 6],
  ['I3',    [[0,0],[0,1],[0,2]], 2, 8, 4],
  ['I4',    [[0,0],[0,1],[0,2],[0,3]], 2, 7, 1],
  ['I5',    [[0,0],[0,1],[0,2],[0,3],[0,4]], 2, 4, 0],
  ['O2',    [[0,0],[0,1],[1,0],[1,1]], 1, 7, 2],
  ['O3',    [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], 1, 2.5, 7],
  ['R23',   [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], 2, 3, 5],
  ['V3',    [[0,0],[1,0],[1,1]], 4, 8, 6],
  ['L4',    [[0,0],[1,0],[2,0],[2,1]], 4, 6, 7],
  ['J4',    [[0,1],[1,1],[2,1],[2,0]], 4, 6, 1],
  ['V5',    [[0,0],[1,0],[2,0],[2,1],[2,2]], 4, 4, 4],
  ['T4',    [[0,0],[0,1],[0,2],[1,1]], 4, 6, 4],
  ['S4',    [[0,1],[0,2],[1,0],[1,1]], 2, 4, 2],
  ['Z4',    [[0,0],[0,1],[1,1],[1,2]], 2, 4, 0],
];
const PIECES = []; // {cells, w, h, color, weight}
for (const [name, base, nrot, weight, color] of FAMILIES) {
  const rs = rotations(base, nrot);
  for (const cells of rs) {
    PIECES.push({ name, cells, color, weight: weight / rs.length,
      w: Math.max(...cells.map(c => c[1])) + 1, h: Math.max(...cells.map(c => c[0])) + 1 });
  }
}
const TOTAL_W = PIECES.reduce((s, p) => s + p.weight, 0);
// online battle: every player draws pieces from the same seeded sequence (see KoboVersus below)
let rnd = Math.random, vs = null; // vs = { snap } while a versus match owns the board
function randomPiece() {
  let r = rnd() * TOTAL_W;
  for (let i = 0; i < PIECES.length; i++) { r -= PIECES[i].weight; if (r <= 0) return i; }
  return PIECES.length - 1;
}

// ---------- State ----------
let board, tray, score, combo, best, over = false, moves = 0;
best = parseInt(store.get(KEY_BEST), 10) || 0;

function fits(pid, r0, c0) {
  const p = PIECES[pid];
  if (r0 < 0 || c0 < 0 || r0 + p.h > N || c0 + p.w > N) return false;
  for (const [r, c] of p.cells) if (board[(r0 + r) * N + c0 + c] >= 0) return false;
  return true;
}
function fitsAnywhere(pid) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(pid, r, c)) return true;
  return false;
}
function deal() {
  if (vs) { // seeded: the same three pieces for everyone, whatever their board looks like
    tray = [randomPiece(), randomPiece(), randomPiece()];
    dealAnim = reduced() ? null : { t0: performance.now() };
    return;
  }
  let best3 = null;
  for (let attempt = 0; attempt < 14; attempt++) {
    const hand = [randomPiece(), randomPiece(), randomPiece()];
    if (hand.some(fitsAnywhere)) { best3 = hand; break; }
    if (!best3) best3 = hand;
  }
  // Last resort: if nothing in the random hands fits, try swapping in a small piece.
  if (!best3.some(fitsAnywhere)) {
    const smalls = PIECES.map((p, i) => i).filter(i => PIECES[i].cells.length <= 3 && fitsAnywhere(i));
    if (smalls.length && Math.random() < 0.7) best3[Math.floor(Math.random() * 3)] = smalls[Math.floor(Math.random() * smalls.length)];
  }
  tray = best3;
  const now = performance.now();
  dealAnim = reduced() ? null : { t0: now };
}
function newGame() {
  board = new Array(N * N).fill(-1);
  score = 0; combo = 0; moves = 0; over = false;
  effects.length = 0; popups.length = 0; placeFx = null;
  deal();
  hideOver(); updateHud(true); save(); requestDraw();
}
function save() {
  if (vs) return; // online matches never touch the single-player save
  if (over) { store.del(KEY_STATE); return; }
  store.set(KEY_STATE, JSON.stringify({ v: 1, board, tray, score, combo, moves }));
}
function load() {
  try {
    const s = JSON.parse(store.get(KEY_STATE));
    if (!s || s.v !== 1 || !Array.isArray(s.board) || s.board.length !== N * N || !Array.isArray(s.tray) || s.tray.length !== 3) return false;
    if (!s.board.every(v => Number.isInteger(v) && v >= -1 && v < COLORS.length)) return false;
    if (!s.tray.every(v => v === null || (Number.isInteger(v) && v >= 0 && v < PIECES.length))) return false;
    board = s.board; tray = s.tray; score = Math.max(0, s.score | 0); combo = Math.max(0, s.combo | 0); moves = s.moves | 0;
    over = false;
    if (tray.every(v => v === null)) deal();
    return true;
  } catch (e) { return false; }
}

// ---------- Scoring & placement ----------
const lineScore = n => 10 * n * (n + 1) / 2; // 1:10 2:30 3:60 4:100 ...
function place(i, r0, c0) {
  const pid = tray[i], p = PIECES[pid];
  const now = performance.now();
  const placed = [];
  for (const [r, c] of p.cells) { board[(r0 + r) * N + c0 + c] = p.color; placed.push((r0 + r) * N + c0 + c); }
  tray[i] = null; moves++;
  let gain = p.cells.length;
  placeFx = reduced() ? null : { cells: placed, t0: now };
  // find full lines
  const rows = [], cols = [];
  for (let r = 0; r < N; r++) { let f = true; for (let c = 0; c < N; c++) if (board[r * N + c] < 0) { f = false; break; } if (f) rows.push(r); }
  for (let c = 0; c < N; c++) { let f = true; for (let r = 0; r < N; r++) if (board[r * N + c] < 0) { f = false; break; } if (f) cols.push(c); }
  const lines = rows.length + cols.length;
  if (lines) {
    combo++;
    const clr = new Set();
    rows.forEach(r => { for (let c = 0; c < N; c++) clr.add(r * N + c); });
    cols.forEach(c => { for (let r = 0; r < N; r++) clr.add(r * N + c); });
    // pivot for staggered animation: centre of the placed piece
    const pr = r0 + p.h / 2, pc = c0 + p.w / 2;
    for (const idx of clr) {
      const r = (idx / N) | 0, c = idx % N;
      const d = Math.hypot(r + .5 - pr, c + .5 - pc);
      effects.push({ r, c, color: board[idx], t0: now + (reduced() ? 0 : d * 28) });
      board[idx] = -1;
    }
    let pts = lineScore(lines) * combo;
    let allClear = board.every(v => v < 0);
    if (allClear) pts += 300;
    gain += pts;
    const cx = (cols.length ? cols.reduce((a, b) => a + b, 0) / cols.length : pc - .5) + .5;
    const cy = (rows.length ? rows.reduce((a, b) => a + b, 0) / rows.length : pr - .5) + .5;
    popups.push({ text: '+' + pts, x: cx, y: cy, t0: now, size: 1 });
    let label = '';
    if (allClear) label = T('全消し！');
    else if (combo >= 2) label = T('コンボ ×{n}', { n: combo });
    else if (lines >= 3) label = T('{n}ライン！', { n: lines });
    else if (lines === 2) label = T('ダブル！');
    if (label) popups.push({ text: label, x: N / 2, y: N / 2 - .3, t0: now + 60, size: 1.8, banner: true });
    sfxClear(lines, combo);
    buzz(lines > 1 || combo > 1 ? [18, 40, 22] : 16);
  } else {
    combo = 0;
    sfxPlace();
    buzz(8);
  }
  score += gain;
  if (tray.every(v => v === null)) deal();
  updateHud();
  if (!tray.some(v => v !== null && fitsAnywhere(v))) {
    if (vs) { setTimeout(vsStuck, reduced() ? 150 : 450); requestDraw(); return; }
    over = true;
    save();
    setTimeout(gameOver, reduced() ? 250 : 750);
  } else save();
  requestDraw();
}
function gameOver() {
  const isNew = score > 0 && score >= best && score > prevBestAtStart;
  if (score > best) best = score;
  store.set(KEY_BEST, String(best));
  store.del(KEY_STATE);
  $('overScore').textContent = score.toLocaleString('ja-JP');
  $('overBest').textContent = best.toLocaleString('ja-JP');
  $('overNew').hidden = !isNew;
  $('over').hidden = false;
  sfxOver(); buzz([30, 60, 30]);
  setTimeout(() => $('again').focus({ preventScroll: true }), 50);
}
function hideOver() { $('over').hidden = true; prevBestAtStart = best; }
let prevBestAtStart = best;

// ---------- HUD ----------
const $ = id => document.getElementById(id);
let shownScore = 0, hudAnim = 0;
function updateHud(instant) {
  if (!vs && score > best) { best = score; store.set(KEY_BEST, String(best)); }
  $('best').textContent = best.toLocaleString('ja-JP');
  const chip = $('comboChip');
  if (combo >= 2) { chip.textContent = T('コンボ ×{n}', { n: combo }); chip.classList.remove('off'); } else chip.classList.add('off');
  if (instant || reduced()) { shownScore = score; $('score').textContent = score.toLocaleString('ja-JP'); return; }
  cancelAnimationFrame(hudAnim);
  const from = shownScore, to = score, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 380);
    shownScore = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('score').textContent = shownScore.toLocaleString('ja-JP');
    if (k < 1) hudAnim = requestAnimationFrame(step);
  };
  hudAnim = requestAnimationFrame(step);
}
let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('off');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('off'), 1800);
}

// ---------- Sound & haptics ----------
let soundOn = store.get(KEY_SOUND) !== '0';
let actx = null;
function ensureAudio() {

    effects.length = 0; popups.length = 0; placeFx = null;
    $('over').hidden = true;
    deal(); updateHud(true); requestDraw();
  },
  getScore: () => score,
  onEnd() { drag = null; returning = null; requestDraw(); },
  onExit() {
    if (!vs) return;
    const s = vs.snap; vs = null; rnd = Math.random;
    drag = null; returning = null; effects.length = 0; popups.length = 0; placeFx = null;
    board = s.board; tray = s.tray; score = s.score; combo = s.combo; moves = s.moves; over = s.over;
    $('over').hidden = !s.overShown;
    updateHud(true); requestDraw();
  },
});
KoboVersus.button($('vsSlot'), { compact: true });
KoboVersus.button($('vsSlotOver'));

// ---------- Boot ----------
renderSoundBtn();
if (!load()) { board = new Array(N * N).fill(-1); score = 0; combo = 0; moves = 0; deal(); save(); }
updateHud(true);
layout();
if (!tray.some(v => v !== null && fitsAnywhere(v))) { over = true; setTimeout(gameOver, 300); }
window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('play'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);

// Small read-only hook for automated tests: where to press / release to drop tray piece i at (r, c).
window.__blocksTest = {
  get state() { return { board: board.slice(), tray: tray.slice(), score, combo, over, best }; },
  pieces: PIECES,
  slotPoint(i) { const s = slotCenter(i); return { x: rect.left + s.x, y: rect.top + s.y }; },
  dropPoint(i, r, c, type) {
    const p = PIECES[tray[i]], lift = liftFor(type || 'mouse');
    const gx = bx + c * cell, gy = by + r * cell;
    const px = gx + p.w * cell / 2;
    const py = type === 'touch' ? gy + p.h * cell + lift * cell : gy + p.h * cell / 2 + lift * cell * 0.4;
    return { x: rect.left + px, y: rect.top + py };
  },
};
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
