<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ブロックはめ</title>
<meta name="description" content="8×8の木の盤にブロックをはめて、そろった列を消すパズル。">
<meta name="theme-color" content="#2a1b12">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブロックはめ">
<link rel="stylesheet" href="../common/theme.css">
<link rel="stylesheet" href="../common/ui.css">
<script src="../common/i18n.js"></script>
<script src="../common/games.js"></script>
<script src="../common/platform.js"></script>
<script src="../common/audio.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/versus.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Look: a walnut room (dark) or a paper-and-pine room (light), a warm hinoki-wood board, lacquered enamel tiles.
   Canvas draws board + tray + drag; DOM draws header, score and dialogs. The UI uses the shared --kb-* tokens,
   re-tinted here to the walnut palette so KoboUI's menu and settings sheet match the game. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #2a1b12; --kb-surface: #3a271b; --kb-surface-2: #47301f; --kb-sunken: #22160e; --kb-line: #5a3f2c;
  --kb-ink: #fbf1e3; --kb-dim: #c9b29a;
  --kb-accent: #f4b740; --kb-accent-ink: #2d1b04; --kb-accent-text: #f4b740; --kb-accent-soft: rgba(244, 183, 64, .16);
  --kb-scrim: rgba(18, 10, 6, .66); --kb-toast-bg: rgba(20, 12, 8, .94); --kb-focus: #f4b740;
  --kb-shadow: 0 20px 50px rgba(0, 0, 0, .5);
  --bk-bg-1: #3b281b; --bk-bg-2: #2a1b12; --bk-bg-3: #1c120c;
  --bk-card: linear-gradient(#3d2a1d, #2e1f15); --bk-btn-shadow: #a8731a; --bk-hud: rgba(36, 23, 15, .97);
  --bk-toast: rgba(20, 12, 8, .92); --bk-toast-ink: #fbf1e3;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f6eddf; --kb-surface: #fffaf2; --kb-surface-2: #f1e4d0; --kb-sunken: #eadbc4; --kb-line: #d9c4a6;
    --kb-ink: #2e1e13; --kb-dim: #6b5443;
    --kb-accent: #e9a933; --kb-accent-ink: #2b1d05; --kb-accent-text: #8a5a00; --kb-accent-soft: rgba(201, 138, 16, .14);
    --kb-scrim: rgba(60, 38, 20, .42); --kb-toast-bg: rgba(46, 30, 19, .94); --kb-focus: #9a5b00;
    --kb-shadow: 0 16px 40px rgba(70, 45, 20, .22);
    --bk-bg-1: #fffaf1; --bk-bg-2: #f4e8d6; --bk-bg-3: #e8d6bd;
    --bk-card: linear-gradient(#fffaf2, #f7ecdb); --bk-btn-shadow: #b57d1c; --bk-hud: rgba(255, 249, 240, .97);
    --bk-toast: rgba(46, 30, 19, .9); --bk-toast-ink: #fff7ea;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f6eddf; --kb-surface: #fffaf2; --kb-surface-2: #f1e4d0; --kb-sunken: #eadbc4; --kb-line: #d9c4a6;
  --kb-ink: #2e1e13; --kb-dim: #6b5443;
  --kb-accent: #e9a933; --kb-accent-ink: #2b1d05; --kb-accent-text: #8a5a00; --kb-accent-soft: rgba(201, 138, 16, .14);
  --kb-scrim: rgba(60, 38, 20, .42); --kb-toast-bg: rgba(46, 30, 19, .94); --kb-focus: #9a5b00;
  --kb-shadow: 0 16px 40px rgba(70, 45, 20, .22);
  --bk-bg-1: #fffaf1; --bk-bg-2: #f4e8d6; --bk-bg-3: #e8d6bd;
  --bk-card: linear-gradient(#fffaf2, #f7ecdb); --bk-btn-shadow: #b57d1c; --bk-hud: rgba(255, 249, 240, .97);
  --bk-toast: rgba(46, 30, 19, .9); --bk-toast-ink: #fff7ea;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--kb-ink); font-family: var(--kb-font-body);
  background: radial-gradient(120% 80% at 50% 30%, var(--bk-bg-1) 0%, var(--bk-bg-2) 60%, var(--bk-bg-3) 100%) fixed, var(--bk-bg-2);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 0; }
header {
  display: flex; align-items: center; gap: 6px; flex: none;
  padding: max(6px, var(--kb-sat)) max(10px, var(--kb-sar)) 2px max(10px, var(--kb-sal));
}
.back {
  display: inline-flex; align-items: center; gap: 2px; min-height: 44px; min-width: 44px; flex: none;
  color: var(--kb-dim); text-decoration: none; font-size: 13px; font-weight: 800; white-space: nowrap;
  padding: 0 8px 0 4px; margin-left: -4px; border-radius: 12px;
}
.back svg { width: 22px; height: 22px; flex: none; }
.back:active { background: var(--kb-surface); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .skip:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
h1 { margin: 0 auto; font-family: var(--kb-font-display); font-weight: 400; font-size: 18px; letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
h1 span { color: var(--kb-accent-text); }
.icon {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-surface);
  color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; flex: none; touch-action: manipulation;
}
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
#vsSlot .kvs-entry { height: 44px; min-width: 44px; }
.mode-bar {
  flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto 2px; max-width: calc(100% - 24px);
  padding: 3px 12px; border-radius: 999px; background: var(--kb-accent-soft); border: 1px solid var(--kb-accent);
  color: var(--kb-ink); font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mode-bar svg { width: 15px; height: 15px; flex: none; color: var(--kb-accent-text); }
.mode-bar span { overflow: hidden; text-overflow: ellipsis; }
.mode-bar b { color: var(--kb-accent-text); }
.mode-bar.done { background: var(--kb-accent); color: var(--kb-accent-ink); }
.mode-bar.done svg, .mode-bar.done b { color: var(--kb-accent-ink); }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 0 max(16px, var(--kb-sar)) 6px max(16px, var(--kb-sal)); flex: none; }
.score-main { text-align: center; }
.score-main b { display: block; font-family: var(--kb-font-display); font-weight: 400; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: .02em; transform-origin: 50% 70%; }
.score-main b.bump { animation: bump .32s cubic-bezier(.2,1.6,.4,1); }
.label { font-size: 11px; color: var(--kb-dim); letter-spacing: .12em; font-weight: 800; }
.score-best { text-align: right; justify-self: end; padding-bottom: 4px; min-width: 0; }
.score-best b { display: block; font-family: var(--kb-font-display); font-weight: 400; font-size: 17px; color: var(--kb-accent-text); font-variant-numeric: tabular-nums; }
.combo-chip {
  justify-self: start; margin-bottom: 6px; font-size: 12px; font-weight: 800; color: var(--kb-accent-ink); background: var(--kb-accent);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap; transition: opacity .2s, transform .2s;
}
.combo-chip.off { opacity: 0; transform: scale(.8); }
/* tutorial coach: takes the place of the score row */
.coach {
  flex: none; display: flex; align-items: center; gap: 10px; margin: 2px max(12px, var(--kb-sar)) 6px max(12px, var(--kb-sal));
  padding: 8px 8px 8px 14px; min-height: 60px; border-radius: 16px; background: var(--kb-surface); border: 1px solid var(--kb-accent);
  box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: rise .3s cubic-bezier(.2,1.3,.4,1);
}
.coach .step { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font: 400 14px var(--kb-font-display); }
.coach p { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
.coach p small { display: block; font-size: 11.5px; font-weight: 500; color: var(--kb-dim); margin-top: 1px; }
.skip {
  flex: none; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--kb-line); background: transparent;
  color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; touch-action: manipulation;
}
.skip.go { background: var(--kb-accent); border-color: var(--kb-accent); color: var(--kb-accent-ink); padding: 0 16px; font-size: 15px; box-shadow: 0 3px 0 var(--bk-btn-shadow); }
.coach.nudge { animation: nudge .35s; }
#play { position: relative; flex: 1; min-height: 0; touch-action: none; margin: 0 var(--kb-sar) var(--kb-sab) var(--kb-sal); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.toast {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: var(--bk-toast); border: 1px solid var(--kb-line);
  color: var(--bk-toast-ink); font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; transition: opacity .2s;
}
.toast.gold { background: var(--kb-accent); color: var(--kb-accent-ink); border-color: var(--kb-accent); }
.toast.off { opacity: 0; }
.vs-slot { display: contents; }
#vsSlotOver .kvs-entry { margin-top: 10px; min-height: 44px; }
@media (max-width: 400px) { #vsSlot .kvs-entry { width: 44px; padding: 0; } #vsSlot .kvs-entry span { display: none; } .back span { display: none; } .back { padding-right: 4px; } }
@media (max-width: 370px) { header { gap: 4px; } h1 { font-size: 15px; letter-spacing: .02em; } }
@media (max-width: 340px) { h1 { font-size: 14px; letter-spacing: 0; } }
.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30;
  height: var(--kb-vh);
  padding: max(12px, var(--kb-sat)) max(12px, var(--kb-sar)) max(12px, var(--kb-sab)) max(12px, var(--kb-sal));
  background: var(--kb-scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .3s ease-out;
}
.card {
  width: min(340px, 100%); background: var(--bk-card); border: 1px solid var(--kb-line); border-radius: 22px; color: var(--kb-ink);
  padding: 22px 20px 18px; text-align: center; box-shadow: var(--kb-shadow);
  max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  animation: rise .35s cubic-bezier(.2,1.4,.4,1);
}
.card h2 { overflow-wrap: anywhere; margin: 0 0 12px; font-family: var(--kb-font-display); font-weight: 400; font-size: 25px; letter-spacing: .05em; line-height: 1.2; }
.card .big { font-family: var(--kb-font-display); font-size: clamp(24px, 8vw, 38px); overflow-wrap: anywhere; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .best { margin-top: 6px; color: var(--kb-dim); font-size: 14px; font-weight: 800; }
.card .best b { color: var(--kb-accent-text); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin-top: 10px; background: var(--kb-accent); color: var(--kb-accent-ink); font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; animation: glow 1.4s ease-in-out infinite; }
.goal { display: inline-block; margin-top: 10px; font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--kb-line); color: var(--kb-dim); }
.goal.ok { background: var(--kb-accent); border-color: var(--kb-accent); color: var(--kb-accent-ink); }
.btn {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin-top: 18px; border: 0; border-radius: 14px; padding: 10px 14px; cursor: pointer;
  font: 800 17px var(--kb-font-body); background: var(--kb-accent); color: var(--kb-accent-ink); box-shadow: 0 4px 0 var(--bk-btn-shadow); text-decoration: none; touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bk-btn-shadow); }
.btn.sub { min-height: 46px; margin-top: 10px; font-size: 15px; background: transparent; color: var(--kb-ink); border: 1px solid var(--kb-line); box-shadow: none; }
.btn.sub:active { transform: scale(.98); }
.btn.link { min-height: 44px; margin-top: 6px; font-size: 14px; background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; }
/* how to play */
.howto h2 { margin-bottom: 8px; }
.howto ol { list-style: none; margin: 0; padding: 0; text-align: left; display: grid; gap: 10px; }
.howto li { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: var(--kb-surface); border: 1px solid var(--kb-line); }
.howto li svg { flex: none; width: 64px; height: 48px; }
.howto li p { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
.howto li p small { display: block; font-weight: 500; font-size: 12px; color: var(--kb-dim); margin-top: 2px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.94); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
@keyframes glow { 50% { box-shadow: 0 0 0 6px var(--kb-accent-soft); } }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) {
  .overlay, .card, .coach, .newrec, .score-main b.bump, .coach.nudge { animation: none; }
  .combo-chip, .toast { transition: none; }
}
@media (max-height: 640px) {
  .score-main b { font-size: 32px; }
  header { padding-top: max(4px, var(--kb-sat)); }
  .howto li { padding: 6px 8px; } .howto li svg { width: 52px; height: 40px; }
  .card { padding-top: 16px; padding-bottom: 14px; } .card h2 { font-size: 22px; margin-bottom: 8px; }
}
@media (max-height: 420px) {
  .howto ol { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .howto li { flex-direction: column; text-align: center; gap: 4px; }
  .card { width: min(560px, 100%); }
}
@supports (height: 100dvh) { html, body { height: 100dvh; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n>ゲーム一覧</span></a>
    <h1 data-i18n-html>ブロック<span>はめ</span></h1>
    <span id="vsSlot" class="vs-slot"></span>
    <button class="icon" id="sound" type="button" aria-label="サウンド" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <div class="mode-bar" id="modeBar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span id="modeText"></span>
  </div>
  <div class="scores" id="scores">
    <div class="combo-chip off" id="comboChip" data-i18n>コンボ ×2</div>
    <div class="score-main"><span class="label" data-i18n>スコア</span><b id="score">0</b></div>
    <div class="score-best"><span class="label" id="bestLabel" data-i18n>ベスト</span><b id="best">0</b></div>
  </div>
  <div class="coach" id="coach" hidden role="status" aria-live="polite">
    <span class="step" id="coachStep">1</span>
    <p id="coachText"></p>
    <button class="skip" id="coachBtn" type="button" data-i18n>スキップ</button>
  </div>
  <div id="play">
    <canvas id="cv" data-i18n-attr="aria-label" aria-label="ゲーム盤。下のブロックを盤へドラッグして置く"></canvas>
    <div class="toast off" id="toast"></div>
  </div>
</div>
<div class="overlay" id="over" hidden role="dialog" aria-modal="true" aria-labelledby="overTitle">
  <div class="card">
    <h2 id="overTitle" data-i18n>置き場がない！</h2>
    <div class="label" data-i18n>スコア</div>
    <div class="big" id="overScore">0</div>
    <div class="best"><span id="overBestLabel" data-i18n>ベスト</span> <b id="overBest">0</b></div>
    <div id="overNew" class="newrec" hidden data-i18n>ベスト更新！</div>
    <div id="overGoal" class="goal" hidden></div>
    <button class="btn" id="again" type="button" data-i18n>もう一度</button>
    <button class="btn sub" id="overAlt" type="button"></button>
    <div id="vsSlotOver"></div>
    <a class="btn link" href="../" data-i18n>ゲーム一覧へ</a>
  </div>
</div>
<div class="overlay" id="howto" hidden role="dialog" aria-modal="true" aria-labelledby="howtoTitle" data-kb-howto>
  <div class="card howto">
    <h2 id="howtoTitle" data-i18n>遊び方</h2>
    <ol>
      <li><svg viewBox="0 0 64 48" aria-hidden="true"><rect x="2" y="2" width="60" height="30" rx="5" fill="#d9ad72"/><g fill="#3e64b8"><rect x="22" y="36" width="9" height="9" rx="2"/><rect x="32" y="36" width="9" height="9" rx="2"/></g><path d="M36 33 V14" stroke="#f4b740" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M30 18 l6 -7 l6 7" fill="none" stroke="#f4b740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p data-i18n-html>下のブロックを、盤へ<b>ドラッグ</b>して置く<small>回したりはできません</small></p></li>
      <li><svg viewBox="0 0 64 48" aria-hidden="true"><rect x="2" y="6" width="60" height="36" rx="5" fill="#d9ad72"/><rect x="4" y="18" width="56" height="11" rx="3" fill="#fff3d6" opacity=".9"/><g fill="#e2553c"><rect x="6" y="19.5" width="8" height="8" rx="2"/><rect x="15" y="19.5" width="8" height="8" rx="2"/><rect x="24" y="19.5" width="8" height="8" rx="2"/></g><g fill="#5fa548"><rect x="33" y="19.5" width="8" height="8" rx="2"/><rect x="42" y="19.5" width="8" height="8" rx="2"/><rect x="51" y="19.5" width="8" height="8" rx="2"/></g><path d="M9 12l2 3M32 9v4M55 12l-2 3M9 37l2-3M32 39v-4M55 37l-2-3" stroke="#f4b740" stroke-width="2.2" stroke-linecap="round"/></svg>
        <p data-i18n-html>縦か横の列が<b>そろうと消えて</b>得点<small>続けて消すとコンボで大きく伸びる</small></p></li>
      <li><svg viewBox="0 0 64 48" aria-hidden="true"><rect x="2" y="2" width="60" height="30" rx="5" fill="#d9ad72"/><g fill="#9a6ccc"><rect x="6" y="6" width="9" height="9" rx="2"/><rect x="16" y="6" width="9" height="9" rx="2"/><rect x="36" y="6" width="9" height="9" rx="2"/><rect x="6" y="18" width="9" height="9" rx="2"/><rect x="26" y="18" width="9" height="9" rx="2"/><rect x="46" y="18" width="9" height="9" rx="2"/></g><g fill="#26a3a6" opacity=".4"><rect x="20" y="36" width="9" height="9" rx="2"/><rect x="30" y="36" width="9" height="9" rx="2"/><rect x="40" y="36" width="9" height="9" rx="2"/></g></svg>
        <p data-i18n-html>3つとも置くと次の3つ。<b>置き場がなくなったら</b>おしまい<small>置けないブロックは薄くなる</small></p></li>
    </ol>
    <button class="btn" id="howtoGo" type="button" data-i18n>やってみる</button>
    <button class="btn sub" id="howtoAlt" type="button" data-i18n>説明だけでOK</button>
  </div>
</div>
<script src="../common/game.js"></script>
<script>
(() => {
'use strict';

// ---------- Pieces ----------

function rotations(cells, n) {

  return out;

const FAMILIES = [ // [name, base cells, rotations, total weight, color]
  ['dot',   [[0,0]], 1, 5, 3],
  ['I2',    [[0,0],[0,1]], 2, 8, 6],
  ['I3',    [[0,0],[0,1],[0,2]], 2, 8, 4],
  ['I4',    [[0,0],[0,1],[0,2],[0,3]], 2, 7, 1],
  ['I5',    [[0,0],[0,1],[0,2],[0,3],[0,4]], 2, 4, 0],
  ['O2',    [[0,0],[0,1],[1,0],[1,1]], 1, 7, 2],
  ['O3',    [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], 1, 2.5, 7],
  ['R23',   [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], 2, 3, 5],
  ['V3',    [[0,0],[1,0],[1,1]], 4, 8, 6],
  ['L4',    [[0,0],[1,0],[2,0],[2,1]], 4, 6, 7],
  ['J4',    [[0,1],[1,1],[2,1],[2,0]], 4, 6, 1],
  ['V5',    [[0,0],[1,0],[2,0],[2,1],[2,2]], 4, 4, 4],
  ['T4',    [[0,0],[0,1],[0,2],[1,1]], 4, 6, 4],
  ['S4',    [[0,1],[0,2],[1,0],[1,1]], 2, 4, 2],
  ['Z4',    [[0,0],[0,1],[1,1],[1,2]], 2, 4, 0],

const PIECES = []; // {cells, w, h, color, weight}
for (const [name, base, nrot, weight, color] of FAMILIES) {

  for (const cells of rs) {
    PIECES.push({ name, cells, color, weight: weight / rs.length,

}
const pidOf = (name, w, h) => PIECES.findIndex(p => p.name === name && p.w === w && p.h === h);
const TOTAL_W = PIECES.reduce((s, p) => s + p.weight, 0);
// Normal play uses Math.random (with a fairness re-roll). The daily challenge and online battle draw from a seeded
// sequence with no re-roll, so everyone gets the same pieces in the same order whatever their board looks like.
let rnd = Math.random, vs = null; // vs = { snap } while a versus match owns the board
function randomPiece() {

  for (let i = 0; i < PIECES.length; i++) { r -= PIECES[i].weight; if (r <= 0) return i; }
  return PIECES.length - 1;
}

// ---------- State ----------

function fits(pid, r0, c0) {
  const p = PIECES[pid];
  if (r0 < 0 || c0 < 0 || r0 + p.h > N || c0 + p.w > N) return false;
  for (const [r, c] of p.cells) if (board[(r0 + r) * N + c0 + c] >= 0) return false;
  return true;
}

}
const seeded = () => !!vs || mode === 'daily';
function deal() {

    return;
  }
  let best3 = null;
  for (let attempt = 0; attempt < 14; attempt++) {
    const hand = [randomPiece(), randomPiece(), randomPiece()];
    if (hand.some(fitsAnywhere)) { best3 = hand; break; }
    if (!best3) best3 = hand;

  if (!best3.some(fitsAnywhere)) {
    const smalls = PIECES.map((p, i) => i).filter(i => PIECES[i].cells.length <= 3 && fitsAnywhere(i));
    if (smalls.length && Math.random() < 0.7) best3[Math.floor(Math.random() * 3)] = smalls[Math.floor(Math.random() * smalls.length)];

// ---------- Scoring & placement ----------
const lineScore = n => 10 * n * (n + 1) / 2; // 1:10 2:30 3:60 4:100 ...
let shake = null;
function place(i, r0, c0) {
  const pid = tray[i], p = PIECES[pid];

  startPlay();

    cols.forEach(c => { for (let r = 0; r < N; r++) clr.add(r * N + c); });

    const pr = r0 + p.h / 2, pc = c0 + p.w / 2;

    const cx = (cols.length ? cols.reduce((a, b) => a + b, 0) / cols.length : pc - .5) + .5;
    const cy = (rows.length ? rows.reduce((a, b) => a + b, 0) / rows.length : pr - .5) + .5;

    else if (lines === 2) label = T('ダブル！');

    sfxPlace();
    buzz(8);

    else { busy = true; if (k > 0) { const a = shake.amp * (1 - k); ctx.translate(Math.sin(k * 38) * a, Math.cos(k * 31) * a * 0.6); } }
  }
  // board
  if (boardLayer) ctx.drawImage(boardLayer, bx - border, by - border, boardLayer.width / dpr, boardLayer.height / dpr);
  // preview data
  let prevCells = null, hlRows = [], hlCols = [], prevColor = 0;
  if (drag && drag.snap) {
    const p = PIECES[drag.pid]; prevColor = p.color;
    prevCells = new Set(p.cells.map(([r, c]) => (drag.snap.r + r) * N + drag.snap.c + c));
    const filled = i => board[i] >= 0 || prevCells.has(i);
    for (let r = 0; r < N; r++) { let f = true; for (let c = 0; c < N; c++) if (!filled(r * N + c)) { f = false; break; } if (f) hlRows.push(r); }
    for (let c = 0; c < N; c++) { let f = true; for (let r = 0; r < N; r++) if (!filled(r * N + c)) { f = false; break; } if (f) hlCols.push(c); }
  }
  const willClear = i => hlRows.includes((i / N) | 0) || hlCols.includes(i % N);
  // highlight lines that would clear
  if (hlRows.length || hlCols.length) {
    ctx.fillStyle = 'rgba(255,248,220,.28)';
    hlRows.forEach(r => { rr(ctx, bx, by + r * cell, cell * N, cell, cell * 0.18); ctx.fill(); });
    hlCols.forEach(c => { rr(ctx, bx + c * cell, by, cell, cell * N, cell * 0.18); ctx.fill(); });
  }
  // tutorial: the glowing target spot
  const tt = mode === 'tutorial' && tut && tut.target ? tut.target : null;
  if (tt && !(drag && drag.snap)) {
    const p = PIECES[tray[tt.i]];
    if (p) {
      const pulse = reduced() ? 0.5 : 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(now / 180));
      ctx.fillStyle = `rgba(255,236,170,${pulse})`;
      for (const [r, c] of p.cells) { rr(ctx, bx + (tt.c + c) * cell + 2, by + (tt.r + r) * cell + 2, cell - 4, cell - 4, cell * 0.2); ctx.fill(); }
      ctx.strokeStyle = `rgba(255,190,60,${0.5 + pulse * 0.5})`; ctx.lineWidth = 2.5;
      rr(ctx, bx + tt.c * cell + 1, by + tt.r * cell + 1, p.w * cell - 2, p.h * cell - 2, cell * 0.22); ctx.stroke();
      busy = !reduced();
    }
  }
  // placed tiles
  let pfK = 1;
  if (placeFx) { pfK = Math.min(1, (now - placeFx.t0) / 160); if (pfK >= 1) placeFx = null; else busy = true; }
  for (let i = 0; i < N * N; i++) {
    const v = board[i]; if (v < 0) continue;
    const r = (i / N) | 0, c = i % N;
    let sc = 1;
    if (placeFx && placeFx.cells.includes(i)) sc = 1 + 0.14 * (1 - ease(pfK)) * Math.cos(pfK * Math.PI * 1.5);
    const col = (prevCells && willClear(i)) ? prevColor : v;
    drawTile(col, bx + c * cell, by + r * cell, cell, 1, sc);
  }
  // preview ghost on board
  if (prevCells) {
    const pulse = 0.42 + 0.08 * Math.sin(now / 120);
    for (const i of prevCells) drawTile(prevColor, bx + (i % N) * cell, by + ((i / N) | 0) * cell, cell, willClear(i) ? 0.85 : pulse);
    busy = true;
  }
  // clear effects
  for (let k = effects.length - 1; k >= 0; k--) {
    const f = effects[k], t = (now - f.t0) / (reduced() ? 200 : 380);
    if (t >= 1) { effects.splice(k, 1); continue; }
    busy = true;
    const x = bx + f.c * cell, y = by + f.r * cell;
    if (t < 0) { drawTile(f.color, x, y, cell); continue; }
    if (reduced()) { drawTile(f.color, x, y, cell, 1 - t); continue; }
    const sc = t < 0.3 ? 1 + t / 0.3 * 0.2 : 1.2 * (1 - ease((t - 0.3) / 0.7));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,236,190,${0.55 * (1 - t)})`;
    rr(ctx, x + 2, y + 2, cell - 4, cell - 4, cell * 0.2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    drawTile(f.color, x, y, cell, 1 - t * 0.6, Math.max(0.01, sc));
    // sparkle bits
    for (let s = 0; s < 3; s++) {
      const a = (f.r * 7 + f.c * 13 + s * 2.1), dist = cell * (0.3 + t * 0.9);
      ctx.fillStyle = `rgba(255,250,225,${1 - t})`;
      ctx.beginPath(); ctx.arc(x + cell / 2 + Math.cos(a) * dist, y + cell / 2 + Math.sin(a) * dist, cell * 0.06 * (1 - t), 0, 7); ctx.fill();
    }
  }
  // tray
  for (let i = 0; i < 3; i++) {
    const pid = tray[i];
    if (pid === null || pid === undefined) continue;
    if (drag && drag.i === i) continue;
    const p = PIECES[pid], sc = slotCenter(i);
    let ox = sc.x - p.w * tcell / 2, oy = sc.y - p.h * tcell / 2, size = tcell, alpha = 1;
    const ok = over ? false : fitsAnywhere(pid);
    if (!ok) alpha = 0.35;
    if (tt && tt.i !== i) alpha = Math.min(alpha, 0.45);
    if (returning && returning.i === i) {
      const k = Math.min(1, (now - returning.t0) / 200), e2 = ease(k);
      if (k >= 1) returning = null; else {
        busy = true;
        ox = returning.x + (ox - returning.x) * e2; oy = returning.y + (oy - returning.y) * e2; size = cell + (tcell - cell) * e2;
      }
    } else if (dealAnim) {
      const k = Math.min(1, Math.max(0, (now - dealAnim.t0 - i * 70) / 320));
      if (k < 1) busy = true;
      ox += (1 - ease(k)) * (W * 0.6); alpha *= Math.min(1, k * 2);
    }
    if (alpha <= 0) continue;
    if (tt && tt.i === i && !reduced()) { // a gentle bob on the block to move
      const b = Math.sin(now / 220) * tcell * 0.12; oy += b;
      ctx.fillStyle = 'rgba(255,214,110,.25)';
      rr(ctx, ox - tcell * 0.3, oy - tcell * 0.3, p.w * tcell + tcell * 0.6, p.h * tcell + tcell * 0.6, tcell * 0.4); ctx.fill();
    }
    for (const [r, c] of p.cells) drawTile(p.color, ox + c * size, oy + r * size, size, alpha);
  }
  if (dealAnim && now - dealAnim.t0 > 600) dealAnim = null;
  // dragged piece
  if (drag) {
    const p = PIECES[drag.pid];
    const g = ghostTopLeft(drag.x, drag.y, p, drag.type);
    const k = reduced() ? 1 : Math.min(1, (now - drag.t0) / 110);
    if (k < 1) busy = true;
    const sc = slotCenter(drag.i);
    const sx = sc.x - p.w * tcell / 2, sy = sc.y - p.h * tcell / 2;
    const e2 = ease(k), size = tcell + (cell - tcell) * e2;
    const x = sx + (g.x - sx) * e2, y = sy + (g.y - sy) * e2;
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    for (const [r, c] of p.cells) { rr(ctx, x + c * size + size * 0.12, y + r * size + size * 0.22, size * 0.86, size * 0.86, size * 0.2); ctx.fill(); }
    for (const [r, c] of p.cells) drawTile(p.color, x + c * size, y + r * size, size, 1, 1.04);
  }
  // popups
  for (let k = popups.length - 1; k >= 0; k--) {
    const pp = popups[k], t = (now - pp.t0) / (pp.banner ? 1100 : 900);
    if (t >= 1) { popups.splice(k, 1); continue; }
    busy = true;
    if (t < 0) continue;
    const rise = reduced() ? 0 : ease(t) * cell * (pp.banner ? 0.6 : 1.2);
    const pop = reduced() ? 1 : (t < 0.15 ? 0.6 + t / 0.15 * 0.5 : t < 0.25 ? 1.1 - (t - 0.15) : 1);
    let fs = Math.round(cell * 0.6 * pp.size * pop);
    ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
    ctx.font = `400 ${fs}px "Dela Gothic One", "Hiragino Sans", sans-serif`;
    // keep long labels (e.g. English) inside the board
    let tw = ctx.measureText(pp.text).width;
    const maxW = cell * N - cell * 0.5;
    if (tw > maxW) { fs = Math.max(10, Math.floor(fs * maxW / tw)); ctx.font = `400 ${fs}px "Dela Gothic One", "Hiragino Sans", sans-serif`; tw = ctx.measureText(pp.text).width; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const mx = Math.max(fs * 1.5, tw / 2 + fs * 0.2);
    const x = Math.max(bx + mx, Math.min(bx + cell * N - mx, bx + pp.x * cell)), y = Math.max(by + fs * 0.7, by + pp.y * cell - rise);
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, fs * 0.18); ctx.strokeStyle = '#3a1f0e'; ctx.strokeText(pp.text, x, y);
    ctx.fillStyle = pp.banner ? '#ffd45e' : '#fff7e6'; ctx.fillText(pp.text, x, y);
    ctx.globalAlpha = 1;
  }
  if (busy && document.visibilityState !== 'hidden') requestDraw();
}

// ---------- Online battle (common/versus.js) ----------
// stuck in a match: wipe the board and keep going (the piece sequence stays the same for everyone)
function vsStuck() {
  if (!vs || !KoboVersus.canPlay() || tray.some(v => v !== null && fitsAnywhere(v))) return;
  for (let i = 0; i < N * N; i++) if (board[i] >= 0) effects.push({ r: (i / N) | 0, c: i % N, color: board[i], t0: performance.now() });
  board.fill(-1); combo = 0;
  toast(T('置き場がない！ 盤をリセット')); sfx('over'); buzz(40);
  updateHud(); requestDraw();
}
KoboVersus.init({
  game: 'blocks', title: T('ブロックはめ'), duration: 180, unit: T('点'),
  theme: { accent: 'var(--kb-accent-text)', accentBg: 'var(--kb-accent)', accentInk: 'var(--kb-accent-ink)', accentShadow: 'var(--bk-btn-shadow)', card: 'var(--bk-card)', line: 'var(--kb-line)',
    ink: 'var(--kb-ink)', dim: 'var(--kb-dim)', hud: 'var(--bk-hud)', display: 'var(--kb-font-display)' },
  hudCover: () => document.querySelector('header'),
  onOpen() { cancelDrag(); const g = G(); if (g) g.pause('versus'); },
  onStart({ seed, practice }) {
    if (mode === 'tutorial') { tut = null; store.set(KEY_TUT, '1'); mode = 'normal'; rnd = Math.random; if (!load()) { resetRun(); deal(); save(); } renderCoach(); }
    if (!vs) {
      endPlay('quit');
      vs = { snap: { board: board.slice(), tray: tray.slice(), score, combo, moves, over, overShown: !$('over').hidden, mode, daily, draws, bestAtStart, bestToasted, goalToasted } };
    }
    if (vs.playing) { const g = G(); if (g) g.emit('play_end', { mode: vs.playing, score, reason: 'quit' }); }
    rnd = KoboVersus.rng(seed);
    drag = null; returning = null;
    board = new Array(N * N).fill(-1); score = 0; combo = 0; moves = 0; over = false;
    effects.length = 0; popups.length = 0; placeFx = null;
    $('over').hidden = true; $('howto').hidden = true;
    deal(); renderMode(); updateHud(true); requestDraw();
    vs.playing = practice ? 'practice' : 'versus';
    const g = G(); if (g) g.emit('play_start', { mode: vs.playing, seed });
  },
  getScore: () => score,
  onEnd() {
    drag = null; returning = null; requestDraw();
    if (vs && vs.playing) { const g = G(); if (g) g.emit('play_end', { mode: vs.playing, score, reason: 'over' }); vs.playing = null; }
  },
  onExit() {
    if (!vs) return;
    if (vs.playing) { const g = G(); if (g) g.emit('play_end', { mode: vs.playing, score, reason: 'quit' }); }
    const s = vs.snap; vs = null;
    drag = null; returning = null; effects.length = 0; popups.length = 0; placeFx = null;
    board = s.board; tray = s.tray; score = s.score; combo = s.combo; moves = s.moves; over = s.over;
    mode = s.mode; daily = s.daily; bestAtStart = s.bestAtStart; bestToasted = s.bestToasted; goalToasted = s.goalToasted;
    rnd = mode === 'daily' && daily ? dailyRng(daily.seed, s.draws) : Math.random;
    if (mode === 'daily') refreshDaily();
    $('over').hidden = !s.overShown;
    renderMode(); updateHud(true); requestDraw();
  },
});
KoboVersus.button($('vsSlot'), { compact: true });
KoboVersus.button($('vsSlotOver'));

// ---------- KoboGame: platform hooks (turn-based: flags.pause is false, so hiding the page just saves) ----------
// Migration: players who already have a best score or a board in progress have played before → don't show the
// first-visit how-to and tutorial to them. Runs once (kobo.migrated), and running it again changes nothing.
if (PF && PF.migrations) PF.migrations.add({ id: 'blocks-howto-1', v: 1, run(c) {
  const has = c.store.raw(KEY_BEST) != null || c.store.raw(KEY_STATE) != null;
  if (has && c.store.raw(KEY_HOWTO) == null) c.store.setRaw(KEY_HOWTO, '1');
  if (has && c.store.raw(KEY_TUT) == null) c.store.setRaw(KEY_TUT, 'old');
} });
const listeners = [];
const on = (t, ev, f, o) => { t.addEventListener(ev, f, o); listeners.push(() => t.removeEventListener(ev, f, o)); };
let ro = null, booted = false;
if (window.KoboGame) KoboGame.register({
  id: GAME,
  pause() { cancelDrag(); save(); },
  resume() { requestDraw(); },
  save() { cancelDrag(); save(); },
  isIdle: () => !sess && !vs && mode !== 'tutorial' && !drag,
  dispose() { cancelAnimationFrame(raf); raf = 0; listeners.splice(0).forEach(f => f()); if (ro) ro.disconnect(); },
  daily: { start({ dateKey }) { if (!vs && mode !== 'tutorial') { hideOver(); startDaily(dateKey); } } },
});

// ---------- Boot ----------
renderSoundBtn();
const launch = PF ? PF.launch() : { daily: null };
if (!load()) { resetRun(); deal(); save(); }
updateHud(true);
renderMode();
layout();
on(window, 'resize', layout);
if (window.visualViewport) on(visualViewport, 'resize', layout);
if (window.ResizeObserver) { ro = new ResizeObserver(() => layout()); ro.observe($('play')); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestDraw);
on(document, 'visibilitychange', () => { if (document.visibilityState === 'hidden') { cancelDrag(); save(); } else requestDraw(); });
// ?daily=YYYYMMDD (the hub's "today's challenge"): KoboGame starts it when the registry has flags.daily; until then, here
if (launch.daily) {
  const def = window.KoboGame && KoboGame.info().def;
  if (!(def && def.flags && def.flags.daily)) setTimeout(() => { if (!vs && mode !== 'tutorial') startDaily(launch.daily); }, 0);
}
const firstVisit = store.get(KEY_HOWTO) == null;
if (firstVisit) showHowto(true);
else if (!launch.daily && stuck()) { over = true; overInfo = { isNew: false, score }; setTimeout(gameOver, 300); }
// the browser bar follows the room color (KoboUI sets the hub's color by default)
function themeColor() {
  const m = document.querySelector('meta[name="theme-color"]'); if (!m) return;
  const light = UI && UI.theme ? UI.theme.resolved() === 'light' : false;
  m.setAttribute('content', light ? '#f4e8d6' : '#2a1b12');
}
themeColor();
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(themeColor, 0));
booted = true;

// ---------- Test hooks ----------
// Small read-only hook kept for older scripts: where to press / release to drop tray piece i at (r, c).
window.__blocksTest = {
  get state() { return { board: board.slice(), tray: tray.slice(), score, combo, over, best }; },
  pieces: PIECES,
  slotPoint(i) { const s = slotCenter(i); return { x: rect.left + s.x, y: rect.top + s.y }; },
  dropPoint(i, r, c, type) {
    const p = PIECES[tray[i]], lift = liftFor(type || 'mouse');
    const gx = bx + c * cell, gy = by + r * cell;
    const px = gx + p.w * cell / 2;
    const py = type === 'touch' ? gy + p.h * cell + lift * cell : gy + p.h * cell / 2 + lift * cell * 0.4;
    return { x: rect.left + px, y: rect.top + py };
  },
};
// greedy bot move: the placement that clears the most lines, then the one that leaves the most room
function botMove() {
  if (mode === 'tutorial' && tut) {
    if (tut.target && tray[tut.target.i] != null) return { i: tut.target.i, r: tut.target.r, c: tut.target.c };
    if (tut.step === 1 && !tut.target) return null;
  }
  let bestM = null, bestV = -1e9;
  for (let i = 0; i < 3; i++) {
    const pid = tray[i]; if (pid == null) continue;
    const p = PIECES[pid];
    for (let r = 0; r + p.h <= N; r++) for (let c = 0; c + p.w <= N; c++) {
      if (!fits(pid, r, c)) continue;
      const b = board.slice(); for (const [y, x] of p.cells) b[(r + y) * N + c + x] = 0;
      let lines = 0; const fullR = [], fullC = [];
      for (let y = 0; y < N; y++) { let f = true; for (let x = 0; x < N; x++) if (b[y * N + x] < 0) { f = false; break; } if (f) { lines++; fullR.push(y); } }
      for (let x = 0; x < N; x++) { let f = true; for (let y = 0; y < N; y++) if (b[y * N + x] < 0) { f = false; break; } if (f) { lines++; fullC.push(x); } }
      fullR.forEach(y => { for (let x = 0; x < N; x++) b[y * N + x] = -1; });
      fullC.forEach(x => { for (let y = 0; y < N; y++) b[y * N + x] = -1; });
      let holes = 0; for (let k = 0; k < N * N; k++) if (b[k] < 0) { const y = (k / N) | 0, x = k % N; let n = 0; if (y > 0 && b[k - N] >= 0) n++; if (y < N - 1 && b[k + N] >= 0) n++; if (x > 0 && b[k - 1] >= 0) n++; if (x < N - 1 && b[k + 1] >= 0) n++; if (n >= 3) holes++; }
      const v = lines * 100 + p.cells.length * 2 - holes * 6 + b.filter(x => x < 0).length * 0.5;
      if (v > bestV) { bestV = v; bestM = { i, r, c }; }
    }
  }
  return bestM;
}
if (window.__kb) Object.assign(window.__kb, {
  ready: () => booted && !!rect && W > 0,
  state: () => ({ mode: vs ? (vs.playing || 'versus') : mode, score, time: sess ? Math.round(performance.now() - sess.t0) : 0, over, stage: null,
    paused: !!(window.KoboGame && KoboGame.paused()), moves, combo, best, tray: tray.slice(), board: board.slice(),
    daily: daily ? { dateKey: daily.dateKey, goal: daily.goal, best: daily.best, tries: daily.tries, draws } : null,
    howto: !$('howto').hidden, overShown: !$('over').hidden }),
  // endless game: "win" ends the run now (daily: with the day's goal reached), "lose" fills the board so nothing fits
  win() {
    if (over || vs || mode === 'tutorial') return false;
    startPlay();
    if (mode === 'daily') score = Math.max(score, daily.goal);
    updateHud(true); finishRun(); return true;
  },
  lose() {
    if (over || vs || mode === 'tutorial') return false;
    startPlay();
    board.fill(4); updateHud(true); finishRun(); requestDraw(); return true;
  },
  step(n) {
    let k = 0;
    for (; k < (n || 1); k++) { if (over || (vs && !KoboVersus.canPlay())) break; const m = botMove(); if (!m) break; place(m.i, m.r, m.c); }
    return k;
  },
  tutorial: () => ({ step: tut ? tut.step : (store.get(KEY_TUT) ? TUT_STEPS.length : 0), done: !tut && !!store.get(KEY_TUT), active: !!tut, target: tut && tut.target }),
  tutorialStart: startTutorial, tutorialFinish: finishTutorial,
  daily: dk => startDaily(dk), normal: () => setMode('normal'), menu: openMenu, howto: () => showHowto(false),
  goalFor, pieces: PIECES,
});
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
