<style>
/* リバーシ工房: a felt board in a wooden frame on a workshop bench. The stones keep their own colours in both themes (a gear on the dark ones, a screw head on the light ones);
   the bench and the room follow the light / dark theme. --kb-* are the shared tokens re-tinted; --rv-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #0f1a22; --kb-surface: #172732; --kb-surface-2: #1d3340; --kb-sunken: #0a131a; --kb-line: #2f4a5a;
  --kb-ink: #f0f5f7; --kb-dim: #a9bfca;
  --kb-accent: #f0c04f; --kb-accent-ink: #2b1f00; --kb-accent-text: #ffd57a; --kb-accent-soft: rgba(240, 192, 79, .16);
  --kb-scrim: rgba(4, 10, 14, .8); --kb-toast-bg: rgba(8, 16, 22, .95); --kb-focus: #ffe08a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --rv-felt: #1d6252; --rv-felt2: #164d41; --rv-grid: rgba(4, 22, 18, .55); --rv-frame: #6b4a2c; --rv-frame2: #4a3119; --rv-rim: rgba(255, 220, 160, .28);
  --rv-panel: rgba(220, 240, 255, .06); --rv-line: rgba(180, 215, 235, .16); --rv-card: linear-gradient(#1b2f3c, #14242e);
  --rv-go: linear-gradient(#ffd77d, #efa83a); --rv-go-ink: #2b1d00; --rv-go-shadow: #94620f;
  --rv-key: linear-gradient(#26414f, #1b3340); --rv-key-shadow: #08121a;
  --rv-title: linear-gradient(90deg, #ffd98a, #8fe0c8 55%, #f2f2f2);
  --rv-bad: #ff8d7d; --rv-ok: #6fe3b0; --rv-dot: rgba(255, 244, 200, .55); --rv-lab: rgba(255, 255, 255, .42);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f1eee6; --kb-surface: #ffffff; --kb-surface-2: #f6f2e9; --kb-sunken: #e4ded0; --kb-line: #cfc6b2;
    --kb-ink: #1f2a2e; --kb-dim: #566a72;
    --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
    --kb-scrim: rgba(31, 42, 46, .45); --kb-toast-bg: rgba(31, 42, 46, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(31, 42, 46, .2);
    --rv-felt: #3f9482; --rv-felt2: #327f6f; --rv-grid: rgba(8, 40, 33, .45); --rv-frame: #a97c50; --rv-frame2: #8a6238; --rv-rim: rgba(255, 255, 255, .5);
    --rv-panel: rgba(31, 42, 46, .05); --rv-line: #d8d0bd; --rv-card: linear-gradient(#ffffff, #f6f2e9);
    --rv-go: linear-gradient(#e0a02f, #b8730a); --rv-go-ink: #ffffff; --rv-go-shadow: #7a4b05;
    --rv-key: linear-gradient(#ffffff, #f1ece0); --rv-key-shadow: #c3b9a2;
    --rv-title: linear-gradient(90deg, #8a5300, #1f6a58 55%, #3a3a3a);
    --rv-bad: #c43b27; --rv-ok: #0f8a5c; --rv-dot: rgba(255, 255, 255, .8); --rv-lab: rgba(255, 255, 255, .7);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f1eee6; --kb-surface: #ffffff; --kb-surface-2: #f6f2e9; --kb-sunken: #e4ded0; --kb-line: #cfc6b2;
  --kb-ink: #1f2a2e; --kb-dim: #566a72;
  --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
  --kb-scrim: rgba(31, 42, 46, .45); --kb-toast-bg: rgba(31, 42, 46, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(31, 42, 46, .2);
  --rv-felt: #3f9482; --rv-felt2: #327f6f; --rv-grid: rgba(8, 40, 33, .45); --rv-frame: #a97c50; --rv-frame2: #8a6238; --rv-rim: rgba(255, 255, 255, .5);
  --rv-panel: rgba(31, 42, 46, .05); --rv-line: #d8d0bd; --rv-card: linear-gradient(#ffffff, #f6f2e9);
  --rv-go: linear-gradient(#e0a02f, #b8730a); --rv-go-ink: #ffffff; --rv-go-shadow: #7a4b05;
  --rv-key: linear-gradient(#ffffff, #f1ece0); --rv-key-shadow: #c3b9a2;
  --rv-title: linear-gradient(90deg, #8a5300, #1f6a58 55%, #3a3a3a);
  --rv-bad: #c43b27; --rv-ok: #0f8a5c; --rv-dot: rgba(255, 255, 255, .8); --rv-lab: rgba(255, 255, 255, .7);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 62%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--rv-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rv-line); background: var(--rv-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .opt:focus-visible, .tog:focus-visible, .act:focus-visible, .qm:focus-visible, #board:focus-visible, .cell:focus-visible, summary:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 1px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--rv-panel); border: 1px solid var(--rv-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn.you { background: var(--kb-accent-soft); border-color: var(--kb-accent); color: var(--kb-accent-text); }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 5px; }
#bar { flex: none; display: flex; gap: 8px; justify-content: center; }
.pl { flex: 1 1 0; min-width: 0; max-width: 240px; display: flex; align-items: center; gap: 7px; box-sizing: border-box; padding: 3px 9px 3px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--rv-panel); transition: border-color .2s, background .2s; }
.pl.on { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.pl .dk { flex: none; width: 24px; height: 24px; border-radius: 50%; background-size: 100% 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.pl .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; }
.pl .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.pl .nm small { display: block; font-size: 10.5px; font-weight: 500; color: var(--kb-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .n { flex: none; font: 400 24px/1 var(--kb-font-display); font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; }
.pl .bd { flex: none; padding: 0 6px; border-radius: 9px; background: rgba(128, 150, 160, .3); color: var(--kb-ink); font: 800 10px var(--kb-font-body); }
.pl .bd.off { background: #ff8d7d; color: #2b0b06; } .pl .bd.away { background: #ffd078; color: #2b1d00; } .pl .bd.tm { background: var(--kb-accent); color: var(--kb-accent-ink); font-variant-numeric: tabular-nums; }
#stage { position: relative; flex: 1 1 0; min-height: 120px; display: grid; place-items: center; }
#board { position: relative; width: var(--bs, 300px); height: var(--bs, 300px); box-sizing: border-box; display: grid; grid-template-columns: repeat(var(--n, 8), 1fr); grid-template-rows: repeat(var(--n, 8), 1fr);
  padding: clamp(3px, 1.6%, 9px); border-radius: clamp(8px, 3%, 16px); background: linear-gradient(145deg, var(--rv-frame), var(--rv-frame2)); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px var(--rv-rim); touch-action: manipulation; outline-offset: 3px; }
#board .row { display: contents; }
.cell { position: relative; box-sizing: border-box; background: var(--rv-felt); box-shadow: inset 0 0 0 .5px var(--rv-grid); cursor: default; display: grid; place-items: center; outline: none; -webkit-tap-highlight-color: transparent; }
.cell:nth-child(odd) { background: var(--rv-felt2); }
#board .row:nth-child(even) .cell:nth-child(odd) { background: var(--rv-felt); }
#board .row:nth-child(even) .cell:nth-child(even) { background: var(--rv-felt2); }
.cell[data-rl]::before { content: attr(data-rl); position: absolute; left: 2px; top: 0; font: 800 clamp(7px, 2.3vw, 10px) var(--kb-font-body); color: var(--rv-lab); pointer-events: none; }
.cell[data-cl]::after { content: attr(data-cl); position: absolute; right: 2px; bottom: 0; font: 800 clamp(7px, 2.3vw, 10px) var(--kb-font-body); color: var(--rv-lab); pointer-events: none; }
.cell .dot { position: absolute; width: 26%; height: 26%; border-radius: 50%; background: var(--rv-dot); opacity: 0; transform: scale(.4); transition: opacity .15s, transform .15s; pointer-events: none; }
.cell.lg .dot { opacity: 1; transform: none; }
.cell.lg { cursor: pointer; }
.cell.ht .dot { opacity: 1; transform: none; width: 60%; height: 60%; background: transparent; box-shadow: 0 0 0 3px #ffd54a, 0 0 14px 3px rgba(255, 213, 74, .85); animation: glow 1s ease-in-out infinite; }
.cell.sel .dot { opacity: 1; transform: none; width: 64%; height: 64%; background: rgba(255, 213, 74, .35); box-shadow: 0 0 0 3px #ffd54a; }
.cell.bs .dot { opacity: 1; transform: none; width: 64%; height: 64%; background: rgba(111, 227, 176, .4); box-shadow: 0 0 0 3px #6fe3b0, 0 0 12px 2px rgba(111, 227, 176, .8); }
.cell.bad .dot { opacity: 1; transform: none; width: 56%; height: 56%; background: rgba(255, 141, 125, .45); box-shadow: 0 0 0 3px #ff8d7d; }
.cell.cur::after, .cell.cur::before { color: #fff; }
body.kbd .cell.cur { box-shadow: inset 0 0 0 2.5px var(--kb-focus), inset 0 0 0 .5px var(--rv-grid); z-index: 2; }
.cell.last .disc::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; margin: -11% 0 0 -11%; border-radius: 50%; background: #ff6f5f; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); z-index: 3; transform: translateZ(1px); }
.cell.shake { animation: shake .3s; }
.disc { position: absolute; inset: 9%; perspective: 520px; pointer-events: none; }
.disc .fl { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4, .1, .3, 1); transition-delay: var(--dl, 0ms); }
.disc.w .fl { transform: rotateY(180deg); }
.disc .fc { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-size: 100% 100%; box-shadow: 0 2px 4px rgba(0, 0, 0, .45); }
.disc .fw { transform: rotateY(180deg); }
.disc.new { animation: drop .3s ease-out; }
.disc.fp { animation: lift .5s ease-in-out; animation-delay: var(--dl, 0ms); }
#board.inst .fl, #board.inst .disc { transition: none !important; animation: none !important; }
#status { flex: none; min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 10px; border-radius: 14px; background: var(--rv-panel); border: 1px solid var(--rv-line); font-size: 12.5px; font-weight: 800; text-align: center; line-height: 1.3; }
#status.you { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
#ctl { flex: none; display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; min-height: 48px; }
.act { flex: 1 1 0; min-width: 0; max-width: 190px; min-height: 48px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--rv-line); background: var(--rv-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--rv-key-shadow); font: 800 14px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.15; touch-action: manipulation; }
.act small { display: block; font-size: 10px; font-weight: 500; opacity: .8; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rv-key-shadow); }
.act.go { background: var(--rv-go); color: var(--rv-go-ink); border-color: transparent; box-shadow: 0 3px 0 var(--rv-go-shadow); font-size: 15px; }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }

.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.panel { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--rv-card); border: 1px solid var(--rv-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--rv-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 25px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--rv-go); color: var(--rv-go-ink); box-shadow: 0 3px 0 var(--rv-go-shadow); font: 800 16px var(--kb-font-body); text-decoration: none; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rv-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--rv-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--rv-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.opts { text-align: left; }
.og { margin: 8px 0 0; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--rv-panel); border: 1px solid var(--rv-line); }
.opt { flex: 1; min-width: 0; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.2; }
.opt small { display: block; font-size: 10.5px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 6px; padding: 4px 10px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--rv-line); background: var(--rv-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; text-align: left; }
.tog span { flex: 1; } .tog small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--kb-line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; text-align: left; }
.qm:first-child { margin-top: 0; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.gdesc { margin: 8px 0 0; font-size: 12.5px; font-weight: 500; color: var(--kb-ink); line-height: 1.5; }
.gbest { margin: 4px 0 0; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); }
.rank { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--rv-panel); border: 1px solid var(--rv-line); font-size: 13.5px; font-weight: 800; text-align: left; }
.rank li.me { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rank li .no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-surface); color: var(--kb-accent-text); font: 400 14px var(--kb-font-display); }
.rank li .no.ok { color: var(--rv-ok); } .rank li .no.ng { color: var(--rv-bad); }
.rank li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .sc { flex: none; font-size: 12px; color: var(--kb-dim); font-variant-numeric: tabular-nums; }
.big { font-family: var(--kb-font-display); font-size: 34px; line-height: 1.1; color: var(--kb-ink); }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); }

function puzzleCell(i) {

// =====================================================================================
let TR = null, octx = null;
const CPU_NAMES = [L('モカ', 'Mocha'), L('ココ', 'Coco')];
function ensureTR() {
  if (TR || !window.KoboTurnRoom || !window.ReversiOnline) return TR;
  TR = KoboTurnRoom.create({
    game: GAME, host: ReversiOnline.host, turnSec: 45, seats: [2], seatsMax: 2, alternate: true, dealMs: 500,
    cpuNames: k => CPU_NAMES[k % 2],
    getOpts: () => ({ n: 2 }),
    getCpu: () => Math.min(3, save.set.level),
    cpuLabel: lv => LV_NAME[lv],
    onModel, onTick: onlineTick,
    onClose: () => showTitle(),
    onIdleClose: () => { if (S && S.mode === 'online') { S.over = true; } hideOverlays(); showTitle(); },
  });
  return TR;
}
function openOnline() {
  if (!ensureTR()) { sfx('error'); return; }
  if (S && !S.over && S.mode !== 'online') { S.menu = true; persist(); }
  hideOverlays();
  TR.open({ n: 2 });
}
function leaveOnline() {
  if (S && S.mode === 'online' && !S.over) giveUp();
  if (TR) TR.leave();
  if (S) S.menu = true;
  showTitle();
}
async function askLeaveOnline() {
  const ok = UI ? await UI.confirm({ title: T('出ると、あなたの席はCPUに代わります。出ますか？'), ok: T('出る'), cancel: T('やめる'), danger: true }) : true;
  if (ok) leaveOnline(); else if (S) S.menu = false;
}
function onlineAgain() {
  if (!TR || !S) return;
  const m = TR.model();
  if (!m || (m.why && m.why !== 'w')) { leaveOnline(); return; }
  if (TR.rematch()) { $('rAgain').disabled = true; sfx('tap'); onlineResultText(m); }
}
function sendOnline(cell) {
  if (S.sending && Date.now() - S.sending < 2500) return false;
  if (!TR || !TR.submit(ReversiOnline.toWire(cell))) { sfx('error'); return false; }
  S.sending = Date.now(); S.hint = -1;
  setTimeout(() => { if (S && S.mode === 'online' && S.sending && Date.now() - S.sending >= 2400) { S.sending = 0; hud(); markers(); refreshStatus(); } }, 2500);
  hud(); markers();
  return true;
}
function onModel(m) {
  if (!ensureTR()) return;
  if (m.me < 0 || (m.replaced && (!S || S.mode !== 'online'))) {   // not in this game (too late for the start), or the seat was already taken over while this page was away
    if (UI) UI.toast(m.me < 0 ? T('ゲームに入れませんでした') : T('席がCPUに交代しました'), { type: 'danger' });
    TR.leave(); if (S) S.menu = true; showTitle(); return;
  }
  const ctx = m.fresh || !octx ? (octx = ReversiOnline.newCtx()) : octx;
  const v = ReversiOnline.view(m, ctx);
  if (m.fresh || !S || S.mode !== 'online' || S.gn !== m.gn) { startOnline(m, v); return; }
  const prevTurn = S.st.turn;
  S.st = v.st; S.model = m; S.names = m.names; S.sl = m.sl; S.sending = 0; S.myc = v.color; S.hint = -1;
  if (v.last >= 0) { S.last = v.last; S.cur = v.last; }
  const origin = v.placed.length ? v.placed[v.placed.length - 1] : -1;
  const wait = syncBoard(v.st.b, { origin, anim: true });
  if (v.placed.length) sfx(v.flipped.length > 3 ? 'pop' : 'move');
  const pas = v.evs.find(e => e.t === 'pa');
  let note = '';
  if (v.placed.length) note = T('{name}は {m} に置きました（{n}枚）', { name: nameOf(origin >= 0 && v.st.b[origin] ? v.st.b[origin] : prevTurn), m: mName(origin, 8), n: v.flipped.length });
  if (pas) { note += ' ' + T('{name}は置ける場所がないのでパスです', { name: nameOf(pas.s + 1) }); bubble(T('パス')); }
  S.note = note; if (note) announce(note);
  if (m.replaced && !S.over) { S.over = true; if (UI) UI.toast(T('席がCPUに交代しました'), { type: 'danger' }); emit('play_end', { mode: 'versus', score: 0, durationMs: Math.round(S.ms + (Date.now() - S.t0)), reason: 'quit' }); TR.leave(); S.menu = true; showTitle(); return; }
  hud(); markers(); refreshStatus();
  if (m.ph === 'over' && !S.over) { S.busy = true; setTimeout(() => { if (S) { S.busy = false; finishOnline(m); } }, wait); }
}
function startOnline(m, v) {
  stopTimers();
  hideOverlays();
  S = mkSession({ mode: 'online', st: v.st, n: 8, level: m.cpu || 2 });
  S.gn = m.gn; S.model = m; S.names = m.names; S.sl = m.sl; S.myc = v.color; S.sending = 0; S.live = true; S.last = v.last; S.cur = v.last >= 0 ? v.last : firstCur(v.st);
  S.cfg = { mode: 'online' };
  $('rAgain').disabled = false;
  buildBoard(8); syncBoard(v.st.b, {}); hud(); markers();
  emit('play_start', { mode: 'versus' });
  S.note = T('こんどは あなたが{c}です', { c: v.color === 1 ? T('くろ（先手）') : T('しろ（後手）') });
  refreshStatus(); announce(S.note);
  if (m.ph === 'over') { S.over = false; finishOnline(m); }
}
function onlineTick(m) {
  if (!S || S.mode !== 'online' || !m) return;
  const sec = Math.ceil(Math.max(0, m.dl ? m.left : 0) / 1000);
  if (!S.over) { if (S.tsec !== sec) { S.tsec = sec; hud(); } }
  else if (!$('ovResult').hidden) onlineResultText(m);
}
function onlineResultText(m) {
  if (!m || (m.rs && m.rs.y !== 'w')) return;
  const sl = String(m.sl || ''), pu = m.pu || [];
  let total = 0; for (let k = 0; k < sl.length; k++) if (pu[k] >= 0 && sl[k] !== 'x') total++;
  const wished = Math.min(total, Object.keys(m.rm || {}).length);
  if ($('rAgain').disabled) $('rNote').textContent = T('もう一度を待っています（{a}/{b}人）', { a: wished, b: Math.max(1, total) });
  else $('rAgain').textContent = wished ? T('もう一度（{a}/{b}人）', { a: wished, b: Math.max(1, total) }) : T('もう一度');
}
function finishOnline(m) {
  if (!S || S.over) return;
  S.over = true; stopTimers();
  const rs = m.rs || { r: [], w: -1, y: 'w' }, ranks = ReversiOnline.arr(rs.r), me = m.me >= 0 ? m.me : 0;
  const ok = rs.y === 'w', draw = ok && rs.w < 0, win = ok && ranks[me] === 1 && !draw;
  if (ok) { bump('onl'); if (win) bump('onw'); writeSave(); }
  emit('play_end', { mode: 'versus', score: 0, durationMs: Math.round(S.ms + (Date.now() - S.t0)), reason: win ? 'clear' : 'over' });
  if (win) { sfx('win'); burst(); } else sfx(draw ? 'ok' : 'over');
  hud(); markers();
  setTimeout(() => showOnlineResult(m, rs, win, draw), Math.round(700 * SPD.v));
}
function showOnlineResult(m, rs, win, draw) {
  if (!S || S.mode !== 'online' || !S.over) return;
  const r = E.result(S.st), ok = rs.y === 'w';
  $('rTitle').textContent = !ok ? T('オンライン対戦が終わりました') : draw ? T('引き分け') : win ? T('勝ちました！') : T('負けました');
  $('rSub').textContent = T('{b} 対 {w}', { b: r.b, w: r.w }) + ' · ' + T('オンライン');
  fillScores($('rRank'), r);
  $('rBig').textContent = ''; $('rNew').hidden = true;
  $('rNote').textContent = rs.y === 'hl' ? T('ホストが退出したので、ここで終了です') : rs.y === 'hg' ? T('ホストとの接続が切れたので、ここで終了です') : T('オンライン対戦は★に数えません');
  $('rAgain').disabled = !ok || !!m.replaced; $('rAgain').textContent = T('もう一度'); $('rMoves').hidden = false;
  hideOverlays(); $('ovResult').hidden = false;
  try { $('rAgain').disabled ? $('rTitleBtn').focus({ preventScroll: true }) : $('rAgain').focus({ preventScroll: true }); } catch (e) {}
}

// ---------- boot ----------
renderSound(); themeColor();
KG() && KG().register({
  id: GAME,
  pause() {}, resume() {},
  save() { persist(); },
  isIdle: () => !S || S.over,
  dispose() { if (S) clearTimeout(S.timer); },
  daily: { start({ dateKey }) { startPuzzle(dateKey); } },
});
window.addEventListener('pagehide', () => { if (S) persist(); });
window.addEventListener('storage', e => { if (e.key === SAVE_KEY && (!S || S.over)) { save = readSave(); if (!$('ovTitle').hidden) renderTitle(); } });
{
  buildBoard(save.set.n);
  const launch = PF ? PF.launch() : { daily: null };
  $('iGame').textContent = T('リバーシ工房'); $('iTurn').hidden = true; $('iBest').textContent = '★ ' + fmtN(save.pts); $('status').textContent = ''; $('ctl').style.visibility = 'hidden';
  const st0 = E.create({ n: save.set.n, start: save.set.start }); syncBoard(st0.b, {});
  const first = store.get(HOWTO_KEY) == null && !save.tut;
  if (launch.daily && PF && !first) { /* KoboGame.register starts the daily puzzle */ }
  else if (first) { save.tut = 1; writeSave(); showHowto(true); } else showTitle();
}

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const sel = i => '.cell[data-i="' + i + '"]';
  const api = {
    ready: () => true,
    state: () => {
      const st = S && S.st, c = st ? E.counts(st) : { b: 0, w: 0, e: 0 };
      return {
        started: !!S, mode: S ? S.mode : '', over: !!(S && (S.over || (st && st.over))), n: S ? S.n : 0, level: S ? S.level : 0, me: S ? (S.mode === 'online' ? S.myc : S.me) : 0,
        turn: st ? st.turn : 0, human: !!(S && canAct()), busy: !!(S && S.busy), black: c.b, white: c.w, empty: c.e, legal: st && !st.over ? E.legal(st) : [], moves: st ? st.moves.filter(m => m[0] >= 0).length : 0,
        hinted: S ? S.hinted : 0, undone: S ? S.undone : 0, hint: S ? S.hint : -1, sel: S ? S.sel : -1, last: S ? S.last : -1, corners: S ? S.corners : 0, passed: S ? S.passed : 0,
        title: !$('ovTitle').hidden, result: !$('ovResult').hidden, howto: !$('howto').hidden, movesOv: !$('ovMoves').hidden, menu: !!(S && S.menu),
        status: $('status').textContent, pts: save.pts, save: JSON.parse(JSON.stringify(save)), board: st ? st.b.slice() : [],
        net: !!(S && S.mode === 'online'), sl: S && S.sl ? S.sl : '', names: S && S.names ? S.names.slice() : [],
        pz: S && S.pz ? { i: S.pz.i, done: !!S.pz.done, ok: !!S.pz.ok, res: S.pz.res.map(x => x.slice()), best: S.pz.best, sel: S.sel, practice: !!S.pz.practice } : null,
        discs: B.discs.filter(Boolean).length, dots: B.cells.filter(c => c.classList.contains('lg')).length,
      };
    },
  };
  window.__kb = Object.assign(window.__kb || {}, api);
  window.__reversi = {
    api, E, get S() { return S; }, get save() { return save; }, get tr() { return ensureTR(); }, openOnline, leaveOnline, ensureTR, BANK,
    onlineState() {
      const m = TR ? TR.model() : null, tr = TR ? TR._S : null;
      return { phase: TR ? TR.phase : 'off', host: TR ? TR.isHost : false, code: tr ? tr.code : null, rid: tr ? tr.rid : null, uid: TR ? TR.uid : null, err: tr ? tr.err : null,
        model: m ? { gn: m.gn, v: m.v, ph: m.ph, me: m.me, n: m.n, tn: m.tn, sl: m.sl, names: m.names, why: m.why, left: m.left, pd: m.pd, rs: m.rs } : null, lobby: !!document.querySelector('.ktr-ov:not([hidden])') };
    },
    start(o) { startGame(o || {}); return api.state(); },
    puzzle(dk, practice) { startPuzzle(dk, practice); return api.state(); },
    setSpeed(m) { SPD.v = m; },
    // where to click: the cell of a good move for the human (level 4's choice). In a puzzle, plan(true) = the best move, plan(false) = a wrong one
    plan(good) {
      if (!S) return null;
      if (S.mode === 'puzzle') { if (S.pz.done) return null; const p = S.pz.p, top = Math.max(...p.m.map(x => x[1])); const c = good === false ? p.m.find(x => x[1] < top)[0] : p.m.find(x => x[1] === top)[0]; return { cell: c, sel: sel(c) }; }
      if (!canAct()) return null;
      const lg = E.legal(S.st); if (!lg.length) return null;
      const c = good === 'cpu' ? E.cpu(S.st, 2) : lg[0]; return { cell: c, sel: sel(c) };
    },
    cellPoint(i) { const r = B.cells[i].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
    title: showTitle, finish() { if (S && !S.over) { S.st.over = true; finish(); } }, howto: showHowto, openMenu, relayout: fit,
    resume() { const r = readRun(); if (r) resumeGame(r); return !!r; }, persist,
    // set up a position (for tests): rows of '.', 'x' (black), 'o' (white); turn 1|2. In a game against the CPU / two players
    rig(rows, turn) {
      if (!S || !S.st) return null;
      const n = S.st.n; const b = []; for (const row of rows) for (const ch of row) b.push(ch === 'x' ? 1 : ch === 'o' ? 2 : 0);
      S.st.b = b; S.st.turn = turn || S.st.turn; S.st.moves = S.st.moves.length ? S.st.moves : []; S.st.over = false;
      if (!E.legal(S.st).length && !E.legalFor(S.st, 3 - S.st.turn).length) S.st.over = true;
      syncBoard(b, {}); hud(); markers(); refreshStatus(); loop(); return api.state(); void n;
    },
    thumbScene() { // a game in progress with the human to move, for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); hideOverlays();
      const st = E.create({ n: 8, seed: 7 });
      while (st.moves.length < 22 && !st.over) E.play(st, E.cpu(st, st.moves.length % 2 ? 3 : 2));
      S = mkSession({ mode: 'cpu', st, n: 8, level: 3, me: st.turn, seed: 7 });
      S.cfg = { mode: 'cpu', level: 3, me: 'b', n: 8, start: 'std' }; S.cur = firstCur(st);
      const lm = st.moves.filter(m => m[0] >= 0).slice(-1)[0]; S.last = lm ? lm[0] : -1;
      buildBoard(8); fit(); syncBoard(st.b, {}); hud(); markers(); return true;
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
