// ---------- save ----------
function defSave() {

})();
const packPuz = p => ({ g: p.givens.join(''), s: p.solution.join('') });
const unpackPuz = (spec, pk) => ({ size: spec.size, variant: spec.variant, level: spec.level, seed: spec.seed, givens: Array.from(pk.g, Number), solution: Array.from(pk.s, Number), code: E.encodeCode(spec) });

  return E.conflictCells(geo, s).length === 0;
}

// ---------- state ----------
let run = null;           // { mode, spec, dk, puz, g, ms, over, hr, startedAt, fresh }
let geo = E.geometry(9, 'n');
let sel = -1, armed = null, notesMode = false;
let menuOpen = false, paused = false, lastT = now(), tick = 0, genToken = 0;
let hint = null;          // { step, stage, cand }
let lastResult = null;
let cells = [], cellCache = [];
const VS = window.KoboVersus || null;
const playing = () => !!(run && !run.over && (run.mode !== 'vs' || (VS && VS.canPlay())));
const anyOverlay = () => ['ovTitle', 'ovLoading', 'ovResult', 'ovCode', 'ovSet', 'ovStats', 'howto'].some(id => !$(id).hidden);
const OVERLAYS = ['ovTitle', 'ovLoading', 'ovResult', 'ovCode', 'ovSet', 'ovStats', 'howto'];
function hideOverlays() { OVERLAYS.forEach(id => { $(id).hidden = true; }); }
const ticking = () => playing() && !paused && !menuOpen && !anyOverlay() && !document.hidden;

// ---------- board DOM ----------
const board = $('board');
function buildBoard() {
  board.innerHTML = ''; cells = []; cellCache = [];

function cellName(i) { return T('{r}行{c}列', { r: Math.floor(i / geo.N) + 1, c: (i % geo.N) + 1 }); }
function houseName(u) {
  const U = geo.units[u];
  if (U.type === 'row') return T('{n}行目', { n: U.index + 1 });
  if (U.type === 'col') return T('{n}列目', { n: U.index + 1 });

}

// ---------- winning ----------
function win() {
  if (!playing()) return;
  const g = run.g, r = run, sp = r.spec, ms = Math.round(r.ms);
  r.over = true; hint = null; closeHintBox(); clearRun();
  const clean = r.hr === 0, flawless = clean && g.mistakes === 0;
  const bid = boardId(sp.size, sp.variant), key = bid + '-' + sp.level;
  const rec = save.st[key] = Object.assign({ n: 0, b: 0, c: 0 }, save.st[key]);
  const prevBest = rec.b | 0;
  rec.n++; if (clean) rec.c++;
  const newBest = clean ? (prevBest === 0 || ms < prevBest) : false;
  if (clean && newBest) rec.b = ms;
  const S = save.stats;
  S.solved++; if (clean) S.clean++; if (flawless) S.flawless++;
  if (sp.size === 9 && sp.level >= 1) S['l' + sp.level] = (S['l' + sp.level] | 0) + 1;
  if (sp.size < 9) S.kids++; if (sp.variant === 'x') S.xs++;
  if (clean && sp.size === 9 && sp.level >= 2 && ms <= 180000) S.fast++;
  if (clean && g.usedNotes === 0 && sp.size === 9 && sp.level >= 3) S.nonotes++;
  let pts = 0;
  if (clean && sp.size === 9) { pts = sp.level; save.pts += pts; }
  let dailyNote = null, dailyBest = false, streak = 0;
  if (r.mode === 'daily' && r.dk) {
    const dk = r.dk, d = save.daily, prev = d.days[dk] | 0;
    if (!prev) { S.daily++; }
    if (!prev || ms < prev) { d.days[dk] = ms; dailyBest = true; }
    if (dk === todayKey()) {
      if (d.last !== dk) { d.streak = d.last === E.addDays(dk, -1) ? (d.streak | 0) + 1 : 1; d.last = dk; }
      d.max = Math.max(d.max | 0, d.streak | 0);
    }
    const keep = E.addDays(todayKey(), -60); Object.keys(d.days).forEach(k => { if (+k < keep) delete d.days[k]; });
    streak = d.streak | 0; dailyNote = d;
  }
  writeSave();
  const dailyScore = Math.max(1, 3600 - Math.round(ms / 1000));
  emit('play_end', { mode: r.mode === 'daily' ? 'daily' : 'normal', dateKey: r.mode === 'daily' ? r.dk : undefined, score: r.mode === 'daily' ? dailyScore : pts, durationMs: ms, reason: 'clear',
    stats: { level: sp.level, size: sp.size, hints: r.hr, mistakes: g.mistakes, clean: clean ? 1 : 0 } });
  if (newBest) emit('best', { score: Math.max(1, 3600 - Math.round(ms / 1000)) });
  emit('progress', { key: 'pts', value: save.pts });
  const hardest = sp.size === 9 ? sp.level : 0;
  lastResult = { mode: r.mode, spec: sp, ms, mistakes: g.mistakes, hints: r.hr, clean, flawless, newBest, pts, streak, dk: r.dk, dailyBest };
  board.classList.add('win'); Array.from(cells).forEach((c, i) => c.style.setProperty('--d', String((i % geo.N) + Math.floor(i / geo.N)))); setTimeout(() => board.classList.remove('win'), 1600);
  snd.win();
  showResult(r, lastResult, hardest);
  render();
}

// ---------- online battle (common/versus.js) ----------
// Everyone gets the same 9x9 (Easy) from the match seed: E.generate({ size: 9, level: 2, seed }) never touches Math.random, so the same seed gives
// the same puzzle. Score: 10 per correct cell, -15 per mistake (never below 0); finishing the grid scores 5000 + the time left in tenths of a
// second, so a finisher always beats a non-finisher and an earlier finish beats a later one. No hints. Nothing is saved and no best is updated
// during a battle (versus.js rule); the solo puzzle is set aside untouched and comes back on exit through the pause menu.
const VS_LEVEL = 2, VS_SEC = 420, VS_CELL = 10, VS_WRONG = 15, VS_DONE = 5000;
let vs = null;   // { snap: { run, ov, sel, armed, notes }, playing: 'versus' | 'practice' | null, practice } while a battle owns the board
function vsScore() {
  if (!run || run.mode !== 'vs') return 0;
  if (run.vsDone) return run.vsDone;
  const g = run.g; let ok = 0;
  for (let c = 0; c < geo.NN; c++) if (!g.given[c] && g.vals[c] === g.sol[c]) ok++;
  return Math.max(0, ok * VS_CELL - g.mistakes * VS_WRONG);
}
function vsSolved() {
  if (!run || run.mode !== 'vs' || run.vsDone) return;
  run.vsDone = VS_DONE + Math.max(0, Math.round((VS_SEC * 1000 - run.ms) / 100));
  run.over = true; hint = null; closeHintBox();
  if (VS) VS.reportScore(run.vsDone);
  snd.win(); toast(T('完成！ {n}点', { n: run.vsDone }));
  render();
}
function vsEnd(reason) {
  if (!vs || !vs.playing) return;
  emit('play_end', { mode: vs.playing, score: vsScore(), durationMs: run ? Math.round(run.ms) : 0, reason, stats: { solved: run && run.vsDone ? 1 : 0 } });
  vs.playing = null;
}

    theme: { accent: 'var(--kb-accent-text)', accentBg: 'var(--sd-go)', accentInk: '#04201b', accentShadow: 'var(--sd-go-shadow)', card: 'var(--sd-card)',

        vs = { snap: { run, ov: OVERLAYS.filter(id => !$(id).hidden), sel, armed, notes: notesMode, geo, solo, idle: !!(run && run.idle) }, playing: null, practice: !!practice };
      } else vsEnd('quit');

  resume(reason) { if (reason === 'menu') { lastT = now(); return; } if (!paused) return; paused = false; if (playing() && !anyOverlay() && !menuOpen) openMenu(); lastT = now(); if (run) render(); },

  isIdle: () => !playing() && !vs,
  dispose() { cancelAnimationFrame(tick); },
  daily: { start({ dateKey }) { startDaily(dateKey); } },
});
window.addEventListener('pagehide', () => persist(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); lastT = now(); });
window.addEventListener('storage', e => { if (e.key === SAVE_KEY) { save = readSave(); if (!$('ovTitle').hidden) renderTitle(); } });
function themeColor() { const m = document.querySelector('meta[name="theme-color"]'); if (!m) return; const light = UI && UI.theme ? UI.theme.resolved() === 'light' : false; m.setAttribute('content', light ? '#f1eee4' : '#0f1a2b'); }
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(() => themeColor(), 0));
if (AU) AU.onChange(() => syncSettings());

// ---------- boot ----------
let booted = false;
themeColor(); buildBoard();
// an empty 9x9 behind the title
run = { mode: 'normal', spec: { size: 9, variant: 'n', level: 1, seed: 0 }, dk: null, puz: { size: 9, variant: 'n', level: 1, seed: 0, givens: new Array(81).fill(0), solution: new Array(81).fill(1), code: '' }, pk: null, g: null, ms: 0, over: true, hr: 0, idle: true };
run.g = new E.Game(run.puz); renderChips();
const launch = PF ? PF.launch() : { daily: null, code: null };
const firstVisit = store.get(HOWTO_KEY) == null && !save.tut && !readRun();
(async () => {
  if (launch.daily && PF) {
    const def = window.KoboGame && KoboGame.info && KoboGame.info().def;
    if (!(def && def.flags && def.flags.daily)) startDaily(launch.daily);
  } else if (launch.code && E.decodeCode(launch.code)) {
    startSpec(E.decodeCode(launch.code), 'code');
  } else if (firstVisit) showHowto(true);
  else showTitle();
})();
render(); lastT = now(); tick = requestAnimationFrame(loop);
booted = true;
// pre-make today's puzzle in the background while the title is up (cached for the day)
setTimeout(() => { try { const dk = todayKey(), sp = E.dailySpec(dk); if (!cachedDaily(dk, sp)) Gen.make(sp).then(p => { if (p) cacheDaily(dk, p); }); } catch (e) {} }, 1200);

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const pt = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const api = {
    ready: () => booted,
    state: () => ({
      mode: run && run.mode === 'vs' && !run.idle ? 'vs' : (run && playing() ? run.mode : 'title'), size: run ? run.spec.size : 0, variant: run ? run.spec.variant : '', level: run ? run.spec.level : 0, seed: run ? run.spec.seed : 0, code: run ? E.encodeCode(run.spec) : '',
      dk: run ? run.dk : null, ms: run ? Math.round(run.ms) : 0, over: !!(run && run.over), playing: playing(),
      vals: run && run.g ? Array.from(run.g.vals).join('') : '', givens: run && run.g ? Array.from(run.g.given).join('') : '', solution: run && run.g ? Array.from(run.g.sol).join('') : '',
      notes: run && run.g ? Array.from(run.g.notes) : [], sel, armed, notesMode, auto: !!(run && run.g && run.g.auto), mistakes: run && run.g ? run.g.mistakes : 0, hints: run && run.g ? run.g.hints : 0, hr: run ? run.hr : 0,
      hint: hint ? { tech: hint.step.tech, stage: hint.stage, cells: hint.step.cells, place: hint.step.place, elims: hint.step.elims } : null,
      undo: run && run.g ? run.g.undoStack.length : 0, redo: run && run.g ? run.g.redoStack.length : 0, menuOpen, paused,
      vs: vs ? { playing: vs.playing, practice: vs.practice, solo: vs.snap.solo } : null, vsScore: run && run.mode === 'vs' ? vsScore() : null, vsDone: run && run.vsDone ? run.vsDone : 0, title: !$('ovTitle').hidden, result: !$('ovResult').hidden, howto: !$('howto').hidden, loading: !$('ovLoading').hidden, code2: !$('ovCode').hidden, settings: !$('ovSet').hidden, stats: !$('ovStats').hidden,
      save: JSON.parse(JSON.stringify(save)), last: lastResult, cfg: JSON.parse(JSON.stringify(cfg())), clues: run && run.puz ? run.puz.givens.filter(Boolean).length : 0, 
    }),
    cellPoint: i => pt(cells[i]), padPoint: d => pt($('pk' + d)),
    advance(ms) { if (run) { run.ms += ms; $('timeTxt').textContent = fmtT(run.ms); } },
    solveNow(leave) { if (!playing()) return false; const g = run.g; for (let c = 0; c < geo.NN; c++) if (!g.given[c] && c !== leave) g.put(c, g.sol[c]); afterChange([], 'put'); return true; },
    fillCorrect(n) { const g = run.g; let k = 0; for (let c = 0; c < geo.NN && k < n; c++) if (!g.vals[c]) { g.put(c, g.sol[c]); k++; } afterChange([], 'put'); return k; },
    empties: () => { const g = run.g, o = []; for (let c = 0; c < geo.NN; c++) if (!g.vals[c]) o.push(c); return o; },
  };
  window.__kb = Object.assign(window.__kb || {}, { ready: api.ready, state: api.state });
  window.__sudoku = {
    api, E, get run() { return run; }, get save() { return save; }, geo: () => geo,
    start: (spec, mode) => { clearRun(); return startSpec(spec, mode || 'normal'); },
    daily: dk => { clearRun(); return startDaily(dk); },
    setSave(o) { save = Object.assign(defSave(), o); writeSave(); return save; },
    persist: () => persist(true), readRun, title: showTitle, howto: () => showHowto(false), menu: openMenu, settings: openSettings, stats: showStats,
    // a mid-solve Medium board (about 40% of the empty cells filled, one selected, a few notes) for the hub thumbnail
    thumbScene() {
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb');
      return startSpec({ size: 9, variant: 'n', level: 3, seed: 20261125 }, 'normal').then(() => {
        const g = run.g; let k = 0;
        for (let c = 0; c < geo.NN; c++) if (!g.given[c]) { if (k % 5 < 2) g.put(c, g.sol[c]); else if (k % 5 === 2) { g.toggleNote(c, g.sol[c]); g.toggleNote(c, (g.sol[c] % 9) + 1); } k++; }
        sel = g.vals.findIndex(v => v === 0); persist(false); clearRun(); hideOverlays(); render(); return true;
      });
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
