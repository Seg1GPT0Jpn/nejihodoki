<style>
/* ハブ v2：ヘッダー（ロゴ・検索・プロフィール・設定）→ 今日のおすすめ → 続きから → 今日のチャレンジ → お気に入り → 人気 → 新着
   → ランキング → すべてのゲーム（ジャンル） → アカウント → フッター。色はすべて theme.css のトークン（ライト / ダーク） */
[hidden] { display: none !important; }
html { background: var(--kb-bg); height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; box-sizing: border-box; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden; padding-top: var(--kb-sat); padding-bottom: var(--kb-sab);
}
*, *::before, *::after { box-sizing: border-box; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 12px max(16px, var(--kb-sar)) 28px max(16px, var(--kb-sal)); display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }

/* header */
.top { display: flex; flex-direction: column; gap: 10px; }
.hrow { display: flex; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; }
.logo img { width: 44px; height: 44px; border-radius: 12px; flex: none; }
.logo div { min-width: 0; }
h1 { margin: 0; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(18px, 5.6vw, 26px); letter-spacing: .04em; line-height: 1.15; overflow-wrap: anywhere; }
h1 span { color: var(--kb-accent-text); }
.sub { margin: 3px 0 0; font-size: 11.5px; color: var(--kb-dim); line-height: 1.45; }
.hbtn { flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 48px; min-height: 48px; max-width: 76px; padding: 3px 5px;
  border: 1px solid var(--kb-line); border-radius: 14px; background: var(--kb-surface); color: var(--kb-ink); font: 800 10.5px var(--kb-font-body); cursor: pointer; text-decoration: none; }
.hbtn svg { width: 22px; height: 22px; color: var(--kb-accent-text); flex: none; }
.hbtn .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbtn .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; line-height: 1; }
.hbtn:active { transform: scale(.96); }
/* notices row (P3-6): one line under the search; the dot means unread */
.newsrow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--kb-line); border-radius: 12px; background: var(--kb-surface); color: var(--kb-ink); font: 500 13px var(--kb-font-body); cursor: pointer; text-align: left; }
.newsrow svg { width: 20px; height: 20px; flex: none; color: var(--kb-accent-text); }
.newsrow b { flex: none; font-weight: 800; }
.newsrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--kb-dim); }
.newsrow .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--kb-danger); }
.newsrow.unread { border-color: var(--kb-accent); }
.newsrow .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; flex: none; }
/* notices (P3-6) */
.news { display: flex; flex-direction: column; gap: 12px; }
.news article { border: 1px solid var(--kb-line); border-radius: 14px; padding: 10px 12px; background: var(--kb-surface); }
.news article.unread { border-color: var(--kb-accent); }
.news h3 { margin: 0; font-size: 15px; line-height: 1.4; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.news time { display: block; font-size: 11px; color: var(--kb-dim); margin-top: 2px; }
.news p { margin: 6px 0 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.news a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 800; color: var(--kb-accent-text); }
.news .new { font-size: 10px; font-weight: 800; color: var(--kb-accent-ink); background: var(--kb-accent); border-radius: 999px; padding: 1px 7px; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 12px; width: 20px; height: 20px; color: var(--kb-dim); pointer-events: none; }
.search input { width: 100%; min-height: 46px; border: 1px solid var(--kb-line); border-radius: 999px; background: var(--kb-surface); color: var(--kb-ink); font: 800 15px var(--kb-font-body); padding: 0 48px 0 40px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--kb-dim); font-weight: 500; }
.search input::-webkit-search-cancel-button { display: none; }
.search button { position: absolute; right: 1px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--kb-dim); font-size: 20px; cursor: pointer; }
.found { margin: -4px 0 0; font-size: 12px; color: var(--kb-dim); }
body.searching .home-sec { display: none !important; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-h h2 { margin: 0; font-family: var(--kb-font-display); font-weight: 400; font-size: 18px; letter-spacing: .04em; }
.sec-h a { font-size: 12.5px; font-weight: 800; color: var(--kb-accent-text); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.sec-note { margin: -4px 0 0; font-size: 11.5px; color: var(--kb-dim); line-height: 1.55; }
.thumb { position: relative; display: block; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: var(--kb-surface-2); }
.thumb img, .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr; border-radius: 20px; overflow: hidden; background: var(--kb-surface); border: 1px solid var(--kb-line); box-shadow: var(--kb-shadow); }
.hero .thumb { aspect-ratio: 16 / 9; }
.hero .thumb img { object-position: center 65%; }
.hero .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero .kicker { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--kb-accent-text); }
.hero h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .02em; }
.hero p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--kb-dim); }
.hero .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .acts .kb-btn { flex: 1 1 130px; }
@media (min-width: 720px) { .hero { grid-template-columns: 1.25fr 1fr; } .hero .thumb { aspect-ratio: auto; min-height: 240px; height: 100%; } .hero .body { justify-content: center; padding: 20px 22px; } }

/* horizontal rails (continue, popular, new, favorites) */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 46%); gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: thin; }
@media (min-width: 720px) { .rail { grid-auto-columns: minmax(180px, 23%); } }
.tile { scroll-snap-align: start; display: flex; flex-direction: column; text-decoration: none; background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 14px; overflow: hidden; min-width: 0; }
.tile:hover { border-color: var(--kb-accent); }
.tile .tb { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile small { font-size: 11px; color: var(--kb-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile .rank { position: absolute; left: 6px; top: 6px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font: 800 13px var(--kb-font-body); z-index: 1; }

/* daily */
.dlist { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 720px) { .dlist { grid-template-columns: 1fr 1fr; } }
.drow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-decoration: none; background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 14px; padding: 8px 10px 8px 8px; min-height: 64px; }
.drow:hover { border-color: var(--kb-accent); }
.drow .ic { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; }
.drow .ic svg, .drow .ic img { width: 100%; height: 100%; display: block; }
.drow b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow small { display: block; font-size: 11.5px; color: var(--kb-dim); }
.drow.done small { color: var(--kb-ok); font-weight: 800; }
.drow .go { flex: none; min-height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font: 800 13px var(--kb-font-body); white-space: nowrap; }
.drow.done .go { background: transparent; color: var(--kb-ink); border: 1px solid var(--kb-line); }

/* ranking */
.rank-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--kb-ink); background: linear-gradient(90deg, var(--kb-accent-soft), var(--kb-surface)); border: 1px solid var(--kb-accent); border-radius: 16px; padding: 12px 16px; font-weight: 800; font-size: 16px; min-height: 60px; }
.rank-link small { display: block; font-weight: 500; font-size: 12px; color: var(--kb-dim); margin-top: 2px; }
.rank-link svg { width: 30px; height: 30px; color: var(--kb-accent-text); flex: none; }
.rboards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.rboard { background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.rboard h3 { margin: 0 0 6px; font-size: 13.5px; }
.rboard ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.rboard li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px; font-size: 13px; align-items: baseline; }
.rboard li .r { font-family: var(--kb-font-display); color: var(--kb-dim); }
.rboard li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
.rboard li .s { font-variant-numeric: tabular-nums; }
.rboard li.mine .n { color: var(--kb-accent-text); }

/* all games */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; overscroll-behavior-x: contain; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 44px; border: 1px solid var(--kb-line); background: var(--kb-surface); color: var(--kb-ink); border-radius: 999px; padding: 0 14px; font: 800 13px var(--kb-font-body); cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--kb-accent); color: var(--kb-accent-ink); border-color: var(--kb-accent); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap: 10px; }
@media (min-width: 600px) { .games { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; } }
.card { position: relative; min-width: 0; }
.game { display: flex; flex-direction: column; height: 100%; text-decoration: none; color: inherit; background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 16px; overflow: hidden; transition: transform var(--kb-dur-fast), border-color var(--kb-dur-fast); }
.game:hover { border-color: var(--kb-accent); }
.game:active { transform: scale(.985); }
.game .gb { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.game h3 { margin: 0; font-size: 14.5px; font-weight: 800; letter-spacing: .02em; line-height: 1.3; overflow-wrap: anywhere; }
.game .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-block; font-size: 10px; letter-spacing: .04em; border: 1px solid var(--kb-line); border-radius: 999px; padding: 1px 7px; color: var(--kb-dim); font-weight: 800; white-space: nowrap; }
.tag.new { border-color: var(--kb-accent); color: var(--kb-accent-text); }
.game p { margin: 0; font-size: 12px; line-height: 1.55; color: var(--kb-dim); display: none; }
@media (min-width: 600px) { .game h3 { font-size: 16px; } .game p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } }
.game .rec { margin-top: auto; padding-top: 2px; font-size: 11.5px; color: var(--kb-accent-text); font-weight: 800; font-variant-numeric: tabular-nums; min-height: 1.3em; overflow-wrap: anywhere; }
.fav { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; z-index: 1; }
.fav span { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: rgba(10, 16, 22, .55); color: #fff; font-size: 18px; line-height: 1; }
.fav[aria-pressed="true"] span { background: var(--kb-accent); color: var(--kb-accent-ink); }
.empty { text-align: center; color: var(--kb-dim); font-size: 13px; line-height: 1.7; padding: 20px 8px; border: 1px dashed var(--kb-line); border-radius: 16px; }

/* account + install */
.acct { display: flex; flex-direction: column; gap: 8px; background: var(--kb-surface); border: 1px solid var(--kb-line); border-radius: 16px; padding: 10px 14px; }
.acct .kc-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.acct .kc-nick { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--kb-line); padding-top: 8px; }
.acct label { font-size: 11px; letter-spacing: .06em; color: var(--kb-dim); font-weight: 800; }
.acct input { flex: 1; min-width: 0; min-height: 44px; background: var(--kb-bg); color: var(--kb-ink); border: 1px solid var(--kb-line); border-radius: 10px; padding: 8px 10px; font: 800 15px var(--kb-font-body); }
.acct .kc-note { margin: 0; font-size: 11.5px; color: var(--kb-accent-text); min-height: 1em; }
.acct .kc-msg { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--kb-dim); flex: 1 1 180px; min-width: 0; }
.acct button { border: 0; border-radius: 12px; min-height: 44px; padding: 0 14px; font: 800 13px var(--kb-font-body); cursor: pointer; background: var(--kb-accent); color: var(--kb-accent-ink); flex: none; }
.acct .kc-out { background: transparent; color: var(--kb-ink); border: 1px solid var(--kb-line); }
.install { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--kb-line); border-radius: 16px; padding: 12px 14px; }
.install p, .vsnote { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--kb-dim); min-width: 0; }
.install p { flex: 1 1 200px; }
.acct-grid { display: grid; gap: 10px; }
@media (min-width: 720px) { .acct-grid { grid-template-columns: 1fr 1fr; align-items: start; } }

footer { border-top: 1px solid var(--kb-line); padding-top: 14px; font-size: 11.5px; color: var(--kb-dim); text-align: center; line-height: 1.7; display: flex; flex-direction: column; gap: 6px; align-items: center; }
footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
footer nav a { color: var(--kb-ink); font-weight: 800; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; }
footer nav a:hover { color: var(--kb-accent-text); }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="hrow">
      <a class="logo" href="./"><img src="icon-192.png" alt="" width="44" height="44"><div>

        <p class="sub" data-i18n>広告なし・課金なし。ネットで話題のあの遊び方を、自前で作りました。</p></div></a>
      <a class="hbtn" id="profBtn" href="profile/" aria-label="プロフィールとログイン" data-i18n-attr="aria-label"><span class="av" id="profAv" aria-hidden="true"></span><span class="nm" id="profName"></span></a>
      <button class="hbtn" id="setBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n>設定</span></button>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="ゲームを探す" placeholder="ゲームの名前やジャンルで探す" data-i18n-attr="aria-label,placeholder">
      <button id="qClear" type="button" hidden aria-label="検索をやめる" data-i18n-attr="aria-label">×</button>
    </div>
    <p class="found" id="found" role="status" aria-live="polite" hidden></p>
    <button class="newsrow home-sec" id="newsBtn" type="button" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><b data-i18n>お知らせ</b><span id="newsTitle"></span><i class="dot" id="newsDot" hidden></i><span class="sr" id="newsSr"></span></button>
  </header>

  <section class="sec home-sec" id="secHero" aria-labelledby="heroKick" hidden></section>
  <section class="sec home-sec" id="secCont" aria-labelledby="hCont" hidden><div class="sec-h"><h2 id="hCont" data-i18n>続きから</h2></div><div class="rail" id="railCont"></div></section>
  <section class="sec home-sec" id="secDaily" aria-labelledby="hDaily" hidden><div class="sec-h"><h2 id="hDaily" data-i18n>今日のチャレンジ</h2></div><p class="sec-note" id="dailyNote"></p><div class="dlist" id="dailyList"></div></section>
  <section class="sec home-sec" id="secFav" aria-labelledby="hFav" hidden><div class="sec-h"><h2 id="hFav" data-i18n>お気に入り</h2></div><div class="rail" id="railFav"></div></section>
  <section class="sec home-sec" id="secPop" aria-labelledby="hPop" hidden><div class="sec-h"><h2 id="hPop" data-i18n>人気</h2></div><p class="sec-note" id="popNote"></p><div class="rail" id="railPop"></div></section>
  <section class="sec home-sec" id="secNew" aria-labelledby="hNew" hidden><div class="sec-h"><h2 id="hNew" data-i18n>新着</h2></div><div class="rail" id="railNew"></div></section>
  <section class="sec home-sec" id="secRank" aria-labelledby="hRank">
    <div class="sec-h"><h2 id="hRank" data-i18n>ランキング</h2></div>
    <a class="rank-link" href="ranking/"><span><span data-i18n>ランキング</span><small data-i18n>ゲームごとの順位（通算・週間・日間）と総合</small></span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/></svg></a>
    <div class="rboards" id="rboards" hidden></div>
  </section>

  <section class="sec" id="secAll" aria-labelledby="hAll">
    <div class="sec-h"><h2 id="hAll" data-i18n>すべてのゲーム</h2></div>
    <div class="chips" id="chips" role="group" aria-label="ジャンルで絞り込む" data-i18n-attr="aria-label"></div>
    <nav class="games" id="games" aria-label="すべてのゲーム" data-i18n-attr="aria-label"></nav>
    <div class="empty" id="gamesEmpty" hidden></div>
  </section>

  <section class="sec home-sec" id="secAcct" aria-labelledby="hAcct">
    <div class="sec-h"><h2 id="hAcct" data-i18n>アカウント</h2></div>
    <div class="acct-grid">
      <div class="acct" id="acct" hidden></div>
      <div class="install" id="installBox" hidden>
        <p id="installMsg"></p>
        <button class="kb-btn kb-btn--primary" id="installBtn" type="button" hidden data-i18n>ホーム画面に追加</button>
      </div>
    </div>
    <p class="vsnote" data-i18n>多くのゲームで、ほかの人とオンライン対戦ができます（各ゲームの「対戦」ボタン）。</p>
  </section>

  <footer>
    <p style="margin:0" data-i18n>記録はこの端末のブラウザに保存されます。Googleでログインすると、全ゲームの記録をクラウドに保存して、どの端末でも続きから遊べます。</p>
    <nav aria-label="ひまつぶし工房" data-i18n-attr="aria-label">
      <a href="about/" data-i18n>利用規約・プライバシー</a>
      <a href="https://github.com/Seg1GPT0Jpn/nejihodoki/issues" target="_blank" rel="noopener" data-i18n>お問い合わせ（GitHub Issues）</a>

    <span><span data-i18n>広告なし・課金なし・分析の送信なし</span> · <span id="ver"></span></span>
  </footer>

<script src="firebase-config.js"></script>
<script src="common/cloud.js"></script>
<script src="common/rank.js"></script>
<script src="common/news.js"></script>
<script>
(() => {
  'use strict';
  const I = KoboI18n, T = I.t, P = window.KoboPlatform, R = window.KOBO_REGISTRY, UI = window.KoboUI;
  const lang = I.lang === 'en' ? 'en' : 'ja';
  const L = o => (o && typeof o === 'object' ? (o[lang] || o.ja || '') : String(o == null ? '' : o));
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of [].concat(kids == null ? [] : kids)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  };
  const GAMES = (R ? R.games.slice() : []).sort((a, b) => (a.order || 0) - (b.order || 0));
  const GENRES = R ? R.genres : [];
  const byId = id => GAMES.find(g => g.id === id) || null;
  const today = P.jstDateKey();
  const num = n => Number(n).toLocaleString(lang === 'en' ? 'en-US' : 'ja-JP');

  // ---------- thumbnails (webp screenshot, SVG icon as fallback) ----------
  function thumb(g, big) {
    const box = el('span', { class: 'thumb', style: 'background:' + (g.iconBg || '') });
    const fallback = () => { box.innerHTML = g.iconSvg || ''; };
    if (g.thumb) {
      const img = el('img', { src: big && g.thumb2x ? g.thumb2x : g.thumb, srcset: g.thumb2x ? g.thumb + ' 360w, ' + g.thumb2x + ' 720w' : null,
        sizes: big ? '(min-width: 720px) 560px, 100vw' : '(min-width: 600px) 260px, 46vw', alt: '', loading: big ? 'eager' : 'lazy', decoding: 'async', width: 360, height: 240 });
      img.addEventListener('error', fallback, { once: true });
      box.append(img);
    } else fallback();
    return box;
  }
  function icon(g) { const b = el('span', { class: 'ic', style: 'background:' + (g.iconBg || '') }); b.innerHTML = g.iconSvg || ''; return b; }
  const genreName = id => { const x = GENRES.find(z => z.id === id); return x ? L(x) : id; };
  // NEW：追加から21日以内。全部が新しいとき（公開したて）は印を付けても意味がないので付けない
  const recent = g => { const t = Date.parse(g.added); return isFinite(t) && Date.now() - t < 21 * 864e5; };
  const allNew = GAMES.every(recent);
  const isNew = g => !allNew && recent(g);
  const dailyHref = g => g.path + '?daily=' + today;

  // ---------- all games (cards with records and favorites) ----------
  const filter = { genre: 'all', q: '' };
  function cardFor(g) {
    const favOn = P.fav.has(g.id);
    const tags = el('span', { class: 'tags' }, [el('span', { class: 'tag', text: L(g.label) })]);
    if (g.flags && g.flags.versus) tags.append(el('span', { class: 'tag', text: T('対戦') }));
    if (g.flags && g.flags.daily) tags.append(el('span', { class: 'tag', text: T('デイリー') }));
    if (isNew(g)) tags.append(el('span', { class: 'tag new', text: T('NEW') }));
    const a = el('a', { class: 'game', href: g.path, id: 'g-' + g.id }, [
      thumb(g, false),
      el('span', { class: 'gb' }, [el('h3', { text: L(g.title) }), tags, el('p', { text: L(g.desc) }), el('span', { class: 'rec', id: 'r-' + g.id })]),
    ]);
    const fav = el('button', { class: 'fav', type: 'button', 'aria-pressed': String(favOn), 'aria-label': T(favOn ? 'お気に入りから外す' : 'お気に入りに追加') + '：' + L(g.title),
      onclick: () => { P.fav.toggle(g.id); renderFavState(); } }, [el('span', { 'aria-hidden': 'true', text: favOn ? '★' : '☆' })]);
    fav.dataset.game = g.id;
    return el('div', { class: 'card', 'data-game': g.id }, [a, fav]);
  }
  function renderGames() { const nav = $('games'); nav.textContent = ''; GAMES.forEach(g => nav.append(cardFor(g))); refreshRecords(); applyFilter(); }
  function refreshRecords() { GAMES.forEach(g => { const r = $('r-' + g.id); if (r) r.textContent = P.recordText(g.id) || ''; }); }

  function haystack(g) {
    const parts = [g.id];
    for (const o of [g.title, g.short, g.desc, g.label]) if (o) parts.push(o.ja, o.en);
    if (g.keywords) parts.push(...(g.keywords.ja || []), ...(g.keywords.en || []));
    (g.genres || []).forEach(id => { const x = GENRES.find(z => z.id === id); if (x) parts.push(x.ja, x.en); });
    if (g.tech === '3d') parts.push('3D', '立体');
    if (g.flags && g.flags.versus) parts.push('対戦', 'versus', 'battle', 'online');
    if (g.flags && g.flags.daily) parts.push('デイリー', 'daily');
    return parts.filter(Boolean).join(' ').normalize('NFKC').toLowerCase();
  }
  // ひらがなとカタカナを同じに扱う（「ねじ」で「ネジ」も見つかる）
  const kana = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const HAY = {}; GAMES.forEach(g => { HAY[g.id] = kana(haystack(g)); });
  function matches(g) {
    if (filter.q) { const words = kana(filter.q.normalize('NFKC').toLowerCase()).split(/\s+/).filter(Boolean); if (!words.every(w => HAY[g.id].includes(w))) return false; }
    const f = filter.genre;
    if (f === 'all') return true;
    if (f === 'fav') return P.fav.has(g.id);
    if (f === '3d') return g.tech === '3d';
    if (f === 'versus') return !!(g.flags && g.flags.versus);
    return (g.genres || []).includes(f);
  }
  function applyFilter() {
    let n = 0;
    document.querySelectorAll('#games .card').forEach(c => { const ok = matches(byId(c.dataset.game)); c.hidden = !ok; if (ok) n++; });
    const empty = $('gamesEmpty');
    empty.hidden = n > 0;
    if (!n) empty.textContent = filter.q ? T('「{q}」に合うゲームはありません。', { q: filter.q }) : filter.genre === 'fav' ? T('お気に入りはまだありません。カードの ☆ を押すと、ここに並びます。') : T('このジャンルのゲームはありません。');
    const found = $('found');
    found.hidden = !filter.q; if (filter.q) found.textContent = T('{n} 本見つかりました', { n });
    document.body.classList.toggle('searching', !!filter.q);
  }
  function renderChips() {
    const box = $('chips'); box.textContent = '';
    const opts = [{ id: 'all', label: T('すべて') }, { id: 'fav', label: '★ ' + T('お気に入り') }];
    GENRES.forEach(x => { if (GAMES.some(g => (g.genres || []).includes(x.id))) opts.push({ id: x.id, label: L(x) }); });
    if (GAMES.some(g => g.tech === '3d')) opts.push({ id: '3d', label: T('3D') });
    if (GAMES.some(g => g.flags && g.flags.versus)) opts.push({ id: 'versus', label: T('対戦') });
    opts.forEach(o => box.append(el('button', { type: 'button', 'aria-pressed': String(filter.genre === o.id), 'data-f': o.id, text: o.label,
      onclick: () => { filter.genre = o.id; box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === o.id))); applyFilter(); } })));
  }
  const q = $('q'), qClear = $('qClear');
  q.addEventListener('input', () => { filter.q = q.value.trim(); qClear.hidden = !q.value; applyFilter(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); q.blur(); $('secAll').scrollIntoView({ block: 'start' }); } if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); } });
  qClear.onclick = () => { q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); };

  // ---------- small tiles for rails ----------
  function tile(g, sub, opt) {
    opt = opt || {};
    const t = thumb(g, false);
    if (opt.rank) t.append(el('span', { class: 'rank', text: opt.rank }));
    return el('a', { class: 'tile', href: opt.href || g.path }, [t, el('span', { class: 'tb' }, [el('b', { text: L(g.title) }), sub ? el('small', { text: sub }) : null])]);
  }
  function fill(sec, rail, items) { const r = $(rail); r.textContent = ''; items.forEach(x => r.append(x)); $(sec).hidden = items.length === 0; }

  // ---------- hero: today's pick (same for everyone each day; prefers a game this device has not played) ----------
  function renderHero() {
    if (!GAMES.length) return;
    const played = new Set(P.history.list().map(e => e.g));
    const pool = GAMES.filter(g => !played.has(g.id));
    const list = pool.length ? pool : GAMES;
    const g = list[P.hash32('kobo:hero:' + today) % list.length];
    const acts = el('div', { class: 'acts' }, [el('a', { class: 'kb-btn kb-btn--primary kb-btn--lg', href: g.path, text: T('遊ぶ') })]);
    if (g.flags && g.flags.daily) acts.append(el('a', { class: 'kb-btn kb-btn--ghost kb-btn--lg', href: dailyHref(g), text: T('今日のチャレンジ') }));
    const tags = el('div', { class: 'tags', style: 'display:flex;gap:4px;flex-wrap:wrap' }, [el('span', { class: 'tag', text: L(g.label) })]);
    if (g.flags && g.flags.versus) tags.append(el('span', { class: 'tag', text: T('対戦あり') }));
    const sec = $('secHero'); sec.textContent = '';
    sec.append(el('div', { class: 'hero' }, [
      el('a', { href: g.path, tabindex: '-1', 'aria-hidden': 'true', style: 'display:block;min-width:0' }, [thumb(g, true)]),
      el('div', { class: 'body' }, [el('span', { class: 'kicker', id: 'heroKick', text: T('今日のおすすめ') }), el('h3', { text: L(g.title) }), tags,
        el('p', { text: L(g.desc) }), el('p', { class: 'rec', style: 'color:var(--kb-accent-text);font-weight:800;font-size:12px', text: P.recordText(g.id) || null }), acts]),
    ]));
    sec.hidden = false;
  }

  // ---------- continue (kobo.history: newest first, one per game, up to 6) ----------
  function ago(t) {
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return T('たった今'); if (m < 60) return T('{n} 分前', { n: m });
    const h = Math.round(m / 60); if (h < 24) return T('{n} 時間前', { n: h });
    const d = P.daysBetween(P.jstDateKey(t), today); return d <= 1 ? T('昨日') : T('{n} 日前', { n: d });
  }
  function renderContinue() {
    const seen = new Set(), items = [];
    for (const e of P.history.list()) {
      const g = byId(e.g); if (!g || seen.has(g.id)) continue; seen.add(g.id);
      const bits = [ago(e.t)];
      if (e.m === 'daily') bits.push(T('デイリー')); else if (e.m === 'versus') bits.push(T('対戦'));
      else if (e.s > 0) bits.push(T('スコア {n}', { n: num(e.s) }));
      items.push(tile(g, bits.join(' · ')));
      if (items.length >= 6) break;
    }
    fill('secCont', 'railCont', items);
  }

  // ---------- today's challenge (only games with flags.daily) ----------
  function dailyStatus(g) {
    const d = P.daily.get(today, g.id);
    let stars = 0;
    if (g.id === 'neji') { const o = P.store.get('nejihodoki3d.daily', {}); stars = Number(o && o[today]) || 0; }
    if ((d && d.clearedAt > 0) || stars > 0) {
      const bits = [T('クリア済み')];
      if (stars) bits.push(T('★{n}', { n: stars })); else if (d && d.best > 0 && !(g.score && g.score.fmt)) bits.push(T('ベスト {n}', { n: num(d.best) }));
      return { done: true, text: bits.join(' · ') };
    }
    if (d && d.tries > 0) return { done: false, text: T('挑戦 {n} 回', { n: d.tries }) + (d.best > 0 && !(g.score && g.score.fmt) ? ' · ' + T('ベスト {n}', { n: num(d.best) }) : '') };
    return { done: false, text: T('未挑戦') };
  }
  function renderDaily() {
    const list = $('dailyList'); list.textContent = '';
    const ds = GAMES.filter(g => g.flags && g.flags.daily);
    ds.forEach(g => {
      const s = dailyStatus(g);
      list.append(el('a', { class: 'drow' + (s.done ? ' done' : ''), href: dailyHref(g) }, [icon(g),
        el('span', { style: 'min-width:0' }, [el('b', { text: L(g.title) }), el('small', { text: s.text })]), el('span', { class: 'go', text: T('挑戦する') })]));
    });
    const left = P.jstDayStart(P.addDays(today, 1)) - Date.now();
    $('dailyNote').textContent = T('全員が同じ問題に挑戦します。日本時間の0時に切り替わります（あと {h} 時間 {m} 分）。', { h: Math.floor(left / 3600000), m: Math.floor(left / 60000) % 60 });
    $('secDaily').hidden = ds.length === 0;
  }

  // ---------- favorites ----------
  function renderFav() { fill('secFav', 'railFav', P.fav.list().map(byId).filter(Boolean).map(g => tile(g, P.recordText(g.id) || L(g.label)))); }
  function renderFavState() {
    document.querySelectorAll('#games .fav').forEach(b => {
      const g = byId(b.dataset.game), on = P.fav.has(g.id);
      b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', T(on ? 'お気に入りから外す' : 'お気に入りに追加') + '：' + L(g.title));
      b.firstChild.textContent = on ? '★' : '☆';
    });
    renderFav(); if (filter.genre === 'fav') applyFilter();
  }

  // ---------- new (registry `added`, newest first) ----------
  function renderNew() {
    const list = GAMES.slice().sort((a, b) => String(b.added).localeCompare(String(a.added)) || (b.order || 0) - (a.order || 0)).slice(0, 6);
    fill('secNew', 'railNew', list.map(g => { const d = String(g.added || '').split('-'); return tile(g, d.length === 3 ? T('{m}月{d}日に追加', { m: +d[1], d: +d[2] }) : L(g.label)); }));
  }

  // ---------- popular: anonymous weekly play counts (Firestore kbPlays/w<week>, 2 reads, cached 6h). Hidden without data ----------
  const PLAYS_CACHE = 'kobo.playsCache', PLAYS_TTL = 6 * 3600000;
  function drawPopular(c) {
    if (!c) { $('secPop').hidden = true; return; }
    const pick = o => GAMES.map(g => ({ g, n: Math.max(0, Math.floor(Number(o && o[g.id]) || 0)) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
    let rows = pick(c.cur), tpl = '今週 {n} 回', note = '今週のプレイ回数（匿名で数えた合計）の多い順です。';
    if (!rows.length) { rows = pick(c.prev); tpl = '先週 {n} 回'; note = '先週のプレイ回数（匿名で数えた合計）の多い順です。'; }
    $('popNote').textContent = T(note);
    fill('secPop', 'railPop', rows.slice(0, 6).map((x, i) => tile(x.g, T(tpl, { n: num(x.n) }), { rank: i + 1 })));
  }
  function loadPopular() {
    const wk = P.jstWeekKey(), c = P.store.get(PLAYS_CACHE, null), t = Date.now();
    if (c && c.wk === wk && t - c.at < PLAYS_TTL && t >= c.at) { drawPopular(c); return; }
    if (c && c.wk === wk) drawPopular(c);
    if (!window.KoboCloud || navigator.onLine === false) return;
    Promise.resolve(KoboCloud.ready()).then(ok => {
      if (!ok || !window.firebase || !firebase.firestore) return;
      const db = firebase.firestore();
      return Promise.all([wk, wk - 1].map(w => db.collection('kbPlays').doc('w' + w).get().then(d => (d.exists ? d.data() || {} : {}), () => null))).then(r => {
        if (r[0] === null && r[1] === null) return;
        const out = { at: Date.now(), wk, cur: r[0] || {}, prev: r[1] || {} };
        P.store.set(PLAYS_CACHE, out); drawPopular(out);
      });
    }).catch(() => {});
  }

  // ---------- ranking excerpt: only boards already in KoboRank's 5-minute cache (0 reads). Otherwise just the link ----------
  function renderRankExcerpt() {
    const box = $('rboards'), K = window.KoboRank;
    box.textContent = ''; box.hidden = true;
    if (!K || !K.top) return;
    let cache = {}; try { cache = JSON.parse(localStorage.getItem(K.KEYS.cache) || '{}') || {}; } catch (e) {}
    const fresh = GAMES.filter(g => { const b = K.board(g.id, 'week'), e = cache['b:' + b]; return e && Date.now() - e.at < K.CACHE_MS - 5000 && Date.now() >= e.at && e.rows && e.rows.length; }).slice(0, 3);
    if (!fresh.length) return;
    const me = window.KoboCloud && KoboCloud.me ? KoboCloud.me() : null;
    Promise.all(fresh.map(g => K.top(g.id, 'week').then(r => ({ g, r })))).then(all => {
      all.forEach(({ g, r }) => {
        if (!r.cached || r.error) return;
        const rows = r.rows.filter(x => !x.out).slice(0, 3); if (!rows.length) return;
        const fmt = v => (g.score && g.score.fmt ? L(g.score.fmt).replace('{n}', num(v)) : num(v) + ' ' + L(g.score && g.score.unit));
        box.append(el('div', { class: 'rboard' }, [el('h3', { text: L(g.short || g.title) }), el('ol', null, rows.map(x =>
          el('li', { class: me && x.uid === me ? 'mine' : null }, [el('span', { class: 'r', text: T('{n}位', { n: x.rank }) }), el('span', { class: 'n', text: x.n || T('名無し') }), el('span', { class: 's', text: fmt(x.s) })])))]));
      });
      box.hidden = !box.children.length;
    }).catch(() => {});
  }

  // ---------- profile entry (header) ----------
  let cloudState = null;
  function renderProfile() {
    const nick = P.store.raw('kobo.nick') || '';
    const name = nick || (cloudState && cloudState.user ? T('ログイン中') : T('ゲスト'));
    $('profName').textContent = name;
    const av = $('profAv'); av.textContent = '';
    if (nick) av.textContent = Array.from(nick)[0].toUpperCase();
    else av.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:16px;height:16px;color:inherit"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  }
  function goAccount() {
    const ac = $('acct');
    if (filter.q) { q.value = ''; q.dispatchEvent(new Event('input')); }
    $('secAcct').scrollIntoView({ behavior: P.fx.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    if (ac.hidden) return;
    const f = ac.querySelector('button:not([hidden]), input'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 350);
  }
  // the header button opens the profile page (P3-2); the account section stays on this page too

  // ---------- notices (P3-6): common/news.json, unread dot (kobo.news.read). No push notifications ----------
  const N = window.KoboNews;
  let news = [];
  function renderNewsDot() {
    const b = $('newsBtn'), un = N ? N.unread(news) : [];
    b.hidden = !N || !news.length;
    if (!news.length) return;
    $('newsTitle').textContent = N.text((un[0] || news[0]).title);
    $('newsDot').hidden = !un.length; b.classList.toggle('unread', un.length > 0);
    $('newsSr').textContent = un.length ? T('未読') + ' ' + un.length : '';
  }
  function openNews() {
    if (!UI || !N) return;
    const unread = new Set(N.unread(news).map(e => e.id));
    const body = el('div', { class: 'news' });
    if (!news.length) body.append(el('p', { class: 'sec-note', text: T('お知らせはまだありません。') }));
    news.forEach(e => {
      const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.date || '');
      body.append(el('article', { class: unread.has(e.id) ? 'unread' : null }, [
        el('h3', null, [unread.has(e.id) ? el('span', { class: 'new', text: T('未読') }) : null, N.text(e.title)]),
        d ? el('time', { datetime: e.date, text: lang === 'en' ? (+d[2]) + '/' + (+d[3]) + '/' + d[1] : d[1] + '年' + (+d[2]) + '月' + (+d[3]) + '日' }) : null,
        N.text(e.body) ? el('p', { text: N.text(e.body) }) : null,
        e.link ? el('a', { href: e.link, target: /^https:/.test(e.link) ? '_blank' : null, rel: /^https:/.test(e.link) ? 'noopener' : null, text: T('くわしく') }) : null,
      ]));
    });
    UI.sheet({ title: T('お知らせ'), body }).open();
    N.markRead(news); renderNewsDot();
  }
  $('newsBtn').onclick = openNews;
  if (N) N.load('').then(l => { news = l; renderNewsDot(); });
  addEventListener('storage', e => { if (e.key === 'kobo.news.read') renderNewsDot(); });

  // ---------- settings (language, theme, volume via KoboUI + links) ----------
  $('setBtn').onclick = () => {
    if (!UI) return;
    const acctOk = !$('acct').hidden;
    const link = (title, sub, href, onClick) => UI.listRow({ title, sub, href, onClick, chevron: true });
    const extra = [];
    try {
      extra.push(UI.list([
        link(T('アカウント'), T(acctOk ? 'Googleログインとニックネーム' : 'ログインはこの環境では使えません'), acctOk ? '#secAcct' : null, acctOk ? e => { e && e.preventDefault && e.preventDefault(); s && s.close && s.close('acct'); setTimeout(goAccount, 50); } : null),
        link(T('プロフィール'), T('レベル・実績・フレンド・データの削除'), 'profile/'),
        link(T('利用規約とプライバシー'), T('保存するデータと消し方'), 'about/'),
      ]));
      // install (P4): only when the browser offered it (beforeinstallprompt) or on iOS Safari (instructions)
      const ins = installState();
      if (ins.prompt) extra.push(UI.list([UI.listRow({ title: T('ホーム画面に追加'), sub: T('アプリのように全画面で開けます。一度開いたゲームは通信なしでも遊べます。'), onClick: () => { s && s.close && s.close('install'); promptInstall(); }, chevron: true })]));
      else if (ins.ios) extra.push(UI.list([UI.listRow({ title: T('ホーム画面に追加'), sub: T('Safari の共有ボタン（□に↑）→「ホーム画面に追加」→「追加」'), chevron: false })]));
    } catch (e) {}
    const s = UI.openSettings({ extra });
  };

  // ---------- install to home screen ----------
  let evt = null;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
  // { prompt: the browser offered an install prompt, ios: iOS / iPadOS Safari (no prompt: instructions), ok: worth showing at all }
  function installState() {
    if (standalone() || !('serviceWorker' in navigator) || !window.isSecureContext) return { ok: false };
    const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    return { ok: true, prompt: !!evt, ios: !evt && ios };
  }
  async function promptInstall() { if (!evt) return renderInstall(); const e = evt; e.prompt(); try { await e.userChoice; } catch (x) {} evt = null; renderInstall(); }
  function renderInstall() {
    const box = $('installBox'), btn = $('installBtn'), msg = $('installMsg');
    const st = installState();
    if (!st.ok || location.protocol !== 'https:' && !evt) { box.hidden = true; return; }
    box.hidden = false;
    const ios = st.ios;
    if (evt) { btn.hidden = false; msg.textContent = T('ホーム画面に追加すると、アプリのように全画面で開けます。一度開いたゲームは通信なしでも遊べます。'); }
    else if (ios) { btn.hidden = true; msg.textContent = T('ホーム画面に追加するには、Safari の共有ボタン（□に↑）→「ホーム画面に追加」を押してください。'); }
    else { btn.hidden = true; msg.textContent = T('ホーム画面に追加するには、ブラウザのメニュー（︙）→「ホーム画面に追加」を押してください。'); }
  }
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); evt = e; renderInstall(); });
  addEventListener('appinstalled', () => { evt = null; renderInstall(); });
  $('installBtn').onclick = promptInstall;

  // ---------- version ----------
  function renderVersion() {
    const v = $('ver'); v.textContent = T('バージョン {v}', { v: 'r' + (R ? R.version : '?') });
    try { if (window.caches && caches.keys) caches.keys().then(ks => { const k = ks.filter(x => /^kobo-/.test(x)).sort().pop(); if (k) v.textContent = T('バージョン {v}', { v: k.replace(/^kobo-/, '') }); }).catch(() => {}); } catch (e) {}
  }

  // ---------- render everything (all from this device; works offline and without login) ----------
  function renderLocal() { renderHero(); renderContinue(); renderDaily(); renderFav(); renderNew(); refreshRecords(); renderFavState(); renderProfile(); }
  renderChips(); renderGames(); renderLocal(); renderInstall(); renderVersion();
  renderRankExcerpt();

  // ---------- login widget + sync (common/cloud.js). Keys come from the registry ----------
  if (window.KoboCloud) {
    const acct = $('acct');
    KoboCloud.mountLogin(acct);
    let map = null;
    try { map = P.syncMap(); } catch (e) { map = null; }
    KoboCloud.sync(map || {});
    KoboCloud.onChange(s => { cloudState = s; renderProfile(); if (s.synced) renderLocal(); });
    setTimeout(loadPopular, 1200);
  }
  addEventListener('storage', e => { if (!e.key || /^(kobo\.(history|fav|daily|nick)|kusoge\.|nejihodoki3d\.)/.test(e.key)) renderLocal(); });
  addEventListener('pageshow', e => { if (e.persisted) renderLocal(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
