<style>
/* 工房まもり: warm workshop chrome around a canvas board. --kb-* are the shared tokens re-tinted; --td-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1f1a16; --kb-surface: #2b241e; --kb-surface-2: #362c24; --kb-sunken: #15110e; --kb-line: #4a3d32;
  --kb-ink: #f6ecdf; --kb-dim: #c8b6a2;
  --kb-accent: #f2b33d; --kb-accent-ink: #2b1d05; --kb-accent-text: #f6c45e; --kb-accent-soft: rgba(242, 179, 61, .15);
  --kb-scrim: rgba(12, 9, 6, .76); --kb-focus: #ffe08a;
  --td-panel: rgba(255, 236, 214, .07); --td-line: rgba(255, 226, 196, .17); --td-board: #15110e; --td-card: linear-gradient(#30281f, #231c16);
  --td-go: linear-gradient(#f8c45c, #e3962c); --td-go-shadow: #8a5313; --td-bad: #ff8a72; --td-good: #94d98a; --td-heart: #ff7a6b; --td-coin: #ffd36b;
  --td-title: linear-gradient(90deg, #ffd38a, #f2b33d 50%, #e07a4a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f3ebdf; --kb-surface: #fffaf3; --kb-surface-2: #f7eee2; --kb-sunken: #e6d9c7; --kb-line: #d6c4ab;
    --kb-ink: #3a2b1f; --kb-dim: #6d5643;
    --kb-accent: #c46e16; --kb-accent-ink: #ffffff; --kb-accent-text: #9a520f; --kb-accent-soft: rgba(196, 110, 22, .12);
    --kb-scrim: rgba(58, 43, 31, .45); --kb-focus: #1f6fbf;
    --td-panel: rgba(58, 43, 31, .05); --td-line: #dccab3; --td-board: #2b221a; --td-card: linear-gradient(#fffaf3, #f6ecde);
    --td-go: linear-gradient(#e78f2f, #c46e16); --td-go-shadow: #7f430c; --td-bad: #c2412a; --td-good: #2f8a3a; --td-heart: #d0402f; --td-coin: #a8700c;
    --td-title: linear-gradient(90deg, #a5520f, #c46e16 50%, #a8402a);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f3ebdf; --kb-surface: #fffaf3; --kb-surface-2: #f7eee2; --kb-sunken: #e6d9c7; --kb-line: #d6c4ab;
  --kb-ink: #3a2b1f; --kb-dim: #6d5643;
  --kb-accent: #c46e16; --kb-accent-ink: #ffffff; --kb-accent-text: #9a520f; --kb-accent-soft: rgba(196, 110, 22, .12);
  --kb-scrim: rgba(58, 43, 31, .45); --kb-focus: #1f6fbf;
  --td-panel: rgba(58, 43, 31, .05); --td-line: #dccab3; --td-board: #2b221a; --td-card: linear-gradient(#fffaf3, #f6ecde);
  --td-go: linear-gradient(#e78f2f, #c46e16); --td-go-shadow: #7f430c; --td-bad: #c2412a; --td-good: #2f8a3a; --td-heart: #d0402f; --td-coin: #a8700c;
  --td-title: linear-gradient(90deg, #a5520f, #c46e16 50%, #a8402a);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 65%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 6px 0; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--td-panel); border: 1px solid var(--td-line); color: var(--kb-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip svg { width: 15px; height: 15px; flex: none; }
#mapChip { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; color: var(--kb-dim); background: transparent; border: 0; padding-left: 2px; font-size: 12.5px; }
#livesChip svg { color: var(--td-heart); } #goldChip svg { color: var(--td-coin); }
#livesChip.hurt { animation: hurt .45s ease-out; }
#goldChip.gain { animation: gain .35s ease-out; }
.icon { position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--td-line); background: var(--td-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; font: 800 15px var(--kb-font-body); }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.icon:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 4px 6px 6px; gap: 6px; }
#stageWrap { flex: 1 1 auto; min-height: 140px; position: relative; overflow: hidden; border-radius: 14px; background: var(--td-board); box-shadow: 0 6px 24px rgba(0, 0, 0, .3), 0 0 0 1px var(--td-line); }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
#bar { flex: none; display: flex; gap: 6px; align-items: stretch; }
#preview { flex: 1 1 auto; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 14px; border: 1px solid var(--td-line); background: var(--td-panel); color: var(--kb-ink); cursor: pointer; overflow: hidden; font: 800 12px var(--kb-font-body); text-align: left; touch-action: manipulation; }
#preview .lbl { flex: none; font-size: 11px; color: var(--kb-dim); }
#preview .grp { flex: none; display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
#preview img { width: 26px; height: 26px; }
#preview .none { color: var(--kb-dim); font-weight: 500; }
.ctl { flex: none; min-width: 48px; min-height: 48px; border-radius: 14px; border: 1px solid var(--td-line); background: var(--kb-surface); color: var(--kb-ink); box-shadow: 0 3px 0 var(--kb-sunken); display: grid; place-items: center; cursor: pointer; padding: 0 6px; font: 800 15px var(--kb-font-body); touch-action: manipulation; font-variant-numeric: tabular-nums; }
.ctl svg { width: 22px; height: 22px; }
.ctl:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--kb-sunken); }
#nextBtn { min-width: 104px; background: var(--td-go); color: #2a1606; border: 0; box-shadow: 0 3px 0 var(--td-go-shadow); line-height: 1.1; padding: 2px 10px; }
#nextBtn small { display: block; font-size: 10.5px; font-weight: 500; opacity: .85; }
#nextBtn:disabled { filter: saturate(.25) brightness(.85); opacity: .7; cursor: default; box-shadow: none; transform: none; }
#nextBtn.pulse { animation: pulse 1.2s ease-in-out infinite; }

/* build ring and tower panel, over the board */
#ring { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
.rb { position: absolute; width: 52px; height: 56px; margin: -28px 0 0 -26px; box-sizing: border-box; border-radius: 16px; border: 2px solid rgba(255, 240, 220, .55); background: rgba(34, 26, 20, .9); color: #fff3e0; padding: 2px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; font: 800 11.5px var(--kb-font-body); box-shadow: 0 4px 12px rgba(0, 0, 0, .4); touch-action: manipulation; animation: pop .22s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.rb img { width: 32px; height: 32px; pointer-events: none; }
.rb b { font-variant-numeric: tabular-nums; color: #ffd36b; line-height: 1.1; }
.rb.poor b { color: #ff9a8a; }
.rb.poor img { filter: grayscale(.8) brightness(.8); }
.rb.sel { border-color: #ffd36b; background: rgba(90, 62, 20, .95); box-shadow: 0 0 0 3px rgba(255, 211, 107, .45), 0 4px 12px rgba(0, 0, 0, .4); transform: scale(1.08); }
.rb.ban { opacity: .45; }
.rb.hint { border-color: #ffd36b; animation: pop .22s cubic-bezier(.2, 1.5, .4, 1) backwards, hint 1s ease-in-out infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 6px rgba(255, 211, 107, .5), 0 4px 12px rgba(0, 0, 0, .4); } }
#tip { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; padding: 6px 10px; border-radius: 12px; background: rgba(28, 21, 16, .92); color: #fff3e0; border: 1px solid rgba(255, 226, 196, .25); font-size: 12.5px; font-weight: 800; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; }
#tip.coach { border-color: #f2b33d; background: rgba(60, 40, 12, .95); }
#tip .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; margin-right: 6px; border-radius: 999px; background: #f2b33d; color: #2b1d05; }
#tip small { display: block; font-weight: 500; opacity: .85; }
#tip.bottom { top: auto; bottom: 8px; }
#panel { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 6; padding: 6px 8px 8px; border-radius: 16px; background: rgba(30, 23, 18, .95); color: #fff3e0; border: 1px solid rgba(255, 226, 196, .25); box-shadow: 0 6px 20px rgba(0, 0, 0, .45); animation: rise .2s ease-out; }
#panel.top { bottom: auto; top: 6px; }
#panel.side { top: 6px; bottom: auto; width: min(340px, 60%); box-sizing: border-box; max-height: calc(100% - 12px); overflow-y: auto; }
#panel.side .pr { flex-wrap: wrap; } #panel.side .pb.sell, #panel.side .pb.aim { min-width: 0; flex: 1 1 0; }
#panel.side.l { right: auto; } #panel.side.r { left: auto; }
#panel .ph { display: flex; align-items: center; gap: 8px; }
#panel .ph img { width: 36px; height: 36px; flex: none; }
#panel .ph div { flex: 1; min-width: 0; }
#panel .ph b { display: block; font-size: 14px; line-height: 1.2; }
#panel .ph small { display: block; font-size: 11px; opacity: .8; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel .px { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .08); color: inherit; display: grid; place-items: center; cursor: pointer; padding: 0; }
#panel .px svg { width: 20px; height: 20px; }
#panel .pr { display: flex; gap: 6px; margin-top: 6px; }
.pb { flex: 1 1 0; min-width: 0; min-height: 46px; border-radius: 12px; border: 1px solid rgba(255, 226, 196, .25); background: rgba(255, 255, 255, .07); color: #fff3e0; font: 800 12.5px var(--kb-font-body); cursor: pointer; padding: 3px 6px; line-height: 1.15; touch-action: manipulation; overflow: hidden; }
.pb small { display: block; font-size: 10.5px; font-weight: 500; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb.go { background: linear-gradient(#f8c45c, #e3962c); color: #2a1606; border: 0; }
.pb.go.poor { background: rgba(255, 255, 255, .1); color: #ffb8a8; }
.pb.sell { flex: 0 0 auto; min-width: 84px; }
.pb.aim { flex: 0 0 auto; min-width: 84px; }
.pb:disabled { opacity: .5; cursor: default; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.card { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--td-card); border: 1px solid var(--td-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); overflow: hidden; animation: rise .3s cubic-bezier(.2, 1.4, .4, 1); }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--td-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 28px; line-height: 1.2; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--td-go); color: #2a1606; font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--td-go-shadow); text-decoration: none; touch-action: manipulation; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--td-go-shadow); }
.btn.sub { background: var(--td-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--td-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .stk { display: flex; flex-direction: column; align-items: center; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.maps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; text-align: left; }
.mc { min-width: 0; position: relative; display: flex; flex-direction: column; gap: 3px; min-height: 44px; box-sizing: border-box; padding: 6px; border-radius: 14px; border: 1px solid var(--td-line); background: var(--td-panel); color: var(--kb-ink); cursor: pointer; font: 800 12.5px var(--kb-font-body); text-align: left; touch-action: manipulation; }
.mc canvas { width: 100%; aspect-ratio: 14 / 9; border-radius: 9px; display: block; }
.mc .nm { display: flex; align-items: center; gap: 4px; line-height: 1.25; min-width: 0; }
.mc .nm span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc .st { flex: none; color: var(--kb-accent-text); letter-spacing: -1px; font-size: 12px; }
.mc small { display: block; font-size: 10.5px; font-weight: 500; color: var(--kb-dim); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc:disabled { opacity: .5; cursor: default; }
.mc:disabled canvas { filter: grayscale(1) brightness(.6); }
.mc .lock { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; color: #fff; }
.daily { margin-top: 8px; }
.daily .stk small { display: block; }
.stars { font-size: 40px; letter-spacing: 4px; line-height: 1.1; margin: 4px 0; }
.stars i { font-style: normal; color: rgba(128, 112, 96, .4); display: inline-block; }
.stars i.on { color: #ffcf4a; text-shadow: 0 2px 0 #9a5e0c; animation: star .5s cubic-bezier(.2, 1.8, .4, 1) backwards; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.res div { padding: 6px 4px; border-radius: 12px; background: var(--td-panel); border: 1px solid var(--td-line); font-size: 11px; color: var(--kb-dim); font-weight: 800; }
.res b { display: block; font-size: 17px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.mapbig { width: 100%; max-width: 300px; aspect-ratio: 14 / 9; border-radius: 12px; display: block; margin: 6px auto 4px; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0; }
.facts span { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--td-panel); border: 1px solid var(--td-line); color: var(--kb-dim); }
.mods { margin: 6px 0; padding: 6px 10px; border-radius: 12px; background: var(--kb-accent-soft); color: var(--kb-ink); font-size: 12.5px; font-weight: 800; text-align: left; }
.mods li { margin: 2px 0; }
.mods ul { margin: 0; padding-left: 18px; }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.5; color: var(--kb-ink); }
.howto li { margin: 4px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--td-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--td-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.elist { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 6px; text-align: left; }
.elist div { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 10px; background: var(--td-panel); font-size: 12px; }
.elist img { width: 32px; height: 32px; flex: none; }
.elist b { display: block; font-size: 12.5px; }
.elist small { color: var(--kb-dim); }
body.thumb header, body.thumb #bar, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #tip { display: none !important; }
body.thumb #main { padding: 0; max-width: none; }
body.thumb #stageWrap { border-radius: 0; box-shadow: none; }

@keyframes rise { from { transform: translateY(12px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
@keyframes hurt { 0% { background: rgba(255, 90, 70, .55); } }
@keyframes gain { 0% { transform: scale(1.12); } }
@keyframes pulse { 50% { box-shadow: 0 3px 0 var(--td-go-shadow), 0 0 0 5px rgba(242, 179, 61, .35); } }
@media (prefers-reduced-motion: reduce) { .card, .overlay, .rb, #panel, .stars i.on, #nextBtn.pulse, #livesChip.hurt, #goldChip.gain { animation: none; } }
@media (max-width: 359px) { .chip { padding: 4px 6px; font-size: 12px; } #nextBtn { min-width: 92px; } .ctl { min-width: 46px; } #preview img { width: 22px; height: 22px; } }
@media (max-height: 600px) { .card { padding: 12px 12px 8px; } .btn { min-height: 46px; margin-top: 6px; } .card h2.logo { font-size: 24px; } }
/* landscape phones: the board on the left, the controls in a column on the right */
@media (orientation: landscape) and (max-height: 560px) {
  header { padding-top: 0; max-width: none; }
  #main { flex-direction: row; max-width: none; padding-top: 2px; }
  #bar { flex-direction: column; width: 132px; }
  #preview { flex-direction: column; align-items: flex-start; justify-content: center; flex-wrap: wrap; padding: 6px; gap: 2px; }
  #bar .ctl { width: 100%; }
  #nextBtn { min-height: 56px; }
  .card { max-width: 660px; }
  .howto { max-width: 680px; }
  .maps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .res { grid-template-columns: repeat(4, 1fr); }
  .stars { font-size: 30px; }
  .card h2.logo { font-size: 22px; }
  .mapbig { max-width: 220px; }
}
</style>
</head>

<div id="app">
  <header>
    <div class="hrow">

    <button class="btn" id="howtoGo" type="button" data-i18n>やってみる</button>

  </div>

<script src="engine.js"></script>
<script src="art.js"></script>
<script src="../common/game.js"></script>
<script>
(() => {
'use strict';
// 工房まもり — an original tower defense. td/engine.js is the deterministic simulation (also run headless by
// tools/tests/td-balance.js), td/art.js draws the toys, towers and boards, and this file is the chrome: taps, the
// build ring, the tower panel, the HUD, saving, scoring and the platform events.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const TD = window.TDEngine, ART = window.TDArt;
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'td';
const SAVE_KEY = 'kusoge.td.save';  // records per map (registry: per-field merge)
const RUN_KEY = 'kusoge.td.run';    // the game in progress, saved between waves (this device only)
const HOWTO_KEY = 'kusoge.td.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Math.round(Number(n) || 0).toLocaleString(EN ? 'en-US' : 'ja-JP');
const L = o => (o ? (EN ? o.en : o.ja) : '');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
const now = () => performance.now();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
const lastSfx = {};
function sfx(name, gap, a) { if (!AU) return; const t = now(); if (gap && lastSfx[name] && t - lastSfx[name] < gap) return; lastSfx[name] = t; AU.sfx(name, a); }
function tone(f, d, o, key, gap) { if (!AU) return; const t = now(); if (key && lastSfx[key] && t - lastSfx[key] < gap) return; if (key) lastSfx[key] = t; AU.tone(f, d, o); }
function vibrate(p) { if (AU && AU.vibrate) AU.vibrate(p); }
const COIN = '◎';
const SEP = EN ? ' · ' : '・';
const MAPS = TD.MAPS;

// ---------- save ----------
function defSave() { return { v: 1, maps: {}, best: 0, stars: 0, stats: { kills: 0, wins: 0, perfect: 0, boss: 0, built: 0, early: 0, endW: 0, daily: 0 }, tut: 0 }; }
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const out = Object.assign(d, s);
  out.maps = s.maps && typeof s.maps === 'object' && !Array.isArray(s.maps) ? s.maps : {};
  out.stats = Object.assign(defSave().stats, s.stats && typeof s.stats === 'object' ? s.stats : {});
  recount(out);
  return out;
}
function recount(s) {
  let st = 0, best = 0;
  for (const M of MAPS) { const r = s.maps[M.id]; if (!r) continue; st += Math.max(0, Math.min(3, r.st | 0)); best = Math.max(best, r.es | 0); }
  s.stars = Math.max(s.stars | 0, st); s.best = Math.max(s.best | 0, best);
}
let save = readSave();
function writeSave() { recount(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const unlocked = i => i === 0 || !!(save.maps[MAPS[i - 1].id] && save.maps[MAPS[i - 1].id].c > 0);
const cleared = i => !!(save.maps[MAPS[i].id] && save.maps[MAPS[i].id].c > 0);
function readRun() {
  let r = null; try { r = JSON.parse(store.get(RUN_KEY) || 'null'); } catch (e) { r = null; }
  if (!r || r.v !== 1 || !r.snap || !MAPS[r.snap.map]) return null;
  return r;
}
function clearRun() { store.del(RUN_KEY); }

// ---------- state ----------
let G = null;            // the engine game
let run = null;          // { mode, mi, dk, tut, started, over, recorded }
let speed = 1, paused = false, menuOpen = false;
let acc = 0, lastT = now(), raf = 0;
let sel = null;          // { kind: 'slot', slot } | { kind: 'tower', t }
let pickType = null;     // the tower chosen in the ring (a second tap builds it)
let evRead = 0;
let lastSaveKey = '';
const playing = () => !!(G && run && !G.over && run.started);

// ---------- canvas & view ----------
const cv = $('board'), ctx = cv.getContext('2d');
const wrap = $('stageWrap');
const view = { W: 360, H: 560, dpr: 1, ts: 30, ox: 0, oy: 0, tr: false };
function layout() {
  const r = wrap.getBoundingClientRect();
  const W = Math.max(100, Math.floor(r.width)), H = Math.max(100, Math.floor(r.height));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const tr = W > H * 1.08; // landscape boards are drawn transposed (the path runs left to right)
  const cols = tr ? TD.ROWS : TD.COLS, rows = tr ? TD.COLS : TD.ROWS;
  const ts = Math.max(8, Math.min(W / cols, H / rows));
  const changed = W !== view.W || H !== view.H || dpr !== view.dpr || tr !== view.tr;
  Object.assign(view, { W, H, dpr, tr, ts, ox: Math.round((W - cols * ts) / 2), oy: Math.round((H - rows * ts) / 2) });
  if (changed || cv.width !== Math.round(W * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ART.resize(view);
    staticDirty = true;
  }
  placeRing(); needDraw = true;
}
// tile coords → CSS px inside the board
function sx(x, y) { return view.tr ? view.ox + y * view.ts : view.ox + x * view.ts; }
function sy(x, y) { return view.tr ? view.oy + x * view.ts : view.oy + y * view.ts; }
function toTile(px, py) { return view.tr ? { x: (py - view.oy) / view.ts, y: (px - view.ox) / view.ts } : { x: (px - view.ox) / view.ts, y: (py - view.oy) / view.ts }; }

let staticDirty = true, needDraw = true;
function draw(ts) {
  if (!G) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); return; }
  if (staticDirty) { ART.buildStatic(G.I, view); staticDirty = false; }
  ART.frame(ctx, G, view, ts, { sel, pickType, tut: tutHighlight(), run });
}

// ---------- the loop ----------
function loop(t) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;
  let stepped = false;
  if (G && playing() && !paused && !menuOpen && !anyOverlay()) {
    acc += dt * speed;
    let n = 0;
    while (acc >= TD.DT && n < 8 * speed) { G.step(); acc -= TD.DT; n++; if (G.over) break; }
    if (n >= 8 * speed) acc = 0;
    stepped = n > 0;
  }
  if (G && G.over && run && run.started && !run.over) onOver();
  if (G) {
    pumpEvents();
    if (stepped || ART.busy() || needDraw || sel || pickType || tutHighlight() >= 0) { draw(t / 1000); needDraw = false; }
    hud();
    if (stepped) { autosave(); tutTick(); }
  }
}

// ---------- engine events → effects and sounds ----------
function pumpEvents() {
  if (G.evN - evRead > G.events.length) evRead = G.evN - G.events.length;
  for (; evRead < G.evN; evRead++) {
    const e = G.events[evRead % G.events.length];
    ART.event(e, G);
    switch (e.k) {
      case 10: sfx('drop'); vibrate(10); break;
      case 11: sfx('ok'); vibrate(15); break;
      case 12: sfx('coin'); break;
      case 20: sfx('select'); break;
      case 21: sfx('coin'); break;
      case 22: tone(784, 0.12, { type: 'triangle', vol: 0.07 }); tone(1046, 0.14, { type: 'triangle', vol: 0.07, delay: 0.08 }); break;
      case 30: if (TD.ENEMY_KEYS[e.a] === 'K') { sfx('clear'); vibrate([30, 40, 60]); } else sfx('pop', 70); break;
      case 31: sfx('fail', 120); vibrate(40); flashChip('livesChip', 'hurt'); break;
      case 32: tone(1320, 0.08, { type: 'square', vol: 0.03, slide: 660 }, 'shield', 90); break;
      case 40: if (e.a === 0) tone(1400, 0.06, { type: 'sawtooth', vol: 0.025, slide: 500 }, 'zap', 90); break;
      case 41: sfx('hit', 90); break;
    }
  }
}
function flashChip(id, cls) { const el = $(id); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ---------- HUD ----------
const H = {};
function setText(id, s) { if (H[id] !== s) { H[id] = s; $(id).textContent = s; } }
function hud() {
  if (!G) return;
  setText('livesN', String(G.lives));
  if (H.gold !== G.gold) { if (H.gold != null && G.gold > H.gold) flashChip('goldChip', 'gain'); H.gold = G.gold; $('goldN').textContent = fmtN(G.gold); refreshOpen(); }
  setText('waveChip', G.endless ? T('波 {n}', { n: G.wave }) : T('波 {n}/{m}', { n: G.wave, m: G.total }));
  // next / call button
  const nb = $('nextBtn');
  const can = G.canCall();
  const key = [can, Math.ceil(G.cd), G.wave, G.over, G.earlyBonus()].join();

function tutSlot() { // the pad the tutorial points at: the free pad that sees the most path

}

// ---------- game flow ----------
function startGame(mi, mode, o) {
  o = o || {};
  if (run && run.started && !run.over) endPlay('quit');
  closeSel(); hideOverlays();
  const snap = o.snap || null;
  const mods = mode === 'daily' ? o.mods : {};
  G = TD.create(snap ? { snap } : { map: mi, mode, mods, seed: o.seed });
  mi = G.map; mode = G.mode;
  evRead = G.evN; acc = 0; lastT = now(); speed = o.speed || 1; paused = false;
  run = { mi, mode, dk: o.dk || null, tut: o.tut !== undefined ? o.tut : (mi === 0 && mode === 'normal' && !save.tut ? 0 : null), started: true, over: false, recorded: false };
  if (snap && o.tut === undefined) run.tut = null;
  tutSlotCache = tutSlot();
  lastSaveKey = '';
  Object.keys(H).forEach(k => delete H[k]);
  $('mapChip').textContent = mode === 'daily' ? T('今日のチャレンジ') + SEP + L(MAPS[mi].name) : L(MAPS[mi].name) + (mode === 'endless' ? SEP + T('エンドレス') : '');
  cv.setAttribute('aria-label', L(MAPS[mi].name));
  staticDirty = true; layout();
  emit('play_start', mode === 'daily' ? { mode: 'daily', dateKey: run.dk, seed: o.seed } : { mode: 'normal', stage: mi + 1, resumed: !!snap });
  if (run.tut != null) coachTip(); else $('tip').hidden = true;
  persist(true);
  needDraw = true; hud();
}
function endPlay(reason) {
  if (!run || !run.started || run.over || !G) return;
  if (G.endless && G.cleared > 0) { finishRun(false, reason); return; }
  emit('play_end', { mode: run.mode === 'daily' ? 'daily' : 'normal', score: 0, durationMs: Math.round(G.t * 1000), reason: 'quit', stage: run.mi + 1 });
  run.over = true;
}
let lastResult = null;
function onOver() {
  if (!run || run.over) return;
  finishRun(G.won, 'over');
  sfx(G.won ? 'win' : 'over'); vibrate(G.won ? [30, 40, 60] : 120);
  setTimeout(showResult, reduceMotion.matches ? 300 : 1300);
}
// records the result of the game (a win, a loss, or quitting an endless run that already survived some waves)
function finishRun(won, reason) {
  if (!run || run.over) return;
  run.over = true;
  const mi = run.mi, id = MAPS[mi].id, st = save.stats;
  const ms = Math.round(G.t * 1000);
  st.kills = (st.kills | 0) + G.stats.kills; st.boss = (st.boss | 0) + G.stats.boss;
  let newBest = false;
  const R = { mi, mode: run.mode, won, stars: 0, lives: G.lives, waves: G.cleared, kills: G.stats.kills, score: G.score, newBest: false, best: 0 };
  if (run.mode === 'normal') {
    const rec = save.maps[id] || { st: 0, c: 0, ew: 0, es: 0 };
    if (won) {
      newBest = G.stars > (rec.st | 0);
      rec.st = Math.max(rec.st | 0, G.stars); rec.c = (rec.c | 0) + 1; st.wins = (st.wins | 0) + 1; if (G.stars === 3) st.perfect = (st.perfect | 0) + 1;
      save.maps[id] = rec;
    }
    R.stars = won ? G.stars : 0;
    const before = save.stars;
    writeSave();
    if (won) emit('stage_clear', { stage: mi + 1, stars: G.stars, timeMs: ms, mode: 'normal' });
    if (save.stars > before) emit('progress', { key: 'stars', value: save.stars });
    emit('play_end', { mode: 'normal', score: 0, durationMs: ms, reason: won ? 'clear' : 'over', stage: mi + 1, stats: { stars: R.stars, lives: G.lives, kills: G.stats.kills } });
  } else if (run.mode === 'endless') {
    const rec = save.maps[id] || { st: 0, c: 0, ew: 0, es: 0 };
    newBest = G.score > (rec.es | 0);
    rec.ew = Math.max(rec.ew | 0, G.cleared); rec.es = Math.max(rec.es | 0, G.score);
    save.maps[id] = rec; st.endW = Math.max(st.endW | 0, G.cleared);
    const before = save.best;
    writeSave();
    R.best = rec.es;
    if (save.best > before) emit('best', { score: save.best });
    emit('play_end', { mode: 'normal', score: G.score, durationMs: ms, reason: reason === 'quit' ? 'quit' : 'over', stage: mi + 1, stats: { waves: G.cleared, map: mi + 1 } });
  } else {
    st.daily = (st.daily | 0) + 1;
    const prev = PF && PF.daily ? PF.daily.get(run.dk, GAME) : null;
    newBest = !prev || G.score > (prev.best | 0);
    writeSave();
    emit('play_end', { mode: 'daily', dateKey: run.dk, score: G.score, durationMs: ms, reason: 'over', stats: { waves: G.cleared, map: mi + 1 } });
    const now2 = PF && PF.daily ? PF.daily.get(run.dk, GAME) : null;
    R.best = Math.max(G.score, now2 ? now2.best | 0 : 0, prev ? prev.best | 0 : 0);
  }
  R.newBest = newBest && (run.mode !== 'normal' ? G.score > 0 : won);
  lastResult = R;
  clearRun();
}

  if (a === 'next') { showMap(R.mi + 1); return; }
  if (a === 'endless') { startGame(R.mi, 'endless'); return; }
  retry(R);
});
$('rAgain').addEventListener('click', () => { if (lastResult) retry(lastResult); });
$('rMaps').addEventListener('click', showTitle);
function retry(R) { if (R.mode === 'daily') startDaily(R.dk || (run && run.dk)); else startGame(R.mi, R.mode); }

// ---------- autosave between waves ----------
function persist(force) {
  if (!G || !run || !run.started || run.over || G.over || DEBUG_NOSAVE) return;
  if (!G.quiet()) return;
  const key = G.wave + ':' + G.cleared + ':' + G.tw.length + ':' + G.gold;
  if (!force && key === lastSaveKey) return;
  lastSaveKey = key;
  store.set(RUN_KEY, JSON.stringify({ v: 1, snap: G.snapshot(), mode: run.mode, dk: run.dk, tut: run.tut, speed, at: Date.now() }));
}
let persistT = 0;
function persistSoon() { clearTimeout(persistT); persistT = setTimeout(() => persist(true), 300); }
function autosave() { if (G && G.quiet() && G.wave > 0) persist(false); }
let DEBUG_NOSAVE = false;

// ---------- overlays ----------
const OVERLAYS = ['ovTitle', 'ovMap', 'ovResult', 'ovInfo', 'howto'];
const anyOverlay = () => OVERLAYS.some(id => !$(id).hidden) || !!document.querySelector('.kb-layer:not([hidden])');
function hideOverlays() { OVERLAYS.forEach(id => { $(id).hidden = true; }); }
function totalStars() { let n = 0; for (const M of MAPS) { const r = save.maps[M.id]; if (r) n += r.st | 0; } return n; }
function showTitle() {
  if (playing()) persist(true);
  closeSel(); hideOverlays();
  const ts = totalStars();
  $('tStars').textContent = ts > 0 ? '★ ' + T('星 {n} / {m}', { n: ts, m: MAPS.length * 3 }) + (save.best > 0 ? '　' + T('エンドレス最高 {n} 点', { n: fmtN(save.best) }) : '') : '';
  const box = $('tMaps'); box.innerHTML = '';
  MAPS.forEach((M, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mc'; b.dataset.map = i;
    const ok = unlocked(i), rec = save.maps[M.id];
    const c = document.createElement('canvas'); c.width = 168; c.height = 108; ART.mapThumb(c, i);
    const st = rec ? rec.st | 0 : 0;
    const nm = document.createElement('div'); nm.className = 'nm';
    nm.innerHTML = '<span>' + (i + 1) + '. ' + esc(L(M.name)) + '</span><b class="st">' + '★'.repeat(st) + '<span style="opacity:.3">' + '★'.repeat(3 - st) + '</span></b>';
    const sm = document.createElement('small');
    sm.textContent = !ok ? T('前のマップをクリアすると開きます') : rec && rec.es ? T('エンドレス最高 {n} 点', { n: fmtN(rec.es) }) : T('波 {n} 回', { n: M.waves.length });
    b.append(c, nm, sm);
    if (!ok) { b.disabled = true; b.insertAdjacentHTML('beforeend', '<svg class="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1v11H6V10zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>'); }
    b.addEventListener('click', () => showMap(i));
    box.appendChild(b);
  });
  // today's challenge
  const d = dailyInfo();
  const db = $('tDaily');
  if (d) {
    const rec = PF && PF.daily ? PF.daily.get(d.dk, GAME) : null;
    db.hidden = false;
    db.innerHTML = '<span class="stk"><span>' + esc(T('今日のチャレンジ')) + '</span><small>' + esc(T('{map}・{mods}', { map: L(MAPS[d.map].name), mods: modNames(d.mods).join(' / ') })) + '</small>' + (rec && rec.best ? '<small>' + esc(T('今日のベスト {n} 点', { n: fmtN(rec.best) })) + '</small>' : '') + '</span>';
  } else db.hidden = true;
  const rr = run && run.started && !run.over && G && !G.over ? { snap: { map: run.mi, wave: G.wave }, mode: run.mode } : readRun();
  const cont = $('tContinue');
  cont.hidden = !rr;
  if (rr) cont.innerHTML = '<span class="stk"><span>' + esc(T('つづきから')) + '</span><small>' + esc(T('{map}・波 {n}', { map: (rr.mode === 'daily' ? T('今日のチャレンジ') + '・' : '') + L(MAPS[rr.snap.map].name) + (rr.mode === 'endless' ? SEP + T('エンドレス') : ''), n: rr.snap.wave + (rr.snap.wave < ((rr.mode === 'normal') ? MAPS[rr.snap.map].waves.length : 1e9) ? 1 : 0) })) + '</small></span>';
  $('ovTitle').hidden = false;
  try { (rr ? cont : box.querySelector('.mc:not(:disabled)')).focus({ preventScroll: true }); } catch (e) {}
}
$('tContinue').addEventListener('click', () => {
  if (run && run.started && !run.over && G && !G.over) { hideOverlays(); lastT = now(); return; }
  const r = readRun(); if (!r) return;
  startGame(r.snap.map, r.mode, { snap: r.snap, dk: r.dk, tut: r.tut == null ? null : r.tut, speed: r.speed });
});
$('tDaily').addEventListener('click', async () => { const d = dailyInfo(); if (!d) return; if (!(await confirmNew())) return; startDaily(d.dk); });
$('tHow').addEventListener('click', () => showHowto(false));
async function confirmNew() {
  const live = run && run.started && !run.over && G && !G.over, saved = !live && readRun();
  if ((live || saved) && UI && UI.confirm) return UI.confirm({ title: T('新しく始めますか？'), message: T('とちゅうのゲームは消えます。'), ok: T('はじめる'), cancel: T('やめる') });
  return true;
}
function modNames(mods) { return Object.keys(mods || {}).map(k => { const M = TD.MODS[k]; if (!M) return k; return T(L(M.name), { t: k === 'ban' ? L(TD.TOWERS[mods.ban].name) : '' }).replace('{t}', k === 'ban' ? L(TD.TOWERS[mods.ban].name) : ''); }); }
function dailyInfo(dk) {
  if (!PF) return null;
  dk = dk && PF.isDateKey(dk) ? Number(dk) : PF.jstDateKey();
  const seed = PF.dailySeed(GAME, dk);
  const d = TD.dailySetup(seed);
  return { dk, seed, map: d.map, mods: d.mods };
}
function startDaily(dk) {
  const d = dailyInfo(dk); if (!d) return;
  clearRun();
  startGame(d.map, 'daily', { mods: d.mods, dk: d.dk, seed: d.seed, tut: null });
}
let mapSel = 0;
function showMap(i) {
  if (!unlocked(i)) return;
  mapSel = i; hideOverlays();
  const M = MAPS[i], rec = save.maps[M.id];
  $('mTitle').textContent = (i + 1) + '. ' + L(M.name);
  ART.mapThumb($('mCanvas'), i, true);
  $('mDesc').textContent = L(M.desc);
  const facts = [T('波 {n} 回', { n: M.waves.length }), T('はじめのコイン {n}', { n: M.gold }), T('点の倍率 ×{n}', { n: M.mul })];
  if (rec && rec.c) facts.push(T('クリア {n} 回', { n: rec.c }));
  if (rec && rec.es) facts.push(T('エンドレス最高 {n} 点', { n: fmtN(rec.es) }));
  $('mFacts').innerHTML = facts.map(f => '<span>' + esc(f) + '</span>').join('');
  $('mMods').innerHTML = '';
  const st = rec ? rec.st | 0 : 0;
  $('mGo').innerHTML = '<span class="stk"><span>' + esc(T('たたかう')) + '</span><small>' + '★'.repeat(st) + '☆'.repeat(3 - st) + '</small></span>';
  const eok = cleared(i);
  $('mEndless').disabled = !eok;
  $('mEndless').textContent = T('エンドレス');
  $('mEndNote').textContent = eok ? T('エンドレス：倒れるまで波が続く。生き残った波で点数（ランキング）') : T('エンドレスはクリアすると開きます');
  $('ovMap').hidden = false;
  try { $('mGo').focus({ preventScroll: true }); } catch (e) {}
}
$('mGo').addEventListener('click', async () => { if (!(await confirmNew())) return; if (AU) AU.ctx(); sfx('ok'); clearRun(); startGame(mapSel, 'normal'); });
$('mEndless').addEventListener('click', async () => { if (!cleared(mapSel)) return; if (!(await confirmNew())) return; if (AU) AU.ctx(); sfx('ok'); clearRun(); startGame(mapSel, 'endless'); });
$('mBack').addEventListener('click', showTitle);

// how to play
function renderHowto() {
  const li = a => '<ul>' + a.map(s => '<li>' + esc(T(s)) + '</li>').join('') + '</ul>';
  $('howBody').innerHTML = '<p class="lead">' + esc(T('いたずらなぜんまいおもちゃが、道を通って作業台の部品（20個）を盗みに来ます。台を建てて止めよう。')) + '</p>' + li([
    '空いている台座をタップ → 台をえらぶ（もう一度タップで建てる）', '建てた台をタップ → 強化・狙い（先頭／強い／近い）・売る。Lv3の次は2つの道から1つをえらぶ',
    '6種類の台：くぎ打ち（空にも）・ばね砲（範囲）・のり吹き（足止め）・竹とんぼ台（空）・電池コイル（連鎖）・道具箱（強化）',
    'よろいのブリキ亀、傘こぞう、空を飛ぶ風船ぐま…敵ごとに得意な台がちがう。下の「次」で次の波の中身が見える',
    '次の波を早めに呼ぶとボーナス。⏩ で2倍・3倍の速さ。⏸ で一時停止', '残った部品で星（18以上で★3）。クリアするとそのマップのエンドレスが開き、生き残った波で点数（ランキング）',
    '波と波のあいだで自動保存。とちゅうで閉じても、つづきから遊べる']);
}
let howtoFirst = false;
function showHowto(first) {
  howtoFirst = !!first; renderHowto();
  $('howtoGo').textContent = first ? T('やってみる') : T('とじる');
  $('howtoAlt').hidden = !first;
  hideOverlays(); $('howto').hidden = false;
  try { $('howtoGo').focus({ preventScroll: true }); } catch (e) {}
}
$('howtoGo').addEventListener('click', () => {
  store.set(HOWTO_KEY, '1'); $('howto').hidden = true;
  if (howtoFirst) { if (AU) AU.ctx(); startGame(0, 'normal'); return; }
  if (!playing()) showTitle(); else lastT = now();
});
$('howtoAlt').addEventListener('click', () => { store.set(HOWTO_KEY, '1'); if (howtoFirst) { save.tut = 1; writeSave(); } showTitle(); });
{ const s2 = KoboI18n.picker($('langPick')); if (s2) s2.id = 'langSel'; }

// ---------- sound, theme, menu ----------
function renderSound() {
  const b = $('sndBtn'), on = !(AU && AU.muted);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', T(on ? 'サウンド オン' : 'サウンド オフ'));
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  if (!AU) b.hidden = true;
}
$('sndBtn').addEventListener('click', () => { if (!AU) return; AU.toggleMute(); if (!AU.muted) sfx('ok'); });
if (AU) AU.onChange(renderSound);
function themeColor() {
  const m = document.querySelector('meta[name="theme-color"]'); if (!m) return;
  const light = UI && UI.theme ? UI.theme.resolved() === 'light' : false;
  m.setAttribute('content', light ? '#f3ebdf' : '#1f1a16');
}
let pm = null;
function openMenu() {
  if (!UI) { showTitle(); return; }
  if (pm && pm.isOpen) return;
  closeSel();
  const on = playing();
  const extra = [{ label: T('遊び方'), icon: 'help', onClick: () => { pm.close(); showHowto(false); } }];
  extra.push({ label: on ? T('ゲームをやめてマップ選びへ') : T('マップ選びへ'), icon: 'menu', onClick: () => { pm.close(); showTitle(); } });
  pm = UI.pauseMenu({
    title: T(on ? '一時停止' : 'メニュー'), home: '../', extra,
    onResume: () => { menuOpen = false; lastT = now(); acc = 0; const g = KG(); if (g) g.menuClosed(); },
    onRestart: on && run.mode !== 'daily' ? () => { menuOpen = false; const mi = run.mi, mode = run.mode; endPlay('quit'); clearRun(); startGame(mi, mode); } : on ? () => { menuOpen = false; const dk = run.dk; endPlay('quit'); clearRun(); startDaily(dk); } : undefined,
    onOpen: () => { menuOpen = true; const g = KG(); if (g) g.menuOpened(); persist(true); },
  });
  pm.open();
}

// ---------- KoboGame: real time (stops while hidden; waits for "Resume") ----------
if (window.KoboGame) KoboGame.register({
  id: GAME,
  pause() { paused = true; persist(true); },
  resume() { if (!paused) return; if (playing() && !anyOverlay()) openMenu(); paused = false; lastT = now(); acc = 0; },
  save() { persist(true); },
  isIdle: () => !playing(),
  dispose() { cancelAnimationFrame(raf); },
  daily: { start({ dateKey }) { startDaily(dateKey); } },
});
window.addEventListener('pagehide', () => persist(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); lastT = now(); });
window.addEventListener('storage', e => { if (e.key === SAVE_KEY) { save = readSave(); if (!$('ovTitle').hidden) showTitle(); } });
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(() => { themeColor(); staticDirty = true; needDraw = true; }, 0));
window.addEventListener('resize', () => layout());
try { new ResizeObserver(() => layout()).observe(wrap); } catch (e) {}

// ---------- boot ----------
let booted = false;
renderSound(); themeColor();
ART.init({ TD, T, L, reduced: () => reduceMotion.matches });
layout();
// an empty first board behind the title (map 1, nothing on it)
G = TD.create({ map: 0 }); run = { mi: 0, mode: 'normal', started: false, over: false };
needDraw = true;
const launch = PF ? PF.launch() : { daily: null };
const firstVisit = store.get(HOWTO_KEY) == null && !save.tut && !readRun();
if (launch.daily && PF) {
  const def = window.KoboGame && KoboGame.info && KoboGame.info().def;
  if (!(def && def.flags && def.flags.daily)) setTimeout(() => startDaily(launch.daily), 0);
} else if (firstVisit) showHowto(true);
else showTitle();
hud();
raf = requestAnimationFrame(loop);
booted = true;

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const api = {
    ready: () => booted,
    state: () => ({
      mode: run && run.started ? run.mode : 'title', map: G ? G.map : -1, wave: G ? G.wave : 0, total: G ? (G.total === Infinity ? -1 : G.total) : 0, cleared: G ? G.cleared : 0,
      gold: G ? G.gold : 0, lives: G ? G.lives : 0, score: G ? G.score : 0, time: G ? Math.round(G.t * 1000) : 0, t: G ? G.t : 0, over: !!(G && G.over), won: !!(G && G.won), stars: G ? G.stars : 0,
      stage: run ? run.mi + 1 : 0, paused, menuOpen, speed, cd: G ? G.cd : 0, enemies: G ? G.ne : 0, shots: G ? G.ns : 0, quiet: G ? G.quiet() : true,
      towers: G ? G.tw.map(t => ({ id: t.id, type: t.type, slot: t.slot, lv: t.lv, br: t.br, target: t.target, kills: t.kills })) : [],
      tut: run ? run.tut : null, sel: sel ? (sel.kind === 'slot' ? 'slot:' + sel.slot : 'tower:' + sel.t.id) : null, pick: pickType,
      ring: !$('ring').hidden, panel: !$('panel').hidden,
      title: !$('ovTitle').hidden, mapCard: !$('ovMap').hidden, result: !$('ovResult').hidden, howto: !$('howto').hidden, info: !$('ovInfo').hidden,
      save: JSON.parse(JSON.stringify(save)), last: lastResult, mods: G ? G.mods : {}, dk: run ? run.dk : null,
    }),
    win() { if (!playing()) return false; G.forceWin(); return true; },
    lose() { if (!playing()) return false; G.forceLose(); return true; },
    step(n) { // the auto-player plays n decision rounds (about 0.3 s each)
      if (!playing()) return 0;
      if (!bot || bot.G !== G) { bot = TD.bot(G, {}); bot.G = G; }
      for (let i = 0; i < (n || 1) && !G.over; i++) { bot.think(); for (let k = 0; k < 18 && !G.over; k++) G.step(); }
      if (G.over) onOver();
      pumpEvents(); needDraw = true; return G.wave;
    },
    tutorial: () => ({ step: run ? run.tut : null, done: !!save.tut }),
  };
  let bot = null;
  window.__kb = Object.assign(window.__kb || {}, api);
  const page = (x, y) => { const r = cv.getBoundingClientRect(); return { x: r.left + sx(x, y), y: r.top + sy(x, y) }; };
  window.__td = {
    api, TD, get G() { return G; }, get save() { return save; }, view,
    start: (mi, mode) => { startGame(mi || 0, mode || 'normal'); return api.state(); },
    daily: dk => { startDaily(dk); return api.state(); },
    slotPoint: i => { const S = G.I.slots[i]; return page(S.cx, S.cy); },
    towerPoint: id => { const t = G.tw.find(x => x.id === id); return t ? page(t.x, t.y) : null; },
    tutSlot: () => tutSlotCache,
    freeSlots: () => G.I.slots.map((s, i) => i).filter(i => !G.slotTw[i]),
    emptyPoint: () => { // a point on the board that is not near any pad
      for (let y = 0.5; y < TD.ROWS; y += 0.5) for (let x = 0.5; x < TD.COLS; x += 0.5) if (G.slotAt(x, y, 1.2) < 0) return page(x, y);
      return null;
    },
    gold: n => { G.gold = n; needDraw = true; },
    run: secs => { const n = Math.round((secs || 1) / TD.DT); for (let i = 0; i < n && !G.over; i++) G.step(); if (G.over) onOver(); pumpEvents(); needDraw = true; return api.state(); },
    auto: n => api.step(n),
    stress(n, w) { // fill the field with toys (performance check); w = the wave whose toughness they get
      const I = G.I; w = w == null ? Math.max(0, G.wave - 1) : w;
      for (let i = 0; i < n; i++) { G.q.push({ t: G.t + i * 0.02, k: 'bfstua'[i % 6], ent: i % I.ent.length, air: 'bfstua'[i % 6] === 'a', ai: 0, w }); }
      G.q.sort((a, b) => a.t - b.t); G.qi = 0;
      G.left[w] = (G.left[w] || 0) + n;
      return n;
    },
    fps(ms) { return new Promise(res => { let f = 0; const t0 = performance.now(); const tick = () => { f++; if (performance.now() - t0 < ms) requestAnimationFrame(tick); else res(Math.round(f * 1000 / (performance.now() - t0))); }; requestAnimationFrame(tick); }); },
    setSpeed: s => { speed = s; },
    persist: () => persist(true), readRun,
    title: showTitle, howto: () => showHowto(false), menu: openMenu,
    thumbScene() { // a busy moment on map 6 (flyers and toys, a dozen towers) for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb');
      DEBUG_NOSAVE = true;
      startGame(5, 'normal', { tut: null });
      G.wave = 9; G.gold = 4000;
      const b = TD.bot(G, {});
      for (let i = 0; i < 40; i++) { b.think(); for (let k = 0; k < 7; k++) b.think(); }
      G.cd = -1; G.callWave();
      for (let k = 0; k < 60 * 11; k++) G.step();
      evRead = G.evN;
      for (let k = 0; k < 24; k++) G.step();
      for (let i = evRead; i < G.evN; i++) if (G.events[i % G.events.length].k === 20) evRead = i + 1;
      run.started = false; pumpEvents(); layout(); needDraw = true; draw(now() / 1000);
      return true;
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
