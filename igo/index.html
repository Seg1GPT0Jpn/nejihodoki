/* 囲碁工房: a kaya-wood board on a workshop bench. The stones keep their own colours in both themes; the room follows the light / dark theme. --kb-* are the shared tokens re-tinted; --ig-* are this game's own. */
:root, :root[data-kb-theme="dark"] {

  --kb-scrim: rgba(8, 6, 3, .8); --kb-toast-bg: rgba(14, 10, 5, .95); --kb-focus: #ffe08a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --ig-wood: #d9ad63; --ig-wood2: #cf9f52; --ig-ln: #4b3416; --ig-frame: #7a5530; --ig-frame2: #55391c; --ig-rim: rgba(255, 224, 170, .3);
  --ig-panel: rgba(255, 240, 210, .06); --ig-line: rgba(230, 210, 170, .16); --ig-card: linear-gradient(#2a2318, #1f1910);
  --ig-go: linear-gradient(#f2cf74, #d09a2c); --ig-go-ink: #2a1d00; --ig-go-shadow: #8a5d10;
  --ig-key: linear-gradient(#3a3022, #2a2218); --ig-key-shadow: #0a0704;
  --ig-title: linear-gradient(90deg, #f5d88a, #e9a66a 55%, #f2f2f2);
  --ig-bad: #ff8d7d; --ig-ok: #6fe3b0;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f3eee2; --kb-surface: #ffffff; --kb-surface-2: #f8f2e5; --kb-sunken: #e8e0cc; --kb-line: #d3c8ae;
    --kb-ink: #2a2418; --kb-dim: #665c46;
    --kb-accent: #a86a08; --kb-accent-ink: #ffffff; --kb-accent-text: #7e4d00; --kb-accent-soft: rgba(168, 106, 8, .12);
    --kb-scrim: rgba(42, 36, 24, .45); --kb-toast-bg: rgba(42, 36, 24, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(42, 36, 24, .2);
    --ig-wood: #e6bd78; --ig-wood2: #dcb066; --ig-ln: #5a3d1a; --ig-frame: #a97c50; --ig-frame2: #8a6238; --ig-rim: rgba(255, 255, 255, .5);
    --ig-panel: rgba(42, 36, 24, .05); --ig-line: #dcd2ba; --ig-card: linear-gradient(#ffffff, #f8f2e5);
    --ig-go: linear-gradient(#dba02f, #a86a08); --ig-go-ink: #ffffff; --ig-go-shadow: #744605;
    --ig-key: linear-gradient(#ffffff, #f3ecdc); --ig-key-shadow: #c3b9a2;
    --ig-title: linear-gradient(90deg, #7e4d00, #a24a1c 55%, #3a3a3a);
    --ig-bad: #c43b27; --ig-ok: #0f8a5c;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f3eee2; --kb-surface: #ffffff; --kb-surface-2: #f8f2e5; --kb-sunken: #e8e0cc; --kb-line: #d3c8ae;
  --kb-ink: #2a2418; --kb-dim: #665c46;
  --kb-accent: #a86a08; --kb-accent-ink: #ffffff; --kb-accent-text: #7e4d00; --kb-accent-soft: rgba(168, 106, 8, .12);
  --kb-scrim: rgba(42, 36, 24, .45); --kb-toast-bg: rgba(42, 36, 24, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(42, 36, 24, .2);
  --ig-wood: #e6bd78; --ig-wood2: #dcb066; --ig-ln: #5a3d1a; --ig-frame: #a97c50; --ig-frame2: #8a6238; --ig-rim: rgba(255, 255, 255, .5);
  --ig-panel: rgba(42, 36, 24, .05); --ig-line: #dcd2ba; --ig-card: linear-gradient(#ffffff, #f8f2e5);
  --ig-go: linear-gradient(#dba02f, #a86a08); --ig-go-ink: #ffffff; --ig-go-shadow: #744605;
  --ig-key: linear-gradient(#ffffff, #f3ecdc); --ig-key-shadow: #c3b9a2;
  --ig-title: linear-gradient(90deg, #7e4d00, #a24a1c 55%, #3a3a3a);

}

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 5px; }

.pl { flex: 1 1 0; min-width: 0; max-width: 250px; display: flex; align-items: center; gap: 7px; box-sizing: border-box; padding: 3px 9px 3px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--ig-panel); transition: border-color .2s, background .2s; }
.pl.on { border-color: var(--kb-accent); background: var(--kb-accent-soft); }

.pl .bd.off { background: #ff8d7d; color: #2b0b06; } .pl .bd.away { background: #ffd078; color: #2b1d00; } .pl .bd.tm { background: var(--kb-accent); color: var(--kb-accent-ink); }

#stage { position: relative; flex: 1 1 0; min-height: 120px; display: grid; place-items: center; }
#stage.zoom { display: block; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
#stage.zoom #board { margin: 0 auto; touch-action: pan-x pan-y; }
/* the board: n x n crossings. Each cell draws its own piece of the lines (the edge cells draw half of a line) */
#board { position: relative; width: var(--bs, 300px); height: var(--bs, 300px); flex: none; box-sizing: border-box; display: grid; grid-template-columns: repeat(var(--n, 9), 1fr); grid-template-rows: repeat(var(--n, 9), 1fr);
  padding: var(--pad, 4px); border-radius: clamp(8px, 3%, 16px); background: linear-gradient(145deg, var(--ig-frame), var(--ig-frame2)); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px var(--ig-rim); touch-action: manipulation; outline-offset: 3px; }
#board::before { content: ""; position: absolute; inset: var(--pad, 4px); border-radius: 3px; background: repeating-linear-gradient(92deg, rgba(120, 80, 30, .07) 0 2px, rgba(255, 235, 190, .05) 2px 7px), linear-gradient(120deg, var(--ig-wood), var(--ig-wood2)); pointer-events: none; }
#board .row { display: contents; }
.cell { --hp: 0%; --hw: 100%; --vp: 0%; --vh: 100%; position: relative; box-sizing: border-box; cursor: default; display: grid; place-items: center; outline: none; -webkit-tap-highlight-color: transparent;
  background-image: linear-gradient(var(--ig-ln), var(--ig-ln)), linear-gradient(var(--ig-ln), var(--ig-ln)); background-repeat: no-repeat; background-position: var(--hp) 50%, 50% var(--vp); background-size: var(--hw) 1px, 1px var(--vh); }
.cell.cl { --hp: 100%; --hw: 50%; } .cell.cr { --hp: 0%; --hw: 50%; } .cell.ct { --vp: 100%; --vh: 50%; } .cell.cb { --vp: 0%; --vh: 50%; }
.cell.star::before { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: var(--ig-ln); }
.cell.lg { cursor: pointer; }
.gh { position: absolute; inset: 4%; border-radius: 50%; pointer-events: none; opacity: 0; box-sizing: border-box; transition: opacity .12s; }
@media (hover: hover) { .cell.lg:not(.pv):hover .gh { opacity: .5; background: var(--gh, rgba(20, 20, 30, .6)); } }
.cell.pv .gh { opacity: 1; background: var(--gh, rgba(20, 20, 30, .55)); border: 2px dashed var(--kb-accent); }
.cell.ht .gh { opacity: 1; background: rgba(255, 213, 74, .3); box-shadow: 0 0 0 3px #ffd54a, 0 0 14px 3px rgba(255, 213, 74, .85); animation: glow 1s ease-in-out infinite; }
.cell.bad .gh { opacity: 1; background: rgba(255, 141, 125, .45); box-shadow: 0 0 0 3px #ff8d7d; }
.cell.out::after { content: ""; position: absolute; inset: 0; background: rgba(40, 28, 10, .38); pointer-events: none; z-index: 3; }
.cell.cur { z-index: 2; } body.kbd .cell.cur::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2.5px var(--kb-focus); pointer-events: none; z-index: 4; }

.st { position: absolute; inset: 3%; border-radius: 50%; background-size: 100% 100%; box-shadow: 0 1.5px 3px rgba(0, 0, 0, .5); pointer-events: none; z-index: 1; display: grid; place-items: center; }
.st.new { animation: drop .25s ease-out; }
.st .nm { font: 800 calc(var(--bs, 300px) / var(--n, 9) * .4)/1 var(--kb-font-body); font-variant-numeric: tabular-nums; letter-spacing: -.04em; pointer-events: none; }

.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }
.qm:first-child { margin-top: 0; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.gdesc { margin: 8px 0 0; font-size: 12.5px; font-weight: 500; color: var(--kb-ink); line-height: 1.5; }
.gbest { margin: 4px 0 0; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); }
.rank { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--ig-panel); border: 1px solid var(--ig-line); font-size: 13px; font-weight: 800; text-align: left; }
.rank li.me { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rank li .dk { flex: none; width: 20px; height: 20px; border-radius: 50%; background-size: 100% 100%; }
.rank li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .sc { flex: none; font-size: 12px; color: var(--kb-dim); font-variant-numeric: tabular-nums; }
.rank li .sc b { color: var(--kb-ink); font-size: 15px; }
.big { font-family: var(--kb-font-display); font-size: 30px; line-height: 1.1; color: var(--kb-ink); }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); }
.howto li { margin: 3px 0; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--ig-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { width: auto; margin: 0; }
.pzg { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; margin: 8px 0; }
.pzc { min-height: 44px; border-radius: 10px; border: 1px solid var(--ig-line); background: var(--ig-panel); color: var(--kb-ink); font: 800 12px var(--kb-font-body); cursor: pointer; padding: 2px; position: relative; }
.pzc.ok { border-color: var(--ig-ok); color: var(--ig-ok); } .pzc small { display: block; font-size: 9.5px; font-weight: 500; color: var(--kb-dim); }
.pzc.ok::after { content: "✓"; position: absolute; right: 4px; top: 1px; font-size: 10px; }
.pzh { margin: 10px 0 0; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); text-align: left; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
body.thumb h1, body.thumb .icon, body.thumb .back, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #ctl, body.thumb #status, body.thumb .info, body.thumb header, body.thumb #bar, body.thumb #sub { display: none !important; }
.sgf-note { font-size: 11.5px; color: var(--kb-dim); margin: 4px 0; text-align: left; }
@keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
@keyframes glow { 50% { box-shadow: 0 0 0 3px #ffd54a, 0 0 20px 6px rgba(255, 213, 74, .95); } }
@keyframes drop { from { transform: scale(1.6); opacity: 0; } 70% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .st, .panel, .overlay { animation: none !important; } .cell.ht .gh { animation: none; } }
@media (max-height: 600px) { .panel { padding: 10px 12px 8px; } .panel h2.logo { font-size: 22px; } .btn { min-height: 46px; margin-top: 6px; } .og { margin-top: 5px; } }
@media (max-width: 379px) { h1 { visibility: hidden; } .pl .nm small { display: none; } .act { font-size: 12px; } .act small { display: none; } }
@media (orientation: landscape) and (max-height: 520px) {
  header { padding-top: 0; } .info { margin: 0 0 2px; }
  #main { display: grid; max-width: 1000px; grid-template-columns: minmax(0, 1fr) minmax(200px, 40%); grid-template-rows: auto auto auto 1fr; grid-template-areas: "stage bar" "stage status" "stage sub" "stage ctl"; align-content: stretch; column-gap: 10px; }
  #stage { grid-area: stage; } #bar { grid-area: bar; flex-direction: column; align-items: stretch; } .pl { max-width: none; } #status { grid-area: status; } #sub { grid-area: sub; } #ctl { grid-area: ctl; align-self: start; flex-wrap: wrap; }
  .panel { max-width: 700px; } .howto { max-width: 720px; }
  .act { min-height: 44px; } #ctl { min-height: 44px; } #status { min-height: 30px; padding: 1px 8px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 data-i18n>囲碁工房</h1>
      <button class="icon" id="zoomBtn" type="button" aria-label="拡大" data-i18n-attr="aria-label" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></svg></button>
      <button class="icon" id="viewBtn" type="button" aria-label="表示" data-i18n-attr="aria-label" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
      <button class="icon" id="sndBtn" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
      <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div class="info">
      <span class="chip mode" id="iGame"></span>
      <span class="chip turn" id="iTurn"></span>
      <span class="chip acc" id="iBest"></span>
    </div>
  </header>
  <div id="main">
    <div id="bar">
      <div class="pl" id="plB"><span class="dk" id="dkB"></span><span class="nm"><b id="nB"></b><small id="sB"></small></span><span class="bd" id="bB" hidden></span><span class="n" id="cB">0</span></div>
      <div class="pl" id="plW"><span class="dk" id="dkW"></span><span class="nm"><b id="nW"></b><small id="sW"></small></span><span class="bd" id="bW" hidden></span><span class="n" id="cW">0</span></div>
    </div>
    <div id="stage"><div id="board" role="grid" aria-label="碁盤" data-i18n-attr="aria-label"></div></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="sub"></div>
    <div id="ctl"></div>
  </div>
</div>

<div class="overlay" id="ovTitle" hidden role="dialog" aria-modal="true" aria-labelledby="tTitle">
  <div class="panel">
    <h2 class="logo" id="tTitle" data-i18n>囲碁工房</h2>
    <div class="scroll opts">
      <button class="qm" id="tDaily" type="button"><span><b data-i18n>今日の詰碁</b><small id="tDailySub"></small></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></span></button>
      <button class="qm" id="tOnline" type="button"><span><b data-i18n>オンライン対戦</b><small id="tOnlineSub" data-i18n>友だちとコードで・クイックマッチ</small></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></span></button>
      <button class="qm" id="tResume" type="button" hidden><span><b data-i18n>つづきから</b><small id="tResumeSub"></small></span><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></span></button>
      <p class="gdesc" id="tDesc"></p>
      <p class="gbest" id="tBest"></p>
      <div id="tOpts"></div>
    </div>
    <div class="foot">
      <button class="btn" id="tPlay" type="button" data-i18n>CPUと対局</button>
      <div class="row2"><button class="btn sub" id="tPass" type="button" data-i18n>ふたりで（1台）</button><button class="btn sub" id="tPuz" type="button" data-i18n>詰碁</button></div>
      <div class="row2"><button class="btn sub" id="tSgf" type="button" data-i18n>棋譜（SGF）</button><button class="btn sub" id="tHow" type="button" data-i18n>ルール</button></div>
      <a class="btn link" href="../" data-i18n>ゲーム一覧へ</a>
    </div>
  </div>
</div>

<div class="overlay" id="ovResult" hidden role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="panel">
    <h2 id="rTitle"></h2>
    <div class="scroll">
      <p id="rSub"></p>
      <ol class="rank" id="rRank"></ol>
      <div class="big" id="rBig"></div>
      <div id="rNew" class="newrec" hidden></div>
      <p id="rNote"></p>
    </div>
    <button class="btn" id="rAgain" type="button" data-i18n>もう一度</button>
    <div class="row2"><button class="btn sub" id="rReview" type="button" data-i18n>検討する</button><button class="btn sub" id="rSgf" type="button" data-i18n>棋譜（SGF）</button></div>
    <div class="row2"><button class="btn sub" id="rBoard" type="button" data-i18n>盤を見る</button><button class="btn sub" id="rTitleBtn" type="button" data-i18n>タイトルへ</button></div>
  </div>
</div>

<div class="overlay" id="ovView" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="panel">
    <h2 id="vTitle" data-i18n>表示</h2>
    <div class="scroll opts" id="vBody"></div>
    <button class="btn" id="vClose" type="button" data-i18n>とじる</button>
  </div>
</div>

<div class="overlay" id="ovSgf" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="panel">
    <h2 id="sTitle" data-i18n>棋譜（SGF）</h2>
    <div class="scroll opts">
      <div class="og" id="sOutBox"><div class="ol" data-i18n>書き出し（コピーして使えます）</div><textarea id="sOut" readonly aria-label="SGF" rows="4"></textarea><button class="btn sub" id="sCopy" type="button" data-i18n>コピー</button></div>
      <div class="og"><div class="ol" data-i18n>読みこみ（SGF を貼りつけ）</div><textarea id="sIn" aria-label="SGF input" rows="4" placeholder="(;GM[1]SZ[9];B[ee];W[ce])"></textarea><p class="sgf-note" id="sErr"></p><button class="btn" id="sLoad" type="button" data-i18n>読みこんで検討する</button></div>
    </div>
    <button class="btn link" id="sClose" type="button" data-i18n>とじる</button>
  </div>
</div>

<div class="overlay" id="ovPuz" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="panel">
    <h2 id="pTitle" data-i18n>詰碁</h2>
    <p id="pSub"></p>
    <div class="scroll"><div id="pList"></div></div>
    <button class="btn" id="pClose" type="button" data-i18n>とじる</button>
  </div>
</div>

<div class="overlay" id="howto" hidden role="dialog" aria-modal="true" aria-labelledby="howtoTitle" data-kb-howto>
  <div class="panel howto">
    <h2 id="howtoTitle"></h2>
    <div class="scroll" id="howBody"></div>
    <div class="langrow"><label for="langSel" data-i18n>言語 / Language</label><span id="langPick"></span></div>
    <button class="btn" id="howtoGo" type="button" data-i18n>とじる</button>
  </div>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script src="art.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="cpu.js"></script>
<script src="sgf.js"></script>
<script src="tsumego.js"></script>
<script src="puzzles.js"></script>
<script src="online.js"></script>
<script src="../common/turnroom.js"></script>
<script src="../common/game.js"></script>
<script src="app.js"></script>
<script src="../firebase-config.js"></script>
<script src="../common/cloud.js"></script>
<script>KoboCloud.sync({ 'kusoge.igo.save': 'newest' }, { reloadOnNewer: true });</script>
</body>
</html>
