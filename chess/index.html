<style>
/* チェス工房: a wooden board on a workshop bench. The pieces keep their own colours in both themes (cream and charcoal "turned wood");
   the squares, the bench and the room follow the light / dark theme. --kb-* are the shared tokens re-tinted; --ch-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #17161d; --kb-surface: #22212b; --kb-surface-2: #2b2a36; --kb-sunken: #100f15; --kb-line: #3d3b4b;
  --kb-ink: #f3f1ec; --kb-dim: #b4b0c0;
  --kb-accent: #f0c04f; --kb-accent-ink: #2b1f00; --kb-accent-text: #ffd57a; --kb-accent-soft: rgba(240, 192, 79, .16);
  --kb-scrim: rgba(6, 6, 10, .8); --kb-toast-bg: rgba(12, 12, 18, .95); --kb-focus: #ffe08a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --ch-sq1: #c9b690; --ch-sq2: #84613f; --ch-frame: #5a3f27; --ch-frame2: #3f2b18; --ch-rim: rgba(255, 220, 160, .28);
  --ch-panel: rgba(235, 232, 250, .06); --ch-line: rgba(200, 196, 225, .16); --ch-card: linear-gradient(#2a2933, #1f1e27);
  --ch-go: linear-gradient(#ffd77d, #efa83a); --ch-go-ink: #2b1d00; --ch-go-shadow: #94620f;
  --ch-key: linear-gradient(#35343f, #2a2933); --ch-key-shadow: #0b0a10;
  --ch-title: linear-gradient(90deg, #ffd98a, #c9b0f0 55%, #f2f2f2);
  --ch-bad: #ff8d7d; --ch-ok: #6fe3b0; --ch-lab: rgba(255, 245, 225, .85); --ch-lab2: rgba(40, 28, 14, .7);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f1eee6; --kb-surface: #ffffff; --kb-surface-2: #f6f2e9; --kb-sunken: #e4ded0; --kb-line: #cfc6b2;
    --kb-ink: #1f2a2e; --kb-dim: #566a72;
    --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
    --kb-scrim: rgba(31, 42, 46, .45); --kb-toast-bg: rgba(31, 42, 46, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(31, 42, 46, .2);
    --ch-sq1: #f0e2c4; --ch-sq2: #b58a5a; --ch-frame: #a97c50; --ch-frame2: #8a6238; --ch-rim: rgba(255, 255, 255, .5);
    --ch-panel: rgba(31, 42, 46, .05); --ch-line: #d8d0bd; --ch-card: linear-gradient(#ffffff, #f6f2e9);
    --ch-go: linear-gradient(#e0a02f, #b8730a); --ch-go-ink: #ffffff; --ch-go-shadow: #7a4b05;
    --ch-key: linear-gradient(#ffffff, #f1ece0); --ch-key-shadow: #c3b9a2;
    --ch-title: linear-gradient(90deg, #8a5300, #5b3d9a 55%, #3a3a3a);
    --ch-bad: #c43b27; --ch-ok: #0f8a5c; --ch-lab: rgba(255, 245, 225, .9); --ch-lab2: rgba(70, 45, 20, .75);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f1eee6; --kb-surface: #ffffff; --kb-surface-2: #f6f2e9; --kb-sunken: #e4ded0; --kb-line: #cfc6b2;
  --kb-ink: #1f2a2e; --kb-dim: #566a72;
  --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
  --kb-scrim: rgba(31, 42, 46, .45); --kb-toast-bg: rgba(31, 42, 46, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(31, 42, 46, .2);
  --ch-sq1: #f0e2c4; --ch-sq2: #b58a5a; --ch-frame: #a97c50; --ch-frame2: #8a6238; --ch-rim: rgba(255, 255, 255, .5);
  --ch-panel: rgba(31, 42, 46, .05); --ch-line: #d8d0bd; --ch-card: linear-gradient(#ffffff, #f6f2e9);
  --ch-go: linear-gradient(#e0a02f, #b8730a); --ch-go-ink: #ffffff; --ch-go-shadow: #7a4b05;
  --ch-key: linear-gradient(#ffffff, #f1ece0); --ch-key-shadow: #c3b9a2;
  --ch-title: linear-gradient(90deg, #8a5300, #5b3d9a 55%, #3a3a3a);
  --ch-bad: #c43b27; --ch-ok: #0f8a5c; --ch-lab: rgba(255, 245, 225, .9); --ch-lab2: rgba(70, 45, 20, .75);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 62%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--ch-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ch-line); background: var(--ch-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .opt:focus-visible, .tog:focus-visible, .act:focus-visible, .qm:focus-visible, #grid:focus-visible, summary:focus-visible, #mvIn:focus-visible, .pk:focus-visible, textarea:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 1px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--ch-panel); border: 1px solid var(--ch-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn.you { background: var(--kb-accent-soft); border-color: var(--kb-accent); color: var(--kb-accent-text); }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 4px; }
.pl { flex: none; display: flex; align-items: center; gap: 7px; box-sizing: border-box; padding: 2px 8px 2px 6px; min-height: 36px; border-radius: 14px; border: 2px solid transparent; background: var(--ch-panel); transition: border-color .2s, background .2s; }
.pl.on { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.pl .dk { flex: none; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.pl .dk.w { background: #f6ecd3; box-shadow: inset 0 0 0 2px #3b2a17, 0 1px 3px rgba(0, 0, 0, .35); } .pl .dk.b { background: #4a4658; box-shadow: inset 0 0 0 2px #13111a, 0 1px 3px rgba(0, 0, 0, .35); }
.pl .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; }
.pl .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.pl .nm small { display: flex; align-items: center; gap: 1px; min-height: 14px; font-size: 10.5px; font-weight: 800; color: var(--kb-dim); white-space: nowrap; overflow: hidden; }
.pl .nm small svg { width: 14px; height: 14px; flex: none; }
.pl .nm small em { font-style: normal; margin-left: 4px; }
.pl .ck { flex: none; font: 400 20px/1 var(--kb-font-display); font-variant-numeric: tabular-nums; min-width: 2.7em; text-align: right; padding: 2px 6px; border-radius: 9px; background: var(--ch-panel); }
.pl.on .ck { background: var(--kb-accent); color: var(--kb-accent-ink); }
.pl .ck.low { background: var(--ch-bad); color: #2b0b06; }
.pl .bd { flex: none; padding: 0 6px; border-radius: 9px; background: rgba(128, 150, 160, .3); color: var(--kb-ink); font: 800 10px var(--kb-font-body); }
.pl .bd.off { background: #ff8d7d; color: #2b0b06; } .pl .bd.away { background: #ffd078; color: #2b1d00; }
#stage { position: relative; flex: 1 1 0; min-height: 120px; display: flex; align-items: center; justify-content: center; gap: 6px; }
#evalbar { flex: none; align-self: center; position: relative; width: 16px; border-radius: 8px; overflow: hidden; background: #2a2833; box-shadow: inset 0 0 0 1px var(--ch-line); }
#evalbar .wh { position: absolute; left: 0; right: 0; bottom: 0; background: #f6ecd3; transition: height .3s; }
#evalbar b { position: absolute; left: 0; right: 0; font: 800 9px var(--kb-font-body); text-align: center; color: #888; pointer-events: none; }
#evalbar b.top { top: 2px; } #evalbar b.bot { bottom: 2px; }
#board { position: relative; flex: none; width: var(--bs, 300px); height: var(--bs, 300px); box-sizing: border-box; padding: clamp(3px, 1.6%, 9px); border-radius: clamp(8px, 3%, 16px); background: linear-gradient(145deg, var(--ch-frame), var(--ch-frame2)); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px var(--ch-rim); }
#grid { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); touch-action: none; outline-offset: 3px; border-radius: 3px; overflow: hidden; }
.cell { position: relative; box-sizing: border-box; background: var(--ch-sq1); cursor: default; outline: none; }
.cell.dk { background: var(--ch-sq2); }
.cell.dk::before, .cell.dk::after { color: var(--ch-lab); }
.cell[data-rl]::before { content: attr(data-rl); position: absolute; left: 2px; top: 0; font: 800 clamp(7px, 2.3vw, 10px) var(--kb-font-body); color: var(--ch-lab2); pointer-events: none; z-index: 1; }
.cell[data-fl]::after { content: attr(data-fl); position: absolute; right: 2px; bottom: 0; font: 800 clamp(7px, 2.3vw, 10px) var(--kb-font-body); color: var(--ch-lab2); pointer-events: none; z-index: 1; }
body.nocoord .cell::before, body.nocoord .cell::after { content: none; }
.cell .hl { position: absolute; inset: 0; pointer-events: none; }
.cell.last .hl { background: rgba(255, 210, 70, .42); }
.cell.sel .hl { background: rgba(94, 214, 170, .55); }
.cell.ht .hl { background: rgba(80, 160, 255, .5); box-shadow: inset 0 0 0 3px #4aa0ff; }
.cell.pre .hl { background: rgba(80, 130, 255, .4); box-shadow: inset 0 0 0 3px rgba(100, 150, 255, .9); }
.cell.chk .hl { background: radial-gradient(circle, rgba(255, 60, 60, .95) 0, rgba(255, 60, 60, .55) 45%, rgba(255, 60, 60, 0) 72%); }
.cell.bad .hl { background: rgba(255, 90, 70, .5); }
.cell.lg .hl::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; margin: -15% 0 0 -15%; border-radius: 50%; background: rgba(25, 35, 35, .32); }
.cell.lg.cap .hl::after { width: 92%; height: 92%; margin: -46% 0 0 -46%; background: transparent; box-shadow: inset 0 0 0 4px rgba(25, 35, 35, .34); }
.cell.lg { cursor: pointer; }
body.kbd .cell.cur .hl { box-shadow: inset 0 0 0 3px var(--kb-focus); }
.cell.shake { animation: shake .3s; }
#pcs { position: absolute; inset: 0; pointer-events: none; }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .2s ease-out; filter: drop-shadow(0 1.5px 1.5px rgba(0, 0, 0, .35)); will-change: transform; z-index: 2; }
.pc.w { --pf: #f6ecd3; --ps: #3b2a17; --pa: #b79d6a; } .pc.b { --pf: #4a4658; --ps: #13111a; --pa: #9a94b0; }
.pc.drag { transition: none; z-index: 6; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .45)); }
.pc.cap { transition: opacity .2s, transform .2s; opacity: 0; z-index: 1; }
.pc.pop { animation: pop .3s ease-out; }
#board.inst .pc { transition: none !important; animation: none !important; }
#arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
#arrows line { stroke-linecap: round; } #arrows path { stroke-linejoin: round; }
#status { flex: none; min-height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 3px 10px; border-radius: 14px; background: var(--ch-panel); border: 1px solid var(--ch-line); font-size: 12.5px; font-weight: 800; text-align: center; line-height: 1.3; }
#status.you { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
#status #note { font-size: 11.5px; font-weight: 500; color: var(--kb-dim); }
#status #note:empty { display: none; }
#mvrow { flex: none; display: flex; align-items: center; gap: 6px; min-height: 34px; }
#strip { flex: 1 1 auto; min-width: 0; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--ch-line); background: var(--ch-panel); color: var(--kb-ink); font: 800 12.5px var(--kb-font-body); text-align: left; overflow: hidden; white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; }
#strip span { overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; } #strip span bdi { direction: ltr; unicode-bidi: isolate; }
#strip i { flex: none; font-style: normal; color: var(--kb-dim); font-weight: 500; font-size: 11px; }
#mvIn { flex: none; width: 104px; height: 34px; box-sizing: border-box; padding: 0 8px; border-radius: 12px; border: 1px solid var(--ch-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 13px var(--kb-font-body); -webkit-user-select: text; user-select: text; }
#mvIn.bad { border-color: var(--ch-bad); animation: shake .3s; }
#ctl { flex: none; display: flex; gap: 5px; justify-content: center; flex-wrap: nowrap; min-height: 48px; }
.act { flex: 1 1 0; min-width: 0; max-width: 150px; min-height: 48px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--ch-line); background: var(--ch-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--ch-key-shadow); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 3px; line-height: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.act svg { width: 18px; height: 18px; flex: none; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ch-key-shadow); }
.act.go { background: var(--ch-go); color: var(--ch-go-ink); border-color: transparent; box-shadow: 0 3px 0 var(--ch-go-shadow); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }

.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.panel { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ch-card); border: 1px solid var(--ch-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--ch-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 25px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--ch-go); color: var(--ch-go-ink); box-shadow: 0 3px 0 var(--ch-go-shadow); font: 800 16px var(--kb-font-body); text-decoration: none; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ch-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--ch-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--ch-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn.danger { background: var(--ch-panel); color: var(--ch-bad); box-shadow: none; border: 1px solid var(--ch-bad); font-size: 13.5px; min-height: 44px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.opts { text-align: left; }
.og { margin: 8px 0 0; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--ch-panel); border: 1px solid var(--ch-line); }
.seg.wrap { flex-wrap: wrap; } .seg.wrap .opt { flex: 1 1 28%; }
.opt { flex: 1; min-width: 0; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 12.5px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.2; }
.opt small { display: block; font-size: 10.5px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 6px; padding: 4px 10px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--ch-line); background: var(--ch-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; text-align: left; }
.tog span { flex: 1; } .tog small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--kb-line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; text-align: left; }
.qm:first-child { margin-top: 0; }

.rank li .no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-surface); color: var(--kb-accent-text); font: 400 14px var(--kb-font-display); }

.rank li .sc { flex: none; font-size: 12px; color: var(--kb-dim); font-variant-numeric: tabular-nums; }
.big { font-family: var(--kb-font-display); font-size: 30px; line-height: 1.1; color: var(--kb-ink); }

body.thumb h1, body.thumb .icon, body.thumb .back, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #ctl, body.thumb #status, body.thumb .info, body.thumb header, body.thumb #mvrow { display: none !important; }

// FEN か PGN の文字から Game を作る。{ game } か { error: 文 }
function loadText(txt) {
  txt = String(txt || '').trim();
  if (!/^\s*\[|\d\.|\s[a-hNBRQKO][a-h1-8x]/.test(txt) || /^[rnbqkpRNBQKP1-8]+\/[rnbqkpRNBQKP1-8\/]+\s+[wb]/.test(txt)) {
    if (txt.indexOf('/') >= 0 && !/\[/.test(txt)) {
      const p = E.parseFen(txt); if (p.error) return { error: p.error === 'kings' || p.error === 'pawns' || p.error === 'check' || p.error === 'count' ? T('黒のキングが2つあるなど、ふつうの局面ではありません') : T('FEN の形がちがいます') };
      return { game: new E.Game(txt) };
    }
  }
  const r = E.fromPgn(txt);
  if (r.error) return { error: r.error === 'fen' ? T('FEN の形がちがいます') : T('PGN の {n} 手目 {t} が読めません', { n: Math.ceil(r.ply / 2), t: r.token }) };
  bump('pgn'); writeSave();
  return { game: r.game };
}

function dailyInfo(dk) {

  return { dk, seed: PF.dailySeed(GAME, dk) };
}
function startPuzzle(dk, practice) {
  const d = dailyInfo(dk); if (!d) return;
  stopTimers(); hideOverlays();
  if (S && S.mode === 'online' && TR && !S.over) TR.leave();
  const idx = AI.dailySet(d.seed, BANK), same = save.dl.last === d.dk;
  const done = same && !practice ? save.dl.r.length : 0;
  S = mkSession({ mode: 'puzzle', level: 6, pz: { dk: d.dk, idx, i: Math.min(done, 5), res: same && !practice ? save.dl.r.map(x => x.slice()) : [], practice: !!practice, done: false, fails: 0, hint: 0, step: 0 } });
  if (S.pz.i >= 5) { S.pz.i = 4; S.over = true; S.game = new E.Game(); showPuzzleSummary(); return; }
  $('evalbar').hidden = true; fit();
  emit('play_start', { mode: practice ? 'practice' : 'daily', dateKey: practice ? undefined : d.dk });
  loadPuzzle();
}
function loadPuzzle() {

  pz.p = p; pz.done = false; pz.fails = 0; pz.hint = 0; pz.step = 0; pz.ok = false; pz.line = [];
  S.game = new E.Game(p.f); S.me = S.game.pos.side; B.flipped = S.me === 1; S.sel = -1; S.hint = null; S.last = null; S.bad = -1; S.over = false; S.busy = false; S.t0 = Date.now(); S.lgPly = -1; S.arrow = null;
  buildPieces(S.game); S.cur = S.me ? 52 : 12;

  $('ctl').dataset.key = ''; renderCtl();
}
const pzGoal = p => (p.k === 'm1' ? T('1手でチェックメイト') : p.k === 'm2' ? T('2手でチェックメイト') : p.k === 'm3' ? T('3手でチェックメイト') : T('駒を取って得をする手を見つけよう'));
function renderPuzzleStatus() {
  const pz = S.pz; setStatus(T('{c}の番です。{t}', { c: COLOR_NAME(S.me), t: pzGoal(pz.p) }), true, pz.step ? T('つづけて、チェックメイトまで') : T('今日のパズル {n}/5', { n: pz.i + 1 }));
  announce($('stxt').textContent);
}
function puzzleMove(m) {
  const pz = S.pz, g = S.game, p = pz.p; if (pz.done) return;
  const ok = AI.puzzleOk(p, g.pos, m, pz.step);
  if (!ok) {
    pz.fails++; sfx('error'); S.bad = m >> 6 & 63; markers(); const c = B.cells[S.bad]; c.classList.add('shake');
    // the wrong move is shown, then taken back
    setStatus(T('ちがいます。もう一度考えてみよう'), true, pz.fails === 1 ? '' : '');
    setTimeout(() => { if (S) { S.bad = -1; markers(); } }, 500);
    return;
  }
  const san = E.toSan(g.pos, m); pz.line.push(san);
  applyPuzzleMove(m);
  if (p.k === 'w' || (S.game.status().over && S.game.status().reason === 'mate')) { puzzleSolved(); return; }
  // the opponent answers; then it is my turn again
  pz.step++;
  S.busy = true;
  S.timer = setTimeout(() => {
    if (!S) return; const d = nextDefense(); S.busy = false;
    if (d) { pz.line.push(E.toSan(S.game.pos, d)); applyPuzzleMove(d); }
    renderPuzzleStatus(); hud(); markers();
  }, cpuWait(450));
}
function nextDefense() {
  const g = S.game, p = S.pz.p, n = +p.k[1] - S.pz.step;     // remaining attacker moves
  const stored = p.s[(S.pz.step - 1) * 2 + 1]; const lg = g.legal();
  if (S.pz.step === 1 && stored) { const m = lg.find(x => E.uci(x) === stored); if (m != null) return m; }
  return AI.bestDefenseFrom(g.pos, n);
}
function applyPuzzleMove(m) {
  const g = S.game, from = m & 63, to = (m >> 6) & 63, fl = m >> 16, victim = fl & E.F_EP ? 1 : g.pos.b[to] & 7;
  g.play(m); S.last = { from, to, m }; S.sel = -1; S.hint = null; S.lgPly = -1; S.bad = -1;
  syncPieces(g.pos.b, m);
  const st = g.status(); sfx(st.reason === 'mate' ? 'hit' : st.check ? 'hit' : victim ? 'pop' : 'move');
  markers(); hud();
}
function puzzleSolved() {
  const pz = S.pz, p = pz.p, ok = pz.fails === 0, pts = ok ? (pz.hint ? 100 : 200) : 0;
  pz.done = true; pz.ok = ok; pz.pts = pts;
  pz.res = pz.res.slice(0, pz.i); pz.res.push([String(p.s[0]).slice(0, 5), ok ? 1 : 0, pts]);
  if (!pz.practice) { save.dl = { last: pz.dk, pts: pz.res.reduce((a, x) => a + x[2], 0), r: pz.res.map(x => x.slice()) }; if (ok) { bump('pz'); bump(p.k === 'w' ? 'pzw' : 'pzm'); } writeSave(); }
  const line = pz.line.slice(0, 6).map(sanText).join(' ');
  let why = '';
  if (p.k === 'w') { try { const g0 = new E.Game(p.f); const fm = g0.legal().find(x => E.uci(x) === p.s[0]); if (fm != null) why = AI.explainMove(g0.pos, fm, null).slice(0, 2).map(reasonText).join(L('。', '. ')); } catch (e) {} }
  setStatus((ok ? T('正解！') : T('ざんねん…')) + ' · +' + pts, true, (T('正解の手順: {l}', { l: line }) + (why ? ' · ' + why : '')));
  announce($('stxt').textContent); sfx(ok ? 'ok' : 'fail'); S.busy = false;
  hud(); markers(); $('ctl').dataset.key = ''; renderCtl();
}
function puzzleHint() {
  const pz = S.pz; if (pz.done || S.busy) return;
  const g = S.game, p = pz.p; let from = -1, to = -1;
  if (p.k === 'w' || pz.step === 0) { const u = p.s[0]; from = E.parseSq(u.slice(0, 2)); to = E.parseSq(u.slice(2, 4)); }
  else { const n = +p.k[1] - pz.step; const ms = AI.matingMoves(g.pos, n); if (ms.length) { from = ms[0] & 63; to = (ms[0] >> 6) & 63; } }
  if (from < 0) return;
  pz.hint = 1; S.hint = { from, to: -1 }; S.hint.to = -1; markers(); sfx('ok');
  $('note').textContent = L('この駒を動かします', 'Move this piece');
}
function puzzleSolve() {
  const pz = S.pz; if (pz.done || S.busy) return;
  pz.fails = Math.max(1, pz.fails); const g = S.game, p = pz.p;
  const play = () => {
    let m; if (p.k === 'w' || pz.step === 0) m = g.legal().find(x => E.uci(x) === p.s[0]); else { const ms = AI.matingMoves(g.pos, +p.k[1] - pz.step); m = ms[0]; }
    if (m == null) return;
    const san = E.toSan(g.pos, m); pz.line.push(san); applyPuzzleMove(m);
    if (p.k === 'w' || S.game.status().reason === 'mate') { puzzleSolved(); return; }
    pz.step++; const d = nextDefense(); if (d) { pz.line.push(E.toSan(g.pos, d)); applyPuzzleMove(d); }
    S.timer = setTimeout(play, cpuWait(350));
  };
  S.busy = true; play();
}
function puzzleNext() {
  if (!S || !S.pz || !S.pz.done) return;
  if (S.pz.i >= 4) { finishPuzzles(); return; }
  S.pz.i++; loadPuzzle();
}

// =====================================================================================
// analysis: both sides are playable, the engine's evaluation bar and best move follow the position
// =====================================================================================
function startAnalysis(o) {
  o = o || {};
  stopTimers(); hideOverlays(); if (S && S.mode === 'online' && TR && !S.over) TR.leave();
  const src = o.game || new E.Game(o.fen || null);
  // a copy, so the game just played stays as it was
  const g = new E.Game(src.start === E.START ? null : src.start); for (const m of src.list) g.play(m);
  const tl = g.list.slice();
  S = mkSession({ mode: 'analysis', game: g, level: 6, ana: { tl, at: o.at != null ? clamp(o.at, 0, tl.length) : tl.length, best: null, token: 0, res: null } });
  B.flipped = !!o.flip; S.last = null;
  goTo(S.ana.at, true);
  $('evalbar').hidden = false; fit(); bump('ana'); writeSave();
  emit('play_start', { mode: 'practice' });
}
function goTo(at, silent) {
  const g = S.game, tl = S.ana.tl; at = clamp(at, 0, tl.length);
  g.undo(g.list.length); for (let i = 0; i < at; i++) g.play(tl[i]);
  S.ana.at = at; S.sel = -1; S.hint = null; S.arrow = null; S.lgPly = -1; S.over = false;
  const lm = g.lastMove(); S.last = lm ? { from: lm & 63, to: (lm >> 6) & 63, m: lm } : null;
  instant(() => syncPieces(g.pos.b)); hud(); markers();
  const st = g.status(); S.note = at ? T('{n}手目まで', { n: at }) : T('はじめの局面');
  setStatus(st.over ? reasonLine(st, g) : T('検討モード：どちらの手も指せます。左の棒は白（上）と黒（下）の形勢です'), false, S.note);
  if (!silent) sfx('tap');
  anaThink();
}
function anaGo(at) { if (S && S.ana) goTo(at); }
function anaAfterMove() {
  // a move was made in analysis: it extends the line (or replaces what came after)
  const a = S.ana, g = S.game, n = g.list.length;
  a.tl = g.list.slice(); a.at = n; S.sel = -1; S.hint = null; S.arrow = null;
  const st = g.status();
  hud(); markers(); setStatus(st.over ? reasonLine(st, g) : T('検討モード：どちらの手も指せます。左の棒は白（上）と黒（下）の形勢です'), false, S.note);
  anaThink();
}
function anaThink() {
  const a = S.ana, g = S.game; a.token++; const tk = a.token;
  a.best = null; a.bestSan = ''; a.bestMove = 0; $('evTop').textContent = ''; $('evBot').textContent = '';
  const st = g.status();
  if (st.over) { const w = st.winner === 0 ? 1 : st.winner === 1 ? 0 : .5; setEval(w, st.winner === -1 ? '0.0' : '#', st.winner); renderCtl(); return; }
  S.note = S.note; $('note').textContent = (S.note ? S.note + ' · ' : '') + T('読んでいます…');
  clearTimeout(S.timer);
  S.timer = setTimeout(() => {
    if (!S || !S.ana || a.token !== tk) return;
    let r; try { r = AI.analyze(g.pos, { ms: SPD.v ? 260 : 80, depth: 9 }); } catch (e) { console.error(e); return; }
    if (!S || !S.ana || a.token !== tk) return;
    a.best = r; const lg = g.legal(); const bm = r.move ? E.toSan(g.pos, r.move, lg) : '';
    a.bestSan = bm; a.bestMove = r.move;
    setEval(r.frac, evText(r.cp, r.mate), null);
    S.arrow = r.move ? { from: r.move & 63, to: (r.move >> 6) & 63 } : null;
    const pv = []; const tmp = g.pos.clone(); for (const x of r.pv.slice(0, 6)) { const l2 = E.legalMoves(tmp); if (l2.indexOf(x) < 0) break; pv.push(sanText(E.toSan(tmp, x, l2))); tmp.make(x); }
    $('note').textContent = (S.note ? S.note + ' · ' : '') + T('評価 {e}', { e: evText(r.cp, r.mate) }) + ' · ' + T('読み筋: {l}', { l: pv.join(' ') }) + ' · ' + T('深さ {d}', { d: r.depth });
    markers(); renderCtl();
  }, SPD.v ? 120 : 0);

function setEval(frac, label, winner) {
  const bot = bottomColor(); const whiteFrac = clamp(frac, 0, 1);

  const wh = $('evWh'); wh.style.height = (bot === 0 ? whiteFrac : 1 - whiteFrac) * 100 + '%';
  wh.style.background = bot === 0 ? '#f6ecd3' : '#f6ecd3'; if (bot === 1) { wh.style.top = 0; wh.style.bottom = 'auto'; wh.style.height = whiteFrac * 100 + '%'; } else { wh.style.bottom = 0; wh.style.top = 'auto'; wh.style.height = whiteFrac * 100 + '%'; }
  const lbl = $('evTop'), lb2 = $('evBot'); lbl.textContent = ''; lb2.textContent = '';
  (whiteFrac >= 0.5 ? (bot === 0 ? lb2 : lbl) : (bot === 0 ? lbl : lb2)).textContent = label.replace('+', '').replace('−', '-').replace('#', 'M');
  (whiteFrac >= 0.5 ? (bot === 0 ? lb2 : lbl) : (bot === 0 ? lbl : lb2)).style.color = whiteFrac >= 0.5 ? '#3b2a17' : '#e5e0f0';

// =====================================================================================
// rules page
// =====================================================================================
function rulesHTML() {
  if (EN) return '<p class="lead">Checkmate the other king: attack it so it cannot escape.</p>' +
    '<h3>How the pieces move</h3><ul><li><b>Pawn</b>: one step forward (two from its start square); captures one step diagonally forward. Reaching the far end it promotes to a queen, rook, bishop or knight.</li><li><b>Knight</b>: an L-shape (two + one), and it jumps over pieces.</li><li><b>Bishop</b>: any distance diagonally. <b>Rook</b>: any distance in a straight line. <b>Queen</b>: both.</li><li><b>King</b>: one step any way, but never onto an attacked square.</li></ul>' +
    '<h3>Special moves</h3><ul><li><b>Castling</b>: the king moves two squares toward a rook and the rook hops over it. Neither may have moved before, the squares between must be empty, and the king may not be in check, pass through check or land in check.</li><li><b>En passant</b>: a pawn that just moved two squares can be captured by an adjacent pawn as if it had moved one - only on the very next move.</li></ul>' +
    '<h3>How a game ends</h3><ul><li><b>Check</b> must be answered at once. <b>Checkmate</b> ends the game and wins it.</li><li><b>Stalemate</b> (no legal move but not in check), the same position three times, 50 moves with no capture or pawn move, or too few pieces to mate: a draw.</li><li>With a clock, running out of time loses (unless the other side cannot possibly mate).</li></ul>' +
    '<h3>Playing</h3><ul><li>Tap a piece, then a dot (or drag it). Or type a move such as <b>e2e4</b>, <b>Nf3</b>, <b>O-O</b> in the box under the board.</li><li>Keyboard: arrow keys move the cursor, Enter picks up / puts down, Esc cancels. Keys: I = hint, U = undo, V = flip, L = moves, T = more; in analysis, [ and ] step through the moves.</li><li>Hints explain the best move. Hints and undo mean no ★ for that game.</li><li>You earn ★ equal to the CPU level when you beat it without hints or undo.</li></ul>';
  return '<p class="lead">相手のキングをチェックメイト（にげ場のない王手）にしたら勝ちです。</p>' +
    '<h3>駒の動き</h3><ul><li><b>ポーン</b>：1マス前へ（はじめだけ2マス）。取るときはななめ前。いちばん向こうの段に着くと、クイーン・ルーク・ビショップ・ナイトのどれかに成れます（プロモーション）。</li><li><b>ナイト</b>：L字（2マス＋1マス）。ほかの駒を飛びこえられます。</li><li><b>ビショップ</b>：ななめにいくつでも。<b>ルーク</b>：たて・よこにいくつでも。<b>クイーン</b>：その両方。</li><li><b>キング</b>：まわりの1マス。ただし、ねらわれているマスには入れません。</li></ul>' +
