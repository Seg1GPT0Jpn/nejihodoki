<script id="doc-ja" type="text/plain">
<p>「ひまつぶし工房」（以下「このサイト」）は、個人が作っている無料のミニゲーム集です。<b>広告はなく、課金もありません。</b>遊んだ内容を分析のために外へ送ることもしません（数えているのは、ゲームごとの匿名のプレイ回数だけです）。</p>
<ul class="toc"><li><a href="#terms">利用規約</a></li><li><a href="#privacy">プライバシー</a></li><li><a href="#delete">データの消し方</a></li><li><a href="#contact">お問い合わせ</a></li></ul>

<h2 id="terms">利用規約</h2>
<ul>
<li>このサイトのゲームは、だれでも無料で遊べます。ログインしなくても、すべてのゲームを遊べます。</li>
<li>ゲームは「そのまま」の状態で提供します。不具合で記録や進み具合が消えることがあっても、作者は責任を負えません。大切な記録は、Google でログインしてクラウドにも保存しておくことをおすすめします。</li>
<li>予告なく、ゲームの内容を変えたり、公開をやめたりすることがあります。</li>
<li>ランキングに出るニックネームに、他人を傷つける言葉、個人を特定できる情報（本名・連絡先など）、なりすましを使わないでください。そのようなニックネームや、ありえない値の記録は、表示から外したり消したりすることがあります。</li>
<li>改造や不正な送信で記録を作らないでください。サーバーに負担をかける使い方（大量の自動アクセスなど）もやめてください。</li>
<li>オンライン対戦の相手に表示されるのは、ニックネームと対戦中の点数・位置だけです。</li>
<li>ゲームは、遊び方のジャンルだけを参考にした自作のものです。特定の商用ゲームの名前・キャラクター・絵・ステージは使っていません。</li>
</ul>

<h2 id="privacy">プライバシー</h2>
<h3>この端末のブラウザに保存するもの</h3>
<p>記録はまずこの端末のブラウザ（localStorage）に保存されます。この端末から外へは送りません（ログインしたときを除く。下を参照）。</p>
<ul>
<li>ゲームの記録と途中の状態：<code>kusoge.&lt;ゲーム&gt;.*</code>（ベスト、途中の盤、ステージ、コインなど）、<code>nejihodoki3d.*</code>（ネジほどき）</li>
<li>共通の設定：言語 <code>kobo.lang</code>、テーマ <code>kobo.theme</code>、音量 <code>kobo.audio</code>（と古い <code>kusoge.sound</code>）、ニックネーム <code>kobo.nick</code></li>
<li>遊んだ履歴（最新50件）<code>kobo.history</code>、お気に入り <code>kobo.fav</code>、統計 <code>kobo.stats</code>、今日のチャレンジの結果 <code>kobo.daily</code>、対戦の成績 <code>kusoge.vs.stats</code></li>
<li>この端末だけのもの：匿名のプレイ回数の控え <code>kobo.plays</code>、端末の印（ランダムな文字。端末どうしの記録をまとめるため）<code>kobo.dev</code>、ランキングの一時保存 <code>kobo.rankCache</code> など、同期の時刻 <code>kobo.mtime</code></li>
</ul>
<h3>Firebase（Google のサービス）に送るもの</h3>
<ul>
<li><b>Google でログインしたとき</b>：Firebase Authentication に、Google アカウントの ID（uid）・名前・メールアドレスが登録されます。ゲームの記録と設定（上の一覧のうち、この端末だけのもの以外）を、Firestore の <code>nejiUsers/{uid}</code> に保存し、ほかの端末と同期します。</li>
<li><b>ニックネームを登録したとき</b>：ランキングに、ニックネームとベストスコア（とプレイにかかった時間）を載せます（<code>kbBoards</code>、旧ランキング <code>kusogeRanks</code>）。だれでも見られます。ログインしていなければ、匿名のアカウント（ランダムな uid）を作って送ります。</li>
<li><b>プレイ回数</b>：「人気」の欄のために、ゲームごと・週ごとの回数を1つ増やすだけの送信をします（<code>kbPlays</code>）。だれが遊んだかは記録しません。</li>
<li><b>オンライン対戦</b>：対戦中だけ、Realtime Database に匿名の uid・ニックネーム・点数・位置を置きます（<code>vs/*</code>、<code>hole/*</code>）。試合が終わると消します（全員が同時に切れたときは、少し残ることがあります）。</li>
</ul>
<h3>そのほか</h3>
<ul>
<li>ページは Firebase Hosting と GitHub Pages から、ライブラリは cdnjs と jsDelivr から、文字の形（フォント）は Google Fonts から読み込みます。読み込むときに、それぞれの会社に IP アドレスなどの通常の通信の情報が伝わります。</li>
<li>広告・アクセス解析・行動の追跡のためのタグやクッキーは使っていません。</li>
</ul>

<h2 id="delete">データの消し方</h2>
<ul>
<li><b>まとめて消す</b>：<a href="../profile/">プロフィール</a>の「データを消す」で、この端末の記録・クラウドの記録・アカウントを消せます。</li>
<li><b>この端末の記録だけ</b>：ブラウザの設定で、このサイトのデータ（Cookie とサイトデータ）を消してもかまいません。ホーム画面に追加したアプリは、アプリを消すと一緒に消えます。<b>消した記録は元に戻せません。</b></li>
<li><b>消しきれないもの</b>：過去の週間・日別ランキングの記録は、画面からは消せません。下のお問い合わせから「データを消してほしい」と書いてください。そのとき、このページの下に出る「あなたの ID」を書いてください（メールアドレスや本名は書かないでください）。確認のうえで消します。</li>
</ul>

<script id="doc-en" type="text/plain">
<p>"Himatsubushi Kobo" ("this site") is a free collection of mini games made by an individual. <b>There are no ads and no purchases.</b> We do not send what you do to anyone for analytics (the only thing we count is an anonymous number of plays per game).</p>
<ul class="toc"><li><a href="#terms">Terms of use</a></li><li><a href="#privacy">Privacy</a></li><li><a href="#delete">Deleting your data</a></li><li><a href="#contact">Contact</a></li></ul>

<h2 id="terms">Terms of use</h2>
<ul>
<li>Anyone can play the games on this site for free. Every game works without signing in.</li>
<li>The games are provided "as is". If a bug makes you lose records or progress, the author cannot be held responsible. We recommend signing in with Google so your records are also saved in the cloud.</li>
<li>Games may change or be taken down without notice.</li>
<li>Do not use nicknames in the rankings that hurt others, reveal personal information (real names, contact details, etc.) or impersonate someone. Such nicknames and impossible scores may be hidden or deleted.</li>
<li>Do not make records with modified clients or forged requests, and do not put load on the servers (for example with large amounts of automated access).</li>
<li>In online battles, other players only see your nickname and your score and position during the match.</li>
<li>The games are our own work, inspired only by genres of play. They do not use the names, characters, art or stages of any commercial game.</li>
</ul>

<h2 id="privacy">Privacy</h2>
<h3>Stored in this device's browser</h3>
<p>Records are first saved in this device's browser (localStorage). Nothing leaves the device unless you sign in (see below).</p>
<ul>
<li>Game records and progress: <code>kusoge.&lt;game&gt;.*</code> (best scores, unfinished boards, stages, coins, …), <code>nejihodoki3d.*</code> (Unscrew 3D)</li>
<li>Shared settings: language <code>kobo.lang</code>, theme <code>kobo.theme</code>, volume <code>kobo.audio</code> (and the older <code>kusoge.sound</code>), nickname <code>kobo.nick</code></li>
<li>Play history (latest 50) <code>kobo.history</code>, favorites <code>kobo.fav</code>, stats <code>kobo.stats</code>, daily challenge results <code>kobo.daily</code>, battle record <code>kusoge.vs.stats</code></li>
<li>Device only: a note of anonymous play counts <code>kobo.plays</code>, a device mark (random characters, used to combine records across devices) <code>kobo.dev</code>, temporary ranking copies such as <code>kobo.rankCache</code>, sync times <code>kobo.mtime</code></li>
</ul>
<h3>Sent to Firebase (a Google service)</h3>
<ul>
<li><b>When you sign in with Google</b>: Firebase Authentication registers your Google account ID (uid), name and email address. Your game records and settings (everything above except the device-only items) are stored in Firestore under <code>nejiUsers/{uid}</code> and synced to your other devices.</li>
<li><b>When you set a nickname</b>: the rankings show your nickname and best scores (and how long the play took) (<code>kbBoards</code>, legacy <code>kusogeRanks</code>). Anyone can see them. If you are not signed in, an anonymous account (a random uid) is created to send them.</li>
<li><b>Play counts</b>: for the "Popular" section, a request that only adds one to a per-game, per-week counter (<code>kbPlays</code>). It does not record who played.</li>
<li><b>Online battles</b>: only during a match, an anonymous uid, nickname, score and position are kept in the Realtime Database (<code>vs/*</code>, <code>hole/*</code>). They are removed when the match ends (if everyone disconnects at once, a little may remain).</li>
</ul>
<h3>Other</h3>
<ul>
<li>Pages are served by Firebase Hosting and GitHub Pages, libraries by cdnjs and jsDelivr, and fonts by Google Fonts. When they load, those companies receive normal connection information such as your IP address.</li>
<li>We use no tags or cookies for ads, analytics or tracking.</li>
</ul>

<h2 id="delete">Deleting your data</h2>
<ul>
<li><b>Delete everything</b>: use "Delete data" on the <a href="../profile/">profile page</a> to remove this device's records, your cloud records and your account.</li>
<li><b>Only this device</b>: you can also clear this site's data (cookies and site data) in your browser settings. For the Home Screen app, removing the app removes its data. <b>Deleted records cannot be restored.</b></li>
<li><b>What remains</b>: past weekly and daily ranking entries cannot be removed from the page. Open an issue at the contact link below asking for deletion, and include "Your ID" shown at the bottom of this page (do not include your email address or real name). We will delete it after checking.</li>
</ul>

<h2 id="contact">Contact</h2>
<p>For bug reports, requests and deletion requests, please use GitHub Issues:<br><a href="https://github.com/Seg1GPT0Jpn/nejihodoki/issues" target="_blank" rel="noopener">github.com/Seg1GPT0Jpn/nejihodoki/issues</a></p>
<p class="dim">Issues are public. Do not write anything that identifies you. We do not accept inquiries by email.</p>
<p class="dim">Revised November 4, 2026</p>

<script>
(() => {
  // 今の言語の本文だけを出す（もう一方はページに入れない）
  const lang = KoboI18n.lang === 'en' ? 'en' : 'ja';
  document.getElementById('doc').innerHTML = document.getElementById('doc-' + lang).textContent;
  ['ja', 'en'].forEach(l => document.getElementById('doc-' + l).remove());
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  const me = document.getElementById('me');
  const draw = () => {
    const u = window.KoboCloud && KoboCloud.user ? KoboCloud.user() : null;
    me.hidden = false;
    me.textContent = u && u.uid ? KoboI18n.t('あなたの ID：{id}', { id: u.uid }) : KoboI18n.t('ログインしていません（クラウドにあなたのデータはありません）。');
  };
  draw();
  if (window.KoboCloud) { KoboCloud.onChange(draw); try { KoboCloud.ready(); } catch (e) {} }
})();
</script>
