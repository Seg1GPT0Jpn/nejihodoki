  --tn-go: linear-gradient(#ffd479, #f0a93a); --tn-go-shadow: #8a5a12; --tn-good: #8fe3a0; --tn-bad: #ff9a86;
  --tn-title: linear-gradient(90deg, #ffe7a8, #ffc65a 55%, #ff9a6a);
  --tn-night: 1; --tn-sky1: #1b2652; --tn-sky2: #4a5a92; --tn-cloud: rgba(180, 195, 240, .22); --tn-grass: #5d9a58; --tn-grass2: #548f50; --tn-water: #3a6aa8; --tn-waterline: rgba(190, 225, 255, .7); --tn-leaf1: #3f8a4a; --tn-leaf2: #2f7040;

}

html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 65%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 6px 0; width: 100%; max-width: 900px; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--tn-panel); border: 1px solid var(--tn-line); color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.chip svg { width: 15px; height: 15px; flex: none; }
#modeChip { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; color: var(--kb-dim); background: transparent; border: 0; padding-left: 2px; font-size: 12.5px; }
.icon { position: relative; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--tn-line); background: var(--tn-panel); color: var(--kb-ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
#res { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 0 2px 4px; }
.rc { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 3px 2px 2px; border-radius: 12px; background: var(--tn-panel); border: 1px solid var(--tn-line); line-height: 1.15; }
.rc b { display: flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; max-width: 100%; }
.rc b svg { width: 14px; height: 14px; flex: none; }
.rc b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc small { font-size: 10px; color: var(--kb-dim); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rc.bad { border-color: var(--tn-bad); } .rc.bad small { color: var(--tn-bad); }
.rc.flash { animation: flashbad .5s ease-out; }
.rc.up { animation: gain .5s ease-out; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 900px; margin: 0 auto; box-sizing: border-box; padding: 0 6px 6px; gap: 5px; }
#stageWrap { flex: 1 1 auto; min-height: 120px; position: relative; overflow: hidden; border-radius: 16px; box-shadow: 0 6px 22px rgba(0, 0, 0, .25), 0 0 0 1px var(--tn-line); background: var(--tn-sky2); }
#town { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: pointer; }
#tip { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; padding: 6px 10px; border-radius: 12px; background: rgba(30, 40, 24, .92); color: #fffbe8; border: 1px solid rgba(255, 240, 190, .5); font-size: 12.5px; font-weight: 800; line-height: 1.4; pointer-events: none; animation: rise .3s ease-out; }
#tip .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; margin-right: 6px; border-radius: 999px; background: #ffd479; color: #2b2005; }
#flash { position: absolute; left: 0; right: 0; top: 36%; z-index: 7; text-align: center; font-family: var(--kb-font-display); font-size: 30px; color: #fff3b0; text-shadow: 0 3px 0 #a8651a, 0 0 18px rgba(255, 200, 80, .8); pointer-events: none; opacity: 0; padding: 0 10px; }
#flash.on { animation: flash 1.5s ease-out; }

  $('howBody').innerHTML = '<p class="lead">' + esc(T('建物をならべて、ちいさな町を育てよう。るすの間も町ははたらいて、コインがたまります。')) + '</p>' + li([
    '建物のカードをタップして、空き地をタップすると建ちます。まず「すまい」と「はたけ」。', '建物は、となり合わせでボーナス：はたけ×風車小屋、すまい×こうえん、いちば×すまい…。置き方が大事！',
    '建物をタップして「そだてる」と、はたらきがぐんと上がります。土地には かぎりがあるので、広げながら工夫しよう。', '空をとぶ旅人をタップすると おみやげ。ときどき お祭りや雨で、もうけが2ばいになります。',
    '人口がふえたら「町をひらきなおす」で ほまれ（ずっと続くもうけの倍率）と、新しい建物・土地がもらえます。', '自動保存。とじても町は育ちます（るす番は最大8時間〜）。時計を戻すと、るすの分はもらえません。']);
}
let howtoFirst = false;
function showHowto(first) { howtoFirst = !!first; renderHowto(); $('howtoGo').textContent = first ? T('やってみる') : T('とじる'); $('howtoAlt').hidden = !first; openOv('howto'); }
$('howtoGo').addEventListener('click', () => { store.set(HOWTO_KEY, '1'); closeOv(); if (AU) AU.ctx(); });
$('howtoAlt').addEventListener('click', () => { store.set(HOWTO_KEY, '1'); S.tut = 1; persist(true); closeOv(); });
{ const s2 = KoboI18n.picker($('langPick')); if (s2) s2.id = 'langSel'; }

// sound, theme, menu
function renderSound() {
  const b = $('sndBtn'), on = !(AU && AU.muted);
  b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', T(on ? 'サウンド オン' : 'サウンド オフ'));
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  if (!AU) b.hidden = true;
}
$('sndBtn').addEventListener('click', () => { if (!AU) return; AU.toggleMute(); if (!AU.muted) sfx('ok'); });
if (AU) AU.onChange(renderSound);
function themeColor() { const m = document.querySelector('meta[name="theme-color"]'); if (!m) return; const light = UI && UI.theme ? UI.theme.resolved() === 'light' : false; m.setAttribute('content', light ? '#e9f3dc' : '#16203a'); }
let pm = null;
function openMenu() {
  if (!UI) { showHowto(false); return; }
  if (pm && pm.isOpen) return;
  pm = UI.pauseMenu({
    title: T('メニュー'), home: '../',
    extra: [{ label: T('遊び方'), icon: 'help', onClick: () => { pm.close(); showHowto(false); } }],
    onResume: () => { const g = KG(); if (g) g.menuClosed(); },
    onOpen: () => { const g = KG(); if (g) g.menuOpened(); persist(true); },
  });
  pm.open();
}
$('menuBtn').addEventListener('click', openMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && anyOverlay()) closeOv(); });

// ---------- the platform ----------
let sessionStart = performance.now(), sessionOpen = false;
function startSession() { if (sessionOpen) return; sessionOpen = true; sessionStart = performance.now(); emit('play_start', { mode: 'normal' }); }
function endSession(reason) {
  if (!sessionOpen) return; sessionOpen = false;
  const ms = Math.round(performance.now() - sessionStart);
  emit('play_end', { mode: 'normal', score: S.best, durationMs: ms, reason: reason || 'leave', stats: { tier: S.tier, pop: Math.floor(S.pop) } });
}
if (window.KoboGame) KoboGame.register({
  id: GAME,
  save() { persist(true); },
  isIdle: () => true,
  dispose() { cancelAnimationFrame(raf); },
});
window.addEventListener('pagehide', () => { persist(true); endSession('leave'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(true); endSession('hidden'); } else { resync = true; startSession(); } });
window.addEventListener('pageshow', () => { resync = true; });
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(() => { themeColor(); readColors(); needDraw = true; showInfo(); }, 0));
window.addEventListener('resize', () => layout());
try { new ResizeObserver(() => layout()).observe(wrap); } catch (e) {}

// ---------- boot ----------
renderSound(); themeColor(); readColors();
S = load();
{ const r0 = E.advance(S, wallNow()); if (r0.mode === 'away' && r0.raw >= 60) welcomePending = r0; }
layout(); Object.assign(view, fitTarget(S.land)); view.init = true;
buildCards(); renderQuest(); updateHud();
const firstVisit = store.get(HOWTO_KEY) == null && !S.tut && !S.stats.built;
if (firstVisit) showHowto(true);
else if (welcomePending) showWelcome(welcomePending);
bootDone = true; resync = false; lastTs = 0;
startSession();
raf = requestAnimationFrame(loop);
// the light changes with the page theme
setInterval(() => { readColors(); }, 4000);

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const page = (x, y) => { const r = cv.getBoundingClientRect(); return { x: r.left + x, y: r.top + y }; };
  const api = {
    ready: () => bootDone,
    state: () => {
      const R = E.rates(S), q = E.currentQuest(S), pi = E.prestigeInfo(S), counts = {};
      for (const b of S.g) if (b) counts[b.b] = (counts[b.b] || 0) + 1;
      return {
        pop: Math.floor(S.pop + 1e-9), cap: R.cap, best: S.best, tier: S.tier, renown: S.renown, land: S.land, res: Object.assign({}, S.res), rate: E.coinRate(S), counts, built: S.g.filter(b => b && b.b !== 'plaza').length,
        quest: q ? q.id : null, quests: Object.keys(S.qd).length, qprog: q ? E.questProgress(S, q) : null, tut: S.tut, rs: Object.assign({}, S.rs), stats: Object.assign({}, S.stats), daily: Object.assign({}, S.daily),
        vis: S.vis.length, ev: S.ev ? S.ev.type : null, t: S.t, armed, sel: sel ? Object.assign({}, sel) : null, prestige: pi, giftReady: E.giftReady(S, wallNow()), cap8: E.offlineCapH(S),
        welcome: !$('ovWelcome').hidden, welcomeText: $('wAway').textContent, quests_ov: !$('ovQuests').hidden, research_ov: !$('ovResearch').hidden, gift_ov: !$('ovGift').hidden, town_ov: !$('ovTown').hidden, howto: !$('howto').hidden,
        night, tw: view.tw, W: view.W, H: view.H, cards: Object.keys(cardEls).filter(t => cardEls[t].b && !cardEls[t].b.classList.contains('locked')),
      };
    },
    cellPoint: (x, y) => { const [cx, cy] = tileCenter(x, y); return page(cx, cy - view.tw * 0.08); },
    visitorPoint: () => { const v = S.vis[0]; if (!v) return null; const p = visitorPos(v); return page(p.x, p.y); },
    bestTile: type => bestEmpty(type),
    cardEl: type => cardEls[type] && cardEls[type].b,
    skip(ms) { clockOff += ms; resync = true; return true; },
    clock: { now: wallNow, off: () => clockOff, set(o) { clockOff = o; resync = true; } },
    grant(o) { for (const k of Object.keys(o)) S.res[k] = (S.res[k] || 0) + o[k]; E.touch(S); needUI = true; return S.res; },
    setPop(n) { S.pop = n; S.peak = Math.max(S.peak, n); S.best = Math.max(S.best, Math.floor(n)); E.touch(S); needUI = true; return S.pop; },
    setLand(n) { S.land = n; E.touch(S); buildCards(); return S.land; },
    spawnVisitor() { S.vis.push({ id: ++S.vid, ttl: 12, life: 24, kind: S.vid % 4, lane: 0.3 }); return S.vis.length; },
    setEvent(ty) { S.ev = ty ? { type: ty, left: 40, life: 45 } : null; E.touch(S); return true; },
    persist: () => persist(true), noSave() { DEBUG_NOSAVE = true; }, checkGoals,
    saved: () => ({ meta: readJSON(SAVE_KEY), run: readJSON(RUN_KEY) }),
    openTown: showTown, openQuests: showQuests, openResearch: showResearch, openGift: showGift, openMenu, howto: () => showHowto(false), closeOv,
    simulate(sec) { const r = E.advance(S, S.t + sec * 1000); onAdvance(r); needUI = true; return r.mode; },
    E,
  };
  window.__kb = Object.assign(window.__kb || {}, { ready: api.ready, state: api.state });
  window.__town = Object.assign(api, {
    get S() { return S; },
    thumbScene() { // a pretty mid-game town for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); DEBUG_NOSAVE = true;
      const g = new Array(100).fill(null), put = (x, y, b, lv) => { g[E.IDX(x, y)] = [b, lv, 0, 0]; };
      put(2, 2, 'house', 3); put(3, 2, 'house', 2); put(4, 2, 'park', 1); put(5, 2, 'house', 3); put(6, 2, 'lumber', 2);
      put(2, 3, 'house', 2); put(3, 3, 'market', 2); put(5, 3, 'mill', 2); put(6, 3, 'farm', 3);
      put(2, 4, 'park', 1); put(3, 4, 'house', 3); put(5, 4, 'farm', 2); put(6, 4, 'farm', 2);
      put(2, 5, 'workshop', 2); put(3, 5, 'house', 2); put(4, 5, 'library', 2); put(5, 5, 'house', 3); put(6, 5, 'park', 1);
      put(2, 6, 'lumber', 1); put(6, 6, 'harbor', 2);
      const run = { v: 1, t: S.t, born: S.t, land: 5, g, res: { coin: 842, wood: 210, food: 90, spark: 3 }, pop: 58, peak: 58, ev: null, en: 100, vn: 100, vid: 0, rn: 7, age: 0, kinds: {}, tier: 1 };
      S = E.unpack({ tier: 1, renown: 2, best: 58, un: { house: 1, lumber: 1, farm: 1, park: 1, mill: 1, workshop: 1, market: 1, harbor: 1, library: 1 }, qd: {}, tut: 1 }, run, S.t);
      S.vis = [{ id: 2, ttl: 15, life: 24, kind: 0, lane: 0.25 }]; S.vn = 999; S.en = 999; S.tut = 1; for (const q of E.QUESTS) S.qd[q.id] = 1; fx.floats = []; fx.bits = []; $('flash').classList.remove('on');
      closeOv(); hideTip(); sel = null; armed = null; simT = 3.2; layout(); Object.assign(view, fitTarget(S.land)); needDraw = true; draw(0);
      return true;
    },
  });
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
