# main に変更が入るたびに、両方の公開先へ自動で反映する
#   deploy: Firebase Hosting（https://neji-5913a.web.app/）
#   pages : GitHub Pages（https://seg1gpt0jpn.github.io/nejihodoki/）。gh-pages ブランチを main と同じにする（R25）
name: Firebase Hosting と GitHub Pages に公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 秘密鍵が登録されているか確認
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::FIREBASE_SERVICE_ACCOUNT が未登録のため、Firebase Hosting への公開をスキップしました（HOSTING_SETUP.md を参照）"; fi
      - name: Firebase Hosting に公開
        if: steps.check.outputs.ok == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: neji-5913a

  pages:
    # main のときだけ（ほかのブランチから手で動かしても gh-pages は変えない）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gh-pages を main と同じにする
        run: git push --force origin "HEAD:refs/heads/gh-pages"
