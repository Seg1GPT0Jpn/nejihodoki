<style>
/* いろあわせカード工房: a sewing-workshop cutting mat. Cards keep their own thread colours in both themes; the mat and the room follow the light / dark theme.
   --kb-* are the shared tokens re-tinted to workshop navy and brass; --cc-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #0f1a2e; --kb-surface: #182742; --kb-surface-2: #1f3253; --kb-sunken: #0b1424; --kb-line: #33496f;
  --kb-ink: #f2f5fb; --kb-dim: #aab9d3;
  --kb-accent: #ffc14d; --kb-accent-ink: #2b1d00; --kb-accent-text: #ffd078; --kb-accent-soft: rgba(255, 193, 77, .16);
  --kb-scrim: rgba(5, 10, 20, .8); --kb-toast-bg: rgba(9, 16, 30, .95); --kb-focus: #ffd98a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --cc-mat: #1d4c5c; --cc-mat2: #163b49; --cc-grid: rgba(255, 255, 255, .07); --cc-rail: #0a1626; --cc-rim: rgba(255, 193, 77, .3);
  --cc-panel: rgba(220, 235, 255, .06); --cc-line: rgba(190, 215, 255, .16); --cc-card: linear-gradient(#1b2d4d, #13223c);
  --cc-go: linear-gradient(#ffd27a, #f0a93a); --cc-go-ink: #2b1d00; --cc-go-shadow: #94620f;
  --cc-key: linear-gradient(#27406a, #1c3254); --cc-key-shadow: #08111f;
  --cc-title: linear-gradient(90deg, #ffd98a, #8fd3ff 55%, #ff9aa8);
  --cc-bad: #ff8d7d; --cc-ok: #6fe3b0;
  --cc-paper: #fffaf0;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #eef2f8; --kb-surface: #ffffff; --kb-surface-2: #f3f6fb; --kb-sunken: #e0e7f1; --kb-line: #c3cfe2;
    --kb-ink: #15233b; --kb-dim: #4b5f80;
    --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
    --kb-scrim: rgba(21, 35, 59, .45); --kb-toast-bg: rgba(21, 35, 59, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(21, 35, 59, .2);
    --cc-mat: #6fb5a8; --cc-mat2: #5aa396; --cc-grid: rgba(255, 255, 255, .28); --cc-rail: #2d5a64; --cc-rim: rgba(255, 255, 255, .55);
    --cc-panel: rgba(21, 35, 59, .05); --cc-line: #cdd8ea; --cc-card: linear-gradient(#ffffff, #f3f6fb);
    --cc-go: linear-gradient(#e0a02f, #b8730a); --cc-go-ink: #ffffff; --cc-go-shadow: #7a4b05;
    --cc-key: linear-gradient(#ffffff, #eef2f9); --cc-key-shadow: #b6c4dc;
    --cc-title: linear-gradient(90deg, #8a5300, #1f5fae 55%, #b83a52);
    --cc-bad: #c43b27; --cc-ok: #0f8a5c;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #eef2f8; --kb-surface: #ffffff; --kb-surface-2: #f3f6fb; --kb-sunken: #e0e7f1; --kb-line: #c3cfe2;
  --kb-ink: #15233b; --kb-dim: #4b5f80;
  --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
  --kb-scrim: rgba(21, 35, 59, .45); --kb-toast-bg: rgba(21, 35, 59, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(21, 35, 59, .2);
  --cc-mat: #6fb5a8; --cc-mat2: #5aa396; --cc-grid: rgba(255, 255, 255, .28); --cc-rail: #2d5a64; --cc-rim: rgba(255, 255, 255, .55);
  --cc-panel: rgba(21, 35, 59, .05); --cc-line: #cdd8ea; --cc-card: linear-gradient(#ffffff, #f3f6fb);
  --cc-go: linear-gradient(#e0a02f, #b8730a); --cc-go-ink: #ffffff; --cc-go-shadow: #7a4b05;
  --cc-key: linear-gradient(#ffffff, #eef2f9); --cc-key-shadow: #b6c4dc;
  --cc-title: linear-gradient(90deg, #8a5300, #1f5fae 55%, #b83a52);
  --cc-bad: #c43b27; --cc-ok: #0f8a5c;
  --cc-paper: #fffaf0;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 62%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--cc-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--cc-line); background: var(--cc-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .opt:focus-visible, .tog:focus-visible, .act:focus-visible, .cd:focus-visible, #deck:focus-visible, summary:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 1px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--cc-panel); border: 1px solid var(--cc-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn.you { background: var(--kb-accent-soft); border-color: var(--kb-accent); color: var(--kb-accent-text); }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }
.chip.prac { color: var(--cc-ok); }

/* the mat */
#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 5px; }
#table { position: relative; flex: 1 1 auto; min-height: 120px; border-radius: 22px; overflow: hidden; touch-action: none;
  background: linear-gradient(var(--cc-grid) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, var(--cc-grid) 1px, transparent 1px) 0 0 / 28px 28px, radial-gradient(120% 90% at 50% 40%, var(--cc-mat) 0%, var(--cc-mat2) 100%);
  box-shadow: inset 0 0 0 3px var(--cc-rail), inset 0 0 0 4px var(--cc-rim), inset 0 8px 30px rgba(0, 0, 0, .3); }
#table.mine::after { content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none; box-shadow: inset 0 0 0 3px var(--kb-accent), inset 0 -18px 28px -10px rgba(255, 193, 77, .35); animation: mine 1.6s ease-in-out infinite; z-index: 5; }
#status { flex: none; min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 10px; border-radius: 14px; background: var(--cc-panel); border: 1px solid var(--cc-line); font-size: 13px; font-weight: 800; text-align: center; line-height: 1.3; color: var(--kb-ink); }
#status.you { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
#ctl { flex: none; display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; min-height: 48px; }
#ctl[hidden] { display: none; }
.act { flex: 1 1 0; min-width: 0; max-width: 190px; min-height: 48px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--cc-line); background: var(--cc-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--cc-key-shadow); font: 800 14px var(--kb-font-body); line-height: 1.15; padding: 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; touch-action: manipulation; }
.act small { font-size: 10.5px; font-weight: 500; opacity: .85; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cc-key-shadow); }
.act.go { background: var(--cc-go); color: var(--cc-go-ink); border-color: transparent; box-shadow: 0 3px 0 var(--cc-go-shadow); font-size: 15px; }
.act.danger { border-color: var(--cc-bad); color: var(--cc-bad); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }
.act.pulse { animation: pulse 1.1s ease-in-out infinite; }
.act .sw { display: inline-flex; align-items: center; gap: 5px; }
.act .sw svg { width: 18px; height: 18px; flex: none; }
.act.col { color: #fff; border-color: transparent; text-shadow: 0 1px 1px rgba(0, 0, 0, .35); }
.act.c0 { background: #d6455d; box-shadow: 0 3px 0 #8f1f36; } .act.c1 { background: #2f6fd0; box-shadow: 0 3px 0 #173d85; }
.act.c2 { background: #2f9e5b; box-shadow: 0 3px 0 #17623a; } .act.c3 { background: #eab12c; color: #3b2600; text-shadow: none; box-shadow: 0 3px 0 #8a5d05; }

/* the centre: direction ring, piles, colour badge */
#ringw { position: absolute; left: 0; top: 0; pointer-events: none; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
#ringw.rev { transform: scaleX(-1); }
#ring { width: 100%; height: 100%; overflow: visible; }
#ring .spin { transform-origin: 0 0; animation: spin 16s linear infinite; }
#ring .arc { fill: none; stroke: var(--rc, #fff); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 3.2 3.4; opacity: .8; transition: stroke .4s; }
#ring .head { fill: var(--rc, #fff); opacity: .95; transition: fill .4s; }
#ringw.flip #ring .spin { animation-duration: 1.2s; }
#deck { position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0; background: none; cursor: default; }
#deck .st { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); background-size: 100% 100%; box-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 3px 8px rgba(0, 0, 0, .25); }
#deck .cnt { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: rgba(6, 14, 28, .78); color: #fff; font: 800 11px var(--kb-font-body); font-variant-numeric: tabular-nums; z-index: 2; }
#deck.tap { cursor: pointer; }
#deck.tap .st:nth-of-type(3) { animation: glow 1s ease-in-out infinite; }
#badge { position: absolute; left: 0; top: 0; display: grid; place-items: center; border-radius: 50%; color: #fff; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); transition: background .35s, transform .35s; pointer-events: none; z-index: 40; }
#badge svg { width: 62%; height: 62%; fill: currentColor; }
#badge.c3 { color: #3b2600; }
.seat { position: absolute; display: flex; align-items: center; gap: 5px; box-sizing: border-box; padding: 2px 8px 2px 3px; border-radius: 999px; background: rgba(6, 14, 28, .62); border: 1.5px solid transparent; color: #f2f5fb; font-size: 11.5px; font-weight: 800; white-space: nowrap; z-index: 30; max-width: 100%; transform: translateX(-50%); transition: border-color .2s, background .2s; }
.seat.on { border-color: #ffc14d; background: rgba(255, 193, 77, .3); box-shadow: 0 0 14px rgba(255, 193, 77, .55); animation: bob 1.1s ease-in-out infinite; }
.seat.me { transform: none; } .seat.me.on { animation: none; }
.seat .av { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--c, #6b8f82); color: #fff; font: 800 12px var(--kb-font-body); }
.seat b { overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.seat .n { flex: none; min-width: 18px; padding: 0 5px; border-radius: 9px; background: #fff; color: #15233b; font: 800 11px var(--kb-font-body); text-align: center; font-variant-numeric: tabular-nums; }
.seat .ward { flex: none; width: 15px; height: 15px; color: #8fe3ff; }
.seat .last { flex: none; padding: 0 6px; border-radius: 9px; background: #ff6f86; color: #fff; font: 800 10px var(--kb-font-body); }
.seat .bd { flex: none; padding: 0 6px; border-radius: 9px; background: rgba(255, 255, 255, .85); color: #15233b; font: 800 10px var(--kb-font-body); }
.seat .bd.off { background: #ff8d7d; } .seat .bd.away { background: #ffd078; } .seat .bd.tm { background: #ffc14d; color: #2b1d00; font-variant-numeric: tabular-nums; }
.seat .bd.think { background: transparent; color: #ffd078; padding: 0 2px; animation: pulse2 1s ease-in-out infinite; }
.seat.dc { opacity: .72; }
.seat .last.warn { background: #ffb02e; color: #2b1d00; animation: pulse2 .9s ease-in-out infinite; }
.bubble { max-width: 70%; overflow: hidden; text-overflow: ellipsis; position: absolute; transform: translate(-50%, 0); padding: 2px 9px; border-radius: 10px; background: #fff; color: #15233b; font-size: 11.5px; font-weight: 800; white-space: nowrap; z-index: 62; pointer-events: none; animation: bub .25s ease-out; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.bubble.hot { background: #ffc14d; } .bubble.bad { background: #ff8d7d; } .bubble.ok { background: #8fe3b8; }
.banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; font: 400 clamp(22px, 7vw, 40px) var(--kb-font-display); color: #fff6d6; text-shadow: 0 3px 0 #8c5a0f, 0 0 18px rgba(255, 193, 77, .8); white-space: nowrap; animation: banner 1.2s ease-out forwards; }
#peekBox { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 75; max-width: calc(100% - 20px); box-sizing: border-box; padding: 8px 10px 10px; border-radius: 16px; background: var(--cc-card); border: 1px solid var(--cc-line); box-shadow: var(--kb-shadow); text-align: center; color: var(--kb-ink); animation: rise .25s ease-out; }
#peekBox b { display: block; font-size: 12.5px; margin-bottom: 6px; }
#peekBox .row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.mini { position: relative; width: var(--mw, 38px); height: calc(var(--mw, 38px) * 1.4); --cw: var(--mw, 38px); flex: none; border-radius: calc(var(--mw, 38px) * .1); background: var(--cc-paper); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }

/* cards: one element per card, moved by transform; the back and the face flip */
.cd { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.4); margin: 0; padding: 0; border: 0; background: none; transform-origin: 50% 50%; will-change: transform; transition: transform .42s cubic-bezier(.22, .8, .3, 1), opacity .25s; transition-delay: var(--dl, 0s); perspective: 700px; }
.cd.nt, #table.inst .cd, #table.inst .cd .fl { transition: none !important; }
.cd.tap { cursor: pointer; }
.cd .fl { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .34s ease; transition-delay: var(--dl, 0s); }
.cd.up .fl { transform: rotateY(180deg); }
.cd .fc { position: absolute; inset: 0; border-radius: calc(var(--cw) * .1); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 0, 0, .22); }
.cd .back { background-color: #26407a; background-size: 100% 100%; }
.cd .face { transform: rotateY(180deg); background: var(--cc-paper); }
.cd.hid { opacity: 0; pointer-events: none; }
.cd.dim .fc { filter: brightness(.6) saturate(.7); }
.cd.sel .face { box-shadow: 0 0 0 2px var(--kb-accent), 0 0 14px 2px var(--kb-accent); }
.cd.hl .fc { animation: glow 1s ease-in-out infinite; }
.cd.bad { animation: shake .3s; }
.cf { position: absolute; inset: calc(var(--cw) * .04); border-radius: calc(var(--cw) * .075); background: var(--cm, #888); color: var(--ci, #fff); overflow: hidden; font-family: var(--kb-font-display), "M PLUS Rounded 1c", sans-serif; }
.cf.c0 { --cm: #d6455d; --cd: #8f1f36; --ci: #fff; } .cf.c1 { --cm: #2f6fd0; --cd: #173d85; --ci: #fff; }
.cf.c2 { --cm: #2f9e5b; --cd: #17623a; --ci: #fff; } .cf.c3 { --cm: #eab12c; --cd: #8a5d05; --ci: #3b2600; }
.cf.dye { --cm: #2a3350; --cd: #2a3350; --ci: #fff; }
.cf::before { content: ""; position: absolute; inset: calc(var(--cw) * .035); border: calc(var(--cw) * .022) dashed currentColor; opacity: .6; border-radius: calc(var(--cw) * .05); pointer-events: none; }
.cf .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 66%; height: 56%; border-radius: 50%; background: rgba(255, 255, 255, .95); color: var(--cd); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cf .num { font-size: calc(var(--cw) * .5); line-height: 1; margin-top: calc(var(--cw) * -.01); }
.cf .rv { width: calc(var(--cw) * .17); height: calc(var(--cw) * .17); margin-top: calc(var(--cw) * -.01); }
.cf .ic { width: calc(var(--cw) * .44); height: calc(var(--cw) * .44); }
.cf .dr { width: calc(var(--cw) * .46); height: calc(var(--cw) * .46); }
.cf.dye .mid { background: rgba(255, 255, 255, .96); }
.cf .ix { position: absolute; left: 7%; top: 4%; display: flex; flex-direction: column; align-items: center; line-height: 1; width: 22%; font-style: normal; }
.cf .ix.br { left: auto; right: 7%; top: auto; bottom: 4%; transform: rotate(180deg); }
.cf .ix b { font-size: calc(var(--cw) * .21); font-weight: 400; }
.cf .ix .su { width: calc(var(--cw) * .16); height: calc(var(--cw) * .16); margin-top: calc(var(--cw) * .01); }
.cf .wm { position: absolute; right: -8%; bottom: -6%; opacity: .16; pointer-events: none; }
.cf .wm .sh { width: calc(var(--cw) * .62); height: calc(var(--cw) * .62); }
.cf .lb { position: absolute; left: 4%; right: 4%; bottom: calc(var(--cw) * .1); text-align: center; font-size: calc(var(--cw) * .12); letter-spacing: .02em; white-space: nowrap; font-family: var(--kb-font-body); font-weight: 800; }
.cf.a .mid, .cf.dye .mid { top: 46%; height: 50%; }
.cf.a .ix.br { display: none; }
.cf.dye .lb { color: #fff; }

.hand-tag { position: absolute; z-index: 3; pointer-events: none; font-size: 10.5px; font-weight: 800; color: rgba(255, 255, 255, .85); text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.panel { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cc-card); border: 1px solid var(--cc-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--cc-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 25px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--cc-go); color: var(--cc-go-ink); box-shadow: 0 3px 0 var(--cc-go-shadow); font: 800 16px var(--kb-font-body); text-decoration: none; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cc-go-shadow); }
.btn.sub { background: var(--cc-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--cc-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.opts { text-align: left; }
.og { margin: 8px 0 0; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--cc-panel); border: 1px solid var(--cc-line); }
.opt { flex: 1; min-width: 0; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.2; }
.opt small { display: block; font-size: 10.5px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 6px; padding: 4px 10px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--cc-line); background: var(--cc-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; text-align: left; }
.tog span { flex: 1; } .tog small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--kb-line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; text-align: left; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.gdesc { margin: 8px 0 0; font-size: 12.5px; font-weight: 500; color: var(--kb-ink); line-height: 1.5; }
.gbest { margin: 4px 0 0; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); }
.rank { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--cc-panel); border: 1px solid var(--cc-line); font-size: 13.5px; font-weight: 800; text-align: left; }
.rank li.me { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rank li .no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-surface); color: var(--kb-accent-text); font: 400 14px var(--kb-font-display); }
.rank li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .sc { flex: none; font-size: 12px; color: var(--kb-dim); font-variant-numeric: tabular-nums; }
.big { font-family: var(--kb-font-display); font-size: 34px; line-height: 1.1; color: var(--kb-ink); }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.howto { max-width: 460px; text-align: left; }
.howto h2 { text-align: center; }
.howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); }
.howto li { margin: 3px 0; }
.howto .lead { color: var(--kb-ink); font-weight: 800; font-size: 13px; }
.kinds { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.kinds .k { display: flex; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 12px; background: var(--cc-panel); border: 1px solid var(--cc-line); }
.kinds .k .mini { --mw: 40px; }
.kinds .k div { font-size: 12.5px; line-height: 1.45; color: var(--kb-ink); } .kinds .k b { color: var(--kb-accent-text); }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--cc-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--cc-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
body.thumb h1, body.thumb .icon, body.thumb .hrow .back, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #ctl, body.thumb #status, body.thumb .info { display: none !important; }

@keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes shake { 20%, 60% { margin-left: -5px; } 40%, 80% { margin-left: 5px; } }
@keyframes glow { 50% { box-shadow: 0 0 0 2px #ffc14d, 0 0 16px 4px rgba(255, 193, 77, .85); } }
@keyframes pulse { 50% { box-shadow: 0 3px 0 var(--cc-go-shadow), 0 0 0 4px rgba(255, 193, 77, .45); } }
@keyframes pulse2 { 50% { transform: scale(1.12); } }
@keyframes mine { 50% { opacity: .45; } }
@keyframes bob { 50% { transform: translateX(-50%) translateY(2px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bub { from { transform: translate(-50%, 6px) scale(.8); opacity: 0; } }
@keyframes banner { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cd, .cd .fl { transition-duration: .01s !important; } .banner, .panel, .overlay { animation: none; } .banner { opacity: 1; } .cd.hl .fc, .act.pulse, #ring .spin, .seat.on, #table.mine::after { animation: none; } }
@media (max-height: 600px) { .panel { padding: 10px 12px 8px; } .panel h2.logo { font-size: 22px; } .btn { min-height: 46px; margin-top: 6px; } .og { margin-top: 5px; } }
@media (max-width: 379px) { h1 { visibility: hidden; } }
@media (orientation: landscape) and (max-height: 520px) {

    TR.leave(); if (S) S.menu = true; showTitle(); return;
  }
  const ctx = m.fresh || !octx ? (octx = ColorCardsOnline.newCtx()) : octx;
  const v = ColorCardsOnline.view(m, ctx);
  if (m.fresh || !S || !S.net || S.gn !== m.gn) { startOnline(m, v); return; }
  const mine = viewerOf();
  S.st = v.st; S.model = m; S.names = m.names; S.sl = m.sl; S.sending = 0;
  if (S.pend && !(S.st.turn === mine && S.st.hands[mine].indexOf(S.pend.c) >= 0 && !S.st.over)) S.pend = null;
  S.hl = [];
  if (m.replaced && !S.over) { S.over = true; if (UI) UI.toast(T('席がCPUに交代しました'), { type: 'danger' }); emit('play_end', { mode: 'versus', score: 0, durationMs: Math.round(S.ms + (Date.now() - S.t0)), reason: 'quit' }); TR.leave(); S.menu = true; showTitle(); return; }
  onEvents(v.evs, -1);

  hud();
  if (m.ph === 'over' && !S.over) finishOnline(m);
}
function startOnline(m, v) {
  if (S) clearTimeout(S.timer);
  clearTable(); hideOverlays(); { const pb = $('peekBox'); if (pb) pb.remove(); }
  S = mkSession(v.st, 'online', false, 0);
  S.net = true; S.gn = m.gn; S.model = m; S.names = m.names; S.sl = m.sl; S.viewer = v.me; S.base = v.me; S.sending = 0;
  S.cfg = { n: m.n, level: m.cpu, mode: 'online', practice: false, match: 0 };
  $('rAgain').disabled = false;
  emit('play_start', { mode: 'versus' });
  measure();
  render(compute(S.st), dealOpts(S.st));
  hud();
  if (m.ph === 'over') { S.over = false; finishOnline(m); return; }
  startDeal(S.st);
}
function onlineTick(m) {
  if (!S || !S.net || !m) return;
  const sec = Math.ceil(Math.max(0, m.dl ? m.left : 0) / 1000);
  if (!S.over) {
    if (S.tsec !== sec) { S.tsec = sec; hud(); }
    const tmEl = tableEl.querySelector('.seat.on .bd.tm'); if (tmEl) tmEl.textContent = sec ? '⏱' + sec : '';
  } else if (!$('ovResult').hidden) onlineResultText(m);
}
function onlineResultText(m) {
  if (!m || (m.rs && m.rs.y !== 'w')) return;
  const sl = String(m.sl || ''), pu = m.pu || [];
  let total = 0; for (let k = 0; k < sl.length; k++) if (pu[k] >= 0 && sl[k] !== 'x') total++;
  const wished = Math.min(total, Object.keys(m.rm || {}).length);
  if ($('rAgain').disabled) $('rNote').textContent = T('もう一度を待っています（{a}/{b}人）', { a: wished, b: Math.max(1, total) });
  else $('rAgain').textContent = wished ? T('もう一度（{a}/{b}人）', { a: wished, b: Math.max(1, total) }) : T('もう一度');
}
function finishOnline(m) {
  if (!S || S.over) return;
  S.over = true; clearTimeout(S.timer);
  const rs = m.rs || { r: [], w: -1, y: 'w' }, ranks = ColorCardsOnline.arr(rs.r), me = m.me >= 0 ? m.me : 0;
  const ok = rs.y === 'w', win = ok && ranks[me] === 1;
  if (ok) { bump('onl'); if (win) bump('onw'); writeSave(); }
  emit('play_end', { mode: 'versus', score: 0, durationMs: Math.round(S.ms + (Date.now() - S.t0)), reason: win ? 'clear' : 'over' });
  if (win && !reduceMotion.matches) burst();
  sfx(win ? 'win' : 'over');
  hud();
  setTimeout(() => showOnlineResult(m, ranks, rs), 900);
}
function showOnlineResult(m, ranks, rs) {
  if (!S || !S.net || !S.over) return;
  const st = S.st, me = m.me >= 0 ? m.me : 0, ok = rs.y === 'w', rank = ranks[me] || 1;
  const order = ranks.map((r, s) => s).sort((a, b) => ranks[a] - ranks[b]);
  $('rTitle').textContent = !ok ? T('オンライン対戦が終わりました') : rank === 1 ? T('1位！おめでとう') : T('{n}位', { n: rank });
  $('rSub').textContent = T('オンライン') + ' · ' + T('{n}人', { n: st.n }) + (m.replaced ? ' · ' + T('席がCPUに交代しました') : '');
  fillRank($('rRank'), st, { order, rank: ranks, winner: rs.w, scores: [], points: [], gain: 0 });
  $('rRank').querySelectorAll('li').forEach((li, i) => { li.classList.toggle('me', order[i] === me); });
  $('rPts').textContent = ''; $('rNew').hidden = true;
  $('rNote').textContent = rs.y === 'hl' ? T('ホストが退出したので、ここで終了です') : rs.y === 'hg' ? T('ホストとの接続が切れたので、ここで終了です') : T('オンライン対戦は★に数えません');
  $('rAgain').disabled = !ok || !!m.replaced; $('rAgain').textContent = T('もう一度');
  hideOverlays(); $('ovResult').hidden = false;
  try { $('rAgain').disabled ? $('rTitleBtn').focus({ preventScroll: true }) : $('rAgain').focus({ preventScroll: true }); } catch (e) {}
}

// ---------- boot ----------
renderSound(); themeColor(); measure();
{
  $('iGame').textContent = T('いろあわせカード工房'); $('iTurn').hidden = true; $('iBest').textContent = '★ ' + fmtN(save.pts); $('status').textContent = ''; $('ctl').style.visibility = 'hidden';
  const first = store.get(HOWTO_KEY) == null && !save.tut;
  if (first) { save.tut = 1; writeSave(); showHowto(true); } else showTitle();
}

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const sel = step => (step.card != null ? '.cd[data-c="' + step.card + '"]' : '#ctl [data-id="' + step.btn + '"]');
  const api = {
    ready: () => true,
    state: () => {
      const st = S && S.st;
      return {
        started: !!S, mode: S ? S.mode : '', over: !!(S && S.over), practice: !!(S && S.practice), n: st ? st.n : 0, level: st ? st.level : 0,
        turn: st ? st.turn : -1, human: !!(S && humanTurn() && S.viewer === st.turn && !S.dealing), dealing: !!(S && S.dealing), phase: st ? st.phase : '', color: st ? st.color : -1, dir: st ? st.dir : 0,
        title: !$('ovTitle').hidden, result: !$('ovResult').hidden, round: !$('ovRound').hidden, pass: !$('ovPass').hidden, howto: !$('howto').hidden, menu: !!(S && S.menu),
        status: $('status').textContent, hand: st ? st.hands[viewerOf()].slice() : [], counts: st ? st.hands.map(h => h.length) : [], pend: !!(S && S.pend), roundNo: st ? st.round : 0, match: st ? st.match : 0,
        scores: st ? st.scores.slice() : [], pts: save.pts, hl: S ? S.hl.slice() : [], draw: st ? st.draw.length : 0, step: st ? st.step : 0, uncalled: st ? st.uncalled : -1, ward: st ? st.ward.slice() : [],
        save: JSON.parse(JSON.stringify(save)),
        net: !!(S && S.net), sl: S && S.sl ? S.sl : '', names: S && S.names ? S.names.slice() : [], sending: !!(S && S.sending),
      };
    },
  };
  window.__kb = Object.assign(window.__kb || {}, api);
  window.__colorcards = {
    api, E, get S() { return S; }, get save() { return save; },
    get tr() { return ensureTR(); }, openOnline, leaveOnline, ensureTR,
    onlineState() {
      const m = TR ? TR.model() : null, tr = TR ? TR._S : null;
      return { phase: TR ? TR.phase : 'off', host: TR ? TR.isHost : false, code: tr ? tr.code : null, rid: tr ? tr.rid : null, uid: TR ? TR.uid : null, err: tr ? tr.err : null,
        model: m ? { gn: m.gn, v: m.v, ph: m.ph, me: m.me, n: m.n, tn: m.tn, sl: m.sl, names: m.names, why: m.why, left: m.left, pd: m.pd } : null, lobby: !!document.querySelector('.ktr-ov:not([hidden])') };
    },
    start(o) { startGame(o || {}); return api.state(); },
    setSpeed(m) { cpuDelayMul = m; },
    plan() { return S && !S.over && humanTurn() && !S.dealing ? (S.pend ? [] : planOf(hintMove())).map(s => Object.assign({ sel: sel(s) }, s)) : []; },
    move() { return S ? hintMove() : null; },
    title: showTitle, finish() { if (S && !S.over) finish(); }, howto: showHowto, openMenu,
    resume() { const r = readRun(); if (r) resumeGame(r); return !!r; },
    persist, rig(fn) { if (S) { fn(S.st); refresh(); } return api.state(); },
    thumbScene() { // a three-player game in progress, your turn with a good hand, for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); hideOverlays(); clearTable();
      let st = null;
      for (let seed = 1; seed < 3000 && !st; seed++) {
        const c = E.create({ seed, n: 3, level: 2, humans: [0], first: 1 });
        for (let k = 0; k < 14 && !c.over && c.turn !== 0; k++) E.apply(c, E.cpu(c));
        if (c.over || c.turn !== 0 || c.phase !== 'play') continue;
        const h = c.hands[0], kinds = new Set(h.map(x => E.INFO[x].kind));
        if (h.length >= 6 && h.length <= 8 && kinds.size >= 3 && h.filter(x => E.playable(c, x)).length >= 2 && c.hands[1].length >= 4 && c.hands[2].length >= 4) st = c;
      }
      S = mkSession(st, 'quick', false, 0);
      S.cfg = { n: 3, level: 2, mode: 'quick', practice: false, match: 0 };
      measure(); render(compute(st), { instant: true }); hud();
      return true;
    },
  };
}
})();
