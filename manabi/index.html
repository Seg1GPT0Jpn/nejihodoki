<style>
/* まなびの工房：ポップな色（--kb-* の上に、このアプリだけの色を重ねる。ボタンの文字色は塗りの色に対して 4.5:1 以上（tools/tests/manabi-play.js が数値で確かめる）） */
:root {
  --pg: #38d26b; --pg-d: #1f9a49; --pg-ink: #052e16;
  --pb: #3aa7ff; --pb-d: #1a72c4; --pb-ink: #04203d;
  --po: #ffa02e; --po-d: #c76d00; --po-ink: #3a1c00;
  --pr: #ff5d6c; --pr-d: #c92b3d; --pr-ink: #3d0510;
  --pp: #b084ff; --pp-d: #7a4fd6; --pp-ink: #1d0a45;
  --py: #ffd23f; --py-d: #c9a000; --py-ink: #3a2c00;
  --pt: #2fd8c0; --pt-d: #14a08c; --pt-ink: #022b26;
  --pk: #ff7fb0; --pk-d: #cc4a80; --pk-ink: #3d0a1f;
  --pi: #8c9cff; --pi-d: #5667d6; --pi-ink: #0c1245;
  --mn-ok: var(--pg); --mn-ng: var(--pr);
  --mn-gutter: 16px; --mn-font: 'M PLUS Rounded 1c', 'Nunito', 'Hiragino Maru Gothic ProN', 'Yu Gothic', system-ui, sans-serif;
  --mn-lift: cubic-bezier(.34, 1.56, .64, 1);
  --sc: var(--pb); --sc-d: var(--pb-d); --sc-ink: var(--pb-ink);
}
[data-sub="english"] { --sc: var(--pb); --sc-d: var(--pb-d); --sc-ink: var(--pb-ink); }
[data-sub="math"] { --sc: var(--po); --sc-d: var(--po-d); --sc-ink: var(--po-ink); }
[data-sub="japanese"] { --sc: var(--pk); --sc-d: var(--pk-d); --sc-ink: var(--pk-ink); }
[data-sub="kobun"] { --sc: var(--pp); --sc-d: var(--pp-d); --sc-ink: var(--pp-ink); }
[data-sub="science"] { --sc: var(--pt); --sc-d: var(--pt-d); --sc-ink: var(--pt-ink); }
[data-sub="social"] { --sc: var(--py); --sc-d: var(--py-d); --sc-ink: var(--py-ink); }
[data-sub="information"], [data-sub="integrated"] { --sc: var(--pi); --sc-d: var(--pi-d); --sc-ink: var(--pi-ink); }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--kb-bg); color: var(--kb-ink); font-family: var(--mn-font); font-weight: 500; line-height: 1.55; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: var(--kb-sat) var(--kb-sar) 0 var(--kb-sal); max-width: 760px; margin: 0 auto; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--kb-focus); outline-offset: 2px; }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
.cf { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: cfall 1.6s ease-in forwards; }
@keyframes cfall { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: .9; } }
/* 上のバー */
.top { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px var(--mn-gutter) 4px 6px; min-height: 52px; }
.back, .icon { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; flex: none; border: 0; background: transparent; color: var(--kb-dim); border-radius: 14px; text-decoration: none; }
.back svg, .icon svg { width: 24px; height: 24px; }
.ttl { flex: 1 1 auto; min-width: 0; font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; min-height: 36px; border-radius: 999px; background: transparent; border: 0; font-size: 15px; font-weight: 800; white-space: nowrap; }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip.flame { color: #e86a00; } .chip.gem { color: #8a4fe0; } .chip.goal.met { color: #12803a; } .chip.heart { color: #d92b45; }
:root[data-kb-theme="dark"] .chip.flame, :root:not([data-kb-theme="light"]) .chip.flame { color: #ffa02e; }
@media (prefers-color-scheme: light) { :root:not([data-kb-theme="dark"]) .chip.flame { color: #b35200; } :root:not([data-kb-theme="dark"]) .chip.gem { color: #6b32c9; } }
:root[data-kb-theme="dark"] .chip.gem { color: #c3a0ff; } :root[data-kb-theme="dark"] .chip.goal.met { color: #5be38a; } :root[data-kb-theme="dark"] .chip.heart { color: #ff7f90; }
.chip.flame.bump svg { animation: bump .7s var(--mn-lift); }
@keyframes bump { 30% { transform: scale(1.7) rotate(-8deg); } }
#view { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
#main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px var(--mn-gutter) 24px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
/* 下のタブ */
#tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px 6px calc(4px + var(--kb-sab)); background: var(--kb-surface); border-top: 2px solid var(--kb-line); }
#tabs button { position: relative; min-height: 52px; border: 0; background: transparent; border-radius: 14px; display: grid; place-items: center; gap: 0; font-size: 11.5px; font-weight: 800; color: var(--kb-dim); padding: 2px 0; }
#tabs button svg { width: 26px; height: 26px; }
#tabs button[aria-current="page"] { color: var(--kb-ink); background: color-mix(in srgb, var(--sc) 22%, transparent); }
#tabs .dot { position: absolute; top: 6px; right: 22%; width: 10px; height: 10px; border-radius: 50%; background: var(--pr); }
/* ポップなボタン（下の縁が押すと縮む） */
.btn, .pbtn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; width: 100%; padding: 0 16px; border-radius: 16px; border: 0; background: var(--kb-surface-2); color: var(--kb-ink); font-weight: 800; font-size: 16px; letter-spacing: .02em; box-shadow: 0 4px 0 var(--kb-line); transition: transform .09s, box-shadow .09s; }
.btn:active, .pbtn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--kb-line); }
.btn.primary, .btn.ok, .go, .pbtn.g { background: var(--pg); color: var(--pg-ink); box-shadow: 0 4px 0 var(--pg-d); }
.btn.primary:active, .btn.ok:active, .go:active, .pbtn.g:active { box-shadow: 0 0 0 var(--pg-d); }
.btn.ng { background: var(--pr); color: var(--pr-ink); box-shadow: 0 4px 0 var(--pr-d); } .btn.ng:active { box-shadow: 0 0 0 var(--pr-d); }
.btn.b { background: var(--pb); color: var(--pb-ink); box-shadow: 0 4px 0 var(--pb-d); } .btn.b:active { box-shadow: 0 0 0 var(--pb-d); }
.btn.p { background: var(--pp); color: var(--pp-ink); box-shadow: 0 4px 0 var(--pp-d); } .btn.p:active { box-shadow: 0 0 0 var(--pp-d); }
.btn.sc { background: var(--sc); color: var(--sc-ink); box-shadow: 0 4px 0 var(--sc-d); } .btn.sc:active { box-shadow: 0 0 0 var(--sc-d); }
.btn.sub { min-height: 44px; font-size: 14px; }
.btn[disabled] { background: var(--kb-surface-2); color: var(--kb-dim); box-shadow: 0 4px 0 var(--kb-line); opacity: .75; cursor: default; transform: none; }
/* コース・教科・学年 */
.seg { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--kb-surface-2); color: var(--kb-ink); font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--kb-line); }
.seg button[aria-pressed="true"] { background: var(--sc); color: var(--sc-ink); box-shadow: 0 3px 0 var(--sc-d); }
.subs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.subs button { flex: 1 1 28%; min-height: 44px; padding: 0 6px; border: 0; border-radius: 14px; background: var(--kb-surface-2); font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--kb-line); }
.subs button[aria-pressed="true"] { background: var(--sc); color: var(--sc-ink); box-shadow: 0 3px 0 var(--sc-d); }
.grades { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px; }
.grades button { min-height: 36px; min-width: 56px; padding: 0 12px; border: 0; background: transparent; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--kb-dim); }
.grades button[aria-pressed="true"] { background: var(--kb-ink); color: var(--kb-bg); }
/* 学びの道 */
.sect { margin: 18px 0 8px; padding: 12px 14px; border-radius: 18px; background: var(--sc); color: var(--sc-ink); box-shadow: 0 4px 0 var(--sc-d); }
.sect b { display: block; font-size: 17px; line-height: 1.3; } .sect small { font-size: 12.5px; font-weight: 700; opacity: .9; }
.path { display: flex; flex-direction: column; align-items: center; padding: 6px 0 4px; }
.unit { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; margin: 4px 0 10px; }
.unit .nodewrap { position: relative; display: inline-block; }
.unit .go { position: relative; width: 84px; height: 76px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; background: var(--sc); color: var(--sc-ink); box-shadow: 0 7px 0 var(--sc-d); font-weight: 900; font-size: 22px; transition: transform .09s, box-shadow .09s; }
.unit .go:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--sc-d); }
.unit .go svg.ring { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
.unit.locked .go { background: var(--kb-surface-2); color: var(--kb-dim); box-shadow: 0 7px 0 var(--kb-line); }
.unit.done .go { background: var(--py); color: var(--py-ink); box-shadow: 0 7px 0 var(--py-d); }
.unit.cur .go { width: 92px; height: 84px; animation: idle 2.4s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-3px); } }
.unit .lbl { margin-top: 12px; max-width: 78%; text-align: center; font-weight: 800; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.unit .lbl small { display: block; color: var(--kb-dim); font-weight: 700; font-size: 11.5px; }
.crowns { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); display: flex; gap: 1px; background: var(--kb-surface); border-radius: 999px; padding: 1px 6px; box-shadow: 0 2px 0 var(--kb-line); font-size: 11px; font-weight: 900; color: #a06a00; white-space: nowrap; }
:root[data-kb-theme="dark"] .crowns { color: #ffd23f; }
.start { position: absolute; left: 50%; top: -42px; transform: translateX(-50%); padding: 5px 12px; border-radius: 12px; background: var(--kb-surface); color: var(--sc-d); font-weight: 900; font-size: 13px; letter-spacing: .08em; box-shadow: 0 3px 0 var(--kb-line); animation: hop 1.1s var(--mn-lift) infinite; white-space: nowrap; }
.start::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: var(--kb-surface); transform: translateX(-50%) rotate(45deg); }
:root[data-kb-theme="dark"] .start { color: var(--sc); }
@keyframes hop { 50% { transform: translateX(-50%) translateY(-6px); } }
#jumpCur { position: fixed; right: 16px; bottom: calc(76px + var(--kb-sab)); width: 52px; min-height: 52px; padding: 0; border-radius: 50%; z-index: 20; }
#jumpCur svg { width: 26px; height: 26px; }
/* ポップオーバー（ノードをタップ） */
.sheetbg { position: fixed; inset: 0; z-index: 50; background: var(--kb-scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--kb-surface); border-radius: 24px 24px 0 0; padding: 18px var(--mn-gutter) calc(18px + var(--kb-sab)); animation: slideup .28s var(--mn-lift); }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { margin: 0 0 2px; font-size: 20px; line-height: 1.3; } .sheet p { margin: 0 0 12px; color: var(--kb-dim); font-size: 14px; }
.sheet .row { display: flex; gap: 10px; align-items: center; margin: 0 0 12px; }
/* 一般 */
.card { background: var(--kb-surface); border-radius: 20px; padding: 14px; box-shadow: 0 3px 0 var(--kb-line); }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.banner { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding: 14px; border-radius: 20px; border: 0; background: var(--kb-surface); box-shadow: 0 4px 0 var(--kb-line); width: 100%; text-align: left; }
.banner .t { flex: 1 1 auto; min-width: 0; } .banner b { display: block; font-size: 16px; } .banner small { color: var(--kb-dim); font-size: 12.5px; }
.banner.review { background: color-mix(in srgb, var(--po) 30%, var(--kb-surface)); box-shadow: 0 4px 0 var(--po-d); }
.banner[disabled] { opacity: .6; cursor: default; }
.banner:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--kb-line); }
.pill { flex: none; min-width: 44px; text-align: center; padding: 6px 12px; border-radius: 999px; background: var(--po); color: var(--po-ink); font-weight: 900; font-size: 14px; }
.dom { margin: 14px 0 6px; font-size: 12.5px; color: var(--kb-dim); font-weight: 800; }
.foot { margin: 18px 0 0; font-size: 11.5px; color: var(--kb-dim); line-height: 1.6; } .foot p { margin: 0 0 4px; } .lic { margin: 8px 0 0; } .lic summary { cursor: pointer; font-weight: 800; padding: 10px 0; min-height: 44px; display: flex; align-items: center; } .licitem { padding: 8px 0; border-top: 1px solid var(--kb-line, rgba(128,128,128,.3)); } .licitem div, .licitem small, .licitem a { display: block; overflow-wrap: anywhere; }
