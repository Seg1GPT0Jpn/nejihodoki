<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貿易ゲーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="貿易ゲーム">
<meta name="description" content="資源と技術で製品をつくって輸出する、地理総合の「貿易ゲーム」。8つの国に分かれ、交渉しながら40分でお金をかせぐ。">
<script src="../common/i18n.js"></script>
<script src="../common/ui.js"></script>
<script src="en.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Inter+Tight:wght@500;600&display=swap">
<style>
/* Direction: keynote-grade dark product UI. Near-black cool neutral, depth by lighter surfaces + 1px alpha hairlines
   (Apple HIG elevated/base, Fluent strokes, Geist alpha borders), ONE accent (#4589ff) for the primary action / you /
   selection only, semantic up/down always paired with ▲▼, 4 product colors from IBM Carbon's dark categorical set,
   Inter Tight + IBM Plex Sans JP + IBM Plex Mono (tabular numbers), radii 6/12/16, blur only on floating layers.
   Deliberately single-theme (dark), so every color is set explicitly. */
:root{
  color-scheme:dark;
  --ov:255,255,255; --bg-rgb:11,12,15; --s2-rgb:25,27,32; --me-card:#16223a; --accent-hover:#5a97ff; --on-accent:#fff;
  --bg:#0b0c0f; --s1:#121317; --s2:#191b20; --s3:#22252b; --s4:#2b2f36;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); --line-3:rgba(255,255,255,.22);
  --text:#f2f3f5; --text-2:#a7abb3; --text-3:#6f747d;
  --accent:#4589ff; --accent-2:#78a9ff; --accent-weak:rgba(69,137,255,.14); --accent-glow:rgba(69,137,255,.35);
  --up:#42be65; --up-weak:rgba(66,190,101,.14); --down:#fa4d56; --down-weak:rgba(250,77,86,.14); --warn:#f1c21b; --warn-weak:rgba(241,194,27,.14);
  --p-rect:#d2a106; --p-tri:#ff7eb6; --p-semi:#08bdba; --p-circle:#a56eff;
  --r-sm:6px; --r-md:12px; --r-lg:16px;
  --shadow-1:0 1px 2px rgba(0,0,0,.28),0 0 2px rgba(0,0,0,.14);
  --shadow-pop:0 24px 48px rgba(0,0,0,.5),0 0 0 1px var(--line-2);
  --ease:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.05,.7,.1,1); --ease-out:cubic-bezier(.3,0,.8,.15);
  --f-display:"Inter Tight","IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-kb-theme="dark"]){
  color-scheme:light;
  --ov:15,23,42; --bg-rgb:243,245,248; --s2-rgb:255,255,255; --me-card:#e6efff; --accent-hover:#0b4fd6; --on-accent:#fff;
  --bg:#f3f5f8; --s1:#ffffff; --s2:#f5f7fb; --s3:#e9edf3; --s4:#dce2ea;
  --line:rgba(15,23,42,.10); --line-2:rgba(15,23,42,.18); --line-3:rgba(15,23,42,.30);
  --text:#151922; --text-2:#454c58; --text-3:#646c79;
  --accent:#0f62fe; --accent-2:#0043ce; --accent-weak:rgba(15,98,254,.10); --accent-glow:rgba(15,98,254,.25);
  --up:#0e7a36; --up-weak:rgba(14,122,54,.12); --down:#c9182b; --down-weak:rgba(201,24,43,.10); --warn:#8a5a00; --warn-weak:rgba(177,126,0,.14);
  --shadow-1:0 1px 2px rgba(15,23,42,.10),0 0 2px rgba(15,23,42,.06);
  --shadow-pop:0 24px 48px rgba(15,23,42,.22),0 0 0 1px var(--line-2);
}}
:root[data-kb-theme="light"]{
  color-scheme:light;
  --ov:15,23,42; --bg-rgb:243,245,248; --s2-rgb:255,255,255; --me-card:#e6efff; --accent-hover:#0b4fd6; --on-accent:#fff;
  --bg:#f3f5f8; --s1:#ffffff; --s2:#f5f7fb; --s3:#e9edf3; --s4:#dce2ea;
  --line:rgba(15,23,42,.10); --line-2:rgba(15,23,42,.18); --line-3:rgba(15,23,42,.30);
  --text:#151922; --text-2:#454c58; --text-3:#646c79;
  --accent:#0f62fe; --accent-2:#0043ce; --accent-weak:rgba(15,98,254,.10); --accent-glow:rgba(15,98,254,.25);
  --up:#0e7a36; --up-weak:rgba(14,122,54,.12); --down:#c9182b; --down-weak:rgba(201,24,43,.10); --warn:#8a5a00; --warn-weak:rgba(177,126,0,.14);
  --shadow-1:0 1px 2px rgba(15,23,42,.10),0 0 2px rgba(15,23,42,.06);
  --shadow-pop:0 24px 48px rgba(15,23,42,.22),0 0 0 1px var(--line-2);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(69,137,255,.10),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(8,189,186,.05),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--text-3);font-weight:500}

/* HUD: control layer, so it may use glass */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(var(--bg-rgb),.72);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand h1{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.flag{display:inline-block;width:14px;height:10px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.clock{display:flex;align-items:center;gap:10px}
.clock svg{width:34px;height:34px;flex:none}
.clock-t{font-family:var(--f-mono);font-size:20px;line-height:1;font-weight:500}
.clock-t small{display:block;font-family:var(--f-body);font-size:11px;color:var(--text-3);margin-top:4px;font-weight:400}
.goal{display:flex;flex-direction:column;line-height:1.2;font-size:11px;color:var(--text-3)}
.goal b{font-family:var(--f-mono);font-weight:500;font-size:18px;color:var(--text)}
.goal b.up{color:var(--up)}
.wallet{margin-left:auto;display:flex;align-items:baseline;gap:12px;padding:4px 0}
.wallet .amt{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;transition:color .4s var(--ease)}
.wallet .clips{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--text-3);font-family:var(--f-mono)}
.wallet.bump .amt{color:var(--up)}
.hud-btns{display:flex;gap:6px}
.hbtn{text-decoration:none;display:inline-block;border:1px solid var(--line-2);background:transparent;color:var(--text-2);border-radius:var(--r-sm);padding:6px 12px;font-size:12px;white-space:nowrap;transition:border-color .12s var(--ease),color .12s var(--ease)}
.hbtn:hover{border-color:var(--line-3);color:var(--text)}
.hbtn[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}

/* stage */
.stage-wrap{padding-block:20px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{max-width:1240px;margin:0 auto;position:relative}
.stage-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;padding:0 2px 12px}
.stage-h h2{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em}
.stage-h p{margin:2px 0 0;font-size:13px;color:var(--text-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
#map{display:block;width:100%;height:auto;max-width:100%;border-radius:var(--r-lg);border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 50%,rgba(69,137,255,.08),transparent 65%),
    radial-gradient(circle,rgba(var(--ov),.07) 1px,transparent 1.2px) 0 0/24px 24px,var(--s1)}
#map .lane{stroke:rgba(var(--ov),.10);stroke-width:1;fill:none}
#map .node{cursor:pointer}
#map .node .card{fill:var(--s2);stroke:var(--line-2);stroke-width:1;transition:stroke .12s}
#map .node:hover .card,#map .node:focus .card{stroke:var(--accent-2)}
#map .node:focus{outline:none}
#map .node.me .card{fill:var(--me-card);stroke:var(--accent);stroke-width:1.5}
#map .node.me{cursor:default}
#map .nm{font-family:var(--f-body);font-weight:600;fill:var(--text)}
#map .sm{fill:var(--text-2);font-family:var(--f-mono)}
#map .hub-c{fill:var(--bg);stroke:var(--accent);stroke-width:1.5}
#map .hub-t{font-family:var(--f-body);font-weight:600;fill:var(--text)}
#map .hub-e{font-family:var(--f-mono);fill:var(--accent-2);letter-spacing:.12em}
#map .badge{fill:var(--accent)}
#map .badge-t{fill:#fff;font-family:var(--f-body);font-weight:600}

/* board */
.board{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:start;
  padding-block:12px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1120px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.feed{grid-column:1/-1}}
@media (max-width:740px){.board{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:0 0 16px;min-width:0}
.panel-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:16px 16px 12px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:17px;letter-spacing:-.005em}
.panel-h h2::before{content:attr(data-eyebrow);display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--text-3);font-weight:500;margin-bottom:2px}
.panel-h .sub{font-size:12px;color:var(--text-2)}
.panel>:not(.panel-h){margin-left:16px;margin-right:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

/* tray */
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.slot{position:relative;min-height:74px;background:var(--s2);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px 8px 6px;color:var(--text-2);font-size:11px;line-height:1.2;min-width:0}
.slot svg{width:20px;height:20px}
.slot .n{font-family:var(--f-mono);font-size:18px;color:var(--text);font-weight:500;line-height:1}
.slot .l{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;order:3;margin-top:3px}
.slot.zero .n,.slot.zero svg{opacity:.3}
.slot.res svg{color:var(--text)}
.slot.tech svg{color:var(--accent-2)}
.slot.lab svg{color:var(--text)}
.slot .meter{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.slot .meter i{display:block;height:100%;background:var(--text-2)}
.tray-cap{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-3);margin-top:8px!important;margin-bottom:18px!important;flex-wrap:wrap}
.tray-cap span:last-child{color:var(--up);font-family:var(--f-mono)}

/* production lines */
.lines{display:flex;flex-direction:column;gap:14px}
.line{border-top:1px solid var(--line);padding-top:12px}
.line:first-child{border-top:0;padding-top:0}
.line-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:12px}
.line-top .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--text-3)}
.line-status{font-size:12px;color:var(--text-2);margin-left:auto;text-align:right}
.line-status.bad{color:var(--warn)}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line-2);background:var(--s2);border-radius:var(--r-sm);padding:8px;font-size:11px;line-height:1.25;text-align:left;transition:border-color .12s var(--ease),background .12s var(--ease)}
.pick:hover:not(:disabled){border-color:var(--line-3);background:var(--s3)}
.pick svg.pi{width:26px;height:21px}
.pick b{font-size:12px;font-weight:600;color:var(--text)}
.pick[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--s2));box-shadow:0 0 0 1px var(--pc),0 0 18px color-mix(in srgb,var(--pc) 30%,transparent)}
.pick:disabled{opacity:.35;cursor:not-allowed}
.recipe{display:flex;align-items:center;gap:2px;color:var(--text-3)}
.recipe svg{width:12px;height:12px}
.recipe .miss{color:var(--down)}
.belt{position:relative;height:2px;margin-top:10px;border-radius:1px;background:var(--line)}
.belt .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--pc,var(--accent));box-shadow:0 0 10px var(--pc,var(--accent));border-radius:1px}
.belt svg{display:none}
.empty-note{font-size:13px;color:var(--text-2);margin:0}

/* market */
.tick{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.tick:first-of-type{border-top:0;padding-top:0}
.tick .ic{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pc) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 35%,transparent)}
.tick .ic svg{width:24px;height:20px}
.tick .nm{font-weight:600;font-size:14px}
.tick .nm small{display:block;font-weight:400;font-size:11px;color:var(--text-3)}
.price{text-align:right;line-height:1.1}
.price .v{display:block;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price .d{display:inline-block;margin-top:3px;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px}
.price.down .d{color:var(--down);background:var(--down-weak)}
.price.up .d{color:var(--up);background:var(--up-weak)}
.price.flat .d{color:var(--text-3)}
.tick-low{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end;margin-top:8px}
.spark{width:100%;height:28px;display:block}
.supply{font-size:11px;color:var(--text-3);font-family:var(--f-mono)}
.supply b{color:var(--text-2);font-weight:500}
.supply .bar{position:relative;height:2px;background:var(--line);margin-top:5px}
.supply .bar i{position:absolute;inset:0 auto 0 0;background:var(--pc)}
.supply .bar i.over{background:var(--down)}
.supply.warn{color:var(--warn)}
.sell{display:flex;gap:4px;justify-content:flex-end}
.btn{border:1px solid var(--line-2);background:transparent;color:var(--text);border-radius:var(--r-sm);padding:7px 12px;font-size:12px;font-weight:500;white-space:nowrap;transition:border-color .12s var(--ease),background .12s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--line-3);background:rgba(var(--ov),.05)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary,.btn.gold,.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled),.btn.gold:hover:not(:disabled),.btn.go:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.big{padding:11px 22px;font-size:14px;font-weight:600}
.btn .amt{font-family:var(--f-mono);margin-left:6px;opacity:.85}
details.how{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:12px}
details.how summary{cursor:pointer;color:var(--accent-2)}
details.how p{margin:6px 0 0;color:var(--text-2)}

/* feed */
.offers{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.offer{border-radius:var(--r-sm);padding:12px;background:var(--s2);border:1px solid var(--line-2);box-shadow:inset 2px 0 0 var(--accent);font-size:13px;display:flex;flex-direction:column;gap:8px;animation:rise .24s var(--ease-in)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.offer-h{display:flex;align-items:center;gap:8px;font-weight:600}
.offer-h .ttl{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400;font-family:var(--f-mono)}
.offer .row{display:flex;gap:6px;flex-wrap:wrap}
.offer .x{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.offer .x span{color:var(--text-3);font-size:12px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:440px;overflow:auto;font-size:12px}
.news li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);color:var(--text-2)}
.news li:first-child{border-top:0}
.news li.un span{color:var(--text)}
.news li.warn span{color:var(--down)}
.news li.me span{color:var(--up)}
.news time{color:var(--text-3);font-size:11px;font-family:var(--f-mono);padding-top:1px}

/* floating layers (glass allowed) */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;animation:fade .4s var(--ease);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
.modal{background:rgba(var(--s2-rgb),.9);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);color:var(--text);border-radius:var(--r-lg);width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);min-width:0;animation:pop .24s var(--ease-in)}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}}
.modal-body{overflow:auto;padding:28px 28px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.modal-body>*{flex-shrink:0}
.modal-foot{padding:14px 28px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal-foot .grow{margin-right:auto;font-size:12px;color:var(--text-3)}
.modal h2{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em;line-height:1.25}
.modal h3{font-size:12px;font-weight:500;font-family:var(--f-mono);letter-spacing:.08em;color:var(--text-3);text-transform:none}
.lead{color:var(--text-2);font-size:14px;margin:0;max-width:62ch}
.question{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.3;margin:0;color:var(--text);max-width:22ch}
.question small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--accent-2);margin-bottom:10px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.rcard{padding:14px;background:var(--s2);display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2)}
.rcard .top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.rcard .top svg{width:30px;height:24px}
.rcard .p{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.rcard b{font-size:14px;color:var(--text);box-shadow:inset 0 -2px 0 var(--pc);align-self:flex-start}
.rcard .recipe svg{width:14px;height:14px}
.facts{margin:0;padding-left:1.1em;font-size:13px;display:flex;flex-direction:column;gap:6px;color:var(--text-2)}
.facts li::marker{color:var(--text-3)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt label{font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--text-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:transparent;color:var(--text-2);border-radius:var(--r-sm);padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-weak)}
.name-in{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;font-size:18px;font-weight:600;color:var(--text)}
.name-in::placeholder{color:var(--text-3);font-weight:400;font-size:15px}
.name-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

/* event card */
.ev-top{padding:28px 28px 0;display:flex;gap:16px;align-items:flex-start}
.ev-top svg{width:40px;height:40px;flex:none;padding:8px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px currentColor}
.ev-top small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
.ev.crash .ev-top{color:var(--down)} .ev.aid .ev-top{color:var(--warn)} .ev.rise .ev-top{color:var(--up)} .ev.find .ev-top{color:var(--accent-2)}
.ev-top h2{color:var(--text)}
.kpi{font-family:var(--f-display);font-weight:600;font-size:54px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{font-family:var(--f-body);font-size:13px;font-weight:400;letter-spacing:0;color:var(--text-2);margin-left:10px}
.ev.crash .kpi{color:var(--down)}
.ev dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;font-size:14px}
.ev dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--text-3);padding-top:3px;white-space:nowrap}
.ev dd{margin:0;color:var(--text-2)}
.ev dd:first-of-type{color:var(--text)}
.term{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--text-2)}
.term b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--accent-2);font-weight:500;margin-right:8px}

/* contract */
.c-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.c-head .no{font-size:11px;color:var(--text-3);font-family:var(--f-mono);letter-spacing:.06em}
.c-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
@media (max-width:580px){.c-cols{grid-template-columns:minmax(0,1fr)}}
.c-side{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--s1)}
.c-side h3{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--text);letter-spacing:0}
.c-side h3 small{color:var(--text-3);font-weight:400}
.step{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px}
.step svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.step>div:first-of-type{flex:1 1 90px;min-width:0}
.step .ctl{display:flex;align-items:center;gap:4px;margin-left:auto}
.step .ctl button{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:transparent;font-weight:500;padding:0;color:var(--text-2)}
.step .ctl button:hover{border-color:var(--line-3);color:var(--text)}
.step .ctl button.wide{width:auto;padding:0 7px;font-size:11px;font-family:var(--f-mono)}
.step .ctl output{min-width:58px;text-align:center;font-family:var(--f-mono);font-size:14px;font-weight:500}
.step .have{color:var(--text-3);font-size:11px}
.reply{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;min-height:48px}
.reply .flag{margin-top:6px}
.reply.ok{border-color:rgba(66,190,101,.45);background:var(--up-weak)}
.reply.ng{border-color:rgba(250,77,86,.4);background:var(--down-weak)}
.sign{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-3);flex-wrap:wrap;font-family:var(--f-mono)}
.sign span{border-bottom:1px solid var(--line-2);min-width:160px;padding-bottom:4px}
.modal.contract{position:relative}
.modal.contract .modal-body{position:static}
.stamp{position:absolute;right:28px;bottom:84px;z-index:2;pointer-events:none;font-family:var(--f-display);font-weight:600;font-size:22px;padding:8px 16px;border:1.5px solid currentColor;border-radius:var(--r-sm);background:rgba(var(--bg-rgb),.8);text-align:center;line-height:1.1}
.stamp small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;font-weight:500}
.stamp.ok{color:var(--up);box-shadow:0 0 24px rgba(66,190,101,.35)}
.stamp.ng{color:var(--down);box-shadow:0 0 24px rgba(250,77,86,.3)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:seal .24s var(--ease-in)}}
@keyframes seal{from{transform:scale(1.25);opacity:0}}

/* debrief */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps span{font-size:11px;font-family:var(--f-mono);color:var(--text-3);padding-top:8px;border-top:2px solid var(--line-2);letter-spacing:.04em}
.steps span.on{color:var(--text);border-top-color:var(--accent)}
.reveal{font-size:15px;color:var(--text-2);border-left:2px solid var(--accent);padding:4px 0 4px 16px}
.reveal b{color:var(--text);font-weight:600}
.feel{display:flex;flex-wrap:wrap;gap:6px}
.feel button{border:1px solid var(--line-2);background:transparent;color:var(--text-2);border-radius:999px;padding:6px 14px;font-size:13px}
.feel button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-weak)}
.moments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13px}
.moments li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--text-2)}
.moments time{font-family:var(--f-mono);color:var(--accent-2);font-size:12px}
.chart-wrap{overflow-x:auto}
.chart{width:100%;min-width:480px;height:auto;display:block}
.chart text{fill:var(--text-3);font-size:11px;font-family:var(--f-mono)}
.chart .grid{stroke:rgba(var(--ov),.08)}
.chart .lbl{fill:var(--text);font-family:var(--f-body);font-size:12px;font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank th,.rank td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rank th{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.06em}
.rank td.r,.rank th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rank tr.me td{background:var(--accent-weak);color:var(--text)}
.tw{overflow-x:auto}
.typebars{display:flex;flex-direction:column;gap:10px}
.tb{display:grid;grid-template-columns:64px minmax(0,1fr) 84px;align-items:center;gap:12px;font-size:13px}
.tb .o{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.tb .o i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tb .v{text-align:right;font-family:var(--f-mono)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.stat div{background:var(--s2);padding:16px;font-size:12px;color:var(--text-3)}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--text);margin:4px 0;font-variant-numeric:tabular-nums}
.qs{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--text-2)}
.qs b{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:rgba(var(--s2-rgb),.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--text);border:1px solid var(--line-2);padding:10px 16px;border-radius:var(--r-sm);font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow-pop)}
.paused{font-size:11px;font-family:var(--f-mono);color:var(--warn);white-space:nowrap;letter-spacing:.06em}
/* mission bar, goal chips, route, juice */
.mbar{max-width:1240px;margin:8px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--text-2)}
.mbar[hidden]{display:none}
.mbar b{color:var(--text);font-weight:600}
.mbar .mname{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--accent-2)}
.mbar .mgoal{display:inline-flex;align-items:center;gap:6px}
.mbar .mgoal i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-3);color:var(--text-3)}
.mbar .mgoal.ok i{background:var(--up);border-color:var(--up);color:#fff}
.mbar .mgoal.ok{color:var(--text)}
.mbar .mstars{font-family:var(--f-mono);color:var(--warn);letter-spacing:.1em}
.mbar .mprog{flex:1 1 120px;min-width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mbar .mprog i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.chip.diff-h{color:var(--down);border-color:var(--down)} .chip.diff-e{color:var(--up);border-color:var(--up)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line-2);background:var(--s2);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--text-2);min-height:44px}
.mcard b{font-size:14px;color:var(--text)}
.mcard .st{font-family:var(--f-mono);color:var(--warn);letter-spacing:.1em;font-size:12px}
.mcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.mcard:disabled{opacity:.4;cursor:not-allowed}
.mgoals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text-2)}
.mgoals li::before{content:"○ ";color:var(--text-3)} .mgoals li.ok::before{content:"● ";color:var(--up)} .mgoals li.ok{color:var(--text)}
.mgoals .tier{font-family:var(--f-mono);font-size:11px;color:var(--warn);margin-right:6px}
.starbig{font-family:var(--f-display);font-size:44px;letter-spacing:.12em;color:var(--warn);line-height:1}
.starbig .off{color:var(--line-3)}
#map .lane.jam{stroke:var(--down);stroke-dasharray:5 5;stroke-width:1.6}
#map .jam-t{fill:var(--down);font-family:var(--f-mono)}
.tag-ev{display:inline-flex;margin-left:6px;font-family:var(--f-mono);font-size:10px;padding:0 6px;border-radius:4px;color:var(--warn);background:var(--warn-weak)}
.fee-note{font-size:12px;color:var(--down);margin:0}
.confetti{position:fixed;z-index:80;width:8px;height:12px;pointer-events:none;border-radius:2px}
.coin{position:fixed;z-index:70;width:10px;height:10px;border-radius:50%;background:var(--warn);pointer-events:none;box-shadow:0 0 8px var(--warn)}
.combo{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--warn)}
.price .v.flash-up{animation:flashup .9s var(--ease)} .price .v.flash-down{animation:flashdown .9s var(--ease)}
@keyframes flashup{0%{color:var(--up)}100%{color:var(--text)}} @keyframes flashdown{0%{color:var(--down)}100%{color:var(--text)}}
#langPick select{min-height:44px;min-width:120px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);color:var(--text);padding:4px 10px;font-size:14px}
button,.node{touch-action:manipulation}
.btn.kbd::after{content:attr(data-k);margin-left:6px;font-family:var(--f-mono);font-size:10px;opacity:.55}
@media (pointer:coarse){.btn.kbd::after{display:none}}
.float{position:fixed;z-index:70;font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--up);pointer-events:none}
@media (max-width:600px){
  .brand{display:none}
  .hud-in{gap:6px 14px}
  .wallet .amt{font-size:22px}
  .wallet .clips{display:none}
  .hud-btns{width:100%;justify-content:flex-end}
  .hud-btns .hbtn{padding:4px 10px}
  .modal-body{padding:20px 18px}
  .modal-foot{padding:12px 18px}
  .question{font-size:26px}
  .stage-h h2{font-size:22px}
  .tray{grid-template-columns:repeat(5,minmax(0,1fr))}
  .slot{min-height:64px;padding:6px}
  .slot .n{font-size:15px}
}
@media (pointer:coarse),(max-width:600px){
  .hbtn,.seg button,.feel button{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .step .ctl button{width:44px;height:44px}
  .step .ctl button.wide{height:44px}
  .btn{min-height:44px}
}
@media (prefers-reduced-transparency:reduce){.hud,.modal,.toast{background:var(--s2);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<header class="hud">
  <div class="hud-in">
    <div class="brand"><h1 data-i18n>貿易ゲーム</h1><span id="meChip"></span></div>
    <div class="clock" data-i18n-attr="title" title="ゲーム内の時間（40分）">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(128,138,155,.3)" stroke-width="2.5"/><circle id="clockRing" cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1" transform="rotate(-90 22 22)"/></svg>
      <div class="clock-t num" id="clockT">0:00<small>のこり 40分</small></div>
    </div>
    <div class="goal" data-i18n-attr="title" title="はじめのお金からどれだけ増えたか"><span data-i18n>成長</span><b class="num" id="growth">×1.0</b></div>
    <span class="paused" id="pausedBadge" hidden data-i18n>一時停止中</span>
    <div class="wallet" id="wallet" data-i18n-attr="title" title="あなたの国のお金"><span class="amt num" id="walletAmt">$0</span><span class="clips" id="walletClips"></span></div>
    <div class="hud-btns">
      <a class="hbtn" id="homeBtn" href="../" data-i18n-attr="title" title="ゲーム一覧へ戻る" data-i18n>一覧へ</a>
      <button class="hbtn" id="soundBtn" type="button" aria-pressed="true" data-i18n-attr="title" title="音（M）" data-i18n>音</button>
      <button class="hbtn" id="themeBtn" type="button" data-i18n-attr="title" title="見た目：自動・ライト・ダーク（L）">◐</button>
      <button class="hbtn" id="pauseBtn" type="button" data-i18n-attr="title" title="一時停止（P）" data-i18n>一時停止</button>
      <button class="hbtn" id="helpBtn" type="button" data-i18n-attr="title" title="ルール（H）" data-i18n>ルール</button>
    </div>
  </div>
  <div class="mbar" id="mbar" hidden></div>
</header>

<div class="stage-wrap">
  <section class="stage" aria-labelledby="stageH">
    <div class="stage-h">
      <div><div class="eyebrow">GLOBAL TRADE NETWORK</div><h2 id="stageH" data-i18n>世界の貿易</h2><p id="stageHint" data-i18n>国をクリックすると、その国と交渉できます</p></div>
      <div class="legend" aria-hidden="true">
        <span><i style="width:7px;height:7px;border-radius:50%;background:#a56eff;box-shadow:0 0 8px #a56eff"></i><span data-i18n>輸出（色＝製品）</span></span>
        <span><i style="width:16px;height:1.5px;background:var(--accent)"></i><span data-i18n>国どうしの取引</span></span>
        <span><i style="width:7px;height:7px;transform:rotate(45deg);background:var(--warn)"></i><span data-i18n>援助・発見</span></span>
      </div>
    </div>
    <svg id="map" role="group" aria-label="8つの国と世界市場" data-i18n-attr="aria-label"></svg>
  </section>
</div>

<main class="board">
  <section class="panel" aria-labelledby="deskH">
    <div class="panel-h"><h2 id="deskH" data-eyebrow="PRODUCTION">わが国の工場</h2><span class="sub" id="deskSub"></span></div>
    <div class="tray" id="tray"></div>
    <div class="tray-cap"><span id="trayCap1"></span><span id="trayCap2"></span></div>
    <div class="lines" id="lines"></div>
  </section>
  <section class="panel" id="mktPanel" aria-labelledby="mktH">
    <div class="panel-h"><h2 id="mktH" data-eyebrow="WORLD MARKET">世界市場</h2><span class="chip" data-i18n>国連＝先生</span></div>
    <div id="mkt"></div>
    <details class="how"><summary data-i18n>値段が変わるしくみ</summary><p id="howText"></p></details>
  </section>
  <section class="panel feed" aria-labelledby="newsH">
    <div class="panel-h"><h2 id="newsH" data-eyebrow="DISPATCH" data-i18n>とどいた提案とニュース</h2></div>
    <div class="offers" id="offers"></div>
    <ul class="news" id="news"></ul>
  </section>
</main>

<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="engine.js"></script>
<script>
'use strict';
/* ============================================================
   ルールとデータ
   ============================================================ */
var E = window.TradeEngine;
function tr(s, v) { return window.KoboI18n ? KoboI18n.t(s, v) : (v ? String(s).replace(/\{(\w+)\}/g, function (m, k) { return k in v ? v[k] : m; }) : s); }
var EN = !!(window.KoboI18n && KoboI18n.lang === 'en');
// 表にある日本語の文字列を、いまの言語に通す（入れ子もそのまま）
function loc(o) {
  if (typeof o === 'string') return tr(o);
  if (Array.isArray(o)) return o.map(loc);
  if (o && typeof o === 'object') { var r = {}; for (var k in o) r[k] = typeof o[k] === 'function' ? o[k] : loc(o[k]); return r; }
  return o;
}
var GAME_MIN = 40;          // 授業と同じ 40 分
var SHEET = 600;            // 資源（紙）1単位の量
var SHAPE_KEYS = ['rect', 'tri', 'semi', 'circle'];
var TOOL_KEYS = ['scissors', 'ruler', 'setsq', 'compass'];
var SHAPES = {

var CANDIDATES = [{ paper: 1 }, { paper: 2 }, { paper: 3 }, { paper: 5 }, { scissors: 1 }, { ruler: 1 }, { setsq: 1 }, { compass: 1 }, { pencil: 1 }];
function bestSale(seller, buyer, maxPrice, share) {
  var best = null;
  CANDIDATES.forEach(function (b) {
    if (!canPay(seller.items, b)) return;
    var loss = -gainOf(seller, b, {});
    var gain = gainOf(buyer, {}, b);
    var surplus = gain - loss;
    if (surplus < 400) return;
    var price = r100(loss + surplus * share);
    price = Math.min(price, f100(maxPrice), f100(gain - 100));
    if (price < loss + 100) return;
    var score = surplus - Math.max(0, (loss + surplus * share) - price);
    if (!best || score > best.score) best = { bundle: b, price: price, score: score };
  });
  return best;
}
function cpuTradeRound() {
  var cpus = G.countries.filter(function (c) { return !c.isPlayer; });
  var best = null;
  for (var i = 0; i < 4; i++) {
    var s = pick(cpus), b = pick(cpus);
    if (s === b) continue;
    var d = bestSale(s, b, b.items.money, s.share);
    if (d && (!best || d.score > best.score)) best = { s: s, b: b, d: d };
  }
  if (!best) return;
  doTrade(best.s, best.b, best.d.bundle, { money: best.d.price });
  addNews('', tr('{b}が{s}から {x} を {p} で買いました。', { b: best.b.name, s: best.s.name, x: bundleText(best.d.bundle), p: fmt$(best.d.price) }));
}
function cpuOfferToMe() {
  if (G.offers.length >= 3 || remain() < 2) return;
  var me = G.me;
  var cpus = shuffle(G.countries.filter(function (c) { return !c.isPlayer; }));
  for (var i = 0; i < cpus.length; i++) {
    var c = cpus[i];
    if (G.offers.some(function (o) { return o.from === c; })) continue;
    var buy = bestSale(me, c, c.items.money, 0.35);
    var sellD = bestSale(c, me, me.items.money, 0.65);
    var d = null, kind = '';
    if (buy && (!sellD || buy.score >= sellD.score)) { d = buy; kind = 'buy'; } else if (sellD) { d = sellD; kind = 'sell'; }
    if (!d) continue;
    G.offers.push({ id: ++G.offerSeq, from: c, until: G.t + 4, myGive: kind === 'buy' ? d.bundle : { money: d.price }, myGet: kind === 'buy' ? { money: d.price } : d.bundle });
    addNews('', tr('{n}から提案がとどきました。', { n: c.name }));
    SFX.ding();
    dirty = true;
    return;
  }
}

/* ---------- キーボード ---------- */
// ゲーム中：1〜4 製品をえらぶ（ラインは Q で切りかえ）・A 手持ちを全部売る・Y／N いちばん上の提案を受ける／ことわる・P 一時停止・H ルール・M 音・L 見た目
// 交渉中：Enter 調印をもとめる・B いくらなら応じる？・Esc 交渉をやめる　カードやルール：Esc で閉じる　ふりかえり：← →
// 国の四角は Tab で選び、Enter で交渉
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var tg = e.target, tag = tg && tg.tagName;
  if (tg && tg.getAttribute && tg.getAttribute('data-node') !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tg.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (typing) { if (k === 'Enter' && tg.id === 'nameIn') { var sb = $('startBtn'); if (sb) { e.preventDefault(); sb.click(); } } return; }
  if (modalOpen) {
    if (k === 'Escape') { var cl = $('trClose') || $('cardOk') || $('closeBtn') || $('seeBoard'); if (cl) { e.preventDefault(); cl.click(); } return; }
    if (TR && $('trBody')) {
      if (k === 'Enter' && tag !== 'BUTTON') { e.preventDefault(); propose(); }
      else if (k === 'b') { e.preventDefault(); askPrice(); }
      return;
    }
    if ($('dbNext') && (k === 'ArrowRight' || k === 'ArrowLeft')) { var bb = k === 'ArrowRight' ? $('dbNext') : $('dbBack'); if (bb && !bb.hidden && !bb.disabled) { e.preventDefault(); bb.click(); } }
    return;
  }
  if (!G || !G.running || G.over) return;
  if (k === 'p') { e.preventDefault(); togglePause(); }
  else if (k === 'h' || k === '?') { e.preventDefault(); openRules(false); }
  else if (k === 'm') toggleSound();
  else if (k === 'l') cycleTheme();
  else if (G.paused) return;
  else if (k >= '1' && k <= '4') { e.preventDefault(); var line = G.kbLine || 0; if (G.me.lines[line]) { var sh = SHAPE_KEYS[+k - 1]; if (hasTools(G.me.items, sh) || G.me.lines[line].shape === sh) pickShape(line, sh); else { SFX.nope(); toast(tr('{x}が必要', { x: missing(G.me.items, sh).join(tr('・')) })); } } }
  else if (k === 'q') { e.preventDefault(); if (G.me.lines.length) { G.kbLine = ((G.kbLine || 0) + 1) % G.me.lines.length; dirty = true; SFX.tick(); toast(tr('ライン {n} をえらびました', { n: G.kbLine + 1 })); } }
  else if (k === 'a') { e.preventDefault(); sellAllStock(null); }
  else if (k === 'y') { if (G.offers.length) { e.preventDefault(); acceptOffer(G.offers[0].id); } }
  else if (k === 'n') { if (G.offers.length) { e.preventDefault(); G.offers.shift(); dirty = true; SFX.tick(); } }
});

function propose() {
  if (!TR) return;
  var p = TR.p, give = TR.give, get = TR.get;
  if (isEmpty(give) && isEmpty(get)) return drawTrade({ cls: 'ng', text: tr('「何を交換するか決めてから話しましょう。」') });
  if (!canPay(G.me.items, give)) return drawTrade({ cls: 'ng', text: tr('「あなた、それを持っていませんよね？」') });
  if (!canPay(p.items, get)) {
    SFX.nope();
    if (get.money > p.items.money) return drawTrade({ cls: 'ng', text: tr('「そんなにお金は持っていません。」') }, 'ng');
    return drawTrade({ cls: 'ng', text: tr('「それは持っていません。」') }, 'ng');
  }
  var g = gainOf(p, get, give);
  var gift = isEmpty(get);
  if ((gift && g >= 0) || g >= p.greed) {
    var fee = routeFeeFor(p);
    if (fee && G.me.items.money - (give.money || 0) + (get.money || 0) < fee) { SFX.nope(); return drawTrade({ cls: 'ng', text: tr('「輸送費 {f} を払うお金が、あなたに残りませんね。」', { f: fmt$(fee) }) }, 'ng'); }
    var txt = bundleText(give) + ' → ' + bundleText(get);
    doTrade(G.me, p, give, get);
    payFee(fee, p);
    G.myDeals++;
    if (gift && (p.type === 'C' || p.type === 'D')) { G.gifts++; moment(tr('{n}に、お金をもらわずにゆずった：{x}', { n: p.name, x: bundleText(give) })); }
    addNews('me', tr('あなたは{n}と取引：{x}', { n: p.name, x: txt }));
    moment(tr('{n}と取引：{x}', { n: p.name, x: txt }));
    TR.give = {}; TR.get = {};
    SFX.stamp(); buzz(30);
    drawTrade({ cls: 'ok', text: gift ? tr('「ありがとうございます！大切に使います。」') : pick([tr('「いいでしょう、取引成立です。」'), tr('「決まりですね。よろしくお願いします。」'), tr('「ちょうど欲しかったところです。成立！」')]) }, 'ok');
    return;
  }
  G.rejects++;
  if (G.rejects === 1) moment(tr('{n}に提案を断られた', { n: p.name }));
  var t;
  if (g >= p.greed - 700) t = pick([tr('「うーん…あと少し条件がよければ応じます。」'), tr('「おしいですね。もうひと声。」')]);

  else t = pick([tr('「話になりません！」'), tr('「さすがにそれは無理です。」')]);

}
function askPrice() {
  var p = TR.p, give = TR.give, get = TR.get;

  if (!canPay(G.me.items, give)) return drawTrade({ cls: 'ng', text: tr('「あなた、それを持っていませんよね？」') });
  var nonMoneyGet = cloneIt(get); delete nonMoneyGet.money;
  if (!canPay(p.items, nonMoneyGet)) return drawTrade({ cls: 'ng', text: tr('「それは持っていません。」') });
  var diff = gainOf(p, get, give) - p.greed;
  if (diff < 0) {
    var need = c100(-diff * 1.25 + 100);
    var fromGet = Math.min(get.money || 0, need);
    var add = need - fromGet;
    if ((give.money || 0) + add > G.me.items.money) return drawTrade({ cls: 'ng', text: tr('「あと {n} ほしいところですが…あなたのお金では足りないようですね。ほかのものを足してみては？」', { n: fmt$(need) }) });

  }

        var feas = SHAPE_KEYS.filter(function (s) { return hasTools(it, s) && it.paper >= SHAPES[s].area; });
        if (!feas.length || ln.busy) return;
        if (o.diversify) { feas.sort(function (a, b) { return (G.mySoldBy[a] || 0) + (it[a] || 0) - (G.mySoldBy[b] || 0) - (it[b] || 0); }); ln.shape = feas[(i + Math.floor(G.t / 6)) % feas.length]; }
        else ln.shape = cpuChoose(me) || feas[0];
      });
    }
  };
  window.__trade = {
    get G() { return G; },
    E: E, summary: summary,
    start: function (who) { settings.who = who || 'random'; settings.mode = 'free'; newGame(); G.running = true; closeModal(); render(); renderMap(); },
    free: function (o) { o = o || {}; settings.mode = 'free'; settings.who = o.who || 'random'; if (o.diff) settings.diff = o.diff; if (o.ev != null) settings.ev = !!o.ev; newGame({ seed: o.seed }); G.running = true; closeModal(); render(); renderMap(); },
    mission: function (i, seed) { settings.mode = 'mission'; settings.mission = i; newGame({ seed: seed }); G.running = true; closeModal(); render(); renderMap(); },
    run: function (min, keepCards) { var end = Math.min(GAME_MIN, G.t + min); while (G.t < end - 1e-9 && !G.over) step(Math.min(0.02, end - G.t)); if (!keepCards) G.cards = []; render(); renderMap(); },
    bot: function (min, o) { o = o || {}; var end = Math.min(GAME_MIN, G.t + min), nextAct = G.t; while (G.t < end - 1e-9 && !G.over) { if (G.t >= nextAct) { bot.act(o); nextAct += 0.25; } step(Math.min(0.02, end - G.t)); G.cards = []; } if (!G.over) { render(); renderMap(); } return G.over; },
    botAct: function (o) { bot.act(o || {}); render(); },
    seed: setSeed, tr: tr, gainOf: gainOf, valueOf: valueOf, sell: sell,
    runEvent: function (id, r, r2) { runEvent({ id: id, r: r == null ? 0.3 : r, r2: r2 == null ? 0.3 : r2, at: G.t }); render(); renderMap(); },
    thumbScene: function () { settings.name = 'さくら共和国'; newGame(); G.running = true; closeModal(); G.me.lines.forEach(function (l, i) { l.shape = i ? 'tri' : 'circle'; });
      var end = 9.4; while (G.t < end) step(0.02); G.cards = []; G.paused = true; render(); renderMap(); document.querySelector('.hud').style.display = 'none'; var m = $('map').getBoundingClientRect(); window.scrollTo(0, window.scrollY + m.top + m.height / 2 - innerHeight / 2); }
  };
}

applyLook();
refreshThemeBtn();
try { KoboI18n.apply(document); } catch (e) {}
newGame();
render();
renderMap();
openRules(true);
requestAnimationFrame(frame);
