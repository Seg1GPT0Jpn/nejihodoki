<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貿易ゲーム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="資源と技術で製品をつくって輸出する、地理総合の「貿易ゲーム」。8つの国に分かれ、交渉しながら40分でお金をかせぐ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: a dark "world sea" stage at the top where the 8 countries sit around the world market and every
   export / trade / aid travels as a moving token; below it three working panels (your factory, the market
   ticker, the dispatch feed). One fixed color + icon per product everywhere. Red = price falling, only. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f3f5f7; --ink:#131e29; --muted:#536271; --line:#cdd6de;
  --sea:#0d2131; --sea-2:#15324a; --sea-3:#1d4260; --sea-line:#2f587a; --sea-ink:#e8f0f6; --sea-muted:#8fb0c8;
  --slot:#13283a; --slot-line:#2a4760;
  --un:#1f6fd1; --un-soft:#dde9fa; --gold:#f2b230; --gold-ink:#5a3d00;
  --gain:#16884a; --gain-soft:#dbf1e4; --loss:#d7363c; --loss-soft:#fde2e2;
  --p-rect:#f0a01a; --p-tri:#2f8de0; --p-semi:#1aae80; --p-circle:#8a5cf0; --p-ink:#10202c;
  --paper:#fbfaf6; --paper-ink:#1e2a35; --paper-line:#d9d4c7;
  --shadow:0 1px 2px rgba(15,35,55,.08),0 6px 18px rgba(15,35,55,.08);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1218; --surface:#131d27; --surface-2:#18242f; --ink:#e6edf3; --muted:#93a4b4; --line:#273746;
  --sea:#071420; --sea-2:#0e2638; --sea-3:#163650; --sea-line:#24496a;
  --un:#5aa2f0; --un-soft:#172c45; --gain:#4fd08b; --gain-soft:#11301f; --loss:#ff6a6f; --loss-soft:#3a191b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1218; --surface:#131d27; --surface-2:#18242f; --ink:#e6edf3; --muted:#93a4b4; --line:#273746;
  --sea:#071420; --sea-2:#0e2638; --sea-3:#163650; --sea-line:#24496a;
  --un:#5aa2f0; --un-soft:#172c45; --gain:#4fd08b; --gain-soft:#11301f; --loss:#ff6a6f; --loss-soft:#3a191b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sea)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sea);color:var(--sea-ink);border-bottom:1px solid var(--sea-line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--sea-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.flag{display:inline-block;width:18px;height:12px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.clock{display:flex;align-items:center;gap:10px}
.clock svg{width:44px;height:44px;flex:none}
.clock-t{font-family:var(--f-display);font-size:22px;line-height:1}
.clock-t small{display:block;font-family:var(--f-body);font-size:11px;color:var(--sea-muted);margin-top:3px}
.goal{display:flex;flex-direction:column;line-height:1.2;font-size:11px;color:var(--sea-muted)}
.goal b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--sea-ink)}
.goal b.up{color:#7ee2a8}
.wallet{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--sea-2);border:1px solid var(--sea-line);border-radius:12px;padding:4px 14px 4px 10px;transform-origin:center}
.wallet .amt{font-family:var(--f-display);font-size:24px;color:#8ff0b6;line-height:1.1}
.wallet .clips{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--sea-muted)}
.wallet.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.hud-btns{display:flex;gap:6px}
.hbtn{border:1px solid var(--sea-line);background:var(--sea-2);color:var(--sea-ink);border-radius:9px;padding:6px 11px;font-size:13px;white-space:nowrap}
.hbtn:hover{border-color:var(--gold)}
.hbtn[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* ---------- stage (world map) ---------- */
.stage-wrap{background:var(--sea);padding-block:4px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{max-width:1240px;margin:0 auto;position:relative;color:var(--sea-ink)}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 2px}
.stage-h h2{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.05em}
.stage-h p{margin:0;font-size:12px;color:var(--sea-muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sea-muted)}
.legend i{display:inline-block;vertical-align:middle;margin-right:4px}
#map{display:block;width:100%;height:auto;max-width:100%;
  background:radial-gradient(ellipse at 50% 50%,var(--sea-3) 0%,var(--sea-2) 45%,var(--sea) 100%);border-radius:16px;border:1px solid var(--sea-line)}
#map .lane{stroke:var(--sea-line);stroke-width:1.5;stroke-dasharray:3 7;fill:none}
#map .node{cursor:pointer}
#map .node .card{fill:var(--sea-2);stroke:var(--sea-line);stroke-width:1.5}
#map .node:hover .card,#map .node:focus .card{stroke:var(--gold);stroke-width:2.5}
#map .node:focus{outline:none}
#map .node.me .card{fill:#1f3d58;stroke:var(--gold);stroke-width:2.5}
#map .node.me{cursor:default}
#map .nm{font-family:var(--f-display);fill:var(--sea-ink)}
#map .sm{fill:var(--sea-muted);font-family:var(--f-body)}
#map .hub-c{fill:var(--sea);stroke:var(--gold);stroke-width:2.5}
#map .hub-t{font-family:var(--f-display);fill:var(--gold)}
#map .badge{fill:var(--gold)}
#map .badge-t{fill:var(--gold-ink);font-family:var(--f-body);font-weight:700}
#map .deal-flash{fill:none;stroke:var(--gold);stroke-width:3}

/* ---------- panels ---------- */
.board{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:start;
  padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1120px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.feed{grid-column:1/-1}}
@media (max-width:740px){.board{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.04em}
.panel-h .sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 8px;border-radius:999px;background:var(--un-soft);color:var(--un);white-space:nowrap}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* tray of owned goods: dark slots, bright tokens */
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--slot);border-radius:12px;padding:8px;border:1px solid var(--slot-line)}
.slot{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:9px;background:#0b1c2a;border:1px solid var(--slot-line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8f0f6;font-size:10px;text-align:center;line-height:1.15;padding:2px}
.slot svg{width:52%;height:52%}
.slot .n{position:absolute;right:4px;bottom:2px;font-family:var(--f-display);font-size:15px;color:#fff;text-shadow:0 1px 0 #000}
.slot .l{color:#9fb7ca;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.zero{opacity:.32}
.slot.res svg{color:var(--gold)}
.slot.tech svg{color:#6fd3ff}
.slot.lab svg{color:#f3f6f9}
.slot .meter{position:absolute;left:6px;right:6px;top:4px;height:3px;border-radius:2px;background:#29445c;overflow:hidden}
.slot .meter i{display:block;height:100%;background:var(--gold)}
.tray-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:6px 2px 14px}

/* production lines */
.lines{display:flex;flex-direction:column;gap:12px}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.line-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.line-top .who{font-family:var(--f-display);font-size:14px}
.line-status{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.line-status.bad{color:var(--loss);font-weight:700}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px 5px;font-size:11px;line-height:1.25;transition:transform .12s}
.pick:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pc)}
.pick:active:not(:disabled){transform:translateY(1px)}
.pick svg.pi{width:30px;height:24px}
.pick b{font-size:12px}
.pick[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset;background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.pick:disabled{opacity:.42;cursor:not-allowed}
.recipe{display:flex;align-items:center;gap:1px;color:var(--muted)}
.recipe svg{width:13px;height:13px}
.recipe .miss{color:var(--loss)}
.belt{position:relative;height:22px;margin-top:9px;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 14px),var(--surface)}
.belt.run{animation:belt .6s linear infinite}
@keyframes belt{to{background-position:14px 0,0 0}}
.belt .fill{position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb,var(--pc,var(--gain)) 25%,transparent)}
.belt svg{position:absolute;top:1px;width:24px;height:20px;transform:translateX(-50%)}
.empty-note{font-size:13px;color:var(--muted);padding:6px 2px;margin:0}

/* market ticker */
.tick{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tick:first-of-type{border-top:0;padding-top:2px}
.tick .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pc) 18%,var(--surface))}
.tick .ic svg{width:34px;height:28px}
.tick .nm{font-weight:700;font-size:15px}
.tick .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.price{text-align:right;line-height:1.05}
.price .v{font-family:var(--f-display);font-size:22px}
.price .d{display:block;font-size:11px;font-weight:700}
.price.down .v,.price.down .d{color:var(--loss)}
.price.up .d{color:var(--gain)}
.price.flat .d{color:var(--muted);font-weight:400}
.tick-low{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.spark{width:100%;height:30px;display:block}
.supply{font-size:11px;color:var(--muted)}
.supply .bar{position:relative;height:6px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:3px}
.supply .bar i{position:absolute;inset:0 auto 0 0;background:var(--pc)}
.supply .bar i.over{background:var(--loss)}
.supply.warn{color:var(--loss);font-weight:700}
.sell{display:flex;gap:4px;justify-content:flex-end}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap;transition:transform .1s}
.btn:hover:not(:disabled){border-color:var(--un)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--un);border-color:var(--un);color:#fff}
.btn.go{background:var(--gain);border-color:var(--gain);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.big{padding:11px 22px;font-size:16px;border-radius:12px}
details.how{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
details.how summary{cursor:pointer;font-weight:700;color:var(--un)}
details.how p{margin:6px 0 0;color:var(--muted)}

/* feed */
.offers{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.offer{position:relative;border-radius:12px;padding:12px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);box-shadow:var(--shadow);font-size:13px;display:flex;flex-direction:column;gap:6px;animation:drop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-10px) rotate(-1deg);opacity:0}}
.offer-h{display:flex;align-items:center;gap:6px;font-weight:700}
.offer-h .ttl{margin-left:auto;font-size:11px;color:#6b7680;font-weight:400}
.offer .row{display:flex;gap:6px;flex-wrap:wrap}
.offer .btn:not(.go){background:#fff;color:var(--paper-ink);border-color:var(--paper-line)}
.offer .x{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px}
.offer .x span{color:#6b7680}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;font-size:13px}
.news li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.news li.un{background:var(--un-soft)}
.news li.warn{background:var(--loss-soft)}
.news li.me{background:var(--gain-soft)}
.news time{color:var(--muted);font-size:11px;padding-top:2px}

/* ---------- modal / cards ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,14,22,.62);display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 14px 50px rgba(0,0,0,.4);min-width:0;animation:pop .28s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal-body{overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal-body>*{flex-shrink:0}
.modal-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal-foot .grow{margin-right:auto;font-size:12px;color:var(--muted)}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.03em}
.modal h3{font-size:15px;font-weight:700}
.lead{color:var(--muted);font-size:14px;margin:0}
.question{font-family:var(--f-display);font-size:20px;line-height:1.45;background:var(--sea);color:var(--sea-ink);border-radius:12px;padding:14px 16px;margin:0}
.question small{display:block;font-family:var(--f-body);font-size:12px;color:var(--sea-muted);margin-bottom:4px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rcard{border:1.5px solid var(--pc);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--pc) 8%,var(--surface));display:flex;flex-direction:column;gap:4px;font-size:12px}
.rcard .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rcard .top svg{width:40px;height:32px}
.rcard .p{font-family:var(--f-display);font-size:20px}
.rcard b{font-size:15px}
.rcard .recipe svg{width:16px;height:16px}
.facts{margin:0;padding-left:1.2em;font-size:14px;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{font-weight:700;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--un);border-color:var(--un);color:#fff}

/* event card */
.ev{border-radius:16px;overflow:hidden}
.ev-top{padding:18px 22px 14px;color:#fff;display:flex;gap:14px;align-items:center}
.ev-top svg{width:54px;height:54px;flex:none}
.ev-top small{display:block;font-size:12px;opacity:.85;letter-spacing:.08em}
.ev-top h2{color:#fff}
.ev.crash .ev-top{background:var(--loss)}
.ev.aid .ev-top{background:#b9820a}
.ev.rise .ev-top{background:var(--gain)}
.ev.find .ev-top{background:#3c5a74}
.ev dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px}
.ev dt{font-weight:700;color:var(--muted);font-size:12px;padding-top:2px;white-space:nowrap}
.ev dd{margin:0}
.term{border-left:4px solid var(--un);background:var(--un-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px}

/* contract */
.contract{background:var(--paper);color:var(--paper-ink);border-radius:16px;width:min(760px,100%)}
.contract .modal-body{position:relative}
.contract .modal-foot{border-top-color:var(--paper-line)}
.contract .btn:not(.primary){background:#fff;color:var(--paper-ink);border-color:var(--paper-line)}
.contract .lead{color:#5f6a73}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px double var(--paper-line);padding-bottom:10px;flex-wrap:wrap}
.c-head h2{color:var(--paper-ink)}
.c-head .no{font-size:12px;color:#7a8389;font-variant-numeric:tabular-nums}
.c-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:580px){.c-cols{grid-template-columns:minmax(0,1fr)}}
.c-side{border:1px solid var(--paper-line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:#fff}
.c-side h3{display:flex;align-items:center;gap:6px;font-size:14px}
.c-side h3 small{color:#7a8389;font-weight:400}
.step{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px}
.step svg{width:22px;height:22px;flex:none}
.step>div:first-of-type{flex:1 1 90px;min-width:0}
.step .ctl{display:flex;align-items:center;gap:4px;margin-left:auto}
.step .ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--paper-line);background:#f4f1ea;color:var(--paper-ink);font-weight:700;padding:0}
.step .ctl button.wide{width:auto;padding:0 6px;font-size:11px}

</main>

/* ---------- 交渉（協定書） ---------- */
var TR = null;
function openTrade(partner, offer) {
  if (!partner || G.over || !G.running) return;
  G.paused = true;
  TR = { p: partner, give: {}, get: {}, reply: null, no: ++G.contractNo };
  if (offer) { TR.give = cloneIt(offer.myGive); TR.get = cloneIt(offer.myGet); }
  showModal('<div class="modal-body" id="trBody"></div><div class="modal-foot">' +
    '<button class="btn" type="button" id="trClose">交渉をやめる</button>' +
    '<button class="btn" type="button" id="trAsk">いくらなら応じる？</button>' +
    '<button class="btn primary" type="button" id="trSend">この条件で調印をもとめる</button></div>', function (root) {
    root.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.side) {
        var side = TR[b.dataset.side], k = b.dataset.k, delta = +b.dataset.d;
        side[k] = Math.max(0, Math.min(maxFor(b.dataset.side, k), (side[k] || 0) + delta));
        TR.reply = null; SFX.tick();
        drawTrade();
      }
      if (b.id === 'trClose') { closeModal(); G.paused = false; TR = null; dirty = true; }
      if (b.id === 'trAsk') askPrice();
    });
    // 判子は押した瞬間に（mousedown）
    root.querySelector('#trSend').addEventListener('pointerdown', function (e) { if (e.button === 0) propose(); });
    root.querySelector('#trSend').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); propose(); } });
    drawTrade();
  }, 'contract');
}
function maxFor(side, k) {
  var it = side === 'give' ? G.me.items : TR.p.items;
  if (k === 'money') return side === 'give' ? it.money : 99900;
  return k === 'paper' ? sheets(it) : it[k];
}
function stepRow(side, k) {
  var it = side === 'give' ? G.me.items : TR.p.items;
  var have = k === 'money' ? (side === 'give' ? fmt$(it.money) + 'まで' : '相手のお金は見えない') : (k === 'paper' ? sheets(it) : it[k]) + unitOf(k) + 'ある';
  var v = TR[side][k] || 0;
  var b = function (d, label, aria, wide) { return '<button type="button"' + (wide ? ' class="wide"' : '') + ' data-side="' + side + '" data-k="' + k + '" data-d="' + d + '" aria-label="' + aria + '">' + label + '</button>'; };
  var ctl = k === 'money'
    ? b(-1000, '−1000', '1000ドル減らす', 1) + b(-100, '−', '100ドル減らす') + '<output class="num">' + fmt$(v) + '</output>' + b(100, '＋', '100ドル増やす') + b(1000, '＋1000', '1000ドル増やす', 1)
    : b(-1, '−', '減らす') + '<output class="num">' + v + '</output>' + b(1, '＋', '増やす');
  var col = k === 'paper' ? '#b9820a' : TOOL_KEYS.indexOf(k) >= 0 ? '#1f7fb0' : '#33424f';
  return '<div class="step"><span style="color:' + col + ';display:contents">' + itemSvg(k) + '</span><div>' + NAMES[k] + '<div class="have">' + have + '</div></div><div class="ctl">' + ctl + '</div></div>';
}
function drawTrade(reply, stamp) {
  var p = TR.p, keys = ['money', 'paper', 'pencil', 'scissors', 'ruler', 'setsq', 'compass'].concat(SHAPE_KEYS);
  var giveRows = '', getRows = '';
  keys.forEach(function (k) {
    var isShape = SHAPE_KEYS.indexOf(k) >= 0;
    var mine = k === 'money' || (k === 'paper' ? sheets(G.me.items) : G.me.items[k]) > 0 || TR.give[k];
    var theirs = !isShape && (k === 'money' || (k === 'paper' ? sheets(p.items) : p.items[k]) > 0 || TR.get[k]);
    if (mine) giveRows += stepRow('give', k);
    if (theirs) getRows += stepRow('get', k);
  });
  if (reply) TR.reply = reply;
  var r = TR.reply || { cls: '', text: '何と何を交換しますか？' };
  $('trBody').innerHTML =
    '<div class="c-head"><h2>貿易協定書</h2><span class="no">No.' + String(TR.no).padStart(3, '0') + '　' + Math.floor(G.t) + '分</span></div>' +
    '<p class="lead">' + TH.tradeLead + '</p>' +
    '<div class="c-cols"><div class="c-side"><h3><span class="flag" style="background:' + G.me.color + '"></span>' + esc(G.me.name) + '<small>（あなた）が渡す</small></h3>' + giveRows + '</div>' +
    '<div class="c-side"><h3><span class="flag" style="background:' + p.color + '"></span>' + esc(p.name) + '<small>が渡す</small></h3>' + getRows + '</div></div>' +
    '<div class="reply ' + r.cls + '"><span class="flag" style="background:' + p.color + '"></span><span>' + esc(p.name) + '：' + esc(r.text) + '</span></div>' +
    '<div class="sign"><span>甲：' + esc(G.me.name) + '</span><span>乙：' + esc(p.name) + '</span></div>' +
    (stamp ? '<div class="stamp ' + stamp + '" aria-hidden="true">' + (stamp === 'ok' ? '調印' : '却下') + '</div>' : '');
}
function propose() {
  var p = TR.p, give = TR.give, get = TR.get;
  if (isEmpty(give) && isEmpty(get)) return drawTrade({ cls: 'ng', text: '「何を交換するか決めてから話しましょう。」' });
  if (!canPay(G.me.items, give)) return drawTrade({ cls: 'ng', text: '「あなた、それを持っていませんよね？」' });
  if (!canPay(p.items, get)) {
    SFX.nope();
    if (get.money > p.items.money) return drawTrade({ cls: 'ng', text: '「そんなにお金は持っていません。」' }, 'ng');
    return drawTrade({ cls: 'ng', text: '「それは持っていません。」' }, 'ng');
  }
  var g = gainOf(p, get, give);
  var gift = isEmpty(get);
  if ((gift && g >= 0) || g >= p.greed) {
    var txt = bundleText(give) + ' → ' + bundleText(get);
    doTrade(G.me, p, give, get);
    G.myDeals++;
    addNews('me', 'あなたは' + p.name + 'と取引：' + txt);
    moment(p.name + 'と取引：' + txt);
    TR.give = {}; TR.get = {};
    SFX.stamp();
    drawTrade({ cls: 'ok', text: gift ? '「ありがとうございます！大切に使います。」' : pick(['「いいでしょう、取引成立です。」', '「決まりですね。よろしくお願いします。」', '「ちょうど欲しかったところです。成立！」']) }, 'ok');
    return;
  }
  G.rejects++;
  if (G.rejects === 1) moment(p.name + 'に提案を断られた');
  var t;
  if (g >= p.greed - 700) t = pick(['「うーん…あと少し条件がよければ応じます。」', '「おしいですね。もうひと声。」']);
  else if (g >= -1500) t = pick(['「それでは私たちが損をしてしまいます。」', '「その条件では受けられません。」']);
  else t = pick(['「話になりません！」', '「さすがにそれは無理です。」']);
  SFX.nope();
  drawTrade({ cls: 'ng', text: t }, 'ng');
}
function askPrice() {
  var p = TR.p, give = TR.give, get = TR.get;
  if (isEmpty(give) && isEmpty(get)) return drawTrade({ cls: '', text: '「まず、何がほしいのか（何を売りたいのか）を決めてください。」' });
  if (!canPay(G.me.items, give)) return drawTrade({ cls: 'ng', text: '「あなた、それを持っていませんよね？」' });
  var nonMoneyGet = cloneIt(get); delete nonMoneyGet.money;
  if (!canPay(p.items, nonMoneyGet)) return drawTrade({ cls: 'ng', text: '「それは持っていません。」' });
  var diff = gainOf(p, get, give) - p.greed;
  if (diff < 0) {
    var need = c100(-diff * 1.25 + 100);
    var fromGet = Math.min(get.money || 0, need);
    var add = need - fromGet;
    if ((give.money || 0) + add > G.me.items.money) return drawTrade({ cls: 'ng', text: '「あと ' + fmt$(need) + ' ほしいところですが…あなたのお金では足りないようですね。ほかのものを足してみては？」' });
    get.money = (get.money || 0) - fromGet; give.money = (give.money || 0) + add;
    return drawTrade({ cls: '', text: '「' + (add ? 'あなたが ' + fmt$(give.money) + ' 払うなら' : 'お金を ' + fmt$(get.money) + ' にしてくれるなら') + '、応じましょう。」（値切れるかも？）' });
  }
  var extra = f100(diff * 0.5);
  if (extra < 100) return drawTrade({ cls: 'ok', text: '「その条件でけっこうです。」' });
  var fromGive = Math.min(give.money || 0, extra);
  var more = Math.min(extra - fromGive, f100(p.items.money - (get.money || 0)));
  give.money = (give.money || 0) - fromGive; get.money = (get.money || 0) + Math.max(0, more);
  drawTrade({ cls: 'ok', text: '「' + (get.money ? fmt$(get.money) + ' 払いましょう' : 'お金は ' + fmt$(give.money) + ' でいいですよ') + '。」（もっと強気にいけるかも？）' });
}

/* ============================================================

function gini(xs) {
  var a = xs.slice().sort(function (p, q) { return p - q; }), n = a.length, s = 0, w = 0;
  a.forEach(function (x, i) { s += x; w += (2 * (i + 1) - n - 1) * x; });
  return s ? w / (n * s) : 0;
}
function wealthChart() {
  var W = 640, H = 270, L = 58, R = 14, T = 12, B = 30;
  var max = 0; G.hist.forEach(function (h) { h.forEach(function (v) { if (v > max) max = v; }); });
  var stepV = [1000, 2000, 5000, 10000, 20000, 50000, 100000].find(function (s) { return max / s <= 5; }) || 200000;
  var top = Math.ceil(max / stepV) * stepV || stepV;
  var x = function (t) { return L + t / GAME_MIN * (W - L - R); }, y = function (v) { return H - B - v / top * (H - T - B); };
  var h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="8か国のお金の移り変わり">';
  for (var v = 0; v <= top; v += stepV) h += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmt$(v) + '</text>';
  [0, 10, 20, 30, 40].forEach(function (t) { h += '<text x="' + x(t) + '" y="' + (H - 10) + '" text-anchor="middle">' + t + '分</text>'; });
  var evs = [[12, TH.aidWord], [24, '資源の発見']];
  evs.forEach(function (e) { h += '<line x1="' + x(e[0]) + '" x2="' + x(e[0]) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="' + (x(e[0]) + 4) + '" y="' + (T + 10) + '">' + e[1] + '</text>'; });
  G.countries.forEach(function (c, i) {
    var pts = G.hist[i].concat([c.items.money]);
    var d = pts.map(function (v, k) { return (k ? 'L' : 'M') + x(Math.min(GAME_MIN, k)).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    h += '<path d="' + d + '" fill="none" stroke="' + c.color + '" stroke-width="' + (c.isPlayer ? 4 : 2) + '" stroke-linejoin="round"' + (c.isPlayer ? '' : ' opacity=".85"') + '/>';
  });
  return h + '</svg>';
}

    '<h3>8か国のお金の移り変わり</h3><div class="chart-wrap">' + wealthChart() + '</div>' +

    '<h3>順位</h3><div class="tw"><table class="rank"><thead><tr><th class="r">位</th><th>国</th><th>タイプ</th><th class="r">はじめ</th><th class="r">おわり</th><th class="r">倍率</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<h3>タイプごとの平均</h3><div class="typebars">' + ['A', 'B', 'C', 'D'].map(function (t) {
      return '<div class="tb"><span>' + TYPES[t].label + '</span><div class="o"><i style="width:' + (avg[t] / mx * 100).toFixed(1) + '%"></i></div><span class="v">' + fmt$(avg[t]) + '</span></div>';
    }).join('') + '</div>');
  // 3 公平か
  var endowRows = ['A', 'B', 'C', 'D'].map(function (t) {
    var I = INIT[t];
    return '<tr><td>' + TYPES[t].label + '</td><td class="r">' + fmt$(I.money) + '</td><td class="r">' + I.paper + '</td><td class="r">' + I.pencil + '</td><td>' + TOOL_KEYS.filter(function (k) { return I[k]; }).map(function (k) { return NAMES[k]; }).join('・') + (TOOL_KEYS.some(function (k) { return I[k]; }) ? '' : 'なし') + '</td><td class="r">' + fmt$(avg[t]) + '</td></tr>';
  }).join('');
  pages.push('<h2>ふりかえり ③　これは公平だった？</h2>' +
    '<div class="stat"><div>格差の大きさ（ジニ係数）<b class="num">' + g0.toFixed(2) + ' → ' + g1.toFixed(2) + '</b>0＝みんな同じ、1に近いほど格差が大きい</div>' +
    '<div>いちばん増やした国<b>' + esc(growthBest.name) + '</b>' + TYPES[growthBest.type].label + '・×' + (growthBest.items.money / growthBest.startMoney).toFixed(1) + '</div>' +
    '<div>' + TH.product + 'が売れた数<b class="num">' + SHAPE_KEYS.reduce(function (a, s) { return a + G.total[s]; }, 0) + '個</b>' + SHAPE_KEYS.map(function (s) { return SHAPES[s].name + ' ' + G.total[s]; }).join('・') + '</div></div>' +
    '<h3>はじめに配られたもの</h3><div class="tw"><table class="rank"><thead><tr><th>タイプ</th><th class="r">お金</th><th class="r">' + NAMES.paper + '</th><th class="r">' + NAMES.pencil + '</th><th>' + (real ? '技術' : '道具') + '</th><th class="r">おわりの平均</th></tr></thead><tbody>' + endowRows + '</tbody></table></div>' +
    '<ol class="qs"><li>はじめに配られたものは、国によってどれくらいちがいましたか。その差は40分でどう変わりましたか。</li>' +
    '<li>' + NAMES.paper + 'をたくさん持つ産油国と、' + (real ? '技術' : '道具') + 'を持つ先進国。交渉のとき、どちらが強い立場でしたか。それはなぜ？</li>' +
    '<li>値段が下がったとき、困ったのはどの国でしたか。一つの' + TH.product + 'にたよっていた国はありましたか。</li>' +
    '<li>' + TH.aidWord + 'は役に立ちましたか。' + NAMES.scissors + 'だけでは足りなかったものは何でしょう。</li></ol>');
  // 4 どうあるべきか
  var mapRows = [[NAMES.paper, '原油・鉱産資源・農産物などの一次産品'], [real ? '生産設備・加工技術・精密技術・先端技術' : 'ハサミ・定規・三角定規・コンパス', '工業化の度合い・技術力・資本'],
    [NAMES.pencil, '働く人・人口'], [TH.mkt, '国際市場'], ['国連の値下げ', '国際価格の変動・供給過剰'], [TH.aidWord, 'ODA（政府開発援助）'], ['国どうしの交渉', '貿易協定・二国間の取引'], ['相手のお金が見えない', '情報の差（情報の非対称性）']];
  pages.push('<h2>ふりかえり ④　世界はどうあるべき？</h2>' +
    '<h3>ゲームのしくみは、現実の何にあたる？</h3><div class="tw"><table class="rank map-t"><thead><tr><th>ゲームでは</th><th>現実の世界では</th></tr></thead><tbody>' + mapRows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
    '<ol class="qs"><li>このゲームのモデルは、現実の世界とどこがちがうでしょう。足りないしくみは何ですか。</li>' +
    '<li>もしルールを1つだけ変えられるなら、どう変えると公平になりますか。（例：' + (real ? '技術' : '道具') + 'を貸し出せる、値段の下限を決める、援助のしかたを変える）</li>' +
    '<li>公正な貿易（フェアトレード）とは何でしょう。このゲームの中で、フェアトレードにあたる行動はありましたか。</li>' +
    '<li>はじめの問いにもどろう：<b>資源をたくさん持つ国が、豊かになれないのはなぜだろう？</b></li></ol>');

  var cur = 0;
  var draw = function (root) {
    root.querySelector('.modal-body').innerHTML = '<div class="steps">' + ['気持ち', '何が起きた', '公平だった？', 'どうあるべき？'].map(function (s, i) { return '<span class="' + (i === cur ? 'on' : '') + '">' + (i + 1) + '. ' + s + '</span>'; }).join('') + '</div>' + pages[cur];
    root.querySelector('.modal-body').scrollTop = 0;
    root.querySelector('#dbBack').disabled = cur === 0;
    root.querySelector('#dbNext').hidden = cur === pages.length - 1;
    root.querySelector('#againBtn').hidden = cur !== pages.length - 1;
  };
  G.reopen = function () {
    showModal('<div class="modal-body"></div><div class="modal-foot"><button class="btn" type="button" id="seeBoard">盤面を見る</button><span class="grow"></span>' +
      '<button class="btn" type="button" id="dbBack">もどる</button><button class="btn primary big" type="button" id="dbNext">つぎへ</button><button class="btn gold big" type="button" id="againBtn" hidden>もう一度あそぶ</button></div>',
      function (root) {
        draw(root);
        root.addEventListener('click', function (e) {
          var b = e.target.closest('button'); if (!b) return;
          if (b.dataset.feel) { G.feel[b.dataset.feel] = !G.feel[b.dataset.feel]; b.setAttribute('aria-pressed', !!G.feel[b.dataset.feel]); SFX.tick(); }
          if (b.id === 'dbNext' && cur < pages.length - 1) { cur++; draw(root); SFX.tick(); }
          if (b.id === 'dbBack' && cur > 0) { cur--; draw(root); }
          if (b.id === 'againBtn') { closeModal(); $('helpBtn').textContent = 'ルール'; openRules(true); }
          if (b.id === 'seeBoard') { closeModal(); $('helpBtn').textContent = 'ふりかえり'; toast('右上の「ふりかえり」で、いつでも戻れます'); }
        });
      });
  };
  G.reopen();
}
/* ============================================================
   ループ
   ============================================================ */
var last = 0;
function frame(ts) {
  var dtReal = last ? Math.min(0.25, (ts - last) / 1000) : 0;
  last = ts;
  if (G && G.running && !G.paused && !G.over) {
    var dt = dtReal / speedSec();
    while (dt > 0) { var s = Math.min(0.02, dt); step(s); dt -= s; }
  }
  if (G && !modalOpen && G.cards.length && G.running && !G.over) showCard(G.cards.shift());
  if (dirty && (!modalOpen || (G && G.over))) render();
  if (mapDirty) renderMap();
  renderClock(ts);
  requestAnimationFrame(frame);
}

if (/[?&]debug/.test(location.search)) {
  window.__trade = {
    get G() { return G; },
    start: function (who) { settings.who = who || 'random'; newGame(); G.running = true; closeModal(); render(); renderMap(); },
    run: function (min, keepCards) { var end = Math.min(GAME_MIN, G.t + min); while (G.t < end - 1e-9 && !G.over) step(Math.min(0.02, end - G.t)); if (!keepCards) G.cards = []; render(); renderMap(); },
    gainOf: gainOf, valueOf: valueOf
  };
}

newGame();
render();
renderMap();
openRules(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
