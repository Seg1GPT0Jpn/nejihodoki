<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>くるま出し</title>
<meta name="description" content="ぎゅうぎゅうの駐車場から、車を一台ずつ道路へ出していくパズル。">
<meta name="theme-color" content="#1d2a35">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="くるま出し">
<link rel="stylesheet" href="../common/theme.css">
<link rel="stylesheet" href="../common/ui.css">
<script src="../common/i18n.js"></script>
<script src="../common/games.js"></script>
<script src="../common/platform.js"></script>
<script src="../common/audio.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/versus.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Look: a sunny low-poly parking lot seen from a tilted bird's-eye view. WebGL draws the lot (same in both themes);
   DOM draws header, tools and cards with the shared --kb-* tokens, tinted here to the parking palette (dark: night-blue
   asphalt, light: paper and concrete) so KoboUI's menu and settings sheet match the game. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1d2a35; --kb-surface: #263746; --kb-surface-2: #2c4152; --kb-sunken: #18232c; --kb-line: #3b5163;
  --kb-ink: #f6f3ea; --kb-dim: #a9bccb;
  --kb-accent: #ffcf3f; --kb-accent-ink: #3a2a00; --kb-accent-text: #ffcf3f; --kb-accent-soft: rgba(255, 207, 63, .16);
  --kb-scrim: rgba(14, 22, 30, .6); --kb-toast-bg: rgba(29, 42, 53, .94); --kb-focus: #ffcf3f;
  --kb-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  --pk-card: linear-gradient(#2c4152, #213342); --pk-btn-shadow: #b88c12;
  --pk-float: rgba(29, 42, 53, .92); --pk-float-ink: #f6f3ea; --pk-star-off: #3b5163; --pk-star-off-line: #2c4152;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f3f1ea; --kb-surface: #ffffff; --kb-surface-2: #e8ece9; --kb-sunken: #e3e0d6; --kb-line: #cdd5d9;
    --kb-ink: #1d2a35; --kb-dim: #4f6170;
    --kb-accent: #ffcf3f; --kb-accent-ink: #3a2a00; --kb-accent-text: #8a6100; --kb-accent-soft: rgba(201, 150, 16, .16);
    --kb-scrim: rgba(31, 42, 51, .42); --kb-toast-bg: rgba(29, 42, 53, .94); --kb-focus: #1f6fbf;
    --kb-shadow: 0 16px 40px rgba(31, 42, 51, .2);
    --pk-card: linear-gradient(#ffffff, #f3f1ea); --pk-btn-shadow: #c99a17;
    --pk-float: rgba(255, 255, 255, .95); --pk-float-ink: #1d2a35; --pk-star-off: #d5dbde; --pk-star-off-line: #b9c2c7;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f3f1ea; --kb-surface: #ffffff; --kb-surface-2: #e8ece9; --kb-sunken: #e3e0d6; --kb-line: #cdd5d9;
  --kb-ink: #1d2a35; --kb-dim: #4f6170;
  --kb-accent: #ffcf3f; --kb-accent-ink: #3a2a00; --kb-accent-text: #8a6100; --kb-accent-soft: rgba(201, 150, 16, .16);
  --kb-scrim: rgba(31, 42, 51, .42); --kb-toast-bg: rgba(29, 42, 53, .94); --kb-focus: #1f6fbf;
  --kb-shadow: 0 16px 40px rgba(31, 42, 51, .2);
  --pk-card: linear-gradient(#ffffff, #f3f1ea); --pk-btn-shadow: #c99a17;
  --pk-float: rgba(255, 255, 255, .95); --pk-float-ink: #1d2a35; --pk-star-off: #d5dbde; --pk-star-off-line: #b9c2c7;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--kb-ink); font-family: var(--kb-font-body); background: var(--kb-bg);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 0; }
header {
  display: flex; align-items: center; gap: 6px; flex: none; background: var(--kb-bg);
  padding: max(4px, var(--kb-sat)) max(10px, var(--kb-sar)) 4px max(10px, var(--kb-sal));
}
.back {
  display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-height: 44px; min-width: 44px; flex: none;
  color: var(--kb-dim); text-decoration: none; font-size: 13px; font-weight: 800; white-space: nowrap;
  padding: 0 8px 0 4px; margin-left: -4px; border-radius: 12px;
}
.back svg { width: 22px; height: 22px; flex: none; }
.back:active { background: var(--kb-surface); }
.hud { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
.chip {
  display: flex; align-items: baseline; gap: 4px; background: var(--kb-surface); border: 1px solid var(--kb-line);
  border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-size: 11px; font-weight: 800; color: var(--kb-dim);
}
.chip b { font-family: var(--kb-font-display); font-weight: 400; font-size: 16px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.chip b.lv { color: var(--kb-accent-text); }
.chip .par { color: var(--kb-dim); font-size: 11px; }
.icon {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-surface);
  color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; flex: none; touch-action: manipulation;
}
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .tool:focus-visible, .btn:focus-visible, .lvbtn:focus-visible, .skip:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.mode-bar {
  flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto 4px; max-width: calc(100% - 24px);
  padding: 3px 12px; border-radius: 999px; background: var(--kb-accent-soft); border: 1px solid var(--kb-accent);
  color: var(--kb-ink); font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden;
}
.mode-bar svg { width: 15px; height: 15px; flex: none; color: var(--kb-accent-text); }
.mode-bar span { overflow: hidden; text-overflow: ellipsis; }
.mode-bar b { color: var(--kb-accent-text); font-variant-numeric: tabular-nums; }
#play { position: relative; flex: 1; min-height: 0; touch-action: none; background: #7fbf63; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tip {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
  background: var(--pk-float); border: 1px solid var(--kb-line); color: var(--pk-float-ink); font-weight: 800; font-size: 13px; line-height: 1.45;
  padding: 8px 14px; border-radius: 14px; pointer-events: none; text-align: center; transition: opacity .3s;
}
.tip.off { opacity: 0; }
/* tutorial coach: one real move at a time on the first two stages */
.coach {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 16px);
  display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 10px; border-radius: 16px;
  background: var(--pk-float); color: var(--pk-float-ink); border: 2px solid var(--kb-accent); box-shadow: 0 6px 18px rgba(0,0,0,.22);
  animation: rise .3s cubic-bezier(.2,1.3,.4,1);
}
.coach .step { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font: 400 14px var(--kb-font-display); }
.coach p { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.coach p small { display: block; font-size: 11.5px; font-weight: 500; opacity: .8; margin-top: 1px; }
.skip {
  flex: none; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--kb-line); background: transparent;
  color: inherit; font: 800 13px var(--kb-font-body); cursor: pointer; touch-action: manipulation;
}
.toast {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--kb-toast-bg); border: 1px solid var(--kb-line);
  color: #f6f3ea; font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; pointer-events: none;
  width: max-content; max-width: calc(100% - 24px); text-align: center; line-height: 1.4;
  transition: opacity .2s;
}
.toast.gold { background: var(--kb-accent); color: var(--kb-accent-ink); border-color: var(--kb-accent); }
.toast.off { opacity: 0; }
/* WebGL unavailable / lost: a clear notice instead of a blank lot */
.nogl {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5;
  background: var(--kb-bg); color: var(--kb-ink); text-align: center;
}
.nogl > div { max-width: 320px; }
.nogl svg { width: 56px; height: 56px; color: var(--kb-accent-text); }
.nogl h2 { margin: 6px 0 8px; font-family: var(--kb-font-display); font-weight: 400; font-size: 20px; letter-spacing: .04em; }
.nogl p { margin: 0; color: var(--kb-dim); font-size: 14px; font-weight: 800; line-height: 1.55; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; background: var(--kb-bg);
  padding: 8px max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.tool {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; padding: 6px 4px;
  border-radius: 14px; border: 1px solid var(--kb-line); background: var(--kb-surface); color: var(--kb-ink);
  font: 800 12px var(--kb-font-body); cursor: pointer; min-width: 0; touch-action: manipulation;
}
.tool span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.tool svg { width: 22px; height: 22px; flex: none; }
.tool:active { transform: translateY(2px); }
.tool:disabled { opacity: .45; cursor: default; }
.tool .n {
  position: absolute; top: -6px; right: 6px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  background: var(--kb-accent); color: var(--kb-accent-ink); font: 400 12px/20px var(--kb-font-display); font-style: normal;
}
.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; height: var(--kb-vh);
  padding: max(12px, var(--kb-sat)) max(12px, var(--kb-sar)) max(12px, var(--kb-sab)) max(12px, var(--kb-sal));
  background: var(--kb-scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .3s ease-out;
}
.card {
  width: min(340px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; background: var(--pk-card);
  border: 1px solid var(--kb-line); border-radius: 22px; padding: 22px 20px 16px; text-align: center; box-shadow: var(--kb-shadow); color: var(--kb-ink);
  animation: rise .35s cubic-bezier(.2,1.4,.4,1);
}
.card h2 { margin: 0 0 10px; font-family: var(--kb-font-display); font-weight: 400; font-size: 25px; letter-spacing: .05em; line-height: 1.2; overflow-wrap: anywhere; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 10px; }
.stars svg { width: 46px; height: 46px; }
.stars svg path { fill: var(--pk-star-off); stroke: var(--pk-star-off-line); }
.stars svg.on path { fill: #ffcf3f; stroke: #b88c12; }
.stars svg.on { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.stars svg:nth-child(2) { margin-top: -10px; animation-delay: .12s; }
.stars svg:nth-child(3) { animation-delay: .24s; }
.result { color: var(--kb-dim); font-size: 14px; font-weight: 800; }
.result b { color: var(--kb-ink); font-family: var(--kb-font-display); font-weight: 400; font-size: 20px; }
#dres h2 { font-size: 22px; }
.gain { display: inline-block; margin: 8px auto 0; background: var(--kb-accent); color: var(--kb-accent-ink); font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
.big { font-family: var(--kb-font-display); font-size: clamp(28px, 9vw, 40px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.sub-line { margin-top: 6px; color: var(--kb-dim); font-size: 13px; font-weight: 800; }
.lots { display: flex; justify-content: center; gap: 8px; margin: 12px 0 2px; flex-wrap: wrap; }
.lots span { min-width: 78px; padding: 6px 8px; border-radius: 12px; background: var(--kb-surface); border: 1px solid var(--kb-line); font-size: 11px; font-weight: 800; color: var(--kb-dim); }
.lots span i { display: block; font-style: normal; color: var(--kb-accent-text); font-size: 15px; letter-spacing: 1px; }
.btn {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 16px; border: 0; border-radius: 14px; padding: 10px 14px; cursor: pointer;
  font: 800 17px var(--kb-font-body); background: var(--kb-accent); color: var(--kb-accent-ink); box-shadow: 0 4px 0 var(--pk-btn-shadow); text-decoration: none; touch-action: manipulation;
}
.btn.sub { min-height: 46px; margin-top: 10px; font-size: 15px; background: transparent; color: var(--kb-ink); border: 1px solid var(--kb-line); box-shadow: none; }
.btn.link { min-height: 44px; margin-top: 6px; font-size: 14px; background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pk-btn-shadow); }
.btn.sub:active, .btn.link:active { transform: scale(.98); box-shadow: none; }
.lvgrid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; padding: 4px 2px 6px; min-height: 0; overscroll-behavior: contain; }
.lvbtn {
  min-height: 48px; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-surface); color: var(--kb-ink); padding: 6px 0 3px; cursor: pointer;
  font: 400 16px var(--kb-font-display); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; touch-action: manipulation;
}
.lvbtn.cur { border-color: var(--kb-accent); box-shadow: inset 0 0 0 1px var(--kb-accent); }
.lvbtn i { font-style: normal; font: 800 9px var(--kb-font-body); color: var(--kb-accent-text); letter-spacing: 1px; min-height: 11px; }
.card > .btn { flex: none; }
.langrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 12px; font-weight: 800; color: var(--kb-dim); flex: none; }
.langrow select { min-height: 44px; background: var(--kb-surface); color: var(--kb-ink); border: 1px solid var(--kb-line); border-radius: 10px; padding: 6px 10px; font: 800 14px var(--kb-font-body); }
/* how to play */
.howto h2 { margin-bottom: 8px; }
.howto ol { list-style: none; margin: 0; padding: 0; text-align: left; display: grid; gap: 10px; }
.howto li { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: var(--kb-surface); border: 1px solid var(--kb-line); }
.howto li svg { flex: none; width: 64px; height: 48px; }
.howto li p { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
.howto li p small { display: block; font-weight: 500; font-size: 12px; color: var(--kb-dim); margin-top: 2px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.94); } }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } }
@media (prefers-reduced-motion: reduce) { .overlay, .card, .coach, .stars svg.on { animation: none; } .tip, .toast { transition: none; } }
/* online battle entry (common/versus.js) */
.vs-slot { display: contents; }
#vsSlot .kvs-entry { height: 44px; min-width: 44px; }
/* narrow phones: the header holds back, two chips, battle, sound and menu; labels give way first */
@media (max-width: 430px) { header { gap: 4px; } .hud { gap: 4px; } .chip { padding: 4px 7px; gap: 3px; } .chip .mlabel { display: none; } .back span { display: none; } .back { padding: 0; } }
@media (max-width: 400px) { #vsSlot .kvs-entry { width: 44px; padding: 0; } #vsSlot .kvs-entry span { display: none; } }
@media (max-width: 370px) { .chip { padding: 4px 6px; } .chip b { font-size: 15px; } }
/* the sound toggle is also in the menu (settings: mute and volume), so the narrowest phones drop the shortcut */
@media (max-width: 350px) { #sound { display: none; } .chip .lvlabel { display: none; } .chip .par { font-size: 10px; } }
/* short screens: the tools keep their labels, the icon and padding shrink (44px tall) */
@media (max-height: 640px) {
  .tools { padding-top: 6px; gap: 6px; }
  .tool { min-height: 44px; padding: 3px 4px; gap: 1px; font-size: 11px; }
  .tool svg { width: 18px; height: 18px; }
  .howto li { padding: 6px 8px; } .howto li svg { width: 52px; height: 40px; }
  .card { padding-top: 16px; padding-bottom: 12px; } .card h2 { font-size: 22px; margin-bottom: 8px; }
  .stars svg { width: 40px; height: 40px; }
}
/* landscape phones: icon beside the label, the how-to steps side by side */
@media (max-height: 440px) {
  .tool { flex-direction: row; gap: 6px; }
  .howto ol { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .howto li { flex-direction: column; text-align: center; gap: 4px; }
  .card { width: min(560px, 100%); } .card.narrow { width: min(380px, 100%); }
  .btn { margin-top: 10px; min-height: 46px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n>ゲーム一覧</span></a>
    <div class="hud">
      <div class="chip"><span class="lvlabel" id="lvlabel">Lv</span><b class="lv" id="lvl">1</b></div>
      <div class="chip"><span class="mlabel" data-i18n>手数</span><b id="moves">0</b><span class="par" id="par">/ 目標 0</span></div>
    </div>
    <span id="vsSlot" class="vs-slot"></span>
    <button class="icon" id="sound" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="mode-bar" id="modeBar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="modeText"></span></div>
  <div id="play">
    <canvas id="cv" data-i18n-attr="aria-label" aria-label="駐車場。車をタップすると矢印の向きへ走る"></canvas>
    <div class="tip off" id="tip"></div>
    <div class="coach" id="coach" hidden role="status" aria-live="polite">
      <span class="step" id="coachStep">1</span>
      <p id="coachText"></p>
      <button class="skip" id="coachBtn" type="button" data-i18n>スキップ</button>
    </div>
    <div class="toast off" id="toast" role="status" aria-live="polite"></div>
    <div class="nogl" id="nogl" hidden role="alert">
      <div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16l1.6-5.2A2 2 0 0 1 8.5 9.4h7a2 2 0 0 1 1.9 1.4L19 16"/><rect x="3.5" y="16" width="17" height="3.5" rx="1.2"/><path d="M7 19.5v1.5M17 19.5v1.5M3 3l18 18"/></svg>
        <h2 id="noglTitle"></h2>
        <p id="noglText"></p>
        <button class="btn" id="noglBtn" type="button" data-i18n>再読み込み</button>
      </div>
    </div>
  </div>
  <div class="tools">
    <button class="tool" id="undo" type="button" aria-label="一手戻す" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span data-i18n>戻す</span><em class="n" id="undoN" aria-hidden="true">3</em>

// ---------- Level state ----------

  const minX = -W / 2 - PX, minZ = -H / 2 - PZT, ww = W + PX * 2, hh = H + PZT + PZB;

    rect(-1.05, minZ, 1.05, -ez, '#d8d3c4');
    rect(-ex - ROAD_OUT, -ez - ROAD_OUT, ex + ROAD_OUT, ez + ROAD_OUT, '#474c57');

    rect(-ex - 0.14, -ez - 0.14, ex + 0.14, ez + 0.14, '#ece8dc');
    rect(-ex, -ez, ex, ez, '#5c6371');

function disposeWorld() {
  if (!world) return;
  scene.remove(world.root);
  world.ground.geometry.dispose(); world.ground.material.map.dispose(); world.ground.material.dispose();

}

function buildWorld() {
  disposeWorld();
  const root = new THREE.Group(); scene.add(root);
  world = { root, ground: paintGround(), blocks: {}, turns: {}, arms: [], sign: null, cat: null, gateOpen: false };
  root.add(world.ground);
  const W = lv.W, H = lv.H;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = lv.grid[y * W + x]; if (!t) continue;
    const [wx, wz] = carCenter(x, y, 0, 1);
    const o = t === Core.T_TURN ? buildTurntable() : buildCone(t === Core.T_PILLAR);
    o.position.set(wx, 0, wz); root.add(o);
    (t === Core.T_TURN ? world.turns : world.blocks)[y * W + x] = o;
  }
  // trees around the lot
  const rr = Core.rng32(lv.n * 97 + 3), trunk = lam('#8a5a36'), leaf = [lam('#3f9a4a'), lam('#56b45a'), lam('#2f8a50')];
  for (let i = 0; i < 16; i++) {
    const side = i % 4, along = rr() * 2 - 1, off = ROAD_OUT + 0.9 + rr() * 2.2;
    let x = side & 1 ? (side === 1 ? W / 2 + off : -W / 2 - off) : along * (W / 2 + 2);

    mesh(G.cyl, trunk, 0.16, 0.5, 0.16, 0, 0.25, 0, t);
    mesh(G.cone, leaf[i % 3], 0.9, 1.0, 0.9, 0, 0.9, 0, t);

      lift.position.set(0.08, 0.42, 0); yaw.add(lift);

}

function placeCar(i) {
  const v = cars[i], x = st[i * 3];
  if (v.motion) { v.motion.dead = true; v.motion = null; }
  v.inner.position.set(0, 0, 0); v.inner.scale.set(1, 1, 1); v.group.scale.set(1, 1, 1);
  if (x < 0) { v.group.visible = false; return; }
  const [wx, wz] = carCenter(x, st[i * 3 + 1], st[i * 3 + 2], v.len);
  v.group.visible = true; v.group.position.set(wx, 0, wz); v.group.rotation.y = headingOf(st[i * 3 + 2]);
}
function syncAll() { for (let i = 0; i < nc; i++) placeCar(i); if (world) Object.values(world.blocks).forEach(b => b.rotation.z = 0); updateGate(true); dirty = true; }

function updateGate(instant) {
  if (!lv.barrier || !world) return;
  const remain = lv.barrier.need - leftCount(), open = remain <= 0;
  const sp = world.sign;
  sp.material.map.dispose();
  sp.material.map = signTexture(open ? 'OPEN!' : T('あと{n}台', { n: remain }), open ? '#7ee081' : '#ffcf3f');
  sp.material.needsUpdate = true;
  const to = open ? 1.35 : 0;
  if (instant) { world.gateOpen = open; world.arms.forEach(a => { a.rotation.z = to; a.parent.position.x = a.parent.userData.x; }); }
  else if (open !== world.gateOpen) {
    world.gateOpen = open;
    if (open) sfx.gate();
    const from = world.arms.length ? world.arms[0].rotation.z : 0;
    tween(0.6, p => { const e = 1 - Math.pow(1 - p, 3); world.arms.forEach(a => a.rotation.z = from + (to - from) * e); });
  }
  sp.material.opacity = 1;
  dirty = true;

// ---------- Cat ----------
function catPhase(t) { return ((t - catT0) % CAT_P + CAT_P) % CAT_P; }
function catActive(t) { if (catForce !== null) return catForce; return catPhase(t) < CAT_C; }
function catBlocks(m, i) {
  const c = lv.cat; if (!c || c.side !== m) return false;
  const coord = m & 1 ? st[i * 3 + 1] : st[i * 3];
  if (coord < c.pos || coord >= c.pos + c.len) return false;
  const t = now(); return catActive(t) || catActive(t + 0.25);
}
let catJump = 0;
function updateCat(t) {
  const c = lv.cat, cat = world.cat; if (!c) return;
  const a = c.pos + c.len / 2 - (c.side & 1 ? lv.H : lv.W) / 2;
  let off, walking, dir;
  if (catForce !== null) { off = catForce ? 0.8 : ROAD_OUT + 0.25; walking = !!catForce; dir = 1; }
  else {
    const ph = catPhase(t);
    if (ph < CAT_C) { const q = ph / CAT_C; walking = true; dir = q < 0.5 ? -1 : 1; off = ROAD_OUT + 0.25 - (ROAD_OUT + 0.05) * (q < 0.5 ? q * 2 : 2 - q * 2); }
    else { off = ROAD_OUT + 0.25; walking = false; dir = 1; }
  }
  // dir -1: walking toward the lot, +1: walking away
  const nx = c.side === 1 ? 1 : c.side === 3 ? -1 : 0, nz = c.side === 2 ? 1 : c.side === 0 ? -1 : 0;
  const ex = lv.W / 2, ez = lv.H / 2;
  const px = nx ? nx * (ex + off) : a, pz = nz ? nz * (ez + off) : a;
  cat.group.position.set(px, 0, pz);
  const vx = nx * dir, vz = nz * dir;
  cat.group.rotation.y = walking ? Math.atan2(-vx, -vz) : Math.atan2(nx, nz);
  const jump = Math.max(0, catJump - t);
  cat.body.position.y = (walking ? Math.abs(Math.sin(t * 14)) * 0.03 : 0) + Math.sin(jump / 0.5 * Math.PI) * 0.25 * (jump > 0 ? 1 : 0);
}

// ---------- Moves ----------
function busy(i) { return !!cars[i].motion; }
function pushUndo() { undoStack.push({ st: Int8Array.from(st), moves }); if (undoStack.length > 60) undoStack.shift(); }
function shake(obj, amp, dur) {
  const base = obj.position.x;
  tween(dur || 0.35, p => { obj.position.x = base + Math.sin(p * Math.PI * 7) * (amp || 0.06) * (1 - p); }, () => { obj.position.x = base; });
}
function hitFx(i, r) {
  buzz(30);
  if (r.hit === 'car') { sfx.honk(); shake(cars[r.car].inner, 0.07); }
  else if (r.hit === 'block') { sfx.thud(); const b = world.blocks[r.hy * lv.W + r.hx]; if (b) { const base = b.rotation.z; tween(0.4, p => { b.rotation.z = base + Math.sin(p * Math.PI * 5) * 0.18 * (1 - p); }); } }
  else if (r.hit === 'barrier') { sfx.thud(); world.arms.forEach(a => shake(a.parent, 0.04)); toast(T('ゲートはあと{n}台出ると開く', { n: lv.barrier.need - leftCount() })); }
  else if (r.hit === 'cat') { sfx.meow(); catJump = now() + 0.5; toast(T('ねこが渡ってる！ちょっと待って')); }
}
function bumpLocal(v, sgn, amp, dur) {
  // sgn -1 = toward the nose
  v.inner.position.z = 0;
  return tween(dur, p => { v.inner.position.z = sgn * Math.sin(p * Math.PI) * amp; v.inner.scale.z = 1 - Math.sin(p * Math.PI) * 0.05; },
    () => { v.inner.position.z = 0; v.inner.scale.z = 1; });
}

function drive(i, m) {
  if (won || st[i * 3] < 0 || busy(i)) return;
  const d = st[i * 3 + 2];
  if (m !== d) return;   // forward only: a car never reverses
  const o = Core.buildOcc(lv, st);
  let r = Core.slide(lv, st, o, i, m, leftCount());
  if (r.exit && catBlocks(m, i)) r = { exit: false, k: r.k, hit: 'cat' };
  clearHint();
  const v = cars[i], sgn = -1;
  if (!r.exit && r.k === 0) { // can't budge: lurch and honk, and say why (the first couple of times)
    const a = bumpLocal(v, sgn, 0.13, 0.22); v.motion = a; const done = a.done;
    a.done = () => { done(); v.motion = null; };
    setTimeout(() => {
      hitFx(i, r);
      if (r.hit === 'car') explain('car', T('前に車がいて動けない。先にその車を出そう'));
      else if (r.hit === 'block') explain('block', T('コーンや柱があって進めない'));
    }, 90);
    renderCoach();
    dirty = true;
    return;
  }
  startPlay(); pushUndo(); moves++; showTip('');
  const [x0, z0] = carCenter(st[i * 3], st[i * 3 + 1], d, v.len);
  if (r.exit) {
    st[i * 3] = -1;
    sfx.vroom(); buzz(12);
    animateExit(i, m, x0, z0);
    updateGate(false);
  } else {
    st[i * 3] += DX[m] * r.k; st[i * 3 + 1] += DY[m] * r.k;
    const [x1, z1] = carCenter(st[i * 3], st[i * 3 + 1], d, v.len);
    sfx.vroom();
    const dur = 0.1 + 0.07 * r.k;
    v.motion = tween(dur, p => { const e = p * p * (1.6 - 0.6 * p); v.group.position.set(x0 + (x1 - x0) * e, 0, z0 + (z1 - z0) * e); }, () => {
      v.motion = bumpLocal(v, sgn, 0.07, 0.16);
      const done = v.motion.done; v.motion.done = () => { done(); v.motion = null; };
      hitFx(i, r);
    });
  }
  afterMove();
}

function animateExit(i, m, x0, z0) {
  const v = cars[i], d = st[i * 3 + 2] < 0 ? lv.cars[i].d : st[i * 3 + 2];
  const ex = lv.W / 2 + RC, ez = lv.H / 2 + RC;
  const P1 = m === 0 ? [x0, -ez] : m === 2 ? [x0, ez] : m === 1 ? [ex, z0] : [-ex, z0];
  const pts = [[x0, z0], P1];
  if (m === 1 || m === 3) pts.push([m === 1 ? ex : -ex, -ez]);
  else if (m === 2) { const sx = x0 >= 0 ? ex : -ex; pts.push([sx, ez], [sx, -ez]); }
  pts.push([0, -ez], [0, -ez - 7]);
  const segs = []; let total = 0;
  for (let k = 1; k < pts.length; k++) {
    const dx = pts[k][0] - pts[k - 1][0], dz = pts[k][1] - pts[k - 1][1], l = Math.hypot(dx, dz);
    if (l < 1e-4) continue;
    segs.push({ a: pts[k - 1], dx, dz, l, s0: total }); total += l;
  }
  const vmax = 12, ta = 0.22, T = total / vmax + ta / 2;
  let heading = v.group.rotation.y, last = now();
  const reversing = m !== d;
  v.motion = null; // exiting cars are not interactive any more
  const a = tween(T, p => {
    const t = p * T, s = t < ta ? vmax * t * t / (2 * ta) : vmax * (t - ta / 2);
    let sg = segs[segs.length - 1];
    for (const q of segs) if (s <= q.s0 + q.l) { sg = q; break; }
    const u = Math.min(1, (s - sg.s0) / sg.l);
    v.group.position.set(sg.a[0] + sg.dx * u, 0, sg.a[1] + sg.dz * u);
    const tn = now(), dt = Math.min(0.05, tn - last); last = tn;
    let want = Math.atan2(-sg.dx, -sg.dz);
    if (sg === segs[0] && reversing) want = headingOf(d);
    let diff = want - heading; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
    heading += diff * Math.min(1, dt * 13);
    v.group.rotation.y = heading;
    const fade = total - s; v.group.scale.setScalar(fade < 2.5 ? Math.max(0.01, fade / 2.5) : 1);
  }, () => { v.group.visible = false; v.group.scale.setScalar(1); });
  v.exitAnim = a;
}

function rotateCar(i) {
  if (won || st[i * 3] < 0 || busy(i)) return;
  const o = Core.buildOcc(lv, st), rt = Core.rotTarget(lv, st, o, i), v = cars[i];
  if (!rt) return;
  clearHint();
  if (!rt.ok) {
    const base = v.group.rotation.y;
    v.motion = tween(0.3, p => { v.group.rotation.y = base - Math.sin(p * Math.PI) * 0.18; }, () => { v.group.rotation.y = base; v.motion = null; });
    setTimeout(() => hitFx(i, rt.car !== undefined ? { hit: 'car', car: rt.car } : rt.hx !== undefined ? { hit: 'block', hx: rt.hx, hy: rt.hy } : { hit: 'wall' }), 120);
    if (rt.car === undefined && rt.hx === undefined) { sfx.thud(); buzz(30); }
    explain('turn', T('まわりがふさがっていて回れない'));
    return;
  }
  startPlay(); pushUndo(); moves++; showTip('');
  const [px, pz] = carCenter(rt.tx, rt.ty, 0, 1);
  const p0 = v.group.position.clone(), h0 = v.group.rotation.y;
  st[i * 3] = rt.x; st[i * 3 + 1] = rt.y; st[i * 3 + 2] = rt.d;
  const disc = world.turns[rt.ty * lv.W + rt.tx], d0 = disc ? disc.rotation.y : 0;
  sfx.whir();
  v.motion = tween(0.42, p => {
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2, ang = -Math.PI / 2 * e;
    const ox = p0.x - px, oz = p0.z - pz, c = Math.cos(ang), s = Math.sin(ang);
    v.group.position.set(px + ox * c + oz * s, 0, pz - ox * s + oz * c);
    v.group.rotation.y = h0 + ang;
    if (disc) disc.rotation.y = d0 + ang;
  }, () => { v.motion = null; placeCar(i); });
  afterMove();
}

function afterMove() {
  updateHUD();
  const alive = Core.aliveCount(st);
  if (alive === 0 && vs) { won = true; vsCleared(); dirty = true; return; }
  if (alive === 0) { won = true; lotCleared(); }
  else persistLot();
  tutorialSync();
  dirty = true;
}

// A lot is clear: stars, save (normal stages) or the day's run (daily), events, then the result card.
function lotCleared() {
  const n = lv.n, par = lv.par, stars = Core.starsFor(moves, par), wonLv = lv, g = KG();
  startPlay();
  if (mode === 'daily' && daily) {
    const pts = Core.lotPoints(moves, par), last = lv.dailyIdx >= DAILY_N - 1;
    daily.score += pts; daily.stars[lv.dailyIdx] = stars; daily.moves += moves;
    if (g) g.emit('stage_clear', { mode: 'daily', stage: lv.dailyIdx + 1, stars, moves, par, dateKey: daily.dateKey });
    if (last) { daily.done = true; endPlay('clear', daily.score, { stats: { stars: daily.stars.slice(), moves: daily.moves } }); refreshDaily(); }
    else daily.idx = lv.dailyIdx + 1;
    persistDaily(null); renderMode();
    setTimeout(() => {
      if (lv !== wonLv || !won) return;
      if (last) { sfx.daily(); buzz([30, 40, 70]); showDailyResult(); } else { sfx.win(); buzz([20, 30, 40]); showWin(stars, pts); }
    }, 1300);
    return;
  }
  const prevBest = save.best;
  save.stars[n] = Math.max(save.stars[n] || 0, stars);
  save.best = Math.max(save.best, n + 1); save.level = n + 1; persist();
  store.set(KEY_STATE, 'null');
  if (g) {
    g.emit('stage_clear', { mode: 'normal', stage: n, stars, moves, par });
    if (save.best > prevBest) g.emit('best', { score: save.best - 1, stage: n });
  }
  endPlay('clear', n, { stats: { stars, moves, par } });
  if (n === 2 && tut) finishTutorial(true);
  setTimeout(() => { if (lv !== wonLv || !won) return; sfx.win(); buzz([20, 30, 40]); showWin(stars); }, 1300);
}

function undo() {
  if (won) return;
  if (vs ? !KoboVersus.canPlay() : KoboVersus.active()) return;
  if (!undoStack.length) { toast(T('戻せる手がない')); return; }
  if (undosLeft <= 0) { toast(T('このステージの「戻す」は使い切った')); return; }
  const s = undoStack.pop(); undosLeft--;
  anims.forEach(a => { a.dead = true; }); anims = [];
  cars.forEach(c => { c.motion = null; });
  st = s.st; moves = s.moves; clearHint();
  syncAll(); updateHUD(); sfx.click(); persistLot(); tutorialSync();
}

function clearHint() {
  if (hintMark && world) world.root.remove(hintMark);
  hintMark = null; hintFor = -1; dirty = true;
}
// a yellow arrow (drive) or ring (turn) floating over car mv.i: the hint, and the tutorial's "this one"
function showHintMark(mv) {
  clearHint();
  const i = mv.i, d = st[i * 3 + 2], len = cars[i].len;
  const root = new THREE.Group(), g = new THREE.Group(), yel = bas('#ffd23f'), rim = bas('#1d2a35');
  root.add(g);
  if (mv.rot) {
    mesh(G.ring, rim, 1.42, 1.42, 1.42, 0, -0.01, 0, g);
    mesh(G.ring, yel, 1.3, 1.3, 1.3, 0, 0, 0, g);
    const tip = mesh(G.cone, yel, 0.24, 0.3, 0.24, 0.39, 0, 0, g); tip.rotation.x = Math.PI / 2;
  } else {
    const arm = new THREE.Group(); g.add(arm);
    // a dark rim behind the yellow arrow keeps it readable over yellow and white cars
    mesh(G.box, rim, 0.26, 0.06, 0.6, 0, -0.03, 0.15, arm);
    const tipR = mesh(G.cone, rim, 0.56, 0.5, 0.56, 0, -0.03, -0.27, arm); tipR.rotation.x = -Math.PI / 2;
    mesh(G.box, yel, 0.16, 0.08, 0.5, 0, 0, 0.15, arm);
    const tip = mesh(G.cone, yel, 0.42, 0.4, 0.42, 0, 0, -0.25, arm); tip.rotation.x = -Math.PI / 2;
    arm.rotation.y = headingOf(d);
  }
  g.scale.setScalar(1.5); g.position.y = 1.15;
  // the glow on the ground around the car to move
  const h = d & 1, glow = mesh(G.plane, glowMat, (h ? len : 1) + 0.3, 1, (h ? 1 : len) + 0.3, 0, 0.025, 0, root);
  glow.renderOrder = 1;
  const [x, z] = carCenter(st[i * 3], st[i * 3 + 1], d, len);
  root.position.set(x, 0, z); root.userData.bob = g;
  world.root.add(root); hintMark = root; hintFor = i; dirty = true;
}
const glowMat = new THREE.MeshBasicMaterial({ color: '#fff1a8', transparent: true, opacity: 0.6, depthWrite: false });
function hint() {
  if (won || vs || KoboVersus.active()) return;
  if (mode === 'daily') { toast(T('デイリーではヒントは使えない')); return; }
  if (hintsLeft <= 0) { toast(T('このステージのヒントは使い切った')); return; }
  const sol = Core.solve(lv, st, 60000);
  if (!sol || !sol.moves.length) { toast(T('行き詰まり…「戻す」かリスタートを')); return; }
  hintsLeft--; curLevelHints.left = hintsLeft; updateHUD(); persistLot(); sfx.click();
  showHintMark(sol.moves[0]);
  if (sol.moves[0].rot) toast(T('この車をタップして回そう'));
}

function updateHUD() {
  $('lvl').textContent = mode === 'daily' && lv.dailyIdx != null ? (lv.dailyIdx + 1) + '/' + DAILY_N : lv.n;
  $('lvlabel').textContent = mode === 'daily' && lv.dailyIdx != null ? T('駐車場') : 'Lv';
  $('moves').textContent = moves;
  $('par').textContent = T('/ 目標 {n}', { n: lv.par });
  const noHint = !!vs || mode === 'daily';
  $('undoN').textContent = undosLeft; $('hintN').textContent = noHint ? 0 : hintsLeft;
  $('undo').disabled = undosLeft <= 0; $('hint').disabled = hintsLeft <= 0 || noHint;
  $('levels').disabled = !!vs;
}

// ---------- Lots: normal stages, the daily run ----------
let curLevelHints = { n: 0, left: HINT_MAX };
function hideCards() { $('win').hidden = true; $('dres').hidden = true; }
function resetLot() {
  anims.forEach(a => { a.dead = true; }); anims = [];
  nc = lv.cars.length; st = Core.makeState(lv); moves = 0; undoStack = []; undosLeft = UNDO_MAX; hintsLeft = HINT_MAX; won = false;
  catT0 = now() + 1.5; catForce = null; down = null;
}
// a saved lot in progress { n, st, moves, undosLeft, hintsLeft }: used only if it fits this lot exactly
function restoreLot(s) {
  if (!s || typeof s !== 'object' || s.n !== lv.n || !Array.isArray(s.st) || s.st.length !== nc * 3) return false;
  const a = Int8Array.from(s.st.map(v => v | 0)), seen = new Set();
  let alive = 0;
  for (let i = 0; i < nc; i++) {
    const x = a[i * 3], y = a[i * 3 + 1], d = a[i * 3 + 2];
    if (x < 0) { if (x !== -1) return false; continue; }
    if (d < 0 || d > 3) return false;
    alive++;
    for (const [cx, cy] of Core.cellsOf(x, y, d, lv.lens[i])) {
      if (cx < 0 || cy < 0 || cx >= lv.W || cy >= lv.H) return false;
      const k = cy * lv.W + cx, t = lv.grid[k];
      if (t === Core.T_CONE || t === Core.T_PILLAR || seen.has(k)) return false;
      seen.add(k);
    }
  }
  if (!alive) return false;
  st = a; moves = clampInt(s.moves, 0, 9999, 0);
  undosLeft = clampInt(s.undosLeft, 0, UNDO_MAX, UNDO_MAX); hintsLeft = clampInt(s.hintsLeft, 0, HINT_MAX, HINT_MAX);
  return true;
}
function persistDaily(lot) {
  if (!daily || vs) return;
  store.set(KEY_DAILY, JSON.stringify({ v: 1, dateKey: daily.dateKey, idx: daily.idx, score: daily.score, stars: daily.stars, moves: daily.moves, done: !!daily.done, lot: lot || null }));
}
// the lot in progress, so closing the page and coming back continues the same lot (turn-based: Q-5/Q-6)
function persistLot() {
  if (vs || !lv || won) return;
  const snap = { n: lv.n, st: Array.from(st), moves, undosLeft, hintsLeft };
  if (mode === 'daily') { if (daily && !daily.done) persistDaily(Object.assign({ idx: lv.dailyIdx }, snap)); }
  else store.set(KEY_STATE, JSON.stringify(Object.assign({ v: 1 }, snap)));
}
function startLevel(n, keepHints, snap) {
  if (vs) return; // a match owns the lot
  endPlay('quit');
  n = Math.max(1, n | 0);
  hideCards();
  if (mode === 'daily') persistLot();
  mode = 'normal'; daily = null;
  lv = Core.generate(n);
  resetLot();
  if (curLevelHints.n !== n || !keepHints) curLevelHints = { n, left: HINT_MAX };
  hintsLeft = curLevelHints.left;
  if (snap && restoreLot(snap)) curLevelHints.left = hintsLeft;
  save.level = n; save.best = Math.max(save.best, n); persist();
  persistLot();
  buildWorld(); fitCamera(); updateHUD(); renderMode();
  tutorialSync();
  showTip(lv.tip ? T(lv.tip) : '');
}
function restartLot() {
  if (vs) { if (KoboVersus.canPlay() && !won) { sfx.click(); vsLot(vs.idx); } return; }
  if (KoboVersus.active()) return;
  sfx.click();
  if (mode === 'daily' && daily) { if (!daily.done) loadDailyLot(daily.idx, null); return; }
  curLevelHints.left = hintsLeft; startLevel(lv.n, true);
}

// ---------- Daily challenge (JST date and seed from KoboPlatform; the result is recorded by the platform) ----------
// Three seeded lots for the day (ParkingEngine.dailyLot): the same for everyone. Score: 100 per lot + 50 at par, 10 less per
// extra move (the online-battle points). No hints; undo and restart are allowed. Progress for the day is kept on this device.
function dateLabel(dk) {
  const m = Math.floor(dk / 100) % 100, d = dk % 100;
  return KoboI18n.lang === 'en' ? T('{m}月{d}日', { mon: EN_MON[m - 1], d }) : T('{m}月{d}日', { m, d });
}
function refreshDaily() {
  if (!daily || !PF) return;
  const rec = PF.daily.get(daily.dateKey, GAME) || {};
  daily.best = Math.max(0, Number(rec.best) || 0);
  daily.tries = Math.max(0, Number(rec.tries) || 0);
}
function startDaily(dateKey) {
  if (!PF || vs) return;
  const dk = PF.isDateKey(dateKey) && Number(dateKey) <= PF.jstDateKey() ? Number(dateKey) : PF.jstDateKey();
  endPlay('quit');
  if (mode === 'normal') persistLot();
  $('select').hidden = true;
  mode = 'daily';
  daily = { dateKey: dk, seed: PF.dailySeed(GAME, dk), idx: 0, score: 0, stars: [], moves: 0, done: false, best: 0, tries: 0 };
  const s = readJSON(KEY_DAILY);
  let lot = null;
  if (s && s.v === 1 && s.dateKey === dk) {
    daily.idx = clampInt(s.idx, 0, DAILY_N - 1, 0); daily.score = clampInt(s.score, 0, 1e6, 0);
    daily.stars = Array.isArray(s.stars) ? s.stars.slice(0, DAILY_N).map(v => clampInt(v, 0, 3, 0)) : [];
    daily.moves = clampInt(s.moves, 0, 1e6, 0); daily.done = !!s.done;
    if (s.lot && s.lot.idx === daily.idx) lot = s.lot;
  }
  refreshDaily();
  hideCards();
  loadDailyLot(daily.done ? DAILY_N - 1 : daily.idx, daily.done ? null : lot);
  toast(T('今日のチャレンジ（{d}）', { d: dateLabel(dk) }), true);
  if (daily.done) { won = true; showDailyResult(); }
}
function loadDailyLot(i, snap) {
  lv = Core.dailyLot(daily.seed, i); lv.dailyIdx = i;
  resetLot();
  if (snap) restoreLot(snap);
  buildWorld(); fitCamera(); updateHUD(); renderMode(); tutorialSync();
  persistLot();
  showTip(lv.barrier && !moves ? T('しましまのゲートは「あと○台」出るまで開かない') : T('駐車場 {n}', { n: i + 1 }) + T(' ・ ') + T('目標 {n}手', { n: lv.par }));
}
function dailyRetry() {
  if (!daily || vs) return;
  endPlay('quit');
  Object.assign(daily, { idx: 0, score: 0, stars: [], moves: 0, done: false });
  persistDaily(null); hideCards(); loadDailyLot(0, null);
}
// back to the normal stages (the lot in progress there was saved)
function setMode(m) {
  if (m !== 'normal' || vs) return;
  startLevel(save.level, false, readJSON(KEY_STATE));
}
function renderMode() {
  const bar = $('modeBar'), on = mode === 'daily' && !!daily && !vs;
  bar.hidden = !on;
  if (!on) return;
  bar.title = T('全員が同じ3つの駐車場に挑む、1日1つのチャレンジ。ヒントなし、何度でも挑戦できます。');
  const t = $('modeText'); t.textContent = '';
  const i = lv && lv.dailyIdx != null ? lv.dailyIdx + 1 : daily.idx + 1;
  const b1 = document.createElement('b'); b1.textContent = i + '/' + DAILY_N;
  const b2 = document.createElement('b'); b2.textContent = T('{p} 点', { p: daily.score });
  t.append(T('今日のチャレンジ（{d}）', { d: dateLabel(daily.dateKey) }) + T(' ・ '), b1, T(' ・ '), b2);
}
function showDailyResult() {
  $('dresDate').textContent = T('今日のチャレンジ（{d}）', { d: dateLabel(daily.dateKey) });
  $('dresScore').textContent = T('{p} 点', { p: daily.score });
  const box = $('dresLots'); box.textContent = '';
  for (let i = 0; i < DAILY_N; i++) {
    const s = daily.stars[i] || 0, e = document.createElement('span'), st2 = document.createElement('i');
    e.textContent = T('駐車場 {i}', { i: i + 1 }); st2.textContent = '★'.repeat(s) + '☆'.repeat(3 - s);
    e.setAttribute('aria-label', T('駐車場 {i}', { i: i + 1 }) + ' ' + s + '/3');
    e.append(st2); box.append(e);
  }
  $('dresBest').textContent = daily.tries ? T('今日のベスト {b} 点 ・ {n} 回目', { b: daily.best, n: daily.tries }) : '';
  $('win').hidden = true; $('dres').hidden = false;
  setTimeout(() => $('dresAgain').focus({ preventScroll: true }), 50);
}

// ---------- Play sessions (KoboGame events) ----------
// normal: one session per stage, from the first move to the clear (or leaving it). daily: one session for the day's run.
function startPlay() {
  if (sess || vs || !lv) return;
  sess = { mode, t0: performance.now(), stage: mode === 'daily' ? (lv.dailyIdx || 0) + 1 : lv.n, dateKey: daily ? daily.dateKey : undefined };
  const g = KG(); if (!g) return;
  g.emit('play_start', mode === 'daily' ? { mode, dateKey: daily.dateKey, seed: daily.seed, stage: sess.stage } : { mode, stage: lv.n });
}
function endPlay(reason, score, extra) {
  if (!sess) return;
  const s = sess; sess = null;
  const g = KG(); if (!g) return;
  g.emit('play_end', Object.assign({ mode: s.mode, reason, score: score || 0, stage: s.stage, dateKey: s.dateKey, durationMs: Math.round(performance.now() - s.t0) }, extra || {}));
}

// ---------- Tutorial: the first two stages, one real move at a time ----------
// Stage 1: tap the glowing car → swipe the next one → the last one. Stage 2: a blocked lot, the glowing car first.
// A floating arrow (the hint marker, free here) points at the car to move. Skipping is always possible.
const TUT = [
  ['光っている車をタップしよう', '車は矢印の向きにだけ走る'],

const _v = new THREE.Vector3();
function fitCamera() {

  renderer.setSize(w, h, false); camera.aspect = w / h;
  if (!lv) return;
  const tilt = (h / w > 1.25 ? 58 : 50) * Math.PI / 180, cs = Math.cos(tilt), sn = Math.sin(tilt);
  const ex = lv.W / 2 + ROAD_OUT + 0.1, ez = lv.H / 2 + ROAD_OUT + 0.1;
  const pts = [];
  for (const x of [-ex, ex]) for (const z of [-ez, ez]) for (const y of [0, 0.7]) pts.push([x, y, z]);

    return { mx, y0, y1 };

  tutorial: () => ({ step: tut ? tut.step : (store.get(KEY_TUT) ? TUT.length : 0), done: !!store.get(KEY_TUT), active: !!tut }),
  daily: dk => startDaily(dk), normal: () => setMode('normal'), menu: openMenu, howto: () => showHowto(false), restart: restartLot,
  goto: n => startLevel(n), speed: k => { timeScale = k; }, carScreen: i => window.__parking.carScreen(i),
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
})();
</script>
