<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>くるま出し</title>
<meta name="description" content="ぎゅうぎゅうの駐車場から、車を一台ずつ道路へ出していくパズル。">
<meta name="theme-color" content="#1d2a35">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="くるま出し">
<script src="../common/i18n.js"></script>
<script src="../common/versus.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Look: a sunny low-poly parking lot seen from a tilted bird's-eye view. WebGL draws the lot; DOM draws header, tools and cards. */
:root {
  --ink: #1d2a35;
  --ink-2: #263746;
  --line: #3b5163;
  --paper: #f6f3ea;
  --paper-dim: #a9bccb;
  --sun: #ffcf3f;
  --sun-ink: #3a2a00;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--paper); font-family: var(--font-body); background: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
}
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: 0;
}
header {
  display: flex; align-items: center; gap: 6px; flex: none; background: var(--ink);
  padding: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
}
.back {
  color: var(--paper-dim); text-decoration: none; font-size: 13px; font-weight: 800; white-space: nowrap;
  padding: 6px 8px; margin-left: -4px; border-radius: 10px;
}
.back:active { background: var(--ink-2); }
.hud { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
.chip {
  display: flex; align-items: baseline; gap: 4px; background: var(--ink-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-size: 11px; font-weight: 800; color: var(--paper-dim);
}
.chip b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--paper); font-variant-numeric: tabular-nums; }
.chip b.lv { color: var(--sun); }
.chip .par { color: var(--paper-dim); font-size: 11px; }
.icon {
  width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2);
  color: var(--paper); display: grid; place-items: center; padding: 0; cursor: pointer; flex: none;
}
.icon svg { width: 20px; height: 20px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .tool:focus-visible, .btn:focus-visible, .lvbtn:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
#play { position: relative; flex: 1; min-height: 0; touch-action: none; background: #7fbf63; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tip {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
  background: rgba(29,42,53,.9); border: 1px solid var(--line); color: var(--paper); font-weight: 800; font-size: 13px; line-height: 1.45;
  padding: 8px 14px; border-radius: 14px; pointer-events: none; text-align: center; transition: opacity .3s;
}
.tip.off { opacity: 0; }
.toast {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(29,42,53,.94); border: 1px solid var(--line);
  color: var(--paper); font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 999px; pointer-events: none;
  width: max-content; max-width: calc(100% - 24px); text-align: center; line-height: 1.4;
  transition: opacity .2s;
}
.toast.off { opacity: 0; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; background: var(--ink);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tool {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px 6px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--ink-2); color: var(--paper);
  font: 800 12px var(--font-body); cursor: pointer; min-width: 0;
}
.tool span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool svg { width: 22px; height: 22px; }
.tool:active { transform: translateY(2px); }
.tool:disabled { opacity: .4; cursor: default; }
.tool .n {
  position: absolute; top: -6px; right: 6px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  background: var(--sun); color: var(--sun-ink); font: 400 12px/20px var(--font-display);
}
.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(14,22,30,.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .3s ease-out;
}
.card {
  width: min(330px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; background: linear-gradient(#2c4152, #213342);
  border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 18px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.45);
  animation: rise .35s cubic-bezier(.2,1.4,.4,1);
}
.card h2 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .05em; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 10px; }
.stars svg { width: 46px; height: 46px; }
.stars svg.on { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.stars svg:nth-child(2) { margin-top: -10px; animation-delay: .12s; }
.stars svg:nth-child(3) { animation-delay: .24s; }
.result { color: var(--paper-dim); font-size: 14px; font-weight: 800; }
.result b { color: var(--paper); font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.btn {
  display: block; width: 100%; margin-top: 16px; border: 0; border-radius: 14px; padding: 13px; cursor: pointer;
  font: 800 17px var(--font-body); background: var(--sun); color: var(--sun-ink); box-shadow: 0 4px 0 #b88c12;
}
.btn.sub { background: var(--ink-2); color: var(--paper); box-shadow: 0 4px 0 #142029; border: 1px solid var(--line); margin-top: 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88c12; }
.lvgrid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; padding: 4px 2px 6px; min-height: 0; overscroll-behavior: contain; }
.lvbtn {
  border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); color: var(--paper); padding: 7px 0 4px; cursor: pointer;
  font: 400 16px var(--font-display); display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.lvbtn.cur { border-color: var(--sun); box-shadow: inset 0 0 0 1px var(--sun); }
.lvbtn i { font-style: normal; font: 800 9px var(--font-body); color: var(--sun); letter-spacing: 1px; min-height: 11px; }
.card > .btn { flex: none; }
.langrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 12px; font-weight: 800; color: var(--paper-dim); flex: none; }
.langrow select { background: var(--ink-2); color: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font: 800 14px var(--font-body); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.94); } }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } }
@media (prefers-reduced-motion: reduce) { .overlay, .card, .stars svg.on { animation: none; } }
/* online battle entry (common/versus.js) */
.vs-slot { display: contents; }
@media (max-width: 400px) { #vsSlot .kvs-entry { width: 36px; padding: 0; } #vsSlot .kvs-entry span { display: none; } }
/* narrow phones: the battle button takes header room, so the move chip drops its label and the chips tighten */
@media (max-width: 430px) { header { gap: 4px; } .hud { gap: 4px; } .chip { padding: 4px 7px; gap: 3px; } .chip .mlabel { display: none; } }
@media (max-width: 340px) { .back { font-size: 11px; padding: 6px 2px; margin-left: -2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .chip .lvlabel { display: none; } .hud { flex: 1 0 auto; } .chip { padding: 4px 5px; } .chip b { font-size: 14px; } .chip .par { font-size: 10px; } }
@media (max-width: 370px) { .back { font-size: 12px; padding: 6px 4px; } .chip { padding: 4px 8px; } .chip b { font-size: 15px; } }
@media (max-height: 600px) { .tool span { display: none; } }
/* fit the visible viewport on phones (browser bars included) */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" data-i18n>← ゲーム一覧</a>
    <div class="hud">
      <div class="chip"><span class="lvlabel">Lv</span><b class="lv" id="lvl">1</b></div>
      <div class="chip"><span class="mlabel" data-i18n>手数</span><b id="moves">0</b><span class="par" id="par">/ 目標 0</span></div>
    </div>
    <span id="vsSlot" class="vs-slot"></span>
    <button class="icon" id="sound" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
  </header>
  <div id="play">
    <canvas id="cv" data-i18n-attr="aria-label" aria-label="駐車場。車をタップすると矢印の向きへ走る"></canvas>
    <div class="tip off" id="tip"></div>
    <div class="toast off" id="toast"></div>
  </div>
  <div class="tools">
    <button class="tool" id="undo" type="button" aria-label="一手戻す" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span data-i18n>戻す</span><em class="n" id="undoN">3</em>
    </button>
    <button class="tool" id="hint" type="button" aria-label="ヒント" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span data-i18n>ヒント</span><em class="n" id="hintN">3</em>
    </button>
    <button class="tool" id="restart" type="button" aria-label="リスタート" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      <span data-i18n>リスタート</span>
    </button>
    <button class="tool" id="levels" type="button" aria-label="ステージ選択" data-i18n-attr="aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      <span data-i18n>ステージ</span>
    </button>
  </div>
</div>
<div class="overlay" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle" data-i18n>ぜんぶ出た！</h2>
    <div class="stars" id="winStars"></div>
    <div class="result" data-i18n-html>手数 <b id="winMoves">0</b> ／ 目標 <b id="winPar">0</b></div>
    <button class="btn" id="next" type="button" data-i18n>次のステージへ</button>
    <button class="btn sub" id="again" type="button" data-i18n>もう一度</button>
  </div>
</div>
<div class="overlay" id="select" hidden role="dialog" aria-modal="true" aria-labelledby="selTitle">
  <div class="card">
    <h2 id="selTitle" data-i18n>ステージ</h2>
    <div class="lvgrid" id="lvgrid"></div>
    <div class="langrow"><span data-i18n>言語 / Language</span><span id="langPick"></span></div>
    <button class="btn sub" id="selClose" type="button" data-i18n>とじる</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* CORE-BEGIN : pure puzzle logic (no DOM). Grid cell types, sliding rules, solver, seeded generator. */
const Core = (() => {
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 up(far) 1 right 2 down(near) 3 left
  const T_EMPTY = 0, T_CONE = 1, T_PILLAR = 2, T_TURN = 3;

  function rng32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // state: Int8Array [x,y,d]*nCars ; x = -1 means the car has left
  function makeState(lv) {
    const s = new Int8Array(lv.cars.length * 3);
    lv.cars.forEach((c, i) => { s[i * 3] = c.x; s[i * 3 + 1] = c.y; s[i * 3 + 2] = c.d; });
    return s;
  }
  function aliveCount(s) { let n = 0; for (let i = 0; i < s.length; i += 3) if (s[i] >= 0) n++; return n; }
  function buildOcc(lv, s) {
    const W = lv.W, o = new Int16Array(W * lv.H);
    for (let i = 0; i < lv.lens.length; i++) {
      const x = s[i * 3]; if (x < 0) continue;
      const y = s[i * 3 + 1], h = s[i * 3 + 2] & 1, L = lv.lens[i];
      for (let k = 0; k < L; k++) o[(y + (h ? 0 : k)) * W + x + (h ? k : 0)] = i + 1;
    }
    return o;
  }
  function cellsOf(x, y, d, L) {
    const h = d & 1, out = [];
    for (let k = 0; k < L; k++) out.push([x + (h ? k : 0), y + (h ? 0 : k)]);
    return out;
  }
  // Drive car i toward direction m (must be along its axis). left = cars already gone.
  function slide(lv, s, o, i, m, left) {
    const x = s[i * 3], y = s[i * 3 + 1], L = lv.lens[i], W = lv.W, H = lv.H;
    let lx = x, ly = y;
    if (m === 1) lx = x + L - 1; else if (m === 2) ly = y + L - 1;
    for (let k = 1; ; k++) {
      const cx = lx + DX[m] * k, cy = ly + DY[m] * k;
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) {
        if (lv.barrier && lv.barrier.side === m && left < lv.barrier.need) return { exit: false, k: k - 1, hit: 'barrier' };
        return { exit: true, k: k - 1 };
      }
      const t = lv.grid[cy * W + cx];
      if (t === T_CONE || t === T_PILLAR) return { exit: false, k: k - 1, hit: 'block', hx: cx, hy: cy };
      const oc = o[cy * W + cx];
      if (oc && oc !== i + 1) return { exit: false, k: k - 1, hit: 'car', car: oc - 1 };
    }
  }
  // Turntable: rotate car 90° clockwise around the turntable cell it covers.
  function rotTarget(lv, s, o, i) {
    const x = s[i * 3], y = s[i * 3 + 1], d = s[i * 3 + 2], L = lv.lens[i], W = lv.W, H = lv.H;
    const cs = cellsOf(x, y, d, L);
    let tx = -1, ty = -1;
    for (const [cx, cy] of cs) if (lv.grid[cy * W + cx] === T_TURN) { tx = cx; ty = cy; break; }
    if (tx < 0) return null;
    let mx = 99, my = 99;
    for (const [cx, cy] of cs) {
      const nx = tx - (cy - ty), ny = ty + (cx - tx);
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) return { ok: false, tx, ty };
      const t = lv.grid[ny * W + nx];
      if (t === T_CONE || t === T_PILLAR) return { ok: false, tx, ty, hx: nx, hy: ny };
      const oc = o[ny * W + nx];
      if (oc && oc !== i + 1) return { ok: false, tx, ty, car: oc - 1 };
      mx = Math.min(mx, nx); my = Math.min(my, ny);
    }
    return { ok: true, x: mx, y: my, d: (d + 1) & 3, tx, ty };
  }

  // Cars only ever drive forward (the way their arrow points); there is no reversing anywhere.
  // Remove every car that can drive straight out forward, in waves, until none can. Returns number of waves.
  function closure(lv, s, exits) {
    const nc = lv.lens.length; let waves = 0;
    for (;;) {
      const o = buildOcc(lv, s), left = nc - aliveCount(s), rm = [];
      for (let i = 0; i < nc; i++) {
        if (s[i * 3] < 0) continue;
        const d = s[i * 3 + 2];
        if (slide(lv, s, o, i, d, left).exit) rm.push([i, d]);
      }
      if (!rm.length) return waves;
      waves++;
      for (const [i, m] of rm) { s[i * 3] = -1; if (exits) exits.push({ i, m }); }
    }
  }
  const keyOf = s => String.fromCharCode.apply(null, s);

  // Dijkstra over states; exits are applied greedily (closure), branching only on partial forward slides and rotations.
  // Returns { taps, moves:[{i,m}|{i,rot:1}], waves, partial, nodes } or null (unsolvable / over cap).
  function solve(lv, s0, cap) {
    cap = cap || 40000;
    const nc = lv.lens.length;
    const st0 = Int8Array.from(s0), ex0 = [];
    const w0 = closure(lv, st0, ex0);
    const S = [st0], G = [ex0.length], P = [-1], M = [ex0], WV = [w0], PA = [0], done = [false];
    const idx = new Map([[keyOf(st0), 0]]);
    const heap = [[ex0.length, 0]];
    const push = (it) => { heap.push(it); let c = heap.length - 1; while (c > 0) { const p = (c - 1) >> 1; if (heap[p][0] <= heap[c][0]) break; [heap[p], heap[c]] = [heap[c], heap[p]]; c = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let c = 0; for (;;) { const l = c * 2 + 1, r = l + 1; let m = c; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === c) break; [heap[m], heap[c]] = [heap[c], heap[m]]; c = m; } } return top; };
    while (heap.length) {
      const [g, id] = pop();
      if (done[id] || g > G[id]) continue;
      done[id] = true;
      const s = S[id];
      if (aliveCount(s) === 0) {
        const moves = []; let n = id;
        while (n >= 0) { moves.unshift(...M[n]); n = P[n]; }
        return { taps: g, moves, waves: WV[id], partial: PA[id], nodes: S.length };
      }
      const o = buildOcc(lv, s), left = nc - aliveCount(s);
      const relax = (ns, first) => {
        const ex = []; const w = closure(lv, ns, ex);
        const ng = g + 1 + ex.length, k = keyOf(ns);
        let j = idx.get(k);
        if (j === undefined) {
          j = S.length; idx.set(k, j);
          S.push(ns); G.push(ng); P.push(id); M.push([first, ...ex]); WV.push(WV[id] + w); PA.push(PA[id] + 1); done.push(false);
          push([ng, j]);
        } else if (!done[j] && ng < G[j]) {
          G[j] = ng; P[j] = id; M[j] = [first, ...ex]; WV[j] = WV[id] + w; PA[j] = PA[id] + 1; push([ng, j]);
        }
      };
      for (let i = 0; i < nc; i++) {
        if (s[i * 3] < 0) continue;
        const d = s[i * 3 + 2];
        const r = slide(lv, s, o, i, d, left);   // forward only
        if (r.k > 0 && !r.exit) {
          const ns = Int8Array.from(s); ns[i * 3] += DX[d] * r.k; ns[i * 3 + 1] += DY[d] * r.k;
          relax(ns, { i, m: d });
        }
        const rt = rotTarget(lv, s, o, i);
        if (rt && rt.ok) {
          const ns = Int8Array.from(s); ns[i * 3] = rt.x; ns[i * 3 + 1] = rt.y; ns[i * 3 + 2] = rt.d;
          relax(ns, { i, rot: 1 });
        }
      }
      if (S.length > cap) return null;
    }
    return null;
  }

  // ---------- Levels ----------

const matCache = {};

stripeMat.map.wrapS = THREE.RepeatWrapping;
const glassMat = lam('#2b3a4a'), tireMat = lam('#22252b'), hubMat = lam('#c9ced6'), headMat = bas('#fff7cf'), tailMat = bas('#ff4040');
const arrowMat = new THREE.MeshBasicMaterial({ color: '#ffffff', side: THREE.DoubleSide });
const arrowEdgeMat = new THREE.MeshBasicMaterial({ color: '#1d2a35', side: THREE.DoubleSide });
const COLORS = ['#ff5a5f', '#ffb238', '#3fb7f2', '#68d16b', '#a97cf8', '#ff7ec0', '#ffe14d', '#4f74ff', '#1fc8a9', '#f4f1ea', '#ff8a3d', '#8fd4ff'];

function mesh(geo, mat, sx, sy, sz, x, y, z, parent) {

}
// car model faces -Z (screen up) and is centered on its footprint
function buildCar(len, ci) {
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const L = len - 0.16, Wd = 0.74, col = lam(COLORS[ci % COLORS.length]);
  mesh(G.plane, shadowMat, Wd + 0.3, 1, L + 0.3, 0, 0.012, 0, g);
  mesh(G.box, col, Wd, 0.28, L, 0, 0.27, 0, inner);
  if (len === 2) {
    mesh(G.box, glassMat, Wd - 0.1, 0.22, L * 0.48, 0, 0.5, 0.06, inner);
    mesh(G.box, col, Wd - 0.08, 0.06, L * 0.44, 0, 0.63, 0.07, inner);
  } else {
    mesh(G.box, glassMat, Wd - 0.08, 0.26, 0.5, 0, 0.52, -L / 2 + 0.42, inner);
    mesh(G.box, col, Wd - 0.06, 0.06, 0.46, 0, 0.67, -L / 2 + 0.42, inner);
    mesh(G.box, lam(CARGO[ci % CARGO.length]), Wd + 0.02, 0.56, L - 0.84, 0, 0.62, 0.38, inner);
    mesh(G.box, col, Wd + 0.04, 0.06, L - 0.84, 0, 0.62, 0.38, inner);
  }
  // painted arrow on the roof shows the only way the car can drive (forward); dark rim keeps it readable on light cars
  const top = len === 2 ? 0.665 : 0.905, az = len === 2 ? 0.02 : 0.38, al = len === 2 ? 0.58 : 0.78;
  mesh(G.arrow, arrowEdgeMat, 0.62, 1, al + 0.16, 0, top + 0.004, az - 0.02, inner);
  mesh(G.arrow, arrowMat, 0.5, 1, al, 0, top + 0.012, az, inner);
  const wz = L / 2 - 0.22, wheels = len === 3 ? [-wz, 0.25, wz] : [-wz, wz];
  for (const z of wheels) for (const sx of [-1, 1]) {
    mesh(G.wheel, tireMat, 0.1, 0.26, 0.26, sx * (Wd / 2 - 0.02), 0.13, z, inner);
    mesh(G.wheel, hubMat, 0.11, 0.1, 0.1, sx * (Wd / 2 - 0.02), 0.13, z, inner);

  for (const sx of [-1, 1]) {

    mesh(G.box, tailMat, 0.16, 0.07, 0.04, sx * 0.22, 0.31, L / 2 + 0.01, inner);

function buildTurntable() {

// ---------- Level state ----------
let vs = null; // { snap, salt, idx, score, tips } while an online match owns the lot
let lv = null, st = null, nc = 0, moves = 0, undoStack = [], undosLeft = UNDO_MAX, hintsLeft = HINT_MAX, won = false;
let world = null; // per-level scene objects
let cars = [];   // visuals per car index
let anims = [];

const RC = 0.82, ROAD_OUT = 1.55, CAT_P = 6.2, CAT_C = 2.6;
const now = () => performance.now() / 1000;

function carCenter(x, y, d, L) { const h = d & 1; return [x + (h ? L / 2 : 0.5) - lv.W / 2, y + (h ? 0.5 : L / 2) - lv.H / 2]; }
const headingOf = d => -d * Math.PI / 2;

function tween(dur, fn, done) {

function paintGround() {
  const W = lv.W, H = lv.H, PX = 6, PZT = 11, PZB = 7, S = Math.min(44, Math.floor(2048 / (H + PZT + PZB)));
  const minX = -W / 2 - PX, minZ = -H / 2 - PZT, ww = W + PX * 2, hh = H + PZT + PZB;
  const tex = canvasTex(Math.round(ww * S), Math.round(hh * S), (g) => {
    const X = x => (x - minX) * S, Z = z => (z - minZ) * S;
    const rect = (x0, z0, x1, z1, col) => { g.fillStyle = col; g.fillRect(X(x0), Z(z0), (x1 - x0) * S, (z1 - z0) * S); };
    rect(minX, minZ, minX + ww, minZ + hh, '#7fbf63');
    const rr = Core.rng32(lv.n * 31 + 7);
    for (let i = 0; i < 70; i++) { g.fillStyle = rr() < 0.5 ? 'rgba(60,120,50,.18)' : 'rgba(170,220,120,.18)'; g.beginPath(); g.arc(rr() * ww * S, rr() * hh * S, (0.3 + rr() * 0.9) * S, 0, 7); g.fill(); }

    rect(-1.05, minZ, 1.05, -ez, '#d8d3c4');
    rect(-ex - ROAD_OUT, -ez - ROAD_OUT, ex + ROAD_OUT, ez + ROAD_OUT, '#474c57');
    rect(-0.75, minZ, 0.75, -ez, '#474c57');
    rect(-ex - 0.14, -ez - 0.14, ex + 0.14, ez + 0.14, '#ece8dc');
    rect(-ex, -ez, ex, ez, '#5c6371');
    // asphalt speckle
    for (let i = 0; i < W * H * 6; i++) { g.fillStyle = rr() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.07)'; g.fillRect(X(-ex + rr() * W), Z(-ez + rr() * H), 2, 2); }

    g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(1.5, S * 0.04);
    g.beginPath();

    for (let z = 1; z < H; z++) { g.moveTo(X(-ex), Z(-ez + z)); g.lineTo(X(ex), Z(-ez + z)); }
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = S * 0.07; g.strokeRect(X(-ex) + S * 0.04, Z(-ez) + S * 0.04, W * S - S * 0.08, H * S - S * 0.08);

    g.beginPath(); g.moveTo(X(0), Z(-ez - RC)); g.lineTo(X(0), Z(minZ)); g.stroke(); g.setLineDash([]);

    g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `900 ${Math.round(S * 0.52)}px "M PLUS Rounded 1c", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';

function disposeWorld() {
  if (!world) return;
  scene.remove(world.root);
  world.ground.geometry.dispose(); world.ground.material.map.dispose(); world.ground.material.dispose();
  if (world.sign) { world.sign.material.map.dispose(); world.sign.material.dispose(); }
  cars.forEach(c => c.hit.material.dispose());
  world = null; cars = []; anims = []; hintMark = null;
}

function signTexture(text, color) {
  return canvasTex(256, 96, (g) => {
    g.fillStyle = color; g.strokeStyle = '#1d2a35'; g.lineWidth = 8;
    g.beginPath(); g.moveTo(20, 6); g.arcTo(250, 6, 250, 90, 18); g.arcTo(250, 90, 6, 90, 18); g.arcTo(6, 90, 6, 6, 18); g.arcTo(6, 6, 250, 6, 18); g.closePath(); g.fill(); g.stroke();

}

function buildWorld() {
  disposeWorld();
  const root = new THREE.Group(); scene.add(root);
  world = { root, ground: paintGround(), blocks: {}, turns: {}, arms: [], sign: null, cat: null, gateOpen: false };
  root.add(world.ground);
  const W = lv.W, H = lv.H;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = lv.grid[y * W + x]; if (!t) continue;
    const [wx, wz] = carCenter(x, y, 0, 1);
    const o = t === Core.T_TURN ? buildTurntable() : buildCone(t === Core.T_PILLAR);
    o.position.set(wx, 0, wz); root.add(o);
    (t === Core.T_TURN ? world.turns : world.blocks)[y * W + x] = o;
  }
  // trees around the lot
  const rr = Core.rng32(lv.n * 97 + 3), trunk = lam('#8a5a36'), leaf = [lam('#3f9a4a'), lam('#56b45a'), lam('#2f8a50')];
  for (let i = 0; i < 16; i++) {
    const side = i % 4, along = rr() * 2 - 1, off = ROAD_OUT + 0.9 + rr() * 2.2;
    let x = side & 1 ? (side === 1 ? W / 2 + off : -W / 2 - off) : along * (W / 2 + 2);
    let z = side & 1 ? along * (H / 2 + 2) : (side === 2 ? H / 2 + off : -H / 2 - off);
    if (side === 0 && Math.abs(x) < 1.6) x += 2.4 * Math.sign(x || 1);
    const t = new THREE.Group(), s = 0.7 + rr() * 0.5;
    mesh(G.plane, shadowMat, 1.1, 1, 1.1, 0, 0.012, 0, t);
    mesh(G.cyl, trunk, 0.16, 0.5, 0.16, 0, 0.25, 0, t);
    mesh(G.cone, leaf[i % 3], 0.9, 1.0, 0.9, 0, 0.9, 0, t);
    mesh(G.cone, leaf[(i + 1) % 3], 0.7, 0.8, 0.7, 0, 1.35, 0, t);

      else { yaw.position.set(-W / 2 - off, 0, a); yaw.rotation.y = -Math.PI / 2; }
      mesh(G.box, lam('#e53935'), 0.16, 0.5, 0.16, 0.08, 0.25, 0, yaw);
      lift.position.set(0.08, 0.42, 0); yaw.add(lift);
      const arm = mesh(G.box, stripeMat, seg - 0.2, 0.09, 0.09, (seg - 0.2) / 2, 0, 0, lift);
      yaw.userData.x = yaw.position.x; root.add(yaw); world.arms.push(lift);
    }
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: signTexture('', '#ffcf3f'), depthTest: false }));
    sp.scale.set(1.7, 0.64, 1); sp.renderOrder = 5;
    if (s === 2) sp.position.set(0, 1.1, H / 2 + 0.9); else sp.position.set((s === 1 ? 1 : -1) * (W / 2 + 0.9), 1.1, 0);
    root.add(sp); world.sign = sp;
  }

    const c = buildCat(); root.add(c.group); world.cat = c;
  }
  // cars
  cars = lv.cars.map((c, i) => {
    const v = buildCar(c.len, i * 5 + lv.n);
    v.hit.userData.car = i; root.add(v.group);

}

function placeCar(i) {
  const v = cars[i], x = st[i * 3];
  if (v.motion) { v.motion.dead = true; v.motion = null; }
  v.inner.position.set(0, 0, 0); v.inner.scale.set(1, 1, 1); v.group.scale.set(1, 1, 1);
  if (x < 0) { v.group.visible = false; return; }
  const [wx, wz] = carCenter(x, st[i * 3 + 1], st[i * 3 + 2], v.len);
  v.group.visible = true; v.group.position.set(wx, 0, wz); v.group.rotation.y = headingOf(st[i * 3 + 2]);
}
function syncAll() { for (let i = 0; i < nc; i++) placeCar(i); if (world) Object.values(world.blocks).forEach(b => b.rotation.z = 0); updateGate(true); dirty = true; }

function updateGate(instant) {
  if (!lv.barrier || !world) return;
  const remain = lv.barrier.need - leftCount(), open = remain <= 0;
  const sp = world.sign;
  sp.material.map.dispose();
  sp.material.map = signTexture(open ? 'OPEN!' : T('あと{n}台', { n: remain }), open ? '#7ee081' : '#ffcf3f');
  sp.material.needsUpdate = true;
  const to = open ? 1.35 : 0;
  if (instant) { world.gateOpen = open; world.arms.forEach(a => { a.rotation.z = to; a.parent.position.x = a.parent.userData.x; }); }
  else if (open !== world.gateOpen) {
    world.gateOpen = open;
    if (open) sfx.gate();
    const from = world.arms.length ? world.arms[0].rotation.z : 0;
    tween(0.6, p => { const e = 1 - Math.pow(1 - p, 3); world.arms.forEach(a => a.rotation.z = from + (to - from) * e); });
  }
  sp.material.opacity = 1;
  dirty = true;
}

// ---------- Cat ----------
function catPhase(t) { return ((t - catT0) % CAT_P + CAT_P) % CAT_P; }
function catActive(t) { if (catForce !== null) return catForce; return catPhase(t) < CAT_C; }
function catBlocks(m, i) {
  const c = lv.cat; if (!c || c.side !== m) return false;
  const coord = m & 1 ? st[i * 3 + 1] : st[i * 3];
  if (coord < c.pos || coord >= c.pos + c.len) return false;
  const t = now(); return catActive(t) || catActive(t + 0.25);
}
let catJump = 0;
function updateCat(t) {
  const c = lv.cat, cat = world.cat; if (!c) return;
  const a = c.pos + c.len / 2 - (c.side & 1 ? lv.H : lv.W) / 2;
  let off, walking, dir;
  if (catForce !== null) { off = catForce ? 0.8 : ROAD_OUT + 0.25; walking = !!catForce; dir = 1; }
  else {
    const ph = catPhase(t);
    if (ph < CAT_C) { const q = ph / CAT_C; walking = true; dir = q < 0.5 ? -1 : 1; off = ROAD_OUT + 0.25 - (ROAD_OUT + 0.05) * (q < 0.5 ? q * 2 : 2 - q * 2); }
    else { off = ROAD_OUT + 0.25; walking = false; dir = 1; }
  }
  // dir -1: walking toward the lot, +1: walking away
  const nx = c.side === 1 ? 1 : c.side === 3 ? -1 : 0, nz = c.side === 2 ? 1 : c.side === 0 ? -1 : 0;
  const ex = lv.W / 2, ez = lv.H / 2;
  const px = nx ? nx * (ex + off) : a, pz = nz ? nz * (ez + off) : a;
  cat.group.position.set(px, 0, pz);
  const vx = nx * dir, vz = nz * dir;
  cat.group.rotation.y = walking ? Math.atan2(-vx, -vz) : Math.atan2(nx, nz);
  const jump = Math.max(0, catJump - t);
  cat.body.position.y = (walking ? Math.abs(Math.sin(t * 14)) * 0.03 : 0) + Math.sin(jump / 0.5 * Math.PI) * 0.25 * (jump > 0 ? 1 : 0);
}

// ---------- Moves ----------
function busy(i) { return !!cars[i].motion; }
function pushUndo() { undoStack.push({ st: Int8Array.from(st), moves }); if (undoStack.length > 60) undoStack.shift(); }
function shake(obj, amp, dur) {
  const base = obj.position.x;
  tween(dur || 0.35, p => { obj.position.x = base + Math.sin(p * Math.PI * 7) * (amp || 0.06) * (1 - p); }, () => { obj.position.x = base; });
}
function hitFx(i, r) {
  buzz(30);
  if (r.hit === 'car') { sfx.honk(); shake(cars[r.car].inner, 0.07); }

function rotateCar(i) {

}

// ---------- Camera ----------
const _v = new THREE.Vector3();
function fitCamera() {
  const w = Math.max(1, play.clientWidth), h = Math.max(1, play.clientHeight);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  if (!lv) return;
  const tilt = (h / w > 1.25 ? 58 : 50) * Math.PI / 180, cs = Math.cos(tilt), sn = Math.sin(tilt);
  const ex = lv.W / 2 + ROAD_OUT + 0.1, ez = lv.H / 2 + ROAD_OUT + 0.1;
  const pts = [];
  for (const x of [-ex, ex]) for (const z of [-ez, ez]) for (const y of [0, 0.7]) pts.push([x, y, z]);
  let tz = 0, D = 20;
  const bounds = () => {
    camera.position.set(0, D * sn, tz + D * cs); camera.lookAt(0, 0, tz); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let mx = 0, y0 = 9, y1 = -9;
    for (const p of pts) { _v.set(p[0], p[1], p[2]).project(camera); mx = Math.max(mx, Math.abs(_v.x)); y0 = Math.min(y0, _v.y); y1 = Math.max(y1, _v.y); }
    return { mx, y0, y1 };
  };
  for (let it = 0; it < 4; it++) {
    let lo = 4, hi = 90;
    for (let k = 0; k < 26; k++) { D = (lo + hi) / 2; const b = bounds(); if (b.mx <= 0.97 && b.y0 >= -0.96 && b.y1 <= 0.96) hi = D; else lo = D; }
    D = hi; const b = bounds();

}
let resizeT = 0;

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {
  const r = cv.getBoundingClientRect();
  ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);

}

let down = null;
cv.addEventListener('pointerdown', e => {

  down = { id: e.pointerId, x: e.clientX, y: e.clientY, car: pick(e.clientX, e.clientY) };

});
cv.addEventListener('pointerup', e => {
  if (!down || down.id !== e.pointerId) return;

  let i = d0.car;
  const dx = e.clientX - d0.x, dy = e.clientY - d0.y, dist = Math.hypot(dx, dy);
  if (dist < 14) {
    if (i < 0) i = pick(e.clientX, e.clientY);

  const d = st[i * 3 + 2], [wx, wz] = carCenter(st[i * 3], st[i * 3 + 1], d, cars[i].len);
  const a = toScreen(wx, 0.3, wz), b = toScreen(wx + DX[d] * 0.5, 0.3, wz + DY[d] * 0.5);

    const list = anims.slice();

// Score: 100 per cleared lot + 50 at par, 10 less per extra move. No hints; undo (3 per lot) and restart are allowed.

  catT0 = now() + 1.5; catForce = null; hintMark = null; hintFor = -1;
