<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>共通部品のデモ</title>
<meta name="theme-color" content="#1d2a35">
<link rel="stylesheet" href="../../common/theme.css">
<link rel="stylesheet" href="../../common/ui.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<script src="../../common/i18n.js"></script>
<script src="../../common/audio.js"></script>
<script src="../../common/ui.js"></script>
<script>
KoboI18n.add({ en: {
  '共通部品のデモ': 'Shared UI demo', '部品のデモ': 'UI demo',
  'ボタン': 'Buttons', '主な操作': 'Primary', 'ひかえめ': 'Ghost', '消す': 'Delete', '使えない': 'Disabled', '大きいボタン': 'Large button',
  'アイコンのボタン': 'Icon buttons', 'カード': 'Cards', 'ふつうのカード': 'Plain card', 'カードの中の説明の文です。長くても折り返します。': 'This is the card text. Long text wraps.',
  'リンクのカード': 'Link card', '押すと移動します': 'Tap to open', '目立たせるカード': 'Accent card', '今日のチャレンジなどに使います': 'For things like today\'s challenge',
  'バッジ': 'Badges', '新着': 'New', 'クリア': 'Cleared', '失敗': 'Failed', 'ふつう': 'Plain', '未読あり': 'Unread',
  '一覧の行': 'List rows', 'ブロックはめ': 'Block Fit', 'ベスト 12,340 点': 'Best: 12,340 pts', 'いろみず分け': 'Color Water Sort', 'ステージ 48 まで到達': 'Reached stage 48',
  'ランキング': 'Rankings', '入力の部品': 'Inputs', '難しさ': 'Difficulty', 'かんたん': 'Easy', 'ふつう ': 'Normal', 'むずかしい': 'Hard',
  '振動': 'Vibration', '音量（例）': 'Volume (sample)', 'タブ': 'Tabs', '通算': 'All time', '週間': 'Weekly', '日間': 'Daily',
  '通算の中身です。': 'All-time content.', '週間の中身です。': 'Weekly content.', '日間の中身です。': 'Daily content.',
  '重ねる画面': 'Overlays', '下からのシート': 'Bottom sheet', 'ダイアログ': 'Modal', '確認': 'Confirm', 'トースト': 'Toast', '一時停止のメニュー': 'Pause menu', '設定のシート': 'Settings sheet',
  '長い中身のシート': 'A sheet with long content', '{n} 行目：中身が長いときは、この部分だけがスクロールし、下のボタンは固定されます。': 'Line {n}: when the content is long, only this part scrolls and the button below stays fixed.',
  'わかった': 'Got it', 'お知らせ': 'Notice', '画面の中に収まり、Esc か「とじる」で閉じます。': 'It fits on screen and closes with Esc or Close.',
  'データを消しますか？': 'Delete this data?', 'この操作は取り消せません。': 'This cannot be undone.',
  'はい を選びました': 'You chose Yes', 'いいえ を選びました': 'You chose No',
  'ベスト更新！': 'New best!', 'つづけます': 'Resumed', 'はじめからにしました': 'Restarted',
  '設定のまとまり': 'Settings panel', '効果音のパレット': 'Sound effect palette', '押すと鳴ります（ミュートなら鳴りません）': 'Tap to play (silent when muted)',
  'テーマを並べて比べる': 'Themes side by side', 'このページの部品は、テーマと言語を切り替えて確かめます。': 'Switch the theme and language to check every component.',
  '遊び方': 'How to play', '音': 'Sound',
} });
</script>
<style>
html { background: var(--kb-bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body); overflow-x: hidden; }
main { max-width: 560px; margin: 0 auto; padding: var(--kb-s-4) max(var(--kb-gutter), var(--kb-sar)) calc(var(--kb-s-8) + var(--kb-sab)) max(var(--kb-gutter), var(--kb-sal)); display: flex; flex-direction: column; gap: var(--kb-s-5); }
section { display: flex; flex-direction: column; gap: var(--kb-s-3); min-width: 0; }
section > h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--kb-s-3); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kb-s-2); }
.compare > div { background: var(--kb-bg); color: var(--kb-ink); border: 1px solid var(--kb-line); border-radius: var(--kb-r-lg); padding: var(--kb-s-3); display: flex; flex-direction: column; gap: var(--kb-s-2); min-width: 0; }
.compare .kb-btn { width: 100%; padding: 0 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--kb-line); display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<main class="kb-ui" id="main">
  <p class="kb-dim" style="margin:0;font-size:var(--kb-fs-sm)" data-i18n>このページの部品は、テーマと言語を切り替えて確かめます。</p>
</main>
<script>
(() => {
  const U = KoboUI, T = U.t, A = window.KoboAudio, el = U.el;
  const main = document.getElementById('main');
  const sec = (title, ...kids) => { const s = el('section', null, [el('h2', { class: 'kb-h2', text: title })]); kids.forEach(k => s.append(k)); main.append(s); return s; };

  // header bar
  const sndBtn = U.iconButton({ icon: A && A.muted ? 'mute' : 'sound', label: T('音'), pressed: A ? !A.muted : false, onClick: () => A && A.toggleMute() });
  const drawSnd = () => { if (!A) return; sndBtn.replaceChildren(U.icon(A.muted ? 'mute' : 'sound')); sndBtn.setAttribute('aria-pressed', String(!A.muted)); sndBtn.setAttribute('aria-label', T(A.muted ? '音を出す' : '音を消す')); };
  drawSnd(); if (A) A.onChange(drawSnd);
  document.getElementById('bar').replaceWith(U.header({ title: T('部品のデモ'), back: '../../', sticky: true, actions: [
    U.iconButton({ icon: 'help', label: T('遊び方'), onClick: () => U.modal({ title: T('遊び方'), body: T('画面の中に収まり、Esc か「とじる」で閉じます。'), actions: [{ label: T('わかった'), variant: 'primary' }] }).open() }),
    sndBtn,
    U.iconButton({ icon: 'settings', label: T('設定'), onClick: () => U.openSettings(), className: 'demo-open-settings' }),
  ] }));

  // theme + language quick switch (the same parts the settings panel uses)
  const quick = U.settingsPanel({ audio: false });
  quick.classList.add('kb-card'); quick.id = 'quick';
  main.append(quick);

  sec(T('ボタン'),
    el('div', { class: 'kb-row' }, [U.button({ label: T('主な操作'), variant: 'primary' }), U.button({ label: T('ひかえめ'), variant: 'ghost' }), U.button({ label: T('消す'), variant: 'danger' }), U.button({ label: T('使えない'), attrs: { disabled: true } })]),
    el('div', { class: 'kb-row' }, [U.iconButton({ icon: 'pause', label: T('一時停止') }), U.iconButton({ icon: 'restart', label: T('はじめから') }), U.iconButton({ icon: 'home', label: T('ホーム') }), U.iconButton({ icon: 'trophy', label: T('ランキング'), pressed: true }), U.iconButton({ icon: 'settings', label: T('設定'), showLabel: true })]),
    U.button({ label: T('大きいボタン'), icon: 'play', variant: 'primary', block: true, lg: true }));

  sec(T('カード'), el('div', { class: 'grid2' }, [
    U.card({ title: T('ふつうのカード'), text: T('カードの中の説明の文です。長くても折り返します。') }),
    U.card({ title: T('リンクのカード'), text: T('押すと移動します'), href: '#' }),
    U.card({ title: T('目立たせるカード'), text: T('今日のチャレンジなどに使います'), accent: true }),
  ]));

  sec(T('バッジ'), el('div', { class: 'kb-row' }, [U.badge(T('ふつう')), U.badge(T('新着'), 'accent'), U.badge(T('クリア'), 'ok'), U.badge(T('失敗'), 'danger'), U.badge(T('未読あり'), 'dot')]));

  sec(T('一覧の行'), U.list([
    { title: T('ブロックはめ'), sub: T('ベスト 12,340 点'), lead: { icon: 'star' }, href: '#', end: U.badge(T('新着'), 'accent') },
    { title: T('いろみず分け'), sub: T('ステージ 48 まで到達'), lead: '2', onClick: () => U.toast(T('いろみず分け')) },
    { title: T('ランキング'), lead: { icon: 'trophy' }, end: '#12' },
  ]));

  const vib = U.toggle({ checked: true, label: T('振動') });
  const diff = U.segmented({ label: T('難しさ'), value: 'n', options: [{ value: 'e', label: T('かんたん') }, { value: 'n', label: T('ふつう ').trim() }, { value: 'h', label: T('むずかしい') }], block: true });
  const vol = U.slider({ label: T('音量（例）'), value: 0.6 });
  const inp = el('div', { class: 'kb-set kb-card' });
  [[T('難しさ'), diff, true], [T('振動'), vib, false], [T('音量（例）'), vol, true]].forEach(([k, c, st]) => inp.append(el('div', { class: 'kb-set__row' + (st ? ' kb-set__row--stack' : '') }, [el('div', { class: 'kb-set__k', text: k }), el('div', { class: 'kb-set__v' }, [c])])));
  sec(T('入力の部品'), inp);

  sec(T('タブ'), U.tabs({ label: T('ランキング'), tabs: [
    { id: 'all', label: T('通算'), panel: el('p', { style: 'margin:0', text: T('通算の中身です。') }) },
    { id: 'w', label: T('週間'), panel: el('p', { style: 'margin:0', text: T('週間の中身です。') }) },
    { id: 'd', label: T('日間'), panel: el('p', { style: 'margin:0', text: T('日間の中身です。') }) },
  ] }));

  const long = el('div'); for (let i = 1; i <= 24; i++) long.append(el('p', { style: 'margin:0 0 8px', text: T('{n} 行目：中身が長いときは、この部分だけがスクロールし、下のボタンは固定されます。', { n: i }) }));
  const pm = U.pauseMenu({ onResume: () => U.toast(T('つづけます')), onRestart: () => U.toast(T('はじめからにしました')), home: '../../' });
  sec(T('重ねる画面'), el('div', { class: 'kb-row' }, [
    U.button({ label: T('下からのシート'), variant: 'ghost', attrs: { id: 'openSheet' }, onClick: () => U.sheet({ title: T('長い中身のシート'), body: long.cloneNode(true), actions: [{ label: T('とじる'), variant: 'ghost' }, { label: T('わかった'), variant: 'primary' }] }).open() }),
    U.button({ label: T('ダイアログ'), variant: 'ghost', attrs: { id: 'openModal' }, onClick: () => U.modal({ title: T('お知らせ'), body: T('画面の中に収まり、Esc か「とじる」で閉じます。'), actions: [{ label: T('わかった'), variant: 'primary' }] }).open() }),
    U.button({ label: T('確認'), variant: 'ghost', attrs: { id: 'openConfirm' }, onClick: async () => U.toast(T((await U.confirm({ title: T('データを消しますか？'), message: T('この操作は取り消せません。'), danger: true })) ? 'はい を選びました' : 'いいえ を選びました')) }),
    U.button({ label: T('トースト'), variant: 'ghost', attrs: { id: 'openToast' }, onClick: () => U.toast(T('ベスト更新！'), { type: 'accent' }) }),
    U.button({ label: T('一時停止のメニュー'), variant: 'ghost', attrs: { id: 'openPause' }, onClick: () => pm.open() }),
    U.button({ label: T('設定のシート'), variant: 'ghost', attrs: { id: 'openSettings' }, onClick: () => U.openSettings() }),
  ]));

  const full = U.settingsPanel({ language: false, theme: false }); full.classList.add('kb-card');
  sec(T('設定のまとまり'), full);

  if (A) {
    const row = el('div', { class: 'kb-row' });
    A.palette.forEach(n => row.append(U.button({ label: n, variant: 'ghost', attrs: { lang: 'en', 'data-sfx': n }, onClick: () => (n === 'combo' ? A.sfx(n, 4) : A.sfx(n)) })));
    sec(T('効果音のパレット'), el('p', { class: 'kb-dim', style: 'margin:0;font-size:var(--kb-fs-sm)', text: T('押すと鳴ります（ミュートなら鳴りません）') }), row);
  }

  // both themes side by side, whatever the page theme is
  const tokens = ['--kb-bg', '--kb-surface', '--kb-surface-2', '--kb-line', '--kb-ink', '--kb-dim', '--kb-accent', '--kb-ok', '--kb-danger'];
  const side = th => {
    const d = el('div', { 'data-kb-theme': th, class: 'kb-ui' });
    d.append(el('span', { class: 'kb-label', text: T(th === 'dark' ? 'ダーク' : 'ライト') }));
    const sw = el('div', { class: 'swatches' }); tokens.forEach(t => sw.append(el('i', { style: 'background:var(' + t + ')', title: t }))); d.append(sw);
    d.append(U.button({ label: T('主な操作'), variant: 'primary' }), U.button({ label: T('ひかえめ'), variant: 'ghost' }), el('div', { class: 'kb-row' }, [U.badge(T('新着'), 'accent'), U.toggle({ checked: true, label: T('振動') })]));
    return d;
  };
  sec(T('テーマを並べて比べる'), el('div', { class: 'compare' }, [side('dark'), side('light')]));
  document.title = T('共通部品のデモ');
})();
</script>
</body>
</html>
