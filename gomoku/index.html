<style>
/* 五目ならべ工房: a wooden board on a workshop bench, lines etched in dark brown. The stones keep their own colours in both themes (a brass nut on the dark ones, a screw head on the light ones);
   the bench and the room follow the light / dark theme. --kb-* are the shared tokens re-tinted; --gk-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #17130e; --kb-surface: #251e15; --kb-surface-2: #2d251a; --kb-sunken: #100d09; --kb-line: #4a3c28;
  --kb-ink: #f6f1e6; --kb-dim: #c3b8a2;
  --kb-accent: #f0c04f; --kb-accent-ink: #2b1f00; --kb-accent-text: #ffd57a; --kb-accent-soft: rgba(240, 192, 79, .16);
  --kb-scrim: rgba(8, 6, 3, .8); --kb-toast-bg: rgba(14, 10, 5, .95); --kb-focus: #ffe08a;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --gk-wood: #c99a55; --gk-wood2: #bd8d49; --gk-ln: #4a3216; --gk-frame: #6b4a2c; --gk-frame2: #4a3119; --gk-rim: rgba(255, 220, 160, .28);
  --gk-panel: rgba(255, 240, 210, .06); --gk-line: rgba(230, 210, 170, .16); --gk-card: linear-gradient(#2c2418, #211a10);
  --gk-go: linear-gradient(#ffd77d, #efa83a); --gk-go-ink: #2b1d00; --gk-go-shadow: #94620f;
  --gk-key: linear-gradient(#3a2f20, #2b2217); --gk-key-shadow: #0a0704;
  --gk-title: linear-gradient(90deg, #ffd98a, #f0a566 55%, #f2f2f2);
  --gk-bad: #ff8d7d; --gk-ok: #6fe3b0;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f4efe3; --kb-surface: #ffffff; --kb-surface-2: #f8f2e5; --kb-sunken: #e8e0cc; --kb-line: #d3c8ae;
    --kb-ink: #2a2418; --kb-dim: #6b6048;
    --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
    --kb-scrim: rgba(42, 36, 24, .45); --kb-toast-bg: rgba(42, 36, 24, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(42, 36, 24, .2);
    --gk-wood: #e0b878; --gk-wood2: #d6ab68; --gk-ln: #5a3d1a; --gk-frame: #a97c50; --gk-frame2: #8a6238; --gk-rim: rgba(255, 255, 255, .5);
    --gk-panel: rgba(42, 36, 24, .05); --gk-line: #dcd2ba; --gk-card: linear-gradient(#ffffff, #f8f2e5);
    --gk-go: linear-gradient(#e0a02f, #b8730a); --gk-go-ink: #ffffff; --gk-go-shadow: #7a4b05;
    --gk-key: linear-gradient(#ffffff, #f3ecdc); --gk-key-shadow: #c3b9a2;
    --gk-title: linear-gradient(90deg, #8a5300, #a24a1c 55%, #3a3a3a);
    --gk-bad: #c43b27; --gk-ok: #0f8a5c;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f4efe3; --kb-surface: #ffffff; --kb-surface-2: #f8f2e5; --kb-sunken: #e8e0cc; --kb-line: #d3c8ae;
  --kb-ink: #2a2418; --kb-dim: #6b6048;
  --kb-accent: #b8730a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5300; --kb-accent-soft: rgba(184, 115, 10, .12);
  --kb-scrim: rgba(42, 36, 24, .45); --kb-toast-bg: rgba(42, 36, 24, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(42, 36, 24, .2);
  --gk-wood: #e0b878; --gk-wood2: #d6ab68; --gk-ln: #5a3d1a; --gk-frame: #a97c50; --gk-frame2: #8a6238; --gk-rim: rgba(255, 255, 255, .5);
  --gk-panel: rgba(42, 36, 24, .05); --gk-line: #dcd2ba; --gk-card: linear-gradient(#ffffff, #f8f2e5);
  --gk-go: linear-gradient(#e0a02f, #b8730a); --gk-go-ink: #ffffff; --gk-go-shadow: #7a4b05;
  --gk-key: linear-gradient(#ffffff, #f3ecdc); --gk-key-shadow: #c3b9a2;
  --gk-title: linear-gradient(90deg, #8a5300, #a24a1c 55%, #3a3a3a);
  --gk-bad: #c43b27; --gk-ok: #0f8a5c;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 62%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--gk-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--gk-line); background: var(--gk-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; font: 800 15px var(--kb-font-body); }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.icon[aria-pressed="true"] { border-color: var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-accent-text); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .opt:focus-visible, .tog:focus-visible, .act:focus-visible, .qm:focus-visible, #board:focus-visible, .cell:focus-visible, summary:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 1px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--gk-panel); border: 1px solid var(--gk-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.turn.you { background: var(--kb-accent-soft); border-color: var(--kb-accent); color: var(--kb-accent-text); }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }

#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 5px; }
#bar { flex: none; display: flex; gap: 8px; justify-content: center; }
.pl { flex: 1 1 0; min-width: 0; max-width: 240px; display: flex; align-items: center; gap: 7px; box-sizing: border-box; padding: 3px 9px 3px 6px; border-radius: 14px; border: 2px solid transparent; background: var(--gk-panel); transition: border-color .2s, background .2s; }
.pl.on { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.pl .dk { flex: none; width: 24px; height: 24px; border-radius: 50%; background-size: 100% 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.pl .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; }
.pl .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.pl .nm small { display: block; font-size: 10.5px; font-weight: 500; color: var(--kb-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .n { flex: none; font: 400 22px/1 var(--kb-font-display); font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; }
.pl .bd { flex: none; padding: 0 6px; border-radius: 9px; background: rgba(150, 140, 120, .3); color: var(--kb-ink); font: 800 10px var(--kb-font-body); }
.pl .bd.off { background: #ff8d7d; color: #2b0b06; } .pl .bd.away { background: #ffd078; color: #2b1d00; } .pl .bd.tm { background: var(--kb-accent); color: var(--kb-accent-ink); font-variant-numeric: tabular-nums; }
#stage { position: relative; flex: 1 1 0; min-height: 120px; display: grid; place-items: center; }
#stage.zoom { display: block; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
#stage.zoom #board { margin: 0 auto; touch-action: pan-x pan-y; }
/* the board: n x n intersections. Each cell draws its own piece of the lines (the edge cells draw half of a line) */
#board { position: relative; width: var(--bs, 300px); height: var(--bs, 300px); flex: none; box-sizing: border-box; display: grid; grid-template-columns: repeat(var(--n, 15), 1fr); grid-template-rows: repeat(var(--n, 15), 1fr);
  padding: clamp(2px, 1%, 7px); border-radius: clamp(8px, 3%, 16px); background: linear-gradient(145deg, var(--gk-frame), var(--gk-frame2)); box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px var(--gk-rim); touch-action: manipulation; outline-offset: 3px; }
#board .row { display: contents; }
.cell { --hp: 0%; --hw: 100%; --vp: 0%; --vh: 100%; position: relative; box-sizing: border-box; cursor: default; display: grid; place-items: center; outline: none; -webkit-tap-highlight-color: transparent;
  background-color: var(--gk-wood);
  background-image: linear-gradient(var(--gk-ln), var(--gk-ln)), linear-gradient(var(--gk-ln), var(--gk-ln));
  background-repeat: no-repeat; background-position: var(--hp) 50%, 50% var(--vp); background-size: var(--hw) 1px, 1px var(--vh); }
.cell.cl { --hp: 100%; --hw: 50%; } .cell.cr { --hp: 0%; --hw: 50%; } .cell.ct { --vp: 100%; --vh: 50%; } .cell.cb { --vp: 0%; --vh: 50%; }
.cell.star::before { content: ""; position: absolute; width: 22%; height: 22%; border-radius: 50%; background: var(--gk-ln); }
.cell.lg { cursor: pointer; }
.gh { position: absolute; inset: 8%; border-radius: 50%; pointer-events: none; opacity: 0; box-sizing: border-box; transition: opacity .12s; }
@media (hover: hover) { .cell.lg:not(.pv):hover .gh { opacity: .5; background: var(--gh, rgba(20, 30, 70, .6)); } }
.cell.pv .gh { opacity: 1; background: var(--gh, rgba(20, 30, 70, .55)); border: 2px dashed var(--kb-accent); }
.cell.ht .gh { opacity: 1; background: rgba(255, 213, 74, .3); box-shadow: 0 0 0 3px #ffd54a, 0 0 14px 3px rgba(255, 213, 74, .85); animation: glow 1s ease-in-out infinite; }
.cell.fb .gh { opacity: 1; background: transparent; inset: 18%; }
.cell.fb .gh::before, .cell.fb .gh::after { content: ""; position: absolute; left: 50%; top: 8%; width: max(2px, 12%); height: 84%; background: #e0412e; border-radius: 2px; transform: translateX(-50%) rotate(45deg); }
.cell.fb .gh::after { transform: translateX(-50%) rotate(-45deg); }
.cell.bad .gh { opacity: 1; background: rgba(255, 141, 125, .45); box-shadow: 0 0 0 3px #ff8d7d; }
.cell.cur { z-index: 2; } body.kbd .cell.cur::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2.5px var(--kb-focus); pointer-events: none; }
.cell.shake { animation: shake .3s; }
.st { position: absolute; inset: 6%; border-radius: 50%; background-size: 100% 100%; box-shadow: 0 1.5px 3px rgba(0, 0, 0, .5); pointer-events: none; z-index: 1; display: grid; place-items: center; }
.st.new { animation: drop .25s ease-out; }
.st .nm { font: 800 calc(var(--bs, 300px) / var(--n, 15) * .42)/1 var(--kb-font-body); font-variant-numeric: tabular-nums; letter-spacing: -.04em; pointer-events: none; }
.st.b .nm { color: #f0c968; } .st.w .nm { color: #27305b; }
.st.sol { box-shadow: 0 0 0 2px #6fe3b0, 0 1.5px 3px rgba(0, 0, 0, .5); }
.cell.last .st { box-shadow: 0 0 0 2px #ff6f5f, 0 1.5px 3px rgba(0, 0, 0, .5); }
.cell.last .st:not(:has(.nm))::after { content: ""; width: 24%; height: 24%; border-radius: 50%; background: #ff6f5f; box-shadow: 0 0 0 1px rgba(255, 255, 255, .85); }
.cell.win .st { box-shadow: 0 0 0 3px #ffd54a, 0 0 12px 3px rgba(255, 213, 74, .9); animation: pulse 1.1s ease-in-out infinite; z-index: 2; }
#board.inst .st { animation: none !important; transition: none !important; }
#status { flex: none; min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 10px; border-radius: 14px; background: var(--gk-panel); border: 1px solid var(--gk-line); font-size: 12.5px; font-weight: 800; text-align: center; line-height: 1.3; }
#status.you { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
#ctl { flex: none; display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; min-height: 48px; }
.act { flex: 1 1 0; min-width: 0; max-width: 150px; min-height: 48px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--gk-line); background: var(--gk-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--gk-key-shadow); font: 800 14px var(--kb-font-body); cursor: pointer; padding: 2px 3px; line-height: 1.15; touch-action: manipulation; }
.act small { display: block; font-size: 10px; font-weight: 500; opacity: .8; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gk-key-shadow); }
.act.go { background: var(--gk-go); color: var(--gk-go-ink); border-color: transparent; box-shadow: 0 3px 0 var(--gk-go-shadow); font-size: 15px; }
.act[aria-pressed="true"] { border-color: var(--kb-accent); box-shadow: inset 0 0 0 2px var(--kb-accent), 0 3px 0 var(--gk-key-shadow); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }

.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.panel { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--gk-card); border: 1px solid var(--gk-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--gk-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 25px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--gk-go); color: var(--gk-go-ink); box-shadow: 0 3px 0 var(--gk-go-shadow); font: 800 16px var(--kb-font-body); text-decoration: none; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gk-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--gk-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--gk-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.opts { text-align: left; }
.og { margin: 8px 0 0; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--gk-panel); border: 1px solid var(--gk-line); }
.opt { flex: 1; min-width: 0; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.2; }
.opt small { display: block; font-size: 10.5px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 6px; padding: 4px 10px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--gk-line); background: var(--gk-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; text-align: left; }
.tog span { flex: 1; } .tog small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--kb-line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); cursor: pointer; text-align: left; }
.qm:first-child { margin-top: 0; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.gdesc { margin: 8px 0 0; font-size: 12.5px; font-weight: 500; color: var(--kb-ink); line-height: 1.5; }
.gbest { margin: 4px 0 0; font-size: 12px; font-weight: 800; color: var(--kb-accent-text); }
.rank { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--gk-panel); border: 1px solid var(--gk-line); font-size: 13.5px; font-weight: 800; text-align: left; }
.rank li.me { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rank li .no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-surface); color: var(--kb-accent-text); font: 400 14px var(--kb-font-display); }
.rank li .no.ok { color: var(--gk-ok); } .rank li .no.ng { color: var(--gk-bad); }

  for (let i = 0; i < 70; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * 60, y: H * 0.4, vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 7, r: Math.random() * 3, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length], s: 5 + Math.random() * 5, t: 0 });

}

        const c0 = E.completions(P, 1);
        const m = c0.length ? c0[0] : E.vcfRoot(P, 1, S.pz.left, { nodes: 0, cap: 1e6, cut: false }, false);
        return { cell: m, sel: sel(m) };
      }
      if (!canAct()) return null;
      const lg = E.legal(S.st); if (!lg.length) return null;
      let c;
      if (good === 'cpu') c = E.cpu(S.st, 2, { time: 0, nodes: 4000 });
      else { const mid = centerCell(S.st.n); c = lg.slice().sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid) || a - b)[0]; }
      return { cell: c, sel: sel(c) };
    },
    cellPoint(i) { const r = B.cells[i].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
    title: showTitle, finish() { if (S && !S.over) { S.st.over = true; finish(); } }, howto: showHowto, openMenu, relayout: fit,
    resume() { const r = readRun(); if (r) resumeGame(r); return !!r; }, persist,
    // set up a position (for tests): rows of '.', 'x' (black), 'o' (white); turn 1|2. In a game against the CPU / two players
    rig(rows, turn) {
      if (!S || !S.st) return null;
      const b = []; for (const row of rows) for (const ch of row) b.push(ch === 'x' ? 1 : ch === 'o' ? 2 : 0);
      S.st.b = b; S.st.turn = turn || S.st.turn; S.st.over = false; S.st.winner = 0; S.st.line = [];
      S.st.moves = []; let k = 0; for (let i = 0; i < b.length; i++) if (b[i]) { S.st.moves.push([i, b[i]]); k++; } void k;
      redraw(false); hud(); markers(); refreshStatus(); loop(); return api.state();
    },
    thumbScene() { // a game in progress with the human to move, for the hub thumbnail
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); hideOverlays();
      const st = E.create({ n: 15, seed: 7 });
      while (st.moves.length < 27 && !st.over) E.play(st, E.cpu(st, st.moves.length % 2 ? 3 : 2, { time: 0, nodes: 3000 }));
      S = mkSession({ mode: 'cpu', st, n: 15, rule: 'free', level: 3, me: st.turn, seed: 7 });
      S.cfg = { mode: 'cpu', level: 3, me: 'b', n: 15, rule: 'free' }; S.cur = centerCell(15);
      const lm = st.moves.slice(-1)[0]; S.last = lm ? lm[0] : -1;
      buildBoard(15); fit(); redraw(false); hud(); markers(); return true;
    },
  };
}
