<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>オフラインです — ひまつぶし工房</title>
<meta name="theme-color" content="#1d2a35" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<!-- Service Worker（sw.js）が、通信できず保存もないページの代わりに出す。%SCOPE% は sw.js がサイトの一番上の URL に置き換える。
     外のファイルは読まない（オフラインなので）。言語は kobo.lang、テーマは kobo.theme（なければ端末の設定）。 -->
<style>
:root { --bg: #1d2a35; --surface: #263744; --ink: #eef2f4; --dim: #a9b8c2; --line: #3a4d5b; --accent: #f2b33d; --accent-ink: #2b1d05; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f1ea; --surface: #ffffff; --ink: #1f2a33; --dim: #5b6670; --line: #d6cfc2; --accent: #c98a14; --accent-ink: #fff; color-scheme: light; } }
:root[data-theme="light"] { --bg: #f4f1ea; --surface: #ffffff; --ink: #1f2a33; --dim: #5b6670; --line: #d6cfc2; --accent: #c98a14; --accent-ink: #fff; color-scheme: light; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; text-align: center; box-sizing: border-box; }
svg { width: 56px; height: 56px; color: var(--accent); }
h1 { margin: 8px 0 6px; font-size: 21px; line-height: 1.3; }
p { margin: 0 0 18px; color: var(--dim); font-size: 14px; overflow-wrap: anywhere; }
.row { display: grid; gap: 10px; }
a, button { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; font: 800 16px/1.2 inherit; font-family: inherit; text-decoration: none; cursor: pointer; box-sizing: border-box; }
button { border: 0; background: var(--accent); color: var(--accent-ink); }
a { border: 1px solid var(--line); color: var(--ink); background: transparent; }
:focus-visible { outline: 3px solid #4da3ff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5.3 12.2a10 10 0 0 1 13.4 0M8.6 15.6a5 5 0 0 1 6.8 0M12 19.5h.01M3 3l18 18"/></svg>
  <h1 id="h">オフラインです</h1>
  <p id="m">このページはまだこの端末に保存されていません。通信できるところで一度開くと、次からは通信なしでも遊べます。</p>
  <div class="row">
    <button type="button" id="retry">もう一度読み込む</button>
    <a id="home" href="%SCOPE%">ゲーム一覧へ（保存したゲームは遊べます）</a>
  </div>
</main>
<script>
(function () {
  var get = function (k) { try { var v = localStorage.getItem(k); return v && v.charAt(0) === '"' ? JSON.parse(v) : v; } catch (e) { return null; } };
  var th = get('kobo.theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  var lang = get('kobo.lang') || ((navigator.language || 'ja').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en');
  if (lang === 'en') {
    document.documentElement.lang = 'en';
    document.title = 'You are offline — Himatsubushi Kobo';
    document.getElementById('h').textContent = 'You are offline';
    document.getElementById('m').textContent = 'This page is not saved on this device yet. Open it once while online and it will work without a connection next time.';
    document.getElementById('retry').textContent = 'Try again';
    document.getElementById('home').textContent = 'All games (saved games still work)';
  }
  var home = document.getElementById('home');
  if (home.getAttribute('href').indexOf('%SCOPE') >= 0) home.setAttribute('href', './'); // opened directly (not through sw.js)
  document.getElementById('retry').onclick = function () { location.reload(); };
  addEventListener('online', function () { location.reload(); });
})();
</script>
</body>
</html>
