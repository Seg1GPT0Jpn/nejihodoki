<style>
/* でんしゃでいこう: a dark cab-blue chrome around a full-bleed canvas. --kb-* are the shared tokens re-tinted; --tr-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #0f1a22; --kb-surface: #172732; --kb-surface-2: #1f3341; --kb-sunken: #0b131a; --kb-line: #35505f;
  --kb-ink: #eef6fb; --kb-dim: #a9c0cf;
  --kb-accent: #ffc83d; --kb-accent-ink: #2a1c00; --kb-accent-text: #ffd36a; --kb-accent-soft: rgba(255, 200, 61, .16);
  --kb-scrim: rgba(6, 12, 17, .72); --kb-focus: #9fe3ff;
  --tr-panel: rgba(255, 255, 255, .07); --tr-line: rgba(255, 255, 255, .18); --tr-card: linear-gradient(#1c3140, #14232e);
  --tr-go: linear-gradient(#ffd45e, #f0a21f); --tr-go-shadow: #8a5a05; --tr-good: #7be0a0; --tr-bad: #ff8f80; --tr-star: #ffc83d;
  --tr-title: linear-gradient(90deg, #ffe08a, #ffc83d 45%, #6fd6ff);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #eef3f0; --kb-surface: #ffffff; --kb-surface-2: #e4ede9; --kb-sunken: #d5e1db; --kb-line: #bccfc7;
    --kb-ink: #172a33; --kb-dim: #4d6672;
    --kb-accent: #c47d00; --kb-accent-ink: #ffffff; --kb-accent-text: #8d5a00; --kb-accent-soft: rgba(196, 125, 0, .12);
    --kb-scrim: rgba(23, 42, 51, .45); --kb-focus: #1f6fbf;
    --tr-panel: rgba(23, 42, 51, .06); --tr-line: #c2d3cc; --tr-card: linear-gradient(#ffffff, #eaf1ee);
    --tr-go: linear-gradient(#e8a02a, #c47d00); --tr-go-shadow: #7d4f00; --tr-good: #2c8a52; --tr-bad: #c2412a; --tr-star: #c47d00;
    --tr-title: linear-gradient(90deg, #9a6200, #c47d00 45%, #1c7ab8);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #eef3f0; --kb-surface: #ffffff; --kb-surface-2: #e4ede9; --kb-sunken: #d5e1db; --kb-line: #bccfc7;
  --kb-ink: #172a33; --kb-dim: #4d6672;
  --kb-accent: #c47d00; --kb-accent-ink: #ffffff; --kb-accent-text: #8d5a00; --kb-accent-soft: rgba(196, 125, 0, .12);
  --kb-scrim: rgba(23, 42, 51, .45); --kb-focus: #1f6fbf;
  --tr-panel: rgba(23, 42, 51, .06); --tr-line: #c2d3cc; --tr-card: linear-gradient(#ffffff, #eaf1ee);
  --tr-go: linear-gradient(#e8a02a, #c47d00); --tr-go-shadow: #7d4f00; --tr-good: #2c8a52; --tr-bad: #c2412a; --tr-star: #c47d00;
  --tr-title: linear-gradient(90deg, #9a6200, #c47d00 45%, #1c7ab8);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
#stageWrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: #0b131a; }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
header { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 2px 4px; pointer-events: none; }
header > * { pointer-events: auto; }
.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: #fff; text-decoration: none; background: rgba(8, 14, 20, .55); border: 1px solid rgba(255, 255, 255, .22); padding: 0; cursor: pointer; }
.back svg, .icon svg { width: 22px; height: 22px; }
.icon:active, .back:active { transform: scale(.94); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(8, 14, 20, .6); border: 1px solid rgba(255, 255, 255, .22); color: #fff; white-space: nowrap; }
#modeChip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp { flex: 1 1 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
#toast { position: absolute; z-index: 7; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 90%; padding: 8px 16px; border-radius: 16px; background: rgba(8, 14, 20, .82); border: 1px solid rgba(255, 255, 255, .28); color: #fff; font: 800 clamp(15px, 4.4vmin, 24px) var(--kb-font-body); text-align: center; pointer-events: none; animation: rise .25s; }
#toast.good { border-color: #7be0a0; } #toast.bad { border-color: #ff8f80; background: rgba(60, 12, 8, .85); }
#toast small { display: block; font-size: .62em; font-weight: 700; opacity: .9; }
#departBtn { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(var(--dash, 90px) + 10px); min-width: 190px; min-height: 52px; padding: 6px 22px; border-radius: 26px; border: 0; cursor: pointer; background: var(--tr-go); color: var(--kb-accent-ink); font: 800 18px var(--kb-font-body); box-shadow: 0 4px 0 var(--tr-go-shadow), 0 6px 18px rgba(0, 0, 0, .35); touch-action: manipulation; }
#departBtn:disabled { opacity: .55; box-shadow: none; cursor: default; }
#departBtn:active:not(:disabled) { transform: translateX(-50%) translateY(2px); }
#hint { position: absolute; z-index: 7; left: 50%; top: calc(100% - var(--dash, 90px) - 70px); transform: translateX(-50%); max-width: 92%; padding: 6px 12px; border-radius: 999px; background: rgba(8, 14, 20, .8); border: 1px solid rgba(255, 255, 255, .25); color: #fff; font-size: 12px; font-weight: 800; pointer-events: none; text-align: center; }

/* touch levers */
#pad { position: absolute; z-index: 4; inset: 0; pointer-events: none; --u: clamp(52px, 15vmin, 80px); }
.cl { position: absolute; bottom: calc(var(--kb-sab) + 10px); display: flex; gap: 8px; pointer-events: none; }
.cl.l { left: calc(var(--kb-sal) + 10px); flex-direction: row; align-items: flex-end; }
.cl.r { right: calc(var(--kb-sar) + 10px); flex-direction: column; }
.lv { pointer-events: auto; touch-action: none; display: grid; place-items: center; align-content: center; gap: 0; border-radius: 18px; border: 2px solid rgba(255, 255, 255, .5); background: rgba(10, 22, 30, .6); color: #fff; font: 800 clamp(12px, 3.6vmin, 16px) var(--kb-font-body); cursor: pointer; padding: 0; -webkit-user-select: none; user-select: none; position: relative; }
.lv svg { width: 30%; max-width: 30px; height: auto; }
.lv small { font-size: .78em; font-weight: 700; opacity: .9; }
.lv.on { background: rgba(255, 200, 61, .5); border-color: #fff; transform: scale(.96); }
.lv.up { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.0); background: rgba(40, 150, 90, .55); }
.lv.dn { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.0); background: rgba(210, 120, 30, .55); }
.lv.nn { width: var(--u); height: var(--u); border-radius: 50%; }
.lv.eb { width: var(--u); height: var(--u); border-radius: 50%; background: rgba(220, 50, 40, .6); }
.lv .hit { position: absolute; inset: -6px; border-radius: inherit; }
body.notouch #pad { display: none; }
@media (orientation: portrait) {
  #pad { position: relative; inset: auto; flex: 0 0 auto; height: min(34dvh, 250px); height: min(34vh, 250px); background: linear-gradient(#10202a, #0b141b); border-top: 1px solid rgba(255, 255, 255, .15); --u: clamp(54px, 15vw, 76px); }
  .cl { bottom: 10px; align-items: center; }
  .cl.l { left: 10px; flex-direction: column-reverse; } .cl.r { right: 10px; }
  .lv.up, .lv.dn { width: calc(var(--u) * 2.3); height: calc(var(--u) * 1.15); }
  .cl.m { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; flex-direction: column; }
  body.notouch #pad { display: none; }
}

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; padding: calc(var(--kb-sat) + 6px) calc(var(--kb-sar) + 8px) calc(var(--kb-sab) + 6px) calc(var(--kb-sal) + 8px); overscroll-behavior: contain; animation: fade .2s; touch-action: manipulation; }
.card { width: 100%; max-width: 460px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--tr-card); border: 1px solid var(--tr-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); animation: rise .25s; color: var(--kb-ink); }
.card.wide { max-width: 680px; }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 2px; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--tr-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 32px; line-height: 1.25; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--tr-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--tr-go-shadow); touch-action: manipulation; text-decoration: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tr-go-shadow); }
.btn.sub { background: var(--tr-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--tr-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; display: block; }
.btn .stk { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.btn:disabled { opacity: .45; cursor: default; }
.row2 { display: flex; gap: 8px; } .row2 > .btn, .row2 > a.btn { flex: 1; min-width: 0; }
.menu { display: grid; grid-template-columns: 1fr; gap: 0; }
.lines { display: flex; gap: 6px; margin: 6px 0 4px; }
.ln { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--tr-line); background: var(--tr-panel); color: var(--kb-ink); font: 800 12.5px var(--kb-font-body); padding: 3px 4px; cursor: pointer; touch-action: manipulation; line-height: 1.2; }
.ln.sel { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.ln small { display: block; font-weight: 600; font-size: 10.5px; color: var(--kb-dim); }
.ln:disabled { opacity: .6; cursor: default; }
.rlist { display: grid; gap: 6px; margin: 6px 0; text-align: left; }
.rc { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; border: 2px solid var(--tr-line); background: var(--tr-panel); color: var(--kb-ink); font-family: var(--kb-font-body); cursor: pointer; text-align: left; touch-action: manipulation; }
.rc.sel { border-color: var(--kb-accent); background: var(--kb-accent-soft); }
.rc:disabled { opacity: .55; cursor: default; }
.rc .no { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--lc, #3aa05c); color: #fff; font-weight: 800; font-size: 13px; }
.rc .tx { flex: 1; min-width: 0; } .rc .tx b { display: block; font-size: 14px; } .rc .tx small { display: block; font-size: 11px; color: var(--kb-dim); line-height: 1.35; }
.rc .sc { flex: none; text-align: right; font-size: 11px; color: var(--kb-dim); } .rc .sc .st { display: block; font-size: 15px; letter-spacing: 1px; color: var(--tr-star); }
.info { margin-top: 6px; padding: 8px; border-radius: 12px; background: var(--tr-panel); border: 1px solid var(--tr-line); text-align: left; font-size: 12px; line-height: 1.5; color: var(--kb-ink); }
.info b { display: block; font-size: 13.5px; }
.tt { display: grid; grid-template-columns: 1fr auto auto; gap: 1px 10px; margin-top: 4px; font-size: 11.5px; color: var(--kb-dim); font-variant-numeric: tabular-nums; }
.tt span:nth-child(3n+1) { color: var(--kb-ink); font-weight: 800; }
.tt .pass span { opacity: .6; }
.stars { font-size: 34px; letter-spacing: 6px; color: var(--tr-star); margin: 0; line-height: 1.2; }
.stars i { font-style: normal; opacity: .28; } .stars i.on { opacity: 1; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.res div { padding: 6px 4px; border-radius: 12px; background: var(--tr-panel); border: 1px solid var(--tr-line); font-size: 11px; color: var(--kb-dim); font-weight: 800; }
.res b { display: block; font-size: 17px; color: var(--kb-ink); font-variant-numeric: tabular-nums; }

.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--tr-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--tr-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
body.thumb header, body.thumb #pad, body.thumb #departBtn, body.thumb .kb-layer, body.thumb .kb-toasts, body.thumb #toast { display: none !important; }
@keyframes rise { from { transform: translateY(12px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .card, .overlay, #toast { animation: none; } }
@media (max-height: 560px) { .card { padding: 10px 12px 8px; } .btn { min-height: 44px; margin-top: 6px; } .card h2.logo { font-size: 26px; } .menu { grid-template-columns: 1fr 1fr; gap: 0 8px; } .howto { max-width: 640px; } .rc { min-height: 50px; } }
</style>

<body class="notouch">

  </div>

<script src="engine.js"></script>
<script src="art.js"></script>
<script src="../common/game.js"></script>
<script>
(() => {
'use strict';
// でんしゃでいこう — an original (fictional-railway) driving game. train/engine.js is the deterministic 60Hz simulation (also run headless by
// tools/tests/unit/train-engine.test.js), train/art.js draws the cab view, and this file is the chrome: input (keyboard, touch levers),
// menus, route select, saving, scoring, sound and the platform events.
const T = KoboI18n.t;
const EN = KoboI18n.lang === 'en';
const E = window.TrainEngine, ART = window.TrainArt;
const PF = window.KoboPlatform || null, AU = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'train';
const SAVE_KEY = 'kusoge.train.save', HOWTO_KEY = 'kusoge.train.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Math.round(Number(n) || 0).toLocaleString(EN ? 'en-US' : 'ja-JP');
const L = o => (o ? (EN ? o.en : o.ja) : '');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; } })();
const now = () => performance.now();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
const lastSfx = {};
function tone(f, d, o, key, gap) { if (!AU) return; const t = now(); if (key && lastSfx[key] && t - lastSfx[key] < gap) return; if (key) lastSfx[key] = t; AU.tone(f, d, o); }
function noise(d, o, key, gap) { if (!AU) return; const t = now(); if (key && lastSfx[key] && t - lastSfx[key] < gap) return; if (key) lastSfx[key] = t; AU.noise(d, o); }
function sfx(name, gap) { if (!AU) return; const t = now(); if (gap && lastSfx[name] && t - lastSfx[name] < gap) return; lastSfx[name] = t; AU.sfx(name); }
function vibrate(p) { if (AU && AU.vibrate) AU.vibrate(p); }
const dark = () => { try { return (UI && UI.theme ? UI.theme.resolved() : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; } catch (e) { return true; } };
const clamp = E.clamp;

// ---------- save ----------
function defSave() {
  return { v: 1, total: 0, stars: 0, r: {}, un: {},
    stats: { plays: 0, clears: 0, legs: 0, stops: 0, pita: 0, ontime: 0, smooth: 0, gold: 0, three: 0, night: 0, waits: 0, ats: 0, red: 0 },
    set: { route: 'r1' }, tut: 0 };
}
function readSave() {
  let s = null; try { s = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const d = defSave();
  if (!s || typeof s !== 'object' || Array.isArray(s)) return d;
  const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  const out = Object.assign(d, s);
  out.stats = Object.assign(defSave().stats, obj(s.stats)); out.set = Object.assign(defSave().set, obj(s.set)); out.un = obj(s.un);
  out.r = {};
  for (const id of E.ROUTE_IDS) {
    const q = obj(obj(s.r)[id]);
    if (q.b || q.s || q.p) out.r[id] = { b: Math.max(0, Number(q.b) || 0), s: clamp(Number(q.s) || 0, 0, 3), p: Math.max(0, Number(q.p) || 0) };
  }
  recount(out);
  return out;
}
function recount(s) {
  let t = 0, st = 0; for (const id in s.r) { t += s.r[id].b; st += s.r[id].s; }
  s.total = Math.max(t, Number(s.total) || 0); s.stars = Math.max(st, Number(s.stars) || 0);
  for (const ln of E.LINES) if (ln.need > 0 && s.stars >= ln.need) s.un[ln.id] = 1;
}
let save = readSave();
function writeSave() { recount(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const lineOpen = ln => ln.need <= 0 || !!save.un[ln.id] || save.stars >= ln.need;
function routeOpen(id) {
  const R = E.byId(id), ln = E.LINES.find(l => l.id === R.line);
  if (!lineOpen(ln)) return false;
  const mates = E.ROUTES.filter(r => r.line === R.line), i = mates.indexOf(R);
  return i === 0 || ((save.r[mates[i - 1].id] || {}).s || 0) >= 1;
}
const routeName = id => L(E.byId(id).name);
const starsStr = n => '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n);

// ---------- input ----------
const KEYS_UP = ['ArrowUp', 'KeyW'], KEYS_DN = ['ArrowDown', 'KeyS'], KEYS_N = ['Space', 'KeyQ'], KEYS_EB = ['KeyB', 'ShiftLeft', 'ShiftRight'], KEYS_GO = ['Enter', 'NumpadEnter', 'KeyF'];
const held = { up: 0, dn: 0 }; // 押している間、すこしずつくりかえす
const HOLD0 = 380, HOLD1 = 230;
let want = 0, pendingDepart = false;
function setNotch(n, src) {
  n = clamp(Math.round(n), E.NOTCH_MIN, E.NOTCH_MAX);
  if (n === want) return;
  want = n; if (AU) AU.ctx();
  tone(n < 0 ? 240 : n > 0 ? 330 : 280, 0.035, { type: 'square', vol: 0.03 }, 'lever', 30);
  needDraw = true;
}
function lever(dir) { if (!inRun()) return; setNotch(want + dir); }
function pressDepart() { if (!inRun()) return; if (G.st.phase === 'dwell') pendingDepart = true; }
const keysDown = new Set();
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) return;
  const c = e.code;
  if (c === 'KeyP' && inRun() && !anyOverlay() && !menuOpen) { e.preventDefault(); openMenu(); return; }
  if (!inRun() || anyOverlay() || menuOpen) return;
  const rel = [].concat(KEYS_UP, KEYS_DN, KEYS_N, KEYS_EB, KEYS_GO).indexOf(c) >= 0;
  if (!rel) return;
  e.preventDefault();
  if (e.repeat) return;
  keysDown.add(c);
  if (KEYS_UP.indexOf(c) >= 0) { lever(1); held.up = now() + HOLD0; }
  else if (KEYS_DN.indexOf(c) >= 0) { lever(-1); held.dn = now() + HOLD0; }
  else if (KEYS_N.indexOf(c) >= 0) setNotch(0);
  else if (KEYS_EB.indexOf(c) >= 0) setNotch(-8);
  else if (KEYS_GO.indexOf(c) >= 0) pressDepart();
}, { capture: true });
addEventListener('keyup', e => {
  keysDown.delete(e.code);
  if (KEYS_UP.indexOf(e.code) >= 0) held.up = 0; if (KEYS_DN.indexOf(e.code) >= 0) held.dn = 0;
});
addEventListener('blur', () => { keysDown.clear(); held.up = held.dn = 0; });
function repeatHeld() {
  const t = now();
  if (held.up && t >= held.up) { lever(1); held.up = t + HOLD1; }
  if (held.dn && t >= held.dn) { lever(-1); held.dn = t + HOLD1; }
}

// ---------- touch levers ----------
const isTouchDevice = (() => { try { return matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || navigator.maxTouchPoints > 0; } catch (e) { return false; } })() || /[?&]touch\b/.test(location.search);
const ARROW_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>';
const ARROW_DN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>';
function buildPad() {
  const box = $('pad'); box.innerHTML = '';
  const mk = (cls, html, label, down, up) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'lv ' + cls; b.innerHTML = html; b.setAttribute('aria-label', label);
    const hit = document.createElement('span'); hit.className = 'hit'; b.appendChild(hit);
    b.addEventListener('pointerdown', e => { try { b.setPointerCapture(e.pointerId); } catch (e2) {} b.classList.add('on'); down(); if (AU) AU.ctx(); e.preventDefault(); });
    const rel = () => { b.classList.remove('on'); if (up) up(); };
    b.addEventListener('pointerup', rel); b.addEventListener('pointercancel', rel); b.addEventListener('lostpointercapture', rel);
    b.addEventListener('contextmenu', e => e.preventDefault());
    return b;
  };
  const left = document.createElement('div'); left.className = 'cl l'; const right = document.createElement('div'); right.className = 'cl r';
  left.append(mk('eb', '<span>' + esc(T('非常')) + '</span><small>EB</small>', T('非常ブレーキ'), () => setNotch(-8)),
    mk('nn', '<span>N</span><small>' + esc(T('切')) + '</small>', T('ニュートラル'), () => setNotch(0)));
  right.append(mk('up', ARROW_UP + '<span>' + esc(T('加速')) + '</span>', T('加速（ノッチを上げる）'), () => { lever(1); held.up = now() + HOLD0; }, () => { held.up = 0; }),
    mk('dn', ARROW_DN + '<span>' + esc(T('ブレーキ')) + '</span>', T('ブレーキ（ノッチを下げる）'), () => { lever(-1); held.dn = now() + HOLD0; }, () => { held.dn = 0; }));
  box.append(left, right);
}
function padInset() {
  if (!isTouchDevice || document.body.classList.contains('notouch') || view.portrait) return { l: 0, r: 0 };
  const a = document.querySelector('#pad .cl.l'), b = document.querySelector('#pad .cl.r');
  return { l: a ? Math.round(a.getBoundingClientRect().width + 16) : 0, r: b ? Math.round(b.getBoundingClientRect().width + 16) : 0 };
}

// ---------- canvas & view ----------
const cv = $('board'), ctx = cv.getContext('2d'), wrap = $('stageWrap');
const view = { W: 360, H: 560, dpr: 1, portrait: false };
let needDraw = true;
function layout() {
  const r = wrap.getBoundingClientRect();
  const W = Math.max(120, Math.floor(r.width)), H = Math.max(120, Math.floor(r.height));
  let dpr = Math.min(2, window.devicePixelRatio || 1); while (W * H * dpr * dpr > 1.6e6 && dpr > 1) dpr = Math.max(1, dpr - 0.25);
  Object.assign(view, { W, H, dpr, portrait: innerHeight > innerWidth });
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  const dash = clamp(H * 0.25, 60, 118); wrap.style.setProperty('--dash', Math.round(dash) + 'px');
  const hint = $('hint'); hint.hidden = !(view.portrait && isTouchDevice && false);
  needDraw = true;
}
window.addEventListener('resize', layout);
try { new ResizeObserver(layout).observe(wrap); } catch (e) {}

// ---------- the run ----------
let G = null, paused = false, menuOpen = false, acc = 0, lastT = now(), raf = 0, speedMul = 1;
const anyOverlay = () => !!document.querySelector('.overlay:not([hidden])');
const inRun = () => !!(G && G.mode === 'run' && !G.st.over);
const playing = () => inRun();
let toastTimer = 0;
function toast(html, cls, ms) {
  const el = $('toast'); el.innerHTML = html; el.className = cls || ''; el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2200);
}
function startRun(routeId, o) {
  o = o || {};
  if (G && G.mode === 'run' && !G.st.over && !G.reported) endPlay('quit');
  const R = E.byId(routeId);
  const st = E.create({ route: routeId, seed: o.seed });
  ART.setCfg({ dark: dark(), en: EN, reduced: reduceMotion.matches, T });
  G = { mode: o.demo ? 'demo' : 'run', st, route: routeId, R, auto: !!o.demo, t0: now(), over: false, shown: false, endT: 0, asst: null, asstF: -99, hintFlags: {}, jolted: false, demoN: o.demoN || 0 };
  want = st.notch; pendingDepart = false; held.up = held.dn = 0; acc = 0; lastT = now();
  const play = !o.demo;
  document.body.classList.toggle('notouch', !(isTouchDevice && play));
  buildPad();
  $('pauseBtn').hidden = !play; $('modeChip').textContent = play ? L(R.name) : T('でんしゃでいこう');
  $('toast').hidden = true;
  layout();
  if (play) emit('play_start', { mode: 'normal', stage: E.ROUTE_IDS.indexOf(routeId) + 1, resumed: false });
  needDraw = true;
  return G;
}
function startDemo() {
  const order = ['r3', 'r4', 'r7', 'r2', 'r6'];
  const n = (G && G.demoN != null ? G.demoN + 1 : 0) % order.length;
  const g = startRun(order[n], { demo: true, demoN: n });
  // しばらく走った場面から（タイトルのうしろが、いきなり走っているように）
  for (let i = 0; i < 60 * 10; i++) E.step(g.st, E.autopilot(g.st));
  return g;
}
function endPlay(reason) {
  if (!G || G.mode !== 'run' || G.reported) return;
  G.reported = true;
  emit('play_end', { mode: 'normal', score: 0, durationMs: Math.round(G.st.t * 1000), reason: reason || 'quit', stats: {} });
}

// ---------- events from the simulation ----------
const RANK_TXT = { pita: 'ぴたり！', great: 'ばっちり！', good: 'いいね！', ok: 'おしい！' };
function onEvent(ev) {
  const st = G.st;
  if (ev.t === 'depart') { tone(1320, 0.12, { type: 'sine', vol: 0.08 }); tone(1320, 0.12, { type: 'sine', vol: 0.08, delay: 0.2 }); $('toast').hidden = true; G.jolted = false; vibrate(20); }
  else if (ev.t === 'stop') {
    const l = ev.leg; let head, cls = 'good';
    if (l.missed) { head = T('ゆきすぎ…'); cls = 'bad'; }
    else if (l.rank === 'miss') { head = l.err < 0 ? T('てまえ…') : T('ゆきすぎ…'); cls = 'bad'; }
    else head = T(RANK_TXT[l.rank]);
    const d = Math.abs(l.err);
    const sub = (d < 0.05 ? T('ぴたり') : l.err < 0 ? T('{n}m 手前', { n: d.toFixed(1) }) : T('{n}m のりすごし', { n: d.toFixed(1) })) + ' · ' + T('{n}点', { n: fmtN(l.stop) });
    toast(esc(head) + '<small>' + esc(sub) + '</small>', cls, 2600);
    tone(880, 0.16, { type: 'sine', vol: 0.1 }); tone(660, 0.3, { type: 'sine', vol: 0.1, delay: 0.18 });
    if (l.rank === 'pita') { tone(1320, 0.18, { type: 'triangle', vol: 0.08, delay: 0.4 }); vibrate([20, 40, 20]); }
    emit('progress', { key: 'stops', value: save.stats.stops + st.legs.length });
  }
  else if (ev.t === 'jolt') { if (!G.jolted && ev.v > 0.15) { G.jolted = true; toast(esc(T('ガクン！ ブレーキは さいごにゆるめよう')), 'bad', 2000); } }
  else if (ev.t === 'ats') { toast(esc(T(ev.why === 'red' ? '赤信号をこえた！' : 'スピードを出しすぎ！')) + '<small>' + esc(T('ATS が はたらいた！ 非常ブレーキ')) + '</small>', 'bad', 3000); tone(520, 0.4, { type: 'sawtooth', vol: 0.07, slide: 260 }); vibrate([80, 40, 80]); setNotch(-8); }
  else if (ev.t === 'atsOff') { if (want < -4 || want === -8) setNotch(-4); }
  else if (ev.t === 'finish') { G.finishT = now(); }
}

// ---------- the step loop ----------
function simStep() {
  const st = G.st;
  let inp;
  if (G.auto) { inp = E.autopilot(st); want = st.notch; }
  else { inp = { notch: want }; if (pendingDepart) { inp.depart = true; } }
  const wasDwell = st.phase === 'dwell';
  const evs = E.step(st, inp);

    finishRoute() { const st = G.st; let n = 0; while (!st.over && n++ < 60 * 900) { const evs = E.step(st, E.autopilot(st)); for (const e of evs) if (G.mode === 'run') onEvent(e); } want = st.notch; needDraw = true; return st.over; },
    showTitle, showHowto, openRoutes, openMenu, startDemo, layout,
    fps(ms) { return new Promise(res => { let f = 0; const t0 = performance.now(); const tick = () => { f++; if (performance.now() - t0 < ms) requestAnimationFrame(tick); else res(Math.round(f * 1000 / (performance.now() - t0))); }; requestAnimationFrame(tick); }); },
    thumbScene() {
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); hideAll();
      const g = startRun('r3', { demo: true, demoN: 0 }); G.mode = 'thumb';
      for (let i = 0; i < 60 * 33; i++) E.step(g.st, E.autopilot(g.st));
      $('departBtn').hidden = true; needDraw = true; return true;
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
