<style>
/* めいろ探検：ランタンのあかりとコケいろ。--kb-* は共通のトークンを塗りなおしたもの、--mz-* はこのゲームだけ */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #10171d; --kb-surface: #1a242c; --kb-surface-2: #243039; --kb-sunken: #0b1015; --kb-line: #3a4b57;

  --mz-good: #7be0a0; --mz-bad: #ff8f80; --mz-star: #ffc83d; --mz-star-off: #44525c; --mz-key: #2f3e48; --mz-key-shadow: #151d23; --mz-title: linear-gradient(90deg, #b9ffd9, #4fd1a5 55%, #ffd166);

}

    --kb-ink: #1c2a22; --kb-dim: #556458;
    --kb-accent: #1f8f69; --kb-accent-ink: #ffffff; --kb-accent-text: #146a4e; --kb-accent-soft: rgba(31, 143, 105, .12);
    --kb-scrim: rgba(28, 42, 34, .45); --kb-focus: #b36a00;
    --mz-panel: rgba(28, 42, 34, .06); --mz-card: linear-gradient(#fbfdf6, #e9f0da); --mz-go: linear-gradient(#34b88d, #1f8f69); --mz-go-shadow: #0f5a40;
    --mz-good: #1f7a46; --mz-bad: #b83a26; --mz-star: #d08a00; --mz-star-off: #c3cdb0; --mz-key: #e6edd6; --mz-key-shadow: #b9c6a4; --mz-title: linear-gradient(90deg, #146a4e, #1f8f69 55%, #b36a00);

  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #eef2e6; --kb-surface: #fbfdf6; --kb-surface-2: #e1e8d3; --kb-sunken: #d3ddc0; --kb-line: #b9c6a4;
  --kb-ink: #1c2a22; --kb-dim: #556458;
  --kb-accent: #1f8f69; --kb-accent-ink: #ffffff; --kb-accent-text: #146a4e; --kb-accent-soft: rgba(31, 143, 105, .12);
  --kb-scrim: rgba(28, 42, 34, .45); --kb-focus: #b36a00;
  --mz-panel: rgba(28, 42, 34, .06); --mz-card: linear-gradient(#fbfdf6, #e9f0da); --mz-go: linear-gradient(#34b88d, #1f8f69); --mz-go-shadow: #0f5a40;
  --mz-good: #1f7a46; --mz-bad: #b83a26; --mz-star: #d08a00; --mz-star-off: #c3cdb0; --mz-key: #e6edd6; --mz-key-shadow: #b9c6a4; --mz-title: linear-gradient(90deg, #146a4e, #1f8f69 55%, #b36a00);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); max-width: 760px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

.back svg, .icon svg { width: 22px; height: 22px; }

.chip b { font: 800 16px var(--kb-font-body); color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.chip.lv { flex: 1 1 auto; align-items: flex-start; overflow: hidden; } .chip.lv b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
#stage { flex: 1 1 auto; min-height: 0; position: relative; padding: 4px 8px; }

#status { flex: none; min-height: 34px; box-sizing: border-box; padding: 5px 12px; margin: 0 8px; border-radius: 12px; font-size: 12.5px; font-weight: 800; line-height: 1.35; text-align: center; color: var(--kb-ink); background: var(--mz-panel); border: 1px solid var(--kb-line); display: flex; align-items: center; justify-content: center; }
#status.warn { border-color: var(--mz-bad); color: var(--mz-bad); } #status.good { border-color: var(--mz-good); }
#ctl { flex: none; display: flex; align-items: stretch; justify-content: space-between; gap: 8px; padding: 6px 8px 8px; }
#acts { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; align-content: center; }
.act { min-width: 0; min-height: 42px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--mz-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--mz-key-shadow); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 6px; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.act svg { width: 18px; height: 18px; flex: none; }
.act:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--mz-key-shadow); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; } .act[aria-pressed="true"] { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent), 0 3px 0 var(--mz-key-shadow); }
#dpad { flex: none; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 3px; }
#dpad button { border-radius: 14px; border: 1px solid var(--kb-line); background: var(--mz-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--mz-key-shadow); cursor: pointer; padding: 0; display: grid; place-items: center; touch-action: none; }
#dpad button svg { width: 22px; height: 22px; } #dpad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mz-key-shadow); }
#dpad .u { grid-area: 1 / 2; } #dpad .l { grid-area: 2 / 1; } #dpad .r { grid-area: 2 / 3; } #dpad .d { grid-area: 3 / 2; }
body.nodpad #dpad { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) 296px; grid-template-rows: auto auto auto 1fr; grid-template-areas: "hd hd" "st hu" "st sa" "st ct"; column-gap: 8px; }
  header { grid-area: hd; padding-top: 0; }
  #hud { grid-area: hu; flex-wrap: wrap; padding: 2px 8px 2px 0; } .chip { min-height: 32px; padding: 1px 8px; } .chip b { font-size: 14px; } .chip.lv { flex: 1 1 100%; }
  #stage { grid-area: st; padding: 2px 4px; } #status { grid-area: sa; margin: 0 8px 0 0; min-height: 28px; padding: 2px 8px; font-size: 11.5px; line-height: 1.25; }
  #ctl { grid-area: ct; padding: 4px 8px 4px 0; align-items: flex-start; flex-wrap: nowrap; justify-content: flex-start; gap: 6px; }
  #acts { flex: none; grid-template-columns: repeat(3, 44px); gap: 4px; align-content: start; } .act { min-height: 44px; font-size: 13px; padding: 2px; } .act span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .act svg { width: 20px; height: 20px; } #bHint::after { content: attr(data-n); font-weight: 800; }
  #dpad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; }
}
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s ease-out; }
.panel { width: 100%; max-width: 460px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--mz-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font: 400 22px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--mz-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 26px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--mz-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--mz-go-shadow); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--mz-go-shadow); } .btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--mz-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }
.qm:first-child { margin-top: 0; } .qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.qm.plain { border-color: var(--kb-line); background: var(--mz-panel); }
.og { margin: 8px 0 0; text-align: left; } .og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }

.opt { flex: 1 1 0; min-width: 40px; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.opt small { font-weight: 500; font-size: 9.5px; opacity: .85; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.fld { display: flex; gap: 6px; } .fld input { flex: 1 1 auto; min-width: 0; min-height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 15px var(--kb-font-body); padding: 4px 10px; user-select: text; -webkit-user-select: text; }
.fld .btn { width: auto; margin-top: 0; flex: none; min-width: 52px; }
.err { color: var(--mz-bad); font-size: 12px; font-weight: 800; min-height: 16px; margin: 4px 0 0; }
.stars { display: flex; gap: 6px; justify-content: center; margin: 4px 0; } .stars svg { width: 44px; height: 44px; } .stars .on { fill: var(--mz-star); stroke: #8a5600; } .stars .off { fill: var(--mz-star-off); stroke: transparent; } .stars svg.pop { animation: starpop .5s ease-out both; }
.big { font: 400 30px var(--kb-font-display); line-height: 1.15; color: var(--kb-ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 6px 6px; text-align: left; font-size: 13px; font-weight: 800; }
.kv span:nth-child(odd) { color: var(--kb-dim); font-weight: 500; } .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 2px; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.howto { max-width: 480px; text-align: left; } .howto h2 { text-align: center; } .howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); } .howto li { margin: 3px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.code { font: 800 16px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; padding: 6px 10px; border-radius: 10px; background: var(--mz-panel); border: 1px dashed var(--kb-line); user-select: all; -webkit-user-select: all; word-break: break-all; }
.worlds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 4px 2px 8px; }
.wd { position: relative; min-width: 0; padding: 6px 4px 6px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--mz-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--mz-key-shadow); font: 800 11.5px/1.25 var(--kb-font-body); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.wd canvas { width: 64px; height: 64px; border-radius: 8px; } .wd small { font-weight: 500; font-size: 10px; color: var(--kb-dim); min-height: 24px; display: block; } .wd.cur { border-color: var(--kb-accent); box-shadow: 0 0 0 2px var(--kb-accent), 0 3px 0 var(--mz-key-shadow); }
.wd.lock canvas { filter: grayscale(1) brightness(.5); } .wd.lock { opacity: .85; } .wd .lk { position: absolute; top: 28px; left: 50%; margin-left: -10px; width: 20px; height: 20px; color: #fff; filter: drop-shadow(0 1px 2px #000); }
.toastbar { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 85; max-width: 90%; padding: 8px 16px; border-radius: 14px; background: rgba(20, 20, 28, .9); color: #fff; font-weight: 800; font-size: 14px; pointer-events: none; animation: rise .2s; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes starpop { from { transform: scale(.3) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.25) rotate(8deg); opacity: 1; } }

@media (prefers-reduced-motion: reduce) { .panel, .overlay, .stars svg.pop, #board.shake, .toastbar { animation: none !important; } }
@media (max-width: 379px) { h1 { font-size: 15px; } .chip { padding: 2px 6px; } #acts { gap: 5px; } .act { font-size: 12px; gap: 3px; padding: 2px 3px; } }
body.thumb header, body.thumb #hud, body.thumb #ctl, body.thumb #status { display: none !important; }
body.thumb #app { display: flex !important; flex-direction: column; max-width: none; } body.thumb #stage { flex: 1 1 auto; padding: 10px; }
</style>

<div id="app">
  <header>
    <a class="back" href="../" id="backLink" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>

    <button class="icon" id="sndBtn" type="button" aria-label="サウンド" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  <div id="hud">
    <span class="chip lv"><span id="lLevel">めいろ</span><b id="vLevel">-</b></span>

  <div id="ctl">
    <div id="acts">
      <button class="act" id="bUndo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -6)"/></svg><span id="tUndo">もどる</span></button>
      <button class="act" id="bHint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span id="hintLbl">ヒント</span></button>
