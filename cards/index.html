<style>
/* トランプ広場: a felt card table. Cards keep a warm paper face in both themes; the room around the table follows the light / dark theme.
   --kb-* are the shared tokens re-tinted to deep green and brass; --cd-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #0e1f1b; --kb-surface: #16302a; --kb-surface-2: #1d3d35; --kb-sunken: #0a1815; --kb-line: #2c5247;
  --kb-ink: #f1f5ee; --kb-dim: #a6bfb4;
  --kb-accent: #f0c15a; --kb-accent-ink: #2a1d00; --kb-accent-text: #f4cd74; --kb-accent-soft: rgba(240, 193, 90, .15);
  --kb-scrim: rgba(4, 12, 10, .8); --kb-toast-bg: rgba(8, 22, 18, .95); --kb-focus: #ffd76b;
  --kb-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --cd-felt: radial-gradient(120% 90% at 50% 40%, #1f5a49 0%, #164336 60%, #0f2f26 100%); --cd-rail: #0a1b16; --cd-rim: rgba(240, 193, 90, .28);
  --cd-panel: rgba(230, 250, 240, .06); --cd-line: rgba(200, 235, 220, .16); --cd-card: linear-gradient(#1c3a32, #142b25);
  --cd-go: linear-gradient(#f6d27c, #e0a93a); --cd-go-ink: #2a1d00; --cd-go-shadow: #8c6414;
  --cd-key: linear-gradient(#25483f, #1b3831); --cd-key-shadow: #08150f;
  --cd-title: linear-gradient(90deg, #f6d98a, #9fe3c8 60%, #f0c15a);
  --cd-red: #c42f48; --cd-blk: #1c2342; --cd-bad: #ff8a78; --cd-ok: #6fe3b0;
  --cd-paper: linear-gradient(160deg, #fffdf8, #f3eddc); --cd-paper-line: rgba(70, 50, 20, .28);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #edf3ee; --kb-surface: #ffffff; --kb-surface-2: #f3f8f4; --kb-sunken: #dfe9e2; --kb-line: #c2d4c9;
    --kb-ink: #172a23; --kb-dim: #4b6459;
    --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5700; --kb-accent-soft: rgba(184, 120, 10, .12);
    --kb-scrim: rgba(23, 42, 35, .45); --kb-toast-bg: rgba(23, 42, 35, .95); --kb-focus: #1f6fbf;
    --kb-shadow: 0 12px 32px rgba(23, 42, 35, .2);
    --cd-felt: radial-gradient(120% 90% at 50% 40%, #3f9b7c 0%, #2f8268 60%, #256a54 100%); --cd-rail: #1c3d33; --cd-rim: rgba(255, 255, 255, .5);
    --cd-panel: rgba(23, 42, 35, .05); --cd-line: #cddbd2; --cd-card: linear-gradient(#ffffff, #f3f8f4);
    --cd-go: linear-gradient(#d99a2b, #b8780a); --cd-go-ink: #ffffff; --cd-go-shadow: #7a4f06;
    --cd-key: linear-gradient(#ffffff, #eef4f0); --cd-key-shadow: #b9cbc0;
    --cd-title: linear-gradient(90deg, #8a5700, #1e7a5e 60%, #b8780a);
    --cd-red: #c42f48; --cd-blk: #1c2342; --cd-bad: #c43b27; --cd-ok: #0f8a5c;
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #edf3ee; --kb-surface: #ffffff; --kb-surface-2: #f3f8f4; --kb-sunken: #dfe9e2; --kb-line: #c2d4c9;
  --kb-ink: #172a23; --kb-dim: #4b6459;
  --kb-accent: #b8780a; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5700; --kb-accent-soft: rgba(184, 120, 10, .12);
  --kb-scrim: rgba(23, 42, 35, .45); --kb-toast-bg: rgba(23, 42, 35, .95); --kb-focus: #1f6fbf;
  --kb-shadow: 0 12px 32px rgba(23, 42, 35, .2);
  --cd-felt: radial-gradient(120% 90% at 50% 40%, #3f9b7c 0%, #2f8268 60%, #256a54 100%); --cd-rail: #1c3d33; --cd-rim: rgba(255, 255, 255, .5);
  --cd-panel: rgba(23, 42, 35, .05); --cd-line: #cddbd2; --cd-card: linear-gradient(#ffffff, #f3f8f4);
  --cd-go: linear-gradient(#d99a2b, #b8780a); --cd-go-ink: #ffffff; --cd-go-shadow: #7a4f06;
  --cd-key: linear-gradient(#ffffff, #eef4f0); --cd-key-shadow: #b9cbc0;
  --cd-title: linear-gradient(90deg, #8a5700, #1e7a5e 60%, #b8780a);
  --cd-red: #c42f48; --cd-blk: #1c2342; --cd-bad: #c43b27; --cd-ok: #0f8a5c;
  --cd-paper: linear-gradient(160deg, #fffdf8, #f3eddc); --cd-paper-line: rgba(70, 50, 20, .28);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: radial-gradient(120% 70% at 50% 0%, var(--kb-surface-2) 0%, var(--kb-bg) 62%) var(--kb-bg);
  color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
header { flex: none; padding: 2px 8px 0; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.hrow { display: flex; align-items: center; gap: 4px; }
.back { display: inline-grid; place-items: center; min-height: 44px; min-width: 44px; flex: none; box-sizing: border-box; color: var(--kb-dim); text-decoration: none; border-radius: 12px; margin-left: -4px; }
.back svg { width: 24px; height: 24px; }
h1 { flex: 1; min-width: 0; margin: 0; text-align: center; font-family: var(--kb-font-display); font-weight: 400; font-size: clamp(15px, 4.7vw, 20px); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--cd-title); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--cd-line); background: var(--cd-panel); color: var(--kb-ink); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
.icon svg { width: 22px; height: 22px; }
.icon:active { transform: scale(.94); }
.back:focus-visible, .icon:focus-visible, .btn:focus-visible, .opt:focus-visible, .tog:focus-visible, .act:focus-visible, .gt:focus-visible, .cd:focus-visible, summary:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
.info { display: flex; align-items: center; gap: 4px; margin: 1px 0 3px; overflow: hidden; }
.chip { flex: none; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--cd-panel); border: 1px solid var(--cd-line); color: var(--kb-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.mode { color: var(--kb-ink); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip.acc { margin-left: auto; color: var(--kb-accent-text); background: var(--kb-accent-soft); border-color: transparent; }
.chip.prac { color: var(--cd-ok); }

/* the table */
#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto; box-sizing: border-box; padding: 0 8px 6px; gap: 5px; }
#table { position: relative; flex: 1 1 auto; min-height: 120px; border-radius: 22px; background: var(--cd-felt); box-shadow: inset 0 0 0 3px var(--cd-rail), inset 0 0 0 4px var(--cd-rim), inset 0 8px 30px rgba(0, 0, 0, .35); overflow: hidden; touch-action: none; contain: layout paint; }
#status { flex: none; min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 3px 10px; border-radius: 14px; background: var(--cd-panel); border: 1px solid var(--cd-line); font-size: 13px; font-weight: 800; text-align: center; line-height: 1.3; }
#status.you { border-color: var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); }
#ctl { flex: none; display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; min-height: 48px; }
#ctl[hidden] { display: none; }
.act { flex: 1 1 0; min-width: 0; max-width: 190px; min-height: 48px; box-sizing: border-box; border-radius: 15px; border: 1px solid var(--cd-line); background: var(--cd-key); color: var(--kb-ink); box-shadow: 0 3px 0 var(--cd-key-shadow); font: 800 14px var(--kb-font-body); cursor: pointer; padding: 2px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; touch-action: manipulation; }
.act small { font-size: 10.5px; font-weight: 500; opacity: .85; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd-key-shadow); }
.act.go { background: var(--cd-go); color: var(--cd-go-ink); border-color: transparent; box-shadow: 0 3px 0 var(--cd-go-shadow); font-size: 15px; }
.act.danger { border-color: var(--cd-bad); color: var(--cd-bad); }
.act:disabled { opacity: .42; cursor: default; box-shadow: none; }
.act.chipbtn { flex: 0 0 auto; min-width: 54px; }
.act.pulse { animation: pulse 1.1s ease-in-out infinite; }

/* cards */
.cd { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.4); margin: 0; padding: 0; border: 0; background: none; transform-origin: 50% 50%; will-change: transform; transition: transform .38s cubic-bezier(.22, .8, .3, 1), opacity .25s; transition-delay: var(--dl, 0s); perspective: 700px; cursor: default; touch-action: none; }
.cd.nt, #table.inst .cd, #table.inst .cd .fl { transition: none !important; }
.cd.tap { cursor: pointer; }
.cd .fl { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .34s ease; transition-delay: var(--dl, 0s); }
.cd.up .fl { transform: rotateY(180deg); }
.cd .fc { position: absolute; inset: 0; border-radius: calc(var(--cw) * .1); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 0, 0, .22); }
.cd .back { background-color: #16296a; background-size: 100% 100%; }
.cd .face { transform: rotateY(180deg); background: var(--cd-paper); border: 1px solid var(--cd-paper-line); box-sizing: border-box; }
.cd.hid { opacity: 0; pointer-events: none; }
.cd.dim .fc { filter: brightness(.62) saturate(.8); }
.cd.sel .face { box-shadow: 0 0 0 2px var(--kb-accent), 0 0 14px 2px var(--kb-accent); }
.cd.hl .fc { animation: glow 1s ease-in-out infinite; }
.cd.mark .face::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font: 800 calc(var(--cw) * .7) var(--kb-font-body); color: rgba(196, 47, 72, .85); background: rgba(255, 255, 255, .55); }
.cd.bad { animation: shake .3s; }
.cd.pick:hover .back { filter: brightness(1.15); }
.cf { position: absolute; inset: 0; font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif; }
.cf.red { color: var(--cd-red); } .cf.blk { color: var(--cd-blk); } .cf.jk { color: #2f4ea2; }
.cf .ix { position: absolute; left: 6%; top: 3%; display: flex; flex-direction: column; align-items: center; line-height: 1; width: 20%; }
.cf .ix.br { left: auto; right: 6%; top: auto; bottom: 3%; transform: rotate(180deg); }
.cf .ix b { font-size: calc(var(--cw) * .27); font-weight: 700; letter-spacing: -.02em; }
.cf .ix .su { width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); margin-top: 1px; fill: currentColor; }
.cf .pp { position: absolute; left: 14%; right: 14%; top: 8%; bottom: 8%; }
.cf .pip { position: absolute; width: calc(var(--cw) * .22); height: calc(var(--cw) * .22); transform: translate(-50%, -50%); fill: currentColor; }
.cf .pip.dn { transform: translate(-50%, -50%) rotate(180deg); }
.cf .pip.big { width: calc(var(--cw) * .5); height: calc(var(--cw) * .5); }
.cf .court { position: absolute; left: 20%; right: 20%; top: 9%; bottom: 9%; width: 60%; height: 82%; }
.cf .court .cfr { fill: color-mix(in srgb, currentColor 9%, #fffaf0); stroke: #d9a441; stroke-width: 1.6; }
.cf .court .cfl { stroke: #d9a441; stroke-width: 1; fill: none; }
.cf .cs { position: absolute; width: calc(var(--cw) * .16); height: calc(var(--cw) * .16); fill: currentColor; }
.cf .cs.tl2 { left: 24%; top: 12%; } .cf .cs.br2 { right: 24%; bottom: 12%; transform: rotate(180deg); }
.cf.jk .court { left: 20%; right: 20%; }
.cf.jk .jt { position: absolute; left: 22%; right: 22%; bottom: 9%; text-align: center; font: 700 calc(var(--cw) * .12) var(--kb-font-body); letter-spacing: .1em; color: #2f4ea2; }
.slot { position: absolute; left: 0; top: 0; border-radius: calc(var(--cw) * .1); border: 1.5px dashed rgba(255, 255, 255, .22); box-sizing: border-box; transition: transform .3s; pointer-events: none; display: grid; place-items: center; font: 800 11px var(--kb-font-body); color: rgba(255, 255, 255, .32); }
.slot.on { border-color: rgba(240, 193, 90, .75); background: rgba(240, 193, 90, .1); }
.slot.cur { border: 2px solid var(--kb-focus); box-shadow: 0 0 10px var(--kb-focus); color: rgba(255, 255, 255, .8); }
.cd.deep .fc { box-shadow: none; }
.cd.cur .fc { outline: 3px solid var(--kb-focus); outline-offset: -1px; }
.cd.drag { z-index: 300 !important; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .4)); }
#table.sol .cd { cursor: pointer; }

/* seats and labels on the felt */
.seat { position: absolute; display: flex; align-items: center; gap: 6px; box-sizing: border-box; padding: 2px 8px 2px 3px; border-radius: 999px; background: rgba(6, 20, 15, .55); border: 1.5px solid transparent; color: #f1f5ee; font-size: 11.5px; font-weight: 800; line-height: 1.15; max-width: 100%; white-space: nowrap; transition: left .3s, top .3s, border-color .2s, background .2s; z-index: 60; }
.seat.on { border-color: #f0c15a; background: rgba(240, 193, 90, .22); box-shadow: 0 0 12px rgba(240, 193, 90, .45); }
.seat.out { opacity: .65; }
.seat .av { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--c, #6b8f82); color: #fff; font: 800 12px var(--kb-font-body); }
.seat .tx { display: flex; flex-direction: column; min-width: 0; }
.seat .tx b { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.seat .tx i { font-style: normal; font-size: 10.5px; font-weight: 500; opacity: .85; overflow: hidden; text-overflow: ellipsis; }
.pill { position: absolute; transform: translate(-50%, -50%); padding: 4px 11px; border-radius: 999px; background: rgba(6, 20, 15, .62); color: #f6f3e6; font-size: 12px; font-weight: 800; white-space: nowrap; z-index: 61; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(240, 193, 90, .35); pointer-events: none; }
.pill.gold { background: rgba(240, 193, 90, .92); color: #2a1d00; border-color: transparent; }
.pill.warn { background: rgba(196, 47, 72, .9); border-color: transparent; }
.pill .su { width: 12px; height: 12px; fill: currentColor; }
.bubble { position: absolute; transform: translate(-50%, 0); padding: 2px 9px; border-radius: 10px; background: #fff; color: #172a23; font-size: 11.5px; font-weight: 800; white-space: nowrap; z-index: 62; pointer-events: none; animation: bub .25s ease-out; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.bubble.r { background: #f0c15a; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; font: 400 clamp(26px, 8vw, 46px) var(--kb-font-display); color: #fff6d6; text-shadow: 0 3px 0 #8c6414, 0 0 18px rgba(240, 193, 90, .8); white-space: nowrap; animation: banner 1.1s ease-out forwards; }
.chips { display: inline-flex; align-items: center; gap: 3px; }
.chips i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 12%, #d6455d 14% 100%); border: 2px dashed rgba(255, 255, 255, .85); box-sizing: border-box; display: inline-block; }
.dealerbtn { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #fff; color: #172a23; font: 800 9px var(--kb-font-body); margin-left: 2px; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; animation: fade .22s ease-out; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); }
.panel { width: 100%; max-width: 440px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cd-card); border: 1px solid var(--cd-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: var(--kb-shadow); overflow: hidden; animation: rise .3s cubic-bezier(.2, 1.3, .4, 1); }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--cd-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 25px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--cd-go); color: var(--cd-go-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 3px 0 var(--cd-go-shadow); text-decoration: none; touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd-go-shadow); }
.btn.sub { background: var(--cd-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--cd-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.opts { text-align: left; }
.og { margin: 8px 0 0; }
.og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--cd-panel); border: 1px solid var(--cd-line); }
.opt { flex: 1; min-width: 0; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; line-height: 1.2; }
.opt small { display: block; font-size: 10.5px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.tog { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 6px; padding: 4px 10px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--cd-line); background: var(--cd-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); text-align: left; cursor: pointer; }
.tog span { flex: 1; } .tog small { display: block; font-weight: 500; font-size: 11px; color: var(--kb-dim); }
.tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--kb-line); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog[aria-checked="true"] i { background: var(--kb-accent); } .tog[aria-checked="true"] i::after { transform: translateX(16px); }

      } else put(lay, c, x0 + col * (cw + gap), y0 + row * (ch + gap), { up: st.up[i] === 1, tap: mine && st.up[i] === 0, hl: hl(c), z: 5 });
    }
    for (let s = 0; s < n; s++) lay.seats.push(seatInfo(s, { x: (W / n) * (s + 0.5), y: 3, w: W / n - 6, on: !st.over && st.turn === s, sub: T('{n}組', { n: st.score[s] }) }));
    return lay;
  },
  status(st) {
    if (st.over) return { text: '' };
    if (st.pend) return { text: st.match ? T('そろった！') : T('ざんねん…') };
    if (st.turn === HUM) return { text: st.first >= 0 ? T('もう1枚めくろう') : T('カードを2枚めくろう'), you: true };
    return { text: T('{n}の番です', { n: nameOf(st.turn) }) };
  },
  controls: () => [],
  onCard(id) { const i = S.st.cells.indexOf(id); if (i >= 0 && S.st.up[i] === 0 && S.st.turn === HUM && !S.st.pend) S.play({ t: 'flip', i }); },
  cellOf: (st, id) => st.cells.indexOf(id),
};

// ---------- Sevens ----------
V.sevens = {
  size: (W, H) => clamp(Math.min(W / 7.2, (H - 60) / 4.4), 28, 70),
  layout(st, ctx) {
    const { W, H, cw } = ctx, ch = cw * 1.4, n = st.n, lay = mkLay(cw), G = E.games.sevens;
    const so = 0.46, oppY = 38 + ch * so / 2, bottomY = H - 6 - ch / 2;
    const h0 = st.hands[HUM].slice().sort((a, b) => a - b);
    const rows = fanRows(h0.length, W / 2, bottomY, W - 12, cw, ch, cw * 0.4, cw * 0.62, ch * 0.5);
    const handTop = Math.min.apply(null, rows.map(r => r.y).concat([bottomY])) - ch / 2 - 4;
    const oppBottom = oppY + ch * so / 2 + 2;
    const laneH = Math.max(40, handTop - oppBottom - 2);
    const lw = clamp(Math.min((W - 10) / 13, (laneH / 4 - 3) / 1.4), 12, cw * 0.92), lh = lw * 1.4 + 2, ls = lw / cw;
    const lx0 = (W - 13 * lw) / 2, ly0 = oppBottom + (laneH - 4 * lh) / 2 + lh / 2;
    const mineTurn = humanTurn(st);
    for (let su = 0; su < 4; su++) for (let r = 0; r < 13; r++) {
      const c = su * 13 + r, t = st.table[su], inT = t && r >= t.lo && r <= t.hi;
      const x = lx0 + (r + 0.5) * lw, y = ly0 + su * lh;
      if (inT) put(lay, c, x, y, { s: ls, up: true, z: 3 });
      else lay.slots.push({ x, y, w: lw - 1.5, h: lh - 3, on: mineTurn && st.hands[HUM].indexOf(c) >= 0 && G.playable(st, c), label: r === 6 ? '7' : '' });
    }
    h0.forEach((c, i) => {
      const can = mineTurn && G.playable(st, c);
      put(lay, c, rows[i].x, rows[i].y, { up: true, z: 10 + i, tap: can, dim: mineTurn && !can, hl: hl(c) });
    });
    for (let i = 1; i < n; i++) {
      const o = oppX(n, W, i), h = st.hands[i], xs = spread(h.length, o.x, o.w, cw * so, cw * so * 0.4);
      const out = st.out.indexOf(i) >= 0, bust = st.busted.indexOf(i) >= 0;
      h.forEach((c, k) => put(lay, c, xs[k], oppY, { s: so, up: false, z: 5 + k }));
      st.dead[i].forEach((c, k) => put(lay, c, o.x + o.w / 2 - cw * 0.3 + (hash(c) - 0.5) * 6, oppY + 2, { s: so, up: false, r: (hash(c + 3) - 0.5) * 40, z: 4 + k }));
      lay.seats.push(seatInfo(i, { x: o.x, y: 4, w: o.w, on: !st.over && st.turn === i, out: out || bust, sub: bust ? T('脱落') : out ? T('あがり！ {r}', { r: ordinal(st.out.indexOf(i) + 1) }) : cntTxt(h.length) + ' · ' + T('パス {n}', { n: st.pass[i] }) }));
    }
    lay.seats.push(seatInfo(HUM, { x: 6, y: oppBottom + 1, center: false, on: !st.over && st.turn === HUM, sub: st.out.indexOf(HUM) >= 0 ? T('あがり！ {r}', { r: ordinal(st.out.indexOf(HUM) + 1) }) : T('パス {n}/{m}', { n: st.pass[HUM], m: st.limit >= 99 ? '∞' : st.limit }) }));
    return lay;
  },
  status(st) {
    if (st.over) return { text: '' };
    if (st.turn === HUM) {
      const G = E.games.sevens, can = st.hands[HUM].some(c => G.playable(st, c));
      return can ? { text: T('出せるカードをえらんでね（光っているところへ）'), you: true } : { text: T('出せるカードがありません。パスしよう'), you: true };
    }
    return { text: T('{n}の番です', { n: nameOf(st.turn) }) };
  },
  controls(st) {
    if (!humanTurn(st)) return [];
    const G = E.games.sevens, can = st.hands[HUM].some(c => G.playable(st, c));
    const left = st.limit >= 99 ? '∞' : Math.max(0, st.limit - st.pass[HUM]);
    return [{ id: 'pass', label: T('パス'), sub: T('あと{n}回', { n: left }), cls: can ? '' : 'go pulse', dis: can, fn: () => S.play({ t: 'pass' }) }];
  },
  onCard(id) { const st = S.st; if (humanTurn(st) && st.hands[HUM].indexOf(id) >= 0 && E.games.sevens.playable(st, id)) S.play({ t: 'play', c: id }); else S.reject(id); },
};
V.sevens.onDrop = V.sevens.onCard;

// ---------- Daifugo ----------
V.daifugo = {
  size: (W, H) => clamp(Math.min(W / 6.8, (H - 60) / 4.2), 28, 72),
  playableSet(st) { // cards that belong to at least one legal play (human turn)
    const set = new Set(); E.games.daifugo.legal(st).forEach(m => { if (m.t === 'play') m.cards.forEach(c => set.add(c)); }); return set;
  },
  layout(st, ctx) {
    const { W, H, cw } = ctx, ch = cw * 1.4, n = st.n, lay = mkLay(cw);
    const so = 0.48, oppY = 40 + ch * so / 2, bottomY = H - 6 - ch / 2;
    const h0 = st.hands[HUM];
    const rows = fanRows(h0.length, W / 2, bottomY, W - 12, cw, ch, cw * 0.4, cw * 0.62, ch * 0.5);
    const handTop = Math.min.apply(null, rows.map(r => r.y).concat([bottomY])) - ch / 2;
    const oppBottom = oppY + ch * so / 2, midY = (oppBottom + handTop) / 2 + 4;
    const mine = humanTurn(st), ok = mine ? V.daifugo.playableSet(st) : null;
    h0.forEach((c, i) => {
      const sel = S.sel.has(c);
      put(lay, c, rows[i].x, rows[i].y - (sel ? ch * 0.24 : 0), { up: true, z: 10 + i, tap: mine && ok.has(c), sel, dim: mine && !ok.has(c), hl: hl(c) });
    });
    for (let i = 1; i < n; i++) {
      const o = oppX(n, W, i), h = st.hands[i], xs = spread(h.length, o.x, o.w, cw * so, cw * so * 0.4);
      const out = st.out.indexOf(i) >= 0;
      h.forEach((c, k) => put(lay, c, xs[k], oppY, { s: so, up: false, z: 5 + k }));
      lay.seats.push(seatInfo(i, { x: o.x, y: 4, w: o.w, on: !st.over && st.turn === i, out, sub: out ? rankTitle(n, st.out.indexOf(i)) || '' : st.passed[i] && st.field ? cntTxt(h.length) + ' · ' + T('パス') : cntTxt(h.length) }));
    }
    const f = st.field, fs = Math.min(1, (handTop - oppBottom - 14) / ch);
    const fc = Math.max(0.5, fs);
    if (f) {
      const xs = spread(f.cards.length, W / 2, Math.min(W - cw * 3, cw * fc * 0.55 * (f.cards.length - 1) + cw * fc), cw * fc, cw * fc * 0.6);
      f.cards.forEach((c, k) => put(lay, c, xs[k], midY, { s: fc, up: true, z: 20 + k }));
    }
    const fld = new Set(f ? f.cards : []);
    const gone = st.gone.filter(c => !fld.has(c));
    gone.forEach((c, k) => put(lay, c, cw * 0.7 + (hash(c * 5) - 0.5) * cw * 0.5, midY + (hash(c * 11) - 0.5) * ch * 0.2, { s: 0.42, up: false, r: (hash(c * 3) - 0.5) * 70, z: 2 + k }));
    // badges
    const badges = [];
    if (st.rev) badges.push({ html: T('革命中'), cls: 'gold' });
    if (st.jb) badges.push({ html: T('11バック中'), cls: 'gold' });
    if (st.lock) badges.push({ html: T('縛り') + ' ' + [0, 1, 2, 3].filter(s => st.lock & (1 << s)).map(sideSuit).join(''), cls: 'warn' });
    if (!f) badges.push({ html: T('場は空です') });
    badges.forEach((b, i) => lay.pills.push({ x: W / 2 + (i - (badges.length - 1) / 2) * Math.min(110, W / (badges.length + 0.4)), y: oppBottom + 14, html: b.html, cls: b.cls }));
    if (f) lay.pills.push({ x: W / 2, y: midY + ch * fc / 2 + 12, html: f.n > 1 ? T('{n}が出した：{m}枚', { n: nameOf(f.seat), m: f.n }) : T('{n}が出した：1枚', { n: nameOf(f.seat) }) });
    return lay;
  },
  status(st) {
    if (st.over) return { text: '' };
    if (st.turn === HUM) return { text: S.sel.size ? T('{n}枚えらびました。「出す」を押そう', { n: S.sel.size }) : st.field ? T('場より強いカードを出そう（出せなければパス）') : T('好きなカードを出して場を始めよう'), you: true };
    return { text: T('{n}の番です', { n: nameOf(st.turn) }) };
  },
  controls(st) {
    if (!humanTurn(st)) return [];
    const play = S.selMove();
    return [
      { id: 'play', label: T('出す'), sub: S.sel.size ? T('{n}枚', { n: S.sel.size }) : '', cls: 'go', dis: !play, fn: () => S.playSel() },
      { id: 'clear', label: T('クリア'), dis: !S.sel.size, fn: () => { S.sel.clear(); S.refresh(); } },
      { id: 'pass', label: T('パス'), dis: !st.field, fn: () => S.play({ t: 'pass' }) },
    ];
  },
  onCard(id) { // tap = select / unselect; tapping a different number starts a new selection
    const st = S.st; if (!humanTurn(st)) return;
    if (S.sel.has(id)) S.sel.delete(id);
    else {
      const G = E.games.daifugo, pos = G.posOf(id);
      // keep only cards that can still form a play with the new one
      const next = new Set(S.sel); next.add(id);
      const cards = [...next];
      const sameNum = cards.every(c => G.posOf(c) === pos || c === 52 || id === 52);
      const any = G.legal(st).some(m => m.t === 'play' && cards.every(c => m.cards.indexOf(c) >= 0));
      if (!any || (!sameNum && !st.rules.seq)) { S.sel.clear(); S.sel.add(id); } else S.sel.add(id);
    }
    if (DEBUG) (S.dbg = S.dbg || []).push([id, [...S.sel]]);
    sfx('tap'); S.refresh();
  },
  onDrop(id) { // drag onto the table: that card (and the set it belongs to) is played if it is legal
    const st = S.st; if (!humanTurn(st)) return;
    if (!S.sel.has(id)) { S.sel.clear(); V.daifugo.onCard(id); }
    if (S.selMove()) S.playSel(); else { S.reject(id); S.refresh(); }
  },
};

// ---------- Poker ----------
V.poker = {

    const reveal = st.phase === 'result' && st.last && !st.last.unc, rv = reveal ? st.last.revealed : [];
    const myTurnDraw = humanTurn(st) && st.phase === 'draw', tapEnabled = myTurnDraw;
    const xs0 = spread(5, W / 2, Math.min(W - 24, cw * 4.6), cw, cw * 1.05);
    const showMine = st.dealt[HUM] && !st.folded[HUM] || st.phase === 'result';
    st.hands[HUM].forEach((c, i) => put(lay, c, xs0[i], bottomY - (S.marks.has(c) ? ch * 0.1 : 0), { up: true, z: 10 + i, tap: tapEnabled, mark: S.marks.has(c) && myTurnDraw, dim: st.folded[HUM], hl: hl(c) }));
    void showMine;
    for (let i = 1; i < n; i++) {
      const o = oppX(n, W, i), h = st.hands[i], xs = spread(h.length, o.x, o.w, cw * so, cw * so * 0.62);
      const up = rv.indexOf(i) >= 0;
      h.forEach((c, k) => put(lay, c, xs[k], oppY, { s: so, up, z: 5 + k, dim: st.folded[i] && !up }));
      const busted = st.bust.indexOf(i) >= 0;
      const nm = up ? st.last.names[i] : '';
      lay.seats.push(seatInfo(i, { x: o.x, y: 4, w: o.w, on: !st.over && st.phase !== 'result' && st.turn === i, out: busted || st.folded[i], sub: busted ? T('脱落') : (nm ? nm : (st.folded[i] ? T('おりた') : '◉ ' + fmtN(st.stacks[i]) + (S.act[i] ? ' · ' + S.act[i] : ''))) + (st.dealer === i ? ' Ⓓ' : '') }));

    const midY = (oppY + ch * so / 2 + (bottomY - ch / 2)) / 2 + 2;
    lay.pills.push({ x: W / 2, y: midY, html: '<span class="chips"><i></i><i></i></span>' + T('ポット {n}', { n: fmtN(st.pot) }), cls: 'gold' });
    if (st.phase === 'result' && st.last) {
      const wnm = st.last.winners.map(nameOf).join(' / ');
      lay.pills.push({ x: W / 2, y: midY + 26, html: (st.last.winners.indexOf(HUM) >= 0 ? T('あなたの勝ち！') : T('{n}の勝ち', { n: wnm })) + (st.last.names[st.last.winners[0]] ? ' · ' + st.last.names[st.last.winners[0]] : '') });
    }
    return lay;
  },
  status(st) {

    const ph = { bet1: T('1回目のベット'), draw: T('カードの交換'), bet2: T('2回目のベット'), result: T('勝負！') }[st.phase] || '';
    if (st.phase === 'result') return { text: ph };
    if (st.turn === HUM) {
      if (st.phase === 'draw') return { text: ph + ' — ' + (S.marks.size ? T('{n}枚を交換します', { n: S.marks.size }) : T('交換するカードをタップ（0枚でもOK）')), you: true };
      return { text: ph + ' — ' + T('あなたの番です'), you: true };

  },
  controls(st) {

    if (st.phase === 'result') return [{ id: 'next', label: st.handNo >= st.hands_n ? T('結果を見る') : T('次のハンド'), cls: 'go', fn: () => S.play({ t: 'next' }) }];
    if (st.phase === 'draw') return [
      { id: 'draw', label: S.marks.size ? T('{n}枚を交換', { n: S.marks.size }) : T('このまま（交換なし）'), cls: 'go', fn: () => S.play({ t: 'draw', d: st.hands[HUM].filter(c => S.marks.has(c)) }) },

    const out = [];

    if (has('call')) out.push({ id: 'call', label: T('コール'), sub: String(Math.min(tc, st.stacks[HUM])), fn: () => S.play({ t: 'act', a: 'call' }) });

// ---------- Blackjack ----------
V.blackjack = {
  size: (W, H, st) => clamp(Math.min(W / (st.n <= 2 ? 6 : 7.8), (H - 70) / 3.9), 28, 74),
  layout(st, ctx) {
    const { W, H, cw } = ctx, ch = cw * 1.4, n = st.n, lay = mkLay(cw), BJ = E.games.blackjack;
    const hideHole = st.phase === 'play' || st.phase === 'bet';
    const dealerY = 40 + ch * 0.5;
    if (st.dealer.length) {
      const xs = spread(st.dealer.length, W / 2, Math.min(W - 30, cw * 4), cw, cw * 0.62);
      st.dealer.forEach((c, i) => put(lay, c, xs[i], dealerY, { up: !(hideHole && i === 1), z: 5 + i }));
    }
    const dT = st.dealer.length ? (hideHole ? BJ.val(st.dealer[0]) + (BJ.val(st.dealer[0]) === 1 ? '/11' : '') : BJ.total(st.dealer).n + (BJ.isBJ(st.dealer) ? ' BJ' : '')) : '';
    lay.seats.push({ key: 'dealer', x: W / 2, y: 3, center: true, name: T('ディーラー'), av: 'D', color: '#7c6bd1', on: st.phase === 'dealer', sub: dT === '' ? '' : T('合計 {n}', { n: dT }) });
    const sw = W / n, handY = dealerY + ch * 0.5 + ch * 0.62 + 18;
    const hs = st.hh;
    for (let s = 0; s < n; s++) {
      const cx = sw * (s + 0.5), inn = st.in[s], hands = hs[s] || [];
      const sc = n >= 4 ? 0.8 : 0.9;
      hands.forEach((h, hi) => {
        const rowY = handY + hi * (ch * sc * 0.46 + 2) + (hands.length > 1 ? 0 : ch * 0.04);
        const xs = spread(h.cards.length, cx, sw - 8, cw * sc, cw * sc * 0.55);
        h.cards.forEach((c, i) => put(lay, c, xs[i], rowY, { up: true, z: 5 + i + hi * 10 }));
        const T0 = BJ.total(h.cards), isCur = st.phase === 'play' && st.turn === s && st.hi === hi;
        if (h.cards.length) lay.pills.push({ x: cx + (hands.length > 1 ? (hi ? 1 : -1) * 0 : 0), y: rowY + ch * sc / 2 + 11 + (hands.length > 1 ? 0 : 0), html: (T0.n > 21 ? T('バースト') : (T0.soft && T0.n < 21 ? T0.n - 10 + '/' + T0.n : T0.n)) + (h.dbl ? ' ×2' : ''), cls: isCur ? 'gold' : T0.n > 21 ? 'warn' : '' });
      });
      const bet = (hands.length ? hands.reduce((a, h) => a + h.bet, 0) : st.bets[s]) || 0;
      const sub = st.bust.indexOf(s) >= 0 ? T('脱落') : st.last && st.last.res && st.last.res[s] ? resTxt(st.last.res[s], st.last.deltas[s]) : fmtN(st.stacks[s]) + (bet ? ' / ' + bet : '');
      lay.seats.push(seatInfo(s, { x: cx, y: H - 34, w: sw - 6, on: !st.over && (st.phase === 'bet' || st.phase === 'play') && st.turn === s, out: !inn, sub }));
    }
    return lay;
  },
  status(st) {
    if (st.over) return { text: '' };
    if (st.phase === 'bet') return st.turn === HUM ? { text: T('かけるチップをえらぼう'), you: true } : { text: T('{n}がかけています…', { n: nameOf(st.turn) }) };
    if (st.phase === 'dealer') return { text: T('ディーラーの番です') };
    if (st.phase === 'result') return { text: st.last.res[HUM] ? (st.last.res[HUM].some(r => r === 'win' || r === 'bj') ? T('あなたの勝ち！') : st.last.res[HUM].every(r => r === 'push') ? T('引き分け') : T('ディーラーの勝ち')) : T('ラウンド終了') };
    if (st.turn === HUM) return { text: T('ヒットかスタンドをえらぼう'), you: true };
    return { text: T('{n}の番です', { n: nameOf(st.turn) }) };
  },
  controls(st) {
    const BJ = E.games.blackjack;
    if (st.phase === 'result') return st.humans.length ? [{ id: 'next', label: st.roundNo >= st.hands_n ? T('結果を見る') : T('次のラウンド'), cls: 'go', fn: () => S.play({ t: 'next' }) }] : [];
    if (!humanTurn(st)) return [];
    if (st.phase === 'bet') return BJ.BETS.map(b => ({ id: 'bet' + b, label: String(b), cls: b === 20 ? 'go chipbtn' : 'chipbtn', dis: b > st.stacks[HUM], fn: () => S.play({ t: 'bet', amt: b }) }));

function solCurDefault(st, k, i) { const col = st.p[k][i]; return { k, i, p: Math.max(0, col.length - 1) }; }
function solSay() {
  if (!S || !S.sol || !S.cur) return;
  const st = S.st, c = S.cur, col = st.p[c.k][c.i], nm = { T: L('列', 'Column'), F: L('土台', 'Foundation'), C: L('セル', 'Cell'), S: L('山札', 'Stock'), W: L('捨て札', 'Waste') }[c.k] + ' ' + (c.i + 1);
  const card = col.length && (c.k !== 'T' || c.p >= st.dn[c.i]) && c.k !== 'S' ? ART.label(SOL.faceOf(st, col[Math.min(c.p, col.length - 1)]), EN ? 'en' : 'ja') : (col.length ? L('伏せたカード', 'face-down card') : L('空', 'empty'));

}
function solKeydown(e) {
  if (!S || !S.sol || S.over || anyOverlay() || e.altKey || e.metaKey && e.key !== 'z') return;
  const k = e.key, tg = e.target, onBtn = tg && tg.closest && tg.closest('button, a, select, input, textarea');
  const piles = solPiles(S.st), st = S.st;
  const move = d => {
    if (!S.cur) S.cur = solCurDefault(st, 'T', 0);
    let ix = piles.findIndex(p => p[0] === S.cur.k && p[1] === S.cur.i); if (ix < 0) ix = 0;
    ix = (ix + d + piles.length) % piles.length;
    S.cur = solCurDefault(st, piles[ix][0], piles[ix][1]); S.kb = true; refresh(); solSay();
  };
  if (k === 'ArrowLeft') { e.preventDefault(); move(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    if (!S.cur) S.cur = solCurDefault(st, 'T', 0);

    S.kb = true; refresh(); solSay();
  } else if (k === 'Enter' || (k === ' ' && !onBtn)) {
    if (onBtn && k === 'Enter') return;
    e.preventDefault();
    if (!S.cur) { S.cur = solCurDefault(st, 'T', 0); S.kb = true; refresh(); solSay(); return; }
    S.kb = true;
    const c = S.cur, col = st.p[c.k][c.i];
    if (S.pick) { solPlace([c.k, c.i]); return; }
    if (c.k === 'S') { solStock(); return; }
    const id = col.length ? col[Math.min(c.p, col.length - 1)] : null;
    if (k === ' ') { if (id != null) solTap({ k: c.k, i: c.i, p: c.p, id }); return; }
    const n = id != null ? solRun(c.k, c.i, c.p) : 0;
    if (n) { S.pick = { k: c.k, i: c.i, p: c.p, n }; solClearHint(); sfx('select'); refresh(); } else { if (id != null) reject(id); else sfx('error'); }

  else if (k.toLowerCase() === 'h' && !e.ctrlKey) { e.preventDefault(); solHint(); }
  else if (k.toLowerCase() === 'a' && !e.ctrlKey) { e.preventDefault(); solAuto(); }
  else if (k.toLowerCase() === 'd' && !e.ctrlKey) { e.preventDefault(); solStock(); }
}
