<style>
/* おもちゃ大乱闘: a night-workshop chrome around a full-bleed canvas. --kb-* are the shared tokens re-tinted; --bw-* are this game's own. */
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #1b1830; --kb-surface: #262244; --kb-surface-2: #302b56; --kb-sunken: #12101f; --kb-line: #4a4378;
  --kb-ink: #f6f1ff; --kb-dim: #c3badf;
  --kb-accent: #ffb23f; --kb-accent-ink: #2b1a02; --kb-accent-text: #ffc866; --kb-accent-soft: rgba(255, 178, 63, .16);
  --kb-scrim: rgba(12, 10, 24, .72); --kb-focus: #ffe08a;
  --bw-panel: rgba(255, 255, 255, .08); --bw-line: rgba(255, 255, 255, .18); --bw-card: linear-gradient(#2f2a55, #231f42);
  --bw-go: linear-gradient(#ffc45c, #f08a24); --bw-go-shadow: #8a4a0c; --bw-good: #8fe0a0; --bw-bad: #ff8a8a;
  --bw-title: linear-gradient(90deg, #ffd38a, #ffb23f 45%, #ff7a8a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #f6f0e4; --kb-surface: #fffaf0; --kb-surface-2: #f4ead8; --kb-sunken: #e6dbc6; --kb-line: #d8c8aa;
    --kb-ink: #35280f; --kb-dim: #6b5a3a;
    --kb-accent: #c4620b; --kb-accent-ink: #ffffff; --kb-accent-text: #9a4a08; --kb-accent-soft: rgba(196, 98, 11, .12);
    --kb-scrim: rgba(53, 40, 15, .45); --kb-focus: #1f6fbf;
    --bw-panel: rgba(53, 40, 15, .06); --bw-line: #dccdb0; --bw-card: linear-gradient(#fffaf0, #f6ecd8);
    --bw-go: linear-gradient(#e98a2a, #c4620b); --bw-go-shadow: #7f3f08; --bw-good: #2f8a3a; --bw-bad: #c2412a;
    --bw-title: linear-gradient(90deg, #a84a08, #c4620b 45%, #b02a4a);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #f6f0e4; --kb-surface: #fffaf0; --kb-surface-2: #f4ead8; --kb-sunken: #e6dbc6; --kb-line: #d8c8aa;
  --kb-ink: #35280f; --kb-dim: #6b5a3a;
  --kb-accent: #c4620b; --kb-accent-ink: #ffffff; --kb-accent-text: #9a4a08; --kb-accent-soft: rgba(196, 98, 11, .12);
  --kb-scrim: rgba(53, 40, 15, .45); --kb-focus: #1f6fbf;
  --bw-panel: rgba(53, 40, 15, .06); --bw-line: #dccdb0; --bw-card: linear-gradient(#fffaf0, #f6ecd8);
  --bw-go: linear-gradient(#e98a2a, #c4620b); --bw-go-shadow: #7f3f08; --bw-good: #2f8a3a; --bw-bad: #c2412a;
  --bw-title: linear-gradient(90deg, #a84a08, #c4620b 45%, #b02a4a);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
#stageWrap { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: #0f0d1c; }
#board { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
header { position: absolute; z-index: 6; top: var(--kb-sat); left: var(--kb-sal); right: var(--kb-sar); display: flex; align-items: center; gap: 4px; padding: 2px 4px; pointer-events: none; }
header > * { pointer-events: auto; }
.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: #fff; text-decoration: none; background: rgba(15, 12, 30, .5); border: 1px solid rgba(255, 255, 255, .22); padding: 0; cursor: pointer; backdrop-filter: blur(4px); }
.back svg, .icon svg { width: 22px; height: 22px; }
.icon:active, .back:active { transform: scale(.94); }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(15, 12, 30, .55); border: 1px solid rgba(255, 255, 255, .22); color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
#modeChip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp { flex: 1 1 auto; }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }
#count { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; font: 400 clamp(56px, 22vmin, 160px) var(--kb-font-display); color: #ffd23f; -webkit-text-stroke: 4px #2a1d17; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
#count.pop { animation: cpop .55s cubic-bezier(.2, 1.6, .4, 1); }
#hint { position: absolute; z-index: 7; left: 50%; top: calc(var(--kb-sat) + 52px); transform: translateX(-50%); max-width: 92%; padding: 6px 12px; border-radius: 999px; background: rgba(15, 12, 30, .8); border: 1px solid rgba(255, 255, 255, .25); color: #fff; font-size: 12.5px; font-weight: 800; text-align: center; pointer-events: none; animation: fade .3s; }
#combo { position: absolute; z-index: 5; left: 12px; top: calc(var(--kb-sat) + 56px); color: #fff; font-weight: 800; font-size: 14px; text-shadow: 0 2px 0 #2a1d17; pointer-events: none; }
#combo b { font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: #ffd23f; }

/* touch controls */
#pad { position: absolute; z-index: 4; inset: 0; pointer-events: none; }
.zone { position: absolute; bottom: 0; pointer-events: auto; touch-action: none; }
.zone.l { left: 0; width: 46%; height: 62%; }
.zone.r { right: 0; width: 54%; height: 62%; }
.stick { position: absolute; width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); border-radius: 50%; background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .35); pointer-events: none; transform: translate(-50%, -50%); }
.stick i { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: rgba(255, 255, 255, .55); border: 2px solid rgba(255, 255, 255, .85); }
.btns { position: absolute; display: grid; gap: calc(var(--u) * .12); pointer-events: none; }
.tb { pointer-events: auto; touch-action: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .16); color: #fff; font: 800 clamp(9px, calc(var(--u) * .19), 14px) var(--kb-font-body); word-break: keep-all; overflow-wrap: normal; text-shadow: 0 1px 0 rgba(0, 0, 0, .5); padding: 0; -webkit-user-select: none; user-select: none; cursor: pointer; backdrop-filter: blur(2px); min-width: 0; min-height: 0; line-height: 1.1; text-align: center; }
.tb.on { background: rgba(255, 210, 63, .55); border-color: #fff; transform: scale(.94); }
.tb.a { background: rgba(255, 90, 90, .28); } .tb.s { background: rgba(80, 160, 255, .26); } .tb.m { background: rgba(255, 178, 63, .26); } .tb.j { background: rgba(79, 207, 106, .24); } .tb.h { background: rgba(160, 120, 255, .26); }
body.notouch #pad { display: none; }
#pad { --u: clamp(50px, 14vmin, 76px); }
body.p2 #pad { --u: clamp(40px, 9.5vmin, 60px); }
@media (orientation: portrait) {
  #pad { position: relative; inset: auto; flex: 0 0 auto; height: min(40dvh, 300px); height: min(40vh, 300px); background: linear-gradient(#171428, #0f0d1c); border-top: 1px solid rgba(255, 255, 255, .15); }
  .zone.l, .zone.r { height: 100%; }
}

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; padding: calc(var(--kb-sat) + 6px) calc(var(--kb-sar) + 8px) calc(var(--kb-sab) + 6px) calc(var(--kb-sal) + 8px); overscroll-behavior: contain; animation: fade .2s; touch-action: manipulation; }
.card { width: 100%; max-width: 460px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bw-card); border: 1px solid var(--bw-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; box-shadow: 0 14px 44px rgba(0, 0, 0, .45); animation: rise .25s ease-out; }
.card.wide { max-width: 640px; }
.card > * { flex: none; }
.card .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 2px; }
.card h2 { margin: 0 0 2px; font-family: var(--kb-font-display); font-weight: 400; font-size: 22px; color: var(--kb-accent-text); overflow-wrap: anywhere; }
.card h2.logo { background: var(--bw-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 30px; line-height: 1.2; }
.card p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 6px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--bw-go); color: #2a1606; font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--bw-go-shadow); touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--bw-go-shadow); }
.btn.sub { background: var(--bw-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--bw-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; border: 0; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.btn small { font-size: 11px; font-weight: 500; opacity: .85; display: block; }
.btn .stk { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.btn:disabled { opacity: .45; cursor: default; }
.row2 { display: flex; gap: 8px; } .row2 > .btn, .row2 > a.btn { flex: 1; min-width: 0; text-decoration: none; }
.menu { display: grid; grid-template-columns: 1fr; gap: 0; }
.sec { margin-top: 8px; text-align: left; }
.sec > label, .sec > .lbl { display: block; font-size: 12px; font-weight: 800; color: var(--kb-dim); margin: 0 2px 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.grid6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pk { position: relative; min-width: 44px; min-height: 44px; box-sizing: border-box; border-radius: 14px; border: 2px solid var(--bw-line); background: var(--bw-panel); color: var(--kb-ink); padding: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; font: 800 11px var(--kb-font-body); touch-action: manipulation; }
.pk canvas { width: 100%; max-width: 54px; aspect-ratio: 1; display: block; }
.pk.sel { border-color: var(--kb-accent); background: var(--kb-accent-soft); box-shadow: 0 0 0 2px var(--kb-accent-soft); }
.pk:disabled { opacity: .55; cursor: default; }
.pk .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.pk.stg { min-width: 0; }
#pickStage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { #pickStage { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.pk.stg canvas { max-width: none; aspect-ratio: 7 / 4; border-radius: 8px; }
.seg { display: flex; border: 1px solid var(--bw-line); border-radius: 12px; overflow: hidden; background: var(--bw-panel); }
.seg button { flex: 1; min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 0 6px; touch-action: manipulation; }
.seg button + button { border-left: 1px solid var(--bw-line); }

        if (evs.some(e => e.t === 'hit' && e.p > 7) && k > 240) { hit++; if (hit === 1) for (let j = 0; j < 4; j++) { const ee = E.step(st, st.fighters.map((f, i) => E.cpu(st, i))); for (const e of ee) ART.event(e, st); ART.tick(st); } break; }
      }
      needDraw = true; return true;
    },
  };
}
})();
