<style>
:root, :root[data-kb-theme="dark"] {
  --kb-bg: #16222e; --kb-surface: #213243; --kb-surface-2: #2a3f54; --kb-sunken: #101a24; --kb-line: #3d566f;
  --kb-ink: #f3f1e8; --kb-dim: #b7c4d1;

  --kb-scrim: rgba(8, 14, 22, .74); --kb-focus: #8fd0ff;
  --hp-panel: rgba(255, 255, 255, .07); --hp-card: linear-gradient(#27394d, #1f2f40); --hp-go: linear-gradient(#ffe27a, #f5b324); --hp-go-shadow: #8a5f05;
  --hp-good: #7be0a0; --hp-bad: #ff8f80; --hp-star: #ffc83d; --hp-star-off: #4a5d72; --hp-key: rgba(255, 255, 255, .13); --hp-key-on: rgba(255, 210, 63, .5);
  --hp-title: linear-gradient(90deg, #ffe27a, #ffb347 50%, #ff7a9a);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-kb-theme="dark"]) {
    --kb-bg: #e9f3fb; --kb-surface: #ffffff; --kb-surface-2: #d9e9f6; --kb-sunken: #cfe0ee; --kb-line: #b4cadd;
    --kb-ink: #23313f; --kb-dim: #5b6f82;
    --kb-accent: #c78900; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5b00; --kb-accent-soft: rgba(199, 137, 0, .12);
    --kb-scrim: rgba(35, 49, 63, .45); --kb-focus: #1f6fbf;
    --hp-panel: rgba(35, 49, 63, .06); --hp-card: linear-gradient(#ffffff, #eef6fc); --hp-go: linear-gradient(#f0b72f, #c78900); --hp-go-shadow: #7d5400;
    --hp-good: #2c8a52; --hp-bad: #c2412a; --hp-star: #d08a00; --hp-star-off: #c3d3e0; --hp-key: rgba(35, 49, 63, .12); --hp-key-on: rgba(199, 137, 0, .45);
    --hp-title: linear-gradient(90deg, #a56a00, #d08a00 50%, #d1456b);
    color-scheme: light;
  }
}
:root[data-kb-theme="light"] {
  --kb-bg: #e9f3fb; --kb-surface: #ffffff; --kb-surface-2: #d9e9f6; --kb-sunken: #cfe0ee; --kb-line: #b4cadd;
  --kb-ink: #23313f; --kb-dim: #5b6f82;
  --kb-accent: #c78900; --kb-accent-ink: #ffffff; --kb-accent-text: #8a5b00; --kb-accent-soft: rgba(199, 137, 0, .12);
  --kb-scrim: rgba(35, 49, 63, .45); --kb-focus: #1f6fbf;
  --hp-panel: rgba(35, 49, 63, .06); --hp-card: linear-gradient(#ffffff, #eef6fc); --hp-go: linear-gradient(#f0b72f, #c78900); --hp-go-shadow: #7d5400;
  --hp-good: #2c8a52; --hp-bad: #c2412a; --hp-star: #d08a00; --hp-star-off: #c3d3e0; --hp-key: rgba(35, 49, 63, .12); --hp-key-on: rgba(199, 137, 0, .45);
  --hp-title: linear-gradient(90deg, #a56a00, #d08a00 50%, #d1456b);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
:focus-visible { outline: 2px solid var(--kb-focus); outline-offset: 2px; }

.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--kb-ink); text-decoration: none; background: var(--hp-panel); border: 1px solid var(--kb-line); padding: 0; cursor: pointer; }
.back svg, .icon svg { width: 22px; height: 22px; }
#stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: #79c8ff; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#pauseBtn { position: absolute; top: calc(6px + var(--kb-sat) * 0); right: 8px; z-index: 5; width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.55); background: rgba(20,30,45,.45); color: #fff; display: none; place-items: center; padding: 0; cursor: pointer; }
body.playing #pauseBtn { display: grid; }
#pauseBtn svg { width: 22px; height: 22px; }
#toastbar { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 999px; background: rgba(20,30,45,.8); color: #fff; font: 800 13px var(--kb-font-body); pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
/* touch controls */
#touch { flex: none; display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 10px; touch-action: none; }
body.touch.playing #touch { display: flex; }
#touch { --u: 1; }
#dpad { position: relative; flex: none; width: calc(132px * var(--u)); height: calc(104px * var(--u)); touch-action: none; }
#dpad button { position: absolute; width: calc(44px * var(--u)); height: calc(44px * var(--u)); border-radius: 14px; border: 1px solid var(--kb-line); background: var(--hp-key); color: var(--kb-ink); display: grid; place-items: center; padding: 0; pointer-events: none; }
#dpad button svg { width: 22px; height: 22px; }
#dpad button.on { background: var(--hp-key-on); border-color: var(--kb-accent); }
#dpad .u { left: calc(44px * var(--u)); top: 0; } #dpad .l { left: 0; top: calc(30px * var(--u)); } #dpad .r { left: calc(88px * var(--u)); top: calc(30px * var(--u)); } #dpad .d { left: calc(44px * var(--u)); top: calc(60px * var(--u)); }
#btns { position: relative; flex: none; width: calc(172px * var(--u)); height: calc(104px * var(--u)); touch-action: none; }
.tb { position: absolute; border-radius: 50%; border: 2px solid var(--kb-line); background: var(--hp-key); color: var(--kb-ink); font: 800 11px var(--kb-font-body); white-space: nowrap; display: grid; place-items: center; padding: 0; touch-action: none; cursor: pointer; }
.tb.on { background: var(--hp-key-on); border-color: var(--kb-accent); }
#bJ { right: 0; bottom: 0; width: calc(82px * var(--u)); height: calc(82px * var(--u)); font-size: 15px; }
#bRun { right: calc(88px * var(--u)); bottom: calc(2px * var(--u)); width: calc(60px * var(--u)); height: calc(60px * var(--u)); }
#bAct { right: calc(92px * var(--u)); bottom: calc(66px * var(--u)); width: calc(44px * var(--u)); height: calc(44px * var(--u)); }
#bAct[hidden] { display: none; }
@media (max-width: 359px) { #touch { --u: .92; padding: 4px 8px 8px; gap: 4px; } }
@media (orientation: landscape) and (max-height: 560px) {
  body.touch.playing #touch { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(10px, var(--kb-sal)) max(8px, var(--kb-sab)) max(10px, var(--kb-sal)); pointer-events: none; z-index: 4; }
  #dpad, #btns { pointer-events: auto; } #dpad button, .tb { background: rgba(20,30,45,.38); color: #fff; border-color: rgba(255,255,255,.5); } #dpad button.on, .tb.on { background: rgba(255,210,63,.55); }
}
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s; touch-action: pan-y; }
.panel { width: 100%; max-width: 480px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--hp-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.panel h2 { margin: 0 0 2px; font: 400 22px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--hp-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 27px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 48px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--hp-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--hp-go-shadow); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--hp-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--hp-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }
.qm:first-child { margin-top: 0; } .qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); }
.qm.plain { border-color: var(--kb-line); background: var(--hp-panel); }
.stars { display: flex; gap: 6px; justify-content: center; margin: 4px 0; }
.stars svg { width: 46px; height: 46px; } .stars .on { fill: var(--hp-star); stroke: #8a5600; } .stars .off { fill: var(--hp-star-off); stroke: transparent; }
.stars svg.pop { animation: starpop .5s ease-out both; }
.big { font: 400 28px var(--kb-font-display); line-height: 1.15; color: var(--kb-ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 6px 6px; text-align: left; font-size: 13px; font-weight: 800; }
.kv span:nth-child(odd) { color: var(--kb-dim); font-weight: 500; } .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.wd { margin: 8px 0 12px; text-align: left; }
.wd .wh { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 4px; flex-wrap: wrap; }
.wd .wh b { font: 400 16px var(--kb-font-display); color: var(--kb-accent-text); } .wd .wh small { color: var(--kb-dim); font-size: 11.5px; }
.wd .wh .sum { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--hp-star); white-space: nowrap; }
.nodes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.nd { position: relative; min-height: 64px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid var(--kb-line); background: var(--hp-panel); color: var(--kb-ink); padding: 6px 8px; text-align: left; cursor: pointer; font: 800 13px var(--kb-font-body); display: flex; flex-direction: column; gap: 2px; }
.nd .id { font: 400 15px var(--kb-font-display); color: var(--kb-accent-text); } .nd .nm { font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
.nd .meta { display: flex; align-items: center; gap: 4px; margin-top: auto; font-size: 11px; color: var(--kb-dim); }
.nd .meta svg { width: 13px; height: 13px; } .nd .meta .on { fill: var(--hp-star); stroke: #8a5600; } .nd .meta .off { fill: var(--hp-star-off); stroke: transparent; }
.nd .med i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 2px; background: var(--hp-star-off); } .nd .med i.on { background: var(--hp-star); }
.nd.done { border-color: var(--hp-good); } .nd.boss .id::after { content: ' ★BOSS'; font-size: 10px; color: var(--hp-bad); }
.nd:disabled, .nd.lock { opacity: .45; cursor: default; }
.nd .lk { position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--hp-panel); border: 1px solid var(--kb-line); flex-wrap: wrap; }
.opt { flex: 1 1 0; min-width: 40px; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.og { margin: 8px 0 0; text-align: left; } .og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.howto { max-width: 480px; text-align: left; } .howto h2 { text-align: center; }
.howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--kb-ink); } .howto li { margin: 3px 0; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#editor { position: fixed; inset: 0; z-index: 70; background: var(--kb-bg); display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); overflow-y: auto; touch-action: pan-y; }
#editor > * { flex: none; }
.edbar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; } .edt { font: 400 17px var(--kb-font-display); color: var(--kb-accent-text); }
.edbtns, .edopts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px; align-items: center; font-size: 12.5px; font-weight: 800; } .edbtns .btn { width: auto; flex: 1 1 90px; margin: 0; min-height: 44px; } .edopts select, .edopts .btn { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-surface); color: var(--kb-ink); font: 800 13px var(--kb-font-body); padding: 2px 6px; width: auto; margin: 0; }
.edpal { display: flex; gap: 4px; padding: 4px 8px; overflow-x: auto; touch-action: pan-x; } .edp { flex: none; min-width: 52px; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--kb-line); background: var(--hp-panel); color: var(--kb-ink); padding: 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; } .edp.on { border-color: var(--kb-accent); background: var(--kb-accent-soft); } .edp i { font: 800 15px monospace; font-style: normal; } .edp small { font-size: 9.5px; color: var(--kb-dim); white-space: nowrap; }
.edmsg { min-height: 36px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; color: var(--kb-ink); overflow-wrap: anywhere; } .edcv { padding: 0 8px; overflow: hidden; } #edCv { display: block; touch-action: none; border-radius: 8px; border: 1px solid var(--kb-line); } #edScroll { width: calc(100% - 16px); margin: 6px 8px; accent-color: var(--kb-accent); min-height: 32px; }
.edslots .fld { display: flex; gap: 6px; margin-top: 6px; } .edslots input { flex: 1 1 auto; min-width: 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); padding: 4px 8px; user-select: text; -webkit-user-select: text; } .edslots .btn { margin-top: 4px; width: auto; flex: 1; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes starpop { from { transform: scale(.3) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.25) rotate(8deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel, .overlay, .stars svg.pop { animation: none !important; } }
@media (max-width: 379px) { h1 { font-size: 15px; } }
body.thumb header, body.thumb #touch, body.thumb #pauseBtn { display: none !important; }
</style>

<body>
<div id="app">
  <header>
    <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 data-i18n>ぴょんぴょん冒険</h1>
    <button class="icon" id="sndBtn" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv" tabindex="0" role="application" aria-label="ぴょんぴょん冒険の画面" data-i18n-attr="aria-label"></canvas>
    <button id="pauseBtn" type="button" aria-label="一時停止" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <div id="toastbar" hidden role="status"></div>
  </div>
  <div id="touch" aria-label="タッチ操作" data-i18n-attr="aria-label">
    <div id="dpad" role="group" aria-label="十字ボタン" data-i18n-attr="aria-label">
      <button class="u" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 6l8 10H4z"/></svg></button>
      <button class="l" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 12l10-8v16z"/></svg></button>
      <button class="r" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 12L8 4v16z"/></svg></button>
      <button class="d" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 18L4 8h16z"/></svg></button>
    </div>
    <div id="btns">
      <button class="tb" id="bAct" type="button" aria-label="リボン" data-i18n-attr="aria-label" hidden><span data-i18n>リボン</span></button>
      <button class="tb" id="bRun" type="button" aria-label="ダッシュ" data-i18n-attr="aria-label"><span data-i18n>ダッシュ</span></button>
      <button class="tb" id="bJ" type="button" aria-label="ジャンプ" data-i18n-attr="aria-label"><span data-i18n>ジャンプ</span></button>
    </div>
  </div>
</div>

<div class="overlay" id="ovTitle" hidden role="dialog" aria-modal="true" aria-labelledby="tTitle">
  <div class="panel">

<script>
(() => {
'use strict';
// ぴょんぴょん冒険 — the table: canvas, input (keyboard, touch, gamepad), the world map, results and saves.
// The rules live in engine.js (pure, runs in node too), the 8+ levels in levels.js, all drawing in art.js.
const T = KoboI18n.t;
KoboI18n.add({ en: {
  'ぴょんぴょん冒険': 'Hop Hop Adventure', 'ゲーム一覧へ戻る': 'Back to games', 'ゲーム一覧へ': 'All games', 'メニュー': 'Menu', 'サウンド': 'Sound', 'サウンド オン': 'Sound on', 'サウンド オフ': 'Sound off', '言語 / Language': 'Language',
  'ぴょんぴょん冒険の画面': 'Game screen', '一時停止': 'Pause', 'タッチ操作': 'Touch controls', '十字ボタン': 'D-pad', 'ジャンプ': 'Jump', 'ダッシュ': 'Run', 'リボン': 'Ribbon',
  '走って、ジャンプ！ ぴょんたと一緒にパッチワークの世界を旅しよう。': 'Run and jump! Travel the patchwork world with Pyonta the toy rabbit.',
  'あそびかた': 'How to play', 'せってい': 'Settings', 'ステージをえらぶ': 'Choose a level', 'とじる': 'Close', 'はじめる': 'Start', 'もう一度': 'Again', 'ステージ一覧へ': 'Level map',
  'つづきから': 'Continue', 'ぼうけん': 'Adventure', 'つづけて遊ぶ': 'Keep playing', 'つづける': 'Resume', 'ホームへ戻る': 'Back home',
}});
const EN = KoboI18n.lang === 'en';
const L = (ja, en) => (EN ? en : ja);
const E = window.HopEngine, ART = window.HopArt, LV = window.HopLevels, GEN = window.HopGen, VAL = window.HopValidate;
const PF = window.KoboPlatform || null, A = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'hop', SAVE_KEY = 'kusoge.hop.save', HOWTO_KEY = 'kusoge.hop.howto', GHOST_KEY = 'kusoge.hop.ghost';

const $ = id => document.getElementById(id);

// ---------- save ----------

  if (o.set && typeof o.set === 'object') { s.set.slow = o.set.slow ? 1 : 0; s.set.hearts = o.set.hearts ? 1 : 0; s.set.auto = o.set.auto ? 1 : 0; s.set.tc = ['auto', 'on', 'off'].indexOf(o.set.tc) >= 0 ? o.set.tc : 'auto'; if (o.set.keys && typeof o.set.keys === 'object') for (const n of ['L', 'R', 'U', 'D', 'J', 'RUN', 'ACT']) if (typeof o.set.keys[n] === 'string' && /^[A-Za-z0-9]{1,16}$/.test(o.set.keys[n])) s.set.keys[n] = o.set.keys[n]; }

const stat = (k, n) => { save.stats[k] = Math.min(1e9, (save.stats[k] || 0) + (n || 0)); };

let DBG_UNLOCK = false;
const lvName = id => { const d = LV.LEVELS.find(l => l.id === id); return d ? L(d.name.ja, d.name.en) : id; };
const par = id => (LV.LEVELS.find(l => l.id === id) || {}).par || 0;
const fmtT = f => { const s = f / 60, m = Math.floor(s / 60); return (m ? m + ':' : '') + (m ? String(Math.floor(s % 60)).padStart(2, '0') : Math.floor(s)) + '.' + String(Math.floor((s % 1) * 100)).padStart(2, '0'); };

// ---------- sound (short effects only, no music) ----------
const tone = (f, d, o) => { if (A) A.tone(f, d, o); };
const SND = {
  jump: () => tone(380, 0.12, { type: 'square', vol: 0.035, slide: 760 }),
  spring: () => tone(260, 0.22, { type: 'triangle', vol: 0.09, slide: 1100 }),
  coin: () => { tone(988, 0.07, { type: 'square', vol: 0.035 }); tone(1319, 0.12, { type: 'square', vol: 0.035, delay: 0.06 }); },
  stomp: () => { tone(300, 0.1, { type: 'square', vol: 0.06, slide: 120 }); if (A) A.noise(0.05, { vol: 0.06, freq: 2000 }); },
  hurt: () => { tone(300, 0.25, { type: 'sawtooth', vol: 0.06, slide: 90 }); },
  pound: () => { if (A) A.noise(0.12, { vol: 0.16, freq: 700 }); tone(110, 0.15, { type: 'sine', vol: 0.12, slide: 60 }); },
  break: () => { if (A) A.noise(0.1, { vol: 0.12, freq: 1600 }); },
  bump: () => tone(180, 0.05, { type: 'square', vol: 0.04 }),
  medal: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, { type: 'triangle', vol: 0.07, delay: i * 0.07 })); },
  gear: () => { [523, 659, 784].forEach((f, i) => tone(f, 0.14, { type: 'sine', vol: 0.09, delay: i * 0.06 })); },
  heart: () => { tone(660, 0.1, { type: 'sine', vol: 0.1 }); tone(880, 0.14, { type: 'sine', vol: 0.1, delay: 0.08 }); },
  cp: () => { [659, 784, 988].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.08, delay: i * 0.06 })); },
  goal: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.09, delay: i * 0.09 })); },
  die: () => { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.2, { type: 'triangle', vol: 0.08, delay: i * 0.11 })); },
  shoot: () => tone(220, 0.1, { type: 'square', vol: 0.04, slide: 110 }),
  burrow: () => tone(520, 0.2, { type: 'sine', vol: 0.08, slide: 180 }),
  rope: () => tone(700, 0.09, { type: 'triangle', vol: 0.07, slide: 1100 }),
  whip: () => tone(900, 0.06, { type: 'triangle', vol: 0.06, slide: 400 }),
  swim: () => tone(300, 0.1, { type: 'sine', vol: 0.05, slide: 520 }),
  quake: () => { if (A) A.noise(0.25, { vol: 0.2, freq: 500 }); },
  bosshit: () => { tone(200, 0.2, { type: 'sawtooth', vol: 0.08, slide: 700 }); },
  bossdown: () => { [300, 250, 200, 150, 100].forEach((f, i) => tone(f, 0.16, { type: 'sawtooth', vol: 0.08, delay: i * 0.09 })); },
  bonk: () => tone(160, 0.08, { type: 'square', vol: 0.06 }),
  clang: () => tone(1100, 0.08, { type: 'square', vol: 0.04, slide: 700 }),
  splat: () => tone(200, 0.08, { type: 'sine', vol: 0.05, slide: 80 }),
  fall: () => tone(400, 0.25, { type: 'sine', vol: 0.06, slide: 120 }),
  yank: () => tone(800, 0.08, { type: 'triangle', vol: 0.06, slide: 300 }),
};
let lastSnd = {};
function snd(n, k) {
  if (!SND[n]) return;
  const t = performance.now(); if (lastSnd[n] && t - lastSnd[n] < 45) return; lastSnd[n] = t; SND[n]();
}

// ---------- canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
let cw = 320, ch = 200, dpr = 1, sc = 1, fx = new ART.Fx();
function fit() {
  const r = $('stage').getBoundingClientRect(); cw = Math.max(160, Math.round(r.width)); ch = Math.max(100, Math.round(r.height));
  dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  sc = Math.min(ch / 208, cw / 240); sc = Math.max(0.4, sc);                // the screen always shows at least 15 tiles across
  if (G) G.S.vw = cw / sc;
  render(); dirty = false;                                   // a resized canvas is blank: draw at once (the loop may be idle while paused)
  kick();
}
let dirty = true;

// ---------- the run ----------
let G = null;                         // { id, def, L, S, rec, frames, intro, doneT, kind }
let mode = 'title', paused = false, acc = 0, last = 0, raf = 0, tFx = 0, MANUAL = false;
function startLevel(id, o) { const def = LV.get(id); return def ? startDef(def, o) : false; }
function ghostLoad(id) { try { const g = JSON.parse(store.get(GHOST_KEY) || '{}'); return g && typeof g[id] === 'string' ? E.unrle(g[id]) : null; } catch (e) { return null; } }
function ghostSave(id, rec) { try { const g = JSON.parse(store.get(GHOST_KEY) || '{}') || {}; g[id] = E.rle(rec); store.set(GHOST_KEY, JSON.stringify(g)); } catch (e) {} }
function startDef(def, o) {
  o = o || {}; const id = def.id, kind = o.kind || (def.daily ? 'daily' : 'adv');
  const L0 = E.parse(def), as = kind === 'ta' || kind === 'daily' ? { hearts: false, auto: false, slow: false } : { hearts: !!save.set.hearts, auto: !!save.set.auto, slow: !!save.set.slow };
  const S = E.newState(L0, { vw: cw / sc, assist: as });
  G = { id, def, L: L0, S, rec: [], intro: 150, doneT: 0, kind, live: false, theme: def.theme, assist: as, medGot: null, resultShown: false, gh: null };
  if (kind === 'ta') { const gi = ghostLoad(id); if (gi && gi.length) G.gh = { S: E.newState(L0, { vw: cw / sc }), in: gi, i: 0, done: false }; }
  S.cam.x = E.camTarget(S); fx = new ART.Fx(); acc = 0; paused = false; mode = 'play';
  hideOverlays(); document.body.classList.add('playing'); showTouch();
  $('bAct').hidden = !(def.gear === 'ribbon');
  emit('play_start', kind === 'daily' ? { mode: 'daily', dateKey: def.daily, stage: id } : { mode: 'normal', stage: id }); G.live = true; stat('plays', 1);

}
function endRun(reason) {
  if (!G || !G.live) return; G.live = false;
  const S = G.S; stat('deaths', S.deaths); stat('stomps', S.stomps); stat('pounds', S.pounds); stat('coins', S.coins);
  if (reason !== 'clear') { stat('ribbon', S.cond.ribbon); stat('glide', Math.floor(S.cond.glide / 30)); stat('burrow', S.cond.burrow); stat('swim', S.cond.swim); }
  writeSave();

}
function dayNum(k) { return Math.floor(Date.UTC(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100) / 86400000); }
function onDailyClear() {
  const S = G.S, r = S.res, dk = G.def.daily, d = save.dl; const prevBest = d.k === dk ? d.t : 0;
  if (d.k === dk) { d.t = d.t ? Math.min(d.t, r.frames) : r.frames; } else { d.st = d.k && dayNum(dk) - dayNum(d.k) === 1 ? d.st + 1 : 1; d.k = dk; d.t = r.frames; }
  d.bs = Math.max(d.bs, d.st); d.n++; stat('daily', 1); stat('clears', 0); stat('medals', 0);
  stat('stomps', 0); save.coins = Math.min(1e9, save.coins + r.coins);

function onClear() {

  writeSave(); endRun('clear');
  emit('stage_clear', { stage: G.id, stars: 1 + (popc(r.med) === 5 ? 1 : 0) + (parStar ? 1 : 0) });

}
function restartLevel() { if (!G) return; const def = G.def, kind = G.kind; endRun('quit'); startDef(def, { kind }); }

// ---------- input ----------
const KEYMAP = { ArrowLeft: B.L, KeyA: B.L, ArrowRight: B.R, KeyD: B.R, ArrowUp: B.U, KeyW: B.U, ArrowDown: B.D, KeyS: B.D,
  KeyZ: B.J, Space: B.J, KeyK: B.J, KeyX: B.RUN, ShiftLeft: B.RUN, ShiftRight: B.RUN, KeyJ: B.RUN, KeyC: B.ACT, KeyV: B.ACT, KeyL: B.ACT };
const down = new Set(); let tmask = 0, gmask = 0; const dbgHold = { m: 0 };

function keyBit(c) { for (const [n, bit] of ACTS) if (save.set.keys && save.set.keys[n] === c) return bit; return KEYMAP[c] || 0; }
function kmask() { let m = 0; down.forEach(c => { m |= keyBit(c); }); return m; }
function gamepad() {

    if (ax < -0.4 || b(14)) m |= B.L; if (ax > 0.4 || b(15)) m |= B.R; if (ay < -0.5 || b(12)) m |= B.U; if (ay > 0.5 || b(13)) m |= B.D;
    if (b(0) || b(2)) m |= B.J; if (b(1) || b(7) || b(5)) m |= B.RUN; if (b(3) || b(6) || b(4)) m |= B.ACT; if (b(9) && !gamepad.sp) { gamepad.sp = 1; openPause(); } if (!b(9)) gamepad.sp = 0; } } catch (e) {}
  return m;
}
const inputMask = () => dbgHold.m || (kmask() | tmask | gamepad());
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
  if (e.altKey || e.metaKey || e.ctrlKey) return;
  if (mode === 'play' && !anyOverlay() && !(pm && pm.isOpen)) {
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); openPause(); return; }
    if (e.code === 'KeyR' && e.shiftKey) { restartLevel(); return; }
    if (e.code === 'KeyR' && !e.shiftKey && G && G.kind === 'ta') { restartLevel(); return; }
    if (keyBit(e.code)) { e.preventDefault(); down.add(e.code); }

window.addEventListener('blur', () => { down.clear(); tmask = 0; padOff(); });
// touch: the d-pad is one surface (slide between directions), the buttons are separate

KG() && KG().register({

  resume(reason) { if (reason === 'menu') { paused = false; acc = 0; kick(); return; } if (mode === 'play' && !(pm && pm.isOpen)) { paused = false; openPause(); } else { paused = false; kick(); } },

        deaths: S ? S.deaths : 0, hurts: S ? S.hurts : 0, stomps: S ? S.stomps : 0, cp: S ? S.cpIdx : -1, dead: !!(p && p.dead), res: S && S.res, result: G && G.result || null, save: JSON.parse(JSON.stringify(save)),
        title: !$('ovTitle').hidden, map: !$('ovMap').hidden, resultShown: !$('ovResult').hidden, howto: !$('howto').hidden, settings: !$('ovSet').hidden, touch: document.body.classList.contains('touch'), vw: S ? S.vw : 0, sc, bossDead: S ? S.bossDead : 0, rec: G ? G.rec.length : 0, crouch: !!(p && p.crouch), h: p ? p.h : 0, inv: p ? p.inv : 0, intro: G ? G.intro : 0, pm: !!(pm && pm.isOpen), mask: inputMask(), kind: G ? G.kind : '', ghost: !!(G && G.gh && !G.gh.done), gx: G && G.gh ? G.gh.S.p.x : -1, editor: !$('editor').hidden, dl: save.dl, today: todayKey() };
