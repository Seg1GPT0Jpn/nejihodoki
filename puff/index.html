@media (orientation: landscape) and (max-height: 560px) {
}

.panel { width: 100%; max-width: 480px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--hp-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s; }

.btn.sub { background: var(--hp-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }

.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }

.og { margin: 8px 0 0; text-align: left; } .og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.howto { max-width: 480px; text-align: left; } .howto h2 { text-align: center; }

.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 379px) { h1 { font-size: 15px; } }
#landTip .btn { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.55); }
body.thumb header, body.thumb #touch, body.thumb #pauseBtn { display: none !important; }

/* puff: touch controls, owbar, ability chip */
#owbar { flex: none; display: none; align-items: center; gap: 8px; padding: 6px 10px 8px; } body.ow #owbar { display: flex; }
#owbar .btn { width: auto; margin: 0; flex: none; min-width: 84px; min-height: 44px; }
#owHint { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; color: var(--kb-ink); }
#owHint small { display: block; font-weight: 500; color: var(--kb-dim); font-size: 11.5px; }
#touch { flex: none; display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px 10px; touch-action: none; --u: 1; }
body.touch.playing #touch { display: flex; }
#stick { position: relative; flex: none; width: calc(116px * var(--u)); height: calc(116px * var(--u)); border-radius: 50%; border: 2px solid var(--kb-line); background: var(--hp-key); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: var(--hp-key-on); border: 2px solid var(--kb-accent); pointer-events: none; transition: transform .04s; }
#stick i { position: absolute; font-style: normal; font-size: 12px; color: var(--kb-dim); pointer-events: none; }
#stick .u { left: 50%; top: 4px; transform: translateX(-50%); } #stick .d { left: 50%; bottom: 4px; transform: translateX(-50%); } #stick .l { left: 7px; top: 50%; transform: translateY(-50%); } #stick .r { right: 7px; top: 50%; transform: translateY(-50%); }
#btns { position: relative; flex: none; width: calc(210px * var(--u)); height: calc(112px * var(--u)); touch-action: none; }
.tb { position: absolute; border-radius: 50%; border: 2px solid var(--kb-line); background: var(--hp-key); color: var(--kb-ink); font: 800 12px var(--kb-font-body); white-space: nowrap; display: grid; place-items: center; touch-action: none; cursor: pointer; padding: 0; line-height: 1.1; text-align: center; }
.tb.on { background: var(--hp-key-on); border-color: var(--kb-accent); }
#bJ { right: 0; bottom: 0; width: calc(84px * var(--u)); height: calc(84px * var(--u)); font-size: 14px; }
#bA { right: calc(92px * var(--u)); bottom: calc(14px * var(--u)); width: calc(76px * var(--u)); height: calc(76px * var(--u)); font-size: 13px; background: rgba(255,154,200,.28); }
#bS { right: calc(38px * var(--u)); bottom: calc(78px * var(--u)); width: calc(54px * var(--u)); height: calc(54px * var(--u)); font-size: 11px; }
#bS.dim { opacity: .45; }
@media (max-width: 359px) { #touch { --u: .86; padding: 4px 8px 8px; gap: 4px; } }
@media (orientation: landscape) and (max-height: 560px) {
  body.touch.playing #touch { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 max(10px, var(--kb-sal)) max(8px, var(--kb-sab)) max(10px, var(--kb-sal)); pointer-events: none; z-index: 4; --u: .8; }
  #stick, #btns { pointer-events: auto; } #stick, .tb { background: rgba(20,30,45,.38); color: #fff; border-color: rgba(255,255,255,.5); } #knob { background: rgba(255,210,63,.5); } #stick i { color: rgba(255,255,255,.7); }

}
.abrow { display: flex; gap: 10px; align-items: flex-start; padding: 8px; margin-top: 6px; border-radius: 14px; background: var(--hp-panel); border: 1px solid var(--kb-line); text-align: left; }

// ---------- save ----------
// lv[i]: bit 0 cleared, bits 1-3 the three medals, bit 4 cleared without a hit. All bit sets only grow (merged by OR).
function newSave() { return { v: 1, pts: 0, lv: new Array(NLV).fill(0), stars: 0, stats: {}, ab: 0, abn: 0, cl: 0, md: 0, all3: 0, nh: 0, wc: {}, set: { hearts: 0, two: 0, tc: 'auto' }, tut: 0 }; }

}
let save = readSave();
function writeSave() { recompute(save); store.set(SAVE_KEY, JSON.stringify(save)); }
const stat = (k, n) => { save.stats[k] = Math.min(1e9, (save.stats[k] || 0) + (n || 0)); };
let DBG_UNLOCK = false;

const lvName = id => { const d = LV.get(id); return d ? L(d.name.ja, d.name.en) : id; };

const lastSnd = {};
function snd(n) { if (!SND[n]) return; const t = performance.now(); const gap = (n === 'fire' || n === 'burn' || n === 'freeze' || n === 'star') ? 110 : 45; if (lastSnd[n] && t - lastSnd[n] < gap) return; lastSnd[n] = t; SND[n](); }

// ---------- canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
let cw = 320, ch = 200, dpr = 1, sc = 1, fx = new ART.Fx(), dirty = true;
function fit() {
  const r = $('stage').getBoundingClientRect(); cw = Math.max(160, Math.round(r.width)); ch = Math.max(100, Math.round(r.height));
  dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  sc = Math.max(0.5, Math.min(ch / 208, cw / 224));                       // the screen always shows at least 14 tiles across
  if (G) G.S.vw = cw / sc;
  if (OW) OW.resize(cw, ch);
  render(); dirty = false; kick(); landTip();
}

// ---------- the run ----------
let G = null;                         // { id, def, L, S, rec, intro, doneT, live, result, counts }
let OW = null, mode = 'title', paused = false, acc = 0, last = 0, raf = 0, MANUAL = false, pm = null;
function startLevel(id, o) { const def = LV.get(id); return def ? startDef(def, o) : false; }
function startDef(def, o) {
  o = o || {};

  const S = E.newState(L0, { players: np, vw: cw / sc, assist: { hearts: !!save.set.hearts } });
  G = { id: def.id, def, L: L0, S, rec: [], intro: 150, doneT: 0, live: true, result: null, resultShown: false, np, counts: { burn: 0, cut: 0, crack: 0, ice: 0, sock: 0, swim: 0 }, absSeen: 0, hinted: {}, hintT: 0 };

  hideOverlays(); document.body.classList.add('playing'); showTouch();

  const S = G.S, r = S.res, i = LV.index(G.id), old = save.lv[i] | 0;

  G.result = { id: G.id, frames: r.frames, med: r.med, stars: r.stars, hurts: r.hurts, deaths: r.deaths, copies: r.copies, kills: r.kills, newBits, newAb, np: G.np, first: !(old & 1) };

const fmtT = f => { const s = f / 60, m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

// ---------- input ----------
const KEYS1 = { ArrowLeft: B.L, KeyA: B.L, ArrowRight: B.R, KeyD: B.R, ArrowUp: B.U | B.J, KeyW: B.U | B.J, ArrowDown: B.D, KeyS: B.D, KeyZ: B.J, Space: B.J, KeyK: B.J, KeyX: B.ACT, KeyJ: B.ACT, KeyC: B.SW, KeyL: B.SW, ShiftLeft: B.SW, ShiftRight: B.SW };
// two players on one keyboard: left hand = player 1 (A D S, W jump, F inhale, G swallow); right hand = player 2 (arrows, Up jump, comma inhale, period swallow)
const KEYSP1 = { KeyA: B.L, KeyD: B.R, KeyS: B.D, KeyW: B.J, Space: B.J, KeyF: B.ACT, KeyG: B.SW, KeyE: B.U };

function kmask(n) { let m = 0; const map = two() ? (n ? KEYSP2 : KEYSP1) : (n ? {} : KEYS1); down.forEach(c => { m |= map[c] || 0; }); return m; }

function pads() { try { return Array.from((navigator.getGamepads && navigator.getGamepads()) || []).filter(g => g && g.connected); } catch (e) { return []; } }
function padMask(g) {

  if (ax < -0.4 || b(14)) m |= B.L; if (ax > 0.4 || b(15)) m |= B.R; if (ay < -0.5 || b(12)) m |= B.U; if (ay > 0.5 || b(13)) m |= B.D;
  if (b(0)) m |= B.J; if (b(2) || b(1)) m |= B.ACT; if (b(3) || b(4) || b(5)) m |= B.SW;
  if (b(9) && !padMask.sp) { padMask.sp = 1; openPause(); } if (!b(9)) padMask.sp = 0;

}
function inputMask(n) {
  if (n === 0 && dbgHold.m) return dbgHold.m; if (n === 1 && dbgHold.m2) return dbgHold.m2;
  const ps = pads(); let m = kmask(n);
  if (two()) { if (ps[n]) m |= padMask(ps[n]); } else if (n === 0) for (const g of ps) m |= padMask(g);

document.addEventListener('keydown', e => {
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
  if (e.altKey || e.metaKey || e.ctrlKey) return;
  if (mode === 'ow' && !anyOverlay()) {
    const c = e.code; if (['ArrowLeft', 'KeyA', 'ArrowUp', 'KeyW'].includes(c)) OW.dir(-1, 0); else if (['ArrowRight', 'KeyD', 'ArrowDown', 'KeyS'].includes(c)) OW.dir(1, 0);
    else if (['Enter', 'Space', 'KeyZ'].includes(c)) OW.activate(); else if (c === 'Escape' || c === 'KeyX') OW.back(); else return;
    e.preventDefault(); return;
  }
  if (mode === 'play' && !anyOverlay() && !(pm && pm.isOpen)) {
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); openPause(); return; }
    if (e.code === 'KeyR' && e.shiftKey) { restartLevel(); return; }
    if (keyBit(e.code)) { e.preventDefault(); down.add(e.code); }
  }
});
document.addEventListener('keyup', e => { down.delete(e.code); });
window.addEventListener('blur', () => { down.clear(); padOff(); });
// touch: a stick (slide anywhere inside), three buttons
const stick = $('stick'), knob = $('knob'); let stickId = null;
function stickSet(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2, dx = (e.clientX - (r.left + R)) / R, dy = (e.clientY - (r.top + R)) / R; let m = 0;
  if (dx < -0.28) m |= B.L; else if (dx > 0.28) m |= B.R; if (dy < -0.55) m |= B.U; else if (dy > 0.5) m |= B.D;

}
function stickOff() { tmask &= ~(B.L | B.R | B.U | B.D); stickId = null; knob.style.transform = ''; }
function padOff() { tmask = 0; stickOff(); btnIds.clear(); ['bJ', 'bA', 'bS'].forEach(id => $(id).classList.remove('on')); }

const btnIds = new Map();
for (const [id, bit] of [['bJ', B.J], ['bA', B.ACT], ['bS', B.SW]]) {

function showHowto(first) {

    '<h3>' + esc(L('そうさ', 'Controls')) + '</h3><ul>' + li(EN ? ['Arrows / WASD: move. Z / Space / Up / W: jump. Press jump again in the air to float (up to 6 puffs).', 'X / J: inhale (hold). With a mouthful: press again to spit a star. With an ability: use it.', 'C / L / Shift: swallow what is in your mouth (copy the ability). With an ability: drop it for a candy.', 'Two players: left hand A D S + W (jump) + F (inhale) + G (swallow); right hand arrows + Up + comma + period. Esc / P: pause.', 'Gamepad: stick or d-pad, A jump, X or B inhale, Y or bumpers swallow, Start pause.'] : ['矢印キー・WASD：うごく　Z・スペース・↑・W：ジャンプ。空中でもう一度ジャンプすると、ふわっと浮く（6回まで）', 'X・J：すいこむ（押しっぱなし）。口にいれたらもう一度で、ほしの弾をはく。わざがあるときは、そのわざ', 'C・L・Shift：口の中のものを「のむ」（わざをコピー）。わざをもっているときは、すてる（キャンディになる）', 'ふたりプレイ：左手 A D S ＋ W（ジャンプ）・F（すいこむ）・G（のむ）／ 右手 矢印 ＋ ↑ ・「,」・「.」。Esc・P：ポーズ', 'ゲームパッド：スティックか十字、A ジャンプ、X か B すいこむ、Y かバンパー のむ、Start ポーズ']) + '</ul>' +
    '<h3>' + esc(L('しかけ', 'Puzzles')) + '</h3><ul>' + li(EN ? ['Rope nets and snow or ash heaps: Fire or Bomb. Vines: Blade, Leaf or Fire.', 'Cracked blocks: Stone or Bomb. Water and lava: Ice freezes it, Bubble swims in it.', 'Sockets: zap with Spark to open the electric door. Three medals hide in every stage.', 'Enemies come back after a while, so you can always copy the ability again.'] : ['ロープのあみ・雪や灰の山：ほのお か ばくだん。ツタ：きりさき・はっぱ・ほのお', 'われたブロック：いし か ばくだん。水や溶岩：こおりで固める／あわで泳ぐ', 'ソケット：でんきでビリビリ → 電気のとびらがひらく。メダルは各ステージに3つ', 'やっつけた敵はしばらくするともどってくるので、わざは何度でもコピーできる']) + '</ul>' +
    '<h3>' + esc(L('やさしさ', 'Assists')) + '</h3><ul>' + li(EN ? ['Hearts are generous, hearts and candies heal you, and there is no game over: you restart from the checkpoint. “Never lose” mode and 2-player co-op are in Settings.'] : ['ハートはたっぷり。ハートやキャンディで回復し、ゲームオーバーはありません（チェックポイントから再開）。せっていで「やられない」と「ふたりプレイ」が選べます']) + '</ul>';
  $('howtoGo').textContent = first ? L('はじめる', 'Start') : L('とじる', 'Close');
  $('howtoGo').onclick = () => { store.set(HOWTO_KEY, '1'); $('howto').hidden = true; if (first || !G) showTitle(); };
  $('howto').hidden = false; try { $('howtoGo').focus({ preventScroll: true }); } catch (e) {}
}
$('tHow').onclick = () => showHowto(false);
const ORI_NAMES = { auto: ['じどう', 'Auto'], land: ['よこ きょうせい', 'Landscape'], port: ['たて きょうせい', 'Portrait'] };
function showSettings() {
  hideOverlays();
  const seg = (key, opts) => '<div class="seg" role="group" data-k="' + key + '">' + opts.map(o => '<button class="opt" type="button" data-v="' + o[0] + '" aria-pressed="' + (String(save.set[key]) === String(o[0])) + '">' + esc(o[1]) + '</button>').join('') + '</div>';
  $('setBody').innerHTML =
    '<div class="og"><div class="ol">' + esc(L('ミスしたとき', 'When you get hit')) + '</div>' + seg('hearts', [[0, L('ふつう', 'Normal')], [1, L('やられない', 'Never lose')]]) + '</div>' +
    '<div class="og"><div class="ol">' + esc(L('ふたりプレイ（ともだちの「もこ」）', '2 players (helper “Moko”)')) + '</div>' + seg('two', [[0, L('ひとり', 'Solo')], [1, L('ふたり', 'Two')]]) + '</div>' +
    '<div class="og"><div class="ol">' + esc(L('タッチ操作ボタン', 'Touch buttons')) + '</div>' + seg('tc', [['auto', L('じどう', 'Auto')], ['on', L('出す', 'Show')], ['off', L('出さない', 'Hide')]]) + '</div>' +
    (window.KoboOrient ? '<div class="og"><div class="ol">' + esc(L('画面のむき', 'Screen orientation')) + '</div><div class="seg" id="oOri" role="group"></div><p>' + esc(L('スマホが回らないときは「よこ きょうせい」で、画面ごと回して出します。', 'If your phone will not rotate, “Landscape” turns the whole game for you.')) + '</p></div>' : '') +
    '<p>' + esc(L('「やられない」では、ダメージを受けても体力が減りません（穴や水に落ちてももどされるだけ）。', 'With “Never lose”, hits never reduce your hearts (falling just puts you back).')) + '</p>';
  $('setBody').querySelectorAll('.seg[data-k]').forEach(sg => sg.querySelectorAll('.opt').forEach(b => { b.onclick = () => {
    const k = sg.dataset.k, v = b.dataset.v; save.set[k] = (k === 'tc') ? v : Number(v); writeSave(); showTouch();
    sg.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  }; }));
  if (window.KoboOrient && $('oOri')) { const el = $('oOri'); const draw = () => { el.innerHTML = KoboOrient.MODES.map(m => '<button class="opt" type="button" data-v="' + m + '" aria-pressed="' + (KoboOrient.get() === m) + '">' + esc(L(ORI_NAMES[m][0], ORI_NAMES[m][1])) + '</button>').join(''); el.querySelectorAll('.opt').forEach(b => { b.onclick = () => { if (KoboOrient.get() === b.dataset.v) return; if (G && G.live && !confirm(T('ステージをやめて、画面のむきをかえますか？'))) return; writeSave(); KoboOrient.set(b.dataset.v); draw(); }; }); }; draw(); }
  $('ovSet').hidden = false;
}
KoboI18n.add({ en: { 'ステージをやめて、画面のむきをかえますか？': 'Quit this stage and change the screen orientation?' } });
$('tSet').onclick = () => showSettings(); $('setClose').onclick = () => { $('ovSet').hidden = true; if (G && mode === 'play') openPause(); else if (mode === 'ow') { $('ovSet').hidden = true; document.body.classList.add('ow'); } else showTitle(); };

// ---------- pause menu, sound, theme ----------
function openPause() {
  if (!UI || mode !== 'play' || (pm && pm.isOpen)) return;
  paused = true; padOff(); down.clear();
  pm = UI.pauseMenu({ title: T('一時停止'), home: '../',
    extra: [{ label: L('つまった？ チェックポイントからやり直す', 'Stuck? Retry from the checkpoint'), icon: 'restart', onClick: () => { pm.close(); if (G && G.live) { E.toCheckpoint(G.S); G.S.cam.x = E.camTarget(G.S); fx = new ART.Fx(); G.hinted = {}; } paused = false; acc = 0; dirty = true; kick(); } },
      { label: L('ヒント（なにをすればいい？）', 'Hint (what do I do?)'), icon: 'help', onClick: () => { pm.close(); paused = false; acc = 0; showHint(); kick(); } },
      { label: L('ちずへ', 'Level map'), icon: 'menu', onClick: () => { pm.close(); paused = false; showOverworld(G && G.id); } },
      { label: L('せってい', 'Settings'), icon: 'settings', onClick: () => { pm.close(); showSettings(); } }],
    onSettings: false, onRestart: () => restartLevel(), confirmRestart: false,
    onOpen: () => { const g = KG(); if (g) g.menuOpened(); },
    onResume: () => { paused = false; const g = KG(); if (g) g.menuClosed(); acc = 0; kick(); } });
  pm.open();
}
$('pauseBtn').addEventListener('click', openPause);
function renderSound() { const b = $('sndBtn'); if (!A) { b.hidden = true; return; } const m = A.muted; b.setAttribute('aria-pressed', String(!m)); b.setAttribute('aria-label', T(m ? 'サウンド オフ' : 'サウンド オン')); b.replaceChildren(); if (UI) { const ic = UI.icon(m ? 'mute' : 'sound'); if (ic && ic.nodeType) b.append(ic); else b.innerHTML = String(ic || ''); } }
$('sndBtn').addEventListener('click', () => { if (!A) return; A.toggleMute(); if (!A.muted) SND.star(); });
if (A) A.onChange(renderSound);
$('menuBtn').addEventListener('click', () => { if (mode === 'play') openPause(); else showSettings(); });
function themeColor() { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', !(UI && UI.theme && UI.theme.resolved && UI.theme.resolved() === 'light') ? '#2a2150' : '#e9f3fb'); }

// ---------- resize, boot ----------
let rz = 0; const relayout = () => { clearTimeout(rz); rz = setTimeout(fit, 40); };
window.addEventListener('resize', relayout); window.addEventListener('orientationchange', () => setTimeout(fit, 120));
if (window.ResizeObserver) new ResizeObserver(relayout).observe($('stage'));
{ const sel = KoboI18n.picker($('langPick')); if (sel) sel.id = 'langSel'; }
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(themeColor, 0));
function persistNow() { if (G && G.live) { /* a stage in progress is not saved; clears and stats are */ } writeSave(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { persistNow(); down.clear(); padOff(); } else { last = performance.now(); acc = 0; kick(); } });
window.addEventListener('pagehide', persistNow);
OW = OWM.create({ ART, LV, L, get save() { return save; }, unlocked, popc, toast: m => toast(m, 2200), exit: () => showTitle(), startLevel: id => startLevel(id), onMove: () => snd('star') });
$('owBack').onclick = () => OW.back(); $('owGo').onclick = () => OW.activate();
renderSound(); themeColor(); showTouch(); fit();
KG() && KG().register({
  id: GAME,
  pause() { if (mode === 'play') paused = true; padOff(); down.clear(); },
  resume(reason) { if (reason === 'menu') { paused = false; acc = 0; kick(); return; } if (mode === 'play' && !(pm && pm.isOpen)) { paused = false; openPause(); } else { paused = false; kick(); } },
  save() { persistNow(); },
  isIdle: () => !(G && G.live && mode === 'play'),
  dispose() { cancelAnimationFrame(raf); },
});
{ if (store.get(HOWTO_KEY) == null && !save.tut) { save.tut = 1; writeSave(); showHowto(true); } else showTitle(); }
kick();

// ---------- test hooks (?debug) ----------
if (DEBUG) {
  const api = {
    ready: () => true,
    state() {
      const S = G && G.S, p = S && S.ps[0];
      return { mode, id: G ? G.id : '', playing: !!(G && mode === 'play'), paused, over: !!(S && S.res), frame: S ? S.f : 0, x: p ? p.x : 0, y: p ? p.y : 0, vx: p ? p.vx : 0, vy: p ? p.vy : 0, on: p ? p.on : false, hp: p ? p.hp : 0, ab: p ? p.ab : null, held: p && p.held ? p.held.k : null, puff: p ? p.puff : 0, flaps: p ? p.flaps : 0,
        np: S ? S.np : 0, stars: S ? S.stars : 0, med: S ? S.med : 0, hurts: S ? S.hurts : 0, deaths: S ? S.deaths : 0, kills: S ? S.kills : 0, cp: S ? S.cpIdx : -1, bossDead: S ? S.bossDead : 0, result: G && G.result || null, save: JSON.parse(JSON.stringify(save)),
        title: !$('ovTitle').hidden, resultShown: !$('ovResult').hidden, howto: !$('howto').hidden, settings: !$('ovSet').hidden, book: !$('ovBook').hidden, touch: document.body.classList.contains('touch'), vw: S ? S.vw : 0, sc, ow: mode === 'ow', owCur: OW ? OW.cur : 0, pauseOpen: !!(pm && pm.isOpen) };
    },
  };
  window.__kb = Object.assign(window.__kb || {}, api);
  window.__puff = {
    api, E, ART, LV, get G() { return G; }, get S() { return G && G.S; }, get save() { return save; }, get ow() { return OW; }, start: startLevel, showOverworld, showTitle, showBook, showSettings, openPause, startDef,
    resetSave() { store.del(SAVE_KEY); save = readSave(); }, unlockAll() { DBG_UNLOCK = true; },
    hold(m, m2) { dbgHold.m = m | 0; dbgHold.m2 = m2 | 0; }, release() { dbgHold.m = 0; dbgHold.m2 = 0; },
    manual(on) { MANUAL = !!on; acc = 0; kick(); }, stepN(n) { for (let i = 0; i < n && G && mode === 'play' && !paused; i++) stepOnce(); dirty = true; render(); return G ? G.S.f : 0; },
    finish() { for (let i = 0; i < 400 && G && !G.resultShown; i++) stepOnce(); },
    setPos(x, y, i) { const p = G.S.ps[i || 0]; p.x = x; p.y = y; p.vx = 0; p.vy = 0; G.S.cam.x = E.camTarget(G.S); },
    give(ab) { G.S.ps[0].ab = ab; }, needNow, hintText, showHint, fit, render: () => { dirty = true; render(); },
