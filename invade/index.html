const NSTAGE = LV.CAMPAIGN.length;

  <div class="og"><div class="ol">${L('ゆれ・フラッシュ', 'Shake and flashes')}</div>${seg('shake', [[1, L('ふつう', 'Normal')], [0, L('ひかえめ', 'Reduced')]])}</div>
  ${window.KoboOrient ? '<div class="og"><div class="ol">' + esc(L('画面のむき', 'Screen orientation')) + '</div><div class="seg" id="oOri" role="group"></div><p>' + esc(L('スマホが回らないときは「よこ きょうせい」で、画面ごと回して出します。', 'If your phone will not rotate, “Landscape” turns the whole game for you.')) + '</p></div>' : ''}
  <div class="langrow"><label for="langSel">${L('言語 / Language', 'Language')}</label><span id="langPick"></span></div></div>${bt('setClose', L('とじる', 'Close'), '', 'data-focus')}`);
  const sel = KoboI18n.picker($('langPick')); if (sel) sel.id = 'langSel';
  $('panel').querySelectorAll('.seg[data-k]').forEach(sg => sg.querySelectorAll('.opt').forEach(b => { b.onclick = () => {
    const k = sg.dataset.k, v = b.dataset.v; save.set[k] = k === 'tc' ? v : Number(v); writeSave(); applySettings(); showTouch();
    sg.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  }; }));
  if (window.KoboOrient && $('oOri')) { const el = $('oOri'); const draw = () => { el.innerHTML = KoboOrient.MODES.map(m => '<button class="opt" type="button" data-v="' + m + '" aria-pressed="' + (KoboOrient.get() === m) + '">' + esc(L(ORI_NAMES[m][0], ORI_NAMES[m][1])) + '</button>').join(''); el.querySelectorAll('.opt').forEach(b => { b.onclick = () => { if (KoboOrient.get() === b.dataset.v) return; writeSave(); KoboOrient.set(b.dataset.v); draw(); }; }); }; draw(); }
  run && (run.fromSettings = !!fromPause);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !$('panel').contains(b)) return;
  const act = b.dataset.act, p = act.split(':'), k = p[0];
  if (A && A.unlocked === false) { try { A.ctx(); } catch (x) {} }
  if (k === 'howtoGo') { store.set(HOWTO_KEY, '1'); if (run && run.kind === 'live') hideOv(); else showTitle(); }
  else if (k === 'howto') { showHowto(false); }
  else if (k === 'title') { showTitle(); }
  else if (k === 'camp') showCamp();
  else if (k === 'lv') { const i = +p[1]; startRun(newOpts('campaign', { level: i })); }
  else if (k === 'setup') showOv('setup:' + p[1], setupHtml(p[1]));
  else if (k === 'mp') { save.set.pl = +p[1]; writeSave(); if (p[2] === 'setup') showOv(ovName, setupHtml(ovName.split(':')[1])); else showTitle(); }
  else if (k === 'go') { startRun(newOpts(p[1], p[1] === 'daily' ? { dkey: dayKey() } : {})); }
  else if (k === 'records') showRecords();
  else if (k === 'settings') showSettings(false);
  else if (k === 'setClose') { if (run && run.kind === 'live' && !run.finished) { hideOv(); openPause(); } else showTitle(); }
  else if (k === 'retry') { const o = Object.assign({}, run.opts); o.seed = o.mode === 'daily' ? o.seed : 1 + Math.floor(Math.random() * 2000000000); startRun(o); }

document.addEventListener('change', e => { const c = e.target; if (c && c.dataset && c.dataset.as) { const bit = +c.dataset.as; save.set.assist = c.checked ? (save.set.assist | bit) : (save.set.assist & ~bit); writeSave(); } });

// ---------------------------------------------------------------- header, sound, pause
$('menuBtn').addEventListener('click', () => { if (run && run.kind === 'live' && !run.finished) openPause(); else showTitle(); });
$('pauseFab').addEventListener('click', () => openPause());
function renderSound() { const b = $('sndBtn'); if (!A) { b.hidden = true; return; } const m = A.muted; b.setAttribute('aria-pressed', String(!m)); b.setAttribute('aria-label', T(m ? 'サウンド オフ' : 'サウンド オン')); b.innerHTML = m ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'; }
$('sndBtn').addEventListener('click', () => { if (!A) return; A.toggleMute(); if (!A.muted) A.sfx('ok'); });
if (A) A.onChange(renderSound);
let pm = null;
function openPause() {
  if (!run || run.kind !== 'live' || run.finished || run.paused) return;
  if (pm && pm.isOpen) return;
  run.paused = true; keys.clear(); drags = []; btn = { l: 0, r: 0, fire: 0, bomb: 0 };
  if (!UI) { showTitle(); return; }
  pm = UI.pauseMenu({
    title: T('ひとやすみ'), home: '../', onSettings: false, confirmRestart: false,
    extra: [{ label: L('せってい', 'Settings'), icon: 'settings', onClick: () => { toast(L('せっていは タイトルの「せってい」から', 'Settings are on the title screen')); } },
      { label: L('ここまででおわる（記録する）', 'End run (keep score)'), icon: 'menu', onClick: () => { pm.close(); if (run) { KG() && KG().menuClosed(); finish('quit'); } } }],
    onResume: () => { if (run) { run.paused = false; acc = 0; } const g = KG(); if (g) g.menuClosed(); try { cv.focus({ preventScroll: true }); } catch (e) {} },
    onRestart: () => { const o = Object.assign({}, run.opts); o.seed = o.mode === 'daily' ? o.seed : 1 + Math.floor(Math.random() * 2000000000); const g = KG(); if (g) g.menuClosed(); startRun(o); },
    onOpen: () => { const g = KG(); if (g) g.menuOpened(); },
  });
  pm.open();
}

// ---------------------------------------------------------------- boot
function themeColor() { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = '#0a0f2a'; }
window.addEventListener('resize', () => setTimeout(fit, 30)); window.addEventListener('orientationchange', () => setTimeout(fit, 150));
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('stage'));
applySettings(); renderSound(); themeColor(); showTouch(); fit();
KG() && KG().register({
  id: GAME,
  pause() { if (run && run.kind === 'live' && !run.paused && !run.finished) openPause(); },
  resume() {},
  save() { writeSave(); },
  isIdle: () => !(run && run.kind === 'live' && !run.finished),
  dispose() { cancelAnimationFrame(raf); },
  daily: { start({ dateKey }) { startRun(newOpts('daily', { dkey: dateKey })); } },
});
{
  const first = store.get(HOWTO_KEY) == null && !save.tut, launch = PF && PF.launch ? PF.launch() : { daily: null };
  startDemo();
  if (launch && launch.daily && !first) { /* KoboGame.register starts the daily run */ }
  else if (first) { store.set(HOWTO_KEY, '1'); showHowto(true); } else showTitle();
}
last = performance.now(); raf = requestAnimationFrame(frame);

// ---------------------------------------------------------------- test hooks (?debug)
if (DEBUG) {
  const state = () => { const S = curS(); const p = S ? S.pl[0] : null; return {
    ready: true, screen: ovName || (run ? run.kind : 'none'), ov: ovOpen(), playing: isLive(), paused: !!(run && run.paused), finished: !!(run && run.finished), mode: S ? S.mode : '', mp: SE ? SE.mp : '', cur: SE ? SE.cur : 0,
    frame: S ? S.frame : 0, wave: S ? S.wave : 0, phase: S ? S.phase : '', score: S ? S.score : 0, lives: S ? S.lives : 0, ga: S ? S.ga : 0, gt: S ? S.gt : 0, eb: S ? S.eb.length : 0, pb: S ? S.pb.length : 0,
    px: p ? p.x : 0, py: p ? p.y : 0, dead: p ? p.dead : 0, inv: p ? p.inv : 0, bb: p ? p.bb : 0, boss: !!(S && S.boss && !S.boss.dead), bhp: S && S.boss ? S.boss.hp : -1, stars: S ? S.stars : 0, won: !!(S && S.won), chain: S ? S.chain : 0,
    shots: S ? S.st.shots : 0, kills: S ? S.st.kills : 0, shieldN: S ? S.sh.reduce((a, s) => a + s.n, 0) : 0, mt: S ? S.mt : 0, save: JSON.parse(JSON.stringify(save)), touch: touchMode, K, np: S ? S.np : 1, hint: $('hint').hidden ? '' : $('hint').textContent, hash: S ? E.hash(S) : 0, auto: autoOn(), fx: view.fx, turn: view.turn,
  }; };
  window.__kb = Object.assign(window.__kb || {}, { ready: () => true, state });
  window.__invade = {
    E, ART, LV, state, get S() { return curS(); }, get SE() { return SE; }, get run() { return run; }, get save() { return save; }, get view() { return view; },
    start(o) { startRun(newOpts(o.mode || 'classic', o)); },
    showTitle, showCamp, showHowto, showRecords, showSettings, openPause, finish,
    wave(n) { const S = curS(); if (S) { E.startWave(S, n); S.phase = 'play'; S.pt = 0; } },
    clearWave() { const S = curS(); if (S) { for (const a of S.al) a.alive = false; S.ga = 0; S.mn.length = 0; if (S.boss) S.boss.hp = 0; if (S.boss) E.hurtBoss(S, 1); } },
    god(n) { const S = curS(); if (S) { S.lives = n || 9; for (const p of S.pl) p.inv = 99999; } },
    hurt() { const S = curS(); if (S) { S.pl[0].inv = 0; S.pl[0].sh = 0; E.eshot(S, S.pl[0].x, S.pl[0].y - 4, 0, 0, 0); } },
    giveCap(k) { const S = curS(); if (S) E.collect(S, S.pl[0], k, S.pl[0].x, S.pl[0].y); },
    dropCap(k) { const S = curS(); if (S) E.dropCap(S, S.pl[0].x, S.pl[0].y - 60, k); },
    setX(x) { const S = curS(); if (S) S.pl[0].x = x; },
    saucer() { const S = curS(); if (S) { S.sau = { x: 20, y: 26, vx: 1, v: 150 }; } },
    manual(on) { MANUAL = !!on; }, stepN(n, m, m1) { const S0 = curS(); for (let i = 0; i < n; i++) { E.sessionStep(SE, m | 0, m1 | 0); for (const g of SE.g) handleEvents(g, true); liveHooks(); } },
    fit, resetSave() { store.del(SAVE_KEY); store.del(RANK_KEY); save = readSave(); applySettings(); },
    thumbScene() {
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); hideOv(); demo = null; view.hud = true; view.fx = 0; MANUAL = true;
      const S = E.newGame({ mode: 'classic', seed: 12 }); E.startWave(S, 6); SE = { mp: 'solo', cur: 0, g: [S] }; run = { kind: 'thumb', paused: true, opts: {}, finished: true };
      S.phase = 'play'; S.spec.su = 0; const bot = BOT.make(); S.pl[0].inv = 99999;

      ART.reset(); fit(); acc = 0; ART.draw(cx, S, view, L);
    },
  };
}
})();
