<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>いかだ暮らし</title>
<meta name="theme-color" content="#0f3d47">
<meta name="description" content="水没した世界で漂流物を拾い、イカダを広げて生き延びるサバイバルゲーム。">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="いかだ暮らし">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root {
  --deep: #0f3d47;
  --deep-2: #155160;
  --line: #2a6b78;
  --sand: #fff6e3;
  --sand-dim: #a9cdd2;
  --sun: #ffc94a;
  --sun-ink: #3a2600;
  --coral: #ff7a59;
  --hp: #ff6b6b;
  --water: #4cc3ff;
  --food: #ffa94d;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background: var(--deep); color: var(--sand); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
button { font-family: var(--font-body); color: inherit; }
#app {
  height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  gap: 6px;
}
header { display: flex; align-items: center; gap: 6px; min-height: 40px; }
.back {
  color: var(--sand-dim); text-decoration: none; font-size: 12.5px; font-weight: 800; white-space: nowrap;
  padding: 9px 4px; flex: none;
}
h1 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; white-space: nowrap; letter-spacing: .02em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { h1 { font-size: 15px; letter-spacing: 0; } }
h1 span { color: var(--sun); }
#dayChip {
  display: flex; align-items: center; gap: 5px; background: var(--deep-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 10px 5px 7px; font-weight: 800; font-size: 13px; white-space: nowrap;
  font-variant-numeric: tabular-nums; flex: none;
}
#dayIcon { width: 14px; height: 14px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 6px rgba(255, 201, 74, .7); flex: none; }
#dayIcon.night { background: transparent; box-shadow: inset -4px -2px 0 0 #f3efcf; transform: rotate(-20deg); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--deep-2);
  display: grid; place-items: center; padding: 0; cursor: pointer; flex: none; font-weight: 800; font-size: 16px;
}
.icon-btn svg { width: 20px; height: 20px; }
#stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: var(--sand-dim); }
.stat .lbl b { color: var(--sand); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
.bar i { display: block; height: 100%; width: 100%; border-radius: 6px; transition: width .25s linear; }
#stHp .bar i { background: var(--hp); }
#stWater .bar i { background: var(--water); }
#stFood .bar i { background: var(--food); }
.stat.low .bar { animation: blink .7s steps(2) infinite; }
.stat.low .lbl { color: #ffb4a8; }
@keyframes blink { 50% { background: rgba(255, 80, 80, .55); } }
#stage {
  flex: 1; min-height: 0; position: relative; border-radius: 20px; overflow: hidden; background: #1e9aa3;
  touch-action: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#toast {
  position: absolute; left: 50%; top: 10px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  background: rgba(10, 40, 48, .86); border: 1px solid rgba(255,255,255,.15); color: var(--sand);
  padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; max-width: 94%;
  overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { background: rgba(120, 20, 20, .9); border-color: #ff9a8a; }
#placeBar {
  position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px;
  background: rgba(255, 246, 227, .95); color: #24414a; border-radius: 14px; padding: 8px 8px 8px 14px;
  font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
#placeBar span { flex: 1; }
#placeBar button { border: 0; border-radius: 10px; background: #24414a; color: var(--sand); font-weight: 800; padding: 9px 14px; font-size: 14px; cursor: pointer; }
.steer {
  position: absolute; bottom: 12px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
  background: rgba(10, 50, 60, .55); display: grid; place-items: center; cursor: pointer; touch-action: none; padding: 0;
}
.steer svg { width: 26px; height: 26px; }
.steer.on { background: rgba(255, 201, 74, .8); border-color: #fff; }
#steerL { left: 12px; } #steerR { right: 12px; }
#laneInfo {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(10, 40, 48, .75);
  border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 800; white-space: nowrap; pointer-events: none;
  display: flex; gap: 6px; align-items: center;
}
#laneInfo .hint { color: var(--sun); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.25); }
.pips i.on { background: var(--sun); }
#bottom { display: flex; gap: 8px; align-items: stretch; }
#inv { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--deep-2); border-radius: 12px; padding: 4px 2px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 52px; cursor: default;
}
.chip canvas { width: 24px; height: 24px; }
.chip b { font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chip small { font-size: 9.5px; color: var(--sand-dim); line-height: 1; white-space: nowrap; }
.chip.tap { cursor: pointer; border-color: var(--food); }
.chip.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.15); background: #2a7a8a; } }
#buildBtn {
  flex: none; width: 96px; border: 0; border-radius: 14px; background: var(--sun); color: var(--sun-ink);
  font: 400 19px var(--font-display); cursor: pointer; box-shadow: 0 3px 0 #c6922a; letter-spacing: .05em;
}
#buildBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c6922a; }
#buildBtn.can { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 3px 0 #c6922a, 0 0 0 4px rgba(255, 201, 74, .35); } }

/* bottom sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(4, 20, 26, .45); }
#sheet {
  background: var(--sand); color: #23404a; border-radius: 22px 22px 0 0; max-width: 560px; width: 100%; margin: 0 auto;
  max-height: 74%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -8px 30px rgba(0,0,0,.3); animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet-head { display: flex; align-items: center; padding: 14px 16px 8px; gap: 8px; }
.sheet-head h2 { margin: 0; font: 400 19px var(--font-display); flex: 1; }
.sheet-head button { border: 0; background: #23404a; color: var(--sand); border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
.sheet-inv { padding: 0 16px 8px; font-size: 12.5px; font-weight: 800; color: #4f6f78; }
#buildList { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 0 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.sec { font-size: 12px; font-weight: 800; color: #6c8a92; margin: 6px 4px 0; }
.card { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 1px 0 #e6dcc4; }
.card canvas { width: 44px; height: 44px; flex: none; background: #d9f1ef; border-radius: 12px; }
.card .txt { flex: 1; min-width: 0; }
.card .nm { font-weight: 800; font-size: 15px; }
.card .nm small { font-size: 11px; color: #6c8a92; margin-left: 4px; }
.card .ds { font-size: 12px; color: #4f6f78; line-height: 1.45; margin-top: 1px; }
.cost { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cost span { font-size: 11.5px; font-weight: 800; background: #e9f5f3; color: #23404a; border-radius: 999px; padding: 2px 8px; }
.cost span.no { background: #ffe1db; color: #c0392b; }
.card button {
  flex: none; border: 0; border-radius: 12px; background: var(--coral); color: #fff; font-weight: 800; font-size: 14px;
  padding: 0 12px; min-width: 64px; height: 44px; cursor: pointer;
}
.card button:disabled { background: #cfd8d6; color: #8a9a9d; cursor: default; }
.card.done { opacity: .55; }

/* overlays */
#ov { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(4, 22, 28, .62); padding: 20px; }
.panel {
  background: var(--sand); color: #23404a; border-radius: 22px; width: min(360px, 100%); padding: 22px 20px 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.4); text-align: center; animation: up .25s ease-out; max-height: 100%; overflow-y: auto;
}
.panel h2 { font: 400 26px var(--font-display); margin: 0 0 4px; }
.panel h2 span { color: var(--coral); }
.panel .sub { font-size: 13px; color: #4f6f78; margin: 0 0 12px; font-weight: 800; }
.panel ul { text-align: left; padding: 0; margin: 0 0 14px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.panel li { font-size: 13.5px; line-height: 1.55; background: #fff; border-radius: 12px; padding: 8px 10px 8px 12px; }
.panel li b { color: #c45a2c; }
.big { font: 400 46px var(--font-display); color: var(--coral); margin: 6px 0 0; line-height: 1.1; }
.panel .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.btn {
  border: 0; border-radius: 14px; padding: 13px 20px; font: 800 16px var(--font-body); cursor: pointer;
  background: var(--coral); color: #fff; box-shadow: 0 3px 0 #c4553a; text-decoration: none; display: inline-block;
}
.btn.sub2 { background: #23404a; box-shadow: 0 3px 0 #11262d; color: var(--sand); }
.recs { display: flex; justify-content: center; gap: 18px; font-size: 13px; font-weight: 800; color: #4f6f78; margin-top: 8px; }
.recs b { display: block; font-size: 20px; color: #23404a; }
@media (max-height: 640px) {
  .chip { min-height: 44px; } .chip canvas { width: 20px; height: 20px; }
  h1 { font-size: 16px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../">← ゲーム一覧</a>
    <h1>いかだ<span>暮らし</span></h1>
    <div id="dayChip"><i id="dayIcon"></i><span id="dayText">1日目</span></div>
    <button class="icon-btn" id="helpBtn" aria-label="遊び方">?</button>
    <button class="icon-btn" id="soundBtn" aria-label="音のオンオフ"></button>
  </header>
  <div id="stats">
    <div class="stat" id="stHp"><div class="lbl">体力<b>100</b></div><div class="bar"><i></i></div></div>
    <div class="stat" id="stWater"><div class="lbl">水分<b>100</b></div><div class="bar"><i></i></div></div>
    <div class="stat" id="stFood"><div class="lbl">空腹<b>100</b></div><div class="bar"><i></i></div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="placeBar" hidden><span id="placeText">置く場所をタップ</span><button id="placeCancel">やめる</button></div>
    <button class="steer" id="steerL" hidden aria-label="左へ"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="steer" id="steerR" hidden aria-label="右へ"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="laneInfo" hidden></div>
  </div>
  <div id="bottom">
    <div id="inv"></div>
    <button id="buildBtn">建てる</button>
  </div>
</div>
<div id="sheetWrap" hidden>
  <div id="sheet" role="dialog" aria-label="建築メニュー">
    <div class="sheet-head"><h2>建てる・強化</h2><button id="sheetClose">閉じる</button></div>
    <div class="sheet-inv" id="sheetInv"></div>
    <div id="buildList"></div>
  </div>
</div>
<div id="ov" hidden><div class="panel" id="ovPanel"></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const DEBUG = /[?&]debug\b/.test(location.search);
const T = 48;            // world size of one raft tile
const DAY_LEN = 120;     // seconds per day
const LS_SAVE = 'kusoge.raft.save', LS_BEST = 'kusoge.raft.best', LS_SOUND = 'kusoge.sound', LS_SEEN = 'kusoge.raft.seen';
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const key = (x, y) => x + ',' + y;

const RES = {
  wood: { name: '木材' }, plastic: { name: 'プラ' }, leaf: { name: '葉っぱ' }, scrap: { name: '鉄くず' }, fish: { name: '生魚' }
};
const RES_ORDER = ['wood', 'plastic', 'leaf', 'scrap', 'fish'];

const BUILD = [
  { id: 'tile', name: 'イカダ拡張', desc: 'となりに床を1枚ふやす。広いほど設備を置ける。', cost: { wood: 3, plastic: 2 }, kind: 'tile' },
  { id: 'purifier', name: '浄水器', desc: '海水をこして飲み水にする。たまったらタップで飲む。', cost: { plastic: 4, wood: 2 }, kind: 'fac' },
  { id: 'grill', name: 'グリル', desc: '生魚をのせて焼く。焼けたらタップで食べる。', cost: { wood: 4, plastic: 2 }, kind: 'fac' },
  { id: 'net', name: '網', desc: '網の上を流れる漂流物を自動で拾う。上流側に置くと効く。', cost: { leaf: 4, plastic: 3, wood: 1 }, kind: 'fac' },
  { id: 'tank', name: '雨水タンク', desc: '雨水をためる。雨や嵐の時は一気にたまる。', cost: { plastic: 6, wood: 2 }, kind: 'fac' },
  { id: 'garden', name: '菜園', desc: 'ゆっくり野菜が育つ。実ったらタップで食べる。', cost: { leaf: 5, wood: 3, plastic: 1 }, kind: 'fac' },
  { id: 'sail', name: '帆', desc: '左右の舵ボタンで、漂流物の多い潮目へ移動できる。', cost: { leaf: 6, wood: 5 }, kind: 'fac', once: true },
  { id: 'spear', name: '槍', desc: 'サメを突く力が2倍になる。', cost: { wood: 4, plastic: 1 }, kind: 'up' },
  { id: 'ironspear', name: '鉄の槍', desc: 'サメへの攻撃力が3倍に。', cost: { scrap: 3, wood: 2 }, kind: 'up', req: 'spear' },
  { id: 'hook2', name: '鉄のフック', desc: 'フックが遠くまで速く飛ぶ。', cost: { scrap: 2, plastic: 3 }, kind: 'up' },
  { id: 'filter2', name: '浄水器の改良', desc: '浄水器で水ができる速さが1.6倍。', cost: { scrap: 2, plastic: 4 }, kind: 'up' },
  { id: 'reinforce', name: '床の補強', desc: 'すべての床の耐久が1.6倍。サメに強くなる。', cost: { scrap: 4, wood: 6 }, kind: 'up' }
];
const FAC_NAME = { purifier: '浄水器', grill: 'グリル', net: '網', tank: '雨水タンク', garden: '菜園', sail: '帆' };

// ---------------- state ----------------
let S = null;                 // serializable run state
let gameState = 'play';       // play | over
let paused = false, sheetOpen = false, timeScale = 1;
let items = [], hook = null, shark = null, island = null, parts = [], floats = [];
let place = null;             // {id} when choosing where to build
let aim = null, steer = 0, spawnAcc = 0, shake = 0, flashT = 0, jab = null;
let animT = 0, waveX = 0, waveY = 0, saveAcc = 0;
const cam = { x: T / 2, y: T / 2, s: 1, init: false };

function newState() {
  const tiles = {};
  for (const [x, y] of [[0, 0], [1, 0], [0, 1], [1, 1]]) tiles[key(x, y)] = { x, y, hp: 100, fac: null };
  return {
    v: 1, day: 1, time: 0.06, hp: 100, water: 100, food: 100,
    inv: { wood: 4, plastic: 3, leaf: 2, scrap: 0, fish: 0 },
    tiles, up: {}, sharkT: 42, eventT: 55, lane: 0, rain: 0, storm: 0, elapsed: 0,
    stats: { caught: 0, sharks: 0 }
  };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(LS_SAVE);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !d.tiles || !Object.keys(d.tiles).length || !(d.hp > 0)) return null;
    const base = newState();
    const s = Object.assign(base, d);
    s.inv = Object.assign(newState().inv, d.inv || {});
    s.up = d.up || {}; s.stats = Object.assign({ caught: 0, sharks: 0 }, d.stats || {});
    return s;
  } catch (e) { return null; }
}
function save() {
  if (!S || gameState !== 'play') return;
  try { localStorage.setItem(LS_SAVE, JSON.stringify(S)); } catch (e) {}
}
function bestDays() { return parseInt(lsGet(LS_BEST) || '0', 10) || 0; }
function updateBest() { if (S && S.day > bestDays()) lsSet(LS_BEST, String(S.day)); }

// ---------------- raft geometry ----------------
let RB = null;
function raftChanged() { RB = null; }
function tileMax() { return S.up.reinforce ? 160 : 100; }
function raftBox() {
  if (RB) return RB;
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, n = 0;
  for (const k in S.tiles) { const t = S.tiles[k]; n++; minx = Math.min(minx, t.x); maxx = Math.max(maxx, t.x); miny = Math.min(miny, t.y); maxy = Math.max(maxy, t.y); }
  if (!n) { minx = maxx = miny = maxy = 0; }
  const cx = (minx + maxx) / 2 * T, cy = (miny + maxy) / 2 * T;
  const w = (maxx - minx + 1) * T, h = (maxy - miny + 1) * T;
  let best = null, bd = 1e9, bestAny = null, bda = 1e9;
  for (const k in S.tiles) {
    const t = S.tiles[k], d = Math.hypot(t.x * T - cx, t.y * T - cy) + (t.y * T > cy ? 0.1 : 0);
    if (d < bda) { bda = d; bestAny = t; }
    if (!t.fac && d < bd) { bd = d; best = t; }
  }
  const pt = best || bestAny;
  RB = { minx, maxx, miny, maxy, cx, cy, w, h, rad: Math.hypot(w, h) / 2, n, pkey: pt ? key(pt.x, pt.y) : null,
    px: pt ? pt.x * T : cx, py: pt ? pt.y * T + 4 : cy };
  return RB;
}
function playerPos() { const r = raftBox(); return { x: r.px, y: r.py }; }
function hasFac(t) { for (const k in S.tiles) if (S.tiles[k].fac && S.tiles[k].fac.t === t) return true; return false; }

// ---------------- canvas / camera ----------------
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 300, H = 400, DPR = 1;
function resize() {
  const r = $('#stage').getBoundingClientRect();
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);

// ---------------- events ----------------

  if (!name) { let tot = 0; for (const [, w] of opts) tot += w; let r = Math.random() * tot; for (const [n, w] of opts) { if ((r -= w) < 0) { name = n; break; } } }

  else if (name === 'island') {

    let x = clamp(rb.cx + side * (rb.w / 2 + r + 20), v.l + r * 0.7, v.r - r * 0.7);
    island = { x, y: v.t - r - 10, r, looted: false, side, seed: Math.random() * 100 };
    toast('小さな島が見えてきた！近づいたらタップ');

}

  let yy = y;
  const g = (r, n) => { give(r, n, x, yy); yy -= 16; };

  S.food = Math.min(100, S.food + 15); S.water = Math.min(100, S.water + 15); addFloat(x, yy, 'ヤシの実 水分・空腹+15', '#bff5b5');

function aimVec() {

function drawSharkBody(c, sh, vis) {

  c.beginPath(); c.moveTo(6, Wd * 0.7); c.lineTo(-8, Wd * 1.7); c.lineTo(-6, Wd * 0.6); c.closePath(); c.fill();
  // body
  c.beginPath(); c.moveTo(L * 0.5, 0); c.bezierCurveTo(L * 0.4, -Wd, -L * 0.1, -Wd * 1.05, -L * 0.45, -2); c.lineTo(-L * 0.45, 2); c.bezierCurveTo(-L * 0.1, Wd * 1.05, L * 0.4, Wd, L * 0.5, 0); c.fill();
  if (vis) {

    c.fillStyle = sh.flash > 0 ? '#fff' : '#566b78'; c.beginPath(); c.moveTo(8, 0); c.quadraticCurveTo(-4, -3, -14, -1); c.lineTo(-10, 3); c.closePath(); c.fill();

// ---------------- input ----------------
function localPt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (gameState !== 'play' || paused) return;
  e.preventDefault();
  const p = localPt(e), w = toWorld(p.x, p.y);
  if (!place && sharkHit(w)) { hitShark(w); return; }
  if (aim) return;
  aim = { id: e.pointerId, sx: p.x, sy: p.y, x: p.x, y: p.y, drag: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!aim || e.pointerId !== aim.id) return;
  const p = localPt(e); aim.x = p.x; aim.y = p.y;
  if (!aim.drag && Math.hypot(p.x - aim.sx, p.y - aim.sy) > 14 && !place) aim.drag = true;
});
function endPointer(e, cancel) {
  if (!aim || e.pointerId !== aim.id) return;
  const a = aim; aim = null;
  if (cancel || gameState !== 'play') return;
  const p = localPt(e); a.x = p.x; a.y = p.y;
  if (a.drag) {
    aim = a; const v = aimVec(); aim = null;
    if (v && !hook) { const pp = playerPos(), L = v.pow * hookRange(); launchHook(pp.x + v.dx * L, pp.y + v.dy * L); }

function tapAt(w) {
  if (place) { const gx = Math.round(w.x / T), gy = Math.round(w.y / T); if (!doPlace(gx, gy)) { SFX.error(); } return; }
  if (island && !island.looted && Math.hypot(w.x - island.x, (w.y - island.y) / 0.85) < island.r + 10) {

function bindSteer(btn, dir) {

  const off = () => { if (steer === dir) steer = 0; btn.classList.remove('on'); };

  btn.addEventListener('contextmenu', e => e.preventDefault());

bindSteer($('#steerL'), -1); bindSteer($('#steerR'), 1);

// ---------------- overlays ----------------
function showOv(html) { $('#ovPanel').innerHTML = html; $('#ov').hidden = false; }
function hideOv() { $('#ov').hidden = true; }
function showHowto(first) {
  paused = true;
  showOv('<h2>いかだ<span>暮らし</span></h2><p class="sub">水に沈んだ世界。小さないかだで何日生きられる？</p><ul>' +
    '<li><b>引っぱって離す</b>とフックを投げる。漂流物や海を<b>タップ</b>しても自動で投げる。</li>' +
    '<li><b>水分</b>と<b>空腹</b>は少しずつ減る。0になると体力が減る。まずは<b>浄水器</b>と<b>グリル</b>を。</li>' +
    '<li>設備は<b>タップで使う</b>。傷んだ床はタップで修理（木材1）。</li>' +
    '<li><b>サメ</b>が床をかじり始めたら、サメを<b>連打</b>して追い払え。槍があると強い。</li>' +
    '<li>嵐・木箱・島などのできごとも。自動で保存されます。</li></ul>' +
    '<div class="row"><button class="btn" id="ovGo">' + (first ? 'はじめる' : '続ける') + '</button></div>');

  paused = true;

// ---------------- lifecycle ----------------
function resetTransient() {

  endPlace(); closeSheet(); raftChanged(); cam.init = false;
}

  // populate the sea so the first screen is not empty

  for (let i = 0; i < 7; i++) { const it = spawnItem(null, rand(v.l + 20, v.r - 20), rand(v.t, v.b)); const rb = raftBox(); if (Math.abs(it.x - rb.cx) < rb.w / 2 + 14 && Math.abs(it.y - rb.cy) < rb.h / 2 + 14) it.y = v.t + 20; }
}

  S = newState(); gameState = 'play'; paused = false; resetTransient(); $('#toast').classList.remove('show'); updateCamera(0, true); prefill(); save();
  for (const k in hudCache) delete hudCache[k];

document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); showPause(); } });
window.addEventListener('pagehide', save);

  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (gameState === 'play' && !paused && !sheetOpen && S) {
    let total = dt * timeScale;
    while (total > 1e-6) { const st = Math.min(0.05, total); update(st); total -= st; if (gameState !== 'play') break; }
    animT += dt; waveY += currentSpeed() * cam.s * dt; waveX += steerVX() * cam.s * dt;
    saveAcc += dt; if (saveAcc > 3) { saveAcc = 0; save(); }
  }
  updateCamera(dt);
  render();
  updateHUD(dt);
}

// boot
resize(); renderSoundBtn(); buildInv();
{
  const loaded = loadSave();
  if (loaded) { S = loaded; gameState = 'play'; resetTransient(); updateCamera(0, true); prefill(); toast(S.day + '日目から再開'); }
  else startNew();
  if (!lsGet(LS_SEEN)) showHowto(true);
}
requestAnimationFrame(frame);

if (DEBUG) {
  window.__raft = {
    get S() { return S; }, get items() { return items; }, get shark() { return shark; }, get hook() { return hook; },
    get island() { return island; }, get gameState() { return gameState; }, get paused() { return paused; },
    setSpeed(n) { timeScale = n; }, spawn(type, x, y) { return spawnItem(type, x, y); }, spawnShark() { S.sharkT = 0; spawnShark(); },
    event(n) { triggerEvent(n); }, toScreen, playerPos, raftBox, save, give(r, n) { S.inv[r] += n; },
    clearItems() { items.length = 0; }
  };
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(()=>{});
