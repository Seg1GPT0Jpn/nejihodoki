<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>いかだ暮らし</title>
<meta name="theme-color" content="#0f3d47">
<meta name="description" content="水没した世界。漂流物を拾い、クルーを集め、イカダを海上基地に育てて海賊と嵐を生き延びる3Dサバイバル。">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="いかだ暮らし">
<script src="../common/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root {
  --deep: #0f3d47;
  --deep-2: #155160;
  --line: #2a6b78;
  --sand: #fff6e3;
  --sand-dim: #a9cdd2;
  --sun: #ffc94a;
  --sun-ink: #3a2600;
  --coral: #ff7a59;
  --hp: #ff6b6b;
  --water: #4cc3ff;
  --food: #ffa94d;
  --ok: #4fd18b;
  --ink: #23404a;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background: var(--deep); color: var(--sand); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
button { font-family: var(--font-body); color: inherit; }
#app {
  height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-top: max(4px, env(safe-area-inset-top, 0px));
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  gap: 5px;
}
header { display: flex; align-items: center; gap: 6px; min-height: 38px; }
.back { color: var(--sand-dim); text-decoration: none; font-size: 12.5px; font-weight: 800; white-space: nowrap; padding: 9px 4px; flex: none; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 17px; margin: 0; white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 400px) { h1 { font-size: 14px; } }
h1 span { color: var(--sun); }
#dayChip {
  display: flex; align-items: center; gap: 5px; background: var(--deep-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 10px 5px 7px; font-weight: 800; font-size: 12.5px; white-space: nowrap;
  font-variant-numeric: tabular-nums; flex: none;
}
#dayIcon { width: 14px; height: 14px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 6px rgba(255,201,74,.7); flex: none; }
#dayIcon.night { background: transparent; box-shadow: inset -4px -2px 0 0 #f3efcf; transform: rotate(-20deg); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--deep-2);
  display: grid; place-items: center; padding: 0; cursor: pointer; flex: none; font-weight: 800; font-size: 16px;
}
.icon-btn svg { width: 20px; height: 20px; }

/* HUD */
#hud { display: flex; flex-direction: column; gap: 4px; }
#mission {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--deep-2); border-radius: 14px;
  padding: 5px 10px 5px 5px; text-align: left; cursor: pointer; position: relative; overflow: hidden; min-height: 40px;
}
#lvBadge {
  flex: none; width: 40px; height: 32px; border-radius: 10px; background: var(--sun); color: var(--sun-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-weight: 800; font-size: 9px;
}
#lvBadge b { font: 400 15px var(--font-display); }
.mtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mtxt small { font-size: 10px; color: var(--sun); font-weight: 800; }
.mtxt b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mProg { flex: none; font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--sand-dim); }
#xpBar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--sun); width: 0; transition: width .3s; }
#mission.done { animation: mdone 1s ease-out; }
@keyframes mdone { 0% { background: #3d8a4a; } }
#stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--sand-dim); }
.stat .lbl b { color: var(--sand); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
.bar i { display: block; height: 100%; width: 100%; border-radius: 6px; }
#stHp .bar i { background: var(--hp); } #stWater .bar i { background: var(--water); } #stFood .bar i { background: var(--food); }
.stat.low .bar { animation: blink .7s steps(2) infinite; }
.stat.low .lbl { color: #ffb4a8; }
@keyframes blink { 50% { background: rgba(255,80,80,.55); } }
#res { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.rc {
  display: flex; align-items: baseline; justify-content: space-between; gap: 2px; background: rgba(0,0,0,.22); border-radius: 8px;
  padding: 3px 5px; font-size: 10.5px; font-weight: 800; min-width: 0; white-space: nowrap; border: 1px solid transparent;
}
.rc span { color: var(--sand-dim); overflow: hidden; text-overflow: ellipsis; }
html[lang="en"] .rc { padding: 3px 4px; letter-spacing: -.02em; } html[lang="en"] .rc span { font-size: 9.5px; }
@media (max-width: 400px) { html[lang="en"] .rc b small, html[lang="en"] #res .rc:last-child span { display: none; } }
.rc b { font-variant-numeric: tabular-nums; font-size: 11.5px; }
.rc b small { color: var(--sand-dim); font-size: 9px; font-weight: 500; }
.rc.full { border-color: var(--sun); } .rc.full b { color: var(--sun); }
.rc.zero b { color: #ff9d8a; }
.rc.bump { animation: bump .35s; }
@keyframes bump { 40% { background: #2a7a8a; } }

/* stage */
#stage { flex: 1; min-height: 0; position: relative; border-radius: 18px; overflow: hidden; background: #3b8fa8; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 0; top: 0; font-weight: 800; font-size: 13px; white-space: nowrap; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.5); will-change: transform; display: none;
}
.pop.bad { color: #ff8a7a; } .pop.good { color: #b9ffc8; } .pop.gold { color: var(--sun); }
.hpb { position: absolute; left: 0; top: 0; width: 30px; height: 5px; background: rgba(0,0,0,.6); border-radius: 3px; display: none; will-change: transform; }
.hpb i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.hpb.foe i { background: #ff5a4a; }
.tag {
  position: absolute; left: 0; top: 0; display: none; font-size: 11px; font-weight: 800; background: rgba(10,40,48,.85); color: var(--sun);
  border: 1px solid var(--sun); border-radius: 999px; padding: 2px 7px; white-space: nowrap; will-change: transform;
}
#toast {
  position: absolute; left: 50%; top: 8px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 5;
  background: rgba(10,40,48,.9); border: 1px solid rgba(255,255,255,.15); color: var(--sand);
  padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: 13px; white-space: nowrap; max-width: 94%;
  overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.warn { background: rgba(120,20,20,.92); border-color: #ff9a8a; }
#toast.good { background: rgba(26,96,52,.92); border-color: #9fe8b4; }
#alert {
  position: absolute; left: 8px; right: 8px; top: 44px; display: flex; align-items: center; gap: 8px; z-index: 4;
  background: rgba(120,24,24,.9); border: 1px solid #ff9a8a; border-radius: 14px; padding: 6px 6px 6px 12px; font-weight: 800; font-size: 13px;
}
#alert.storm { background: rgba(40,48,90,.92); border-color: #a9b8ff; }
#alert span { flex: 1; min-width: 0; }
#alert button { border: 0; border-radius: 10px; background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 13px; padding: 9px 12px; cursor: pointer; }
#placeBar {
  position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 8px; z-index: 4;
  background: rgba(255,246,227,.96); color: var(--ink); border-radius: 14px; padding: 8px 8px 8px 14px;
  font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
#placeBar span { flex: 1; }
#placeBar button { border: 0; border-radius: 10px; background: var(--ink); color: var(--sand); font-weight: 800; padding: 10px 14px; font-size: 14px; cursor: pointer; }
#coach {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3; display: flex; gap: 8px; align-items: flex-start;
  background: rgba(255,246,227,.95); color: var(--ink); border-radius: 14px; padding: 9px 8px 9px 12px; font-size: 13px; line-height: 1.5; font-weight: 800;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: auto;
}
#coach p { margin: 0; flex: 1; }
#coach p b { color: #c45a2c; }
#coach button { border: 0; background: transparent; color: #6c8a92; font-size: 18px; font-weight: 800; padding: 0 6px; cursor: pointer; line-height: 1; }
#side { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 2; align-items: flex-end; }
.sidechip {
  background: rgba(10,40,48,.78); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: 4px 10px; font-size: 11.5px;
  font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums;
}
#weatherChip { position: absolute; left: 8px; top: 8px; z-index: 2; }

/* tabs */
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
#tabs button {
  border: 1px solid var(--line); background: var(--deep-2); border-radius: 14px; min-height: 54px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 13px; cursor: pointer; padding: 4px 0; position: relative;
}
#tabs button svg { width: 22px; height: 22px; }
#tabs button.hint { border-color: var(--sun); box-shadow: 0 0 0 3px rgba(255,201,74,.35); animation: glow 1.4s ease-in-out infinite; }
#tabs button .dot { position: absolute; top: 5px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); display: none; }
#tabs button.badge .dot { display: block; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255,201,74,.15); } }

/* bottom sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(4,20,26,.4); padding-top: max(8px, env(safe-area-inset-top, 0px)); }
#sheet {
  background: var(--sand); color: var(--ink); border-radius: 22px 22px 0 0; max-width: 560px; width: 100%; margin: 0 auto;
  max-height: 76%; display: flex; flex-direction: column; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 30px rgba(0,0,0,.3); animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet-head { display: flex; align-items: center; padding: 13px 14px 6px 16px; gap: 8px; }
.sheet-head h2 { margin: 0; font: 400 18px var(--font-display); flex: 1; min-width: 0; }
.sheet-head button { border: 0; background: var(--ink); color: var(--sand); border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
#sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.sinfo { font-size: 12px; font-weight: 800; color: #4f6f78; padding: 0 4px; line-height: 1.5; }
.sec { font-size: 12px; font-weight: 800; color: #6c8a92; margin: 6px 4px 0; }
.card { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 1px 0 #e6dcc4; }
.card .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 400 17px var(--font-display); color: #fff; }
.card .txt { flex: 1; min-width: 0; }
.card .nm { font-weight: 800; font-size: 15px; }
.card .nm small { font-size: 11px; color: #6c8a92; margin-left: 4px; font-weight: 800; }
.card .ds { font-size: 12px; color: #4f6f78; line-height: 1.45; margin-top: 1px; }
.cost { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cost span { font-size: 11.5px; font-weight: 800; background: #e9f5f3; color: var(--ink); border-radius: 999px; padding: 2px 8px; }
.cost span.no { background: #ffe1db; color: #c0392b; }
.card button, .sbtn {
  flex: none; border: 0; border-radius: 12px; background: var(--coral); color: #fff; font-weight: 800; font-size: 14px;
  padding: 0 12px; min-width: 64px; height: 44px; cursor: pointer;
}
.sbtn.alt { background: var(--ink); color: var(--sand); }
.sbtn.ok { background: #2e9e63; }
.card button:disabled, .sbtn:disabled { background: #cfd8d6; color: #8a9a9d; cursor: default; }
.card.lock { opacity: .55; }
.card.sel { box-shadow: 0 0 0 3px var(--coral); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btnrow .sbtn { flex: 1; }
.hpmini { height: 5px; background: #e2e8e6; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.hpmini i { display: block; height: 100%; background: #2e9e63; }
.seg { display: inline-flex; border-radius: 10px; overflow: hidden; border: 2px solid var(--ink); flex: none; }
.seg button { border: 0; border-radius: 0; height: 40px; min-width: 46px; padding: 0 8px; background: #fff; color: var(--ink); font-weight: 800; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--sand); }
.pill { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; background: #e9f5f3; margin-right: 3px; }
.pill.r { background: #ffe1db; color: #c0392b; } .pill.g { background: #d8f5e3; color: #1d7a45; } .pill.y { background: #fff0c2; color: #8a5a00; }
.formation { background: #fff; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; }
.frow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; min-height: 28px; }
.frow b { width: 34px; flex: none; color: #6c8a92; }
.frow .pill { font-size: 12px; padding: 3px 8px; }
.mlist { display: flex; flex-direction: column; gap: 4px; }
.mitem { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 800; background: #fff; border-radius: 12px; padding: 8px 10px; }
.mitem.done { color: #8aa0a5; text-decoration: line-through; background: #f1ece0; }
.mitem.cur { box-shadow: 0 0 0 2px var(--coral); }
.mitem i { font-style: normal; color: #c45a2c; margin-left: auto; font-size: 11.5px; white-space: nowrap; }
.chipsel { display: flex; flex-wrap: wrap; gap: 6px; }
.chipsel button { border: 2px solid #cfd8d6; background: #fff; color: var(--ink); border-radius: 12px; padding: 6px 10px; font-weight: 800; font-size: 12.5px; min-height: 40px; }
.chipsel button.on { border-color: var(--coral); background: #fff0ea; }
.prog { height: 8px; border-radius: 4px; background: #e2e8e6; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--coral); }

/* overlays */
#ov { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(4,22,28,.62); padding: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
#ovPanel { max-height: calc(100% - 8px); overflow-y: auto; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
#ovPanel > .row:last-child { position: sticky; bottom: -18px; background: inherit; padding-block: 10px 4px; margin-bottom: -4px; z-index: 1; }
@media (max-height: 620px) { #ovPanel ul li { padding-block: 6px; } #ovPanel { font-size: 13px; } }
.panel {
  background: var(--sand); color: var(--ink); border-radius: 22px; width: min(370px, 100%); padding: 20px 18px 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,.4); text-align: center; animation: up .25s ease-out; max-height: 100%; overflow-y: auto;
}
.panel h2 { font: 400 25px var(--font-display); margin: 0 0 4px; }
.panel h2 span { color: var(--coral); }
.panel .sub { font-size: 13px; color: #4f6f78; margin: 0 0 12px; font-weight: 800; }
.panel ul { text-align: left; padding: 0; margin: 0 0 12px; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.panel li { font-size: 13px; line-height: 1.55; background: #fff; border-radius: 12px; padding: 7px 10px 7px 12px; }
.panel li b { color: #c45a2c; }
.big { font: 400 44px var(--font-display); color: var(--coral); margin: 6px 0 0; line-height: 1.1; }
.panel .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.btn {
  border: 0; border-radius: 14px; padding: 13px 20px; font: 800 16px var(--font-body); cursor: pointer;
  background: var(--coral); color: #fff; box-shadow: 0 3px 0 #c4553a; text-decoration: none; display: inline-block;
}
.btn.sub2 { background: var(--ink); box-shadow: 0 3px 0 #11262d; color: var(--sand); }
.recs { display: flex; justify-content: center; gap: 14px; font-size: 12px; font-weight: 800; color: #4f6f78; margin-top: 8px; flex-wrap: wrap; }
.recs b { display: block; font-size: 19px; color: var(--ink); }
.langrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; color: #4f6f78; }
.langrow select { font: 800 13px var(--font-body); color: var(--ink); background: #fff; border: 2px solid #cfd8d6; border-radius: 10px; padding: 6px 8px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; background: var(--deep); font-weight: 800; color: var(--sand-dim); text-align: center; padding: 20px; line-height: 1.7; }
@media (max-height: 660px) {
  #tabs button { min-height: 46px; } #tabs button svg { width: 18px; height: 18px; }
  .rc { padding: 2px 4px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" data-i18n>← ゲーム一覧</a>
    <h1 data-i18n-html>いかだ<span>暮らし</span></h1>
    <div id="dayChip"><i id="dayIcon"></i><span id="dayText"></span></div>
    <button class="icon-btn" id="helpBtn" aria-label="遊び方" data-i18n-attr="aria-label">?</button>
    <button class="icon-btn" id="soundBtn" aria-label="音のオンオフ" data-i18n-attr="aria-label"></button>
  </header>
  <div id="hud">
    <button id="mission" aria-label="現在の任務" data-i18n-attr="aria-label"><span id="lvBadge"><span data-i18n>船長Lv</span><b id="lvNum">1</b></span><span class="mtxt"><small data-i18n>メイン任務</small><b id="mText">…</b></span><span id="mProg"></span><i id="xpBar"></i></button>
    <div id="stats">
      <div class="stat" id="stHp"><div class="lbl"><span data-i18n>体力</span><b>100</b></div><div class="bar"><i></i></div></div>
      <div class="stat" id="stWater"><div class="lbl"><span data-i18n>水分</span><b>100</b></div><div class="bar"><i></i></div></div>
      <div class="stat" id="stFood"><div class="lbl"><span data-i18n>空腹</span><b>100</b></div><div class="bar"><i></i></div></div>
    </div>
    <div id="res"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="weatherChip" class="sidechip" hidden></div>
    <div id="side"><div class="sidechip" id="crewChip"></div><div class="sidechip" id="expChip" hidden></div></div>
    <div id="alert" hidden><span id="alertText"></span><button id="alertBtn" data-i18n>陣形</button></div>
    <div id="toast"></div>
    <div id="coach" hidden><p id="coachText"></p><button id="coachClose" aria-label="ヒントを閉じる" data-i18n-attr="aria-label">×</button></div>
    <div id="placeBar" hidden><span id="placeText" data-i18n>置く床をタップ</span><button id="placeCancel" data-i18n>やめる</button></div>

  [0.74, 0x2a2f5a, 0x8a5a7a, 0.25, 0.42, 0x10304a, 0x1f5070, 0xc08aa0],
  [0.80, 0x0a1028, 0x1a2a4c, 0.14, 0.3, 0x081a2c, 0x14405e, 0x9ab0e0],
  [0.95, 0x0a1028, 0x1a2a4c, 0.14, 0.3, 0x081a2c, 0x14405e, 0x9ab0e0],
  [1.00, 0x6a86c0, 0xf2b48a, 0.5, 0.55, 0x1d5a78, 0x3f8fb0, 0xffc9a0]

let flashT = 0;
function applySky(t, storm, rainA) {
  let a = PAL[0], b = PAL[1];
  for (let i = 0; i < PAL.length - 1; i++) if (t >= PAL[i].t && t <= PAL[i + 1].t) { a = PAL[i]; b = PAL[i + 1]; break; }
  const k = (t - a.t) / Math.max(1e-4, b.t - a.t);
  const dark = clamp(storm * 0.75 + rainA * 0.3, 0, 0.85);
  skyU.uTop.value.copy(a.top).lerp(b.top, k).lerp(STORM_C, dark * 0.8);
  skyU.uHor.value.copy(a.hor).lerp(b.hor, k).lerp(STORM_C, dark);
  oceanU.uDeep.value.copy(a.deep).lerp(b.deep, k).lerp(STORM_SEA, dark * 0.6);
  oceanU.uShal.value.copy(a.shal).lerp(b.shal, k).lerp(STORM_SEA, dark * 0.5);
  oceanU.uSunCol.value.copy(a.sc).lerp(b.sc, k).multiplyScalar(1 - dark * 0.6);
  const fl = flashT > 0 ? flashT * 2.2 : 0;
  sunL.intensity = (a.sun + (b.sun - a.sun) * k) * (1 - dark * 0.6) + fl;
  sunL.color.copy(oceanU.uSunCol.value);
  hemi.intensity = (a.hemi + (b.hemi - a.hemi) * k) * (1 - dark * 0.35) + fl * 0.6;
  scene.fog.color.copy(skyU.uHor.value); oceanU.uFog.value.copy(skyU.uHor.value);
  oceanU.uAmb.value.copy(skyU.uTop.value).multiplyScalar(0.45).add(tmpC.setRGB(0.12, 0.16, 0.2));
  const far = 120 - dark * 55 - (isNight(t) ? 25 : 0);
  scene.fog.near = far * 0.3; scene.fog.far = far; oceanU.uFogN.value = far * 0.3; oceanU.uFogF.value = far;
  // sun / moon
  const sa = t < DUSK ? (t / DUSK) * Math.PI : ((t - DUSK) / (1 - DUSK)) * Math.PI;
  const dx = Math.cos(sa), dy = Math.sin(sa) * 0.9 + 0.08;

  const body = sunMesh.visible ? sunMesh : moonMesh;
  body.position.set(camT.x + dx * 170, Math.max(4, dy * 150), camT.z - 120);
  oceanU.uSunDir.value.set(dx, Math.max(0.15, dy), -0.5).normalize();
  sunL.position.set(camT.x + dx * 40, Math.max(6, dy * 50), camT.z - 20); sunL.target.position.set(camT.x, 0, camT.z);
  stars.material.opacity = isNight(t) ? (1 - dark) * 0.9 : (t > 0.7 ? clamp((t - 0.7) * 20, 0, 0.9) : 0);
  sky.position.set(camT.x, 0, camT.z); stars.position.set(camT.x, 0, camT.z);
}

function feedCrew(label) {

  const gone = [];

    if (c.away) continue;
    if (c.skill === '少食' && label === '夕') { fed++; continue; }
    let ate = null;
    if (S.res.meal >= 1) { S.res.meal--; ate = 'meal'; } else if (S.res.veg >= 1) { S.res.veg--; ate = 'veg'; } else if (S.res.fish >= 1) { S.res.fish--; ate = 'fish'; }

    } else {
      c.starve++; hungry++;
      c.hp -= mx * (ate || drank ? 0.2 : 0.35);
      if (c.hp <= 0) gone.push([c, 'died']); else if (c.starve >= 3) gone.push([c, 'left']);

  for (const [c, why] of gone) {

    toast(T(why === 'died' ? '{name}が飢えと渇きで倒れた…' : '{name}は空腹に耐えかねてイカダを去った…', { name: cName(c) }), 'warn');
  }

  else if (fed) toastSoft(T(label === '朝' ? '朝食：クルー{n}人が食事をとった' : '夕食：クルー{n}人が食事をとった', { n: fed }));
}

// ---- production ----
function crewBonus(c, t) {

  if (c.hp < crewMaxHp(c) * 0.3) b *= 0.5;

}
function facBonus(k) {

  for (const c of S.crew) if (c.job === k && !(B && S.allHands && t.f.t !== 'lookout' && t.f.t !== 'ballista')) b += crewBonus(c, t.f.t);
  return b;
}
function facWorkers(k) { return S.crew.filter(c => c.job === k); }
function facRate(k) { // per day
  const t = S.tiles[k], f = t.f, F = FAC[f.t];
  if (F.out || F.conv) return F.base * f.lv * (1 + facBonus(k));
  if (f.t === 'tank') return f.lv * (S.weather.storm > 0.3 ? 24 : S.weather.rain > 0.2 ? 10 : 0.8);

}

    const t = S.tiles[k], f = t.f; if (!f) continue;
    const F = FAC[f.t];
    if (!(F.out || F.conv || f.t === 'tank' || f.t === 'workbench')) continue;
    const r = facRate(k); if (r <= 0) continue;
    if (f.t === 'workbench') {
      let worst = null;
      for (const kk in S.tiles) { const tt = S.tiles[kk]; if (tt.hp < tileMaxHp() && (!worst || tt.hp < worst.hp)) worst = tt; }
      if (worst) worst.hp = Math.min(tileMaxHp(), worst.hp + r * dd);
      continue;
    }
    f.acc = (f.acc || 0) + r * dd;
    if (f.acc >= 1) {
      let n = Math.floor(f.acc); f.acc -= n;
      if (F.conv) { n = Math.min(n, S.res[F.conv[0]]); if (n <= 0) { f.acc = Math.min(f.acc, 1); continue; } S.res[F.conv[0]] -= n; }

function startExpand() {

function endPlace() { place = null; setHighlights([]); $('#placeBar').hidden = true; rangeRing.visible = false; uiDirty = true; }

function doPlace(p) {
  if (place.kind === 'fac') {

}

  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) gest = { sx: p.x, sy: p.y, t: performance.now(), moved: false, lx: p.x, ly: p.y };
  else if (ptrs.size === 2) { const a = [...ptrs.values()]; gest = { pinch: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), dist: cam.dist, moved: true }; }
});
cv.addEventListener('pointermove', e => {

    const a = [...ptrs.values()]; const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    cam.dist = clamp(gest.dist * gest.pinch / Math.max(20, d), 10, 44);
  } else if (ptrs.size === 1 && gest.sx != null) {
    if (Math.hypot(p.x - gest.sx, p.y - gest.sy) > 9) gest.moved = true;
    if (gest.moved) {
      cam.yaw -= (p.x - gest.lx) * 0.009; cam.pitch = clamp(cam.pitch + (p.y - gest.ly) * 0.006, 0.28, 1.35);

  }
});
function ptrEnd(e) {
  if (!ptrs.has(e.pointerId)) return;

  if (gest && !gest.moved && gest.sx != null && ptrs.size === 0 && performance.now() - gest.t < 500) onTap(p.x, p.y);

cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.001), 10, 44); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function raftPick(x, y) {
  ndc.set(x / W * 2 - 1, -(y / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(raftG.children, true);
  for (const h of hits) {
    if (!visibleChain(h.object)) continue;
    let o = h.object;
    while (o && !o.userData.pick) o = o.parent;
    if (o && o.userData.pick) return o.userData.pick;
  }
  return null;
}
function screenPick(x, y) {
  let best = null, bd = 1e9;
  for (const d of debris) {
    if (d.hooked || !d.g) continue;
    const s = toScreen(d.g.position.x, d.g.position.y + 0.3, d.g.position.z); if (!s.vis) continue;
    const r = d.type === 'castaway' ? 64 : 46, dist = Math.hypot(s.x - x, s.y - y) / r;
    if (dist < 1 && dist < bd) { bd = dist; best = { kind: 'debris', d }; }
  }
  for (const s of sharks) {
    if (s.st === 'flee') continue;
    const p = toScreen(s.g.position.x, s.g.position.y + 0.4, s.g.position.z); if (!p.vis) continue;
    const dist = Math.hypot(p.x - x, p.y - y) / 70;
    if (dist < 1 && dist * 0.8 < bd) { bd = dist * 0.8; best = { kind: 'shark', s }; }
  }
  return best;
}
function onTap(x, y) {
  if (gameState !== 'play' || paused) return;
  if (place) {
    const p = raftPick(x, y);
    if (p && p.kind === 'place') doPlace(p); else toast(place.kind === 'tile' ? T('黄色い場所をタップ') : T('光っている床をタップ'), '');
    return;
  }
  const sp = screenPick(x, y);
  if (sp && sp.kind === 'shark') { strikeShark(sp.s); return; }
  if (sp && sp.kind === 'debris') { throwHook(sp.d); return; }
  const p = raftPick(x, y);
  if (p) {
    if (p.kind === 'tile') { const t = S.tiles[p.k]; if (!t) return; SFX.tap(); openSheet(t.f ? 'fac' : 'tile', p.k); return; }
    if (p.kind === 'crew') { SFX.tap(); openSheet('crew'); return; }
    if (p.kind === 'cap') { toast(T('船長：体力{a}・水分{b}・空腹{c}', { a: Math.round(S.cap.hp), b: Math.round(S.cap.water), c: Math.round(S.cap.food) }), ''); return; }
  }
}

// ---- sound button ----
function renderSoundBtn() {
  $('#soundBtn').innerHTML = soundOn
    ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; lsSet(LS_SOUND, soundOn ? '1' : '0'); renderSoundBtn(); if (soundOn) { ensureAudio(); SFX.tap(); } });

// ---- overlays ----
function showOv(html) { $('#ovPanel').innerHTML = html; $('#ov').hidden = false; }
function hideOv() { $('#ov').hidden = true; }
function showHowto(first) {
  paused = true;
  showOv('<h2>' + T('いかだ<span>暮らし</span>') + '</h2><p class="sub">' + T('水に沈んだ世界。小さなイカダを海上基地に育てて生き延びろ。') + '</p><ul>' +
    '<li>' + T('<b>漂流物をタップ</b>でフックを投げて拾う。<b>ドラッグで視点を回転</b>、ピンチ／ホイールで拡大。') + '</li>' +
    '<li>' + T('下の<b>建設</b>で施設を置く。施設や床をタップで強化・修理・クルー配置。資源には上限があるので使い切ろう。') + '</li>' +
    '<li>' + T('<b>漂流者</b>を助けるとクルーに。得意な施設に配置すると生産が大きく上がる。クルーは毎日朝夕に<b>食事と水</b>をとり、足りないと弱って去っていく。') + '</li>' +
    '<li>' + T('2日目の夜から<b>海賊</b>が来る。配置していないクルーが自動で戦う。<b>陣形</b>が大事：戦士は前列、射手は後列。<b>見張り台</b>と<b>砲台</b>で備えよう。') + '</li>' +
    '<li>' + T('<b>サメ</b>はタップで突く。<b>嵐</b>は外周の床を傷める。上の<b>メイン任務</b>を進めると船長Lvが上がり、施設が解放される。') + '</li></ul>' +
    '<div class="langrow"><span>' + T('言語') + '</span><span id="langPick"></span></div>' +
    '<div class="row"><button class="btn" id="ovGo">' + (first ? T('はじめる') : T('続ける')) + '</button></div>');
  KoboI18n.picker($('#langPick'));
  $('#ovGo').addEventListener('click', () => { lsSet(LS_SEEN, '1'); hideOv(); paused = false; ensureAudio(); });
}
function showPause() {
  if (gameState !== 'play' || !$('#ov').hidden) return;
  paused = true;
  showOv('<h2>' + T('一時停止') + '</h2><p class="sub">' + T('{d}日目', { d: S.day }) + ' ' + clockStr(S.time) + '</p><div class="langrow"><span>' + T('言語') + '</span><span id="langPick"></span></div><div class="row"><button class="btn" id="ovGo">' + T('再開') + '</button></div>');
  KoboI18n.picker($('#langPick'));
  $('#ovGo').addEventListener('click', () => { hideOv(); paused = false; ensureAudio(); });
}
function gameOver(why) {
  if (gameState === 'over') return;
  gameState = 'over'; updateBest(); lsDel(LS_SAVE); SFX.over(); vibrate(200);
  if (place) endPlace();
  closeSheet();
  if (headless) return;
  const best = bestDays();
  setTimeout(() => {
    showOv('<h2>' + (why === 'sunk' ? T('イカダが<span>沈んだ</span>') : T('力<span>尽きた</span>')) + '</h2>' +
      '<p class="big">' + T('{d}日目', { d: S.day }) + '</p><p class="sub">' + T('まで生き延びた（船長Lv{n}）', { n: S.cap.lv }) + '</p>' +
      '<div class="recs"><div>' + T('最長記録') + '<b>' + T('{n}日', { n: best }) + '</b></div><div>' + T('撃退') + '<b>' + T('{n}回', { n: S.stats.raidsWon }) + '</b></div><div>' + T('仲間') + '<b>' + T('{n}人', { n: S.crew.length }) + '</b></div><div>' + T('拾った物') + '<b>' + S.stats.caught + '</b></div></div>' +
      '<div class="row"><button class="btn" id="ovRetry">' + T('もう一度') + '</button><a class="btn sub2" href="../">' + T('ゲーム一覧') + '</a></div>');
    $('#ovRetry').addEventListener('click', () => { hideOv(); startNew(); });

$('#helpBtn').addEventListener('click', () => { if (gameState === 'play') showHowto(false); });

// ---- lifecycle ----
function clearWorld() {
  for (const d of debris.slice()) removeDebris(d);
  for (const s of sharks) relPooled(sharkPool, s.g);
  sharks = []; hook = null;
  if (B) { for (const r of B.raiders) relPooled(raiderPool, r.g); relPooled(boatPool, B.boat.g); B = null; }
  for (const k in TV) { raftG.remove(TV[k].g); delete TV[k]; }
  for (const [, m] of CM) raftG.remove(m.g); CM.clear();
  if (capModel) { raftG.remove(capModel.g); capModel = null; }
  if (place) endPlace();
  closeSheet(); raftChanged(); crewDirty = true; spawnAcc = 0;
  for (const k in turretCd) delete turretCd[k];
  for (const k in hudC) delete hudC[k];
  uiDirty = true; resDirty = true;
}
function prefill() {
  const rb = raftBox();
  for (let i = 0; i < 10; i++) {
    const z = rb.cz - 34 + i * 6.5, x = rb.cx + rand(-1, 1) * (rb.rad + 9);
    if (Math.abs(x - rb.cx) < rb.rad + 1.5 && Math.abs(z - rb.cz) < rb.rad + 1.5) continue;

}

}

  camT.set(0, 0, 0); prefill(); save();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (!DEBUG) showPause(); } });
window.addEventListener('pagehide', save);

let last = performance.now(), saveAcc = 0, firstFrame = true;

  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;

if (!glOk || !renderer) {
  $('#loading').innerHTML = T('この端末では3D表示（WebGL）が使えないため遊べません。') + '<br><a href="../" style="color:#ffc94a">' + T('ゲーム一覧へ') + '</a>';
} else {
  resize();
  const loaded = loadSave();
  if (loaded) { S = loaded; gameState = 'play'; afterLoad(); const rb = raftBox(); camT.set(rb.cx, 0, rb.cz); prefill(); toast(T('{d}日目から再開', { d: S.day }), ''); }
  else startNew();
  simT = S.elapsed;
  if (!lsGet(LS_SEEN)) showHowto(true);
  requestAnimationFrame(frame);
}

if (DEBUG) {
  window.__raft = {
    get S() { return S; }, get B() { return B; }, get debris() { return debris; }, get sharks() { return sharks; }, get hook() { return hook; },

    addCrew(role) { const c = makeCrew(role); S.crew.push(c); crewChanged(); return c; }, sendExp, genIsles, spawnShark, strikeShark, freeTilesFor, facRate, facCount, raidPower,
    raidNow(side) { S.raid.queue = S.raid.queue || []; S.raid.queue.unshift(S.elapsed); S.raid.state = 'none'; updateRaid(0); if (side != null) S.raid.side = side; S.raid.at = S.elapsed; updateRaid(0); return B; },
    toScreen(x, y, z) { const s = toScreen(x, y, z); return { x: s.x, y: s.y, vis: s.vis }; }, raftY() { return raftG.position.y; },

  };
}
