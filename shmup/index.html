<style>
/* ペーパーウイング: the shared --kb-* tokens do the light/dark work; --pw-* are this game's own */
:root { --pw-card: var(--kb-surface); --pw-panel: rgba(127, 150, 170, .12); --pw-go: linear-gradient(var(--kb-accent), color-mix(in srgb, var(--kb-accent) 78%, #000)); --pw-go-shadow: color-mix(in srgb, var(--kb-accent) 45%, #000); --pw-bad: #ff7a6b; --pw-good: #5fe08a; --pw-title: linear-gradient(90deg, #9fd3ff, #fff 45%, #ffd36b); }
:root[data-kb-theme="light"] { --pw-bad: #c2412a; --pw-good: #2c8a52; --pw-title: linear-gradient(90deg, #2f6fd0, #4a8fe0 50%, #c27a00); }
@media (prefers-color-scheme: light) { :root:not([data-kb-theme="dark"]) { --pw-bad: #c2412a; --pw-good: #2c8a52; --pw-title: linear-gradient(90deg, #2f6fd0, #4a8fe0 50%, #c27a00); } }
html, body { height: 100%; margin: 0; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--kb-bg); color: var(--kb-ink); font-family: var(--kb-font-body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; padding: var(--kb-sat) var(--kb-sar) var(--kb-sab) var(--kb-sal); }
:focus-visible { outline: 2px solid var(--kb-accent); outline-offset: 2px; }
header { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 6px 0; }
h1 { flex: 1 1 auto; min-width: 0; margin: 0; font: 400 17px var(--kb-font-display); background: var(--pw-title); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back, .icon { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--kb-ink); text-decoration: none; background: var(--pw-panel); border: 1px solid var(--kb-line); padding: 0; cursor: pointer; }
.back svg, .icon svg { width: 22px; height: 22px; }
#stage { flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 4px 6px; }
#cv { display: block; touch-action: none; border-radius: 8px; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); background: #000; }
#tbtn { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; padding: 0 12px calc(12px + var(--kb-sab)); pointer-events: none; z-index: 20; }
body.touch.playing #tbtn { display: flex; position: fixed; }
.tb { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--kb-line); background: color-mix(in srgb, var(--kb-surface) 70%, transparent); color: var(--kb-ink); font: 800 13px var(--kb-font-body); display: grid; place-items: center; touch-action: none; padding: 0; backdrop-filter: blur(3px); }
.tb[aria-pressed="true"] { border-color: var(--kb-accent); box-shadow: 0 0 0 3px var(--kb-accent-soft); }
.tb:active { transform: scale(.94); }
.tb small { display: block; font-weight: 500; font-size: 10px; opacity: .8; }
#pauseFab { position: fixed; right: calc(8px + var(--kb-sar)); top: calc(34px + var(--kb-sat)); z-index: 20; display: none; width: 44px; height: 44px; opacity: .7; }
#rp { position: absolute; left: 8px; right: 8px; bottom: calc(6px + var(--kb-sab)); z-index: 25; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 14px; background: color-mix(in srgb, var(--kb-surface) 88%, transparent); border: 1px solid var(--kb-line); }
#rp input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--kb-accent); height: 28px; }
#rp .sm { flex: none; min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--kb-line); background: var(--pw-panel); color: var(--kb-ink); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 0 8px; }
#rpInfo { position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-size: 11px; color: var(--kb-dim); }
@media (orientation: landscape) and (max-height: 520px) {
  body.playing header { display: none; } body.playing #pauseFab { display: grid; } body.playing #stage { padding: 0; }
  header { padding-top: 0; } .back, .icon { width: 40px; height: 40px; }
}
@media (orientation: portrait) { body.touch.playing #pauseFab { display: none; } }
.overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; height: var(--kb-vh); background: var(--kb-scrim); box-sizing: border-box; overscroll-behavior: contain; padding: max(10px, var(--kb-sat)) max(10px, var(--kb-sar)) max(10px, var(--kb-sab)) max(10px, var(--kb-sal)); animation: fade .2s ease-out; touch-action: pan-y; }
.panel { width: 100%; max-width: 480px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--pw-card); border: 1px solid var(--kb-line); border-radius: 22px; padding: 14px 14px 10px; text-align: center; color: var(--kb-ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); animation: rise .25s ease-out; }
.panel > * { flex: none; }
.panel .scroll { flex: 1 1 auto; min-height: 40px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 2px; }
.panel h2 { margin: 0 0 2px; font: 400 21px var(--kb-font-display); color: var(--kb-accent-text); overflow-wrap: anywhere; }
.panel h2.logo { background: var(--pw-title); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 28px; }
.panel p { margin: 4px 0; font-size: 12.5px; line-height: 1.5; color: var(--kb-dim); }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: 100%; min-height: 46px; margin-top: 8px; padding: 8px 10px; border-radius: 16px; border: 0; cursor: pointer; background: var(--pw-go); color: var(--kb-accent-ink); font: 800 16px var(--kb-font-body); box-shadow: 0 4px 0 var(--pw-go-shadow); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--pw-go-shadow); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sub { background: var(--pw-panel); color: var(--kb-ink); box-shadow: none; border: 1px solid var(--kb-line); font-size: 13.5px; min-height: 44px; }
.btn.link { background: transparent; color: var(--kb-dim); box-shadow: none; font-size: 13.5px; min-height: 44px; margin-top: 2px; }
.row2 { display: flex; gap: 8px; } .row2 > .btn { flex: 1; min-width: 0; }
.qm { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; box-sizing: border-box; margin-top: 6px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid var(--kb-accent); background: var(--kb-accent-soft); color: var(--kb-ink); font: 800 14px var(--kb-font-body); text-align: left; cursor: pointer; }
.qm:first-child { margin-top: 0; } .qm:disabled { opacity: .5; cursor: default; }
.qm b { display: block; font-size: 15px; } .qm small { display: block; font-weight: 500; font-size: 11.5px; color: var(--kb-dim); }
.qm .go { flex: none; margin-left: auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 16px; }
.qm.plain { border-color: var(--kb-line); background: var(--pw-panel); }
.og { margin: 8px 0 0; text-align: left; } .og .ol { font-size: 11.5px; font-weight: 800; color: var(--kb-dim); margin: 0 0 3px 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--pw-panel); border: 1px solid var(--kb-line); flex-wrap: wrap; }
.opt { flex: 1 1 0; min-width: 44px; min-height: 44px; border-radius: 11px; border: 0; background: transparent; color: var(--kb-dim); font: 800 13px var(--kb-font-body); cursor: pointer; padding: 2px 4px; }
.opt[aria-pressed="true"] { background: var(--kb-surface); color: var(--kb-ink); box-shadow: inset 0 0 0 2px var(--kb-accent); }
.opt:disabled { opacity: .35; cursor: default; }
.ships { display: grid; gap: 6px; } .ship { display: flex; gap: 10px; align-items: center; text-align: left; min-height: 56px; padding: 6px 10px; border-radius: 14px; border: 1px solid var(--kb-line); background: var(--pw-panel); color: var(--kb-ink); font: inherit; cursor: pointer; }
.ship[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--kb-accent); background: var(--kb-accent-soft); }
.ship canvas { flex: none; width: 52px; height: 42px; } .ship b { display: block; font-size: 14px; } .ship small { display: block; font-size: 11px; color: var(--kb-dim); font-weight: 500; line-height: 1.35; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; font-size: 13px; font-weight: 800; padding: 2px 4px; cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--kb-accent); flex: none; } .chk small { display: block; font-weight: 500; color: var(--kb-dim); font-size: 11px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 6px 6px; text-align: left; font-size: 13px; font-weight: 800; }
.kv span:nth-child(odd) { color: var(--kb-dim); font-weight: 500; } .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.big { font: 400 30px var(--kb-font-display); line-height: 1.15; color: var(--kb-ink); font-variant-numeric: tabular-nums; }
.newrec { display: inline-block; margin: 2px 0; padding: 2px 10px; border-radius: 999px; background: var(--kb-accent); color: var(--kb-accent-ink); font-size: 12px; font-weight: 800; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; } .tbl td, .tbl th { padding: 4px 6px; border-bottom: 1px solid var(--kb-line); } .tbl th { color: var(--kb-dim); font-weight: 500; font-size: 11px; } .tbl td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.howto { text-align: left; } .howto h2 { text-align: center; } .howto h3 { margin: 12px 0 2px; font-size: 13.5px; color: var(--kb-accent-text); }
.howto ul { margin: 4px 0; padding-left: 20px; font-size: 12.5px; line-height: 1.55; } .howto li { margin: 3px 0; }
.stgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .stgrid .opt { background: var(--pw-panel); border: 1px solid var(--kb-line); min-height: 48px; }
.langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--kb-line); font-size: 12.5px; font-weight: 800; color: var(--kb-dim); }
.langrow select { min-height: 44px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 800 14px var(--kb-font-body); padding: 4px 8px; }
textarea.code { width: 100%; box-sizing: border-box; min-height: 70px; border-radius: 10px; border: 1px solid var(--kb-line); background: var(--kb-bg); color: var(--kb-ink); font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 6px; resize: vertical; user-select: text; -webkit-user-select: text; }
.err { color: var(--pw-bad); font-size: 12px; font-weight: 800; min-height: 16px; margin: 4px 0 0; }
.toastbar { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 85; max-width: 90%; padding: 8px 16px; border-radius: 14px; background: rgba(20, 20, 28, .9); color: #fff; font-weight: 800; font-size: 14px; pointer-events: none; animation: fade .2s; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .panel, .overlay, .toastbar { animation: none !important; } }
@media (max-width: 379px) { h1 { font-size: 15px; } .tb { width: 64px; height: 64px; } }
@media (max-height: 560px) { .panel { padding: 10px 10px 8px; } .panel h2.logo { font-size: 22px; } .qm { min-height: 48px; } }
body.thumb header, body.thumb #tbtn, body.thumb #pauseFab { display: none !important; } body.thumb #stage { padding: 0; } body.thumb #cv { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../" aria-label="ゲーム一覧へ戻る" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 data-i18n>ペーパーウイング</h1>
    <button class="icon" id="sndBtn" type="button" aria-label="サウンド" data-i18n-attr="aria-label" aria-pressed="true"></button>
    <button class="icon" id="menuBtn" type="button" aria-label="メニュー" data-i18n-attr="aria-label" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
  </header>
  <div id="stage"><canvas id="cv" tabindex="0" role="application" aria-label="ゲーム画面" data-i18n-attr="aria-label"></canvas></div>
  <div id="rp" hidden>
    <button class="sm" id="rpPlay" type="button" aria-label="再生・一時停止" data-i18n-attr="aria-label">❚❚</button>
    <input id="rpRange" type="range" min="0" max="0" value="0" aria-label="位置" data-i18n-attr="aria-label">
    <button class="sm" id="rpSpeed" type="button">x1</button>
    <button class="sm" id="rpDone" type="button" data-i18n>とじる</button>
    <div id="rpInfo"></div>
  </div>
</div>
<div id="tbtn">
  <button class="tb" id="bFocus" type="button" aria-pressed="false"><span><span data-i18n>ゆっくり</span><small>Shift</small></span></button>
  <button class="tb" id="bBomb" type="button"><span><span data-i18n>ボム</span><small>X</small></span></button>
</div>
<button class="icon" id="pauseFab" type="button" aria-label="ポーズ" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
<div class="overlay" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="panel" id="panel"></div></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script src="stages.js"></script>
<script src="engine.js"></script>
<script src="bot.js"></script>

<script>
(() => {
'use strict';
// ペーパーウイング — a side-scrolling shooter: a squadron of toy paper planes against a rusty junk fleet.
// engine.js (pure, deterministic, replayable) + stages.js (data) + art.js (canvas sprites) + this file (input, screens, modes, saves, replays).
const T = KoboI18n.t;
KoboI18n.add({ en: { 'ペーパーウイング': 'Paper Wing', 'ゲーム一覧へ戻る': 'Back to games', 'メニュー': 'Menu', 'サウンド': 'Sound', 'サウンド オン': 'Sound on', 'サウンド オフ': 'Sound off', 'ゲーム画面': 'Game screen', 'ポーズ': 'Pause', 'ボム': 'Bomb', 'ゆっくり': 'Slow', 'とじる': 'Close', '位置': 'Position', '再生・一時停止': 'Play / pause', '言語 / Language': 'Language', '連鎖': 'chain', 'ひとやすみ': 'Paused', '一時停止': 'Paused' } });
const EN = KoboI18n.lang === 'en';
const L = (ja, en) => (EN ? en : ja);
const E = window.ShmupEngine, ART = window.ShmupArt, D = window.ShmupData, BOT = window.ShmupBot;
const PF = window.KoboPlatform || null, A = window.KoboAudio || null, UI = window.KoboUI || null;
const KG = () => window.KoboGame || null;
const GAME = 'shmup', SAVE_KEY = 'kusoge.shmup.save', RANK_KEY = 'kusoge.shmup.rank', REPS_KEY = 'kusoge.shmup.reps', HOWTO_KEY = 'kusoge.shmup.howto';
const DEBUG = /[?&]debug\b/.test(location.search);
const IN = E.IN, W = 480, H = 270;
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const nm = o => (EN ? o.en : o.ja);
const popc = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };
const coarse = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
function emit(type, p) { const g = KG(); if (g) g.emit(type, p); }
const dayKey = () => (PF && PF.jstDateKey ? PF.jstDateKey() : (() => { const d = new Date(Date.now() + 9 * 3600000); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); })());

// ---------------------------------------------------------------- save
function newSave() { return { v: 1, rank: 0, best: { a: {}, r: {}, p: {} }, dl: { k: 0, s: 0 }, reach: 1, cl: {}, stats: { plays: 0, kills: 0, graze: 0, bombs: 0, deaths: 0, bossn: 0, bosses: 0, maxChain: 0, stages: 0, conts: 0, nomiss: 0, items: 0, daily: 0, clr1: 0, shipn: 0, secs: 0 }, ships: 0, set: { ship: 0, diff: 0, assist: 0, core: 0, gain: 13 }, tut: 0 }; }
function readSave() {
  let o = null; try { o = JSON.parse(store.get(SAVE_KEY) || 'null'); } catch (e) {}
  const s = newSave(); if (!o || typeof o !== 'object') return s;
  const num = (v, d) => (Number.isFinite(v) ? v : d);
  s.rank = num(o.rank, 0); s.reach = clamp(num(o.reach, 1), 1, 7); s.ships = num(o.ships, 0) | 0; s.tut = num(o.tut, 0);
  for (const g of ['a', 'r', 'p']) if (o.best && o.best[g] && typeof o.best[g] === 'object') for (const k of Object.keys(o.best[g])) s.best[g][k] = num(o.best[g][k], 0);
  if (o.dl) { s.dl.k = num(o.dl.k, 0); s.dl.s = num(o.dl.s, 0); }
  if (o.cl && typeof o.cl === 'object') for (const k of Object.keys(o.cl)) s.cl[k] = num(o.cl[k], 0);
  if (o.stats) for (const k of Object.keys(s.stats)) s.stats[k] = num(o.stats[k], s.stats[k]);
  if (o.set) { s.set.ship = clamp(num(o.set.ship, 0) | 0, 0, 2); s.set.diff = clamp(num(o.set.diff, 0) | 0, 0, 3); s.set.assist = num(o.set.assist, 0) & 7; s.set.core = o.set.core ? 1 : 0; s.set.gain = clamp(num(o.set.gain, 13), 8, 24); }
  return s;
}
let save = readSave();
const writeSave = () => store.set(SAVE_KEY, JSON.stringify(save));
const readList = k => { try { const a = JSON.parse(store.get(k) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };

// ---------------------------------------------------------------- state
let S = null, run = null, raf = 0, last = 0, acc = 0, demo = null;
const view = { t: 0, shake: 0, flash: 0, en: EN, bg: null, showCore: false, hud: true };
let K = 2, perfN = 0, perfSum = 0;
const cv = $('cv'), cx = cv.getContext('2d', { alpha: false });
function sizeCanvas() { cv.width = W * K; cv.height = H * K; }
function fit() {
  const st = $('stage'), r = st.getBoundingClientRect(), cs = getComputedStyle(st);
  const aw = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let w = aw, h = w * 9 / 16; if (h > ah) { h = ah; w = h * 16 / 9; }
  cv.style.width = Math.max(10, Math.floor(w)) + 'px'; cv.style.height = Math.max(10, Math.floor(h)) + 'px';
}
ART.init(K); sizeCanvas();

// ---------------------------------------------------------------- sound (KoboAudio only; no BGM)
let sndN = 0;
const SND = {

  showOv('over', `<h2 id="ovTitle">GAME OVER</h2><div class="big">${fmt(S.score)}</div>
  <p>${left > 0 ? L('コンティニューすると、スコアが半分になります。', 'Continuing halves your score.') : L('コンティニューは使い切りました。', 'No continues left.')}</p>
  <div class="kv"><span>${L('コンティニュー残り', 'Continues left')}</span><span>${Math.max(0, left)}</span><span>${L('ステージ', 'Stage')}</span><span>${S.stage + 1}</span></div>
  ${left > 0 ? btn('cont', L('コンティニュー', 'Continue'), '', 'data-focus') : ''}${btn('end', L('おわる', 'Give up'), left > 0 ? 'sub' : '', left > 0 ? '' : 'data-focus')}`);
}
function resultHtml(r) {
  const o = r.opts, st = r.st;
  return `<h2 id="ovTitle">${r.cleared ? L('ぜんぶクリア！', 'All Clear!') : L('おつかれさま', 'Run over')}</h2>
  <div class="scroll"><div class="big">${fmt(r.score)}</div>${r.newBest ? `<div class="newrec">${L('ベスト更新！', 'New best!')}</div>` : ''}
  <div class="kv"><span>${L('モード', 'Mode')}</span><span>${{ arcade: L('アーケード', 'Arcade'), practice: L('練習', 'Practice'), rush: L('ボスラッシュ', 'Boss Rush'), daily: L('チャレンジ', 'Daily') }[o.mode]} · ${esc(DIFFNAME(o.diff))}</span>
  <span>${L('機体', 'Ship')}</span><span>${esc(SHIPNAME(o.ship))}</span><span>${L('倒した数', 'Kills')}</span><span>${st.kills}</span><span>${L('最大連鎖', 'Best chain')}</span><span>${st.maxChain}</span><span>${L('グレイズ', 'Grazes')}</span><span>${st.graze}</span><span>${L('ボス', 'Bosses')}</span><span>${r.bossCount}</span><span>${L('ミス', 'Misses')}</span><span>${st.deaths}</span><span>${L('時間', 'Time')}</span><span>${Math.floor(r.secs / 60)}:${String(r.secs % 60).padStart(2, '0')}</span></div>
  <p>${r.ranked ? L('オンラインランキングの対象です。', 'This score counts for the online ranking.') : L('アシストや練習・ほかのモードはオンラインランキングの対象外です。', 'Assisted runs and non-Arcade modes skip the online ranking.')}</p></div>
  ${btn('retry', L('もう一度', 'Again'), '', 'data-focus')}<div class="row2">${btn('watch', L('リプレイ', 'Replay'), 'sub')}${btn('title', L('タイトルへ', 'Title'), 'sub')}</div>`;
}
function showResult(r) { showOv('result', resultHtml(r)); }
function showReplays(msg) {
  const reps = readList(REPS_KEY);
  showOv('replays', `<h2 id="ovTitle">${L('リプレイ', 'Replays')}</h2><div class="scroll">
    ${reps.length ? `<table class="tbl"><tr><th>${L('モード', 'Mode')}</th><th></th><th>${L('スコア', 'Score')}</th></tr>${reps.map((x, i) => `<tr><td>${{ arcade: L('アーケード', 'Arcade'), practice: L('練習', 'Practice'), rush: L('ラッシュ', 'Rush'), daily: L('チャレンジ', 'Daily') }[x.m] || x.m} · ${esc(DIFFNAME(x.d))}</td><td><button class="opt" type="button" data-act="rplay:${i}" aria-label="${L('見る', 'Watch')}">▶</button><button class="opt" type="button" data-act="rcopy:${i}">${L('コピー', 'Copy')}</button></td><td>${fmt(x.s)}</td></tr>`).join('')}</table>` : `<p>${L('まだありません。遊ぶと自動で最近の5回が残ります。', 'Nothing yet. Your last 5 runs are kept automatically.')}</p>`}
    <div class="og"><div class="ol">${L('コードを読み込む', 'Import a code')}</div><textarea class="code" id="repCode" placeholder="PW1.…" aria-label="${L('リプレイコード', 'Replay code')}"></textarea><p class="err" id="repErr" role="alert">${msg || ''}</p></div></div>
    ${btn('rimport', L('コードから見る', 'Watch from code'), 'sub')}${btn('title', L('もどる', 'Back'), 'link')}`);
}
function showRecords() {
  const rk = readList(RANK_KEY), b = save.best;
  const row = (l, v) => `<span>${l}</span><span>${v ? fmt(v) : '-'}</span>`;
  showOv('records', `<h2 id="ovTitle">${L('きろく', 'Records')}</h2><div class="scroll">
   <div class="og"><div class="ol">${L('アーケード', 'Arcade')}</div><div class="kv">${D.DIFF.map((x, i) => row(esc(nm(x)), b.a[i])).join('')}</div></div>
   <div class="og"><div class="ol">${L('ボスラッシュ', 'Boss Rush')}</div><div class="kv">${D.DIFF.map((x, i) => row(esc(nm(x)), b.r[i])).join('')}</div></div>
   <div class="og"><div class="ol">${L('この端末のランキング', 'Ranking on this device')}</div>${rk.length ? `<table class="tbl">${rk.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(SHIPNAME(x.sh))} · ${esc(DIFFNAME(x.d))}${x.a ? ' · ' + L('アシスト', 'assist') : ''}${x.c ? ' · ' + L('コンティニュー', 'cont') + x.c : ''}</td><td>${fmt(x.s)}</td></tr>`).join('')}</table>` : `<p>${L('まだ記録がありません。', 'No scores yet.')}</p>`}</div>
   <p>${L('アーケードのベスト（アシストなし）は、みんなのオンラインランキングに送られます。', 'Your best Arcade score (no assists) is sent to the shared online ranking.')}</p></div>
   <a class="btn sub" href="../ranking/">${L('みんなのランキングへ', 'Online ranking')}</a>${btn('title', L('もどる', 'Back'), 'link')}`);
}
function showHowto(first) {
  showOv('howto', `<h2 id="ovTitle" class="howtoH">${L('あそびかた', 'How to play')}</h2><div class="scroll howto">
   <h3>${L('キーボード', 'Keyboard')}</h3><ul><li>${L('矢印キー か WASD：うごく', 'Arrow keys or WASD: move')}</li><li>${L('Z（おしっぱなし）：撃つ', 'Z (hold): shoot')}</li><li>${L('X：ボム　Shift：ゆっくり（当たり判定の芯が見える）', 'X: bomb · Shift: slow mode (shows your hitbox core)')}</li><li>${L('Esc か P：ポーズ', 'Esc or P: pause')}</li></ul>
   <h3>${L('タッチ・ゲームパッド', 'Touch & gamepad')}</h3><ul><li>${L('画面のどこでもなぞると、指と同じだけ動きます。弾は自動で出ます。', 'Drag anywhere: the ship moves by the same amount as your finger. Shooting is automatic.')}</li><li>${L('右下「ボム」、左下「ゆっくり」（タップで入／切）', 'Bottom right: Bomb. Bottom left: Slow (tap to toggle).')}</li><li>${L('ゲームパッド：スティック／十字、A 撃つ、B ボム、LB RB LT RT ゆっくり、Start ポーズ', 'Gamepad: stick / d-pad, A shoot, B bomb, bumpers or triggers slow, Start pause')}</li></ul>
   <h3>${L('ルール', 'Rules')}</h3><ul><li>${L('当たるのは、機体の真ん中の小さな芯だけ。機体が弾に触れても大丈夫です。', 'Only the tiny core at the heart of your ship can be hit. Touching bullets with the wings is fine.')}</li><li>${L('弾すれすれ（グレイズ）で点と連鎖。敵を続けて倒すと倍率が上がります（最大 x5）。', 'Skim bullets (graze) for points and chain time. Keep defeating enemies to raise the multiplier (up to x5).')}</li><li>${L('当たった直後のわずかな間なら、ボムで助かります。', 'A bomb pressed in the instant after a hit still saves you.')}</li><li>${L('アイテム：赤 P ぶき／青 S スピード／黄 O おとも／緑 H シールド／紫 B ボム', 'Items: red P weapon · blue S speed · yellow O option · green H shield · purple B bomb')}</li><li>${L('スコアが 20万・60万・150万…で残機が増えます。', 'Extra ships at 200k, 600k, 1.5M and more.')}</li></ul>
   <h3>${L('はじめての人へ', 'New to shooters?')}</h3><ul><li>${L('「やさしい」から。ゆっくり動く・端っこにいる・弾の間をぬう、の3つだけ。', 'Start on Easy. Stay near the left, move slowly, and weave between bullets.')}</li><li>${L('それでも大変なら、アシスト（スローモーション・オートボム）を使えます。', 'Still tough? Turn on assists (slow motion, auto-bomb).')}</li></ul></div>
   <div class="langrow"><label for="langSel">${L('言語 / Language', 'Language')}</label><span id="langPick"></span></div>${btn('howtoGo', first ? L('はじめる', 'Start') : L('とじる', 'Close'), '', 'data-focus')}`);
  const sel = KoboI18n.picker($('langPick')); if (sel) sel.id = 'langSel';
}

// ---------------------------------------------------------------- clicks
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, p = a.split(':'), k = p[0];
  if (A && k !== 'noop') A.sfx('tap');
  if (k === 'setup') showSetup(p[1]);
  else if (k === 'title') showTitle();
  else if (k === 'ship') { save.set.ship = +p[1]; writeSave(); showSetup(ovName.split(':')[1]); }
  else if (k === 'diff') { save.set.diff = +p[1]; writeSave(); showSetup(ovName.split(':')[1]); }
  else if (k === 'stage') { setupStage = +p[1]; showSetup('practice'); }
  else if (k === 'go') startFromSetup(p[1]);
  else if (k === 'howto') showHowto(false);
  else if (k === 'howtoGo') { store.set(HOWTO_KEY, '1'); showTitle(); }
  else if (k === 'replays') showReplays();
  else if (k === 'records') showRecords();
  else if (k === 'cont') { hideOv(); run.contNext = true; run.paused = false; run.overShown = false; acc = 0; }
  else if (k === 'end') { finish('over'); }
  else if (k === 'retry') { const o = Object.assign({}, run.result.opts); o.seed = o.mode === 'daily' ? o.seed : 1 + Math.floor(Math.random() * 2000000000); startRun(o); }
  else if (k === 'watch') { const c = run && run.result && run.result.code; if (c) openReplayCode(c); }
  else if (k === 'rplay') { const x = readList(REPS_KEY)[+p[1]]; if (x) openReplayCode(x.code); }
  else if (k === 'rcopy') { const x = readList(REPS_KEY)[+p[1]]; if (x) { try { navigator.clipboard.writeText(x.code); } catch (er) {} toast(L('コピーしました', 'Copied')); const ta = $('repCode'); if (ta) { ta.value = x.code; ta.select(); } } }
  else if (k === 'rimport') { const v = ($('repCode').value || '').trim(); if (!openReplayCode(v)) $('repErr').textContent = L('このコードは読み込めません。', 'That code could not be read.'); }
});
document.addEventListener('change', e => {
  const c = e.target.closest('input[data-as]'); if (!c) return;
  const bit = +c.dataset.as; if (bit === 8) save.set.core = c.checked ? 1 : 0; else save.set.assist = c.checked ? (save.set.assist | bit) : (save.set.assist & ~bit);
  writeSave();
});
$('menuBtn').addEventListener('click', () => { if (run && run.kind === 'live' && !run.finished) openPause(); else if (run && run.kind === 'replay') closeReplay(); else showTitle(); });
function renderSound() { const b = $('sndBtn'); if (!A) { b.hidden = true; return; } const m = A.muted; b.setAttribute('aria-pressed', String(!m)); b.setAttribute('aria-label', T(m ? 'サウンド オフ' : 'サウンド オン')); b.innerHTML = m ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'; }
$('sndBtn').addEventListener('click', () => { if (!A) return; A.toggleMute(); if (!A.muted) A.sfx('ok'); });
if (A) A.onChange(renderSound);

// ---------------------------------------------------------------- pause
let pm = null;
function openPause() {
  if (!run || run.kind !== 'live' || run.finished || run.paused) return;
  if (pm && pm.isOpen) return;
  run.paused = true; keys.clear(); tp = null;
  if (!UI) { showTitle(); return; }
  pm = UI.pauseMenu({
    title: T('ひとやすみ'), home: '../', onSettings: false, confirmRestart: false,
    extra: [{ label: L('あそびかた', 'How to play'), icon: 'help', onClick: () => { toast(L('ルールはタイトルの「あそびかた」から', 'Rules are under How to play on the title screen')); } },
      { label: L('ここまででおわる（記録する）', 'End run (keep score)'), icon: 'menu', onClick: () => { pm.close(); if (run) { KG() && KG().menuClosed(); finish('quit'); } } }],
    onResume: () => { if (run) { run.paused = false; acc = 0; } const g = KG(); if (g) g.menuClosed(); try { cv.focus({ preventScroll: true }); } catch (e) {} },
    onRestart: () => { const o = Object.assign({}, run.opts); o.seed = o.mode === 'daily' ? o.seed : 1 + Math.floor(Math.random() * 2000000000); const g = KG(); if (g) g.menuClosed(); startRun(o); },
    onOpen: () => { const g = KG(); if (g) g.menuOpened(); },
  });
  pm.open();
}

// ---------------------------------------------------------------- replay viewer
function openReplayCode(code) {
  let rec; try { rec = E.replay.decode(code); } catch (e) { return false; }
  hideOv(); if (pm && pm.isOpen) pm.close(); demo = null;
  S = E.newGame(E.replay.optsOf(rec)); ART.reset(); acc = 0;
  run = { kind: 'replay', rec, inputs: E.replay.unrle(rec.runs), paused: false, speed: 1, ended: false };
  document.body.classList.add('playing'); $('rp').hidden = false; $('rpRange').max = run.inputs.length; $('rpRange').value = 0; $('rpPlay').textContent = '❚❚'; $('rpSpeed').textContent = 'x1'; fit();
  return true;
}
function closeReplay() { $('rp').hidden = true; endLive(); showTitle(); }
function toggleRp() { if (!run || run.kind !== 'replay') return; if (run.ended && S.frame >= run.inputs.length) seekTo(0); run.paused = !run.paused; run.ended = false; $('rpPlay').textContent = run.paused ? '▶' : '❚❚'; }
function seekTo(f) {
  f = clamp(f | 0, 0, run.inputs.length);
  if (f < S.frame || !S) { S = E.newGame(E.replay.optsOf(run.rec)); ART.reset(); }
  while (S.frame < f && S.phase !== 'done') { E.step(S, run.inputs[S.frame]); S.ev.length = 0; }
  run.ended = false;
}
function updateRp() { const r = $('rpRange'); if (document.activeElement !== r) r.value = S.frame; $('rpInfo').textContent = Math.floor(S.frame / 60) + 's / ' + Math.floor(run.inputs.length / 60) + 's'; }
$('rpPlay').addEventListener('click', toggleRp);
$('rpRange').addEventListener('input', e => { if (run && run.kind === 'replay') { seekTo(+e.target.value); } });
$('rpSpeed').addEventListener('click', () => { if (!run) return; run.speed = run.speed === 1 ? 2 : run.speed === 2 ? 4 : 1; $('rpSpeed').textContent = 'x' + run.speed; });
$('rpDone').addEventListener('click', closeReplay);

// ---------------------------------------------------------------- boot
function themeColor() { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--kb-bg').trim() || '#1d2a35'; }
window.addEventListener('resize', () => setTimeout(fit, 30)); if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('stage'));
if (UI && UI.theme) UI.theme.onChange(() => setTimeout(themeColor, 0));
renderSound(); themeColor(); fit();
KG() && KG().register({
  id: GAME,
  pause() { if (run && run.kind === 'live' && !run.paused && !run.finished) openPause(); },
  resume() {},
  save() { writeSave(); },
  isIdle: () => !(run && run.kind === 'live' && !run.finished),
  dispose() { cancelAnimationFrame(raf); },
  daily: { start({ dateKey }) { startDaily(dateKey); } },
});
{
  const first = store.get(HOWTO_KEY) == null && !save.tut, launch = PF && PF.launch ? PF.launch() : { daily: null };
  startDemo();
  if (launch && launch.daily && !first) { /* KoboGame.register starts the daily run */ }
  else if (first) { save.tut = 1; writeSave(); showHowto(true); } else showTitle();
}
raf = requestAnimationFrame(frame);

// ---------------------------------------------------------------- test hooks (?debug)
if (DEBUG) {
  const state = () => ({
    ready: true, screen: ovName || (run ? run.kind : 'none'), ov: ovOpen(), playing: !!(run && run.kind === 'live' && !run.paused), paused: !!(run && run.paused), kind: run ? run.kind : '', mode: S ? S.mode : '', frame: S ? S.frame : 0,
    score: S ? S.score : 0, lives: S ? S.lives : 0, bombs: S ? S.bombs : 0, shield: S ? S.shield : 0, power: S ? S.power : 0, opt: S ? S.opt : 0, spd: S ? S.spd : 0, chain: S ? S.chain : 0,
    stage: S ? S.stage : -1, phase: S ? S.phase : '', over: !!(S && S.over), boss: !!(S && S.boss), conts: S ? S.conts : 0, ship: S ? S.ship : 0, diff: S ? S.di : 0, assist: S ? S.assist : 0,
    bullets: S ? E.count(S.bul) : 0, enemies: S ? E.count(S.ene) : 0, px: S ? S.p.x : 0, py: S ? S.p.y : 0, inv: S ? S.p.inv : 0, dying: S ? S.p.dying : 0, graze: S ? S.st.graze : 0, kills: S ? S.st.kills : 0,
    inputs: run && run.inputs ? run.inputs.length : 0, by: S && S.boss ? S.boss.y : -1, bhp: S && S.boss ? S.boss.hp : -1, bp: S && S.boss ? S.boss.bp : -1, bomb: S ? S.bomb.t : 0, last: run && run.inputs ? run.inputs.slice(-6) : [], result: !!(run && run.result), hash: S ? E.hash(S) : 0, save: JSON.parse(JSON.stringify(save)), touch: touchMode, K, low: lowStage, replay: !!(run && run.kind === 'replay'), rpFrames: run && run.inputs && run.kind === 'replay' ? run.inputs.length : 0, rpEnded: !!(run && run.ended), speed: run ? run.speed || 1 : 1,
  });
  window.__kb = Object.assign(window.__kb || {}, { ready: () => true, state });
  window.__shmup = {
    E, ART, D, state, get S() { return S; }, get run() { return run; }, get save() { return save; },
    start(o) { startRun(newOpts(o.mode || 'arcade', o)); }, showTitle, showSetup, showHowto, showRecords, showReplays,
    skip() { if (!S || !run) return; S.si = S.script.length; S.sf = Math.max(S.sf, D.STAGES[S.stage].len + 1); for (const e of S.ene) e.a = 0; run.dbgBoss = true; },
    god(n) { if (S) { S.lives = n || 9; } }, hurt() { if (S) E.addBullet(S, S.p.x, S.p.y, 0, 0, 0, 0); },
    stress(n) { if (!S) return; for (let i = 0; i < (n || 500); i++) { const a = i * 0.37; E.addBullet(S, 300 + (i % 20) * 8, 20 + (i * 7) % 230, -0.6 - (i % 5) * 0.1, Math.sin(a) * 0.3, i % 3, i % 4); } },
    stepN(n, inp) { for (let i = 0; i < n; i++) { E.step(S, inp | 0); if (run && run.inputs) run.inputs.push((inp | 0) & 255); S.ev.length = 0; } },
    fit, resetSave() { store.del(SAVE_KEY); store.del(RANK_KEY); store.del(REPS_KEY); save = readSave(); },
    finish, openReplayCode, openPause, startDaily,
    thumbScene() {
      store.set(HOWTO_KEY, '1'); document.body.classList.add('thumb'); view.hud = true; hideOv(); demo = null;
      S = E.newGame({ mode: 'practice', diff: 1, ship: 0, seed: 7, stage: 0 }); S.power = 3; S.opt = 2; S.spd = 1; run = { kind: 'thumb', paused: true, inputs: [] };
      const bot = BOT.make(); for (let i = 0; i < 900; i++) { E.step(S, bot(S)); S.ev.length = 0; }
      S.p.inv = 0; view.showCore = false; fit(); acc = 0; ART.draw(cx, S, view, T);
    },
  };
}
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
